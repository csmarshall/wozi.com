name: deploy

# Publishes the site to s3://wozi.com and invalidates CloudFront.
#
# Three things about this deploy are deliberate and easy to get wrong later:
#
#   1. It publishes an explicit WHITELIST of paths. Adding a file to the repo
#      does not put it on the web — it has to be named here too. That is what
#      keeps legacy/ and every .md in the repo off a public site.
#
#   2. It does not pass --delete. Removing a file from the web is a deliberate
#      manual step, because the downside is asymmetric: a bad sync with --delete
#      empties the live site, while a stale object is merely untidy. Bucket
#      versioning is on, so a manual delete is recoverable for 90 days.
#
#   3. WHAT IT PUBLISHES IS NOT WHAT IS IN THE REPO, for the two HTML pages.
#      index.html and fidget/index.html are ~two thirds comment — the argument
#      for every derived constant, every rejected alternative, every issue
#      number — and that prose is the project's documentation, not something a
#      visitor who wanted to look at some gears has to download. So the deploy
#      strips it: 603KB → 189KB on the landing page, 173KB → 45KB brotli.
#
#      A transform between the repo and the bucket means the reviewed file and
#      the served file are two different files, and until this existed every
#      gate here measured the first one. THE FIX IS THE ORDER OF THE STEPS, not
#      a second set of checks: tools/strip_comments.py runs over this checkout
#      IN PLACE, before any gate and before any credential, so the geometry
#      suite, the device profiles, the motion, DOM and escape-mesh gates all
#      measure THE ARTIFACT without knowing that anything was stripped. Then
#      tools/pixel_regress.py --ref HEAD compares the two directly: working
#      tree is the artifact, HEAD is the source, and the transform is allowed
#      to change every byte so long as it changes no pixel.
#
#      keybase.html is NOT stripped and must never be — its body is covered by
#      a signature, so it is served byte-exact or the ownership proof stops
#      verifying. robots.txt is asserted byte-identical to the repo copy for
#      the same class of reason. Both are copied straight from the checkout.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'legacy/**'
      - '.gitignore'
  # Gate the BRANCH, not just the bucket (#52). Until this existed the suite,
  # the layout gate and the motion gate ran only after a merge had already
  # landed on main -- so every merge was verified after the fact, which for a
  # repo that routinely merges several agent branches one at a time is the
  # wrong end. The verification steps below all run BEFORE any credential is
  # assumed, so the pull_request path needs no OIDC role and a fork cannot
  # assume one; the deploy half is guarded on the event instead.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race each other onto the same bucket.
#
# cancel-in-progress: false IS DELIBERATE AND MUST STAY FALSE (GitHub #174). A
# deploy half-way through publishing objects must not be killed by the next push,
# or the bucket ends up carrying a mix of two commits — and this workflow does not
# pass --delete, so there is no one atomic step that would put that right again.
#
# The cost of that choice is that a run which never ENDS blocks every run behind
# it: one hung gate held this group for 93 minutes, two later pushes sat
# `pending`, and the live site silently stayed on an older commit while the repo
# looked deployed. FLIPPING THIS TO TRUE IS NOT THE FIX and would trade a stale
# bucket for a mixed one. The fix is that a hang must END — the timeout-minutes
# below, and the per-CDP-call deadline in tools/fontpin.py and
# tools/pixel_regress.py that is what actually stopped that run being possible.
concurrency:
  group: deploy-wozi-com
  cancel-in-progress: false

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

env:
  BUCKET: s3://wozi.com
  DISTRIBUTION: E3VOOVXS0KK0E5

jobs:
  deploy:
    runs-on: ubuntu-latest
    # THE BACKSTOP, AND ONLY THE BACKSTOP (GitHub #174). Until this existed there
    # was no timeout-minutes anywhere in this file, so GitHub's 360-MINUTE DEFAULT
    # applied: a gate that stopped answering held the runner for six hours and, via
    # the concurrency group above, held every deploy behind it.
    #
    # 45, and the margin is deliberately generous because A TIMEOUT THAT TRIPS ON A
    # SLOW-BUT-HEALTHY RUN IS WORSE THAN NONE — it goes red for a reason that has
    # nothing to do with the page, which is the red that trains everyone to ignore a
    # workflow. Measured on a laptop, serially, one gate at a time: node
    # tools/test.js 7.6s; the browser-gate step 3m43 (devices 2m40, verify_motion
    # 4.8s, pill_clip 18.8s, dom_invariants 1.3 + 1.3 + 1.3s, escape_mesh 37.0s);
    # the five-run pixel battery 1m03 (14.6 / 14.1 / 8.6 / 14.8 / 11.0s). Call the
    # gate half five minutes locally and note the one figure with a CI number beside
    # it — devices.py is 3m38 there against 2m40 here, so this runner is about 1.4x
    # a laptop rather than the order of magnitude it is tempting to assume. On top of
    # the gates, the publish half carries a CloudFront invalidation whose own waiter
    # runs to 10 minutes, which is why 45 rather than the 30 GitHub #174 suggested:
    # ~15 minutes healthy, and a 3x margin on the slowest part being somebody else's
    # infrastructure.
    #
    # THE PER-STEP BOUNDS BELOW ARE THE PART THAT EARNS ITS KEEP, not this one. A
    # job-level timeout says "the job timed out" and cancels the remaining steps,
    # including the `if: always()` summary; a step-level timeout NAMES THE GATE that
    # hung, which is the whole diagnostic value — the hang that motivated this was
    # on one specific step and the log said nothing at all about which.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      # The geometry suite runs BEFORE any credential is assumed, so a broken
      # gear set cannot reach the bucket. It reads its constants straight out of
      # index.html rather than keeping copies, which is the only way a test of
      # this page can be honest: change BAND_DEPTH or a tooth floor and gear sets
      # nothing has measured become reachable, and this is what catches that.
      - name: Verify the geometry before anything else
        # 7.6s on a laptop and no browser in it, so anything past a minute is a
        # wedged Node rather than a slow suite.
        timeout-minutes: 5
        run: node tools/test.js

      # BUILD WHAT SHIPS, AND DO IT HERE — before Chrome, before the credential,
      # before every gate below. From this step on, this checkout is the artifact
      # and not the source, which is what lets every harness after it measure the
      # delivered file while still being pointed at "the repo".
      #
      # --in-place refuses on a file that differs from HEAD, so it cannot destroy
      # uncommitted documentation on somebody's laptop; a CI checkout is clean by
      # construction, so it always proceeds here.
      #
      # --sha pins every backlink in the stripped output to THIS commit. The
      # markers are the file's only remaining route back to the prose — a compact
      # /*L1234*/ where each comment was, and one URL in the banner they all hang
      # off — and blob/main/… would rot the moment anything above a marked line
      # moved. Brotli is installed only so the log carries the wire figure rather
      # than a gzip figure nothing serves.
      #
      # keybase.html is absent from this loop on purpose: see the header.
      - name: Build what actually ships
        # A pip install off PyPI plus two passes of a text transform. The install is
        # the only part that can hang, and it is non-fatal by design (see below), so
        # a stalled index must not become a six-hour runner.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          unset TMOUT
          # Brotli buys the LOG a wire figure instead of a gzip one and nothing
          # else, so its absence must not block a deploy: the tool prints "not
          # measured" and carries on. Contrast the pixel step below, where Pillow
          # and numpy are the gate itself and are deliberately fatal.
          python3 -m pip install --quiet --disable-pip-version-check Brotli \
            || echo "note: Brotli unavailable — sizes will be reported as gzip only"
          python3 tools/strip_comments.py --selftest
          for f in index.html fidget/index.html; do
            python3 tools/strip_comments.py --in-place --sha "${{ github.sha }}" "$f"
          done

      # The same suite again, against the stripped file this time. It reads its
      # constants, the two-row menu and the sizing functions out of index.html, so
      # it is the one gate that can answer whether the STRIPPER left the geometry
      # legible to the tools that parse the page as text — a bracket eaten out of
      # a menu literal would still render and would still draw the same pixels.
      # Cheap enough (no browser) that running it twice costs nothing worth
      # saving, and the two runs answer different questions.
      - name: Verify the geometry against what ships
        timeout-minutes: 5
        run: node tools/test.js

      # The train being wonky breaks the whole illusion of the page, so the
      # layout is gated too, not just the gear maths. tools/devices.py drives
      # headless Chrome at nine real device profiles in both orientations --
      # with browser chrome subtracted, which is the part that matters: measuring
      # against a device's NOMINAL height is a viewport no real browser hands
      # you, and it is exactly why an earlier version of this harness passed a
      # layout that was visibly broken on Charles's iPhone.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        # A download off somebody else's CDN, which is exactly the class of step
        # that stalls without failing.
        timeout-minutes: 10
        with:
          chrome-version: stable

      # EVERYTHING IN THIS STEP NOW MEASURES THE STRIPPED FILE. It serves the
      # checkout, and the build step above replaced the two HTML pages in it, so
      # not a line here had to change to start gating the artifact — which is the
      # point: a harness that had to be told about stripping would be a harness
      # that could be told the wrong thing.
      # PORT 8765 IS FIXED HERE AND THAT IS ONLY SAFE ON A RUNNER. A CI job gets a
      # clean machine, so a hardcoded port cannot collide; a laptop does not. Run
      # these commands by hand while anything else is already serving 8765 —
      # another agent's tree, a harness from an hour ago — and `python3 -m
      # http.server 8765` fails with EADDRINUSE while every gate below happily
      # measures WHATEVER IS ALREADY THERE and reports PASS on somebody else's
      # index.html. It cost real time once. `tools/pixel_regress.py` picks a free
      # port for exactly this reason (#42).
      #
      # Deliberately not changed: in CI the fixed port is fine, and it is what the
      # step's own URLs are written against. Locally, serve on a port of your own
      # and pass that URL instead — and check the body you get back is the tree you
      # meant, which after the build step above means checking for the banner.
      - name: Verify the layout on real device profiles
        # SEVEN BROWSER GATES IN ONE STEP, so the bound has to cover the slowest of
        # them plus six others. devices.py is the long pole: 3m38 in CI against 2m40
        # measured here over three consecutive runs (158.0 / 158.2 / 161.8s). The
        # rest, locally: verify_motion 4.8s, pill_clip 18.8s, dom_invariants 1.3 +
        # 1.3 + 1.3s, escape_mesh 37.0s — 3m43 for the whole step. Apply devices.py's
        # own 1.4x CI factor to all seven and it is a little over five minutes, so 20
        # is roughly a 4x margin.
        #
        # Every one of these attaches through tools/fontpin.py, so each now carries
        # a 90s per-CDP-call deadline of its own (GitHub #174) and should report
        # exit 2 long before this fires. This is here for the failure that is not a
        # CDP call at all — a python3 -m http.server that never binds, a Chrome
        # that never starts.
        timeout-minutes: 20
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          python3 -m pip install --quiet --disable-pip-version-check websockets
          python3 -m http.server 8765 --bind 127.0.0.1 &
          SERVER=$!
          # wait for it rather than sleeping blind
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:8765/index.html; then break; fi
            sleep 0.25
          done
          set +e
          python3 tools/devices.py http://127.0.0.1:8765/ ; LAYOUT=$?
          python3 tools/verify_motion.py http://127.0.0.1:8765/ ; MOTION=$?
          # Type, which no other gate looks at: the hover pill's label sets
          # overflow:hidden to animate open, so a line box shorter than the ink
          # does not overflow, it CLIPS. That shipped once and was caught by eye.
          python3 tools/pill_clip.py http://127.0.0.1:8765/ ; PILL=$?
          # Structure, which sits in the gap between the two gates above it.
          # node tools/test.js proves the gear MATHS meshes, in Node, with no
          # browser; the pixel gate proves the page draws the same picture as a
          # ref. Nothing asserted that what solve() computed is what the DOM
          # actually contains -- a wheel rendered with the wrong tooth count, an
          # empty <svg>, a missing engraving or a fill gone black would leave the
          # maths untouched. No images and no baselines here, so it behaves the
          # same on this runner as it does on a laptop.
          #
          # BOTH SCOPES, because they are different code paths: 127.0.0.1 is a
          # STAGE_HOSTS name so the bare URL is the combined stage -- bridges,
          # idlers, a datum -- and ?who=charles is one chain with none of them.
          python3 tools/dom_invariants.py http://127.0.0.1:8765/ ; DOM=$?
          python3 tools/dom_invariants.py http://127.0.0.1:8765/ --query '?who=charles' ; DOM1=$?
          # AND ONCE IN LIGHT, because check 4 (the ink census) is the one check
          # here whose SUBJECT changes with the theme, and it claims to catch "a
          # theme's palette leaking into the other theme's render" — a claim it
          # cannot substantiate while it only ever renders one (GitHub #157).
          # Measured, not assumed: at the same seed the combined stage censuses 64
          # inks in light against 56 in dark, with different saturation and value
          # extremes, so eight of the page's inks had never been censused at all.
          #
          # AND THE LIGHT PIXEL RUN BELOW DOES NOT SUBSUME IT. That run is
          # DIFFERENTIAL — working tree against a ref — so a light-only fault
          # present in both is 0px there and always will be. This one is ABSOLUTE:
          # it asserts every ink is a tone of its own wheel's base, with no ref and
          # no baseline. Combined stage only, because it is a superset: 10 wheels
          # against the solo scope's, and the theme changes the palette rather than
          # the composition. ~1.3s.
          python3 tools/dom_invariants.py http://127.0.0.1:8765/ --theme light ; DOMLIGHT=$?
          # dom_invariants' own mesh check deliberately exempts escape-run
          # ghosts (GitHub #117) -- they live one DOM level deeper than its
          # element test requires, and there are far more of them than linked
          # wheels (200+ on a wide viewport). Nothing had ever checked whether
          # a ghost actually meshes with what it grew from until this existed.
          python3 tools/escape_mesh.py http://127.0.0.1:8765/ ; ESCMESH=$?
          set -e
          kill $SERVER 2>/dev/null || true
          if [ $LAYOUT -ne 0 ] || [ $MOTION -ne 0 ] || [ $PILL -ne 0 ] \
             || [ $DOM -ne 0 ] || [ $DOM1 -ne 0 ] || [ $DOMLIGHT -ne 0 ] \
             || [ $ESCMESH -ne 0 ]; then
            echo "::error::layout, motion, pill, DOM-invariant (dark $DOM, solo $DOM1, light $DOMLIGHT) or escape-mesh gate failed — not deploying"
            exit 1
          fi

      # THE GATE THE STRIPPER RESTS ON. Working tree is the artifact, HEAD is the
      # source, so this is the only check that can state the whole claim: the
      # transform may change every byte in the file and must change no pixel of
      # the drawing. Anything the stripper ate that the parser did not miss —
      # a swallowed expression, a regex read as division, a template literal cut
      # short — comes out here as a delta, and 0 is the only passing answer.
      #
      # FIVE RUNS, because they are five different code paths and the first one
      # alone would agree with a fault in the other four. 127.0.0.1 is a
      # STAGE_HOSTS name so the bare URL is the combined stage — bridges, idlers,
      # a datum; ?who=charles is one chain with none of that; /fidget/ is a
      # separate page with its own physics loop that goes through the same
      # stripper and has no other harness of its own; --panel opens the pop-out
      # the other four cannot see into; --theme light renders the palette no other
      # gate in this workflow has ever rendered (GitHub #157).
      #
      # Pillow and numpy are not optional here. Without them the tool used to
      # print "cannot diff" and exit 0 — the strongest gate in the tree passing by
      # not running — which is why it now exits 2 instead, and why they are
      # installed rather than hoped for.
      - name: The artifact must draw the same page as the source
        # THIS IS THE STEP THAT HUNG (GitHub #174). Run 31639824875 sat here for 93
        # minutes and the log said nothing, because there was no bound at any level
        # and nothing in the harness had a deadline either: pixel_regress's `send`
        # waited on a 30s socket read inside `while not fut.done()`, which retries
        # forever. That is fixed in the tool — CDP_TIMEOUT_S, 90s per call, exit 2 —
        # and this is the bound that catches whatever the next version of that
        # mistake turns out to be.
        #
        # 25 against 1m03 measured locally for all five runs (14.6s stage, 14.1s
        # solo, 8.6s fidget, 14.8s panel, 11.0s light) — and each of those is five
        # browser launches deep already, because every tree is photographed until it
        # agrees with itself. That is a wide margin on purpose: this is the step that
        # actually hung, the harness deadline below it should always fire first with
        # a sentence, and the cost of over-provisioning a bound whose healthy case is
        # a minute is nothing at all.
        timeout-minutes: 25
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          unset TMOUT
          python3 -m pip install --quiet --disable-pip-version-check \
            websockets Pillow numpy
          set +e
          python3 tools/pixel_regress.py --ref HEAD ; STAGE=$?
          python3 tools/pixel_regress.py --ref HEAD --query '?who=charles' ; SOLO=$?
          python3 tools/pixel_regress.py --ref HEAD --path fidget/ ; FIDGET=$?
          # The pop-out panel is display:none until clicked, so the three runs above
          # photograph none of it -- five controls were rewritten in CL#169 and this
          # gate reported 0px (GitHub #144). --panel clicks it open first. Proven to
          # be able to fail rather than assumed: mutation_gate carries the SAME
          # one-pixel edit twice, caught here (132px) and surviving in the shut runs
          # (0px), which measures the coverage instead of claiming it.
          python3 tools/pixel_regress.py --ref HEAD --panel ; PANEL=$?
          # LIGHT, because every other themed gate in this workflow runs at its
          # own `--theme dark` default and light is where this project's real
          # faults have been (GitHub #157): CL#133 removed the wheel shadow in
          # light ONLY, because the shared shadow layer showed through the cuts,
          # and CL#173 fixed five serious contrast failures in light ONLY, two of
          # them a regression from CL#169 one commit earlier. Twelve gate
          # invocations and not one of them had ever rendered the palette half the
          # page is painted in.
          #
          # The COMBINED STAGE in light rather than a fifth axis crossed with the
          # other three: light vs dark changes the palette, not the composition,
          # so the marginal question is "does the light palette still draw the
          # same" and the widest render is where a light-only path is most likely
          # to appear at all. ~15s locally, one more browser launch.
          python3 tools/pixel_regress.py --ref HEAD --theme light ; LIGHT=$?
          set -e
          if [ $STAGE -ne 0 ] || [ $SOLO -ne 0 ] || [ $FIDGET -ne 0 ] || [ $PANEL -ne 0 ] \
             || [ $LIGHT -ne 0 ]; then
            echo "::error::the stripped page does not draw the same as the source (stage $STAGE, solo $SOLO, fidget $FIDGET, panel $PANEL, light $LIGHT) — not deploying"
            exit 1
          fi

      - name: Assume the deploy role via OIDC
        if: github.event_name != 'pull_request'
        # One STS call. If it has not answered in five minutes it is not going to.
        timeout-minutes: 5
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::464480389332:role/wozi-com-deploy
          role-session-name: gha-wozi-deploy-${{ github.run_id }}
          aws-region: us-east-1

      # Content types are set explicitly for everything that browsers get wrong
      # or that has no useful extension. The .svg case is the one that bites:
      # served as anything but image/svg+xml, loadIcons() still fetches them,
      # the .catch swallows the failure, and every hub badge renders empty with
      # no console error at all.

      - name: Publish HTML
        if: github.event_name != 'pull_request'
        # Three aws s3 cp calls. The AWS CLI has its own retries, so the
        # failure this bounds is a transfer that stalls rather than errors.
        timeout-minutes: 10
        run: |
          # Two of these three are the STRIPPED artifacts by now and the third is
          # the repo file untouched — see the header. The loop does not know the
          # difference and must not: what decides whether a file is transformed is
          # the build step's own list, in one place, and keybase.html's absence
          # from it is the only thing keeping its signature valid.
          for f in index.html keybase.html fidget/index.html; do
            aws s3 cp "$f" "$BUCKET/$f" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "public, max-age=300" \
              --only-show-errors
            echo "  $f"
          done

      - name: Publish the runtime
        if: github.event_name != 'pull_request'
        timeout-minutes: 10
        run: |
          # config.js carries the link table, the people and the palette, and
          # index.html reads it at load. If it is missing the page still renders
          # a turning machine -- with NO LINKS -- and only says so in the
          # console, so a forgotten publish here is close to invisible. The
          # live-site check below asserts it is served and parses.
          for f in support.js config.js; do
            aws s3 cp "$f" "$BUCKET/$f" \
              --content-type "text/javascript; charset=utf-8" \
              --cache-control "public, max-age=300" \
              --only-show-errors
            echo "  $f"
          done

      - name: Publish hub icons
        if: github.event_name != 'pull_request'
        timeout-minutes: 10
        run: |
          aws s3 sync assets/ "$BUCKET/assets/" \
            --content-type "image/svg+xml" \
            --cache-control "public, max-age=86400" \
            --exclude "*" --include "*.svg" \
            --only-show-errors
          aws s3 ls "$BUCKET/assets/icons/" | awk '{print "  assets/icons/" $4}'

      - name: Publish the SSH public key
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        run: |
          # No extension, so without an explicit type browsers download it
          # instead of showing it.
          aws s3 cp ssh_public_key "$BUCKET/ssh_public_key" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=300" --only-show-errors
          echo "  ssh_public_key"

      - name: Publish the favicon
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        run: |
          # Every browser requests this unconditionally before ever honouring
          # a <link rel="icon"> (GitHub #119) -- it 403'd for the whole life
          # of the site otherwise, the same shape as #74's robots.txt fault.
          aws s3 cp favicon.ico "$BUCKET/favicon.ico" \
            --content-type "image/x-icon" \
            --cache-control "public, max-age=86400" --only-show-errors
          echo "  favicon.ico"

      - name: Publish the crawl policy
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        run: |
          # Before this existed, https://wozi.com/robots.txt returned the raw S3
          # AccessDenied XML at 403 (#74) -- and a 403 is not a policy. Most
          # crawlers read an unreachable robots.txt as "nothing stated" and
          # proceed, so the site was being indexed on a default nobody had
          # chosen either way.
          #
          # The explicit charset matters for the same reason it does on
          # ssh_public_key: a bare text/plain is guessed, and this file is the
          # one object on the site whose only consumer is a third-party parser.
          #
          # max-age matches the other mutable objects rather than the 86400 the
          # assets get. A crawl policy is the kind of thing that gets changed
          # under time pressure -- deciding to de-index something is not a
          # decision you want stuck behind a day of edge cache, and the major
          # crawlers refetch robots.txt about daily regardless, so a longer TTL
          # would buy nothing.
          aws s3 cp robots.txt "$BUCKET/robots.txt" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=300" --only-show-errors
          echo "  robots.txt"

      - name: Invalidate CloudFront
        if: github.event_name != 'pull_request'
        # `aws cloudfront wait invalidation-completed` polls on its own waiter (20s x
        # 30 attempts = 10 minutes) and an invalidation genuinely can take several,
        # so this is the one publish step whose HEALTHY case is minutes long.
        timeout-minutes: 20
        id: invalidate
        run: |
          # Mandatory, not optional. The distribution's default TTL is 86400,
          # so without this a deploy is invisible for up to a day.
          ID=$(aws cloudfront create-invalidation \
                 --distribution-id "$DISTRIBUTION" --paths "/*" \
                 --query 'Invalidation.Id' --output text)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "invalidation $ID"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION" --id "$ID"
          echo "invalidation complete"

      - name: Verify the deploy is actually live
        if: github.event_name != 'pull_request'
        # EVERY assertion in here retries 6 times with a 10s backoff and a 20s curl
        # cap, and there are about twenty of them — so a wholly broken deploy could
        # sit in this loop for the better part of an hour before printing its verdict.
        # A healthy run is seconds. 15 minutes is well above the second and well
        # below the first, and the retries are what make the failing case slow rather
        # than anything about the site.
        timeout-minutes: 15
        run: |
          set -o pipefail
          fail=0

          # Each assertion retries. A completed invalidation does not guarantee
          # every edge has already purged, so a single-shot check immediately
          # after one is inherently racy — it fails on a deploy that is fine.
          ATTEMPTS=6
          BACKOFF=10

          # Substring tests use bash pattern matching, NOT `... | grep -q`.
          # grep -q exits on first match and closes the pipe; on a body larger
          # than the 64K pipe buffer the writer then dies with EPIPE, and
          # `set -o pipefail` reports that as the pipeline's status. A
          # successful match on a large page reads as a failure. index.html is
          # 57K and matches on line 6, which is exactly that case.
          contains() { case "$2" in *"$1"*) return 0 ;; *) return 1 ;; esac; }

          check() { # check <url> <expected-status> <expected-substring>
            local code body
            for i in $(seq 1 $ATTEMPTS); do
              body=$(curl -sS --max-time 20 -w '\n%{http_code}' "$1" || true)
              code=${body##*$'\n'}
              if [ "$code" = "$2" ] && { [ -z "$3" ] || contains "$3" "$body"; }; then
                echo "  ok   $1 -> $code${3:+ (contains '$3')}"
                return 0
              fi
              [ "$i" -lt "$ATTEMPTS" ] && sleep $BACKOFF
            done
            echo "  FAIL $1 -> last status $code, wanted $2${3:+ containing '$3'} (gave up after $ATTEMPTS tries)"
            echo "  ---- diagnostics for $1 ----"
            curl -sSI --max-time 20 "$1" | tr -d '\r' | sed 's/^/    /'
            echo "    bytes received: ${#body}"
            echo "    first 300 bytes:"
            printf '    | %s\n' "${body:0:300}"
            echo "  ---- end diagnostics ----"
            fail=1
          }

          check_content_type() { # check_content_type <url> <expected>
            local ct
            for i in $(seq 1 $ATTEMPTS); do
              ct=$(curl -sSI --max-time 20 "$1" | tr -d '\r' \
                   | awk -F': ' 'tolower($1)=="content-type"{print $2}')
              if [ "$ct" = "$2" ]; then echo "  ok   $1 is $ct"; return 0; fi
              [ "$i" -lt "$ATTEMPTS" ] && sleep $BACKOFF
            done
            echo "  FAIL $1 is '$ct', wanted '$2'"
            fail=1
          }

          # check_redirect <url> <expected-status> <expected-location>
          # Two assertions a plain status check would miss: the redirect goes
          # to the RIGHT place (a 301 to the wrong URL passes a status-only
          # check), and it takes ONE hop, not a chain -- -I follows no
          # redirects, so this reads the Location the origin actually sent.
          check_redirect() {
            local code loc
            for i in $(seq 1 $ATTEMPTS); do
              loc=$(curl -sSI --max-time 20 "$1" | tr -d '\r')
              code=$(printf '%s\n' "$loc" | awk 'NR==1{print $2}')
              loc=$(printf '%s\n' "$loc" | awk -F': ' 'tolower($1)=="location"{print $2}')
              if [ "$code" = "$2" ] && [ "$loc" = "$3" ]; then
                echo "  ok   $1 -> $code -> $loc"
                return 0
              fi
              [ "$i" -lt "$ATTEMPTS" ] && sleep $BACKOFF
            done
            echo "  FAIL $1 -> $code -> '$loc', wanted $2 -> '$3'"
            fail=1
          }

          check https://wozi.com/ 200 'support.js'
          check https://wozi.com/support.js 200 ''
          # THE DELIVERED PAGE MUST BE THIS COMMIT'S ARTIFACT, and one substring
          # settles all three ways that can be false. The stripper's banner carries
          # a source URL pinned to the commit it was built from, so a body
          # containing `blob/<this sha>/index.html` cannot be the raw source (no
          # banner at all), cannot be a stale object from an earlier deploy (a
          # different sha), and cannot be a page whose backlinks point somewhere
          # other than the code that drew it. It also proves the markers survived
          # the trip, which is the only thing standing between a visitor and the
          # documentation.
          #
          # Deliberately NOT `exact` against the checkout, even though the bytes
          # are known: exact() has no retry loop, and index.html changes on every
          # deploy, so it would fail on a perfectly good deploy that had merely
          # reached one edge slightly late. check() retries; a substring that can
          # only be true of the right object is the strongest assertion that can
          # afford to.
          check https://wozi.com/ 200 "blob/${{ github.sha }}/index.html"
          check https://wozi.com/fidget/ 200 "blob/${{ github.sha }}/fidget/index.html"
          # config.js carries the link table, the people and the palette. If it
          # 404s, index.html still renders a turning machine with NO LINKS and
          # only complains to the console -- a failure a screenshot would pass.
          # Assert it is served, that it is really the config, and that it
          # actually parses, since a truncated or corrupted body would otherwise
          # look identical to a missing one at the point it matters.
          check https://wozi.com/config.js 200 'WOZI_CONFIG'
          check_content_type https://wozi.com/config.js "text/javascript; charset=utf-8"
          # Write to a REAL FILE. `node --check <(printf ...)` hands node a
          # /dev/fd/63 pipe, which it cannot treat as a module source, so it
          # failed on a config that was served perfectly -- a gate reporting a
          # fault in the thing it was checking rather than in itself.
          curl -sS --max-time 20 https://wozi.com/config.js -o /tmp/config-live.js || true
          if [ -s /tmp/config-live.js ] && node --check /tmp/config-live.js 2>/tmp/config-err.txt; then
            echo "  ok   https://wozi.com/config.js parses ($(wc -c </tmp/config-live.js) bytes)"
          else
            echo "  FAIL https://wozi.com/config.js does not parse as JavaScript"
            echo "  ---- node --check said ----"
            sed 's/^/    /' /tmp/config-err.txt 2>/dev/null || true
            echo "  ---- first 200 bytes ----"
            head -c 200 /tmp/config-live.js 2>/dev/null | sed 's/^/    /' || true
            echo ""
            fail=1
          fi
          check https://wozi.com/assets/icons/github.svg 200 'svg'
          # /fidget is a standalone page with its own physics loop (#123,
          # CL#145). Substring rather than exact-match: it carries no
          # sensitive data and no signature, so byte-identity buys nothing
          # here -- what matters is that the page arrives and is the fidget
          # rather than a redirect or an error body.
          check https://wozi.com/fidget/ 200 'planetary'
          # The bare path without the trailing slash used to 403 with the raw
          # S3 AccessDenied body (CL#146) -- the #74 failure shape again, one
          # directory later. wozi-viewer-request (infra/cloudfront-viewer-
          # request.js) is what adds the slash; this is the only thing that
          # would notice if that function were ever rolled back or replaced.
          check_redirect https://wozi.com/fidget 301 'https://wozi.com/fidget/'
          # EXACT MATCH, NOT PRESENCE (#54). keybase.html's body is
          # signature-covered, so a truncated response still returns 200 while
          # the ownership proof silently stops verifying -- a substring check
          # cannot tell those apart.
          #
          # cards/ was the other user of this and is gone (CL#143): the pages,
          # the vCard and their assets are no longer published, and the objects
          # were removed from the bucket. The exact() helper is kept because
          # keybase.html needs it and because it is the right shape for anything
          # whose bytes matter.
          exact() {   # exact <url> <repo-file>
            local got want
            got=$(curl -sS --max-time 20 "$1" | shasum -a 256 | cut -d' ' -f1)
            want=$(shasum -a 256 < "$2" | cut -d' ' -f1)
            if [ "$got" = "$want" ]; then
              echo "  ok   $1 is byte-identical to $2"
            else
              echo "  FAIL $1 does not match $2 (served $got, published $want)"
              fail=1
            fi
          }
          exact https://wozi.com/keybase.html keybase.html
          check https://wozi.com/keybase.html 200 ''
          check https://wozi.com/ssh_public_key 200 'ssh-'
          # Every browser requests this unconditionally, so a 403 here (its
          # state for the whole life of the site before GitHub #119) fires on
          # every cold load even though the data: URI favicons still win.
          check https://wozi.com/favicon.ico 200 ''
          check_content_type https://wozi.com/favicon.ico image/x-icon
          # robots.txt is the one object here whose entire job is to be fetched
          # by somebody else's parser, so nothing on our side ever notices it
          # being wrong. It 403'd for the whole life of the site (#74) and the
          # only way anyone found out was asking for it by hand.
          #
          # Three assertions, because the ways it can fail are three different
          # ways. Missing from the whitelist -> 403/404, caught by the status
          # check. Published without an explicit type -> caught by the
          # content-type check, and a robots.txt served as text/html or
          # application/xml is ignored by Google outright. Published but
          # truncated or stale -> caught by exact, which is the only one of the
          # three that can tell "a crawl policy" from "the RIGHT crawl policy":
          # a body that lost its Allow line still returns 200 as text/plain.
          check https://wozi.com/robots.txt 200 'User-agent: *'
          check_content_type https://wozi.com/robots.txt "text/plain; charset=utf-8"
          exact https://wozi.com/robots.txt robots.txt
          # Served as anything but image/svg+xml, loadIcons() still fetches the
          # badges, its .catch swallows the failure, and every hub renders empty
          # with no console error. Assert it explicitly.
          check_content_type https://wozi.com/assets/icons/github.svg image/svg+xml
          # www must redirect to the apex rather than fail TLS, as it did before #22.
          check_redirect https://www.wozi.com/ 301 'https://wozi.com/'

          exit $fail

      - name: Summary
        if: always()
        run: |
          {
            echo "### wozi.com deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Result | ${{ job.status }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Invalidation | \`${{ steps.invalidate.outputs.id }}\` |"
            echo "| Live | https://wozi.com |"
          } >> "$GITHUB_STEP_SUMMARY"
