name: mutation gate

# Proves the OTHER gates can fail.
#
# Every harness in tools/ reports green on a healthy tree, and so does a harness
# that is broken — this repo has shipped one that printed FAIL and exited 0, one
# that had been dead with a NameError for weeks, and one with no exit code at
# all. tools/mutation_gate.py breaks the page on purpose, one surgical
# substitution at a time, and requires the named gate to go red and then green
# again on the restored tree.
#
# WHY THIS IS NOT IN deploy.yml. That workflow gates a live bucket and runs on
# every push and every pull request, and the full sweep takes about nine minutes
# — almost all of it the device sweep, which alone is 3m38 and gets run twice
# (once mutated, once as the control). Tripling the latency of the deploy path
# to re-answer a question whose answer only changes when a HARNESS changes is
# the wrong trade. Worse, it would be a second browser-heavy job racing the
# first for the same runner, and a flake in it would block a deploy over
# something that is not about the deploy at all.
#
# So it is split by how often the answer can change:
#
#   registry  — seconds, no browser, runs on EVERY push and pull request. It
#               proves the runner itself can fail and that all eight mutations
#               still apply to the files they name. That is the one thing that
#               rots silently with ordinary page edits: rename a constant and
#               the mutant quietly stops testing anything.
#   mutate    — the real nine-minute sweep. Weekly, on demand, and on a pull
#               request labelled `harness`. Whether a gate is ABLE to fail
#               changes when a HARNESS changes, not when the page does, and the
#               registry job above already covers the one way an ordinary page
#               edit can blind it. A full sweep is one `gh workflow run
#               mutation.yml` away whenever it is wanted sooner.

on:
  schedule:
    # Mondays, 07:00 UTC. Nothing here gates a deploy, so it wants a cadence
    # that notices rot within a week, not one that interrupts.
    - cron: '0 7 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'legacy/**'
  pull_request:
    branches: [main]

concurrency:
  group: mutation-wozi-com-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap, and the only part that runs on every change. Blind mode replaces each
  # gate with one that always exits 0 — exactly how every broken harness this
  # repo has found behaved — so a working runner must report every mutant
  # SURVIVED and exit 1. Exit 0 means the runner has stopped being able to fail;
  # exit 2 means a mutation no longer applies and has been testing nothing.
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The runner can fail, and every mutation still applies
        run: |
          set +e
          python3 tools/mutation_gate.py --blind
          rc=$?
          set -e
          case $rc in
            1) echo "ok — blind gates produced a FAIL verdict, as they must" ;;
            2) echo "::error::a mutation no longer applies; the registry in tools/mutation_gate.py has been testing nothing. See the output above."; exit 1 ;;
            0) echo "::error::the mutation runner passed with every gate blinded. It cannot fail, which is the exact defect it exists to catch."; exit 1 ;;
            *) echo "::error::mutation runner exited $rc"; exit 1 ;;
          esac

  mutate:
    # Weekly and on demand; on a pull request only when it is labelled
    # `harness`. Deliberately NOT on every push: an ordinary page edit cannot
    # change whether a gate is able to fail, the registry job above already
    # covers the one way it can rot, and nine minutes of browser time per merge
    # on a repo that lands several agent branches a day is a real bill for an
    # answer that has not changed.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(toJSON(github.event.pull_request.labels.*.name), 'harness'))
    runs-on: ubuntu-latest
    # 45, NOT 30, BECAUSE THE REGISTRY GREW AND THIS NUMBER DID NOT (GitHub #155).
    # Registering the `dom` and `escape` gates took the full sweep from 406s to
    # **532s locally** — and escape_mesh alone is ~37s per invocation, run once per
    # mutant plus once as the restored-tree control. A CI runner is slower than this
    # laptop by more than the 30-minute headroom left, and a sweep killed by its own
    # timeout goes red for a reason that has nothing to do with the page: the worst
    # kind of red, because it trains everyone to ignore the workflow. Raise this
    # whenever the registry grows; it is a bound on the harness, not on the tree.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Break the page eight ways and require the gates to notice
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          python3 -m pip install --quiet --disable-pip-version-check \
            websockets pillow numpy
          python3 tools/mutation_gate.py

      - name: Summary
        if: always()
        run: |
          {
            echo "### mutation gate"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Result | ${{ job.status }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "Each gate was made to go red by a mutation chosen to reproduce a"
            echo "failure this project has actually had, then green again on the"
            echo "restored tree. \`tools/mutation_gate.py --list\` names them."
          } >> "$GITHUB_STEP_SUMMARY"

  # THE ONLY GATE THAT LOOKS AT THE LIGHT THEME AT ALL, and until now it was in
  # no workflow (GitHub #157). Every themed harness in deploy.yml runs at its own
  # `--theme dark` default; a11y_audit is the one tool that iterates both, and it
  # is also the only automated check on contrast and target size anywhere.
  #
  # IT LIVES IN THIS WORKFLOW RATHER THAN THE DEPLOY, AND THE REASON IS NOT THAT
  # IT IS SLOW. Measured on a laptop it is 1.6-2.3s warm and 1.8s with the axe
  # cache cleared, against devices.py's 3m38 in CI — cost is no argument either
  # way. Two things are:
  #
  #   1. THE RULESET IS SOMEBODY ELSE'S AND IT FLOATS. The tool fetches
  #      `axe-core@4` from unpkg, so a 4.x release that adds or tightens a rule
  #      can turn this red with nothing in this repo having changed. On the deploy
  #      path that blocks a bucket over an upstream publish; here it is a report
  #      on a Monday.
  #   2. IT DOES NOT PIN THE DEAL. Unlike every gate in deploy.yml this one
  #      injects no LCG, so each pass audits a randomly dealt machine — and axe's
  #      colour-contrast rule reads dealt colours. 12 consecutive runs came back
  #      green, which is green-on-average over an unbounded population of deals and
  #      is not the same claim as deterministic green.
  #
  # So this workflow is now "the weekly slow-or-drifting checks", not only the
  # mutation gate, and the two jobs share the trigger for the same reason: both
  # answer questions whose answers change on somebody else's schedule rather than
  # on this repo's.
  #
  # It is GREEN as of CL#173, which fixed five serious light-only contrast
  # failures. Wiring it in is a commitment to keep it so — which is the point, and
  # why the job fails rather than merely printing.
  a11y:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(toJSON(github.event.pull_request.labels.*.name), 'harness'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      # THE SOURCE, NOT THE ARTIFACT, and that is a limitation stated rather than
      # hidden: deploy.yml strips the comments out of index.html before its gates
      # run, and nothing here does. The strip changes no pixel — that is what
      # `pixel_regress --ref HEAD` asserts on the deploy path — so contrast and
      # target sizes are the same in both. If that ever stops being true, this job
      # is measuring the repo copy and nothing measures the delivered one.
      - name: Contrast and target sizes, in BOTH themes
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -uo pipefail
          unset TMOUT
          python3 -m pip install --quiet --disable-pip-version-check websockets
          # Port 8797 rather than deploy.yml's 8765: a fixed port is only safe
          # because a runner is a clean machine, and two workflows sharing one
          # number is a collision waiting for the day they land on the same one.
          python3 -m http.server 8797 --bind 127.0.0.1 &
          SERVER=$!
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:8797/index.html; then break; fi
            sleep 0.25
          done
          set +e
          python3 tools/a11y_audit.py http://127.0.0.1:8797/ ; A11Y=$?
          set -e
          kill $SERVER 2>/dev/null || true
          # 2 AND 1 ARE DIFFERENT SENTENCES and the log must not blur them: 2 is
          # "nothing was audited" (no browser, or axe-core unreachable), 1 is
          # "audited, and it failed". Both stop the job; only one is about the page.
          if [ $A11Y -eq 2 ]; then
            echo "::error::a11y_audit could not audit (exit 2) — no browser, or axe-core unreachable. Nothing was proved either way."
            exit 1
          fi
          if [ $A11Y -ne 0 ]; then
            echo "::error::a11y_audit found critical/serious failures — see the RESULT: FAIL block above"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### accessibility audit"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Result | ${{ job.status }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "axe-core in **both** themes, plus the 24x24 target floor, duplicate"
            echo "accessible names, lang/main and unlabelled focusables — also in both"
            echo "themes since GitHub #157. Undecided axe checks are printed and do"
            echo "not fail."
          } >> "$GITHUB_STEP_SUMMARY"
