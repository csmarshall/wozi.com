    if (Math.abs(dy) >= need && Math.abs(dy) > SWIPE_BIAS * Math.abs(dx)) {
      swipe = null;                                  /* one swap per gesture */
      /* Up steps forward through GROUND_ORDER and down steps back, like a stack
         of cards being pulled up from underneath. With two groundings both are
         the same toggle; the sign is kept anyway so a third needs no new gesture. */
      useGrounding(nextGrounding(dy < 0 ? 1 : -1));
    }
    return;
  }
  if (!S.grip || !grabbedCentre) return;
  const p = svgPoint(ev);
  if (!p) return;
  const a = angleAt(p, grabbedCentre);
  /* Unwrap across the atan2 branch cut, or one lap of the finger reads as a
     full turn backwards and the train slams the other way. */
  let d = a - prevPointerAngle;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  prevPointerAngle = a;
  S.grip.target += d;
  ev.preventDefault();
});

function release() {
  S.grip = null; grabbedCentre = null;
  swipe = null;
  svg.style.cursor = 'grab';
}
svg.addEventListener('pointerup', release);
svg.addEventListener('pointercancel', release);
svg.addEventListener('lostpointercapture', release);

/* Keyboard and the two buttons reach the same integrator and nothing else --
   there is exactly one thing that can set the train in motion, whichever
   control asks for it. A flick is an impulse at a port: the same impulse at the
   output produces RATIO^2 less speed, which is the claim, demonstrable without
   a finger. */
function flick(port, sign) {
  /* An angular impulse L at a port moves that port by L / (jEff * gear^2) and
     therefore moves the input-port coordinate by gear times that --
     L / (jEff * gear). One line, and the square is in it, not asserted beside
     it. */
  S.rate += sign * MODE.flickImpulse / (MODE.jEff * port.gear);
  if (Math.abs(S.rate) > MAX_SPEED) S.rate = Math.sign(S.rate) * MAX_SPEED;
}
const flickIn = document.getElementById('flickInput');
const flickOut = document.getElementById('flickOutput');
const groundBtn = document.getElementById('ground');
/* The handlers read MODE.ports at click time rather than closing over a port
   object, so a grounding swap does not leave a button wired to the machine that
   is no longer on screen. */
flickIn.addEventListener('click', () => flick(MODE.ports.input, 1));
flickOut.addEventListener('click', () => flick(MODE.ports.output, 1));
groundBtn.addEventListener('click', () => useGrounding(nextGrounding(1)));
svg.setAttribute('tabindex', '0');
svg.addEventListener('keydown', (ev) => {
  /* THE SWIPE'S KEYBOARD ROUTE, and it is not optional: a gesture is unreachable
     from a keyboard by definition, so a page whose second machine is only behind
     a swipe has a machine some visitors cannot get to at all. Two spellings,
     because they answer two different questions -- Shift+Up/Down is the swipe
     said in keys, and `g` is the shortcut somebody looking for "grounding" tries.
     The button in the chrome row is the third and the discoverable one.

     Shift is what keeps them off the flick keys below: an unmodified Up or Down
     still throws the input port, which is what it has always done, and the
     modifier is checked FIRST so the two cannot both fire on one press. */
  if (ev.key === 'g' || ev.key === 'G') {
    useGrounding(nextGrounding(1)); ev.preventDefault(); return;
  }
  if (ev.shiftKey && (ev.key === 'ArrowUp' || ev.key === 'ArrowDown')) {
    useGrounding(nextGrounding(ev.key === 'ArrowUp' ? 1 : -1)); ev.preventDefault(); return;
  }
  if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp') { flick(MODE.ports.input, 1); ev.preventDefault(); }
  if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') { flick(MODE.ports.input, -1); ev.preventDefault(); }
});

/* ================================================================== READOUT */
/* Monospace and a fixed column width, so a changing digit does not shuffle the
   line it sits on -- a readout that reflows every tick is unreadable at speed. */
const cell = (label, value, accent) =>
    '<span style="display:inline-flex;gap:7px;align-items:baseline;white-space:nowrap;">'
  + '<span style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;">' + label + '</span>'
  + '<b style="color:' + (accent || 'var(--ink)') + ';font-variant-numeric:tabular-nums;">' + value + '</b></span>';

/* Every label as well as every number comes off MODE: the readout is the page
   saying what machine it is, so a hardcoded "RINGS FIXED" or "SUN→CARRIER" would
   be the one place the page could go on describing the grounding it left. */
function draw() {
  const inp = MODE.ports.input, outp = MODE.ports.output;
  const inRps = S.rate / (2 * Math.PI);
  const state = S.grip ? 'HELD · ' + S.grip.port.label : (S.rate === 0 ? 'AT REST' : 'COASTING');
  readout.innerHTML =
      cell('grounded', MODE.grounded)
    + cell('stages', MODE.stages.map((s) => s.stageRatio.toFixed(3)).join(' × '))
    + cell(inp.member + '→' + outp.member, MODE.ratio.toFixed(3) + ':1')
    + cell('inertia ' + inp.member, '1.0×')
    + cell('inertia ' + outp.member, (outp.inertia / inp.inertia).toFixed(1) + '×', 'var(--accent)')
    + cell(inp.member, inRps.toFixed(2) + ' rev/s')
    + cell(outp.member, (inRps / MODE.ratio).toFixed(3) + ' rev/s')
    + cell('state', state, S.rate === 0 && !S.grip ? 'var(--muted)' : 'var(--ink)');
}

/* ==================================================================== THEME */
const themeBtn = document.getElementById('theme');
const ORDER = ['auto', 'light', 'dark'];
themeBtn.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || 'auto';
  const next = ORDER[(ORDER.indexOf(cur) + 1) % ORDER.length];
  document.documentElement.setAttribute('data-theme', next);
  themeBtn.textContent = next === 'auto' ? 'theme' : next;
});

/* ===================================================================== BOOT */
/* THE ONE PLACE A GROUNDING IS ACTED ON. It re-solves the machine, ZEROES THE
   ONE STATE and rebuilds the drawing, in that order.

   Zeroing is not tidiness. S.angle is the integral of S.rate in the input
   port's coordinate, and the input port is a different member in the two
   groundings -- 40 radians of sun is not 40 radians of ring, so carrying the
   number across would wind every wheel to a phase that means nothing and, worse,
   would land the assembly somewhere other than the phase the teeth were solved
   for. A grounding swap is picking up the other machine, not the same one
   relabelled.

   This is also the whole of what every control that swaps grounding calls, and
   there are four of them now -- the vertical swipe, the `ground` button, `g`, and
   Shift+Up/Down -- with no second path between any of them and the machine. That
   is the same rule index.html holds its speed control to: moving WHERE a control
   is drawn, or adding another spelling of it, must never give it a second job.

   WHICH SET IS ON SCREEN IS NOT TOUCHED HERE. VIEW is a camera position and a
   grounding is a machine; a swipe should leave you looking at the same stage from
   the same place with the other machine in it, so that the ratio is visibly the
   only thing that changed. That is the demonstration the page is for.

   applyTransforms() runs before returning because build() creates every node
   without a transform attribute: without it the rebuilt set is painted once at
   un-phased zero, and the assembly's own phasing -- the thing that makes the drawn
   teeth mesh -- would flash wrong for exactly one frame. */
function useGrounding(name) {
  MODE = solveGrounding(name);
  S.angle = 0; S.rate = 0; S.grip = null;
  grabbedCentre = null;
  build();
  applyTransforms();
  draw();
}

useGrounding(GROUNDED);
window.addEventListener('resize', layout);
/* AND THE VISUAL VIEWPORT, WHICH IS A SEPARATE EVENT AND THE ONLY ONE A
   COLLAPSING TOOLBAR IS KNOWN TO FIRE (GitHub #170). iOS Safari moves the visual
   viewport when its toolbar collapses under a scroll, or when a keyboard comes
   up, WITHOUT necessarily resizing the layout viewport -- which is the entire
   reason the API exists as a second thing to listen to, and index.html has
   listened to it for exactly this for a while. This page had only the `resize`
   line above, so if iOS does not also fire that one, layout() never ran and the
   gear stayed sized and centred for a viewport the visitor could no longer see.
   BE HONEST ABOUT WHICH HALF OF THAT IS MEASURED. The asymmetry between the two
   files is: index.html six references, this file none. The SYMPTOM is projected
   and has never been reproduced, and it cannot be from here -- everything in
   tools/ is headless Chrome plus one windowless WKWebView, so there is no browser
   chrome and no toolbar to collapse. docs/MANUAL-CHECKS.md check 12 is this exact
   question and a phone is the only thing that can answer it. This is here because
   the cost is asymmetric -- one redundant handler against a page laid out to the
   wrong height on the device class it is most used on -- not because anyone has
   seen it fail.
   It is the SAME function and not a variant of it: layout() reads the box it is
   given and is idempotent, so a doubled event costs one extra pass of attribute
   writes and cannot compute a second opinion about where the gear is. */
if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
/* AND ONCE MORE AFTER THE FIRST FULL LAYOUT, because two of the things layout()
   measures are not true yet when this script runs. The chrome strip is a wrapping
   flex row over a safe-area inset, and it is 95px tall as one row and 155px as two
   -- and it reports the one-row height at boot on a 390-wide phone, which is 60px
   of budget the shaft label does not really have. Measured: at boot the label
   settled on its longest phrasing and ran under the chrome; after one more layout
   it settles on the middle one and clears it by 17px. Cheap (one layout, once) and
   the alternative is a hardcoded height, which is the same number written down in
   a place that cannot see the device that decided it. */
window.addEventListener('load', layout);
applyTransforms();
draw();
setInterval(draw, 250);
requestAnimationFrame(step);

})();
</script>
</body>
</html>
