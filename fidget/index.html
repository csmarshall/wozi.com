<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Double planetary — wozi</title>
<!-- WHAT THIS PAGE IS.

     A double (compound) planetary gear set you can spin with a finger. The
     whole train is one degree of freedom bound by Willis, once per set:

         (w_sun - w_carrier) / (w_ring - w_carrier) = -N_ring / N_sun

     and A GROUNDING IS A CHOICE OF WHICH MEMBER TO PIN AT ZERO in that one
     equation. Two are implemented (GitHub #129) and they are the same metal
     either way -- same tooth counts, same drawn wheels, same assembly:

       - ring-grounded (shipped): w_ring = 0, so the SUN and the final CARRIER
         are the free ports and the reduction is 1 + N_r/N_s per set. 15.17:1
         overall, and the two ports are 230x apart in reflected inertia.
       - sun-grounded: w_sun = 0, so the RING and the final CARRIER are the free
         ports and the reduction is 1 + N_s/N_r per set -- always under 2:1,
         because a ring is always bigger than its own sun. 1.82:1 overall, and
         3.3x between the ports.

     The point of the page is that REFLECTED INERTIA GOES AS THE SQUARE OF THE
     RATIO BETWEEN THE PORTS, so a port at the slow end of a large reduction
     feels orders of magnitude heavier than the one at the fast end. That claim
     is a property of the ratio, not of the page: it is loud under
     ring-grounding and quiet under sun-grounding, and the same one line of
     algebra produces both. See README.md in this folder for every number and
     why it is that number.

     THE DROP FROM 230x TO 3.3x IS THE POINT, AND IT IS INHERENT -- Charles's
     call, recorded here because it is exactly the kind of thing that gets
     re-litigated as a bug later. Sun-grounding cannot be made louder by
     choosing different teeth. Every buildable set has N_r = N_s + 2*N_p, so
     N_r > N_s ALWAYS, so 1 + N_s/N_r < 2 always: a sun-grounded stage can never
     reduce as much as 2:1 and therefore can never reflect more than 4x, however
     many stages are compounded at whatever counts. Swiping between the two
     groundings is a swipe from two very different ports to two similar ones, and
     the ratio is visibly the only thing that changed -- which is the
     demonstration rather than a shortfall in it.

     HOW A VISITOR GETS FROM ONE TO THE OTHER (GitHub #129, parts 3 and 4).
     ONE STAGE IS ON SCREEN AT A TIME and it fills the window, so there are two
     separate "which one" questions and they are answered by two different
     controls, deliberately:

       - WHICH GROUNDING -- a vertical swipe that does NOT start on the gear, the
         `ground` button, or `g` / Shift+Up / Shift+Down on the focused drawing.
         Every one of them calls useGrounding(), which is the whole interface:
         re-solve, zero the one state, rebuild.
       - WHICH STAGE IS DRAWN -- the ONE SHAFT stub. The shaft is the compound
         train's whole story (stage 1's carrier IS stage 2's input member), so
         rather than delete the tie when the second set left the frame, the tie
         became the way to follow the shaft to the other end of it. It is a real
         button: pointer, Enter and Space, and its own aria-label.

     THE TWO POINTER PATHS ARE MUTUALLY EXCLUSIVE BY ONE TEST, portAt(p) === null
     at pointerdown, and never by a screen region. The gear fills the window now,
     so "off the gear" is not a corner or a strip -- it is whatever is outside the
     one grabbable disc, which moves and resizes with the layout.

     It is standalone by design: it loads nothing from support.js or config.js,
     and it draws its own gears. The palette tokens are copied from index.html's
     :root so the two pages read as one site, and they are the only thing shared.

     THE PROJECT RULES THIS PAGE IS HELD TO (CLAUDE.md):
       - NO CSS animation or transition on anything that turns. One rAF loop
         integrates one state and every body's transform is derived from it.
         Independent animation drifts out of mesh within seconds (#3).
       - Inline styling; no classes for layout. The <style> block below carries
         palette tokens and the two pseudo-element rules a style attribute
         cannot reach, exactly as index.html's does.
       - No hardcoded geometry: radii, orbit distances, tooth pitch and the
         inertias are all derived from the tooth counts and the module.        -->
<style>
:root{
  /* Copied verbatim from index.html's :root so the two pages are the same site.
     If those move, these should move with them -- this page cannot read them,
     because sharing a stylesheet is exactly the coupling it is avoiding. */
  --ref-bg:#E1E4DD; --ref-muted:#6B7E7C; --ref-bg-dark:#1E2226;
  --bg:var(--ref-bg); --ink:#20302E; --muted:var(--ref-muted);
  --hair:#D5DAD6; --chip:#FFFFFF; --accent:#3B7DE8;
  --shadow:0 1px 2px rgba(20,40,38,.06);
  --offset:max(14px, env(safe-area-inset-top));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:var(--ref-bg-dark); --ink:#EEF1F0; --muted:#93A5A3;
    --hair:#373E3D; --chip:#2A3034; --accent:#7FA9F0;
    --shadow:0 1px 2px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:var(--ref-bg-dark); --ink:#EEF1F0; --muted:#93A5A3;
  --hair:#373E3D; --chip:#2A3034; --accent:#7FA9F0;
  --shadow:0 1px 2px rgba(0,0,0,.35);
}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:'Manrope',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
/* The stage must not scroll or rubber-band under a drag: a fidget is a drag
   gesture on a full-bleed surface, and the browser's own pan would steal it. */
body{overscroll-behavior:none;touch-action:none;}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
</style>
</head>
<body>

<!-- "ONE GEAR, CENTERED, FULL-WINDOW" (GitHub #129 point 1, CL#156). The stage
     used to be a flex row sized by what the button bar and readout left over;
     the drawing itself already scales to fill whatever box it is given (the
     SVG's viewBox + default xMidYMid-meet preserveAspectRatio does that), so
     shrinking the box shrank the gear. Here the stage IS the whole viewport,
     and the chrome that used to claim its own rows is a floating overlay
     pinned to the bottom safe area instead -- present, reachable, but no
     longer taking a cut of the space the gear draws into.
     The other half of "one gear" -- showing one of the two stages at a time
     rather than both with more room -- is Charles's call and is settled; it
     lives in layout() and in build()'s one-stage block, not here. -->
<div style="position:fixed;inset:0;background:var(--bg);overflow:hidden;">

  <main id="stage" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
    <!-- The aria-label and the three button captions below are placeholders for
         the shipped grounding: build() rewrites all of them from the grounding
         actually in force, because "both ring gears fixed" is a claim about the
         machine and a page that switches grounding must not keep asserting the
         other one. -->
    <svg id="train" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="A double planetary gear set with both ring gears fixed. Drag the first set to turn the sun, the second to turn the output carrier."
         style="width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;"></svg>

  </main>

  <!-- The chrome is now an overlay strip rather than a sibling row, so it
       costs the drawing nothing. It keeps the bar's own background so text
       stays legible over whatever wheel happens to sit underneath it. -->
  <div id="chrome" style="position:absolute;left:0;right:0;bottom:0;pointer-events:none;
       background:linear-gradient(to top, var(--bg) 0%, var(--bg) 55%, transparent 100%);
       padding-top:18px;">
    <div style="pointer-events:auto;display:flex;gap:6px;flex-wrap:wrap;
         padding:8px max(14px, env(safe-area-inset-left)) 0;">
      <button id="flickInput" type="button"
         style="font:600 11px/1 'Manrope',system-ui,sans-serif;color:var(--muted);background:var(--chip);
         border:1px solid var(--hair);border-radius:999px;padding:9px 12px;cursor:pointer;box-shadow:var(--shadow);">flick sun</button>
      <button id="flickOutput" type="button"
         style="font:600 11px/1 'Manrope',system-ui,sans-serif;color:var(--muted);background:var(--chip);
         border:1px solid var(--hair);border-radius:999px;padding:9px 12px;cursor:pointer;box-shadow:var(--shadow);">flick carrier</button>
      <!-- THE SWIPE'S VISIBLE TWIN. A gesture nobody is told about is a feature
           nobody finds, and a gesture is not reachable from a keyboard at all --
           so the grounding swap has a button, and the button, the swipe and the
           `g` key all call the one function. It is labelled with what it will DO
           rather than with the state it is in, because "ground rings" on a page
           whose rings are already grounded reads as a statement, not an offer. -->
      <button id="ground" type="button"
         style="font:600 11px/1 'Manrope',system-ui,sans-serif;color:var(--muted);background:var(--chip);
         border:1px solid var(--hair);border-radius:999px;padding:9px 12px;cursor:pointer;box-shadow:var(--shadow);">ground suns</button>
      <button id="theme" type="button" title="Switch theme" aria-label="Switch theme"
         style="font:600 11px/1 'Manrope',system-ui,sans-serif;color:var(--muted);background:var(--chip);
         border:1px solid var(--hair);border-radius:999px;padding:9px 12px;cursor:pointer;box-shadow:var(--shadow);
         margin-left:auto;">theme</button>
    </div>

    <!-- Updated on a 250ms timer OUTSIDE the loop, and it reads the integrator's
         state rather than the DOM, so the instrument cannot change the reading --
         the lesson index.html's ?hud panel is built around. -->
    <div id="readout" aria-live="off" style="pointer-events:auto;display:flex;flex-wrap:wrap;gap:2px 22px;
         align-items:baseline;
         padding:10px max(14px, env(safe-area-inset-left)) max(10px, env(safe-area-inset-bottom));
         font:500 12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);"></div>
  </div>
</div>

<script>
'use strict';
(function () {

/* ==================================================================== GEARING
   Tooth counts. Every other length on the page comes off these and MODULE.

   Two constraints hold for each set and both are asserted at load rather than
   trusted, because a set that violates either cannot be built out of metal and
   would draw a machine that does not exist:
     - coaxial:  N_ring = N_sun + 2 * N_planet
     - equally spaced planets: (N_sun + N_ring) % nPlanets === 0                */
const MODULE = 1;                 /* every radius is in these units; the SVG
                                     viewBox is in them too, so "module" and
                                     "user unit" are the same thing here.      */
const SETS = [
  { sun: 24, planet: 18, ring: 60, planets: 3 },   /* stage 1: 1 + 60/24 = 3.500 */
  { sun: 18, planet: 21, ring: 60, planets: 3 }    /* stage 2: 1 + 60/18 = 4.333 */
];

/* WHICH MEMBER IS BOLTED TO THE WORLD (GitHub #129). One word, and the only
   thing that separates the two machines this page can draw -- everything else,
   the tooth counts included, is shared. 'ring' is what has shipped since #123.
   It is deliberately a source constant rather than a URL parameter, for the same
   reason ORIGIN_MOUNT is one in index.html: a switch reachable from the address
   bar is a second way for the page to draw something no gate photographs.
   useGrounding() is the one place it is acted on, so the swipe #129 asks for has
   exactly one thing to call. */
const GROUNDED = 'ring';

/* A carrier is a plate or a spider, not a solid gear blank: it is thinner than
   the wheels it carries. One number, applied to the disc formula below, rather
   than a hand-written inertia per carrier. */
const CARRIER_THICKNESS = 0.35;

/* How far a ring gear's rim stands outside its own pitch circle. It is a
   DRAWING figure with no tooth count behind it, so it is named once and read
   three times -- the ring's outline, the page's own extent in layout(), and now
   the ring's moment of inertia, which must be the inertia of the ring that is
   actually drawn and not of a differently-sized one. */
const RING_RIM = 3.2;

/* Moment of inertia of a uniform disc of radius r at constant thickness and
   density: J = m r^2 / 2 with m proportional to r^2, so J is proportional to
   r^4 / 2. The constant of proportionality is arbitrary because only RATIOS of
   inertia matter here -- which is exactly why the page can be honest about
   reflected inertia without inventing a mass in kilograms.

   THE HALF IS NOT DECORATIVE, AND IT WAS MISSING UNTIL #129. `disc` was r^4,
   which stands for J = m r^2 rather than J = m r^2 / 2 -- harmless while every
   disc on the page shared the one arbitrary constant, and NOT harmless the
   moment a body's inertia is compared with a PARALLEL-AXIS term, because
   `mass(r) * d^2` is the whole of m d^2 and carries no factor to match. A
   planet's orbital term was therefore being weighed against a spin term twice
   the size it should be. The fix belongs here rather than on the orbital term:
   m d^2 is exactly right as it stands, so the error was never there.

   Nothing the page DOES changes. J_eff enters the loop only as a scale --
   HAND_STIFFNESS and flickImpulse are both proportional to it and `accel =
   torque / jEff` divides by it again -- so it cancels out of every rate and
   every angle the page produces. What changes is the honesty of the inertia
   figures themselves, and of the claim about the two planet terms below. Found
   by re-deriving for the second grounding, not by anything going wrong. */
const disc = (r) => Math.pow(r, 4) / 2;
const mass = (r) => Math.pow(r, 2);

const pitchR = (teeth) => teeth * MODULE / 2;

/* ------------------------------------------------------------- KINEMATICS
   Willis, solved once per set, with ONE member held at zero:

     (w_sun - w_c) / (w_ring - w_c) = -N_ring / N_sun

   That equation has three speeds and one constraint, so a set is two degrees of
   freedom until something is pinned. Pinning one member is what makes the train
   a fixed-ratio machine with a single generalised coordinate, and WHICH member
   is pinned is the only difference between the two groundings below. Everything
   else -- the tooth counts, the mesh, the drawn wheels, the assembly -- is the
   same metal.

   The speeds are stated per unit speed of the INPUT PORT, whichever member that
   is, so the input port is always the generalised coordinate and every other
   body is a fixed multiple of it. Nothing downstream needs to know which member
   the coordinate belongs to; it needs to know only that it is 1.

   A wheel's speed is a plain number in the object either way, so the drawing and
   the inertia both read `st.ring` or `st.sun` and get a zero in the grounding
   where that member is the one bolted down. There is no branch for it. */

/* Both constraints that decide whether a set can be built out of metal at all.
   Asserted rather than trusted -- a set that violates either would draw a
   machine that does not exist -- and they are properties of the TOOTH COUNTS, so
   they hold in both groundings and are checked once for both. */
function assertBuildable(s) {
  if (s.ring !== s.sun + 2 * s.planet) throw new Error('set is not coaxial: ' + JSON.stringify(s));
  if ((s.sun + s.ring) % s.planets) throw new Error('planets do not space equally: ' + JSON.stringify(s));
}

/* How close to zero a grounded member has to come. It is a floating-point
   tolerance and nothing else: the algebra is exact, so the only thing between
   the check and 0 is the rounding of a few divisions. Named once because both
   groundings assert against it. */
const ZERO_SPEED = 1e-12;

/* ASSEMBLY PHASING -- where each wheel's teeth start, so the drawn set MESHES
   rather than merely having the right tooth counts. gearPath puts a tooth centre
   at its own angle zero, so at the line of centres two wheels would otherwise
   both present a tooth and interpenetrate.

   Work in tooth-index coordinates: t(a) = (a - beta) * N / 2pi, material at
   integers and space at half-integers. The sun keeps beta = 0 and everything
   else is solved against it, so nothing here is a tuned number.

     sun-planet contact:  sun angle 0, planet local angle pi
       t_planet(pi) = N_p/2 - beta_p*N_p/2pi must be a half-integer, so
       beta_p is -pi/N_p for an even planet and 0 for an odd one.
     planet-ring contact: planet local angle 0, ring angle 0
       whichever of the two the planet is now presenting there, the ring
       takes the other.

   GROUNDING DOES NOT ENTER HERE, and that is worth stating rather than leaving
   to be noticed. A phase is a statement about where a wheel's teeth sit at angle
   ZERO -- it is the assembly, the machine standing still before anybody turns
   anything -- and the assembly is the same set of parts however it is later
   bolted down. Both groundings therefore share these two expressions, and at
   S.angle = 0 they draw the identical picture. What grounding changes is which
   phase is a CONSTANT and which is a starting offset that then advances: under
   ring-grounding ringPhase is where the ring sits forever, under sun-grounding it
   is where the ring sets off from. Same number, and applyTransforms adds it to a
   rate that is zero in exactly one of the two cases. */
function phasing(s) {
  return {
    planetPhase: s.planet % 2 ? 0 : -Math.PI / s.planet,
    ringPhase: s.planet % 2 ? -Math.PI / s.ring : 0
  };
}

function stage(s, stageRatio, speeds) {
  return Object.assign({
    spec: s, stageRatio, orbitR: pitchR(s.sun) + pitchR(s.planet)
  }, speeds, phasing(s));
}

/* RING GROUNDED -- w_ring = 0, which is the classic reduction and what has
   shipped since #123. Willis collapses to

     w_carrier = w_sun / (1 + N_ring / N_sun)

   and the planet's own spin follows from the sun-planet external mesh taken in
   the carrier's rotating frame:

     (w_sun - w_c) / (w_planet - w_c) = -N_planet / N_sun

   Stage 2's sun is stage 1's carrier -- ONE SHAFT, which is what makes this a
   COMPOUND set rather than two sets standing next to each other. */
function ringGroundedStages(sets) {
  const out = [];
  let sun = 1;
  for (const s of sets) {
    assertBuildable(s);
    const stageRatio = 1 + s.ring / s.sun;
    const carrier = sun / stageRatio;
    const planet = carrier - (sun - carrier) * s.sun / s.planet;
    /* The ring must come out at exactly zero; if it does not, the algebra above
       is wrong and everything drawn from it is decorative. Taken the long way
       round -- from the planet, through the planet-ring internal mesh -- so it is
       an independent route to the member the grounding claims to have pinned and
       not a restatement of the line that set it. */
    const ringCheck = carrier + (planet - carrier) * s.planet / s.ring;
    if (Math.abs(ringCheck) > ZERO_SPEED) throw new Error('ring is not grounded: ' + ringCheck);
    out.push(stage(s, stageRatio, { sun, planet, carrier, ring: 0 }));
    sun = carrier;
  }
  return out;
}

/* SUN GROUNDED -- w_sun = 0 (GitHub #129). The same Willis equation, the other
   member pinned:

     (0 - w_c) / (w_ring - w_c) = -N_ring / N_sun
     =>  w_c * N_sun = N_ring * (w_ring - w_c)
     =>  w_carrier = w_ring * N_ring / (N_sun + N_ring)
     =>  w_ring / w_carrier = 1 + N_sun / N_ring

   So the free ports are the RING and the CARRIER, and the reduction per set is
   1 + N_s/N_r where ring-grounding gave 1 + N_r/N_s. THAT IS THE RECIPROCAL
   RELATIONSHIP AND IT IS NOT A COINCIDENCE: N_r > N_s in every buildable set,
   because N_r = N_s + 2*N_p, so sun-grounding can never reduce by more than 2:1
   and ring-grounding can never reduce by less than 3:1. A grounding is not a
   tuning knob over one range -- it picks which side of that boundary the machine
   is on.

   The planet's spin comes off the planet-ring INTERNAL mesh this time, because
   the ring is the member whose speed is now known:

     (w_planet - w_c) / (w_ring - w_c) = +N_ring / N_planet

   THE COMPOUND SHAFT HAS TO MOVE, and this is the one consequence of the swap
   that is not algebra. Under ring-grounding the shaft is carrier 1 -> sun 2.
   Ground both suns and that shaft would tie a grounded member to a moving one:
   set 1 would have its sun AND its carrier pinned, which is two constraints on a
   two-degree-of-freedom set, and the whole train would be a solid object. So the
   shaft is carrier 1 -> RING 2 here. It is still one coaxial rotating member and
   still one shaft, so the drawing's tie line stays true, but the input of stage 2
   is its ring rather than its sun -- which is exactly what "the free ports are
   the ring and the carrier" already said. */
function sunGroundedStages(sets) {
  const out = [];
  let ring = 1;
  for (const s of sets) {
    assertBuildable(s);
    const stageRatio = 1 + s.sun / s.ring;
    const carrier = ring / stageRatio;
    const planet = carrier + (ring - carrier) * s.ring / s.planet;
    /* The sun's own equivalent of ringCheck, and it is doing the same real work:
       come back down the sun-planet external mesh and the sun must land on
       exactly zero. If it does not, the grounding this whole mode is named for is
       not the grounding being drawn. */
    const sunCheck = carrier - (planet - carrier) * s.planet / s.sun;
    if (Math.abs(sunCheck) > ZERO_SPEED) throw new Error('sun is not grounded: ' + sunCheck);
    out.push(stage(s, stageRatio, { sun: 0, planet, carrier, ring }));
    ring = carrier;   /* carrier 1 -> ring 2, per the note above */
  }
  return out;
}

/* The two machines, by name. `held` is the member bolted to the world, `input`
   is the free member on the first set -- and the output port is the last set's
   carrier in both, which is why it is not named here. */
const GROUNDINGS = {
  ring: { stages: ringGroundedStages, held: 'ring', input: 'sun',  plural: 'RINGS' },
  sun:  { stages: sunGroundedStages,  held: 'sun',  input: 'ring', plural: 'SUNS' }
};

/* The order a swipe or a key steps through them in, taken from GROUNDINGS itself
   rather than written out a second time -- a hand-written list is a second place
   to add a grounding and forget. Two entries make up and down the same toggle;
   they are still stepped by +1 and -1 so that a third grounding needs no new
   gesture, and so the code does not quietly encode "there are exactly two". */
const GROUND_ORDER = Object.keys(GROUNDINGS);

/* -------------------------------------------------------- EFFECTIVE INERTIA
   J_eff = sum over every body of J_i * (w_i / w_input)^2 -- the standard
   reduction of a fixed-ratio train to one degree of freedom.

   THE GROUNDED MEMBER CONTRIBUTES NOTHING, because its speed is zero; that is
   not a simplification, it is what "grounded" means. What changed with #129 is
   that WHICH member that is is no longer knowable from here: the sum is written
   over every body, and the zero in the grounded member's speed does the work
   that a missing term used to do. Under ring-grounding the ring drops out and
   the sum is what it always was, to the last digit. Under sun-grounding the sun
   drops out instead and THE RINGS NOW MOVE, so a ring's own rotational inertia
   matters -- it was not modelled at all before, because a body at zero speed
   cannot be got wrong.

   A planet contributes TWICE: its own spin about its own axis, and its mass
   carried around the sun at the carrier's speed (parallel axis). Both are real,
   and THE ORBITAL TERM IS EXACTLY TWICE THE SPIN TERM here, in both groundings
   -- which is a theorem and not a proportion that happens to land. A planet rolls
   on whichever of the sun and the ring is stationary, so its instantaneous centre
   is at that contact and the distance from there to its own axis is its pitch
   radius:

     r_p * w_p = orbitR * w_c

   The spin term is (mass * r_p^2 / 2) * w_p^2 and the orbital term is
   mass * orbitR^2 * w_c^2, so that identity collapses them to a ratio of exactly
   1:2 -- the half in `disc` being the entire difference. Ground the CARRIER
   instead and the planet would roll on nothing stationary and it would stop being
   true. (Before #129 the two came out equal instead of 1:2, which is the missing
   half described at `disc`.) */
function effectiveInertia(stages) {
  let j = 0;
  for (const st of stages) {
    j += disc(pitchR(st.spec.sun)) * st.sun * st.sun;
    j += st.spec.planets * disc(pitchR(st.spec.planet)) * st.planet * st.planet;
    j += st.spec.planets * mass(pitchR(st.spec.planet)) * st.orbitR * st.orbitR * st.carrier * st.carrier;
    j += CARRIER_THICKNESS * disc(st.orbitR) * st.carrier * st.carrier;
    j += ringInertia(st.spec.ring) * st.ring * st.ring;
  }
  return j;
}

/* A ring gear is an ANNULUS, and inertia is additive, so a disc minus its own
   hole is exactly that: disc(outer) - disc(inner), under the same arbitrary
   constant every other body on the page shares. Both bounds come off the
   drawing rather than being chosen -- the inner one is the pitch circle, which
   is the convention the external wheels already take (each is a disc at its
   pitch radius, tooth spaces counted as solid and bores ignored), and the outer
   one is RING_RIM, the rim the ring is actually drawn with. A ring whose inertia
   and whose outline came from two different radii would be the kind of drift
   nothing on screen could show. */
const ringInertia = (teeth) => disc(pitchR(teeth) + RING_RIM * MODULE) - disc(pitchR(teeth));

/* ================================================================== LOSSES
   The three-term coast-down the main page arrived at over four iterations
   (CL#127 -> CL#139 -> CL#141), reused as a shape rather than re-derived:

     retarding rate = Coulomb + viscous * |w| + windage * w^2

   Each term earns its place and the failures sit at the ends of one axis:
     - Coulomb alone is a constant retarding torque, which is literally a
       friction BRAKE. It ramps down a straight line and stops at a corner.
     - Viscous/windage alone is an exponential: it never arrives, and the
       stopping time stops depending on how hard you threw it.
   Coulomb is kept precisely BECAUSE this page coasts to rest: it is the residue
   that makes a stop happen in finite time instead of asymptotically.

   DRAG_RANGE is how much harder it retards at the top of the speed range than
   at rest; WINDAGE_SHARE is how much of the speed-dependent part is the square
   term. Both are CL#141's shipped figures, and both are shape only -- the
   overall scale is SOLVED below so the coast takes exactly COAST_RANGE_S. Low
   windage and a wide range is what "free-feeling" means: little drag at speed,
   falling steeply as it slows. */
const DRAG_RANGE = 60;
const WINDAGE_SHARE = 0.10;

/* The one feel figure. How long the train takes to coast from REF_SPEED to a
   dead stop. Everything else about the losses is derived from it. */
const COAST_RANGE_S = 9.0;

/* The speed the coast figure is quoted at, in radians per second AT THE INPUT
   PORT -- a firm flick of it, which is the fastest thing on the page. Named once
   so the solver, the readout's "top" and the speed clamp all mean the same
   thing rather than three similar numbers.

   It is quoted at the input port and not at a named member, so it means the same
   thing in both groundings: the losses are a deceleration of the GENERALISED
   COORDINATE (see below), and the coordinate is the input port by construction.
   A coast therefore takes COAST_RANGE_S from a firm flick whichever member the
   finger is turning, which is the right invariant -- the bearings do not know
   what is bolted down. */
const REF_SPEED = 12 * 2 * Math.PI;      /* 12 input-port revolutions per second */
const MAX_SPEED = 3 * REF_SPEED;         /* nothing may be driven past this */

/* The scale, bisected against a Simpson integral of 1/decel, exactly as
   index.html solves SPINDOWN_K -- the closed form loses precision as the
   windage share approaches zero. A few hundred multiplications, once, at load.

   Expressed as a DECELERATION rather than a torque, which is legitimate here
   and not a shortcut: the train is fixed-ratio, so J_eff is a constant, and a
   retarding torque and a retarding acceleration differ only by that constant.
   README.md records this. */
const [COULOMB, VISCOUS, WINDAGE] = (function () {
  const at = (k, w) =>
      k * REF_SPEED / (DRAG_RANGE - 1)                 /* Coulomb */
    + k * (1 - WINDAGE_SHARE) * w                      /* viscous */
    + k * WINDAGE_SHARE * w * w / REF_SPEED;           /* windage */
  const timeToRest = (k) => {
    const n = 200, h = REF_SPEED / n;
    let s = 1 / at(k, 0) + 1 / at(k, REF_SPEED);
    for (let i = 1; i < n; i++) s += (i % 2 ? 4 : 2) / at(k, i * h);
    return s * h / 3;
  };
  let lo = 1e-9, hi = 1e4;
  for (let i = 0; i < 80; i++) {
    const mid = (lo + hi) / 2;
    if (timeToRest(mid) > COAST_RANGE_S) lo = mid; else hi = mid;
  }
  const k = hi;
  return [k * REF_SPEED / (DRAG_RANGE - 1), k * (1 - WINDAGE_SHARE), k * WINDAGE_SHARE / REF_SPEED];
})();

const retard = (w) => COULOMB + VISCOUS * w + WINDAGE * w * w;

/* ================================================================ THE HAND
   A finger is not a velocity source, it is a compliant grip -- and modelling it
   as one is the only way the inertia difference can be FELT rather than read.
   A drag imposes an angle; the grip pulls the body toward that angle with a
   spring and a damper. The light port snaps to the finger; the heavy port lags
   behind it and has to be wound up. That lag IS the reflected inertia.

   HAND_FREQ is the undamped natural frequency of grip-on-INPUT-PORT, so the
   stiffness is derived from the inertia rather than picked against it: change a
   tooth count, or change which member is grounded, and the input port still
   tracks the finger the same way. At the output port the same stiffness gives
   HAND_FREQ / RATIO, which is the square-law showing up as something your hand
   can notice -- and it is the honest measure of how much of this page survives a
   grounding swap, because RATIO is the only thing in it that changes.

   BOTH FIGURES ARE CLAIMS ABOUT THE CONTINUOUS MODEL, and step() has to actually
   deliver them -- it did not until #158, when the spring term was divided by the
   gear ratio twice and the output port came out overdamped at 1.09. They hold now
   at both ports and in both groundings: wn = HAND_FREQ / gear and zeta =
   HAND_DAMPING exactly, neither written down.

   AND THEY HOLD AT ANY FRAME RATE, which is a second thing and was not true until
   #164. The grip used to be STEPPED, so `wn * dt` decided the shape -- 1.0 at
   60fps at this HAND_FREQ, where the measured first overshoot was 90% against
   this zeta's 40%, and divergent by 30fps, which is what Low Power Mode runs at.
   gripAdvance() integrates the same equation in closed form instead, so these two
   numbers are now the whole of what a finger feels and the tick is not a third
   parameter. Change HAND_FREQ and nothing has to be re-checked against a frame
   rate; that is the point of the change, and it is why HAND_FREQ is still free to
   be a feel figure rather than a stability budget. */
const HAND_FREQ = 60;                          /* rad/s at the input port */
const HAND_DAMPING = 0.28;                     /* damping ratio, at either port */

/* ============================================================== THE MACHINE
   One grounding, solved into everything downstream of it. Nothing above this
   point knows which grounding is in force and nothing below it needs to ask
   twice: the ports, the ratio, the inertia, the grip stiffness and the flick
   strength are all consequences of the one word in GROUNDED, and they are
   computed together so they cannot be computed from two different answers.

   `gear` is how many turns of the input port one turn of this port is worth, so
   the input is 1 and the output is RATIO. Inertia seen at a port is
   J_eff * gear^2 -- the square, which is the whole claim the page makes. It is
   derived here and printed on screen; it is never written down. */
function solveGrounding(name) {
  const g = GROUNDINGS[name];
  if (!g) throw new Error('unknown grounding: ' + name + ' (want ' + Object.keys(GROUNDINGS).join(' or ') + ')');
  const stages = g.stages(SETS);
  /* Overall reduction, input port to final carrier. The product of the stage
     ratios -- and equal to 1 / (speed of the last carrier), which is how it is
     taken, so the number quoted on screen is the number the integrator uses. */
  const ratio = 1 / stages[stages.length - 1].carrier;
  const jEff = effectiveInertia(stages);
  const ports = {
    input:  { gear: 1,     label: g.input.toUpperCase(), member: g.input },
    output: { gear: ratio, label: 'CARRIER',             member: 'carrier' }
  };
  for (const p of Object.values(ports)) p.inertia = jEff * p.gear * p.gear;
  const stiffness = HAND_FREQ * HAND_FREQ * jEff;
  return {
    name, stages, ratio, jEff, ports,
    held: g.held, grounded: g.plural,
    stiffness,
    damper: (port) => 2 * HAND_DAMPING * Math.sqrt(stiffness * port.inertia),
    /* An impulse sized so the buttons and the arrow keys reach the integrator
       exactly as a finger does: a firm flick of the input port. It scales with
       jEff for the same reason the stiffness does -- so the gesture means the
       same thing in a machine with a different inertia. */
    flickImpulse: jEff * REF_SPEED * 0.75
  };
}

/* Solved at boot, by useGrounding(), not here: the solve reads REF_SPEED and
   HAND_FREQ, and a page that switches grounding must be able to re-solve
   anyway. One `let`, so there is one answer to "which machine is this". */
let MODE = null;

/* ================================================================== DRAWING
   Gear profiles are generated from tooth count and module. Nothing about a
   radius, an orbit or a tooth pitch is written down anywhere below.

   Standard proportions: addendum = 1 module, dedendum = 1.25 module, and the
   tooth occupies half the circular pitch at the pitch circle -- which is a half
   angle of pi/(2N) regardless of module. The flanks are straightened rather than
   involute: at the size these draw, the difference is sub-pixel, and a real
   involute would be geometry the page never uses. */
const TIP_TAPER = 0.62;    /* tooth half-angle at the tip, as a share of pitch  */
const ROOT_FLARE = 1.28;   /* ... and at the root                               */

function gearPath(teeth, internal) {
  const r = pitchR(teeth);
  const tip  = internal ? r - MODULE        : r + MODULE;
  const root = internal ? r + 1.25 * MODULE : r - 1.25 * MODULE;
  const half = Math.PI / (2 * teeth);
  const hTip = half * TIP_TAPER, hRoot = Math.min(half * ROOT_FLARE, Math.PI / teeth - 1e-4);
  const pt = (rad, a) => (rad * Math.cos(a)).toFixed(4) + ',' + (rad * Math.sin(a)).toFixed(4);
  let d = '';
  for (let i = 0; i < teeth; i++) {
    const a = i * 2 * Math.PI / teeth;
    d += (i ? 'L' : 'M') + pt(root, a - hRoot)
       + 'L' + pt(tip, a - hTip) + 'L' + pt(tip, a + hTip) + 'L' + pt(root, a + hRoot);
  }
  return d + 'Z';
}

const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
};

/* THE GROUND SYMBOL: hatching leaning 45 degrees off the radius, the drawing
   convention for "this is bolted to the world". It has one home because it now
   has two customers -- a grounded RING is hatched outside its rim, and a grounded
   SUN is hatched inside its bore, which is where a fixed shaft is hatched -- and
   because it is the page's only statement of which port is NOT free. Getting it
   onto the wrong member would be the page describing a different machine from the
   one it is integrating.

   The tick COUNT is derived from the circumference, so the density is the same
   round a 33-unit rim as round a 3.6-unit bore rather than 24 ticks meaning two
   different things. HATCH_ARC is the spacing and is a chosen drawing figure:
   there is no tooth count it could come from. It is set to what the shipped ring
   already draws -- 24 ticks at that radius -- so ring-grounding is untouched by
   its existence. */
const HATCH = 1.6 * MODULE;         /* tick length                              */
const HATCH_ARC = 8.7 * MODULE;     /* arc between ticks                        */
const HATCH_MIN = 6;                /* ... but never so few they stop reading as
                                       a hatch, which a small bore would         */
function groundHatch(g, radius, outward) {
  const n = Math.max(HATCH_MIN, Math.round(2 * Math.PI * radius / HATCH_ARC));
  const lean = outward ? HATCH : -HATCH;
  for (let i = 0; i < n; i++) {
    const a = i * 2 * Math.PI / n;
    const c = Math.cos(a), s = Math.sin(a);
    const bx = c * radius, by = s * radius;
    g.appendChild(el('line', {
      x1: bx, y1: by, x2: bx + (c * lean - s * lean), y2: by + (s * lean + c * lean),
      stroke: 'var(--muted)', 'stroke-opacity': 0.65, 'stroke-width': 0.36, 'stroke-linecap': 'round'
    }));
  }
}

/* A wheel: the toothed blank, a bore, and one bold radial index mark. The index
   mark is not decoration -- at speed a smooth disc reads as stationary, and it
   is the only way an eye can tell a turning wheel from a still one. A grounded
   sun keeps the mark for the opposite reason: a mark that never moves while
   everything around it does is what says the sun is the member being held. */
function wheel(teeth, opts) {
  const g = el('g', {});
  const r = pitchR(teeth);
  /* Outlined in --muted rather than --hair. --hair is a divider weight: on a
     white blank against a pale ground it left the teeth as a suggestion, and in
     dark the chip and the page are 12 units apart so the wheel all but vanished.
     --muted is the firm colour in both themes, held back with stroke-opacity so
     it does not read as ink. */
  g.appendChild(el('path', {
    d: gearPath(teeth, false),
    fill: opts.fill, stroke: 'var(--muted)', 'stroke-opacity': 0.55,
    'stroke-width': 0.28, 'stroke-linejoin': 'round'
  }));
  const bore = r * 0.3;
  g.appendChild(el('circle', {
    r: bore, fill: 'var(--bg)', stroke: 'var(--muted)', 'stroke-opacity': 0.45, 'stroke-width': 0.28
  }));
  /* Inward, into the bore: a fixed shaft is hatched on the shaft, and hatching
     outward from a sun would run straight into the planets it meshes with. */
  if (opts.grounded) groundHatch(g, bore, false);
  g.appendChild(el('line', {
    x1: bore, y1: 0, x2: r - 1.25 * MODULE, y2: 0,
    stroke: opts.mark, 'stroke-width': 0.75, 'stroke-linecap': 'round'
  }));
  return g;
}

/* The ring: an annulus whose inner boundary is the internal tooth profile, and,
   when the ring is the member being held, hatch ticks around the outside. The
   hatching is conditional because the ring is a free port under sun-grounding --
   a turning wheel drawn with a ground symbol on it is a contradiction, and the
   one thing this page cannot afford is a drawing that disagrees with the
   integrator. */
function ringGear(teeth, opts) {
  const g = el('g', {});
  const r = pitchR(teeth);
  const outer = r + RING_RIM * MODULE;
  const rim = (rad) => 'M' + rad + ',0A' + rad + ',' + rad + ' 0 1 0 ' + (-rad) + ',0A' + rad + ',' + rad + ' 0 1 0 ' + rad + ',0Z';
  g.appendChild(el('path', {
    d: rim(outer) + gearPath(teeth, true),
    'fill-rule': 'evenodd', fill: 'var(--chip)', 'fill-opacity': 0.55,
    stroke: opts.lit ? 'var(--accent)' : 'var(--muted)',
    'stroke-opacity': opts.lit ? 0.85 : 0.5, 'stroke-width': opts.lit ? 0.42 : 0.28
  }));
  if (opts.grounded) groundHatch(g, outer, true);
  return g;
}

const svg = document.getElementById('train');
const readout = document.getElementById('readout');
/* The floating chrome strip. layout() needs its height, because it is drawn OVER
   the stage rather than beside it, so it is the one part of the window the drawing
   has but cannot use. */
const chromeEl = document.getElementById('chrome');

/* Everything that turns, collected once. Each entry knows only its own speed
   multiple; the loop writes one transform per entry per tick from the single
   master angle, which is the "one clock" rule. */
const MOVERS = [];
const SET_NODES = [];
let SHAFT = null, SHAFT_HIT = null, SHAFT_LINE = null, SHAFT_LABEL = null;

/* WHICH STAGE IS ON SCREEN (GitHub #129). It is a DRAWING state and nothing else:
   MODE.ratio, MODE.jEff, every body speed and every number in the readout are the
   compound machine's, computed over every stage in SETS, and not one of them asks
   what is visible. So this is a camera position, not a model -- which is what makes
   it safe for it to change without touching S. */
let VIEW = 0;

/* Which free port a stage carries, if it carries one. The first stage carries the
   input port and the last carries the output; that was already assumed by the old
   two-centre hit test, and it is written down here now because with one set on
   screen it also decides whether the visible set is grabbable at all. A middle
   stage of a longer train carries neither, and would honestly be ungrabbable
   rather than silently answering with somebody else's port. */
function portOf(i) {
  if (!MODE) return null;
  if (i === 0) return MODE.ports.input;
  if (i === MODE.stages.length - 1) return MODE.ports.output;
  return null;
}

/* The grounding a swipe up, the button or `g` would move to next. Named because
   the button caption, the aria-label and the actual step all have to agree about
   it, and three separate `(i + 1) % n` expressions are three chances not to. */
const nextGrounding = (dir) =>
  GROUND_ORDER[(GROUND_ORDER.indexOf(MODE.name) + dir + GROUND_ORDER.length) % GROUND_ORDER.length];

function build() {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  MOVERS.length = 0; SET_NODES.length = 0;

  /* The chrome says what the machine is, and it is rewritten from MODE rather
     than written down in the markup: an aria-label asserting fixed rings, or a
     button offering to flick a sun that is bolted to the world, would be the
     page describing the other grounding. */
  const shown = portOf(VIEW), other = GROUNDINGS[nextGrounding(1)];
  svg.setAttribute('aria-label',
      'A double planetary gear set with both ' + MODE.held + ' gears fixed, reducing '
    + MODE.ratio.toFixed(3) + ' to 1 overall. Set ' + (VIEW + 1) + ' of ' + MODE.stages.length
    + ' is on screen and fills the window'
    + (shown ? '; drag it to turn the ' + shown.member : '')
    + '. Swipe up or down clear of the gear, or press G, to ground the '
    + other.plural.toLowerCase() + ' instead. The dashed shaft is a button: follow it to the other set.');
  flickIn.textContent = 'flick ' + MODE.ports.input.member;
  flickIn.title = 'Flick the ' + MODE.ports.input.member;
  flickOut.textContent = 'flick ' + MODE.ports.output.member;
  flickOut.title = 'Flick the output ' + MODE.ports.output.member;
  groundBtn.textContent = 'ground ' + other.plural.toLowerCase();
  groundBtn.title = 'Ground the ' + other.plural.toLowerCase()
    + ' instead — the same thing as a swipe up or down clear of the gear, or the G key';

  /* THE ONE SHAFT STUB -- what became of the coupling when the second set left
     the frame, and the one thing on this page it would have been worst to delete.
     The tie is not decoration: stage 1's carrier IS stage 2's input member, and
     that is the entire difference between a COMPOUND set and two sets standing
     next to each other. Drop it and the page draws a single epicyclic while the
     readout goes on quoting 15.167:1 for a train the drawing no longer shows.

     So it stays, as a stub running from the visible set's rim off the edge of the
     window, and IT IS THE CONTROL THAT TRAVELS ALONG IT. That is why this shape
     was picked over the alternatives:
       - deleting it: costs the compound claim, above.
       - a stub with a caption and nothing else: the tie then points at a stage
         that cannot be reached, and the heavy port -- the whole demonstration --
         becomes button-only. Following a shaft to the other end of it is what a
         shaft is FOR.
       - drawing the two sets concentrically: rejected at #123 for interleaving
         two orbit radii 21 and 19.5 units apart into an unreadable mess, and
         nothing about #129 changes that.
     Drawn first, so it sits behind the wheels, and given a transparent fat line
     to be hit by -- a 0.4-unit dashed stroke is a legible NOTE and an impossible
     TARGET, and those are two different widths.

     Which member is at the far end is the grounding's business and not the
     drawing's: carrier 1 -> sun 2 with the rings held, carrier 1 -> ring 2 with
     the suns held. A carrier tied to a ring is as much one coaxial rotating
     member as a carrier tied to a sun, so the note stays true either way. */
  SHAFT = el('g', { id: 'shaft', role: 'button', tabindex: '0', cursor: 'pointer' });
  svg.appendChild(SHAFT);
  SHAFT_HIT = el('line', { stroke: 'transparent', 'stroke-linecap': 'butt' });
  SHAFT_LINE = el('line', { stroke: 'var(--hair)', 'stroke-dasharray': '2 2' });
  SHAFT_LABEL = el('text', {
    fill: 'var(--muted)',
    style: "font:600 " + SHAFT_FONT + "px 'Manrope',system-ui,sans-serif;letter-spacing:.06em"
  });
  SHAFT.appendChild(SHAFT_HIT);
  SHAFT.appendChild(SHAFT_LINE);
  SHAFT.appendChild(SHAFT_LABEL);
  SHAFT.addEventListener('click', () => useView(VIEW + 1));
  /* Enter and Space, because a role="button" that answers to neither is a button
     in name only. stopPropagation keeps them off the drawing's own key handler. */
  SHAFT.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    useView(VIEW + 1);
    ev.preventDefault();
    ev.stopPropagation();
  });

  /* ONE SET AT A TIME (GitHub #129, Charles's call). What follows drew every
     stage; it now draws the one the page is looking at, and the block is left
     otherwise untouched -- a stage does not know or care whether it is the only
     one on screen, and neither does anything in the loop. */
  {
    const i = VIEW, st = MODE.stages[i];
    const g = el('g', {});
    svg.appendChild(g);

    /* THE PORT THIS SET IS GRABBED BY IS THE ONE DRAWN IN --accent. Set 1 carries
       the input port and the last set carries the output, which is what the
       labels say, so the colour is the label repeated on the part rather than a
       second scheme. Which MEMBER that is comes from the grounding: the input is
       a sun with the rings held and a ring with the suns held. */
    const grabbed = i === 0 ? MODE.ports.input.member : MODE.ports.output.member;
    const lit = 'var(--accent)', dim = 'var(--muted)';

    /* The ring is a MOVER unconditionally, at whatever rate the grounding gave
       it -- zero when it is the member being held. Its assembly phase is the same
       expression in both groundings and rides along as the entry's phase, so with
       the rings grounded applyTransforms writes exactly the static rotate() this
       used to carry, and with the suns grounded the same line turns it. One
       clock, one code path, no branch on grounding anywhere in the loop. */
    const ring = ringGear(st.spec.ring, { grounded: MODE.held === 'ring', lit: grabbed === 'ring' });
    g.appendChild(ring);
    MOVERS.push({ node: ring, rate: st.ring, phase: st.ringPhase });

    /* Carrier: a spider joining the planet axes. Drawn LAST, over the wheels,
       because a carrier plate is physically over them and because underneath it
       is completely hidden -- the arms run from the sun's radius to the planet
       centres, and the planets cover exactly that span. */
    const carrier = el('g', {});
    /* The arms start at the sun's tip circle, not at the axis -- a carrier IS
       journalled around the sun's shaft, and running them to the centre buries
       the sun's index mark under the hub, which is the one thing that says
       whether the sun is turning. */
    const hubR = pitchR(st.spec.sun) + 1.6 * MODULE;
    let d = '';
    for (let p = 0; p < st.spec.planets; p++) {
      const a = p * 2 * Math.PI / st.spec.planets, c = Math.cos(a), s = Math.sin(a);
      d += 'M' + (hubR * c).toFixed(3) + ',' + (hubR * s).toFixed(3)
         + 'L' + (st.orbitR * c).toFixed(3) + ',' + (st.orbitR * s).toFixed(3);
    }
    const heavy = grabbed === 'carrier';
    carrier.appendChild(el('circle', {
      r: hubR, fill: 'none', stroke: heavy ? lit : dim,
      'stroke-opacity': heavy ? 0.5 : 0.35, 'stroke-width': heavy ? 1.1 : 0.8
    }));
    carrier.appendChild(el('path', {
      d: d, fill: 'none', stroke: heavy ? lit : dim, 'stroke-opacity': heavy ? 0.55 : 0.4,
      'stroke-width': heavy ? 1.9 : 1.3, 'stroke-linecap': 'round'
    }));
    for (let p = 0; p < st.spec.planets; p++) {
      const a = p * 2 * Math.PI / st.spec.planets;
      carrier.appendChild(el('circle', {
        cx: st.orbitR * Math.cos(a), cy: st.orbitR * Math.sin(a), r: 1.1,
        fill: heavy ? lit : dim, 'fill-opacity': heavy ? 0.7 : 0.5
      }));
    }
    MOVERS.push({ node: carrier, rate: st.carrier });

    /* Planets. Each sits in an orbit group turning at the carrier's rate, and
       spins inside it at the difference -- two nested transforms, both derived
       from the same master angle, so a planet cannot drift out of its own orbit.

       A planet moved round to orbit angle theta is the SAME machine with the
       sun held and the carrier wound on by theta, so its own spin has advanced
       by theta * (1 + N_s/N_p); inside a group already carrying theta that
       leaves theta * N_s/N_p. assertBuildable()'s equal-spacing check is exactly
       the condition that this also returns the ring to its own zero.

       That argument is about ASSEMBLY, so it is grounding-independent for the
       same reason phasing() is: it asks where a planet's teeth have to sit for
       the set to go together with its planets equally spaced, and holding the sun
       is a step in the derivation rather than a claim about the finished machine.
       Both groundings use it unchanged. */
    for (let p = 0; p < st.spec.planets; p++) {
      const theta = p * 2 * Math.PI / st.spec.planets;
      const orbit = el('g', {});
      const spin = wheel(st.spec.planet, { fill: 'var(--chip)', mark: dim });
      orbit.appendChild(spin);
      g.appendChild(orbit);
      MOVERS.push({ node: orbit, rate: st.carrier, phase: theta });
      MOVERS.push({
        node: spin, rate: st.planet - st.carrier, offsetX: st.orbitR,
        phase: theta * st.spec.sun / st.spec.planet + st.planetPhase
      });
    }

    const sun = wheel(st.spec.sun, {
      fill: 'var(--chip)', mark: grabbed === 'sun' ? lit : dim, grounded: MODE.held === 'sun'
    });
    g.appendChild(sun);
    MOVERS.push({ node: sun, rate: st.sun });

    g.appendChild(carrier);   /* over the wheels, as a carrier plate is */

    /* ONE label per set, above it. Two labels -- a caption over and a hint
       under -- collided in portrait, where one set's under met the next set's
       over; there is no gap that fixes that which is not also wasted space in
       landscape, so there is one label and it says both things. */
    const cap = el('text', {
      'text-anchor': 'middle', fill: 'var(--muted)',
      style: "font:600 2.9px 'Manrope',system-ui,sans-serif;letter-spacing:.09em"
    });
    /* "OF 2" is new and is carrying the weight the second set used to: with both
       sets drawn, that there were two was self-evident. Derived from the stage
       count, so it cannot disagree with the train. */
    cap.appendChild(document.createTextNode(
      'SET ' + (i + 1) + ' OF ' + MODE.stages.length + ' · '
      + st.stageRatio.toFixed(3) + ':1 · DRAG FOR '));
    const strong = el('tspan', { fill: 'var(--accent)', style: 'font-weight:800' });
    strong.textContent = i === 0
      ? MODE.ports.input.label + ' (light)'
      : MODE.ports.output.label + ' (heavy)';
    cap.appendChild(strong);
    svg.appendChild(cap);

    SET_NODES.push({ g, cap, ring: st.spec.ring });
  }

  layout();
}

/* Travelling along the shaft. It re-draws and NOTHING ELSE -- S.angle and S.rate
   are untouched on purpose, and that is the difference between this and
   useGrounding(). A grounding swap picks up a different machine, so its
   coordinate has to start again; walking to the other end of one shaft is the
   same machine seen from somewhere else, so a train spinning down keeps spinning
   down and every body it re-draws lands on exactly the phase it would have been
   at had it been on screen all along (a body's angle is S.angle * rate + phase,
   and none of those three moved). The grip does go, because the disc the finger
   was on is no longer the disc under it. */
function useView(n) {
  VIEW = ((n % MODE.stages.length) + MODE.stages.length) % MODE.stages.length;
  S.grip = null;
  grabbedCentre = null;
  build();
  applyTransforms();
  draw();
}

/* How far past the window's edge the shaft stub is drawn. Any positive amount
   does the job -- the point is only that the stub is CUT by the edge rather than
   ending on it, because a line that stops in mid-air reads as a part that broke
   off and a line that leaves the frame reads as a machine that continues. Stated
   in modules because there is nothing it could be derived from. */
const SHAFT_OVERRUN = 1.5 * MODULE;

/* The stub's INK width and its HIT width, and they are deliberately two numbers
   rather than one: 0.4 units is a legible dashed note and an impossible target,
   and a target wide enough for a finger drawn in ink would read as a part of the
   machine. The hit width is a share of the ring's own radius so it scales with
   the drawing rather than being correct at one screen size -- it lands at 63px on
   a 1440x900 desk and 27px on a 390-wide phone, where the whole drawing is 4.6x
   smaller, so it is the drawing's own proportion and not a pixel figure. */
const SHAFT_INK = 0.4;
const SHAFT_TARGET = 0.2;

/* The stub label's own size, and the clearance it keeps from both the rim and the
   dashed line. The font size is named because the rotated portrait placement has
   to offset the baseline by a glyph height to keep the letters off the line, so
   the number is read twice and must be one fact. */
const SHAFT_FONT = 2.2;
const SHAFT_LABEL_GAP = 1.6;

/* Layout is recomputed on resize rather than fixed. ONE SET IS ON SCREEN, so
   there is one centre and the viewBox is SQUARE and symmetric about it -- with
   preserveAspectRatio at its default xMidYMid meet, that is what puts the gear
   in the middle of the window at the largest size that fits, which is all
   "one gear, centred, full-window" asks for. Every length comes off the visible
   ring's own outer radius, so a tooth-count change re-spaces the page by itself. */
const CENTRE = { x: 0, y: 0 };
let GRAB_RADIUS = 0;

/* THE ONLY THING BETWEEN THE GEAR AND THE WINDOW EDGE, as a fraction of the
   ring's own outer radius. It is a JUDGED FIGURE and cannot be derived: what it
   has to clear is one line of caption in the type size build() sets, and how
   close the drawing may come to the caption and to the floating chrome strip
   before the page looks cramped is a matter of taste, not of geometry.
   Everything it decides IS derivable from it and is derived below.

   The reason it is 0.42 is history, not measurement: it was inherited unchanged
   from the two-set layout (CL#161 kept it deliberately rather than retune a
   shipped value silently), where the same margin also had to hold the gap
   between the two sets and the coupling note between them. With one set it only
   holds the caption, so there is slack here that has never been reclaimed.

   IT IS EASIER TO CHOOSE IN THE UNITS THE PAGE IS SEEN IN. The viewBox is
   2*(R + margin) square and `meet` fits it to the SHORTER window edge, so the
   gear fills 1 / (1 + this) of that edge -- 0.704 as it stands. Going the other
   way, a wanted fill f is this = 1/f - 1: 0.78 -> 0.2821, 0.85 -> 0.1765,
   0.92 -> 0.0870. Note the drawn ink runs about 11.6% past R (the outrigger
   hairs outside the rim), so the ink meets the caption before this arithmetic
   says the rim does.

   0.2821 IS CHARLES'S PICK FROM A SWEEP (#129), i.e. a fill of 0.78, and it is
   the largest of 0.70/0.78/0.85/0.92 that clips nothing at either viewport.
   What bounds it is NOT the vertical room the desk appears to have: the caption
   is sized in user units, so it scales with the gear, and in PORTRAIT the window
   runs out SIDEWAYS while +117px of vertical clearance is still going spare --
   0.85 makes the caption 102% of a 390px window and cuts it off. Going past this
   therefore means decoupling the caption from the gear's scale first, not finding
   more margin. At this value the gear ink deliberately overlaps the floating
   chrome by 16px at the button row and 34px into its gradient, which is a look
   Charles chose from the pictures rather than an oversight -- the chrome has been
   an overlay since CL#156 precisely so the drawing may run under it. */
const GEAR_MARGIN = 0.2821;

function layout() {
  const R = pitchR(MODE.stages[VIEW].spec.ring) + RING_RIM * MODULE;
  /* The margin holds one line of caption above the set. It used to also have to
     be reconciled with a gap holding the coupling note and the second set's
     caption; with one set there is nothing else in the frame, so the gap is gone
     and so is the portrait/landscape special case that came with it. */
  const margin = R * GEAR_MARGIN;
  const half = R + margin;
  CENTRE.x = half; CENTRE.y = half;
  GRAB_RADIUS = R;
  svg.setAttribute('viewBox', '0 0 ' + 2 * half + ' ' + 2 * half);

  /* THE STUB LEAVES ALONG THE WINDOW'S LONG AXIS, WHICH IS EXACTLY WHERE THE
     ROOM IS. The viewBox is square and `meet` letterboxes it, so the space the
     drawing does not use is a band either side in landscape and above and below
     in portrait -- and content outside the viewBox is still painted, because a
     root <svg> clips at its own element box and not at its viewBox. So the stub
     runs out into that band and is cut by the window edge, with the gear staying
     centred and full size. Getting this the other way round would send the shaft
     into the letterbox's short direction and it would be clipped immediately.

     `edge` is the window's half-extent along that axis IN USER UNITS, measured
     through `meet`'s own scale rather than assumed: the viewBox centre and the
     window centre coincide, so the edge is that far from CENTRE. Nothing here is
     a pixel figure. A near-square window has almost no band at all, which is why
     `edge` is floored at `half` -- the stub is then only as long as the margin,
     and it still leaves the frame. */
  const wide = svg.clientWidth >= svg.clientHeight;
  const scale = Math.min(svg.clientWidth / (2 * half), svg.clientHeight / (2 * half)) || 1;
  const edge = Math.max((wide ? svg.clientWidth : svg.clientHeight) / 2 / scale, half);
  const far = (VIEW + 1) % MODE.stages.length;
  /* Which WAY the far set lies: forward along the axis if its index is ahead of
     the visible one, back if the walk has wrapped. Two stages make this +1 from
     set 1 and -1 from set 2, which keeps the old layout's sense -- set 2 was to
     the right in landscape and below in portrait. */
  const dir = far > VIEW ? 1 : -1;

  /* THE CAPTION SITS ON THE SIDE THE SHAFT DOES NOT LEAVE BY. In landscape the
     stub is horizontal and the caption is above, so they never meet; in portrait
     they share an axis, and a stub leaving upwards would be drawn straight
     through the caption's own letters. This is the same collision the two-set
     layout solved by rotating the coupling note bottom-to-top to squeeze past
     set 2's caption -- with one set there is a whole empty side to use instead. */
  const capUp = wide || dir > 0;
  SET_NODES.forEach((n) => {
    n.g.setAttribute('transform', 'translate(' + CENTRE.x + ',' + CENTRE.y + ')');
    n.cap.setAttribute('x', CENTRE.x);
    n.cap.setAttribute('y', capUp ? CENTRE.y - R - margin * 0.5 : CENTRE.y + R + margin * 0.72);
  });

  if (!SHAFT) return;
  const reach = edge + SHAFT_OVERRUN;
  const seg = (r) => wide
    ? { x: CENTRE.x + dir * r, y: CENTRE.y }
    : { x: CENTRE.x, y: CENTRE.y + dir * r };
  const a = seg(R), b = seg(reach);
  for (const [node, w] of [[SHAFT_LINE, SHAFT_INK], [SHAFT_HIT, R * SHAFT_TARGET]]) {
    node.setAttribute('x1', a.x); node.setAttribute('y1', a.y);
    node.setAttribute('x2', b.x); node.setAttribute('y2', b.y);
    node.setAttribute('stroke-width', w);
  }

  /* The label names WHAT IS AT THE OTHER END, not merely that there is one -- the
     free port over there is the reason to go, and it is the port the readout is
     already quoting a speed and an inertia for. Both come off MODE, so neither
     can go on describing a grounding the page has left.

     IT IS THE LONGEST OF THREE PHRASINGS THAT FITS THE STUB THAT IS ACTUALLY ON
     SCREEN, measured with getComputedTextLength rather than estimated from the
     character count. The band is 405px long beside a 1440x900 desk window and
     133px beside a square one, so a single phrasing is either cut in half at one
     of those or needlessly terse at the other. Ordered most to least informative
     and the last one always wins if nothing fits, because a stub with no note at
     all is a dashed line to nowhere.

     THE BUDGET IS THE BAND LESS WHATEVER IS DRAWN OVER IT. The chrome strip
     floats on top of the stage rather than beside it (CL#156), so the room the
     drawing actually has along the axis the shaft leaves by is the window less
     that strip -- but only when the shaft leaves by the bottom, which is portrait
     with the far set below. Its height is read rather than assumed for the same
     reason `edge` is: it is a wrapped flex row over a safe-area inset, so its
     height is whatever the device made it. */
  /* THE ARROW IS A GLYPH INSIDE A ROTATED LABEL, so in portrait the rotation
     points it and the character must not: the label is turned 90 degrees to read
     along the stub, and a '↑' turned with it renders pointing LEFT. A '→' turned
     by +90 renders as '↓' and by -90 as '↑', which is the direction of travel in
     both cases -- so the rotated branch always writes '→' and only the unrotated
     one chooses. Caught in a screenshot and not by any measurement here: every
     number about this label was right while it pointed the wrong way. */
  const arrow = wide ? (dir > 0 ? '→' : '←') : '→';
  const port = portOf(far);
  const blocked = (wide || dir < 0) ? 0 : chromeEl.offsetHeight / scale;
  /* The text starts at R + GAP and must end before the usable edge, so the room
     it has is that span and not the whole band -- one GAP, at the near end where
     the text actually begins, and not one at each end. */
  const room = edge - blocked - (R + SHAFT_LABEL_GAP);
  const said = 'ONE SHAFT ' + arrow;
  const there = ' SET ' + (far + 1);
  let out = true;
  for (const text of [said + there + (port ? ' · ' + port.label : ''), said + there, said]) {
    SHAFT_LABEL.textContent = text;
    out = SHAFT_LABEL.getComputedTextLength() <= room;
    if (out) break;
  }

  /* Placed hard against the rim and reading OUTWARD along the stub, rather than at
     the middle of the run: at the middle it runs off the frame in a near-square
     window, and in portrait with the shaft leaving downward the middle is behind
     the chrome. Against the rim it is neither, at every viewport.

     AND IF EVEN THE SHORTEST PHRASING WILL NOT FIT, IT READS INWARD INSTEAD --
     back across the ring's own rim, where --muted on the rim's --chip fill is
     legible and, more to the point, guaranteed to be on screen, because the gear
     always is. That is the near-square window: 10.7 units of band against 17.8
     units of the shortest label there is, so no phrasing exists that fits and the
     choice is between overlapping the wheel and being cut in half by the frame.
     One flag decides the anchor point and which end of the text is pinned, so the
     two cases cannot disagree about which way the words run. */
  const along = R + (out ? SHAFT_LABEL_GAP : -SHAFT_LABEL_GAP);
  if (wide) {
    /* Unrotated, so the text advances along +x whichever way the shaft points and
       the anchor has to carry the direction: a shaft leaving to the LEFT reading
       outward is text that ENDS at the anchor. Both flips matter and they compose
       -- reading inward reverses it again. */
    SHAFT_LABEL.setAttribute('text-anchor', (dir > 0) === out ? 'start' : 'end');
    SHAFT_LABEL.setAttribute('x', CENTRE.x + dir * along);
    SHAFT_LABEL.setAttribute('y', CENTRE.y - SHAFT_LABEL_GAP);
    SHAFT_LABEL.setAttribute('transform', '');
  } else {
    /* Turned to read down the stub going down and up the stub going up, which is
       the ordinary convention for a vertical label and also the direction of
       travel. The baseline is offset so the GLYPHS clear the dashed line rather
       than the baseline doing -- they fall on the +x side under rotate(90) and
       the -x side under rotate(-90), so the offset has to flip with it. */
    const lx = CENTRE.x + (dir > 0 ? SHAFT_LABEL_GAP : SHAFT_FONT + SHAFT_LABEL_GAP);
    const ly = CENTRE.y + dir * along;
    /* HERE THE ROTATION ALREADY CARRIES THE DIRECTION, so the anchor must NOT --
       rotate(90) advances the text downward and rotate(-90) upward, which is
       outward in both cases, so `dir` is deliberately absent from this line. It
       was present once, copied from the landscape branch above, and the label ran
       back down over its own gear: the two branches look symmetrical and their
       anchors are not. */
    SHAFT_LABEL.setAttribute('text-anchor', out ? 'start' : 'end');
    SHAFT_LABEL.setAttribute('x', lx);
    SHAFT_LABEL.setAttribute('y', ly);
    SHAFT_LABEL.setAttribute('transform', 'rotate(' + (dir > 0 ? 90 : -90) + ' ' + lx + ' ' + ly + ')');
  }
  SHAFT.setAttribute('aria-label', 'Follow the one shaft to set ' + (far + 1)
    + ' of ' + MODE.stages.length + (port ? ', whose free port is the ' + port.member : '') + '.');
}

/* ================================================================== THE LOOP
   ONE state: the sun's angle and its rate. Everything drawn is a multiple of
   the angle, so nothing can drift out of mesh -- there is nothing to drift
   from. No transition, no CSS animation, no per-body timer (#3). */
const S = {
  angle: 0,          /* radians of the INPUT PORT -- stage 1's sun with the rings
                        grounded, stage 1's ring with the suns grounded. The one
                        generalised coordinate either way, which is why nothing
                        below this line has to know which member it is. */
  rate: 0,           /* rad/s of the same */
  grip: null         /* { port, target } while a finger is down */
};

function applyTransforms() {
  for (const m of MOVERS) {
    const a = (S.angle * m.rate + (m.phase || 0)) * 180 / Math.PI;
    m.node.setAttribute('transform',
      m.offsetX !== undefined
        ? 'translate(' + m.offsetX.toFixed(3) + ',0) rotate(' + a.toFixed(3) + ')'
        : 'rotate(' + a.toFixed(3) + ')');
  }
}

let last = 0;
function step(now) {
  requestAnimationFrame(step);
  if (!last) { last = now; return; }
  const dt = Math.min((now - last) / 1000, 0.05);   /* a backgrounded tab must
                                                       not integrate a 4s jump */
  last = now;
  if (dt <= 0) return;

  /* The hand, as a generalised force. A torque applied at a port maps onto the
     input-port coordinate by dividing by that port's gear ratio, and the port's
     own angle is the coordinate's divided by the same -- which is where the
     SQUARE comes from, without it ever being written as a square.

     THE SQUARE IS THE PRODUCT OF THOSE TWO DIVISIONS, AND gripAdvance() BELOW
     CARRIES EXACTLY ONE OF THEM ON EACH SIDE (GitHub #158). Dividing the state by
     the gear on the way in is the second; multiplying the answer by it on the way
     out is the first, mapping the result back onto the coordinate -- once, for the
     spring and the damper alike, because both live in the same port-referred
     equation. This was `/ p.gear` on each of two torque terms before #164 moved
     the arithmetic into closed form, and the failure it is worth remembering is
     the same either way: writing the spring's map as `/ (p.gear * p.gear)` reads
     like the square this comment describes and IS the square applied TWICE. It
     shipped, and it cost the heavy port everything the page is for. The output
     port came out at HAND_FREQ / RATIO^1.5 rather than
     HAND_FREQ / RATIO, its damping ratio at 0.28 * sqrt(RATIO) = 1.09 instead of
     the 0.28 the README claims "at either port" -- so it did not oscillate at
     all, took 6.3 s to reach 90% of a step against 0.47 s, and stalled ~6% short
     of the finger for good, the spring torque having fallen under the Coulomb
     residue. flick() below had the same algebra right all along, so the buttons
     and the drag were demonstrating two different laws.

     THE DAMPER IS THE PROOF, not a second opinion: MODE.damper is
     2 * zeta * sqrt(stiffness * port.inertia), which is critical damping in the
     PORT's own coordinate, and it only yields zeta at the port if the spring is
     mapped by one gear too. The two terms have to divide by the same thing. */
  let v = S.rate;
  let advance = 0;              /* radians the SPRING carries this tick, exactly */
  if (S.grip) {
    const g = gripAdvance(S.grip.port, S.grip.target, dt);
    v = g.rate;
    advance = g.advance;
  }

  /* Losses always act, held or free -- a real grip does not switch the bearings
     off. The clamp is what makes a stop ARRIVE: below one tick's worth of
     retardation there is nothing left to shed, so it is zero rather than an
     ever-smaller residue. */
  const driven = v;
  const drop = retard(Math.abs(v)) * dt;
  v = Math.abs(v) <= drop ? 0 : v - Math.sign(v) * drop;
  if (Math.abs(v) > MAX_SPEED) v = Math.sign(v) * MAX_SPEED;

  /* THE ANGLE, AND THE ONE PLACE THE TWO TERMS MEET. Free of a finger this is the
     trapezoid it has always been: the angle is the integral of the rate, and a
     rectangle rule visibly lags at these decelerations. Under a grip the spring's
     own share of the angle is already exact -- gripAdvance() integrated it in
     closed form rather than stepping it -- so what is left to add is the LOSS's
     share, which is the trapezoid of the change the loss just made to the rate.
     Written this way the free branch is arithmetically the expression it always
     was, so a flick and a coast are untouched by any of this: the closed form is
     reached only while a finger is down, which is the only place the instability
     it fixes could ever appear. */
  S.angle += S.grip ? advance + (v - driven) / 2 * dt
                    : (S.rate + v) / 2 * dt;
  S.rate = v;
  applyTransforms();
}

/* ONE TICK OF THE GRIP, INTEGRATED IN CLOSED FORM RATHER THAN STEPPED (GitHub
   #164). Between two frames the grip is a LINEAR damped oscillator with a
   constant target -- the finger's angle does not move until the next pointer
   event -- so its exact solution over dt is available, and using it is cheaper
   than defending an approximation of it.
   The reason it must be exact rather than merely stable: the spring was stepped
   forward-Euler, which is conditionally stable in `wn * dt`, and at the shipped
   HAND_FREQ that product is 1.0 at 60fps and 2.0 at 30fps. So the TICK, not the
   model, was setting the shape a finger feels -- measured first overshoot 90% at
   60fps against the continuous zeta=0.28's 40% -- and past about 1.3 it diverged
   into a limit cycle bounded only by MAX_SPEED and the losses: at the 0.05s dt
   clamp a 60-degree twist excursioned to 7.5x the finger's angle while the finger
   held still. Low Power Mode throttles rAF to 30fps, which is inside that. A
   clamp on dt was the one fix deliberately not taken -- it buys stability by
   quietly running the machine slow on the device that is already slow.
   THE TWO CONSTANTS ARE READ OFF THE SAME TWO QUANTITIES THE TORQUE WAS, not
   restated from HAND_FREQ and HAND_DAMPING: the port-referred equation is
   `port.inertia * a = stiffness * (target - angle) - damper * rate`, so
   `wn^2 = stiffness / port.inertia` and `2*zeta*wn = damper / port.inertia`
   directly. Nothing here knows the ratio, the grounding or which member is being
   turned, exactly as the explicit version did not.
   All three damping regimes are covered because HAND_DAMPING is a constant a
   future hand may move: under 1 the response is a decaying cosine, over 1 a pair
   of real exponentials (cosh/sinh), and at exactly 1 the sin/wd factor has the
   finite limit dt, which is the one value neither branch can compute. Getting
   that wrong is a NaN into S.angle and a page that never draws again. */
function gripAdvance(p, target, dt) {
  const freqSq = MODE.stiffness / p.inertia;              /* wn^2               */
  const decayRate = MODE.damper(p) / p.inertia / 2;       /* zeta * wn          */
  const gap = decayRate * decayRate - freqSq;             /* wn^2 (zeta^2 - 1)  */
  let cosine, sineOver;                    /* cos(wd*dt) and sin(wd*dt)/wd      */
  if (gap < 0) {
    const wd = Math.sqrt(-gap);
    cosine = Math.cos(wd * dt); sineOver = Math.sin(wd * dt) / wd;
  } else if (gap > 0) {
    const wh = Math.sqrt(gap);
    cosine = Math.cosh(wh * dt); sineOver = Math.sinh(wh * dt) / wh;
  } else {
    cosine = 1; sineOver = dt;
  }
  const decay = Math.exp(-decayRate * dt);
  /* In the PORT's coordinate, measured from the finger: `gapAngle` is how far
     behind the finger the port is and `portRate` how fast it is closing. Both are
     the generalised coordinate divided by the gear, which is the same second
     division the explicit form did on its own first line. */
  const gapAngle = S.angle / p.gear - target;
  const portRate = S.rate / p.gear;
  const gapNext = decay * (gapAngle * cosine + (portRate + decayRate * gapAngle) * sineOver);
  const rateNext = decay * (portRate * cosine - (freqSq * gapAngle + decayRate * portRate) * sineOver);
  /* Back onto the generalised coordinate by multiplying by the gear -- the
     inverse of the division above, so a port with gear 1 is untouched by the
     round trip. The angle is returned as a DELTA and not as a value, because the
     loss term still has its own share to add to the same tick. */
  return { advance: (gapNext - gapAngle) * p.gear, rate: rateNext * p.gear };
}

/* ================================================================== POINTER
   Touch first: a fidget is a phone thing. Pointer events cover mouse, touch and
   pen with one path, and the stage sets touch-action:none so a drag is never
   taken away by the browser's own pan. */
function svgPoint(ev) {
  const m = svg.getScreenCTM();
  if (!m) return null;
  const inv = m.inverse();
  const pt = svg.createSVGPoint();
  pt.x = ev.clientX; pt.y = ev.clientY;
  return pt.matrixTransform(inv);
}

/* THE ONE HIT TEST, and it now answers two questions rather than one. It says
   which PORT is grabbed -- and the whole disc is live rather than the hub alone,
   because a 44px target on a phone is the floor and a sun at these proportions is
   smaller than that on a small screen. By returning null it ALSO says the gesture
   is not on the gear at all, which is what the swipe is gated on.

   That is deliberately the same test and not a second one. The gear fills the
   window now, so a swipe zone written as a region -- the corners, a strip down
   one side, the bottom third -- would be a second opinion about where the gear is,
   drifting out of step with the layout the first time either changed. There is one
   disc, layout() puts it where it is, and everything outside it is the swipe's. */
function portAt(p) {
  const dx = p.x - CENTRE.x, dy = p.y - CENTRE.y;
  return Math.hypot(dx, dy) <= GRAB_RADIUS ? portOf(VIEW) : null;
}

/* Screen y grows downward, so a CCW-positive angle needs y negated. Without
   that the page turns the opposite way to the finger, which is a bug you can
   only see and never reason your way to. */
const angleAt = (p, c) => Math.atan2(-(p.y - c.y), p.x - c.x);

let prevPointerAngle = 0, grabbedCentre = null;

/* THE SWIPE (GitHub #129). Up or down, off the gear, swaps which member is
   grounded. Two things about how it is measured are worth stating, because both
   were choices:

   THE THRESHOLD IS A FRACTION OF THE SHORTER WINDOW EDGE, not a pixel count. A
   swipe is a movement of a hand across a screen, and 80px is a fifth of a phone's
   width against a twelfth of a desk monitor's height -- one number that means two
   gestures. This is the same reasoning index.html's px() exists for.

   IT COMMITS ON MOVE, not on release, so the machine changes under the finger at
   the moment the gesture is unambiguous rather than after the hand has stopped.
   The gesture then disarms, so one drag is one swap however far it goes on.

   SWIPE_BIAS is how much more vertical than horizontal the movement has to be. A
   swipe with no bias test fires on any long diagonal, which is most of what a hand
   actually does when it means "sideways". */
const SWIPE_FRACTION = 0.12;
const SWIPE_BIAS = 1.5;
let swipe = null;

svg.addEventListener('pointerdown', (ev) => {
  const p = svgPoint(ev);
  if (!p) return;
  const port = portAt(p);
  if (!port) {
    /* OFF THE GEAR. The two pointer paths part here and nowhere else, so they
       cannot both claim a gesture -- and the drag path below is reached only when
       this test says the finger is on the disc, exactly as before.
       The shaft stub is excluded because it is a control of its own: a tap on it
       travels along the shaft, and a swipe that began on it would swap the
       grounding out from under a button the finger was aiming at. */
    if (ev.target.closest && ev.target.closest('#shaft')) return;
    swipe = { x: ev.clientX, y: ev.clientY, id: ev.pointerId };
    svg.setPointerCapture(ev.pointerId);
    return;
  }
  const c = CENTRE;
  grabbedCentre = c;
  prevPointerAngle = angleAt(p, c);
  /* The grip starts wherever the body already is, so grabbing a spinning train
     does not snap it -- it takes hold of it. */
  S.grip = { port, target: S.angle / port.gear };
  svg.setPointerCapture(ev.pointerId);
  svg.style.cursor = 'grabbing';
  ev.preventDefault();
});

svg.addEventListener('pointermove', (ev) => {
  if (swipe && ev.pointerId === swipe.id) {
    const dx = ev.clientX - swipe.x, dy = ev.clientY - swipe.y;
    const need = SWIPE_FRACTION * Math.min(window.innerWidth, window.innerHeight);
