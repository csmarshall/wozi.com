          ' A' + cap.toFixed(2) + ',' + cap.toFixed(2) + ' 0 0 1 ' + PT(rO, a0) + ' Z');
        inner.push(h('path', { key: 'sl' + k, d: this.arcD(mid, a0, a1), fill: 'none', stroke: p[3], strokeOpacity: 0.55, strokeWidth: wSlot + 4, strokeLinecap: 'round' }));
        inner.push(h('path', { key: 'sg' + k, d: this.arcD(mid, a0, a1), fill: 'none', stroke: flat ? 'none' : 'var(--gloss)', strokeOpacity: 0.3, strokeWidth: wSlot + 2, strokeLinecap: 'round', transform: 'translate(-0.5,-1)' }));
      }
    };

    if (kind === 'spokes') {
      const arms = g.arms;
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      inner.push(turned('t', hubR * 1.2, faceR - 3, 6));
      inner.push(h('circle', { key: 'sh', r: wellR + 2, fill: 'none', stroke: p[3], strokeOpacity: 0.35, strokeWidth: 2.5 }));
      slots(arms, hubR * 1.5, wellR, 9, 0.72);
    } else if (kind === 'pockets') {
      /* Cut clean through — a blind pocket reads as a failed hole at this scale. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      inner.push(turned('t', hubR * 1.2, faceR - 3, 7));
      inner.push(h('circle', { key: 'sh', r: wellR + 1, fill: 'none', stroke: p[3], strokeOpacity: 0.35, strokeWidth: 2 }));
      slots(g.arms, hubR * 1.35, wellR, 8, 0.8);
    } else if (kind === 'holes') {
      /* Lightening drills, per Charles's rule: an opening must pay for its
         machining -- cuts exist to REMOVE material. The old version drilled
         6-8 small holes hugging the hub with filled counterbores, which read as
         more work than leaving the web solid. Now few and LARGE, as big as the
         spacing allows, seated in the outer web where removed mass actually
         counts -- the bike-chainring / flywheel drilling pattern. */
      const count = g.arms;
      const rInD = Math.max(hubR * 1.5, 9), rOutD = wellR - 2;
      const orbit = rInD + (rOutD - rInD) * 0.58;
      const hr = Math.min((rOutD - rInD) * 0.46, orbit * Math.sin(Math.PI / count) * 0.82);
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      inner.push(h('circle', { key: 'well', r: wellR, fill: 'url(#' + id + 'w)' }));
      inner.push(turned('t', hubR * 1.3, wellR - 2, 5));
      for (let k = 0; k < count; k++) {
        const a = (k / count) * Math.PI * 2, cx = (orbit * Math.cos(a)).toFixed(2), cy = (orbit * Math.sin(a)).toFixed(2);
        holes.push('M' + (+cx + hr) + ',' + cy + ' A' + hr + ',' + hr + ' 0 1 0 ' + (+cx - hr) + ',' + cy + ' A' + hr + ',' + hr + ' 0 1 0 ' + (+cx + hr) + ',' + cy + ' Z');
        /* a thin chamfer ring only -- the machining witness, not decoration */
        inner.push(h('circle', { key: 'h' + k, cx: cx, cy: cy, r: hr + 1.2, fill: 'none', stroke: p[3], strokeWidth: 1.4, strokeOpacity: 0.55 }));
      }
    } else if (kind === 'ring') {
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      inner.push(h('circle', { key: 'well', r: wellR, fill: 'url(#' + id + 'w)' }));
      inner.push(turned('t', hubR * 1.15, wellR - 1, 9));
      inner.push(h('circle', { key: 'grv', r: (wellR + faceR) / 2, fill: 'none', stroke: p[3], strokeOpacity: 0.5, strokeWidth: 2 }));
      inner.push(h('circle', { key: 'grv2', r: (wellR + faceR) / 2 - 1.4, fill: 'none', stroke: flat ? 'none' : 'var(--gloss)', strokeOpacity: 0.4, strokeWidth: 1 }));
      /* Drilled relief holes — round openings are unambiguous geometry, where a narrow
         kidney slot can collapse on a thin web and stop punching. */
      const count = 5, orbit = (wellR + hubR * 1.3) / 2;
      const hr = Math.max(4.5, Math.min((wellR - hubR * 1.3) * 0.34, r * 0.12));
      for (let k = 0; k < count; k++) {
        const a = (k / count) * Math.PI * 2;
        const cx = (orbit * Math.cos(a)).toFixed(2), cy = (orbit * Math.sin(a)).toFixed(2);
        holes.push('M' + (+cx + hr) + ',' + cy + ' A' + hr + ',' + hr + ' 0 1 0 ' + (+cx - hr) + ',' + cy + ' A' + hr + ',' + hr + ' 0 1 0 ' + (+cx + hr) + ',' + cy + ' Z');
        inner.push(h('circle', { key: 'rh' + k, cx: cx, cy: cy, r: hr + 1.6, fill: 'none', stroke: p[3], strokeOpacity: 0.55, strokeWidth: 2.4 }));
      }
    } else if (kind === 'planetary' || kind === 'ravigneaux') {
      /* An epicyclic set inside the wheel, kinematics and MESH both honest.
         Story on the page: the hub badge is the end of the STATIONARY axle, the
         sun is keyed to it, the ring gear is the wheel itself. Sun fixed, ring
         at wheel speed: carrier at Zr/(Zr+Zs), planet spin ZrZs/(Zp(Zr+Zs))
         relative to carrier. Zs=6 Zp=9 Zr=24: Zs+2Zp=Zr and (Zs+Zr)/3 integer,
         so three planets assemble at 120 degrees; the same integer check is why
         one phase constant below serves all three stations.

         Tooth phases are DERIVED, not nudged. Interleave condition (planet
         tooth centred on ring space at each station) gives, in wheel-relative
         element bases with P = the wheel's phase:
           carrier base  = kC*P
           planet  base  = kP*P - pp/2   (pp = planet pitch = 360/Zp)
         both modulo their pitch. First cut used guessed offsets and a sign
         error on the carrier base -- visibly out of mesh, as Charles spotted. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      /* Two dealt gear sets: 3 planets with 9-tooth pinions, or 4 planets with
         a big 18-tooth sun -- both pass (Zs+Zr)%N==0 and adjacency. 4|18 fails,
         so the 4-planet set's phase constants STAGGER per station; the formula
         moved into the loop to carry the kP*A_k term that no longer vanishes. */
      const cvv = g.cv || {};
      const TWO = !!cvv.pg2;
      const PG = TWO ? cvv.pg2 : (cvv.pg || [12, 9, 30, 3]);
      const Zs = PG[0], Zp1 = PG[1], Zp2 = TWO ? PG[2] : PG[1];
      const Zp = Zp1, Zr = TWO ? PG[3] : PG[2], NP = TWO ? PG[4] : PG[3];
      /* Sized from the BORE inward so the ring keeps a real rim: the bore is the
         hole cut in the wheel, the ring root sits 0.75 m2 inside it, and the
         module follows from the ring's tooth count. Sized from Rr outward, as
         this was, the root landed exactly on the bore -- a ring gear with no
         metal behind its teeth. */
      /* Same derivation the deal used to choose this set -- band, then the ring
         under it, then whatever is left. If these two ever disagree, the set was
         chosen for a wheel other than the one being drawn. */
      const bore = planetaryBore(g.teeth);
      const Rr = bore / (1 + 4 / Zr), m2 = 2 * Rr / Zr;
      const Rs = m2 * Zs / 2, Rp = m2 * Zp1 / 2, Rp2r = m2 * Zp2 / 2;
      /* Rc1 comes off the sun mesh, Rc2 off the ring mesh. On a single row the
         two are the same number, since Zr = Zs + 2*Zp -- the two-row layout is
         the general case and the single row its degenerate one. */
      const Rc = Rs + Rp, Rc2 = Rr - Rp2r;
      holes.push('M' + bore.toFixed(2) + ',0 A' + bore.toFixed(2) + ',' + bore.toFixed(2) + ' 0 1 0 -' + bore.toFixed(2) + ',0 A' + bore.toFixed(2) + ',' + bore.toFixed(2) + ' 0 1 0 ' + bore.toFixed(2) + ',0 Z');
      /* The ring is cut as a REAL internal gear, not a ring of trapezoids: the
         same involute curve as every other wheel on the page, but its tooth
         occupies what an external gear leaves as space, so the thickness GROWS
         with radius and the addendum points inward. Cut that way, a planet tooth
         and a ring space are congruent by construction rather than by fitted
         constants. The trapezoid was about a quarter of a module too fat at the
         pitch line and fouled every planet flank it touched.

         The addendum is a 0.70 m2 stub. Our planets run as few as five teeth,
         and a full-depth ring tooth reaches below a planet that small's base
         circle -- where teethPath has no involute left to give and the flank is
         a straight wall. Measured in tools/mesh_epi.js: full depth fouls three
         of the five dealt sets, 0.70 clears all five at every carrier clocking. */
      const phiR = TOOTH_PA * Math.PI / 180, rbR = Rr * Math.cos(phiR);
      const invR = (x) => Math.tan(x) - x;
      const psiR = TOOTH_THICK * Math.PI / Zr;
      const halfR = (R) => (psiR - invR(phiR) + invR(Math.acos(Math.min(1, rbR / R)))) * 180 / Math.PI;
      const ringTip = Rr - m2 * 0.70, ringRoot = Rr + m2 * TOOTH_DED;
      const aR = 360 / Zr, ST = 7;
      let ringD = 'M' + PT(ringRoot, -aR / 2) + ' ';
      for (let k2 = 0; k2 < Zr; k2++) {
        const c = k2 * aR;
        ringD += 'A' + ringRoot.toFixed(2) + ' ' + ringRoot.toFixed(2) + ' 0 0 1 ' + PT(ringRoot, c - halfR(ringRoot)) + ' ';
        for (let s = ST - 1; s >= 0; s--) { const R = ringTip + (ringRoot - ringTip) * (s / ST); ringD += 'L' + PT(R, c - halfR(R)) + ' '; }
        ringD += 'A' + ringTip.toFixed(2) + ' ' + ringTip.toFixed(2) + ' 0 0 1 ' + PT(ringTip, c + halfR(ringTip)) + ' ';
        for (let s = 1; s <= ST; s++) { const R = ringTip + (ringRoot - ringTip) * (s / ST); ringD += 'L' + PT(R, c + halfR(R)) + ' '; }
        ringD += 'A' + ringRoot.toFixed(2) + ' ' + ringRoot.toFixed(2) + ' 0 0 1 ' + PT(ringRoot, c + aR / 2) + ' ';
      }
      ringD += 'Z M' + bore.toFixed(2) + ',0 A' + bore.toFixed(2) + ',' + bore.toFixed(2) + ' 0 1 0 -' + bore.toFixed(2) + ',0 A' + bore.toFixed(2) + ',' + bore.toFixed(2) + ' 0 1 0 ' + bore.toFixed(2) + ',0 Z';
      post.push(h('path', { key: 'epiring', d: ringD, fillRule: 'evenodd', fill: ft.body, stroke: ft.line, strokeWidth: 1, strokeOpacity: 0.6 }));
      /* STAR ARRANGEMENT -- the carrier is grounded to the axle, per the
         physics verification (scratchpad/planetary-physics.md: Willis +
         tabulation, cross-checked; precedent ALF 502 turbofan star box,
         automatics braking the carrier for reverse). Page-frame speeds:
         carrier 0, planets +Zr/Zp = +3.33x spinning IN PLACE on stationary
         studs, sun -Zr/Zs = -2.5x COUNTER-ROTATING -- chosen over sun-grounded
         because there every member co-rotates in a 1.7x band and, in Charles's
         words, the planets move so little. k-factors are relative to the host
         wheel; phase constants are the derived interleave conditions, valid at
         all three stations because 3|Zs and 3|Zr (the strict condition, not
         just 3|(Zs+Zr)). */
      const kC = -1;
      const kP = TWO ? -Zr / Zp1 : Zr / Zp;
      const kP2 = Zr / Zp2;
      /* Single row: the sun opposes the wheel. Two rows: the opposition moves to
         the planet rows, which counter-rotate against each other, and the sun
         comes along with the wheel. */
      const kS = TWO ? (Zr / Zs - 1) : -(1 + Zr / Zs);
      const pp = 360 / Zp, ps = 360 / Zs;
      /* R clocks the whole grounded carrier; substituting (phase - R) for phase
         in the derived constants keeps every mesh condition satisfied at any R,
         because the per-station terms vanish under 3|Zs and 3|Zr. */
      const Q = g.phase - (g.crot || 0);
      const baseC = -Q;
      const basePAt = (A) => (((kP * (Q - A) - pp / 2) % pp) + pp) % pp;
      /* The sun's clocking is the one constant that was WRONG, and wrong in a
         way a still frame hides: the sun would sit tooth-on-tooth with the
         planets on any set where Zs and Zp are both odd, and drift out of mesh
         at every carrier clocking but Q = 0.

         Derived rather than guessed this time. The planet's phase is already
         pinned by the ring mesh, so the sun's only job is to show a space where
         the planet shows a tooth. Write each one's position at the line of
         centres as a fraction of its OWN pitch; an external pair turns opposite
         ways, so that pair of fractions sums to a constant as the set runs, and
         setting the constant to the tooth-into-space value leaves
             baseS = ps * (Zp/2 - Q*(Zs+Zr)/360).
         Zs does not belong in the parity term at all -- whether the planet
         points a tooth or a gap inward depends on Zp alone. The per-station
         term drops out because (Zs+Zr) % N == 0, which is precisely the job the
         assembly condition is in the solver to do. */
      /* TWO ROWS. The inner row is pinned by the sun, the outer by the ring, and
         the pair closes a triangle (Rc, Rc2, Rp+Rp2) -- so the outer planet sits
         at its station angle PLUS dTheta, at a different radius. That offset is
         what lets a pair span an annulus neither row could reach across alone.

         The phases come off the same technique the single row was finally
         derived with, applied down the chain outermost first, because each link
         pins the next: P2 against the ring fixes baseP2 from the station angle;
         P1 against P2 fixes baseP1 (moving-to-moving, which the single row never
         needed); the sun against P1 fixes baseS. Every station pins the sun
         independently and there is only one sun -- so "do all N stations agree"
         IS the assembly condition, and the sets in RAVIGNEAUX_MENU are the ones
         that do, then measured to actually mesh. */
      const d12 = Rp + Rp2r;
      const dTheta = TWO ? Math.acos((Rc * Rc + Rc2 * Rc2 - d12 * d12) / (2 * Rc * Rc2)) * 180 / Math.PI : 0;
      const psiT = TWO ? Math.atan2(Rc2 * Math.sin(dTheta * Math.PI / 180),
                                    Rc2 * Math.cos(dTheta * Math.PI / 180) - Rc) * 180 / Math.PI : 0;
      const a1 = 360 / Zp1, a2 = 360 / Zp2;
      const wrapT = (x, per) => ((x % per) + per) % per;
      const baseP2At = (A) => wrapT(a2 * (-0.5 + Zr * (Q - A - dTheta) / 360), a2);
      const baseP1At = (A) => wrapT(psiT + a1 * ((psiT + 180 - dTheta - baseP2At(A)) * Zp2 / 360 - 0.5), a1);
      const baseS = TWO
        ? wrapT(baseC + ps * ((180 - baseP1At(0)) * Zp1 / 360 - 0.5), ps)
        : (((180 * Zp / Zs - Q * (Zs + Zr) / Zs) % ps) + ps) % ps;
      const epi = (k3, base) => (el) => { if (el && this._epiEls) this._epiEls.push({ el: el, k: k3, base: base, g: g }); };
      /* One station's planet: an arm out to the stud, the gear on it, the stud
         end showing. Shared by both rows so the carrier reads the same either
         way -- the load path is the arm, and it is drawn, not implied. */
      const station = (key, rad, teeth, pitchR, kFac, base, fill) =>
        h('g', { key: key, transform: 'rotate(' + rad.a.toFixed(3) + ')' },
          h('path', { d: 'M0,0 L' + rad.r.toFixed(2) + ',0', stroke: ft.line, strokeWidth: 3, strokeOpacity: 0.85 }),
          h('g', { transform: 'translate(' + rad.r.toFixed(2) + ',0)' },
            h('g', { ref: epi(kFac, base), style: { transform: 'rotate(' + base.toFixed(2) + 'deg)' } },
              h('path', { d: this.teethPath(teeth, pitchR, prof, -1, m2), fill: fill, stroke: ft.line, strokeWidth: 1 })),
            h('circle', { r: 2.4, fill: ft.line })));
      const planets = [];
      for (let k2 = 0; k2 < NP; k2++) {
        const A = k2 * (360 / NP);
        if (TWO) {
          /* The two rows are painted differently on purpose: they turn opposite
             ways, and identical fills would hide the one thing worth seeing. */
          planets.push(station('i' + k2, { a: A, r: Rc }, Zp1, Rp, kP, baseP1At(A), ft.face));
          planets.push(station('o' + k2, { a: A + dTheta, r: Rc2 }, Zp2, Rp2r, kP2, baseP2At(A), ft.well));
        } else {
          planets.push(station('pw' + k2, { a: A, r: Rc }, Zp, Rp, kP, basePAt(A), ft.face));
        }
      }
      post.push(h('g', { key: 'epicarrier', ref: epi(kC, baseC), style: { transform: 'rotate(' + baseC.toFixed(2) + 'deg)' } }, planets));
      post.push(h('g', { key: 'episun', ref: epi(kS, baseS), style: { transform: 'rotate(' + baseS.toFixed(2) + 'deg)' } },
        h('path', { d: this.teethPath(Zs, Rs, prof, -1, m2), fill: ft.well, stroke: ft.line, strokeWidth: 1 })));
    } else if (kind === 'iris') {
      /* Aperture blades: tangential crescents, pointed at both ends. The metal
         between blades is a full-depth curved spoke — nothing floats. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      const nB = g.arms || 6, rInI = Math.max(hubR * 1.6, 10), rOutI = wellR - 2;
      const rmI = (rInI + rOutI) / 2, hd = (rOutI - rInI) / 2;
      for (let k = 0; k < nB; k++) {
        const a0 = (k / nB) * 360, sw = (360 / nB) * 0.7, ST = 8;
        let d2 = '';
        for (let q = 0; q <= ST; q++) {
          const t = q / ST, aa = (a0 + (t - 0.5) * sw) * Math.PI / 180;
          const rr = rmI + hd * Math.sin(Math.PI * t) * 0.95;
          d2 += (q ? 'L' : 'M') + (rr * Math.cos(aa)).toFixed(2) + ',' + (rr * Math.sin(aa)).toFixed(2) + ' ';
        }
        for (let q = ST; q >= 0; q--) {
          const t = q / ST, aa = (a0 + (t - 0.5) * sw) * Math.PI / 180;
          const rr = rmI + hd * Math.sin(Math.PI * t) * 0.35;
          d2 += 'L' + (rr * Math.cos(aa)).toFixed(2) + ',' + (rr * Math.sin(aa)).toFixed(2) + ' ';
        }
        holes.push(d2 + 'Z');
      }
      inner.push(h('circle', { key: 'boss', r: hubR * 1.5, fill: 'url(#' + id + 'u)', stroke: p[3], strokeWidth: 1.2, strokeOpacity: 0.55 }));
    } else if (kind === 'star') {
      /* A star truss: arc-topped windows with straight sides — the first
         straight edges anywhere on the page, welded-plate rather than cast. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      const nS = g.arms || 5, rInS = Math.max(hubR * 1.55, 10), rOutS = wellR - 2;
      const stepS = 360 / nS, gA = stepS * 0.14, gB = stepS * 0.30;
      for (let k = 0; k < nS; k++) {
        const a0 = k * stepS;
        let d2 = '';
        for (let q = 0; q <= 5; q++) {
          const aa = (a0 + gA + (stepS - 2 * gA) * (q / 5)) * Math.PI / 180;
          d2 += (q ? 'L' : 'M') + (rOutS * Math.cos(aa)).toFixed(2) + ',' + (rOutS * Math.sin(aa)).toFixed(2) + ' ';
        }
        d2 += 'L' + PT(rInS, a0 + stepS - gB) + ' L' + PT(rInS, a0 + gB) + ' ';
        holes.push(d2 + 'Z');
      }
      inner.push(h('circle', { key: 'boss', r: hubR * 1.5, fill: 'url(#' + id + 'u)', stroke: p[3], strokeWidth: 1.2, strokeOpacity: 0.55 }));
    } else if (kind === 'honeycomb') {
      /* A hex CORE, the kind that stiffens a rover deck or a robot chassis --
         not one polite orbit of six hexes, which is what this used to be.

         Cells sit in concentric courses, and each course is offset half a cell
         against the one under it, so the walls interlock instead of lining up
         into a radial seam. That stagger is also the load path: every wall meets
         solid metal in the course beside it, and the web runs unbroken hub to
         rim, which is the admission rule.

         Cell SIZE varies by course, and it varies for a reason rather than for
         effect. A course further out has more circumference to spend, so it
         takes more cells only until they would stop being machinable; past that
         it keeps the count and the cells simply grow. Hence an upper bound on
         cells per course, a floor under cell size, and a wall thickness that is
         never negotiated -- a course that cannot hold a real cell is not cut at
         all, so a small blank gets one course and a large one gets three. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      const target = (g.cv && g.cv.cell) || 5.4;
      const rInH = Math.max(hubR * 1.32, 9), rOutH = wellR - 2;
      const WALL = 2.3, CELL_MIN = 2.8;
      /* Courses are as many as the depth can hold at the wanted cell size. */
      const courses = Math.max(1, Math.min(4,
        Math.floor((rOutH - rInH) / (2 * target + WALL))));
      /* Course boundaries step GEOMETRICALLY, not evenly, so each course is
         taller than the one inside it and its cells come out larger. That is
         where the range of sizes comes from, and it comes from the part rather
         than from taste: a course further out has more room, so it gets bigger
         cells, exactly as a hex core on a round part does. */
      const edge = (b) => rInH * Math.pow(rOutH / rInH, b / courses);
      for (let b = 0; b < courses; b++) {
        const r0 = edge(b), r1 = edge(b + 1), rm = (r0 + r1) / 2;
        /* A vertex-out hexagon spans 2*cell radially and sqrt(3)*cell across the
           flats. So the course depth fixes the cell, and the flats then decide
           how many fit -- deriving the count this way is what makes them touch.
           Capping the count instead leaves every cell short of its neighbour and
           the result reads as scattered drillings rather than a core. */
        const cell = (r1 - r0 - WALL) / 2;
        if (cell < CELL_MIN) continue;
        const cols = Math.max(5, Math.floor(2 * Math.PI * rm / (Math.sqrt(3) * cell + WALL)));
        const off = (b % 2) ? 180 / cols : 0;   /* the interlock */
        for (let k = 0; k < cols; k++) {
          const A = off + (k / cols) * 360;
          const cx = rm * Math.cos(A * Math.PI / 180), cy = rm * Math.sin(A * Math.PI / 180);
          let d2 = '';
          for (let v = 0; v < 6; v++) {
            const va = (A + 60 * v) * Math.PI / 180;
            d2 += (v ? 'L' : 'M') + (cx + cell * Math.cos(va)).toFixed(2) + ',' + (cy + cell * Math.sin(va)).toFixed(2) + ' ';
          }
          holes.push(d2 + 'Z');
        }
      }
      inner.push(h('circle', { key: 'boss', r: hubR * 1.5, fill: 'url(#' + id + 'u)', stroke: p[3], strokeWidth: 1.2, strokeOpacity: 0.55 }));
    } else if (kind === 'hexcore') {
      /* A hexagonal patch of hexagons, not a circular crop of them.

         The lattice was always uniform -- measured, spacing held to 0.01 across
         every cell. What read as wrong was the OUTLINE: keeping whole cells
         wherever the grid happened to fall inside a circle leaves a scalloped,
         accidental-looking boundary, and the eye reads that lumpiness as the
         pattern being irregular even though it is not.

         So the field is bounded by the lattice's own geometry instead of by the
         wheel's. Cells are kept by HEX DISTANCE from the centre -- a whole number
         of rings -- which gives a patch with six straight edges and six-fold
         symmetry, matching the cells it is made of. The inner boundary is a ring
         count too, so the hole around the boss is hexagonal rather than a circle
         chewed out of a grid. Both edges end up deliberate.

         The cost is corners: a hexagonal patch inside a round web leaves six
         gaps at its flats. Charles's call, and the right one -- the alternative
         is a ragged edge, and a hexagon of hexagons is plainly a made thing.

         Pointy-top axial coordinates: x = sqrt(3)*step*(q + r/2), y = 1.5*step*r,
         with step = cell + wall/2 so the gap where two cells meet is the wall. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      const WALLX = 1.2, CELL_MIN = 3.1, CELL_MAX = 4.8;
      /* Clear the BOSS, not the hub. The boss disc is drawn at hubR * 1.5 and
         painted over the web, so a lattice that only cleared hubR * 1.1 ran its
         innermost ring underneath it -- half-covered cells, and the ragged inner
         edge the hex-ring boundary was supposed to have got rid of. Every other
         family clears 1.5 or more for the same reason; this one did not. */
      const rInX = Math.max(hubR * 1.5 + WALLX, 7), rOutX = wellR - 0.5;
      const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
      const ringOf = (k) => {
        if (k === 0) return [[0, 0]];
        const out = [];
        let q = DIRS[4][0] * k, r = DIRS[4][1] * k;
        for (let i2 = 0; i2 < 6; i2++) {
          for (let j2 = 0; j2 < k; j2++) { out.push([q, r]); q += DIRS[i2][0]; r += DIRS[i2][1]; }
        }
        return out;
      };
      /* The objective is Charles's, stated plainly: the largest reach of FULL
         hexagons. Not the most cells -- that drove every wheel to the smallest
         cell allowed and turned the core into a dot screen. Not the first size
         to clear a ring target either -- that stopped the search the moment it
         qualified and left a bald band between the outermost cells and the
         engraving. Reach, with whole cells, is the thing worth maximising.

         So: walk every size from this wheel's ceiling down to the legibility
         floor, build the complete-ring patch each one gives, and keep whichever
         patch gets furthest out. Larger cells win ties, so a size only gets
         smaller if that actually buys reach.

         The variant sets the ceiling, and it stays meaningful: a coarse ceiling
         reaches as far as big hexagons can, a fine one gets closer to the rim
         because smaller cells step out in finer increments.

         The six gaps at the patch's flats are now partly recovered -- see the
         exact-vertex keep below, which takes every whole cell that fits rather
         than only those in a complete ring. What remains cannot be removed by
         any search that refuses to cut a cell: a hexagon inscribed in a circle
         falls short by 1 - cos(30), about 13% of the radius, and on most wheels
         the leftover at the flats is narrower than one whole hexagon. Filling
         it completely needs a pattern defined BY the annulus rather than
         clipped to it, which is what polarbrick and polariso are for. */
      const ceiling = Math.min((g.cv && g.cv.cell) || CELL_MAX, CELL_MAX);
      let cellX = 0, kMin = 0, kMax = -1, bestReach = -1;
      for (let c = ceiling; c >= CELL_MIN; c -= 0.05) {
        const step = c + WALLX / 2, px = Math.sqrt(3) * step, ry2 = 1.5 * step;
        const at = (q, r) => [px * (q + r / 2), ry2 * r];
        let hi = -1;
        for (let k = 0; k <= 14; k++) {
          let fits = true;
          for (const [q, r] of ringOf(k)) {
            const P = at(q, r);
            if (Math.hypot(P[0], P[1]) + c > rOutX) { fits = false; break; }
          }
          if (!fits) break;
          hi = k;
        }
        if (hi < 0) continue;
        let lo = 0;
        for (let k = 0; k <= hi; k++) {
          let clear = true;
          for (const [q, r] of ringOf(k)) {
            const P = at(q, r);
            if (Math.hypot(P[0], P[1]) - c < rInX) { clear = false; break; }
          }
          if (clear) { lo = k; break; }
          lo = k + 1;
        }
        if (lo > hi) continue;
        /* how far the outermost complete ring actually gets: its corner cells */
        let reach = 0;
        for (const [q, r] of ringOf(hi)) {
          const P = at(q, r);
          reach = Math.max(reach, Math.hypot(P[0], P[1]) + c);
        }
        if (reach > bestReach + 1e-9) { bestReach = reach; cellX = c; kMin = lo; kMax = hi; }
      }
      if (cellX) {
        /* THE SIZE is chosen by complete rings above, but the KEEP is exact.
           Charles, looking at a GitHub wheel: "isn't there space for even a few
           more hexagons on each side between the side of the shape and the
           curve of the inner circle". Measured across all twelve wheel-and-
           variant combinations, ten genuinely have no room -- the gap at the
           flats is real but narrower than a whole cell. Two do: 15T coarse by
           six cells, 19T fine by twelve.

           Those were being rejected by a test that asks `distance + c > rOut`,
           which treats every hexagon as a CIRCLE of radius c. A hexagon only
           reaches c toward its six vertices; everywhere else it is shorter, by
           up to 1 - cos(30). So cells that genuinely fit were being refused.
           The keep below tests the six VERTICES instead, and takes every whole
           cell that clears -- not only those in a complete ring.

           This cannot cost symmetry, which is the property that matters here:
           the lattice is six-fold symmetric about the centre and the test
           depends only on distance from it, so the kept set is closed under a
           60-degree rotation. A cell that fits guarantees its five partners
           fit. The patch gains symmetric bumps at the flats rather than an
           asymmetric edge -- and no cell is ever cut. */
        const step = cellX + WALLX / 2, px = Math.sqrt(3) * step, ry2 = 1.5 * step;
        const vertsX = (cx, cy) => {
          const o = [];
          for (let v = 0; v < 6; v++) {
            const va = (90 + 60 * v) * Math.PI / 180;
            o.push([cx + cellX * Math.cos(va), cy + cellX * Math.sin(va)]);

            if (nearestEdge(V) < rInX) continue;   /* EDGE, not vertex (#45) */
            let d2 = '';
            for (let v = 0; v < 6; v++) {
              d2 += (v ? 'L' : 'M') + V[v][0].toFixed(2) + ',' + V[v][1].toFixed(2) + ' ';
            }
            holes.push(d2 + 'Z');
          }
        }
      }
      amShells(inner);
      inner.push(h('circle', { key: 'boss', r: hubR * 1.5, fill: 'url(#' + id + 'u)', stroke: p[3], strokeWidth: 1.2, strokeOpacity: 0.55 }));
    } else if (kind === 'isogrid') {
      /* Equilateral triangles on a true Cartesian lattice -- the isogrid pattern
         real stiffened hardware uses, and the one Charles picked for covering the
         most area while every cell stays a proper equilateral triangle.

         SYMMETRY IS THE REQUIREMENT, not the boundary shape. The earlier
         ring-course honeycomb was rejected for lacking it: its walls between
         courses never lined up with the walls within a course. A triangular
         lattice centred on a LATTICE VERTEX has exact six-fold symmetry, so
         clipping it to a circle leaves a boundary that is six-fold too -- it
         steps, but it steps identically in all six sextants, which is what the
         eye actually reads as regular.

         Whole cells only, so no triangle is ever cut. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));

         what they put in a course: annular cells laid like brickwork, or a

              holes.push('M' + t.map(q2 => (cx2 + (q2[0] - cx2) * shrink).toFixed(2) + ','
                                         + (cy2 + (q2[1] - cy2) * shrink).toFixed(2)).join(' L') + ' Z');
            }
          }
        }
      }
      amShells(inner);
      inner.push(h('circle', { key: 'boss', r: hubR * 1.5, fill: 'url(#' + id + 'u)', stroke: p[3], strokeWidth: 1.2, strokeOpacity: 0.55 }));
    } else if (kind === 'labyrinth') {
      /* Two staggered rings of arc slots, brake-rotor fashion. The stagger is
         the load path: every slot's ends land on solid metal in the other ring. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      const nL = g.arms || 5, rInL = Math.max(hubR * 1.55, 10), rOutL = wellR - 2;
      /* Ring count adapts to the annulus: three staggered rows where the depth
         allows (the big wheels), two where it does not -- Charles spotted that
         three fit and asked why they were not there. Slot width scales down as
         rows go up so every row keeps solid metal beside it. */
      const depthL = rOutL - rInL;
      const rowsL = depthL > 24 ? 3 : 2;
      const wL = Math.min(6, depthL * (rowsL === 3 ? 0.15 : 0.22));

            d2 += (q ? 'L' : 'M') + ((rr + wL / 2) * Math.cos(aa)).toFixed(2) + ',' + ((rr + wL / 2) * Math.sin(aa)).toFixed(2) + ' ';
          }
          for (let q = 5; q >= 0; q--) {
            const aa = (a0 + sw * (q / 5)) * Math.PI / 180;

        ring(rInL + depthL * 0.52, nL + 2, 360 / (nL + 2) / 2);
        ring(rInL + depthL * 0.84, nL + 5, 0);

        ring(rInL + depthL * 0.3, nL, 0);
        ring(rInL + depthL * 0.72, nL + 3, 360 / (nL + 3) / 2);
      }
      inner.push(h('circle', { key: 'boss', r: hubR * 1.5, fill: 'url(#' + id + 'u)', stroke: p[3], strokeWidth: 1.2, strokeOpacity: 0.55 }));
    } else if (kind === 'geneva') {
      /* Geneva-plate slots: radial stadium cuts with an end drill, leaving a
         Maltese cross of metal. The drill is real practice — it stops cracks. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      const nG = g.arms || 4, rInG = Math.max(hubR * 1.6, 10), rOutG = wellR - 2;

      const er = Math.min(7, (rOutG - rInG) * 0.26), wG = er * 1.35;

          ' A' + er + ',' + er + ' 0 1 0 ' + (ex - er).toFixed(2) + ',' + ey.toFixed(2) +

    } else if (kind === 'sunburst') {
      /* Every window cut to the SAME depth, per Charles. Alternating long and
         short read as decoration applied to a wheel; one depth leaves the metal
         plainly what it is -- a fan of tapered spokes running hub to rim, and
         nothing else. The windows also start closer in than they did, so the
         spokes converge on the boss rather than stopping short of it. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      /* Stops at the boss edge rather than under it: the spokes still converge on
         the boss, which is what was wanted, without windows running beneath a
         disc that is painted on top of them. */
      const nR = g.arms || 10, rInR = Math.max(hubR * 1.5, 9), rOutR = wellR - 2;

      inner.push(h('circle', { key: 'boss', r: hubR * 1.5, fill: 'url(#' + id + 'u)', stroke: p[3], strokeWidth: 1.2, strokeOpacity: 0.55 }));
    } else {
      /* Spiral web (was the plain wheel): slots wound like a lathe's scroll
         chuck, each converging from the well onto the hub. Cut clean through
         like every other opening — #14's rule, a milled pocket at this scale
         reads as a failed punch. The arms never meet: at any radius they sit a
         full 360/arms apart, so the even-odd fill cannot self-intersect. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      /* A believable curved-spoke wheel, not a coil: each slot sweeps ~0.3 of a
         turn from hub to well, like a cast handwheel's arms. Winding further
         (1.15 turns was tried) leaves rim and hub joined by nothing but a thin
         ribbon — no real wheel could hold, and it reads that way (#14's ethos:
         the machine has to be possible). */
      const armsN = g.arms || 3, spTurns = (g.cv && g.cv.sweep) || 0.3;
      const spW = Math.max(4, m * 0.55);
      const spOut = wellR - spW * 0.8, spIn = hubR * 1.55;
      for (let k = 0; k < armsN; k++) {
        const base = (k / armsN) * 360;

          const rr = spIn + (spOut - spIn) * f + off;
          const aa = (base + f * spTurns * 360) * Math.PI / 180;

    }
    const arc = (rad, from, to) => {
      const a0 = from * Math.PI / 180, a1 = to * Math.PI / 180;
      return 'M' + (rad * Math.cos(a0)).toFixed(2) + ',' + (rad * Math.sin(a0)).toFixed(2) +

      h('defs', null,
        /* All shading is symmetric about the vertical axis — lit from above, never from
           a corner — so concentric webs and hubs read as centred. */
        h('linearGradient', { id: id + 'f', x1: '50%', y1: '0%', x2: '50%', y2: '100%' },
          flat ? h('stop', { offset: '0%', stopColor: ft.body }) :
          h('stop', { offset: '0%', stopColor: p[0] }),
          h('stop', { offset: '24%', stopColor: flat ? ft.body : p[1] }),
          h('stop', { offset: '48%', stopColor: flat ? ft.body : p[2] }),
          h('stop', { offset: '68%', stopColor: flat ? ft.body : p[1] }),
          h('stop', { offset: '100%', stopColor: flat ? ft.body : p[3] })),
        h('radialGradient', { id: id + 'w', cx: '50%', cy: '34%', r: '78%' },
          flat
            ? [h('stop', { key: 'a', offset: '0%', stopColor: ft.well }),
               h('stop', { key: 'b', offset: '100%', stopColor: ft.well })]
            : [h('stop', { key: 'a', offset: '0%', stopColor: p[2] }),
               h('stop', { key: 'b', offset: '62%', stopColor: p[3] }),
               h('stop', { key: 'c', offset: '100%', stopColor: p[2] })]),
        h('radialGradient', { id: id + 'u', cx: '50%', cy: '30%', r: '80%' },
          flat
            ? [h('stop', { key: 'a', offset: '0%', stopColor: ft.face }),
               h('stop', { key: 'b', offset: '100%', stopColor: ft.face })]
            : [h('stop', { key: 'a', offset: '0%', stopColor: p[0] }),
               h('stop', { key: 'b', offset: '55%', stopColor: p[1] }),
               h('stop', { key: 'c', offset: '100%', stopColor: p[3] })]),
        h('radialGradient', { id: id + 'd', cx: '50%', cy: '32%', r: '80%' },

        /* Two reading arcs on the solid band: the handle across the top, the machining

          background: this.state.theme === 'dark' ? '#DFE2DE' : '#CCCEC9',
          color: on ? 'var(--accent)' : 'var(--ink)',
          border: '1px solid rgba(20,30,35,.14)', boxShadow: '0 3px 10px rgba(8,16,20,.28)', zIndex: 5, cursor: 'pointer',
          transform: 'translate(-50%,-50%)' + (bo ? ' translate(' + bo.x.toFixed(1) + 'px,' + bo.y.toFixed(1) + 'px)' : '') + ' scale(' + (on ? 1.06 : 1) + ')',
          transition: 'transform .22s cubic-bezier(.34,1.56,.64,1), color .2s ease, '
            + 'width .26s cubic-bezier(.22,1,.36,1), left .26s cubic-bezier(.22,1,.36,1)'
        }
      };
    });

    return {
      gearArt: gearArt,
      links: links,
      colRef: this._colRef,
      stageRef: this._stageRef,
      onGrab: (e) => this.onGrab(e),
      /* Keyboard drive (#25): each arrow press is an impulse into the same
         flywheel the pointer drag feeds — the physics does everything else,
         including reversing the train when driven against its direction. Works
         under prefers-reduced-motion too: a key press is a deliberate act, and
         friction returns the machine to rest afterwards (#3). */
      onStageKey: (e) => {
        if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
        e.preventDefault();
        const dir = e.key === 'ArrowRight' ? 1 : -1;
        this._dirSign = dir;
        this._v = Math.max(-8, Math.min(8, this._v + dir * 1.6));
      },
      onStageEnter: () => { if (this.props.hoverDrag) this.setState({ overStage: true }); },
      onStageLeave: () => { if (this.state.overStage) this.setState({ overStage: false }); },
      stageStyle: { position: 'relative', flex: '0 0 auto', width: (solved.w * S) + 'px', height: (solved.h * S) + 'px', cursor: 'grab', touchAction: 'none' },

      themeLabel: this.state.theme === 'dark' ? 'Switch to light' : 'Switch to dark',
      /* Table of Gears (Charles's 'TOG'): a hidden browse menu over the same
         ?kind= force mode the contact sheets use. Selecting an entry navigates,
         so the proven deal path does all the work; theme and motion choices
         ride along in localStorage. display:none while closed keeps it out of
         the tab order and the accessibility tree. */
      toggleTog: () => this.setState({ tog: !this.state.tog }),
      togLabel: this.state.tog ? 'Close the table of gears' : 'Browse the table of gears',
      togExpanded: this.state.tog ? 'true' : 'false',
      /* A cogwheel, not a sun: the first draft was circle-plus-rays, which sat
         two buttons from the light-theme sun and read as its twin (Charles).
         Now an annulus with a hub hole and six WIDE tooth stubs butting the
         ring -- thin long rays say sun, fat short teeth say gear. */
      togIcon: h('svg', { 'aria-hidden': 'true', focusable: 'false', width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeLinecap: 'butt' },
        h('circle', { cx: 12, cy: 12, r: 6.1, strokeWidth: 1.7 }),
        h('circle', { cx: 12, cy: 12, r: 2.4, strokeWidth: 1.5 }),
        h('path', { strokeWidth: 3, d: 'M12 5.9V3.4M12 18.1v2.5M6.72 8.95l-2.17-1.25M19.45 16.3l-2.17-1.25M6.72 15.05l-2.17 1.25M19.45 7.7l-2.17 1.25' })),
      togPanelStyle: {
        display: this.state.tog ? 'flex' : 'none', flexDirection: 'column', gap: '2px',
        position: 'fixed', left: 'var(--offleft)', top: '50%', transform: 'translateY(-50%)',
        zIndex: 30, background: 'var(--chip)', border: '1px solid var(--hair)',
        borderRadius: '14px', padding: '10px 6px', boxShadow: 'var(--shadow)', minWidth: '190px'
      },
      togList: (function () {
        const names = { spokes: 'Spoke slots', holes: 'Lightening drills', pockets: 'Kidney pockets',
          spiral: 'Curved spokes', iris: 'Iris blades', star: 'Star truss', honeycomb: 'Honeycomb',
          labyrinth: 'Labyrinth rotor', sunburst: 'Sunburst', planetary: 'Planetary (star gear)',
          hexcore: 'Hex core', ravigneaux: 'Ravigneaux (double row)',
          isogrid: 'Isogrid', polarbrick: 'Radial brickwork', polariso: 'Radial isogrid' };
        const item = (key, label) => {
          const active = key ? FORCE_KIND === key : !FORCE_KIND;
          return {
            href: key ? '?kind=' + key : (location.pathname || '/'),
            label: label, current: active ? 'true' : 'false',
            style: { display: 'block', padding: '7px 12px', borderRadius: '9px', textDecoration: 'none',
              font: "600 13px/1.3 'Manrope',system-ui,sans-serif",
              color: active ? 'var(--bg)' : 'var(--ink)',
              background: active ? 'var(--accent)' : 'transparent' }
          };
        };
        /* THE PERSON PICKER LIVES HERE, and only appears when there is someone
           to pick. With one chain configured this loop adds nothing at all, so
           the page is byte-identical to what it was before people existed --
           which is the whole reason the picker was built now rather than later:
           adding a person becomes a config edit, with no page work.

           Plain `?who=` links, exactly like the gear entries above, because the
           hostname already decides the default. Switching person is a
           navigation, not state -- the tooth deal, the colour deal and the
           centre deal all run at load, so a fresh document is the correct way
           to change which chain is on stage. */
        const people = CONF.PEOPLE || [];
        const out = [];
        if (people.length > 1) {
          people.forEach(p => {
            const active = WHO.slug === p.slug;
            out.push({
              href: '?who=' + p.slug, label: p.name, current: active ? 'true' : 'false',
              style: { display: 'block', padding: '7px 12px', borderRadius: '9px',
                textDecoration: 'none', font: "700 13px/1.3 'Manrope',system-ui,sans-serif",
                color: active ? 'var(--bg)' : 'var(--ink)',
                background: active ? 'var(--accent)' : 'transparent' }
            });
          });
          out.push({
            href: '', label: '', current: 'false',
            style: { display: 'block', height: '1px', margin: '6px 10px',
              background: 'var(--hair)', pointerEvents: 'none' }
          });
        }
        out.push(item(null, 'Mixed deal (default)'));
        CENTRE_FAMILIES.forEach(f => {
          out.push(item(f.type, names[f.type] || f.type));
          /* The double row rides directly under the single, since it is the same
             family seen through a narrower pool rather than a family of its own. */
        });
        /* Candidates last, marked, so the menu doubles as the review sheet. */
        CANDIDATE_FAMILIES.forEach(f => out.push(item(f.type, (names[f.type] || f.type) + '  · candidate')));
        return out;
      })(),
      toggleMotion: () => {
        const next = this.motionActive() ? 'rest' : 'run';
        try { localStorage.setItem('wozi-motion', next); } catch (e) {}
        this.setState({ motion: next });
      },
      motionLabel: this.motionActive() ? 'Pause the machine' : 'Run the machine',
      motionPressed: this.motionActive() ? 'true' : 'false',
      motionIcon: this.motionActive()
        ? h('svg', { 'aria-hidden': 'true', focusable: 'false', width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8, strokeLinecap: 'round' },
            h('path', { d: 'M9 5v14M15 5v14' }))
        : h('svg', { 'aria-hidden': 'true', focusable: 'false', width: 20, height: 20, viewBox: '0 0 24 24', fill: 'currentColor', stroke: 'currentColor', strokeWidth: 1.4, strokeLinejoin: 'round' },
            h('path', { d: 'M8 5.5v13l11-6.5z' })),
      themeIcon: this.state.theme === 'dark'
        ? h('svg', { 'aria-hidden': 'true', focusable: 'false', width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8, strokeLinecap: 'round' },
            h('circle', { cx: 12, cy: 12, r: 4.4 }),
            h('path', { d: 'M12 2.6v2.6M12 18.8v2.6M2.6 12h2.6M18.8 12h2.6M5.4 5.4l1.9 1.9M16.7 16.7l1.9 1.9M18.6 5.4l-1.9 1.9M7.3 16.7l-1.9 1.9' }))
        : h('svg', { 'aria-hidden': 'true', focusable: 'false', width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8, strokeLinejoin: 'round' },
            h('path', { d: 'M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z' })),
      toggleTheme: () => {
        const next = this.state.theme === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('wozi-theme', next); } catch (e) {}
        this.apply(next);
      },
      brandName: brand.name,
      brandTld: brand.tld
    };
  }
}
</script>
</body>
</html>
