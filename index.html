<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%233B7DE8'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E" />
<title>wozi.com</title>
<style>
:root{
  /* The page background is deliberately off a bright white. #F1F2F0 sat at 0.885
     luminance, which is a lot of glare full-screen and left the #FFFFFF badges
     almost nothing to separate from (1.12:1). At 0.817 the badges lift to 1.21:1
     and the ink still clears 11:1. --muted darkens with it so the wordmark TLD,
     which is large text on this colour, stays above the 3:1 floor (#16). */
  --bg:#E8EAE5; --ink:#20302E; --muted:#6B7E7C; --hair:#D5DAD6; --chip:#FFFFFF;
  --accent:#3B7DE8; --shadow:0 1px 2px rgba(20,40,38,.06);
  --m1:#FFFFFF; --m2:#D4DADE; --m3:#98A2A9; --m4:#5F686E;
  --b1:#F7E7BE; --b2:#DFC183; --b3:#B08F45; --b4:#7A5F28;
  --edge:rgba(12,22,28,.38); --gloss:rgba(255,255,255,.8);
  --s:1; --gsm:1; --gsfit:0.86; --gs:calc(var(--gsfit) * var(--gsm));
  --dir:row; --pad:5vw; --gap:4vw; --colw:400px;
  /* Corner spacing is one icon width, so the gap around the theme toggle reads
     the same as the icon it sits next to. The button is larger than its icon and
     centres it, so the button box is pulled in by half that difference — derived
     rather than hardcoded, so changing either size keeps the icon on the mark.
     The wordmark sits on --btnoff, the same offset as the button's box, so the
     two bottom/top corners are inset by the same amount rather than one being
     measured to a box and the other to a glyph. */
  --icon:20px; --btn:44px;
  --corner:var(--icon);
  --btnoff:calc(var(--corner) - (var(--btn) - var(--icon)) / 2);
}
:root[data-theme="dark"]{
  --bg:#1E2226; --ink:#EEF1F0; --muted:#93A5A3; --hair:#373E3D; --chip:#2A3034;
  --accent:#7FA9F0; --shadow:0 1px 2px rgba(0,0,0,.35);
  --m1:#AEB8BF; --m2:#7C858C; --m3:#4E565C; --m4:#2B3135;
  --b1:#D8B978; --b2:#A98844; --b3:#75592A; --b4:#463618;
  --edge:rgba(0,0,0,.6); --gloss:rgba(255,255,255,.38);
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
a{color:var(--accent);text-decoration:none;}
a:hover{color:var(--ink);}
/* The links ARE the content, so a keyboard user who cannot see focus cannot use
   the site at all (#23). :focus-visible keeps the ring off mouse clicks; the
   outline follows each element's own border-radius, so it rings the discs. */
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
/* The train itself rests via the frame loop (#3) — this only stills the UI
   transitions: badge scale, tooltip fade, toggle colour. */
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
@media (max-width:1080px){:root{--gap:2rem;--pad:6vw;}}
@media (max-width:760px){:root{--pad:28px;--colw:100%;}}
@media (max-width:430px){:root{--gap:1.25rem;}}
@keyframes rotate{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes rotate-back{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
@keyframes signsway{from{transform:translate(-50%,0) rotate(-1.2deg)}to{transform:translate(-50%,-14px) rotate(1.2deg)}}
@keyframes chainrun{to{stroke-dashoffset:calc(var(--pitch) * -1)}}
@keyframes chainrun-back{to{stroke-dashoffset:var(--pitch)}}
</style>
</helmet>

<main style="min-height:100vh;box-sizing:border-box;display:flex;flex-direction:var(--dir);align-items:center;justify-content:center;gap:var(--gap);padding:var(--pad);background:var(--bg);overflow:hidden;">

  <button onClick="{{ toggleTheme }}" title="{{ themeLabel }}" aria-label="{{ themeLabel }}" style="position:fixed;top:var(--btnoff);right:var(--btnoff);z-index:20;display:flex;align-items:center;justify-content:center;width:var(--btn);height:var(--btn);padding:0;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;transition:color .18s ease;" style-hover="color:var(--ink);">
    {{ themeIcon }}
  </button>

  <div ref="{{ stageRef }}" onPointerDown="{{ onGrab }}" onPointerEnter="{{ onStageEnter }}" onPointerLeave="{{ onStageLeave }}" style="{{ stageStyle }}">
    {{ gearArt }}
    <sc-for list="{{ links }}" as="link" hint-placeholder-count="7">
      <a href="{{ link.href }}" aria-label="{{ link.label }}" onMouseEnter="{{ link.enter }}" onMouseLeave="{{ link.leave }}" onFocus="{{ link.enter }}" onBlur="{{ link.leave }}" style="{{ link.discStyle }}">
        {{ link.iconEl }}
        {{ link.tipEl }}
      </a>
    </sc-for>

  </div>

  <div ref="{{ colRef }}" style="position:fixed;left:var(--btnoff);bottom:var(--btnoff);z-index:15;">
    <h1 style="margin:0;display:flex;align-items:baseline;gap:2px;font-weight:800;font-size:clamp(30px,4.6vw,54px);letter-spacing:-0.045em;line-height:1;color:var(--ink);">
      <span>{{ brandName }}</span>
      <span style="width:.16em;height:.16em;border-radius:50%;background:var(--accent);align-self:flex-end;margin-bottom:.14em;"></span>
      <span style="color:var(--muted);font-weight:600;">{{ brandTld }}</span>
    </h1>
  </div>
</main>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;domain&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Wordmark&quot;},&quot;frameRate&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[60,30,24,20],&quot;default&quot;:30,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Gears&quot;},&quot;spinUp&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layers&quot;},&quot;engravedRims&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layers&quot;},&quot;parallax&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layers&quot;},&quot;character&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layers&quot;},&quot;hoverDrag&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layers&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.25,&quot;max&quot;:2,&quot;step&quot;:0.25,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Gears&quot;},&quot;gearScale&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.5,&quot;max&quot;:1.3,&quot;step&quot;:0.05,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Gears&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#5F686E&quot;,&quot;#E8483A&quot;,&quot;#3B7DE8&quot;,&quot;#F4B32B&quot;,&quot;#1FA463&quot;],&quot;default&quot;:&quot;#5F686E&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Gears&quot;},&quot;shuffle&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Gears&quot;}}">
const MODULE = 7;

/* Tooth form. Uniform across the train and derived from the module — never set
   per wheel. Per-wheel `add` and `tip` were the #15 mistake repeated on the tooth
   profile: a set maintained by judgement drifts, and this one had drifted into a
   train where some pairs collided and others left a visible gap (#11).

   Measured against the real outlines at all six adjacent pairs:
     as shipped (base 66%, add 0.88-1.05, tip 0.31-0.40)
       4 points of one wheel's outline inside its neighbour's, up to 1.42px deep
     this form
       0 penetrating points, 1.76px of clearance at the mesh

   The tooth had been a fat wedge — 66% of the circular pitch at the root tapering
   to 31-40% at the tip — and it is fat roots that collide as they swing through
   mesh. Narrowing the base to 48% removes the interference at the same engagement
   depth. These values sit on a plateau (44-48% base and 0.34-0.36 tip all measure
   clean), so the result is not balanced on a knife edge. Raising the addendum to
   0.95 or the base to 52% brings contact straight back. */
const TOOTH_PA = 20;      /* pressure angle in degrees — 20 is the modern standard */
const TOOTH_ADD = 1.00;   /* addendum, in modules — standard full-depth */
const TOOTH_DED = 1.25;   /* dedendum, in modules — standard, leaves root clearance */
const TOOTH_THICK = 0.495; /* tooth thickness at the pitch circle, as a fraction of the
                              circular pitch. A real gear is 0.5 exactly and the shortfall
                              is backlash. Measured at all six pairs: 0.495 gives zero
                              interference with 0.11px between the flanks, so they read as
                              touching without anti-aliasing ever fusing them. */
const TOOTH_FILLET = 0.38; /* root fillet radius, in modules — the standard value that
                              goes with 20-degree full depth. Without it the flank meets
                              the root circle at a sharp corner, which no cut gear has. */

const BASE_MS = 21000;
const GHOST_COLORS = ['#9AA6AD', '#A9B4BA', '#8F9BA3', '#B3BCC2'];

const GHOST_KINDS = ['spokes', 'holes', 'pockets', 'ring', 'plain'];
function segCross(p1, p2, p3, p4) {
  const s = (a, b, c) => (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
  return s(p1, p2, p3) * s(p1, p2, p4) < 0 && s(p3, p4, p1) * s(p3, p4, p2) < 0;
}
function segDist(p, a, b) {
  const vx = b.x - a.x, vy = b.y - a.y, L = vx * vx + vy * vy;
  let t = L ? ((p.x - a.x) * vx + (p.y - a.y) * vy) / L : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + t * vx), p.y - (a.y + t * vy));
}
const ENDS_APART = 90; /* extra push between the first and last wheel of the visible run */
const CLEARANCE = 13; /* px kept between the tip circles of wheels that are not meshed */

/* The gear train. Each entry meshes with the one before it:
   teeth  — tooth count (sets size and speed)
   angle  — bearing in degrees from the previous gear's centre
   slug   — icon/link to seat on this gear's hub (omit for a plain idler)
   metal  — 'steel' | 'brass'
   Add or remove an entry and the whole train re-solves: spacing, direction, ratio. */
/* Seven site wheels of near-equal size, each with its own web design.
   `link: 'chain'` (or `'belt'`) drives the next wheel by strand instead of tooth mesh.
   No entry sets one today, so no chain or belt is drawn — see CLAUDE.md,
   "Dormant capability: chain and belt", before re-enabling either. */
/* One directly-meshed train: every wheel drives its neighbour, so spacing is fixed by
   the pitch radii and only the bearing varies — a gentle serpentine, no slack to fold. */
const TRAIN = [
  { teeth: 17, angle: 0, slug: 'linkedin', kind: 'spokes', arms: 5, prof: { rim: 1.7, web: 3.2, hub: 0.2, arm: 0.15 } },
  { teeth: 15, angle: 20, slug: 'github', kind: 'holes', arms: 6, prof: { rim: 1.6, web: 2.9, hub: 0.23, hole: 0.12 } },
  { teeth: 18, angle: -24, slug: 'mastodon', kind: 'pockets', arms: 6, prof: { rim: 2.0, web: 3.1, hub: 0.22 } },
  { teeth: 14, angle: 22, slug: 'instagram', kind: 'ring', prof: { rim: 1.4, web: 2.7, hub: 0.26 } },
  { teeth: 17, angle: -20, slug: 'threads', kind: 'spokes', arms: 4, prof: { rim: 1.7, web: 3.0, hub: 0.26, arm: 0.2 } },
  { teeth: 15, angle: 24, slug: 'bluesky', kind: 'holes', arms: 8, prof: { rim: 1.9, web: 3.2, hub: 0.2, hole: 0.085 } },
  { teeth: 18, angle: -18, slug: 'mail', kind: 'plain', prof: { rim: 1.6, web: 2.6, hub: 0.3 } }
];

/* Wheel colours are derived, never picked. Seven hand-chosen ones had drifted
   into two blues and two greens (#12) — the same failure as the per-wheel `rim`
   values in #15: a set maintained by judgement stops being consistent the moment
   it changes. Spacing hues evenly makes a collision impossible by construction,
   and re-spaces itself if a wheel is added or removed. With seven wheels no two
   are closer than 360/7 ≈ 51°. */
/* Hues are handed out in a STRIDE around the wheel rather than in order. Even
   spacing alone still seats neighbouring hues next to each other, and wheels are
   only ever confused with the ones beside them — in order, the gold, green and
   teal ended up in a row. A stride coprime with the wheel count visits every hue
   exactly once while putting 3 x 51° between neighbours instead of 51°.
   Keep STRIDE coprime with TRAIN.length or hues repeat and wheels collide.

   Three things together make a palette read as a rainbow: perfectly even
   spacing, constant saturation, and hues arriving in order. The stride fixes the
   third; JITTER and the saturation spread fix the other two, so the set reads as
   seven chosen colours rather than a spectrum. Both are bounded, so the spacing
   guarantee survives — worst case across 100k seeds is ~31°, still well clear of
   confusable.

   The whole wheel is rotated by a random offset per load, so the palette differs
   between visits. Computed once at module load and never on resize, so the
   wheels cannot change colour under the pointer — the same reason the background
   machinery seeds from a fixed constant. */
/* One palette cannot serve both themes. A wheel at 0.30 luminance sits 5.3:1
   against the dark page and only 2.5:1 against the light one, so light mode was
   always going to look washed no matter what the shading did -- which is why
   #13, #16, #19 and #20 each moved the problem rather than removing it. Each
   theme now gets its own target: darker wheels for a bright page, lighter for a
   dark one. Same hues, same saturation, same spacing and collision guarantees
   from #12 -- only the value moves. */
/* The colour pool starts with the seven the original template shipped — used
   verbatim, in both themes, exactly as the template did (the per-theme
   difference comes from shades(), not from separate base sets). Three more are
   authored in the same idiom to cover the gaps in its rainbow: orange, teal,
   magenta. Assignment is the only random part: shuffle the pool per load and
   deal one colour to each wheel, so adding wheels later just deals more from
   the pool — up to ten stay distinct, past that it wraps. */
const WHEEL_COLORS = [
  '#4A90E2', '#17A05C', '#8CB8F2', '#E8615A', '#6ECFA6', '#F2C14E', '#9B8CE0',  /* the template's seven */
  '#EC8C4E', '#54BFB6', '#DB79B8'                                               /* gap fill: orange, teal, magenta */
];
const WHEEL_ORDER = WHEEL_COLORS.map((c, i) => i);
for (let i = WHEEL_ORDER.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  const tmp = WHEEL_ORDER[i]; WHEEL_ORDER[i] = WHEEL_ORDER[j]; WHEEL_ORDER[j] = tmp;
}
TRAIN.forEach((t, i) => {
  t.color = WHEEL_COLORS[WHEEL_ORDER[i % WHEEL_COLORS.length]];
});

/* Depth of the engraving band, in modules — uniform on every wheel. */
const BAND_DEPTH = 2.1;

/* Sibling services sit on neighbouring wheels of the train. */
const PAIR_SLOTS = [[0, 1], [3, 4]];
const PAIRS = [['linkedin', 'github'], ['instagram', 'threads']];
const SINGLES = ['mastodon', 'bluesky', 'mail'];

const BRAND = {
  linkedin: '#0A66C2', github: '#24292F', mastodon: '#6364FF',
  instagram: '#E1306C', threads: '#101010', bluesky: '#0285FF', mail: '#E8615A'
};

/* Accent pairs: light value -> dark-mode counterpart.
   The stylesheet already lightens the default blue for dark mode, but syncVars
   writes the accent onto the root element as an inline style, which beats that
   rule — so any accent chosen by prop lost its dark-mode adaptation. Each one
   now carries its own, and syncVars picks per theme.
   'steel' is the machine's own metal, taken from the light --m4 / dark --m1
   tones, so the accent reads as part of the object rather than applied to it. */
const ACCENTS = {
  '#E8483A': '#F4796D',  /* red    */
  '#3B7DE8': '#7FA9F0',  /* blue   */
  '#F4B32B': '#F7C65E',  /* amber  */
  '#1FA463': '#4FC48C',  /* green  */
  '#5F686E': '#AEB8BF'   /* steel  */
};

function shades(hex, soft) {
  const n = parseInt(hex.slice(1), 16);
  const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  const mix = (t, target) => '#' + c.map(v => Math.round(v + (target - v) * t).toString(16).padStart(2, '0')).join('');
  /* Light mode gets a gentler spread so the wheels sit into the page instead of shouting. */
  return soft
    ? [mix(0.5, 255), mix(0.24, 255), mix(0.12, 0), mix(0.3, 0)]
    : [mix(0.55, 255), mix(0.14, 255), mix(0.2, 0), mix(0.42, 0)];
}

const SITES = {
  linkedin: { label: 'LinkedIn', path: '/in/csmarshall', href: 'http://www.linkedin.com/in/csmarshall' },
  github: { label: 'GitHub', path: '/csmarshall', href: 'https://github.com/csmarshall/' },
  mastodon: { label: 'Mastodon', path: '/@cs_marshall', href: 'http://macaw.social/@cs_marshall' },
  instagram: { label: 'Instagram', path: '/cs_marshall', href: 'http://www.instagram.com/cs_marshall/' },
  threads: { label: 'Threads', path: '/csmarshall', href: 'https://www.threads.com/csmarshall' },
  bluesky: { label: 'Bluesky', path: '/charles.wozi.com', href: 'https://bsky.app/profile/charles.wozi.com' },
  mail: { label: 'Mail', path: 'charles@wozi.com', href: 'mailto:charles@wozi.com' }
};

class Component extends DCLogic {
  state = { theme: 'light', hover: null, icons: {}, ghosts: [] };
  _spinEls = [];
  _chainEls = [];
  _ghostEls = [];
  _colRef = React.createRef();
  _stageRef = React.createRef();

  /* Grab any wheel and push it: the whole train follows your hand, and if you push
     against the way it was turning, it keeps running that way when you let go. */
  onGrab(e) {
    const stage = this._stageRef.current;
    if (!stage || e.button > 0) return;
    const solved = this.solve();
    const rect = stage.getBoundingClientRect();
    const gs = rect.width / solved.w;
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    let hit = null, best = Infinity;
    solved.gears.forEach(g => {
      const d = Math.hypot(px - g.cx * gs, py - g.cy * gs);
      if (d < g.ro * gs && d < best) { best = d; hit = g; }
    });
    if (!hit) return;
    e.preventDefault();
    const cx = rect.left + hit.cx * gs, cy = rect.top + hit.cy * gs;
    let p = { x: e.clientX, y: e.clientY };
    const ang = () => Math.atan2(p.y - cy, p.x - cx) * 180 / Math.PI;
    let last = ang(), lastT = performance.now(), moved = 0;
    this._dragging = true;
    this._v = 0;
    stage.style.cursor = 'grabbing';

    const move = (ev) => {
      const pt = ev.touches ? ev.touches[0] : ev;
      p = { x: pt.clientX, y: pt.clientY };
      let a = ang(), delta = a - last;
      while (delta > 180) delta -= 360;
      while (delta < -180) delta += 360;
      last = a;
      const now = performance.now(), dt = Math.max(8, now - lastT);
      lastT = now;
      /* Convert the wheel you are holding into master (tooth) units. */
      const dM = delta * hit.teeth * hit.dir;
      moved += dM;
      this._M += dM;
      this._v = this._v * 0.6 + (dM / dt) * 0.4;
      this.applyRotation();
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      this._dragging = false;
      stage.style.cursor = 'grab';
      /* A flick sets the flywheel spinning; friction pulls it back to idle speed.
         Push against the train and it keeps running the new way. */
      const flick = Math.max(-8, Math.min(8, this._v));
      if (Math.abs(moved) > 30) this._dirSign = moved < 0 ? -1 : 1;
      else if (Math.abs(flick) > 0.5) this._dirSign = flick < 0 ? -1 : 1;
      this._v = Math.abs(flick) > 0.15 ? flick : this._dirSign * this.idleRate();
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  }

  idleRate() { return (7200 / BASE_MS) * (this.props.speed ?? 1); }

  /* Stable per-load randomness, so a resize re-seeds the same background machinery. */
  rnd() {
    this._seed = (this._seed || 20260729) * 1664525 + 1013904223 & 0x7fffffff;
    return this._seed / 0x7fffffff;
  }

  /* Background machinery: extra wheels seeded off each edge, meshed onto the visible
     train, dimmed and set behind it so they read as context rather than content. */
  fitEscapes(fit) {
    const stage = this._stageRef.current;
    if (!stage) return;
    const solved = this.solve();
    const rect = stage.getBoundingClientRect();
    const gs = fit * (this.props.gearScale ?? 1);
    const vw = window.innerWidth, vh = window.innerHeight;
    const ghosts = [];
    this._seed = 20260729;
    const hosts = [solved.gears[0], solved.gears[solved.gears.length - 1]];
    const taken = [];
    const crosses = (p1, p2, p3, p4) => {
      const s = (a, b, c) => (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
      return s(p1, p2, p3) * s(p1, p2, p4) < 0 && s(p3, p4, p1) * s(p3, p4, p2) < 0;
    };
    /* The escape runs continue the train's OWN AXIS rather than leaving by whichever
       screen edge happens to be nearest. Nearest-edge was measuring the wrong thing:
       on a wide, short viewport the closest edges are the top and bottom, so one run
       climbed off the top and the other dropped off the bottom — a horizontal train
       with a vertical tail at each end, which reads as an S rather than as a machine
       continuing past the frame (#10). Continuing the axis is what SESSION-LOG says
       these are for, and it fills a wide display instead of stranding the train in
       the middle of one. */
    const first = solved.gears[0], last = solved.gears[solved.gears.length - 1];
    const axisDeg = Math.atan2(last.cy - first.cy, last.cx - first.cx) * 180 / Math.PI;
    /* How far a heading travels before it leaves the viewport. */
    const reachAlong = (px, py, deg) => {
      const a = deg * Math.PI / 180, dx = Math.cos(a), dy = Math.sin(a);
      let t = Infinity;
      if (dx > 1e-6) t = Math.min(t, (vw - px) / dx);
      else if (dx < -1e-6) t = Math.min(t, -px / dx);
      if (dy > 1e-6) t = Math.min(t, (vh - py) / dy);
      else if (dy < -1e-6) t = Math.min(t, -py / dy);
      return Math.max(0, t === Infinity ? 0 : t);
    };
    hosts.forEach((host, ei) => {
      const sx = rect.left + host.cx * gs, sy = rect.top + host.cy * gs;
      /* The first wheel continues backwards along the axis, the last one onwards.
         A small arc either side is searched only to dodge a run already placed —
         the axis itself is always tried first. */
      const want = ei === 0 ? axisDeg + 180 : axisDeg;
      let e = null;
      const offsets = [0, 16, -16, 32, -32, 50, -50];
      for (let q = 0; q < offsets.length; q++) {
        const ang = want + offsets[q];
        const reach = reachAlong(sx, sy, ang);
        const oa = ang * Math.PI / 180;
        const seg = [{ x: sx, y: sy }, { x: sx + (reach + 80) * Math.cos(oa), y: sy + (reach + 80) * Math.sin(oa) }];
        if (!taken.some(t => crosses(seg[0], seg[1], t[0], t[1]))) { e = { ang: ang, reach: reach }; break; }
      }
      if (!e) return;
      const ea = e.ang * Math.PI / 180;
      taken.push([{ x: sx, y: sy }, { x: sx + (e.reach + 80) * Math.cos(ea), y: sy + (e.reach + 80) * Math.sin(ea) }]);
      if (e.reach < 60) return;
      const span = e.reach / gs;
      let prev = { cx: host.cx, cy: host.cy, r: host.r, teeth: host.teeth, dir: host.dir, phase: host.phase };
      let reached = 0, k = 0;
      /* Keep adding wheels until the run is genuinely off the edge; they grow as they
         go, so a tall screen does not need a long string of identical pinions. */
      while (reached < span + 120 && k < 7) {
        const teeth = Math.min(26, 11 + k * 2 + Math.floor(this.rnd() * 8));
        const r = MODULE * teeth / 2;
        const wobble = (this.rnd() * 2 - 1) * 20;
        const ang = e.ang + wobble;
        const a = ang * Math.PI / 180, d = prev.r + r;
        const cx = prev.cx + d * Math.cos(a), cy = prev.cy + d * Math.sin(a);
        const pPrev = 360 / prev.teeth, pThis = 360 / teeth;
        let u = ((ang - prev.phase) / pPrev) % 1;
        if (u < 0) u += 1;
        const phase = ang + 180 - (0.5 - u) * pThis;
        const g = { cx: cx, cy: cy, r: r, teeth: teeth, dir: -prev.dir, phase: phase,
          color: GHOST_COLORS[Math.floor(this.rnd() * GHOST_COLORS.length)],
          kind: GHOST_KINDS[Math.floor(this.rnd() * GHOST_KINDS.length)], arms: 3 + Math.floor(this.rnd() * 5),
          prof: { rim: 1.5 + this.rnd() * 0.8,
            web: 2.4 + this.rnd() * 1.2, hub: 0.18 + this.rnd() * 0.14, hole: 0.09 + this.rnd() * 0.05, arm: 0.14 + this.rnd() * 0.08 },
          ro: r + MODULE * 0.95, i: 'gh' + ei + k };
        ghosts.push(g);
        reached += d;
        prev = g;
        k++;
      }
    });
    const key = ghosts.map(g => [g.cx | 0, g.cy | 0, g.teeth].join()).join('|');
    if (key !== this._escKey) { this._escKey = key; this.setState({ ghosts: ghosts }); }
  }

  applyRotation() {
    /* Skip frames where nothing moved enough to see. */
    if (this._lastM !== undefined && Math.abs(this._M - this._lastM) < 0.05) return;
    this._lastM = this._M;
    const gears = this.solve().gears;
    if (this._spinEls) {
      for (let i = 0; i < gears.length; i++) {
        const el = this._spinEls[i];
        if (el) el.style.transform = 'rotate(' + (gears[i].phase + gears[i].dir * this._M / gears[i].teeth).toFixed(3) + 'deg)';
      }
    }
    if (this._ghostEls) {
      /* LAYER: parallax — the far plane runs a touch slower than the near one. */
      const lag = this.props.parallax ? 0.78 : 1;
      this._ghostEls.forEach(x => {
        if (x.el) x.el.style.transform = 'rotate(' + (x.g.phase + x.g.dir * this._M * lag / x.g.teeth).toFixed(3) + 'deg)';
      });
    }
    if (this._chainEls) {
      const PITCH = Math.PI * MODULE;
      this._chainEls.forEach(c => {
        if (c.el) c.el.style.strokeDashoffset = (-this._M * PITCH / 360 * c.sign).toFixed(2) + 'px';
      });
    }
  }

  startPhysics() {
    this._M = 0;
    this._dirSign = 1;
    /* prefers-reduced-motion (#3): the machine comes to REST through this same
       loop -- the idle target becomes zero, and the flywheel physics settles it
       gently instead of freezing it mid-tooth. The flag is read fresh every
       tick, mirroring the sleep gate: #7 is what happens when a flag can latch.
       A deliberate drag or key press still spins it -- user-initiated motion is
       the user's choice -- and friction then returns it to rest. */
    this._rmq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    const startReduced = !!(this._rmq && this._rmq.matches);
    this._v = (this.props.spinUp === false && !startReduced) ? this.idleRate() : 0;
    let last = performance.now();
    const step = (now) => {
      /* Cap the update rate. Divisors of the display refresh judder least, which is why
         30 beats 24 on a 60Hz panel: 60/30 = 2 whole frames, 60/24 = 2.5. */
      const budget = 1000 / (this.props.frameRate ?? 30) - 1.5;
      if (now - last < budget) { this._raf = requestAnimationFrame(step); return; }
      const dt = Math.min(60, now - last);
      last = now;
      /* One expression decides whether to integrate — nothing can latch it asleep. */
      const asleep = document.hidden || this._offscreen === true;
      if (!this._dragging && !asleep) {
        /* Flywheel: bleed back toward the train's natural pace. */
        /* LAYER: hover drag — attention loads the machine and it slows a little. */
        const load = (this.props.hoverDrag && (this.state.hover || this.state.overStage)) ? 0.4 : 1;
        const reduced = !!(this._rmq && this._rmq.matches);
        const target = reduced ? 0 : this._dirSign * this.idleRate() * load;
        this._v += (target - this._v) * (1 - Math.exp(-dt / 900));
        this._M += this._v * dt;
        this.applyRotation();
      }
      this._raf = requestAnimationFrame(step);
    };
    this._raf = requestAnimationFrame(step);

    /* Stop integrating when the machine is scrolled out of view: no frames, no CPU.
       Starts awake, and only ever sleeps on a real off-screen report for a laid-out
       stage — a first callback on a zero-size box must not put it to sleep. */
    if (window.IntersectionObserver && this._stageRef.current) {
      this._io = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          const box = e.boundingClientRect;
          if (!box || box.width < 4 || box.height < 4) return;
          this._offscreen = e.isIntersecting === false;
        });
      }, { rootMargin: '120px' });
      this._io.observe(this._stageRef.current);
    }
  }

  loadIcons() {
    const slugs = TRAIN.filter(t => t.slug).map(t => t.slug);
    Promise.all(slugs.map(s => fetch('assets/icons/' + s + '.svg').then(r => r.ok ? r.text() : '').catch(() => '')))
      .then(texts => {
        const icons = {};
        slugs.forEach((s, i) => {
          let t = texts[i] || '';
          if (t) {
            t = t.split('fill="#000"').join('fill="currentColor"');
            t = t.replace('<svg ', '<svg aria-hidden="true" focusable="false" width="100%" height="100%" ');
          }
          icons[s] = t;
        });
        this.setState({ icons: icons });
      });
  }

  /* Lay the run along the viewport's long axis, so the belt spans open space instead of
     doubling back on itself. Only the layout bearings rotate — badges stay upright. */
  axisRot() { return window.innerHeight > window.innerWidth * 1.05 ? 90 : 0; }

  fitStage() {
    const rot = this.axisRot();
    /* More room means longer drive runs: the strands get real straight spans instead of
       being mostly wrap. Quantised so a resize does not re-solve on every pixel. */
    /* Small screens pack the train tighter, so each wheel renders bigger on the glass;
       roomy screens spread it out and let the drive runs stretch. */
    const small = Math.min(window.innerWidth, window.innerHeight);
    const boost = Math.round(Math.max(0.86, Math.min(1.15, small / 700)) * 20) / 20;
    const tight = Math.round(Math.max(0.6, Math.min(1, small / 760)) * 20) / 20;
    if (rot !== this._axisRot || boost !== this._spreadBoost || tight !== this._tight) {
      this._axisRot = rot;
      this._spreadBoost = boost;
      this._tight = tight;
      this._solved = null;
      this._escKey = null;
      this.forceUpdate();
    }
    const solved = this.solve();
    const w = window.innerWidth, hgt = window.innerHeight;
    const rowMode = w > 820 && w > hgt * 1.2;
    const colH = this._colRef && this._colRef.current ? this._colRef.current.offsetHeight : 60;
    const availW = w * (rowMode ? 0.86 : 0.92);
    const availH = hgt - colH - (rowMode ? 90 : 110);
    /* The artwork is vector, so on a large display the train should grow to fill the room
       rather than sit small in the middle of it. The spread boost widens the solve, which
       used to fight the old 1.15 ceiling and made big screens render SMALLER wheels. */
    const fit = Math.max(0.28, Math.min(availW / solved.w, availH / solved.h, 1.75));
    const root = document.documentElement.style;
    root.setProperty('--gsfit', fit.toFixed(3));
    this.fitEscapes(fit);
    root.setProperty('--dir', rowMode ? 'row' : 'column');
  }

  componentDidMount() {
    this.loadIcons();
    this.startPhysics();
    this.fitStage();
    this.onResize = () => this.fitStage();
    window.addEventListener('resize', this.onResize);
    /* LAYER: parallax — the far plane drifts against pointer movement. */
    this._onPointer = (e) => {
      if (!this.props.parallax || !this._ghostLayer) return;
      const dx = (e.clientX / window.innerWidth - 0.5) * 26, dy = (e.clientY / window.innerHeight - 0.5) * 18;
      this._ghostLayer.style.transform = 'translate(' + (-dx).toFixed(1) + 'px,' + (-dy).toFixed(1) + 'px) scale(0.94)';
    };
    window.addEventListener('pointermove', this._onPointer, { passive: true });
    let saved = null;
    try { saved = localStorage.getItem('wozi-theme'); } catch (e) {}
    this.mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    this.onSys = (e) => {
      let stored = null;
      try { stored = localStorage.getItem('wozi-theme'); } catch (err) {}
      if (!stored) this.apply(e.matches ? 'dark' : 'light');
    };
    if (this.mq && this.mq.addEventListener) this.mq.addEventListener('change', this.onSys);
    this.apply(saved || (this.mq && this.mq.matches ? 'dark' : 'light'));
    this.syncVars();
  }

  componentDidUpdate() { this.syncVars(); this.fitStage(); }

  componentWillUnmount() {
    if (this.mq && this.mq.removeEventListener) this.mq.removeEventListener('change', this.onSys);
    window.removeEventListener('resize', this.onResize);
    if (this._onPointer) window.removeEventListener('pointermove', this._onPointer);
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._io) this._io.disconnect();
  }

  syncVars() {
    const r = document.documentElement.style;
    const speed = this.props.speed ?? 1;
    r.setProperty('--s', String(speed > 0 ? 1 / speed : 1));
    r.setProperty('--gsm', String(this.props.gearScale ?? 1));
    /* Dark mode gets the lighter counterpart; an accent dark enough to read on
       the light background disappears against the dark one. */
    if (this.props.accent) {
      const pair = ACCENTS[this.props.accent];
      r.setProperty('--accent', (this.state.theme === 'dark' && pair) || this.props.accent);
    }
  }

  apply(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    this.setState({ theme });
  }

  /* Solve the train: centre distances = sum of pitch radii, alternating spin,
     angular speed inversely proportional to tooth count, tooth phase meshed. */
  solve() {
    if (this._axisRot === undefined) this._axisRot = this.axisRot();
    if (this._solved) return this._solved;
    /* Sites are dealt onto the wheels fresh each load, but sibling services stay
       belted to each other: the two belt-linked slots always get a pair. */
    const shuffle = (arr) => {
      if (this.props.shuffle === false) return arr;
      for (let k = arr.length - 1; k > 0; k--) {
        const j = Math.floor(Math.random() * (k + 1));
        const tmp = arr[k]; arr[k] = arr[j]; arr[j] = tmp;
      }
      return arr;
    };
    const pairSlots = PAIR_SLOTS, singleSlots = [];
    TRAIN.forEach((t, i) => { if (!pairSlots.some(pr => pr.indexOf(i) >= 0)) singleSlots.push(i); });
    const pairs = shuffle(PAIRS.map(pr => shuffle(pr.slice())));
    const singles = shuffle(SINGLES.slice());
    const slugFor = {};
    pairSlots.forEach((pr, k) => { const pair = pairs[k % pairs.length]; slugFor[pr[0]] = pair[0]; slugFor[pr[1]] = pair[1]; });
    singleSlots.forEach((s, k) => { slugFor[s] = singles[k % singles.length]; });
    const g = [], strands = [];
    let x = 0, y = 0, dir = 1, phase = 0;
    TRAIN.forEach((t, i) => {
      const prof = t.prof || {};
      const r = MODULE * t.teeth / 2;
      const ro = r + MODULE * TOOTH_ADD;
      let chainFrom = null;
      if (i > 0) {
        const prev = g[i - 1];
        const linked = !!t.link;
        /* Distance is fixed by the drive type; the bearing is nudged until this wheel
           clears every wheel it is not meshed with by at least CLEARANCE. */
        let d = linked ? (prev.r + r) * (t.spread || 2) * (this._spreadBoost || 1) : prev.r + r;
        const base = t.angle + (this._axisRot || 0);
        let ang = base, placed = false;
        for (let pass = 0; pass < (linked ? 3 : 1) && !placed; pass++) {
          for (let step = 0; step <= (linked ? 150 : 60) && !placed; step += 4) {
            for (let sgn = 1; sgn >= -1 && !placed; sgn -= 2) {
              const cand = base + sgn * step;
              const a = cand * Math.PI / 180;
              const px = prev.x + d * Math.cos(a), py = prev.y + d * Math.sin(a);
              let clash = g.some((o, oi) => {
                if (oi === i - 1) return false;
                /* The two ends of the train repel each other, so the run reads as a
                   line of machinery rather than a closed ring. */
                const tight = this._tight || 1;
                const need = o.ro + ro + CLEARANCE * tight + (oi === 0 && i === TRAIN.length - 1 ? ENDS_APART * tight : 0);
                return Math.hypot(px - o.x, py - o.y) < need;
              });
              if (!clash && linked && g.length > 1) {
                /* A drive run must head away from the wheels already placed, otherwise it
                   folds back through the middle of the train. */
                const mx = g.reduce((s, o) => s + o.x, 0) / g.length, my = g.reduce((s, o) => s + o.y, 0) / g.length;
                const ox = prev.x - mx, oy = prev.y - my, oL = Math.hypot(ox, oy) || 1;
                const vx = px - prev.x, vy = py - prev.y, vL = Math.hypot(vx, vy) || 1;
                if ((ox / oL) * (vx / vL) + (oy / oL) * (vy / vL) < 0.15) clash = true;
              }
              if (!clash && linked) {
                /* A chain or belt run may not cross another run, nor pass over a wheel. */
                const s1 = { x: prev.x, y: prev.y }, s2 = { x: px, y: py };
                clash = strands.some(st => segCross(s1, s2, st[0], st[1])) ||
                  g.some((o, oi) => oi !== i - 1 && segDist({ x: o.x, y: o.y }, s1, s2) < o.ro + 10);
              }
              if (!clash) { ang = cand; x = px; y = py; placed = true; }
              if (step === 0) break;
            }
          }
          if (!placed) d *= 1.12;
        }
        if (!placed) { const a = base * Math.PI / 180; x = prev.x + d * Math.cos(a); y = prev.y + d * Math.sin(a); }
        if (linked) {
          dir = prev.dir;
          phase = 0;
          chainFrom = i - 1;
          strands.push([{ x: prev.x, y: prev.y }, { x: x, y: y }]);
        } else {
          dir = -prev.dir;
          /* Exact conjugate mesh: measure where the line of centres falls inside the
             previous gear's tooth pitch, then place this gear so a gap sits opposite. */
          const pPrev = 360 / prev.teeth, pThis = 360 / t.teeth;
          let u = ((ang - prev.phase) / pPrev) % 1;
          if (u < 0) u += 1;
          phase = ang + 180 - (0.5 - u) * pThis;
        }
      }
      g.push({ i: i, teeth: t.teeth, color: t.color, slug: slugFor[i] || null, belt: t.link || null, kind: t.kind || 'holes', arms: t.arms || 5, prof: prof, chainFrom: chainFrom,
        r: r, ro: ro, x: x, y: y, dir: dir, phase: phase,
        dur: (BASE_MS * t.teeth / 20).toFixed(2) });
    });
    const minX = Math.min.apply(null, g.map(k => k.x - k.ro)) - 6;
    const minY = Math.min.apply(null, g.map(k => k.y - k.ro)) - 6;
    const maxX = Math.max.apply(null, g.map(k => k.x + k.ro)) + 6;
    const maxY = Math.max.apply(null, g.map(k => k.y + k.ro)) + 6;
    g.forEach(k => { k.cx = k.x - minX; k.cy = k.y - minY; });
    const chains = g.filter(k => k.chainFrom !== null && k.chainFrom !== undefined).map(k => ({ a: g[k.chainFrom], b: k }));
    /* The wordmark hangs from the lowest wheel on two cords, clear of every gear. */
    this._solved = { gears: g, chains: chains, w: maxX - minX, h: maxY - minY };
    return this._solved;
  }

  /* Geometry for the two engraved lines. Font size is a fixed fraction of the band, so it
     is identical on every wheel; the arc sweep is then derived from the actual text length
     and the band's circumference, shrinking the type only if a long handle would not fit. */
  engraving(g, r, m, bandOut) {
    const site = g.slug ? SITES[g.slug] : null;
    const raw = site ? site.path : '';
    /* Just the handle: everything after the last slash. */
    const handle = raw.indexOf('/') >= 0 ? raw.slice(raw.lastIndexOf('/') + 1) : raw;
    const stamp = 'M' + MODULE + ' Z' + g.teeth;
    const MAX = 168 * Math.PI / 180;
    const fit = (txt, rr, base) => {
      const per = 0.60, track = 0.10;
      let f = base;
      const width = (fs) => txt.length * fs * (per + track);
      if (width(f) / rr > MAX) f = (MAX * rr) / (txt.length * (per + track));
      return { f: f, sweep: (width(f) / rr) * 180 / Math.PI };
    };
    /* Both lines sit on one ring, centred in the band. */
    const rT = bandOut - m * (BAND_DEPTH / 2), rB = rT;
    const T = fit(handle, rT, m * 0.80), B = fit(stamp, rB, m * 0.60);
    return { handle: handle, stamp: stamp, rT: rT, rB: rB, fT: T.f, fB: B.f, sT: T.sweep, sB: B.sweep };
  }

  /* One gear blank, drawn with true involute flanks.
     The working face of a real tooth is the involute of a base circle
     rb = r·cos(pressure angle) — the curve a taut string traces as it unwinds
     from that circle. It is the only profile with conjugate action, meaning the
     velocity ratio holds through the whole sweep rather than only at the pitch
     point, so mating teeth touch without ever interfering. Straight flanks
     cannot do both, which is what forced #11 to trade contact for clearance.
     Below the base circle no involute exists, so the flank runs radially down
     into the root. */
  teethPath(n, r, prof, chipIdx) {
    const m = MODULE;
    const ro = r + m * TOOTH_ADD, rr = Math.max(4, r - m * TOOTH_DED), a = 2 * Math.PI / n;
    const phi = TOOTH_PA * Math.PI / 180, rb = r * Math.cos(phi);
    const inv = (x) => Math.tan(x) - x;
    /* Half the tooth's angular width at the pitch circle. TOOTH_THICK is the
       fraction of the circular pitch the tooth occupies there — a hair under a
       half, the rest being backlash. */
    const psiP = TOOTH_THICK * Math.PI / n;
    const half = (R) => psiP + inv(phi) - inv(Math.acos(Math.min(1, rb / R)));
    const rStart = Math.max(rb, rr + 0.01);
    const hRoot = half(rStart);
    /* Fillet blend: how far up the flank and how far round the root it reaches. */
    const fr = Math.min(m * TOOTH_FILLET, (rStart - rr) * 0.9 + 0.01);
    const rFil = Math.min(rStart, rr + fr), fa = fr / rr;
    const P = (rad, ang) => (rad * Math.cos(ang)).toFixed(2) + ',' + (rad * Math.sin(ang)).toFixed(2);
    const STEPS = 7;
    const flank = [];
    for (let s = 0; s <= STEPS; s++) flank.push(rStart + (ro - rStart) * (s / STEPS));

    let d = 'M' + P(rr, -a / 2) + ' ';
    for (let i = 0; i < n; i++) {
      const c = i * a;
      /* Root arc up to where this tooth's flank leaves the root circle, then the
         fillet. A real fillet is a trochoid swept by the cutter tip; a quadratic
         through the corner is indistinguishable at this scale. */
      d += 'A' + rr + ' ' + rr + ' 0 0 1 ' + P(rr, c - hRoot - fa) + ' ';
      d += 'Q' + P(rr, c - hRoot) + ' ' + P(rFil, c - hRoot) + ' ';
      if (rStart > rFil) d += 'L' + P(rStart, c - hRoot) + ' ';
      if (i === chipIdx) {
        /* A chipped tooth: still there, but the crown has fractured away along a
           jagged face rather than vanishing cleanly. */
        const H = ro - rStart, lvl = (f) => rStart + H * f;
        for (let s = 1; s <= STEPS; s++) {
          const R = flank[s];
          if (R > lvl(0.62)) break;
          d += 'L' + P(R, c - half(R)) + ' ';
        }
        d += 'L' + P(lvl(0.93), c - half(lvl(0.93)) * 0.5) + ' ';
        d += 'L' + P(lvl(0.52), c - half(lvl(0.52)) * 0.2) + ' ';
        d += 'L' + P(lvl(0.70), c + half(lvl(0.70)) * 0.35) + ' ';
        d += 'L' + P(lvl(0.44), c + half(lvl(0.44)) * 0.8) + ' ';
        for (let s = STEPS; s >= 1; s--) {
          const R = flank[s];
          if (R > lvl(0.44)) continue;
          d += 'L' + P(R, c + half(R)) + ' ';
        }
      } else {
        for (let s = 1; s <= STEPS; s++) d += 'L' + P(flank[s], c - half(flank[s])) + ' ';
        /* Tip land, following the tip circle. */
        d += 'A' + ro.toFixed(2) + ' ' + ro.toFixed(2) + ' 0 0 1 ' + P(ro, c + half(ro)) + ' ';
        for (let s = STEPS - 1; s >= 0; s--) d += 'L' + P(flank[s], c + half(flank[s])) + ' ';
      }
      if (rStart > rFil) d += 'L' + P(rFil, c + hRoot) + ' ';
      d += 'Q' + P(rr, c + hRoot) + ' ' + P(rr, c + hRoot + fa) + ' ';
      d += 'A' + rr + ' ' + rr + ' 0 0 1 ' + P(rr, c + a / 2) + ' ';
    }
    return d + 'Z';
  }

  arcD(rad, a0deg, a1deg) {
    const a0 = a0deg * Math.PI / 180, a1 = a1deg * Math.PI / 180;

      h('div', { key: 'shadows', style: { position: 'absolute', left: 0, top: 0, width: solved.w + 'px', height: solved.h + 'px', zIndex: 0, pointerEvents: 'none' } },
        solved.gears.map(g => h('div', { key: g.i, style: {
          position: 'absolute', left: (g.cx - g.ro * 1.12) + 'px', top: (g.cy - g.ro * 1.12 + 5) + 'px',
          width: (g.ro * 2.24) + 'px', height: (g.ro * 2.24) + 'px',
          /* Softer in daylight. A light environment throws a weaker, more diffuse
             shadow; the same alpha that reads as contact on a dark page pools
             into a grey puddle on a pale one. */
          background: this.state.theme === 'dark'
            ? 'radial-gradient(closest-side, rgba(10,20,26,.26) 0%, rgba(10,20,26,.20) 58%, rgba(10,20,26,.08) 80%, rgba(10,20,26,0) 100%)'
            : 'radial-gradient(closest-side, rgba(24,34,30,.15) 0%, rgba(24,34,30,.11) 58%, rgba(24,34,30,.04) 80%, rgba(24,34,30,0) 100%)'
        } }))),
      h('svg', { key: 'chains', width: solved.w, height: solved.h, style: { position: 'absolute', left: 0, top: 0, overflow: 'visible' } },
        solved.chains.map((c, ci) => this.chainEl('c' + ci, c.a, c.b))),
      solved.gears.map(g => h('div', { key: g.i, style: { position: 'absolute', left: g.cx + 'px', top: g.cy + 'px', width: 0, height: 0 } },
        h('div', { ref: (el) => { if (this._spinEls) this._spinEls[g.i] = el; },
          style: {
            transform: 'rotate(' + g.phase.toFixed(2) + 'deg)', willChange: 'transform'
          } },
          this.gearSvg(g)))))

    const links = solved.gears.filter(g => g.slug).map(g => {
      const site = SITES[g.slug];
      const disc = Math.max(30, Math.min(60, Math.round(g.r * 0.72)));
      const cap = Math.round(g.r * 1.15);
      const size = 'min(calc(' + cap + 'px * var(--gs)), max(30px, calc(' + disc + 'px * var(--gs))))';
      const on = hov === g.slug;
      return {
        label: site.label, path: site.path, href: site.href,
        iconEl: h('span', {
          style: { width: 'calc(' + size + ' * 0.56)', height: 'calc(' + size + ' * 0.56)', display: 'block', lineHeight: 0, color: on ? 'var(--accent)' : (BRAND[g.slug] || 'var(--ink)'), transition: 'color .2s ease' },
          dangerouslySetInnerHTML: { __html: this.state.icons[g.slug] || '' }
        }),
        enter: () => this.setState({ hover: g.slug }),
        leave: () => this.setState({ hover: null }),
        /* The label used to be a native `title`, whose appearance delay belongs to
           the OS — about a second, and not reachable from CSS or JS. Rendering it
           makes the timing ours: it comes up in 90ms off the same hover state that
           already drives the badge. The badges do not rotate, only the gear SVGs
           do, so a transition here does not touch the one-clock invariant. The
           counter-scale holds the text still while the badge grows to 1.16. */
        tipEl: h('span', {
          style: {
            position: 'absolute', bottom: 'calc(100% + 9px)', left: '50%',
            transform: 'translateX(-50%) scale(' + (on ? 1 / 1.16 : 1) + ')',
            transformOrigin: 'bottom center',
            padding: '3px 8px', borderRadius: '7px',
            background: 'var(--ink)', color: 'var(--bg)',
            font: '600 12px/1.45 Manrope, system-ui, sans-serif', letterSpacing: '.01em',
            whiteSpace: 'nowrap', pointerEvents: 'none', zIndex: 30,
            opacity: on ? 1 : 0,
            transition: 'opacity .09s ease'
          }
        }, SITES[g.slug] ? SITES[g.slug].label : ''),
        discStyle: {
          position: 'absolute',
          left: 'calc(' + g.cx + 'px * var(--gs))', top: 'calc(' + g.cy + 'px * var(--gs))',
          width: size, height: size, boxSizing: 'border-box',
          borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center',
          /* Was a hardcoded #F8F9F8 in both themes, which glared on the softened
             light page and was the brightest thing on screen in dark. Toned per
             theme, but kept light in BOTH: several brand marks are near-black
             (GitHub, Threads) and need a pale disc under them (#22). */
          background: this.state.theme === 'dark' ? '#DFE2DE' : '#EDEFEA',
          color: on ? 'var(--accent)' : 'var(--ink)',
          border: '1px solid rgba(20,30,35,.14)', boxShadow: '0 3px 10px rgba(8,16,20,.28)', zIndex: 5, cursor: 'pointer',
          transform: 'translate(-50%,-50%) scale(' + (on ? 1.16 : 1) + ')',
          transition: 'transform .22s cubic-bezier(.34,1.56,.64,1), color .2s ease'
        }
      };
    });

    return {
      gearArt: gearArt,
      links: links,
      colRef: this._colRef,
      stageRef: this._stageRef,
      onGrab: (e) => this.onGrab(e),
      onStageEnter: () => { if (this.props.hoverDrag) this.setState({ overStage: true }); },
      onStageLeave: () => { if (this.state.overStage) this.setState({ overStage: false }); },
      stageStyle: { position: 'relative', flex: '0 0 auto', width: 'calc(' + solved.w + 'px * var(--gs))', height: 'calc(' + solved.h + 'px * var(--gs))', cursor: 'grab', touchAction: 'none' },

      themeLabel: this.state.theme === 'dark' ? 'Switch to light' : 'Switch to dark',
      themeIcon: this.state.theme === 'dark'
        ? h('svg', { 'aria-hidden': 'true', focusable: 'false', width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8, strokeLinecap: 'round' },
            h('circle', { cx: 12, cy: 12, r: 4.4 }),
            h('path', { d: 'M12 2.6v2.6M12 18.8v2.6M2.6 12h2.6M18.8 12h2.6M5.4 5.4l1.9 1.9M16.7 16.7l1.9 1.9M18.6 5.4l-1.9 1.9M7.3 16.7l-1.9 1.9' }))
        : h('svg', { 'aria-hidden': 'true', focusable: 'false', width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8, strokeLinejoin: 'round' },
            h('path', { d: 'M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z' })),
      toggleTheme: () => {
        const next = this.state.theme === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('wozi-theme', next); } catch (e) {}
        this.apply(next);
      },
      brandName: brand.name,
      brandTld: brand.tld
    };
  }
}
</script>
</body>
</html>
