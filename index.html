<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- config.js MUST load before support.js: the runtime below reads WOZI_CONFIG
     while building the train, so it has to already exist. It is a plain script,
     not a module, for exactly that reason -- a module would defer.
     It is also named in the deploy whitelist; a file in the repo does not reach
     the web on its own. -->
<script src="./config.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%233B7DE8'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E" />
<title>wozi.com</title>
<style>
:root{
  /* The page background is deliberately off a bright white. #F1F2F0 sat at 0.885
     luminance, which is a lot of glare full-screen and left the #FFFFFF badges
     almost nothing to separate from (1.12:1). At 0.817 the badges lift to 1.21:1
     and the ink still clears 11:1. --muted darkens with it so the wordmark TLD,
     which is large text on this colour, stays above the 3:1 floor (#16). */
  --bg:#E8EAE5; --ink:#20302E; --muted:#6B7E7C; --hair:#D5DAD6; --chip:#FFFFFF;
  --accent:#3B7DE8; --shadow:0 1px 2px rgba(20,40,38,.06);
  /* THE METAL AND BRASS RAMPS, kept as a comment rather than as declarations
     (#57). Both sets were referenced ZERO times -- 16 declarations, no var()
     uses -- because wheel tone is derived per wheel by shades()/flatTones()
     from WHEEL_POOL, not read from CSS. They are recorded here because the
     values are still cited: config.js names --m4 light / --m1 dark as the
     provenance of the steel accent #5F686E, and deleting the declarations
     without this would delete where that colour came from.
       light metal   m1 #FFFFFF  m2 #D4DADE  m3 #98A2A9  m4 #5F686E
       light brass   b1 #F7E7BE  b2 #DFC183  b3 #B08F45  b4 #7A5F28
       dark  metal   m1 #AEB8BF  m2 #7C858C  m3 #4E565C  m4 #2B3135
       dark  brass   b1 #D8B978  b2 #A98844  b3 #75592A  b4 #463618 */
  --edge:rgba(12,22,28,.38); --gloss:rgba(255,255,255,.8);
  /* --gsfit is the fit scale, and it is a READOUT, not a lever: the train's
     geometry is multiplied by it in JS at render time so every wheel is drawn at
     the size it is displayed (#37). It used to feed a `transform: scale()` on the
     gear container, which meant the wheels were rasterised small and stretched.
     The value here is the boot fit, used for the first render before fitStage()
     has measured anything; gsRender() reads it from this declaration so the two
     cannot drift apart. */
  /* --s (1/speed) removed: 0 var(--s) uses, and syncVars recomputed it every
     render for nothing. Motion timing goes through the rAF loop, not CSS (#57). */
  --gsfit:0.86;
  --dir:row; --pad:5vw; --gap:4vw;
  /* Corner spacing is one icon width, so the gap around the theme toggle reads
     the same as the icon it sits next to. The button is larger than its icon and
     centres it, so the button box is pulled in by half that difference — derived
     rather than hardcoded, so changing either size keeps the icon on the mark.
     The wordmark sits on --btnoff too, the same offset as the button's box, so
     the two bottom/top corners are inset by the same amount rather than one
     being measured to a box and the other to a glyph. Neither reads --btnoff
     directly any more: both go through the --off* tokens below, which add the
     safe-area inset for the edge each one is pinned to. */
  --icon:20px; --btn:44px;
  /* Gap between the three corner buttons. The 44px button is a TOUCH TARGET,
     deliberately larger than the 20px glyph it holds, so the visible spacing
     is already the button's own padding plus this -- which is why a flat 6px
     read as a wide, loose row. Clamped and viewport-relative so a phone packs
     them tight and a large display lets them breathe, without either end
     colliding or drifting apart. */
  --btngap:clamp(0px, 0.6vw, 8px);
  --corner:var(--icon);
  --btnoff:calc(var(--corner) - (var(--btn) - var(--icon)) / 2);
  /* THE STAGE BLEEDS, THE CONTROLS DO NOT. `viewport-fit=cover` hands the page
     the whole display on iOS/iPadOS — under the notch, under the home
     indicator, behind Safari's translucent toolbars — so the machine reads as a
     window onto a running train rather than a picture inside a box. The four
     fixed controls are the one thing that must stay out of those regions: a
     button under the home indicator is hard to tap and can be impossible.

     So each fixed corner offset is --btnoff PLUS that edge's inset, and the
     insets are held in their own tokens rather than written into the offsets.
     Two reasons. A bare env() inside a calc() is invalid on a browser that has
     never heard of env(), and an invalid `top`/`right` does not fall back to
     --btnoff, it falls back to auto — the buttons would lose their corner
     entirely. And a plain custom property can be given a value at runtime,
     which is how tools/devices.py exercises this without a notched phone. */
  --safe-t:0px; --safe-r:0px; --safe-b:0px; --safe-l:0px;
  --offtop:calc(var(--btnoff) + var(--safe-t));
  --offright:calc(var(--btnoff) + var(--safe-r));
  --offbot:calc(var(--btnoff) + var(--safe-b));
  --offleft:calc(var(--btnoff) + var(--safe-l));
}
@supports (top:env(safe-area-inset-top)){
  :root{--safe-t:env(safe-area-inset-top,0px);--safe-r:env(safe-area-inset-right,0px);
        --safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);}
}
:root[data-theme="dark"]{
  --bg:#1E2226; --ink:#EEF1F0; --muted:#93A5A3; --hair:#373E3D; --chip:#2A3034;
  --accent:#7FA9F0; --shadow:0 1px 2px rgba(0,0,0,.35);
  /* metal/brass ramps: see the light-mode block above (#57) */
  --edge:rgba(0,0,0,.6); --gloss:rgba(255,255,255,.38);
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
a{color:var(--accent);text-decoration:none;}
a:hover{color:var(--ink);}
/* The links ARE the content, so a keyboard user who cannot see focus cannot use
   the site at all (#23). :focus-visible keeps the ring off mouse clicks; the
   outline follows each element's own border-radius, so it rings the discs. */
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
/* ===========================================================================
   WHAT YOU CAN EDIT WITHOUT DOING GEOMETRY

   The file mixes two kinds of thing. This is a map of the first kind: content
   and taste, safe to change on its own. Everything else derives from MODULE and
   is checked by `npm test`, which reads its constants straight out of this file.

     SITES            the link table -- where each wheel points, its label and
                      the handle engraved on its rim. Add or retarget freely.
     PAIRS / SINGLES  which handles are siblings (they get neighbouring wheels)
                      and which stand alone. PAIR_SLOTS says which wheel indices
                      count as neighbours.
     BRAND / ACCENTS  per-service mark colour, and the accent each theme uses.
     WHEEL_POOL       the colour pool wheels are dealt from -- the original
                      template's seven plus three gap-fillers. Shuffled per load;
                      the deal refuses neighbours closer than 40 degrees of hue.
     CENTRE_FAMILIES  the kinds of gear centre, and the variants of each. Adding
                      a family puts it in rotation and in the Table of Gears at
                      once. Admission rule, Charles's: a wheel a machinist could
                      make, a visible load path hub to rim, no floating metal,
                      and not boring.
     TRAIN            which handle sits on which wheel. Tooth counts and bearing
                      angles in here are only SEEDS -- both are dealt per load.

   Change any of these and the machine still works. Change MODULE, TOOTH_*,
   BAND_*, RIM_UNDER_BAND, MIN_MODULE or the deal bounds and gear sets that
   nothing has measured become reachable: run `npm test` before you push.
   =========================================================================== */

/* The train itself rests via the frame loop (#3) — this only stills the UI
   transitions: badge scale, tooltip fade, toggle colour. */
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
@media (max-width:1080px){:root{--gap:2rem;--pad:6vw;}}
@media (max-width:760px){:root{--pad:28px;}}
@media (max-width:430px){:root{--gap:1.25rem;}}
</style>
</helmet>

<main style="min-height:100vh;min-height:100svh;box-sizing:border-box;display:flex;flex-direction:var(--dir);align-items:center;justify-content:center;gap:var(--gap);padding:var(--pad);background:var(--bg);overflow:hidden;">

  <button onClick="{{ toggleTog }}" title="{{ togLabel }}" aria-label="{{ togLabel }}" aria-expanded="{{ togExpanded }}" style="position:fixed;top:var(--offtop);right:calc(var(--offright) + (var(--btn) + var(--btngap)) * 2);z-index:20;display:flex;align-items:center;justify-content:center;width:var(--btn);height:var(--btn);padding:0;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;transition:color .18s ease;" style-hover="color:var(--ink);">
    {{ togIcon }}
  </button>
  <button onClick="{{ toggleMotion }}" title="{{ motionLabel }}" aria-label="{{ motionLabel }}" aria-pressed="{{ motionPressed }}" style="position:fixed;top:var(--offtop);right:calc(var(--offright) + var(--btn) + var(--btngap));z-index:20;display:flex;align-items:center;justify-content:center;width:var(--btn);height:var(--btn);padding:0;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;transition:color .18s ease;" style-hover="color:var(--ink);">
    {{ motionIcon }}
  </button>
  <button onClick="{{ toggleTheme }}" title="{{ themeLabel }}" aria-label="{{ themeLabel }}" style="position:fixed;top:var(--offtop);right:var(--offright);z-index:20;display:flex;align-items:center;justify-content:center;width:var(--btn);height:var(--btn);padding:0;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;transition:color .18s ease;" style-hover="color:var(--ink);">
    {{ themeIcon }}
  </button>

  <nav aria-label="Table of gears" style="{{ togPanelStyle }}">
    <div style="font:700 11px/1 'Manrope',system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:4px 12px 8px;">Table of Gears</div>
    <sc-for list="{{ togList }}" as="tg">
      <a href="{{ tg.href }}" aria-current="{{ tg.current }}" style="{{ tg.style }}">{{ tg.label }}</a>
    </sc-for>
  </nav>
  <div ref="{{ stageRef }}" tabindex="0" role="application" aria-label="Animated gear machine. Press the left or right arrow key to spin it." onKeyDown="{{ onStageKey }}" onPointerDown="{{ onGrab }}" onPointerEnter="{{ onStageEnter }}" onPointerLeave="{{ onStageLeave }}" style="{{ stageStyle }}">
    {{ gearArt }}
    <sc-for list="{{ links }}" as="link" hint-placeholder-count="7">
      <a href="{{ link.href }}" draggable="false" aria-label="{{ link.label }}" onPointerDown="{{ link.badgeDown }}" onDragStart="{{ link.noDrag }}" onClick="{{ link.clickGuard }}" onMouseEnter="{{ link.enter }}" onMouseLeave="{{ link.leave }}" onFocus="{{ link.enter }}" onBlur="{{ link.leave }}" style="{{ link.discStyle }}">
        {{ link.iconEl }}
        {{ link.tipEl }}
      </a>
    </sc-for>

  </div>

  <div ref="{{ colRef }}" style="position:fixed;left:var(--offleft);bottom:var(--offbot);z-index:15;">
    <h1 style="margin:0;display:flex;align-items:baseline;gap:2px;font-weight:800;font-size:clamp(30px,4.6vw,54px);letter-spacing:-0.045em;line-height:1;color:var(--ink);">
      <span>{{ brandName }}</span>
      <span style="width:.16em;height:.16em;border-radius:50%;background:var(--accent);align-self:flex-end;margin-bottom:.14em;"></span>
      <span style="color:var(--muted);font-weight:600;">{{ brandTld }}</span>
    </h1>
  </div>
</main>

</x-dc>
<!-- SHIPPED LAYER DEFAULTS -- these are intentional, not leftover preview values (#8).
     `data-props` below is both the editor's schema AND the runtime default whenever
     a prop isn't overridden, so its "default" fields are the actual live settings:

       spinUp:true        train winds up from rest on the flywheel
       engravedRims:true  handle struck into each wheel's band -- Charles wants this
                          visible; do not turn off
       parallax:false     off deliberately, commit e6936a7 ("tweak: steel accent,
                          parallax off, tighter corners")
       character:false    chip + machinist stamp, turned off in commit 2e5a721
                          ("fix: #16 ... chips off")
       hoverDrag:true     hover loads the machine to ~40% speed
       accent:"#5F686E"   the steel tone taken from the machine's own metal (--m4
                          light / --m1 dark), Charles's explicit choice, also from
                          e6936a7 -- supersedes both the shipped-in-error red
                          (#E8483A) and the blue SESSION-LOG.md calls "committed"
                          (#3B7DE8); neither of those is what ships today

     SESSION-LOG.md's "Tweak state at handoff" section describes the *original*
     no-repo build session, before either of the two commits above existed -- it
     is a historical record of that one session, not a running description of
     HEAD, and was never updated (nor should it be) as later real commits moved
     these values on. Read this comment block, not that file, for what is live. -->
<script type="text/x-dc" data-dc-script data-props="{&quot;domain&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Wordmark&quot;},&quot;frameRate&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[60,30,24,20],&quot;default&quot;:30,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Gears&quot;},&quot;spinUp&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layers&quot;},&quot;engravedRims&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layers&quot;},&quot;parallax&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layers&quot;},&quot;character&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layers&quot;},&quot;hoverDrag&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layers&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.25,&quot;max&quot;:2,&quot;step&quot;:0.25,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Gears&quot;},&quot;gearScale&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.5,&quot;max&quot;:1.3,&quot;step&quot;:0.05,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Gears&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#5F686E&quot;,&quot;#E8483A&quot;,&quot;#3B7DE8&quot;,&quot;#F4B32B&quot;,&quot;#1FA463&quot;],&quot;default&quot;:&quot;#5F686E&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Gears&quot;},&quot;shuffle&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Gears&quot;}}">
const MODULE = 7;

/* Tooth form. Uniform across the train and derived from the module — never set
   per wheel. Per-wheel `add` and `tip` were the #15 mistake repeated on the tooth
   profile: a set maintained by judgement drifts, and this one had drifted into a
   train where some pairs collided and others left a visible gap (#11).

   Measured against the real outlines at all six adjacent pairs:
     as shipped (base 66%, add 0.88-1.05, tip 0.31-0.40)
       4 points of one wheel's outline inside its neighbour's, up to 1.42px deep
     this form
       0 penetrating points, 1.76px of clearance at the mesh

   The tooth had been a fat wedge — 66% of the circular pitch at the root tapering
   to 31-40% at the tip — and it is fat roots that collide as they swing through
   mesh. Narrowing the base to 48% removes the interference at the same engagement
   depth. These values sit on a plateau (44-48% base and 0.34-0.36 tip all measure
   clean), so the result is not balanced on a knife edge. Raising the addendum to
   0.95 or the base to 52% brings contact straight back. */
const TOOTH_PA = 20;      /* pressure angle in degrees — 20 is the modern standard */
const TOOTH_ADD = 1.00;   /* addendum, in modules — standard full-depth */
const TOOTH_DED = 1.25;   /* dedendum, in modules — standard, leaves root clearance */
const TOOTH_THICK = 0.495; /* tooth thickness at the pitch circle, as a fraction of the
                              circular pitch. A real gear is 0.5 exactly and the shortfall
                              is backlash. Measured at all six pairs: 0.495 gives zero
                              interference with 0.11px between the flanks, so they read as
                              touching without anti-aliasing ever fusing them. */
/* Depth of the engraving band, in modules — uniform on every wheel. Module-based
   rather than a fraction of the radius, which is what keeps the band exactly as
   wide on a 13-tooth blank as on a 19-tooth one.

   Sized to the TEXT it carries and not a pixel more: engraving() sets the handle
   at 0.80 modules, so 1.59 leaves about 0.4 of a module of clear
   metal above and below it. Sized for the WORST glyph rather than the average:
   an underscore is a hairline sitting low in the line, and it is the first
   character to become unreadable when the channel is tight. It was 2.1 — two and a half times the height of its
   own lettering — and on a small blank that surplus was over half the radius,
   which is what squeezed the works into a coin in the middle of a lot of metal. */
const BAND_DEPTH = 1.59;
/* How far in from the tooth roots the engraving band starts, in modules. */
const BAND_RISE = 1.3;
/* The ring of metal left BELOW the band, in modules, before anything may be cut
   into the blank. The band alone is not the reserve: a wheel needs a continuous
   ring under it or the engraving is sitting on the edge of a hole. */
const RIM_UNDER_BAND = 0.6;
/* Where the middle of a line of Manrope sits above its own alphabetic baseline,
   in ems: half of (ascent - descent), measured off the loaded face as 1.07 and
   0.30. The engraving needs this because it does NOT ask the engine to centre
   the type for it — see engraving(). `dominant-baseline: central` is the one
   property in this file that three engines answer three ways, so the ring the
   type rides on is offset by hand instead and the type is hung off the plain
   alphabetic baseline, which every engine puts in the same place (#26).

   The number is OURS, not the engine's: nothing reads a font metric at runtime,
   so the same radius comes out of Blink, WebKit and Gecko alike. If Manrope
   fails to load, the fallback's own middle differs by a few hundredths of an em
   — on the order of a fifth of a pixel against an 11px band. */
const BASELINE_MID = 0.385;
const TOOTH_ROOT_MIN = 4;  /* px floor under any root circle. Without it a tiny gear
                              computes a negative root radius; with it, a gear small
                              enough to hit the floor comes out with SHORT teeth that
                              no longer reach their partner. Anything sizing a gear
                              must check this rather than trip over it — see
                              planetaryMenuFor(). */
const TOOTH_FILLET = 0.38; /* root fillet radius, in modules — the standard value that
                              goes with 20-degree full depth. Without it the flank meets
                              the root circle at a sharp corner, which no cut gear has. */
/* The ring gear's stub addendum, as a fraction of the ring's own module. Full
   depth fouls three of the five dealt sets; 0.70 clears all five at every
   carrier clocking. It lived as a bare literal inside gearSvg and was therefore
   the one constant tools/test.js could not extract, so the suite kept its own
   copy -- and mutating the page alone left the suite green at 21/21 while 10 of
   19 sets fouled, ringPen up to 0.229, including the test literally named
   "every dealable single-row set meshes". Named here so there is exactly one of
   it, and extracted by the suite like every other constant (#51). */
const RING_STUB = 0.70;

const BASE_MS = 21000;
const GHOST_COLORS = ['#9AA6AD', '#A9B4BA', '#8F9BA3', '#B3BCC2'];

/* ONE WAY TO WRITE A POLAR POINT. There were seven copies of this formula --
   P, PT, at, XY+f2, a second P, and two arc builders that differed only in a
   hardcoded large-arc flag (#59). Every one of them rounded to the same two
   decimals, so they were duplicates in the strict sense: same maths, same
   output, seven chances to fix a bug in six places.
   polarR takes RADIANS, which is what the tooth loops already carry; polarD
   takes DEGREES, which is what the web and engraving code carries. Both return
   the "x,y" pair an SVG path wants. */
const polarR = (rad, a) => (rad * Math.cos(a)).toFixed(2) + ',' + (rad * Math.sin(a)).toFixed(2);
const polarD = (rad, deg) => polarR(rad, deg * Math.PI / 180);

function segCross(p1, p2, p3, p4) {
  const s = (a, b, c) => (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
  return s(p1, p2, p3) * s(p1, p2, p4) < 0 && s(p3, p4, p1) * s(p3, p4, p2) < 0;
}
function segDist(p, a, b) {
  const vx = b.x - a.x, vy = b.y - a.y, L = vx * vx + vy * vy;
  let t = L ? ((p.x - a.x) * vx + (p.y - a.y) * vy) / L : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + t * vx), p.y - (a.y + t * vy));
}
const ENDS_APART = 90; /* extra push between the two extremities of the spine */
const CLEARANCE = 13; /* px kept between the tip circles of wheels that are not meshed */

/* The gear train. Each entry meshes with the one before it:
   teeth  — tooth count (sets size and speed)
   angle  — bearing in degrees from the previous gear's centre
   slug   — icon/link to seat on this gear's hub (omit for a plain idler)
   metal  — 'steel' | 'brass'
   Add or remove an entry and the whole train re-solves: spacing, direction, ratio. */
/* Seven site wheels of near-equal size, each with its own web design.
   `link: 'chain'` (or `'belt'`) drives the next wheel by strand instead of tooth mesh.
   No entry sets one today, so no chain or belt is drawn — see CLAUDE.md,
   "Dormant capability: chain and belt", before re-enabling either. */
/* One directly-meshed train: every wheel drives its neighbour, so spacing is fixed by
   the pitch radii and only the bearing varies — a gentle serpentine, no slack to fold. */
/* ---------------------------------------------------------------------------
   THE CONFIG. Settings live in config.js; this file keeps the machinery.

   There is deliberately NO fallback copy of the link table here. A duplicate is
   the one failure this whole split exists to prevent: edit one, forget the
   other, and the page ships something nobody chose. So if the config is missing
   the machine still turns -- on unlinked wheels -- and says loudly why, which is
   visibly wrong rather than quietly stale. CI asserts config.js is reachable and
   parses, so that state should never reach production.
   --------------------------------------------------------------------------- */
const CFG = (typeof window !== 'undefined' && window.WOZI_CONFIG) || null;
if (!CFG) console.error('wozi: config.js did not load — the train will render '
  + 'without links. Check that it is published (deploy.yml whitelist).');
const CONF = CFG || { SERVICES: {}, PEOPLE: [], PAIR_SLOTS: [], PAIRS: [],
  SINGLES: [], BRAND: {}, PILL_STACK: {}, ACCENTS: {},
  WHEEL_POOL: ['#4A90E2', '#17A05C', '#8CB8F2'] };

/* WHICH CHAINS ARE ON STAGE, and whether they share it. `?who=all` shows every
   chain; `?who=<slug>` or a person's own hostname shows one. Selection stays in
   the browser so one cached object serves every alternate domain name. */
const STAGE = (function () {
  const people = CONF.PEOPLE || [];
  if (!people.length) return { mode: 'solo', people: [] };
  let q = '';
  try { q = new URLSearchParams(location.search).get('who') || ''; } catch (e) {}
