      this._chainEls.forEach(c => {
        if (c.el) c.el.style.strokeDashoffset = (-(this._M[c.comp != null ? c.comp : 0] || 0) * PITCH / 360 * c.sign).toFixed(2) + 'px';
      });
    }
    /* Planetary internals: sun, carrier and planet spins are all fixed multiples
       of their host wheel's angle -- one clock, several ratios. k is the factor
       RELATIVE to the wheel (the svg lives inside the rotating wheel div):
       sun -1 (stationary in page frame), carrier -Zs/(Zs+Zr), planet spin
       +ZrZs/(Zp(Zr+Zs)). */
    if (this._epiEls) {
      for (let i = 0; i < this._epiEls.length; i++) {
        const e = this._epiEls[i];
        if (e.el) e.el.style.transform = 'rotate(' + (e.base + e.k * (e.g.dir * (this._M[e.g.comp != null ? e.g.comp : 0] || 0) / e.g.teeth)).toFixed(3) + 'deg)';
      }
    }
  }

  startPhysics() {
    for (let c = 0; c < this._M.length; c++) this._M[c] = 0;
    this._dirSign = 1;
    /* EVERY STORED CHOICE IS ALREADY IN STATE by the time this runs (GitHub
       #135) -- theme, motion, speed, wear and the three #125 style flags are read
       in the initial state declaration, where the first render can see them. Six
       `setState` calls used to sit here, which is why the composition was drawn
       once at the schema defaults and immediately again at the stored ones. The
       bounds checks moved with them, unchanged: see storedNumber/storedFlag.
       The one thing that could not move is below -- the flywheel's seed, which
       needs a value only this function computes. */
    /* WHETHER THE TRAIN STARTS RUNNING IS motionActive()'s QUESTION, and asking
       it is now the whole of it: the stored override wins in either direction,
       otherwise follow prefers-reduced-motion. That was written out a second time
       here while `motion` was restored a few lines above by setState -- state the
       method could not yet see. It can, so there is one home for the answer
       again. */
    const startRunning = this.motionActive();
    /* One flywheel per mesh (GitHub #122). Seeded lazily: solve() has not
       necessarily run at this point, and a component that appears later simply
       starts from the same place this would have put it.
       GITHUB #142, AND WHAT MEASURING IT ACTUALLY SHOWED. idleRate() scales by
       speedFactor(), which reads state.speed, so #142 read this line as seeding a
       spinUp:false page at the DEFAULT rate rather than the stored one -- on the
       reasoning that the setState restoring the speed ran a few lines above and
       React does not make `this.state` readable until the next render. That last
       step is false for THIS runtime: support.js's __setLogicState assigns
       `logic.state` synchronously before scheduling the re-render, so the restore
       above did reach this line. Probed directly with spinUp:false and a stored
       20x, the seed was rateAt(20) both before and after this change. So #142 was
       a latent hazard rather than a live fault, and what removes the hazard is
       that the value is now in state before any of this runs -- the seed cannot
       depend on where a restore was written any more. */
    const seed = (this.props.spinUp === false && startRunning) ? this.idleRate() : 0;
    /* HOW MANY FLYWHEELS THERE ARE IS THE SOLVE'S ANSWER, NOT A NUMBER WRITTEN
       HERE (GitHub #175). This seeded a fixed eight, which was exactly the count
       a full chain drive reaches on today's config -- a constant sitting on its
       own limit, so one more link or one more person put a component past the end
       of the seed. The seed value is stored instead and applied to each component
       the first time the integrator meets it, which is what finally makes the
       claim above true: "a component that appears later simply starts from the
       same place this would have put it" was written for the `|| 0` fallbacks,
       and those start it from a STANDSTILL, not from the seed. Nothing here has
       to know the count, so nothing here can be wrong about it. */
    this._seedV = seed;
    this._v = [];
    this._M = [];
    let last = performance.now();
    const step = (now) => {
      /* Cap the update rate — see tickRate(), which is also what the speed
         ladder's aliasing ceiling is computed against. */
      const budget = 1000 / this.tickRate() - 1.5;
      /* HUD INSTRUMENTATION, AND ITS ENTIRE COST WHEN THE HUD IS OFF (CL#110):
         one comparison against a module constant, here and three lines down.
         `HUD` is resolved once at load, so nothing in this loop parses a query
         string, reads the DOM or allocates. The counters are read on a timer
         somewhere else entirely -- see hudSample() -- because an overlay that
         re-renders inside the rAF loop is measuring its own overhead. */
      if (HUD) this._rafN++;
      if (now - last < budget) { this._raf = requestAnimationFrame(step); return; }
      /* The raw interval, before the 60ms clamp below: a dropped tick is
         precisely the case the clamp exists to survive, so measuring drops off
         the clamped value would hide every drop longer than two frames. */
      const gap = now - last;
      const dt = Math.min(60, gap);
      last = now;
      /* One expression decides whether to integrate — nothing can latch it asleep. */
      const asleep = document.hidden || this._offscreen === true;
      if (HUD) this.hudTick(gap, asleep);
      if (!asleep) {
        /* Flywheel: bleed back toward the train's natural pace. */
        /* LAYER: hover drag — attention loads the machine and it slows a little. */
        const load = (this.props.hoverDrag && (this.state.hover || this.state.overStage)) ? 0.4 : 1;
        const target = this.motionActive() ? this._dirSign * this.idleRate() * load : 0;
        /* ONE CLOCK, SEVERAL ANGLES (GitHub #122, CL#142). Still one rAF loop and
           one `dt`, which is what the "one clock" invariant is actually about --
           wheels that MESH must share a clock or their teeth diverge (#3). Two
           chains that share no gearing do not mesh, so they do not have to share
           an angle, and giving them one is what made holding chain 1 stop chain
           2.

           The chain being dragged is skipped rather than the whole loop being
           skipped, which is the substance of the fix: `_dragging` used to gate
           the entire integration, so a hand on ANY wheel froze the page. */
        const n = this.solve().comps || 1;
        for (let c = 0; c < n; c++) {
          /* SEEDED ON FIRST SIGHT, so the count comes from the solve and never
             from a bound written down anywhere (GitHub #175). A component the
             solve produces after startPhysics ran -- an extra person, an extra
             link, a strand splitting a mesh -- joins the integrator at the same
             velocity the first ones did instead of at rest. */
          if (this._v[c] === undefined) { this._v[c] = this._seedV || 0; this._M[c] = 0; }
          if (this._dragComp === c) continue;
          this._v[c] = approachSpeed(this._v[c] || 0, target, dt);
          this._M[c] = (this._M[c] || 0) + this._v[c] * dt;
        }
        this.applyRotation();
      }
      /* Magnetic hub caps: underdamped spring (zeta ~0.5) so a released cap
         overshoots a touch and lands back on the axle. Same clock as the train;
         entries delete themselves once settled, so the loop is normally empty. */
      const dts = Math.min(dt, 60) / 1000;
      for (const key in this._badgeOff) {
        const o = this._badgeOff[key], el = this._badgeEl[key];
        if (!el) { delete this._badgeOff[key]; continue; }
        if (this._badgeDragging !== key) {
          const K = 180, C = 13;
          o.vx += (-K * o.x - C * o.vx) * dts;
          o.vy += (-K * o.y - C * o.vy) * dts;
          o.x += o.vx * dts; o.y += o.vy * dts;
          if (Math.abs(o.x) < 0.4 && Math.abs(o.y) < 0.4 && Math.abs(o.vx) < 8 && Math.abs(o.vy) < 8) {
            el.style.transform = 'translate(-50%,-50%) scale(' + ((this.state.hover === key || this._badgeDragging === key) ? 1.06 : 1) + ')';
            delete this._badgeOff[key];
            continue;
          }
        }
        el.style.transform = 'translate(-50%,-50%) translate(' + o.x.toFixed(1) + 'px,' + o.y.toFixed(1) + 'px) scale(' + ((this.state.hover === key || this._badgeDragging === key) ? 1.06 : 1) + ')';
      }
      this._raf = requestAnimationFrame(step);
    };
    this._raf = requestAnimationFrame(step);

    /* Stop integrating when the machine is scrolled out of view: no frames, no CPU.
       Starts awake, and only ever sleeps on a real off-screen report for a laid-out
       stage — a first callback on a zero-size box must not put it to sleep. */
    if (window.IntersectionObserver && this._stageRef.current) {
      this._io = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          const box = e.boundingClientRect;
          if (!box || box.width < 4 || box.height < 4) return;
          this._offscreen = e.isIntersecting === false;
        });
      }, { rootMargin: '120px' });
      this._io.observe(this._stageRef.current);
    }
  }

  /* ===========================================================================
     THE ANIMATION HUD (CL#110, GitHub #92). Three methods, and the division of
     labour between them is the feature:

       hudTick()    runs INSIDE the rAF loop. It does integer arithmetic on
                    counters and one array store. It touches no DOM, allocates
                    nothing, and reads nothing that can force layout.
       hudSample()  runs on a setInterval, outside the loop entirely. It reads
                    those counters, turns them into rates, and writes text.
       hudMount()   builds the panel once.

     ONE CLOCK IS NOT NEGOTIABLE and nothing here bends it. The HUD reads `_M`,
     `_v`, the counters and the cached solve; it never writes any of them, never
     calls solve() (it reads `_solved`, and returns "--" rather than causing a
     re-solve), never calls setState, and never touches `_offscreen`. It cannot
     start, stop, speed up or wake the loop. When the sleep gate sleeps, the
     rates it reports fall to zero and the gate row says why -- which is the HUD
     reporting the gate rather than defeating it (#7).
     =========================================================================== */

  /* Called once per tick that clears the frame budget, asleep or not. */
  hudTick(gap, asleep) {
    this._tickN++;
    this._tickDt[this._tickI++ % HUD_WINDOW] = gap;
    if (this._tickFill < HUD_WINDOW) this._tickFill++;
    /* A DROPPED TICK IS A SLOT THAT WENT BY WITH NOTHING IN IT. The budget is
       `1000/tickRate - 1.5`, so a tick is due every ~33.3ms at 30 and a gap of
       two intervals means one slot was missed. Rounding the gap to whole
       intervals and subtracting the one that did arrive counts them.

       NOT COUNTED ACROSS A SLEEP, in either direction. A hidden tab gets no rAF
       callbacks at all and an off-screen stage stops integrating, so the gap
       that spans a sleep is seconds long and would be charged as hundreds of
       drops -- which would be reading the sleep gate WORKING as the renderer
       failing. Both the tick before and the tick after have to have been awake
       for the interval between them to be a measurement of anything. */
    if (!asleep && !this._hudAsleep) {
      const miss = Math.round(gap / (1000 / this.tickRate())) - 1;
      if (miss > 0) this._tickDrop += miss;
    }
    this._hudAsleep = asleep;
  }

  hudMount() {
    if (!document.body) return;
    /* TOP LEFT, because it is the one corner of this page with nothing in it:
       the four controls are fixed top-right, the wordmark bottom-left, and the
       table of gears opens on the left EDGE at 50%. Offsets are the same
       --offtop/--offleft the rest of the furniture uses, so the safe-area inset
       is already in them and tools/devices.py's safe-area pass measures this
       panel on the same terms as the buttons.

       pointer-events:none IS LOAD-BEARING. The whole stage is one grab target,
       and a fixed panel sitting over its top-left corner would swallow the
       pointerdown that starts a drag -- on a phone that is a large fraction of
       the machine. Nothing in here is interactive, so nothing is lost, and the
       HUD cannot be the reason a gesture did not take.

       aria-hidden, deliberately. This is an instrument, not content: it is
       reachable only by typing `?hud` into the address bar, every value in it
       is a number mirrored from somewhere else on the page, and it changes
       twice a second -- an accessibility tree that carried it would be reading
       out a rolling telemetry feed over the top of a machine that is the actual
       subject. Nothing here is focusable and nothing here is a control. */
    const box = document.createElement('div');
    box.setAttribute('aria-hidden', 'true');
    box.style.cssText = 'position:fixed;top:var(--offtop);left:var(--offleft);z-index:40;'
      + 'pointer-events:none;background:var(--chip);border:1px solid var(--hair);'
      + 'border-radius:12px;padding:8px 11px;box-shadow:var(--shadow);color:var(--ink);'
      + "font:400 10px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;"
      + 'font-variant-numeric:tabular-nums;white-space:nowrap;';
    const title = document.createElement('div');
    title.textContent = 'wozi · hud';
    title.style.cssText = "font:700 10px/1.6 'Manrope',system-ui,sans-serif;letter-spacing:.14em;"
      + 'text-transform:uppercase;color:var(--muted);padding-bottom:4px;';
    box.appendChild(title);
    /* One value element per row, kept in a map so a sample is a handful of
       textContent writes against a known target -- no querying, no rebuilding,
       and no element created after mount. */
    this._hudRow = {};
    this._hudWas = {};
    const rule = () => {
      const d = document.createElement('div');
      d.style.cssText = 'height:1px;margin:5px 0;background:var(--hair);';
      box.appendChild(d);
    };
    const row = (key) => {
      const line = document.createElement('div');
      line.style.cssText = 'display:flex;gap:7px;';
      const lab = document.createElement('span');
      lab.textContent = key;
      lab.style.cssText = 'flex:0 0 52px;color:var(--muted);';
      const val = document.createElement('span');
      val.textContent = '--';
      line.appendChild(lab);
      line.appendChild(val);
      box.appendChild(line);
      this._hudRow[key] = val;
    };
    /* Grouped by the question each group answers: what is being drawn, whether
       the renderer is keeping up, how fast it is turning, how it was fitted,
       and what the panel itself costs. */
    row('scope');
    rule();
    row('tick/s'); row('raf/s'); row('write/s'); row('drop'); row('tick ms'); row('gate');
    rule();
    row('speed'); row('master'); row('teeth');
    rule();
    row('wheels'); row('gsfit'); row('binds'); row('gear px'); row('view');
    rule();
    row('hud');
    document.body.appendChild(box);
    this._hudBox = box;
    this._hudT = performance.now();
    this._hudM = (this._M && this._M[0]) || 0;
    this._hudN = { tick: 0, raf: 0, paint: 0 };
    this._hudDrop = 0;
    this._hudCost = 0;
    this._hudTimer = setInterval(() => this.hudSample(), HUD_MS);
    this.hudSample();
  }

  hudSample() {
    const t0 = performance.now();
    const box = this._hudBox;
    if (!box) return;
    /* Written only when the string actually changes. Most of these rows are
       constant for the life of a viewport -- the census, the fit, the binding
       term, the device pixel ratio -- so a sample is typically six or seven
       text writes rather than sixteen. */
    const put = (key, text, warn) => {
      const el = this._hudRow[key];
      if (!el) return;
      const mark = warn ? 'var(--accent)' : 'var(--ink)';
      if (this._hudWas[key] !== text) { el.textContent = text; this._hudWas[key] = text; }
      if (el.style.color !== mark) el.style.color = mark;
    };
    const dtms = Math.max(1, t0 - this._hudT);
    const rate = (now, was) => (now - was) * 1000 / dtms;
    const ticks = rate(this._tickN, this._hudN.tick);
    const rafs = rate(this._rafN, this._hudN.raf);
    const paints = rate(this._paintN, this._hudN.paint);
    const degs = ((this._M[0] || 0) - this._hudM) * 1000 / dtms;
    this._hudT = t0;
    this._hudM = this._M[0] || 0;
    this._hudN = { tick: this._tickN, raf: this._rafN, paint: this._paintN };

    const nominal = this.tickRate();
    /* THE ONE READING THAT MEANS SOMETHING ON ITS OWN. Ticks per second is
       invariant to the speed multiplier, because the work per tick is a fixed
       number of transform writes whatever the multiplier is (#96).

       MEASURED, and the figure here replaces an earlier unsourced one: 30.03
       ticks/s, median interval 33.3ms and p95 34.3ms, with ZERO ticks needing a
       third raw frame across ~1,700 samples -- combined stage, one chain, and a
       223-wheel viewport, at 1x and at 200x, including a run with every core
       deliberately oversubscribed. Harness kept as scratchpad/frame_timing.py.
       That is one machine, headless, one engine, no battery and no thermal
       throttling, so it says what a quiet desktop does and nothing about a weak
       phone -- which is the case this HUD exists to report from.

       So a tick rate below nominal is never "you set it too fast":
       it is wheel count, viewport, compositing or another tab, and it is a real
       bottleneck. Marked at 90% of nominal, which is below the 95% the healthy
       page sits at and above anything that could be called noise. */
    put('tick/s', ticks.toFixed(1) + ' of ' + nominal, ticks < nominal * 0.9);
    put('raf/s', rafs.toFixed(1));
    /* Writes per tick: what applyRotation() actually addresses. The count is
       taken here, on the timer, rather than by counting inside the loop. */
    const els = (this._spinEls ? this._spinEls.filter(Boolean).length : 0)
      + (this._ghostEls ? this._ghostEls.length : 0)
      + (this._epiEls ? this._epiEls.length : 0)
      + (this._chainEls ? this._chainEls.length : 0);
    /* write/s BELOW tick/s IS NOT A FAULT -- applyRotation() returns early on
       any tick that moved less than 0.05 master-degrees, so a paused or resting
       train ticks at nominal and writes nothing. The pair is what separates
       "the loop stopped" from "the loop ran and had nothing to do". */
    put('write/s', paints.toFixed(1) + ' × ' + els);
    /* CUMULATIVE SINCE LOAD, which is what makes it worth having -- a stall
       that happened while you were doing something else still has to be there
       when you look. But the WARNING is on the recent ones only: a page that
       dropped two ticks getting itself onto the screen and none since is not a
       page with a problem, and a counter that stays lit forever over a boot
       cost teaches you to ignore it. Total, then what it has done since the
       last sample. */
    const dropped = this._tickDrop - this._hudDrop;
    this._hudDrop = this._tickDrop;
    put('drop', this._tickDrop + (dropped ? ' · +' + dropped : ''), dropped > 0);
    /* Percentiles over the rolling window, sorted here and never in the loop. */
    const win = this._tickDt.slice(0, this._tickFill).sort((a, b) => a - b);
    const at = (q) => win.length ? win[Math.min(win.length - 1, Math.floor(q * win.length))] : 0;
    put('tick ms', at(0.5).toFixed(1) + ' p50 · ' + at(0.95).toFixed(1) + ' p95');
    /* THE SLEEP GATE, REPORTED AND NEVER OVERRIDDEN, AND NEVER RE-DERIVED. The
       one expression that decides whether to integrate lives in step() and
       stays there; what arrives here is the verdict it reached, carried out on
       the tick that reached it. Writing the same test a second time would give
       the page two answers to a question #7 proves it must only have one of --
       and it would also give tools/mutation_gate.py two lines to substitute
       where its registry insists on exactly one.
       `document.hidden` IS read live here, and only that half. A hidden tab
       gets no rAF callbacks at all, so the loop's verdict is frozen at whatever
       it was when the tab went away and could never report the hidden case at
       all -- while the off-screen half, which is the one #7 was about and the
       one that can be got wrong, still comes from the loop and is not
       second-guessed. */
    const asleep = document.hidden || this._hudAsleep === true;
    put('gate', this._dragging ? 'dragging'
      : !asleep ? (this.motionActive() ? 'running' : 'paused')
      : document.hidden ? 'asleep · hidden' : 'asleep · offscreen', asleep);

    const speed = this.speedFactor();
    put('speed', speed + '×' + (this.speedStrobes(speed) ? ' · strobing' : ''),
      this.speedStrobes(speed));
    /* The master angle MEASURED, not the multiplier assumed: `degs` is the
       difference in `_M` over wall-clock time between two samples, so a speed
       setting can be confirmed against idleRate() rather than trusted. */
    put('master', ((((this._M[0] || 0) % 360) + 360) % 360).toFixed(0) + '° · '
      + degs.toFixed(1) + '°/s of ' + (this.idleRate() * 1000).toFixed(1));
    /* One tooth of travel is 360 master-degrees on EVERY wheel -- the tooth
       count cancels -- so there is one tooth-per-tick figure for the whole
       train, and half a pitch per tick is the Nyquist limit at which it strobes
       (#96). Derived from the two measurements above rather than from the stop,
       so it says what the browser did and not what was asked for. */
    const perTick = ticks > 0 ? degs / ticks : 0;
    put('teeth', (perTick / 360).toFixed(3) + '/tick · '
      + (perTick / 180 * 100).toFixed(0) + '% nyq', perTick / 180 >= 1);

    /* READ, NEVER SOLVED. `_solved` is the cache applyRotation() fills every
       tick; calling solve() here could pay for a whole re-solve on the HUD's
       timer, which is exactly the kind of cost an instrument must not add. */
    const s = this._solved;
    if (s) {
      let linked = 0, idlers = 0;
      s.gears.forEach(g => { if (g.role === 'idler') idlers++; else linked++; });
      const ghosts = (this.state.ghosts || []).length;
      put('wheels', (linked + idlers + ghosts) + ' = ' + linked + 'L ' + idlers + 'I ' + ghosts + 'G');
    }
    /* --gsfit off the inline declaration fitStage() wrote, NOT off
       getComputedStyle: resolving a computed style here would force a style
       recalculation twice a second on behalf of a readout. `_gsr` beside it is
       the quantised value the wheels are actually drawn at, and the pair is
       what says whether quantisation is costing anything. */
    const gsfit = document.documentElement.style.getPropertyValue('--gsfit');
    put('gsfit', (gsfit || '--') + ' → ' + (this._gsr || '--'));
    put('binds', this._fitBind || '--');
    /* The gear in CSS px and in device px, which is the pair #79 needed: a
       wheel can be the right size in layout and the wrong size on the glass. */
    const css = WHEEL_SPAN * (this._gsr || 0);
    const dpr = window.devicePixelRatio || 1;
    put('gear px', css.toFixed(0) + ' css · ' + (css * dpr).toFixed(0) + ' dev × ' + dpr);
    const vv = window.visualViewport;
    put('view', Math.round((vv && vv.width) || window.innerWidth) + '×'
      + Math.round((vv && vv.height) || window.innerHeight));
    /* THE SELECTION, NOT THE SPINE, and this row is the last thing that still said
       WHO (GitHub #169). WHO was split into SPINE -- which chain is the axis -- and
       SELECTED -- which person the page is about -- because every reader had to know
       which of the two it meant; this reference was not carried over, so `?hud`
       threw a ReferenceError every HUD_MS on any solo page. It survived because
       STAGE.mode short-circuits the expression on the combined stage, which is
       where anyone testing the HUD would look. The guard is kept even though that
       branch cannot see a null SELECTED, for the same reason the `|| '?'` was
       already there. */
    put('scope', (STAGE.mode === 'all' ? 'all' : ((SELECTED && SELECTED.slug) || '?'))
      + ' · ' + (FORCE_KIND || 'mixed'));

    /* THE PANEL'S OWN COST, MEASURED BY THE PANEL. Everything above this line
       is what a sample costs, smoothed over samples so a single scheduling
       hiccup does not read as the overlay being expensive. Reported as a share
       of one frame budget so it is comparable with the thing it is measuring.
       What it does NOT include is the style, layout and paint the browser does
       afterwards with the text this wrote -- that is off this thread of
       execution and cannot be timed from inside it. The external A/B in the
       changelog is what covers that half. */
    const cost = performance.now() - t0;
    this._hudCost = this._hudCost ? this._hudCost * 0.7 + cost * 0.3 : cost;
    const share = this._hudCost * (1000 / HUD_MS) / 10;
    put('hud', this._hudCost.toFixed(2) + 'ms × ' + (1000 / HUD_MS) + '/s · '
      + share.toFixed(2) + '% cpu');
  }

  /* Canvas text measurement, memoised. Cheap, synchronous, and exact for the
     font actually being used -- which matters because the pill's opening width
     is a transition target and cannot be `max-content`. */
  textWidth(text, font) {
    if (!this._tw) this._tw = {};
    const key = font + '|' + text;
    if (this._tw[key] !== undefined) return this._tw[key];
    if (!this._measureCtx) {
      const c = document.createElement('canvas');
      this._measureCtx = c.getContext('2d');
    }
    this._measureCtx.font = font;
    const w = Math.ceil(this._measureCtx.measureText(text).width);
    this._tw[key] = w;
    return w;
  }

  /* THE INK'S OWN VERTICAL EXTENT for a string at a given size -- how far the
     drawn glyphs actually reach above and below their baseline, measured on the
     same canvas textWidth() measures the width on.

     IT IS WHAT MAKES THE DATUM STANDOFF THE SAME FOR EVERY NAME. A standoff
     referenced to the reserved box hands a name with a descender less air than
     one without: "Harper" has a p and "Charles" has nothing below the baseline,
     so the same box offset puts her ink measurably nearer the rule than his.
     That is the SAME shape of inconsistency the per-chain standoff was, one
     scope down, and the fix is the same -- measure the thing, do not assume it.

     THE FALLBACK IS NOT DECORATIVE. actualBoundingBox* is unavailable on older
     engines, and an undefined here would propagate as NaN into a transform and
     lose the mark entirely; the fractions are a monospace face's typical cap
     and descender depth, which is a worse answer than a measurement and a much
     better one than no mark. */
  textInk(text, font, fs) {
    if (!this._ti) this._ti = {};
    const key = font + '|' + text;
    if (this._ti[key] !== undefined) return this._ti[key];
    if (!this._measureCtx) {
      const c = document.createElement('canvas');
      this._measureCtx = c.getContext('2d');
    }
    this._measureCtx.font = font;
    const m = this._measureCtx.measureText(text);
    const num = (v, fallback) => (typeof v === 'number' && isFinite(v)) ? v : fallback;
    const v = { ascent: num(m.actualBoundingBoxAscent, fs * 0.72),
                descent: num(m.actualBoundingBoxDescent, fs * 0.21) };
    this._ti[key] = v;
    return v;
  }

  loadIcons() {
    const slugs = TRAIN.filter(t => t.slug).map(t => t.slug);
    Promise.all(slugs.map(s => fetch('assets/icons/' + s + '.svg').then(r => r.ok ? r.text() : '').catch(() => '')))
      .then(texts => {
        const icons = {};
        slugs.forEach((s, i) => {
          let t = texts[i] || '';
          if (t) {
            /* Every icon in assets/ is cut with a literal fill="#000" today, so
               an exact string swap works -- but it works by luck, and the failure
               is silent: an icon re-exported as #000000, #000 in single quotes,
               or in lower/upper case keeps its black fill, renders invisible on
               the dark page, and logs nothing. Match the ways a black fill is
               actually written instead (#59). */
            t = t.replace(/fill\s*=\s*(["'])\s*(#000|#000000|black)\s*\1/gi,
                          'fill="currentColor"');
            t = t.replace('<svg ', '<svg aria-hidden="true" focusable="false" width="100%" height="100%" ');
          }
          icons[s] = t;
        });
        this.setState({ icons: icons });
      });
  }

  /* Lay the run along the viewport's long axis, so the belt spans open space instead of
     doubling back on itself. Only the layout bearings rotate — badges stay upright. */
  axisRot() { return window.innerHeight > window.innerWidth * 1.05 ? 90 : 0; }

  /* HOW MANY IDLERS THE BRIDGE CAN AFFORD. Two is the target -- about two wheel
     diameters of gap -- and the cross axis is what takes it away, which is why
     portrait is the case that drops to one: there the cross axis is the scarce
     one and the gap is what gives, because the wheels do not.

     MEASURED, NOT ASSUMED, and derived rather than tuned. The long axis is what
     asks for a scale (LINK_SHARE of it, over the span a nominal chain occupies);
     STAGE_CROSS says how much cross axis the composition then wants at that
     scale; the second idler is taken only while that still FITS the cross axis.

     IT ASKS THE FIT'S OWN QUESTION, not half of it (#85). fitStage() draws a
     gear at a standard SIZE and shrinks it only when the axis cannot afford
     that, so the scale this has to reason about is the smaller of those two --
     asking the long axis alone would have handed the bridge a scale 1.8x larger
     than anything renders at on a wide screen, and bought a second idler with
     cross axis the composition does not have. Neither term needs a solve, which
     is why this can still run before there is one.
     It deliberately does not spend CROSS_BLEED: the bleed exists so a serpentine
     may run off the top and bottom of a wide screen, not so a bridge may hang off
     the side. This is also the legibility floor doing its job -- everything that
     would otherwise push the fit down far enough to smear the engraving arrives
     through the cross term, so bounding the bridge here bounds it there.

     HYSTERESIS, or a drag across the threshold adds and removes a whole wheel on
     every pixel: one nominal wheel of cross axis must be spare to TAKE the second
     idler, and none to keep it. The gap between the two thresholds is a wheel,
     which is the thing being added -- not a percentage someone picked.

     WHICH AXIS IS THE LONG ONE COMES FROM axisRot(), not from max/min. They
     disagreed between 1.00 and 1.05: axisRot only rotates past h > w * 1.05, so
     a viewport very slightly taller than it is wide stays in landscape while
     max/min called its height the long axis -- and this function would then have
     been measuring the bridge across the axis the stage does not run along.
     Asking the rotation itself makes the two agree by construction.

     AND IT MEASURES THE VIEWPORT THE WAY axisRot() DOES. This read the VISUAL
     viewport while the rotation it defers to reads innerWidth/innerHeight, so
     the two were handed different numbers whenever they differ -- which on iOS
     is exactly the toolbar collapsing, the moment this is re-run. Near-miss
     rather than a live fault at 390x844, and free to make consistent: one
     measurement feeding both halves of one decision. */
  idlerCount() {
    const w = window.innerWidth, h = window.innerHeight;
    const turned = this.axisRot() !== 0;
    const longAvail = turned ? h : w, crossAvail = turned ? w : h;
    const scale = Math.min(LINK_SHARE * longAvail / NOMINAL_SPAN,
                           WHEEL_SPAN ? TARGET_GEAR_PX / WHEEL_SPAN : Infinity);
    const want = STAGE_CROSS(MAX_IDLERS) * scale;
    const spare = this._idlerN === MAX_IDLERS ? 0 : MODULE * TEETH_MEAN * scale;
    return IDLERS_FOR(want + spare <= crossAvail);
  }

  /* The one number every rendered coordinate in the stage is multiplied by.
     IT IS SOLVED ON DEMAND, NOT WAITED FOR (GitHub #135). This used to read the
     boot `--gsfit` declaration -- 0.86, a figure that file calls provisional --
     because the real one was only computed by fitStage(), which runs from
     componentDidMount, which is after the first render. So the whole composition
     was built once at 0.86 against a real ~1.4 on a desk, thrown away, and built
     again; and the ghosts then had to be solved a THIRD time, because fitEscapes
     had run against the wrong scale. Nothing about the fit needs a mount --
     fitScale() reads innerWidth/innerHeight/visualViewport and the solve, no
     getComputedStyle and no layout -- so the honest thing is to ask for it.
     Memoised into the same `_gsr` fitStage compares against, so the two cannot
     disagree and the first fitStage() finds nothing to change. */
  gsRender() {
    if (!this._gsr) this._gsr = this.fitScale();
    return this._gsr;
  }

  /* THE VIEWPORT AS THE FIT MEASURES IT, in one place because two callers ask.
     MEASURE WHAT IS ACTUALLY VISIBLE. On iOS Safari `100vh` is the LARGE
     viewport -- the height the page would have if the toolbars were collapsed --
     while `window.innerHeight` is the visual viewport, which is what you can
     currently see. The two differ by the toolbar, so `main` was laying out
     taller than the screen while the scale was computed against the shorter
     number: the train ended up centred in a box that extends past the fold,
     which is dead space at one end and clipping at the other. Desktop never
     showed it because there the two are equal.
     `min-height:100svh` on `main` fixes the layout half (svh is the SMALL
     viewport, never larger than what is visible; the `100vh` before it is the
     fallback for engines that do not know svh). This is the measuring half. */
  viewBox() {
    const vv = window.visualViewport;
    return { w: (vv && vv.width) || window.innerWidth,
      h: (vv && vv.height) || window.innerHeight };
  }

  /* THE QUANTISED LAYOUT INPUTS THE SOLVE READS OFF THE INSTANCE, AND THEIR ONE
     HOME. solve() consults `_axisRot`, `_tight`, `_spreadBoost` and `_idlerN`, so
     they have to be seated before the FIRST solve and re-seated whenever the
     viewport moves -- and if boot seated them anywhere else, the boot values and
     the resize values would be two copies of the same arithmetic, free to
     disagree. Before GitHub #135 they were seated only in fitStage(), which is
     after the first render: solve() carried a partial self-seed for `_axisRot`
     and `_idlerN` and simply let `_tight` read as 1, so the first composition was
     laid out at a spacing no viewport had asked for.

     Returns whether anything moved, and does NOT re-render: the caller knows what
     a change is worth. On a resize it is a full rebuild; at boot it is nothing at
     all, because no render has happened yet. */
  seatLayout() {
    const rot = this.axisRot();
    /* More room means longer drive runs: the strands get real straight spans instead of
       being mostly wrap. Quantised so a resize does not re-solve on every pixel. */
    /* Small screens pack the train tighter, so each wheel renders bigger on the glass;
       roomy screens spread it out and let the drive runs stretch. */
    const small = Math.min(window.innerWidth, window.innerHeight);
    const boost = Math.round(Math.max(0.86, Math.min(1.15, small / BOOST_REF_PX)) * 20) / 20;
    const tight = Math.round(Math.max(0.6, Math.min(1, small / TIGHT_REF_PX)) * 20) / 20;
    /* The idler count belongs with the other quantised layout inputs: it changes
       how many wheels the solve places, so a change has to invalidate the cache
       exactly as an orientation flip does. Its own hysteresis lives in
       idlerCount(), which reads the count it is replacing. */
    const idle = this.idlerCount();
    /* `boost` is guarded on TRAIN_HAS_LINKED (GitHub #103): it is the spread
       multiplier for the dormant chain-and-belt capability, read only in the
       `linked` branch of solve() that no shipped TRAIN entry takes. Comparing
       it unconditionally meant a resize crossing any of its ~6 quantised
       thresholds threw the whole solve away and rebuilt it for a variable with
       no effect on this train. Guarding it here rather than deleting it means the
       moment a shipped wheel IS linked, this same line starts invalidating on it
       again with nothing else to remember -- which is the property worth keeping.
       (It used to claim this preserved "a one-line TRAIN edit". TRAIN is generated
       now, so re-enabling is a change in the generator, not one line -- but the
       invalidation still needs no second place to remember.) */
    if (rot === this._axisRot && (!TRAIN_HAS_LINKED || boost === this._spreadBoost)
      && tight === this._tight && idle === this._idlerN) return false;
    this._axisRot = rot;
    this._spreadBoost = boost;
    this._tight = tight;
    this._idlerN = idle;
    this._solved = null;
    this._escKey = null;
    /* Which wheels wear marks land on is a property of THIS solve (GitHub
       #112) -- invalidated in the same breath as _solved so the choice is
       re-made exactly when the train it was chosen from changes, never on
       a wear-slider drag alone. */
    this._wearWheels = null;
    return true;
  }

  /* THE FIT SCALE HAS ONE HOME (GitHub #135), and both callers come here for it:
     gsRender() when the first render needs it and no mount has happened, and
     fitStage() on every resize. It used to live inside fitStage() alone, so
     gsRender() had nothing to read but the boot CSS declaration -- which is how
     the page came to draw its whole composition at a scale it documents as
     provisional. Its inputs are window metrics and the solve, both available
     before the first paint -- no getComputedStyle, no layout read, no React
     state, which is what makes it safe to call from inside a render.
     What it does WRITE is two readouts and nothing else: `--gsfit` and
     `_fitBind`, both of which exist so ?hud can report the fit rather than
     re-deriving it. Neither is read by CSS or by the geometry. */
  fitScale() {
    const solved = this.solve();
    const box = this.viewBox();
    const w = box.w, hgt = box.h;
    /* THE MACHINE FILLS THE LONG AXIS, EDGE TO EDGE. The ghosts exist to say it
       continues past the frame, so the long side of the screen is what the scale
       must satisfy -- not the smaller of the two axes, and not a shaved fraction
       of it.

       What was here took min(availW, availH) against a width already cut to
       86-92%, under a hard 1.75 ceiling, and every one of those three starved it
       in a different situation. On a phone the cross term won: real Safari chrome
       leaves landscape about 313px tall instead of the device's nominal 430, so
       the height term shrank the train until it no longer spanned the width, and
       Charles got dead space at both ends. On a wide desktop the CEILING won: the
       fit wanted 1.9 and was capped at 1.75, which is the same gap at both sides
       of a maximised Safari window. The wordmark and the buttons sat correctly
       throughout, which is what told him the viewport was being read fine and it
       was the gear area that was wrong.

       So: fill the long axis, and let the cross axis bleed. `main` is
       overflow:hidden and the colophon is position:fixed, so bleeding costs
       nothing and is what the outriggers want. CROSS_BLEED is the one guard --
       past 1.25x the cross viewport the wheels are simply too big and the train
       reads as a wall rather than a machine. */
    const alongX = w >= hgt;
    const longAvail = alongX ? w : hgt;
    const longSolved = alongX ? solved.w : solved.h;
    const crossAvail = alongX ? hgt : w;
    const crossSolved = alongX ? solved.h : solved.w;
    const CROSS_BLEED = 1.25;
    /* A CEILING ON WHEEL SIZE, because filling the screen is the chain's job and
       not the individual wheel's. Removing the old cap made the train span the
       long axis by inflating every wheel to about 1.9x -- Charles's word for the
       result was HUGE, and he was right. The escape runs already keep adding
       outriggers until they are genuinely off the edge, and a smaller scale means
       each run covers MORE solve units, so it simply grows more wheels. Capping
       here therefore costs no coverage: it moves the filling from one dimension
       (bigger) to the other (longer), which is what a machine continuing past the
       frame should look like. */
    /* NO CEILING ON THE RATIO. It was 1.15, then 1.55, then 1.25, then a
       measured sweep said 2.6 -- and each value fixed the same bug and then
       reintroduced it further out. That is not bad luck, it is what a cap on a
       RATIO does: LINK_SHARE * longAvail / longSolved grows with the viewport,
       so any constant ceiling is crossed at some width, and past that width the
       train is a fixed physical size whose share of the screen falls as 1/W.
       #19 and #44 are the same bug at two of those values.

       Measured over 4000 replayed deals: solved.w is 779.6 module units and
       solved.h is 209.1, so the CROSS term is crossAvail * 1.25 / 209.1 and only
       drops below 2.6 when the cross viewport is under about 435px -- a
       landscape phone. The cross axis is therefore not a guard on desktop at
       all, and "raise the cap and let CROSS_BLEED take over" would have started
       failing again at ~2600px, 50.8% linked share at 3440 and 34.2% at 5120.
       The sweep that produced 2.6 stopped at 2560, one step short of seeing it.

       So the ceiling is gone. LINK_SHARE binds at every width and the linked
       share is width-invariant BY CONSTRUCTION rather than by choosing a lucky
       constant. What stops the wheels being HUGE is the cross-axis term, which
       is the guard that is actually physical -- a wheel cannot exceed the short
       axis -- and the 0.28 floor, which is a floor and not a ceiling.

       If a size cap is ever wanted again it must be an ABSOLUTE wheel size in
       px, not a multiplier on a ratio, or this recurs a fourth time.

       THAT LAST PARAGRAPH WAS WRONG, and the measurement that disproved it is
       below (#65). An absolute px cap cannot work here: a seven-wheel chain on a
       5120x1440 display renders LARGER wheels (812px) than a one-wheel chain does
       on a 390x844 phone (486px), so no single pixel value both spares a real
       chain and catches a degenerate one. The sentence above is kept rather than
       deleted because the reasoning it came from is still right -- a cap on a
       ratio driven by the LONG axis is crossed at some width every time. What it
       missed is that the SHORT axis does not have that property. The cap below is
       a fraction of the short axis, which is the sentence's own words two
       paragraphs up: "a wheel cannot exceed the short axis".

       AND AN ABSOLUTE PX SIZE IS NOW IN THE MIN AFTER ALL (#85), which is worth
       reconciling rather than leaving as a contradiction. #66's measurement
       stands: no single pixel value can both spare a real chain and CATCH a
       degenerate one, because a 7-wheel chain on a 5120x1440 display renders
       larger wheels than a lone wheel does on a phone. TARGET_GEAR_PX is not
       being asked to catch anything. It is the standard size every wheel is
       drawn at, applied to a one-wheel chain and a nine-wheel chain alike, and
       the discrimination #66 needed is still done by the fraction of the short
       axis below -- which is why both terms are in the min and neither replaces
       the other. */
    /* LINK_SHARE is declared at module scope, beside NOMINAL_SPAN, because the
       bridge reads it too -- see the note there for what it is and why. */
    /* A SINGLE WHEEL MAY NOT EXCEED THE SHORT AXIS. Both terms above are ratios
       against the SOLVE, so they say nothing about how big one wheel ends up.
       That is fine while the solve is a chain -- solved.w is seven wheels, so
       LINK_SHARE binds long before any wheel gets silly. It is not fine when the
       solve IS one wheel: crossSolved is then a single diameter, the cross term
       reduces to crossAvail * CROSS_BLEED, and the wheel renders at 125% of the
       short axis at EVERY viewport. ?who=harper drew one gear cropped off the top
       and bottom of the page.

       Measured before choosing, over 7 viewports from 390x844 to 5120x1440:
         the 7-wheel chain peaks at  70.8% of the short axis (1020px at 5120x1440)
         the 1-wheel chain bottoms at 146.8% (686px at 390x844)
       so the two separate cleanly as a FRACTION of the short axis, and not at all
       in absolute pixels -- a full chain on an ultrawide renders BIGGER wheels
       than a lone wheel does on a phone, so no absolute value can spare one and
       catch the other. The note left at #44 asked for an absolute px cap; the
       measurement says that cannot work, and this is why.

       Why this is not the cap that #19 and #44 kept reintroducing: those capped a
       ratio driven by the LONG axis, which grows without bound as the viewport
       widens, so any constant is crossed at some width and the train becomes a
       fixed size whose share falls as 1/W. This is bounded by the SHORT axis,
       which is what physically bounds a wheel -- a gear cannot sensibly be taller
       than the screen. Honest about its own limit: at 1440px tall it would begin
       binding on the 7-wheel chain at roughly 6970px wide. No such display
       exists, and a 7680x2160 desktop pushes it past 10000px, but it is the same
       class of property and is written down rather than claimed immune. */
    /* A SHORT CHAIN IS STILL SCALED AS A CHAIN. Capping the RESULT was the first
       attempt and it produced the wrong picture: it makes a lone wheel as large
       as it is allowed to be, so ?who=harper drew one enormous gear. What the
       page wants is the opposite -- a wheel at ordinary size, with the escape
       runs doing the filling, exactly as they do at both ends of a long chain.

       ONE RULE, FOUR BOUNDS, NO SPECIAL CASE FOR CHAIN LENGTH. Nothing below
       branches on how many wheels are linked -- there is no conditional and no
       count test, and a one-wheel chain and a nine-wheel chain run exactly the
       same arithmetic. The rule is:

         a gear is drawn at a STANDARD SIZE, and it shrinks below that only when
         something physical says it must.

       The three things that can say so:
         1. the chain itself is too long to fit the axis at that size
         2. the serpentine's band would overflow the short axis
         3. a single wheel would overflow the short axis

       Bounds 1 and 2 are what shipped before; the standard size and bound 3 are
       new. A long chain is bound by its own span, a short one by the standard
       size, and neither knows which it is -- they are terms in one min(), not
       branches.

       THE STANDARD SIZE IS NOW A SIZE, in pixels, and it used to be a share of
       the long axis: `LINK_SHARE * longAvail / NOMINAL_SPAN`, a gear drawn as
       though a nominal chain were on stage. That is the whole of GitHub #75. The
       share form has no reference length in it, so it tracks the LONG axis and
       nothing else -- and since both cross-axis limbs are ceilings, which shrink
       a gear and never grow one, the same screen area reshaped from 3.3:1 to 1:1
       moved the wheels 1.8x (325.9px to 178.1px). Rotating the window moved
       nothing, which is what says it is shape and not orientation. See
       TARGET_GEAR_PX for the size and how it was measured; NOMINAL_SPAN is still
       what idlerCount() asks the long axis for, since the two terms bound each
       other there as well.

       #44's property is intact and unchanged in every state: the linked run still
       takes a CONSTANT fraction of the long axis at every width. A full chain
       takes LINK_SHARE of it; a one-wheel chain measures 25.9-27.2% from 390px to
       5120px, and the escape runs cover the difference. A different constant, not
       a broken invariant -- "the coverage comes from the chain being longer,
       never from the wheels being bigger".

       THAT PARAGRAPH NO LONGER DESCRIBES THE PAGE, and it is kept because the
       trade it names is the one being made rather than one being forgotten. Past
       the standard size the linked run IS a fixed number of pixels, so its share
       of a growing long axis falls as 1/W -- the exact shape of the failure #19,
       #44 and #66 each shipped. What made those failures was that the size was
       set by whichever ratio ceiling happened to be crossed first, so nobody
       chose it and nobody could say what it was; here the size is named in
       pixels, measured against real hardware, and the escape runs are what fill
       everything past it. Charles asked for this knowing the cost. The half that
       must NOT fall is coverage: the assembly still reaches both edges of the
       long axis at every width, and tools/devices.py still fails the moment it
       does not.

       Bound 3 exists because a constant share of a very WIDE screen is not a
       constant share of a SHORT one: 27% of 5120px is 1391px, which on a 1440px
       display is 96.6% of the short axis. Bound 2 does not catch it -- it is
       written for a serpentine's vertical band, and when the solve IS one wheel it
       reduces to "a wheel may be 125% of the short axis", far above what the long
       term asks for.

       1.0 is a DEFINITION, not a tuned value: a gear may not be wider than the
       screen's short side. It is deliberately not set to a fraction chosen to
       look right, because that would be exactly the kind of number that drifts.
       With the standard size in the min it rarely binds at all -- it is the
       backstop for an aspect ratio nothing else covers. */
    const WHEEL_CROSS_MAX = 1.0;
    /* WHEEL_SPAN is the largest wheel this deal put on stage, declared at module
       scope beside TARGET_GEAR_PX because idlerCount() divides by it too -- see
       the note there. Matches what is drawn: gearSvg sizes each wheel
       (ro + 6) * 2. */
    /* THE FOUR TERMS ARE NAMED, and that is the whole of the change here (CL#110).
       The arithmetic is the one that shipped -- same four expressions, same
       min(), same floor, NaN propagating exactly as it did (see dealAngles) --
       but each limb now has a name, so the page can say which one is BINDING
       instead of that having to be derived offline every time somebody asks.
       #79 needed precisely this answer and had no way to get it from the page.

       Naming them rather than recomputing them beside the min is the point: one
       home per fact. A HUD that re-evaluated these four expressions to work out
       which won would be a second copy of the fit, free to drift from the
       first, and this file has already paid for that mistake in other
       currencies (#15, #59). */
    const tGear  = WHEEL_SPAN ? TARGET_GEAR_PX / WHEEL_SPAN : Infinity;
    const tChain = LINK_SHARE * longAvail / longSolved;
    const tCross = crossAvail * CROSS_BLEED / crossSolved;
    const tWheel = WHEEL_SPAN ? WHEEL_CROSS_MAX * crossAvail / WHEEL_SPAN : Infinity;
    /* A FLOOR, NOT A CEILING -- see the note four paragraphs up. Named only so
       that the readout can say the floor is what is holding, which is a state
       worth being able to see: it means every physical term wanted the wheels
       smaller than the page is willing to draw them. */
    const FIT_FLOOR = 0.28;
    const want = Math.min(tGear, tChain, tCross, tWheel);
    const fit = Math.max(FIT_FLOOR, want);
    /* Derived from `want` by comparison, never by re-deciding: whichever term
       IS the minimum is the one that produced it. The NaN limb is explicit
       because NaN loses every comparison, so without it a NaN fit would be
       reported under whichever name happened to be last. */
    this._fitBind = !(want === want) ? 'NaN'
      : fit > want ? 'floor ' + FIT_FLOOR
      : want === tGear ? 'gear size'
      : want === tChain ? 'chain share'
      : want === tCross ? 'cross bleed' : 'wheel cross';
    const root = document.documentElement.style;
    root.setProperty('--gsfit', fit.toFixed(3));
    /* THE WHEELS ARE DRAWN AT FINAL SIZE (#37). Everything inside the stage used
       to lay out in unscaled solve units under one `transform: scale(--gs)`
       ancestor, with the badges alone positioned at `calc(px * var(--gs))`. That
       put the two on opposite sides of a scale boundary: each wheel wrapper
       carries `will-change: transform`, so it is promoted to its own compositing
       layer, and a promoted layer is rasterised at its LAYOUT size and then
       stretched by the ancestor's scale. Blink re-rasterises when the composited
       scale changes; WebKit frequently does not, which is why Safari showed soft
       teeth against razor-sharp badge plates while Chrome looked fine.

       So the scale is baked into the geometry instead, and the vector reaches the
       compositor already the right size. Quantised to 1% so dragging a window
       edge does not re-render on every pixel -- and it must be quantised, because
       this is the value a change of which costs a full re-render. Quantised DOWN,
       never to nearest: the fit above is a ceiling that keeps the linked wheels
       wholly on screen, and rounding up would spend part of the margin the ghost
       runs are supposed to live in. */
    const gsr = Math.floor(fit * (this.props.gearScale ?? 1) * 100) / 100;
    return gsr;
  }

  fitStage() {
    /* Re-seat the quantised layout inputs first: a change to any of them throws
       the solve away, and everything below is measured against a solve. */
    if (this.seatLayout()) this.forceUpdate();
    /* Deliberately not named `gsr`: that anchor is unique in the file and
       tools/test.js slices the quantising line out by it (GitHub #101/#137). */
    const scale = this.fitScale();
    if (scale !== this._gsr) { this._gsr = scale; this.forceUpdate(); }
    /* Escape runs are computed off wheels the solve has already placed, at the
       scale they will be drawn at -- which is why this is below the line that
       settles it, and why gsRender() solving the scale for the first render
       (GitHub #135) is what stopped this from having to run a second time. */
    this.fitEscapes();
    /* `main`'s axis. It shares the viewport measurement with the fit and nothing
       else -- a different question about the same two numbers, so it reads the
       same box rather than taking its own. */
    const box = this.viewBox();
    document.documentElement.style.setProperty('--dir',
      box.w > 820 && box.w > box.h * 1.2 ? 'row' : 'column');
  }

  componentDidMount() {
    /* One beacon per load, naming only which SCOPE was drawn -- never a handle,
       never a referrer. Fires from mount rather than from the top of the file so
       it counts a page that actually rendered.

       IT REPORTS THE SELECTION, NOT THE SPINE, and it now says so in the name it
       reads. This used to reach for WHO, which was CHAIN_ORDER[0] and therefore
       the spine -- whichever chain happened to be longest -- so every apex visit
       reported `view/charles` and was indistinguishable from charles.wozi.com.
       The analytics would have been silently wrong in the one way nobody reads
       out of the data: a number that looks plausible. It was guarded by a
       STAGE.mode test standing in front of the wrong value; SELECTED is the right
       value, and is null on the combined stage by construction (GitHub #85). This
       is the same spine-versus-selection confusion the person picker's
       aria-current already had to settle. */
    if (AN.pageview !== false) {
      track('view/' + (STAGE.mode === 'all' ? 'all'
        : (SELECTED ? SELECTED.slug : 'unknown')));
    }
    this.loadIcons();
    /* GitHub #98: engraving()'s emWidth() measures the engraved type through
       textWidth(), and this very first render -- the one that takes that
       measurement and memoises it FOREVER -- runs before the Google Fonts
       stylesheet has registered Manrope in document.fonts. Measured then,
       'bold Manrope' silently resolves to the fallback stack and
       UNDERESTIMATES the real glyph run, which is worse than the old guess:
       the guide arc built from that measurement is shorter than the text
       that ends up painted on it once the real face arrives. Once
       document.fonts.ready settles, the memo is cleared and one more render
       lets every wheel re-measure against the face that is actually
       painting -- textWidth()'s own memoisation is what keeps that second
       pass cheap, since only strings whose metrics actually moved pay for a
       fresh canvas call. */
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => { this._tw = {}; this.forceUpdate(); });
    }
    this.startPhysics();
    this.fitStage();
    /* AFTER fitStage(), so the panel's first sample already has a fit, a
       binding term and a solve to report rather than four dashes. It is
       appended to document.body and not to the component's tree on purpose:
       the render is what redraws the machine, and an instrument that rode
       along with it would be repainted by every hover and every ghost
       re-solve, on the render path it exists to measure. */
    if (HUD) this.hudMount();
    this.onResize = () => this.fitStage();
    window.addEventListener('resize', this.onResize);
    /* iOS fires this and not `resize` when the toolbar collapses or the keyboard
       comes up, so without it the fit is stale exactly when the viewport moves. */
    if (window.visualViewport) window.visualViewport.addEventListener('resize', this.onResize);
    /* LAYER: parallax — the far plane drifts against pointer movement. */
    this._onPointer = (e) => {
      if (!this.props.parallax || !this._ghostLayer) return;
      const dx = (e.clientX / window.innerWidth - 0.5) * 26, dy = (e.clientY / window.innerHeight - 0.5) * 18;
      this._ghostLayer.style.transform = 'translate(' + (-dx).toFixed(1) + 'px,' + (-dy).toFixed(1) + 'px) scale(0.94)';
    };
    /* ESCAPE CLOSES THE POP-OUT (GitHub #154), and this is the one listener the
       dismissal needs -- the pointer half is the scrim element in the markup,
       which needs none. It is on `document` and not on the panel or the toggle
       because a key press has to be caught wherever the focus happens to be:
       activating the toggle with a keyboard leaves focus on the button, but
       opening it with a MOUSE leaves focus on the button in Chrome and on the
       body in Safari, and a handler hung off either element would work in one of
       those and silently not in the other.
       The state test comes first, so a page with the panel shut does no work per
       key press beyond one comparison, and Escape keeps whatever meaning the
       browser gives it everywhere else -- nothing is preventDefault()ed here. */
    this._onKey = (e) => {
      if (e.key !== 'Escape' || !this.state.tog) return;
      this.closeTog(true);
    };
    document.addEventListener('keydown', this._onKey);
    window.addEventListener('pointermove', this._onPointer, { passive: true });
    this.mq = DARK_MQ;
    this.onSys = (e) => {
      /* A stored choice wins over the system one in either direction, so the
         system query is only followed while nobody has chosen -- read fresh each
         time, because the visitor may have chosen since. */
      if (!storedChoice('theme')) this.apply(e.matches ? 'dark' : 'light');
    };
    if (this.mq && this.mq.addEventListener) this.mq.addEventListener('change', this.onSys);
    /* THE ATTRIBUTE ONLY, because the theme itself is already in state (GitHub
       #135) -- so the first render drew in it, and calling apply() here would
       setState the value state already holds. paintTheme is the one home for the
       attribute's name either way. */
    this.paintTheme(this.state.theme);
    this.syncVars();
  }

  /* `_vpSeated` is stamped HERE, and only here, because this is the one moment
     the page knows a render has just finished: whatever `_vpBox` held is the box
     the datum plate was just seated against. fitEscapes then measures its drift
     from that rather than from its own previous call -- see the note there. It
     is stamped BEFORE fitStage, so a pass that changes the fit measures against
     what was actually drawn and settles on the next one. */
  componentDidUpdate() { this.syncVars(); this._vpSeated = this._vpBox; this.fitStage(); }

  componentWillUnmount() {
    if (this.mq && this.mq.removeEventListener) this.mq.removeEventListener('change', this.onSys);
    window.removeEventListener('resize', this.onResize);
    if (window.visualViewport) window.visualViewport.removeEventListener('resize', this.onResize);
    if (this._onPointer) window.removeEventListener('pointermove', this._onPointer);
    if (this._onKey) document.removeEventListener('keydown', this._onKey);
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._io) this._io.disconnect();
    if (this._hudTimer) clearInterval(this._hudTimer);
    if (this._hudBox && this._hudBox.parentNode) this._hudBox.parentNode.removeChild(this._hudBox);
  }

  syncVars() {
    const r = document.documentElement.style;
    /* The `speed` read that used to sit here went with the --s variable it fed
       (#57): it was left behind when that declaration was deleted, so every
       render resolved the multiplier and threw it away. Speed reaches the page
       through idleRate(), never through CSS.
       gearScale is no longer a CSS variable either: it multiplies into gsRender()
       and reaches the page as real pixel geometry, so nothing has to resolve it
       at used-value time (#37). */
    /* Dark mode gets the lighter counterpart; an accent dark enough to read on
       the light background disappears against the dark one. Which counterpart is
       accentColour()'s question now, not this one's -- see it for why. */
    const accent = this.accentColour();
    if (accent) r.setProperty('--accent', accent);
  }

  /* WHICH COLOUR `--accent` IS ABOUT TO BE, and the one home for it (GitHub
     #153). It was inline in syncVars, which was fine while syncVars was the only
     thing that cared; the ink that goes ON the accent has to be derived from the
     SAME colour, and there is no reading it back that gives the right answer.

     `--accent` is written as an INLINE STYLE on the root, and syncVars runs from
     componentDidMount/componentDidUpdate -- i.e. AFTER the render that draws the
     selected row and the toggle knob. So a getComputedStyle read of --accent
     during render returns the STYLESHEET's default on the very first render and
     the person's accent on every one after: the two sites would derive their ink
     for a colour they are not painted in, exactly once, only on a cold load, and
     only for a person whose accent is not the stylesheet's. That is the same
     shape of latent fault paintTheme() documents next door, and the fix is the
     same -- ask the source, not the DOM.

     Null when no accent prop is set, exactly as syncVars behaved before: the
     stylesheet's own --accent then stands, and it is the caller's business to
     read it from there rather than have this method invent a value syncVars
     would not have written. */
  accentColour() {
    if (!this.props.accent) return null;
    return (this.state.theme === 'dark' && ACCENTS[this.props.accent]) || this.props.accent;
  }

  /* The DOM half of a theme, split out because the two halves are now needed
     separately: at boot the theme is already in state and only the attribute is
     missing, while a toggle needs both. One home for the attribute's name.

     AND THEREFORE THE ONE HOME FOR "THE PALETTE IN FORCE JUST CHANGED" (GitHub
     #159). datumOpacity() and datumInk() solve against the tokens
     getComputedStyle actually resolves and cache the answer per `state.theme` for
     the life of the page -- but the palette those tokens come from is selected by
     the ATTRIBUTE below, and since CL#174 the two are set at different moments:
     the theme is seeded into state at construction, so the first render already
     draws in it, while the attribute is not painted until the end of mount. A
     dark-system cold load therefore renders once with `state.theme === 'dark'`
     and the LIGHT palette resolved, and a cache keyed on state alone would hold
     a light-derived ink under the key 'dark' forever after.

     Nothing is broken today only by an ordering accident -- that first render's
     token reads come back as empty strings, because the page's own <style> lives
     in <helmet> and has not been re-inserted yet, and neither solver caches on
     that path. That makes this a LATENT fault whose trigger is the obvious FOUC
     fix: hoist the palette into the real <head> and the reads succeed, k comes
     out as the dark ratio applied to light tokens, every channel clamps at 0 and
     the scribe is drawn PURE BLACK on the dark page for the page's lifetime.
     Measured, with the style block duplicated into <head> and prefers-color-scheme
     emulated dark: rgb(0,0,0) against the correct rgb(223,250,244).

     Discarding both caches here fixes it for any such edit without giving either
     solver a second opinion about which theme it is in -- the alternative, keying
     them on the attribute, leaves them reading one theme and `ghostOpacity()`
     (which is state's) reading another during exactly that window. The solve is
     untouched; only when it is allowed to be remembered changes. Cost is one
     bisection per theme change, off the rAF loop. */
  paintTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    this._datumOp = null;
    this._datumInk = null;
  }

  apply(theme) {
    this.paintTheme(theme);
    this.setState({ theme });
  }

  /* Solve the train: centre distances = sum of pitch radii, alternating spin,
     angular speed inversely proportional to tooth count, tooth phase meshed. */
  solve() {
    /* THE LAYOUT INPUTS ARE SEATED BEFORE THE FIRST SOLVE, ALL FOUR OF THEM. This
       used to seat two -- `_axisRot` and `_idlerN` -- and leave `_tight` reading as
       1, so the first solve of a cold load spaced the train at a tightness no
       viewport had asked for and fitStage() then rebuilt it (GitHub #135). One
       guard covers all four now, because seatLayout() is the one home for them.
       A stub caller that supplies them (tools/test.js does, for every solve it
       runs) never reaches this and so never touches `window`. */
    if (this._axisRot === undefined) this.seatLayout();
    if (this._solved) return this._solved;
    /* Sites are dealt onto the wheels fresh each load, but sibling services stay
       belted to each other: the two belt-linked slots always get a pair. */
    const shuffle = (arr) => {
      if (this.props.shuffle === false) return arr;
      for (let k = arr.length - 1; k > 0; k--) {
        const j = Math.floor(Math.random() * (k + 1));
        const tmp = arr[k]; arr[k] = arr[j]; arr[j] = tmp;
      }
      return arr;
    };
    /* SEATED ONCE, NOT ON EVERY SOLVE (#55). solve() re-runs whenever fitStage
       invalidates its cache, so this shuffle used to move a service -- and the
       handle engraved on that wheel's band -- onto a different wheel while the
       user was resizing. 14 thresholds between 380px and 1000px of the smaller
       axis, plus every orientation flip. Worse, 6 of them fire on `boost`,
       which is read only in the `linked` branch that no shipped TRAIN entry
       takes, so nearly half of the reshuffles were for a variable with no
       effect on this train at all.
       The file already states the rule 200 lines up, about colour: "computed
       once at module load and never on resize, so the wheels cannot change
       colour under the pointer". Colours obeyed it; slugs did not.
       Cached on the instance rather than hoisted to module scope because the
       shuffle reads this.props.shuffle, and PAIR_SLOTS/SITES are declared
       further down the file than the colour deal is. */
    if (!this._slugFor) {
      const slugFor = {};
      /* SEATED PER PERSON. PAIR_SLOTS names wheel indices WITHIN a chain, so on a
         combined stage they have to be read relative to where that person's
         wheels start -- otherwise a pair straddles a boundary and one of someone
         else's services lands on this person's wheel (#65 is the same family:
         a wheel that ends up with the wrong slug, or none). */
      const byPerson = {};
      TRAIN.forEach((t, i) => {
        if (t.role !== 'link') return;
        (byPerson[t.person] = byPerson[t.person] || []).push(i);
      });
      Object.keys(byPerson).forEach(person => {
        const idx = byPerson[person];
        /* A pair slot the chain cannot reach is not a pair slot -- it would claim
           its in-range index while never being fillable, and that wheel would draw
           blank (#65). */
        const pairSlots = PAIR_SLOTS.filter(pr => pr.every(k => k < idx.length));
        const singleSlots = [];
        idx.forEach((_, k) => { if (!pairSlots.some(pr => pr.indexOf(k) >= 0)) singleSlots.push(k); });
        /* ONLY SEAT SERVICES THIS PERSON ACTUALLY HAS (#53, now checked per person
           rather than per page). config.js says "a service named here but absent
           from a person's links is simply skipped" -- it was not, and a second
           person crashed the page 2000 times out of 2000, because renderVals()
           reads SITES[g.slug].label unguarded. That matters now rather than later:
           the picker is built and adding a person is documented as a config edit.
           Filtering here, against this person's own slice of SITES, keeps the
           promise where the seating happens, instead of leaving every consumer to
           guard a slug that should never have existed. */
        const has = (slug) => Object.prototype.hasOwnProperty.call(SITES[person] || {}, slug);
        const pairs = shuffle(PAIRS.filter(pr => pr.every(has)).map(pr => shuffle(pr.slice())));
        const singles = shuffle(SINGLES.filter(has));
        /* Both guards are needed and for different reasons: PAIRS empty gave
           pairs[NaN] -> a TypeError, while SINGLES empty merely left the slug null
           and the badge filtered out later. Same shape, two outcomes, three lines
           apart -- so treat them the same. */
        if (pairs.length) pairSlots.forEach((pr, k) => {
          const pair = pairs[k % pairs.length];
          slugFor[idx[pr[0]]] = pair[0]; slugFor[idx[pr[1]]] = pair[1];
        });
        if (singles.length) singleSlots.forEach((s, k) => { slugFor[idx[s]] = singles[k % singles.length]; });
      });
      this._slugFor = slugFor;
    }
    const slugFor = this._slugFor;
    const g = [], strands = [];
    /* g IS DENSE OVER THE WHEELS ACTUALLY PLACED; TRAIN IS NOT. A parked idler
       is skipped entirely, so a wheel's slot in g stops being its index in
       TRAIN -- gi maps one to the other, and every lookup that used to index g
       with a TRAIN index goes through it. Nothing else changes: each entry still
       carries its own TRAIN index as `i`, which is what the render keys and the
       rotation loop address it by. */
    const gi = new Array(TRAIN.length).fill(-1);
    /* HOW MANY IDLERS ARE IN MESH, and therefore which are parked. The surplus is
       skipped rather than spliced out of TRAIN (see MIN_IDLERS), and the chain a
       bridge feeds re-parents onto the last idler still in mesh. */
    const nIdle = Math.max(MIN_IDLERS, Math.min(MAX_IDLERS, this._idlerN || MIN_IDLERS));
    /* THE ANCHORS ARE ONLY VALID FOR THE BRIDGE LENGTH THEY WERE SOLVED AT.
       They are cached across resizes on purpose (#55) -- a bridge free to
       re-choose walks along the spine while a window edge is dragged -- but a
       bridge one idler shorter reaches one wheel less far, and every chain
       hanging off it lands somewhere the search never looked: measured, two
       chains overlapped and a third's idler ran out of swing. The count is the
       one input the anchor cannot survive a change in, and it changes at most
       once per drag, because idlerCount() has its own hysteresis. So key the
       cache on it rather than pretending it is constant. */
    if (this._bridgeAtN !== nIdle) { this._bridgeAt = null; this._bridgeAtN = nIdle; }
    const parked = new Array(TRAIN.length).fill(false);
    const parentOf = TRAIN.map(t => t.parent);
    /* Chain heads whose bridge was refused, and the anchor they stand off
       instead. Filled in when the refusal is discovered -- at the bridge's first
       idler, which the loop reaches before the head. */
    const refusedAt = {};
    /* Which position an idler holds within its own bridge. Only the ones below
       MIN_IDLERS are guaranteed to be in mesh at every viewport, and the
       attachment search filters on that -- see bridgeAnchor. */
    const idlerSlot = {};
    BRIDGES.forEach(b => {
      b.idlers.forEach((ix, k) => { idlerSlot[ix] = k; if (k >= nIdle) parked[ix] = true; });
      if (b.idlers.length) parentOf[b.head] = b.idlers[Math.min(nIdle, b.idlers.length) - 1];
    });
    /* AN ORIGIN RUN IS PARKED BY THE SAME COUNT AS A BRIDGE (CL#123), and it has
       to be: it is the same run of idlers standing between a chain and its drive,
       so a cross axis that only has room for one of them has room for one of
       these. Under 'edge' the idlers hang off the lead gear outward, so the
       surplus is the FAR one and parking it needs no re-parenting; under 'fixed'
       they run inward to the lead gear, so the lead gear re-parents onto the last
       one still in mesh exactly as a bridged chain's does. */
    ORIGINS.forEach(o => {
      o.idlers.forEach((ix, k) => { idlerSlot[ix] = k; if (k >= nIdle) parked[ix] = true; });
      if (o.mounted) parentOf[o.head] = o.idlers[Math.min(nIdle, o.idlers.length) - 1];
    });
    /* WHERE EACH ORIGIN RUN IS FINISHED, keyed by the TRAIN index that finishes
       it, and what segment it then occupies. Published into `bridgeRuns` for the
       same reason a bridge is: it is metal carrying drive across the composition,
       and anything placed afterwards -- another chain's bridge here, an escape
       run in fitEscapes -- has to be able to refuse to cross it.
       Derived at solve time rather than at load because which idler is the last
       one in mesh depends on nIdle, which is a property of the viewport. */
    const originEnd = {};
    ORIGINS.forEach(o => {
      const last = o.idlers[Math.min(nIdle, o.idlers.length) - 1];
      if (o.mounted) originEnd[o.head] = { a: o.idlers[0] };
      else originEnd[last] = { a: o.head };
    });
    /* PERPENDICULAR TO THE SPINE, RELATIVE TO IT. The stage rotates the whole
       train by this._axisRot in portrait, so a bearing in absolute screen degrees
       would keep the bridge horizontal and send it across the SHORT axis --
       exactly the #67 failure. It is only ever used added to this._axisRot, never
       on its own. All bridges take the same side, which is the ordering Charles
       chose over balancing the cross axis: growth goes one way and the spine sits
       at the top.

       AND WHICH WAY ROUND THE PERPENDICULAR RUNS IS ALSO DERIVED FROM THE
       ROTATION -- the second half of the same lesson, and the half that was
       missing. A bearing 90 degrees from the spine can be taken either way
       round; the two are mirror images and the geometry is equally legal, so
       nothing local objected. What it decides is which screen edge the FIRST
       chain ends up against, and a fixed +90 answers that only for the rotation
       it was written at. At _axisRot 0 it means "down", so the spine is topmost.
       At 90 the same +90 means "LEFT", so the spine came out RIGHTMOST and every
       shorter chain stacked toward the left edge -- the picture Charles queried,
       and the reason the old comment could only describe it as "the leading edge
       of the cross axis" rather than naming a side.

       THE RULE, STATED ONCE: the bridge runs along the cross axis AWAY FROM THE
       STAGE ORIGIN, so rank 0 sits at the low end of it -- topmost in landscape,
       leftmost in portrait, and the same sentence covers both. Both candidate
       bearings are written out and the one pointing further from the origin
       corner wins, so this holds at any _axisRot rather than at the two the page
       happens to use today. Nothing here is a screen-absolute constant: turn the
       stage and the answer turns with it. */
    const BRIDGE_BEARING = 90;
    const fromOrigin = (s) => {
      const a = ((this._axisRot || 0) + BRIDGE_BEARING * s) * Math.PI / 180;
      return Math.cos(a) + Math.sin(a);
    };
    const bridgeBase = (this._axisRot || 0)
      + BRIDGE_BEARING * (fromOrigin(1) >= fromOrigin(-1) ? 1 : -1);
    /* WHICH WAY AN ORIGIN RUN TRAVELS, and it is the whole of the difference
       between the two answers ORIGIN_MOUNT offers. Under 'edge' the run hangs off
       the lead gear and heads BACK ALONG THE CHAIN'S OWN AXIS, away from the
       composition and off the stage -- the same heading the spine's leading escape
       run takes, so the drive arrives from the same off-frame direction the
       machine is already said to continue in. Under 'fixed' it starts at a mount
       and runs the other way, INTO the lead gear.
       Relative to the stage axis in both cases, never to the screen: the whole
       train turns by _axisRot in portrait, and a run written in absolute degrees
       is the #67 failure exactly (see BRIDGE_BEARING above). */
    const originBase = (this._axisRot || 0) + (ORIGIN_MOUNT === 'edge' ? 180 : 0);
    /* WHERE A MOUNTED ORIGIN RUN STARTS, in solve units, and this is the degree of
       freedom 'fixed' costs the fit. The chain no longer finds its own place off a
       solved anchor -- it hangs off a station, so the gap between two chains stops
       being what their idlers take up and becomes this pitch. Derived from the
       same nominal wheel and the same idler count the bridges are (see
       STAGE_CROSS, which counts a bridge as n+1 nominal centre distances), so the
       two kinds of run leave the same room across the stage and nothing here is a
       measured constant. The spine's own root is the origin of solve space, so
       rank 0 is the mount line and every other chain steps off it. */
    const ORIGIN_PITCH = (nIdle + 1) * MODULE * TEETH_MEAN;
    const mountFor = (person) => {
      const a = bridgeBase * Math.PI / 180;
      const d = (CHAIN_RANK[person] || 0) * ORIGIN_PITCH;
      return { x: d * Math.cos(a), y: d * Math.sin(a) };
    };
    /* HOW FAR OFF PERPENDICULAR A BRIDGE MAY BE NUDGED before it stops reading as
