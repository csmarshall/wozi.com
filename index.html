       in solve units, so the number that converts between them has to be the one
       the stage is ACTUALLY drawn at right now. Handing in the new target instead
       made the two disagree for one pass -- and since a different ghost set
       re-renders the stage, which changes the rect, which yields a different
       ghost set, the two never settled and the render loop never ended. */
    const gs = rect.width / solved.w;
    const vw = window.innerWidth, vh = window.innerHeight;
    const ghosts = [];
    this._seed = 20260729;
    const hosts = [solved.gears[0], solved.gears[solved.gears.length - 1]];
    const taken = [];
    /* Uses the module-level segCross (#57). This was a second copy, identical
       character-for-character including its inner helper, shadowing a perfectly
       good function three lines above where it is used -- exactly the drift
       hazard that has already bitten this repo twice. */
    /* The escape runs continue the train's OWN AXIS rather than leaving by whichever
       screen edge happens to be nearest. Nearest-edge was measuring the wrong thing:
       on a wide, short viewport the closest edges are the top and bottom, so one run
       climbed off the top and the other dropped off the bottom — a horizontal train
       with a vertical tail at each end, which reads as an S rather than as a machine
       continuing past the frame (#10). Continuing the axis is what SESSION-LOG says
       these are for, and it fills a wide display instead of stranding the train in
       the middle of one. */
    const first = solved.gears[0], last = solved.gears[solved.gears.length - 1];
    /* A ONE-WHEEL TRAIN HAS NO AXIS OF ITS OWN, and measuring one anyway is how
       the escape runs ended up crossing the SHORT axis in portrait (#67). With a
       single gear `first` and `last` are the same object, so this is
       atan2(0, 0) -- which returns 0 rather than failing, and 0 degrees is
       horizontal in every orientation. On a 390x844 phone that sent both runs off
       the 390px sides after one wheel each and left the whole 844px of height
       empty, which is the exact failure #10 fixed for multi-wheel trains: a run
       must continue the machine's axis, not leave by whichever edge is nearest.

       The stage's own axis is the honest fallback -- axisRot() is 90 in portrait
       and 0 in landscape, which IS the "chain follows the longest dimension"
       rule, stated once and reused here instead of re-derived. A train with two
       or more wheels still measures its own axis, so nothing changes for it. */
    const axDx = last.cx - first.cx, axDy = last.cy - first.cy;
    const axisDeg = Math.hypot(axDx, axDy) < 1e-6
      ? (this._axisRot || 0)
      : Math.atan2(axDy, axDx) * 180 / Math.PI;
    /* How far a heading travels before it leaves the viewport. */
    const reachAlong = (px, py, deg) => {
      const a = deg * Math.PI / 180, dx = Math.cos(a), dy = Math.sin(a);
      let t = Infinity;
      if (dx > 1e-6) t = Math.min(t, (vw - px) / dx);
      else if (dx < -1e-6) t = Math.min(t, -px / dx);
      if (dy > 1e-6) t = Math.min(t, (vh - py) / dy);
      else if (dy < -1e-6) t = Math.min(t, -py / dy);
      return Math.max(0, t === Infinity ? 0 : t);
    };
    hosts.forEach((host, ei) => {
      const sx = rect.left + host.cx * gs, sy = rect.top + host.cy * gs;
      /* The first wheel continues backwards along the axis, the last one onwards.
         A small arc either side is searched only to dodge a run already placed —
         the axis itself is always tried first. */
      const want = ei === 0 ? axisDeg + 180 : axisDeg;
      let e = null;
      const offsets = [0, 16, -16, 32, -32, 50, -50];
      for (let q = 0; q < offsets.length; q++) {
        const ang = want + offsets[q];
        const reach = reachAlong(sx, sy, ang);
        const oa = ang * Math.PI / 180;
        const seg = [{ x: sx, y: sy }, { x: sx + (reach + 80) * Math.cos(oa), y: sy + (reach + 80) * Math.sin(oa) }];
        if (!taken.some(t => segCross(seg[0], seg[1], t[0], t[1]))) { e = { ang: ang, reach: reach }; break; }
      }
      if (!e) return;
      const ea = e.ang * Math.PI / 180;
      taken.push([{ x: sx, y: sy }, { x: sx + (e.reach + 80) * Math.cos(ea), y: sy + (e.reach + 80) * Math.sin(ea) }]);
      if (e.reach < 60) return;
      const span = e.reach / gs;
      let prev = { cx: host.cx, cy: host.cy, r: host.r, teeth: host.teeth, dir: host.dir, phase: host.phase };
      let reached = 0, k = 0;
      /* Keep adding wheels until the run is genuinely off the edge; they grow as they
         go, so a tall screen does not need a long string of identical pinions. */
      while (reached < span + 120 && k < 7) {
        const teeth = Math.min(26, 11 + k * 2 + Math.floor(this.rnd() * 8));
        const r = MODULE * teeth / 2;
        const wobble = (this.rnd() * 2 - 1) * 20;
        const ang = e.ang + wobble;
        const a = ang * Math.PI / 180, d = prev.r + r;
        const cx = prev.cx + d * Math.cos(a), cy = prev.cy + d * Math.sin(a);
        const pPrev = 360 / prev.teeth, pThis = 360 / teeth;
        let u = ((ang - prev.phase) / pPrev) % 1;
        if (u < 0) u += 1;
        const phase = ang + 180 - (0.5 - u) * pThis;
        const g = { cx: cx, cy: cy, r: r, teeth: teeth, dir: -prev.dir, phase: phase,
          color: GHOST_COLORS[Math.floor(this.rnd() * GHOST_COLORS.length)],
          /* No kind, arms or prof: ghostSvg draws body, web and hub at fixed
             module multiples and reads none of them (#57). They were seven
             rnd() draws feeding nothing -- and because they consumed the
             sequence, deleting them deals a different set of background wheels.
             That is not a regression: these are re-dealt on every load anyway. */
          ro: r + MODULE * 0.95, i: 'gh' + ei + k };
        ghosts.push(g);
        reached += d;
        prev = g;
        k++;
      }
    });
    const key = ghosts.map(g => [g.cx | 0, g.cy | 0, g.teeth].join()).join('|');
    if (key !== this._escKey) { this._escKey = key; this.setState({ ghosts: ghosts }); }
  }

  applyRotation() {
    /* Skip frames where nothing moved enough to see. */
    if (this._lastM !== undefined && Math.abs(this._M - this._lastM) < 0.05) return;
    this._lastM = this._M;
    const gears = this.solve().gears;
    if (this._spinEls) {
      /* ADDRESSED BY TRAIN INDEX, which is what the render's ref writes them
         under -- not by position in `gears`. The two were the same array until
         a parked idler made the solved list shorter than TRAIN, and reading by
         position would then have driven the tail of the train with the wrong
         wheel's phase, or with nothing at all. */
      for (let i = 0; i < gears.length; i++) {
        const el = this._spinEls[gears[i].i];
        if (el) el.style.transform = 'rotate(' + (gears[i].phase + gears[i].dir * this._M / gears[i].teeth).toFixed(3) + 'deg)';
      }
    }
    if (this._ghostEls) {
      /* LAYER: parallax — the far plane runs a touch slower than the near one. */
      const lag = this.props.parallax ? 0.78 : 1;
      this._ghostEls.forEach(x => {
        if (x.el) x.el.style.transform = 'rotate(' + (x.g.phase + x.g.dir * this._M * lag / x.g.teeth).toFixed(3) + 'deg)';
      });
    }
    if (this._chainEls) {
      const PITCH = Math.PI * MODULE;
      this._chainEls.forEach(c => {
        if (c.el) c.el.style.strokeDashoffset = (-this._M * PITCH / 360 * c.sign).toFixed(2) + 'px';
      });
    }
    /* Planetary internals: sun, carrier and planet spins are all fixed multiples
       of their host wheel's angle -- one clock, several ratios. k is the factor
       RELATIVE to the wheel (the svg lives inside the rotating wheel div):
       sun -1 (stationary in page frame), carrier -Zs/(Zs+Zr), planet spin
       +ZrZs/(Zp(Zr+Zs)). */
    if (this._epiEls) {
      for (let i = 0; i < this._epiEls.length; i++) {
        const e = this._epiEls[i];
        if (e.el) e.el.style.transform = 'rotate(' + (e.base + e.k * (e.g.dir * this._M / e.g.teeth)).toFixed(3) + 'deg)';
      }
    }
  }

  startPhysics() {
    this._M = 0;
    this._dirSign = 1;
    /* prefers-reduced-motion (#3): the machine comes to REST through this same
       loop -- the idle target becomes zero, and the flywheel physics settles it
       gently instead of freezing it mid-tooth. The flag is read fresh every
       tick, mirroring the sleep gate: #7 is what happens when a flag can latch.
       A deliberate drag or key press still spins it -- user-initiated motion is
       the user's choice -- and friction then returns it to rest. */
    this._rmq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    let savedMotion = null;
    try { savedMotion = localStorage.getItem('wozi-motion'); } catch (e) {}
    /* setState, not a direct write. This was `this.state.motion = savedMotion`,
       which rendered correctly only because componentDidMount calls apply()
       further down and that re-renders. Swap those two lines and the pause
       button ships with the wrong label (#59). */
    if (savedMotion === 'run' || savedMotion === 'rest') this.setState({ motion: savedMotion });
    const startRunning = savedMotion === 'run' ? true
      : savedMotion === 'rest' ? false : !(this._rmq && this._rmq.matches);
    this._v = (this.props.spinUp === false && startRunning) ? this.idleRate() : 0;
    let last = performance.now();
    const step = (now) => {
      /* Cap the update rate. Divisors of the display refresh judder least, which is why
         30 beats 24 on a 60Hz panel: 60/30 = 2 whole frames, 60/24 = 2.5. */
      const budget = 1000 / (this.props.frameRate ?? 30) - 1.5;
      if (now - last < budget) { this._raf = requestAnimationFrame(step); return; }
      const dt = Math.min(60, now - last);
      last = now;
      /* One expression decides whether to integrate — nothing can latch it asleep. */
      const asleep = document.hidden || this._offscreen === true;
      if (!this._dragging && !asleep) {
        /* Flywheel: bleed back toward the train's natural pace. */
        /* LAYER: hover drag — attention loads the machine and it slows a little. */
        const load = (this.props.hoverDrag && (this.state.hover || this.state.overStage)) ? 0.4 : 1;
        const target = this.motionActive() ? this._dirSign * this.idleRate() * load : 0;
        this._v += (target - this._v) * (1 - Math.exp(-dt / 900));
        this._M += this._v * dt;
        this.applyRotation();
      }
      /* Magnetic hub caps: underdamped spring (zeta ~0.5) so a released cap
         overshoots a touch and lands back on the axle. Same clock as the train;
         entries delete themselves once settled, so the loop is normally empty. */
      const dts = Math.min(dt, 60) / 1000;
      for (const slug in this._badgeOff) {
        const o = this._badgeOff[slug], el = this._badgeEl[slug];
        if (!el) { delete this._badgeOff[slug]; continue; }
        if (this._badgeDragging !== slug) {
          const K = 180, C = 13;
          o.vx += (-K * o.x - C * o.vx) * dts;
          o.vy += (-K * o.y - C * o.vy) * dts;
          o.x += o.vx * dts; o.y += o.vy * dts;
          if (Math.abs(o.x) < 0.4 && Math.abs(o.y) < 0.4 && Math.abs(o.vx) < 8 && Math.abs(o.vy) < 8) {
            el.style.transform = 'translate(-50%,-50%) scale(' + ((this.state.hover === slug || this._badgeDragging === slug) ? 1.06 : 1) + ')';
            delete this._badgeOff[slug];
            continue;
          }
        }
        el.style.transform = 'translate(-50%,-50%) translate(' + o.x.toFixed(1) + 'px,' + o.y.toFixed(1) + 'px) scale(' + ((this.state.hover === slug || this._badgeDragging === slug) ? 1.06 : 1) + ')';
      }
      this._raf = requestAnimationFrame(step);
    };
    this._raf = requestAnimationFrame(step);

    /* Stop integrating when the machine is scrolled out of view: no frames, no CPU.
       Starts awake, and only ever sleeps on a real off-screen report for a laid-out
       stage — a first callback on a zero-size box must not put it to sleep. */
    if (window.IntersectionObserver && this._stageRef.current) {
      this._io = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          const box = e.boundingClientRect;
          if (!box || box.width < 4 || box.height < 4) return;
          this._offscreen = e.isIntersecting === false;
        });
      }, { rootMargin: '120px' });
      this._io.observe(this._stageRef.current);
    }
  }

  /* Canvas text measurement, memoised. Cheap, synchronous, and exact for the
     font actually being used -- which matters because the pill's opening width
     is a transition target and cannot be `max-content`. */
  textWidth(text, font) {
    if (!this._tw) this._tw = {};
    const key = font + '|' + text;
    if (this._tw[key] !== undefined) return this._tw[key];
    if (!this._measureCtx) {
      const c = document.createElement('canvas');
      this._measureCtx = c.getContext('2d');
    }
    this._measureCtx.font = font;
    const w = Math.ceil(this._measureCtx.measureText(text).width);
    this._tw[key] = w;
    return w;
  }

  loadIcons() {
    const slugs = TRAIN.filter(t => t.slug).map(t => t.slug);
    Promise.all(slugs.map(s => fetch('assets/icons/' + s + '.svg').then(r => r.ok ? r.text() : '').catch(() => '')))
      .then(texts => {
        const icons = {};
        slugs.forEach((s, i) => {
          let t = texts[i] || '';
          if (t) {
            /* Every icon in assets/ is cut with a literal fill="#000" today, so
               an exact string swap works -- but it works by luck, and the failure
               is silent: an icon re-exported as #000000, #000 in single quotes,
               or in lower/upper case keeps its black fill, renders invisible on
               the dark page, and logs nothing. Match the ways a black fill is
               actually written instead (#59). */
            t = t.replace(/fill\s*=\s*(["'])\s*(#000|#000000|black)\s*\1/gi,
                          'fill="currentColor"');
            t = t.replace('<svg ', '<svg aria-hidden="true" focusable="false" width="100%" height="100%" ');
          }
          icons[s] = t;
        });
        this.setState({ icons: icons });
      });
  }

  /* Lay the run along the viewport's long axis, so the belt spans open space instead of
     doubling back on itself. Only the layout bearings rotate — badges stay upright. */
  axisRot() { return window.innerHeight > window.innerWidth * 1.05 ? 90 : 0; }

  /* HOW MANY IDLERS THE BRIDGE CAN AFFORD. Two is the target -- about two wheel
     diameters of gap -- and the cross axis is what takes it away, which is why
     portrait is the case that drops to one: there the cross axis is the scarce
     one and the gap is what gives, because the wheels do not.

     MEASURED, NOT ASSUMED, and derived rather than tuned. The long axis is what
     asks for a scale (LINK_SHARE of it, over the span a nominal chain occupies);
     STAGE_CROSS says how much cross axis the composition then wants at that
     scale; the second idler is taken only while that still FITS the cross axis.
     It deliberately does not spend CROSS_BLEED: the bleed exists so a serpentine
     may run off the top and bottom of a wide screen, not so a bridge may hang off
     the side. This is also the legibility floor doing its job -- everything that
     would otherwise push the fit down far enough to smear the engraving arrives
     through the cross term, so bounding the bridge here bounds it there.

     HYSTERESIS, or a drag across the threshold adds and removes a whole wheel on
     every pixel: one nominal wheel of cross axis must be spare to TAKE the second
     idler, and none to keep it. The gap between the two thresholds is a wheel,
     which is the thing being added -- not a percentage someone picked.

     WHICH AXIS IS THE LONG ONE COMES FROM axisRot(), not from max/min. They
     disagreed between 1.00 and 1.05: axisRot only rotates past h > w * 1.05, so
     a viewport very slightly taller than it is wide stays in landscape while
     max/min called its height the long axis -- and this function would then have
     been measuring the bridge across the axis the stage does not run along.
     Asking the rotation itself makes the two agree by construction. */
  idlerCount() {
    const vv = window.visualViewport;
    const w = (vv && vv.width) || window.innerWidth;
    const h = (vv && vv.height) || window.innerHeight;
    const turned = this.axisRot() !== 0;
    const longAvail = turned ? h : w, crossAvail = turned ? w : h;
    const scale = LINK_SHARE * longAvail / NOMINAL_SPAN;
    const want = STAGE_CROSS(MAX_IDLERS) * scale;
    const spare = this._idlerN === MAX_IDLERS ? 0 : MODULE * TEETH_MEAN * scale;
    return IDLERS_FOR(want + spare <= crossAvail);
  }

  /* The one number every rendered coordinate in the stage is multiplied by.
     Before fitStage() has measured the viewport there is nothing to multiply by
     yet, so the boot value is read back out of the `--gsfit` declaration rather
     than repeated here -- one source of truth for the first frame. */
  gsRender() {
    if (this._gsr) return this._gsr;
    const boot = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gsfit'));
    return Math.floor((boot || 0.86) * (this.props.gearScale ?? 1) * 100) / 100;
  }

  fitStage() {
    const rot = this.axisRot();
    /* More room means longer drive runs: the strands get real straight spans instead of
       being mostly wrap. Quantised so a resize does not re-solve on every pixel. */
    /* Small screens pack the train tighter, so each wheel renders bigger on the glass;
       roomy screens spread it out and let the drive runs stretch. */
    const small = Math.min(window.innerWidth, window.innerHeight);
    const boost = Math.round(Math.max(0.86, Math.min(1.15, small / 700)) * 20) / 20;
    const tight = Math.round(Math.max(0.6, Math.min(1, small / 760)) * 20) / 20;
    /* The idler count belongs with the other quantised layout inputs: it changes
       how many wheels the solve places, so a change has to invalidate the cache
       exactly as an orientation flip does. Its own hysteresis lives in
       idlerCount(), which reads the count it is replacing. */
    const idle = this.idlerCount();
    if (rot !== this._axisRot || boost !== this._spreadBoost || tight !== this._tight
      || idle !== this._idlerN) {
      this._axisRot = rot;
      this._spreadBoost = boost;
      this._tight = tight;
      this._idlerN = idle;
      this._solved = null;
      this._escKey = null;
      this.forceUpdate();
    }
    const solved = this.solve();
    /* MEASURE WHAT IS ACTUALLY VISIBLE. On iOS Safari `100vh` is the LARGE
       viewport -- the height the page would have if the toolbars were collapsed --
       while `window.innerHeight` is the visual viewport, which is what you can
       currently see. The two differ by the toolbar, so `main` was laying out
       taller than the screen while the scale was computed against the shorter
       number: the train ended up centred in a box that extends past the fold,
       which is dead space at one end and clipping at the other. Desktop never
       showed it because there the two are equal.
       `min-height:100svh` on `main` fixes the layout half (svh is the SMALL
       viewport, never larger than what is visible; the `100vh` before it is the
       fallback for engines that do not know svh). This is the measuring half. */
    const vv = window.visualViewport;
    const w = (vv && vv.width) || window.innerWidth;
    const hgt = (vv && vv.height) || window.innerHeight;
    const rowMode = w > 820 && w > hgt * 1.2;
    const colH = this._colRef && this._colRef.current ? this._colRef.current.offsetHeight : 60;
    /* THE MACHINE FILLS THE LONG AXIS, EDGE TO EDGE. The ghosts exist to say it
       continues past the frame, so the long side of the screen is what the scale
       must satisfy -- not the smaller of the two axes, and not a shaved fraction
       of it.

       What was here took min(availW, availH) against a width already cut to
       86-92%, under a hard 1.75 ceiling, and every one of those three starved it
       in a different situation. On a phone the cross term won: real Safari chrome
       leaves landscape about 313px tall instead of the device's nominal 430, so
       the height term shrank the train until it no longer spanned the width, and
       Charles got dead space at both ends. On a wide desktop the CEILING won: the
       fit wanted 1.9 and was capped at 1.75, which is the same gap at both sides
       of a maximised Safari window. The wordmark and the buttons sat correctly
       throughout, which is what told him the viewport was being read fine and it
       was the gear area that was wrong.

       So: fill the long axis, and let the cross axis bleed. `main` is
       overflow:hidden and the colophon is position:fixed, so bleeding costs
       nothing and is what the outriggers want. CROSS_BLEED is the one guard --
       past 1.25x the cross viewport the wheels are simply too big and the train
       reads as a wall rather than a machine. */
    const alongX = w >= hgt;
    const longAvail = alongX ? w : hgt;
    const longSolved = alongX ? solved.w : solved.h;
    const crossAvail = alongX ? hgt : w;
    const crossSolved = alongX ? solved.h : solved.w;
    const CROSS_BLEED = 1.25;
    /* A CEILING ON WHEEL SIZE, because filling the screen is the chain's job and
       not the individual wheel's. Removing the old cap made the train span the
       long axis by inflating every wheel to about 1.9x -- Charles's word for the
       result was HUGE, and he was right. The escape runs already keep adding
       outriggers until they are genuinely off the edge, and a smaller scale means
       each run covers MORE solve units, so it simply grows more wheels. Capping
       here therefore costs no coverage: it moves the filling from one dimension
       (bigger) to the other (longer), which is what a machine continuing past the
       frame should look like. */
    /* NO CEILING ON THE RATIO. It was 1.15, then 1.55, then 1.25, then a
       measured sweep said 2.6 -- and each value fixed the same bug and then
       reintroduced it further out. That is not bad luck, it is what a cap on a
       RATIO does: LINK_SHARE * longAvail / longSolved grows with the viewport,
       so any constant ceiling is crossed at some width, and past that width the
       train is a fixed physical size whose share of the screen falls as 1/W.
       #19 and #44 are the same bug at two of those values.

       Measured over 4000 replayed deals: solved.w is 779.6 module units and
       solved.h is 209.1, so the CROSS term is crossAvail * 1.25 / 209.1 and only
       drops below 2.6 when the cross viewport is under about 435px -- a
       landscape phone. The cross axis is therefore not a guard on desktop at
       all, and "raise the cap and let CROSS_BLEED take over" would have started
       failing again at ~2600px, 50.8% linked share at 3440 and 34.2% at 5120.
       The sweep that produced 2.6 stopped at 2560, one step short of seeing it.

       So the ceiling is gone. LINK_SHARE binds at every width and the linked
       share is width-invariant BY CONSTRUCTION rather than by choosing a lucky
       constant. What stops the wheels being HUGE is the cross-axis term, which
       is the guard that is actually physical -- a wheel cannot exceed the short
       axis -- and the 0.28 floor, which is a floor and not a ceiling.

       If a size cap is ever wanted again it must be an ABSOLUTE wheel size in
       px, not a multiplier on a ratio, or this recurs a fourth time.

       THAT LAST PARAGRAPH WAS WRONG, and the measurement that disproved it is
       below (#65). An absolute px cap cannot work here: a seven-wheel chain on a
       5120x1440 display renders LARGER wheels (812px) than a one-wheel chain does
       on a 390x844 phone (486px), so no single pixel value both spares a real
       chain and catches a degenerate one. The sentence above is kept rather than
       deleted because the reasoning it came from is still right -- a cap on a
       ratio driven by the LONG axis is crossed at some width every time. What it
       missed is that the SHORT axis does not have that property. The cap below is
       a fraction of the short axis, which is the sentence's own words two
       paragraphs up: "a wheel cannot exceed the short axis". */
    /* LINK_SHARE is declared at module scope, beside NOMINAL_SPAN, because the
       bridge reads it too -- see the note there for what it is and why. */
    /* A SINGLE WHEEL MAY NOT EXCEED THE SHORT AXIS. Both terms above are ratios
       against the SOLVE, so they say nothing about how big one wheel ends up.
       That is fine while the solve is a chain -- solved.w is seven wheels, so
       LINK_SHARE binds long before any wheel gets silly. It is not fine when the
       solve IS one wheel: crossSolved is then a single diameter, the cross term
       reduces to crossAvail * CROSS_BLEED, and the wheel renders at 125% of the
       short axis at EVERY viewport. ?who=harper drew one gear cropped off the top
       and bottom of the page.

       Measured before choosing, over 7 viewports from 390x844 to 5120x1440:
         the 7-wheel chain peaks at  70.8% of the short axis (1020px at 5120x1440)
         the 1-wheel chain bottoms at 146.8% (686px at 390x844)
       so the two separate cleanly as a FRACTION of the short axis, and not at all
       in absolute pixels -- a full chain on an ultrawide renders BIGGER wheels
       than a lone wheel does on a phone, so no absolute value can spare one and
       catch the other. The note left at #44 asked for an absolute px cap; the
       measurement says that cannot work, and this is why.

       Why this is not the cap that #19 and #44 kept reintroducing: those capped a
       ratio driven by the LONG axis, which grows without bound as the viewport
       widens, so any constant is crossed at some width and the train becomes a
       fixed size whose share falls as 1/W. This is bounded by the SHORT axis,
       which is what physically bounds a wheel -- a gear cannot sensibly be taller
       than the screen. Honest about its own limit: at 1440px tall it would begin
       binding on the 7-wheel chain at roughly 6970px wide. No such display
       exists, and a 7680x2160 desktop pushes it past 10000px, but it is the same
       class of property and is written down rather than claimed immune. */
    /* A SHORT CHAIN IS STILL SCALED AS A CHAIN. Capping the RESULT was the first
       attempt and it produced the wrong picture: it makes a lone wheel as large
       as it is allowed to be, so ?who=harper drew one enormous gear. What the
       page wants is the opposite -- a wheel at ordinary size, with the escape
       runs doing the filling, exactly as they do at both ends of a long chain.

       ONE RULE, FOUR BOUNDS, NO SPECIAL CASE FOR CHAIN LENGTH. Nothing below
       branches on how many wheels are linked -- there is no conditional and no
       count test, and a one-wheel chain and a nine-wheel chain run exactly the
       same arithmetic. The rule is:

         a gear is drawn as though a NOMINAL_SPAN chain were on stage, and it
         shrinks below that only when something physical says it must.

       The three things that can say so:
         1. the chain itself is too long to fit the axis at that size
         2. the serpentine's band would overflow the short axis
         3. a single wheel would overflow the short axis

       Bounds 1 and 2 are what shipped before; the standard size and bound 3 are
       new. A long chain is bound by its own span, a short one by the standard
       size, and neither knows which it is -- they are terms in one min(), not
       branches. NOMINAL_SPAN is computed from the module, the tooth count the
       deal aims at and the bearing range, so no term here is a tuned number.

       #44's property is intact and unchanged in every state: the linked run still
       takes a CONSTANT fraction of the long axis at every width. A full chain
       takes LINK_SHARE of it; a one-wheel chain measures 25.9-27.2% from 390px to
       5120px, and the escape runs cover the difference. A different constant, not
       a broken invariant -- "the coverage comes from the chain being longer,
       never from the wheels being bigger".

       Bound 3 exists because a constant share of a very WIDE screen is not a
       constant share of a SHORT one: 27% of 5120px is 1391px, which on a 1440px
       display is 96.6% of the short axis. Bound 2 does not catch it -- it is
       written for a serpentine's vertical band, and when the solve IS one wheel it
       reduces to "a wheel may be 125% of the short axis", far above what the long
       term asks for.

       1.0 is a DEFINITION, not a tuned value: a gear may not be wider than the
       screen's short side. It is deliberately not set to a fraction chosen to
       look right, because that would be exactly the kind of number that drifts.
       With the standard size in the min it rarely binds at all -- it is the
       backstop for an aspect ratio nothing else covers. */
    const WHEEL_CROSS_MAX = 1.0;
    /* Matches what is drawn: gearSvg sizes each wheel (ro + 6) * 2. */
    const wheelSpan = TRAIN.reduce((m, t) => Math.max(m,
      (MODULE * (t.teeth / 2 + TOOTH_ADD) + 6) * 2), 0);
    const fit = Math.max(0.28, Math.min(
      LINK_SHARE * longAvail / NOMINAL_SPAN,
      LINK_SHARE * longAvail / longSolved,
      crossAvail * CROSS_BLEED / crossSolved,
      wheelSpan ? WHEEL_CROSS_MAX * crossAvail / wheelSpan : Infinity));
    const root = document.documentElement.style;
    root.setProperty('--gsfit', fit.toFixed(3));
    /* THE WHEELS ARE DRAWN AT FINAL SIZE (#37). Everything inside the stage used
       to lay out in unscaled solve units under one `transform: scale(--gs)`
       ancestor, with the badges alone positioned at `calc(px * var(--gs))`. That
       put the two on opposite sides of a scale boundary: each wheel wrapper
       carries `will-change: transform`, so it is promoted to its own compositing
       layer, and a promoted layer is rasterised at its LAYOUT size and then
       stretched by the ancestor's scale. Blink re-rasterises when the composited
       scale changes; WebKit frequently does not, which is why Safari showed soft
       teeth against razor-sharp badge plates while Chrome looked fine.

       So the scale is baked into the geometry instead, and the vector reaches the
       compositor already the right size. Quantised to 1% so dragging a window
       edge does not re-render on every pixel -- and it must be quantised, because
       this is the value a change of which costs a full re-render. Quantised DOWN,
       never to nearest: the fit above is a ceiling that keeps the linked wheels
       wholly on screen, and rounding up would spend part of the margin the ghost
       runs are supposed to live in. */
    const gsr = Math.floor(fit * (this.props.gearScale ?? 1) * 100) / 100;
    if (gsr !== this._gsr) { this._gsr = gsr; this.forceUpdate(); }
    this.fitEscapes();
    root.setProperty('--dir', rowMode ? 'row' : 'column');
  }

  componentDidMount() {
    /* One beacon per load, naming only which chain was shown -- never a handle,
       never a referrer. Fires from mount rather than from the top of the file so
       it counts a page that actually rendered. */
    if (AN.pageview !== false) track('view/' + (WHO.slug || 'unknown'));
    this.loadIcons();
    this.startPhysics();
    this.fitStage();
    this.onResize = () => this.fitStage();
    window.addEventListener('resize', this.onResize);
    /* iOS fires this and not `resize` when the toolbar collapses or the keyboard
       comes up, so without it the fit is stale exactly when the viewport moves. */
    if (window.visualViewport) window.visualViewport.addEventListener('resize', this.onResize);
    /* LAYER: parallax — the far plane drifts against pointer movement. */
    this._onPointer = (e) => {
      if (!this.props.parallax || !this._ghostLayer) return;
      const dx = (e.clientX / window.innerWidth - 0.5) * 26, dy = (e.clientY / window.innerHeight - 0.5) * 18;
      this._ghostLayer.style.transform = 'translate(' + (-dx).toFixed(1) + 'px,' + (-dy).toFixed(1) + 'px) scale(0.94)';
    };
    window.addEventListener('pointermove', this._onPointer, { passive: true });
    let saved = null;
    try { saved = localStorage.getItem('wozi-theme'); } catch (e) {}
    this.mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    this.onSys = (e) => {
      let stored = null;
      try { stored = localStorage.getItem('wozi-theme'); } catch (err) {}
      if (!stored) this.apply(e.matches ? 'dark' : 'light');
    };
    if (this.mq && this.mq.addEventListener) this.mq.addEventListener('change', this.onSys);
    this.apply(saved || (this.mq && this.mq.matches ? 'dark' : 'light'));
    this.syncVars();
  }

  componentDidUpdate() { this.syncVars(); this.fitStage(); }

  componentWillUnmount() {
    if (this.mq && this.mq.removeEventListener) this.mq.removeEventListener('change', this.onSys);
    window.removeEventListener('resize', this.onResize);
    if (window.visualViewport) window.visualViewport.removeEventListener('resize', this.onResize);
    if (this._onPointer) window.removeEventListener('pointermove', this._onPointer);
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._io) this._io.disconnect();
  }

  syncVars() {
    const r = document.documentElement.style;
    const speed = this.props.speed ?? 1;
    /* gearScale is no longer a CSS variable: it multiplies into gsRender() and
       reaches the page as real pixel geometry, so nothing has to resolve it at
       used-value time (#37). */
    /* Dark mode gets the lighter counterpart; an accent dark enough to read on
       the light background disappears against the dark one. */
    if (this.props.accent) {
      const pair = ACCENTS[this.props.accent];
      r.setProperty('--accent', (this.state.theme === 'dark' && pair) || this.props.accent);
    }
  }

  apply(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    this.setState({ theme });
  }

  /* Solve the train: centre distances = sum of pitch radii, alternating spin,
     angular speed inversely proportional to tooth count, tooth phase meshed. */
  solve() {
    if (this._axisRot === undefined) this._axisRot = this.axisRot();
    if (this._idlerN === undefined) this._idlerN = this.idlerCount();
    if (this._solved) return this._solved;
    /* Sites are dealt onto the wheels fresh each load, but sibling services stay
       belted to each other: the two belt-linked slots always get a pair. */
    const shuffle = (arr) => {
      if (this.props.shuffle === false) return arr;
      for (let k = arr.length - 1; k > 0; k--) {
        const j = Math.floor(Math.random() * (k + 1));
        const tmp = arr[k]; arr[k] = arr[j]; arr[j] = tmp;
      }
      return arr;
    };
    /* SEATED ONCE, NOT ON EVERY SOLVE (#55). solve() re-runs whenever fitStage
       invalidates its cache, so this shuffle used to move a service -- and the
       handle engraved on that wheel's band -- onto a different wheel while the
       user was resizing. 14 thresholds between 380px and 1000px of the smaller
       axis, plus every orientation flip. Worse, 6 of them fire on `boost`,
       which is read only in the `linked` branch that no shipped TRAIN entry
       takes, so nearly half of the reshuffles were for a variable with no
       effect on this train at all.
       The file already states the rule 200 lines up, about colour: "computed
       once at module load and never on resize, so the wheels cannot change
       colour under the pointer". Colours obeyed it; slugs did not.
       Cached on the instance rather than hoisted to module scope because the
       shuffle reads this.props.shuffle, and PAIR_SLOTS/SITES are declared
       further down the file than the colour deal is. */
    if (!this._slugFor) {
      const slugFor = {};
      /* SEATED PER PERSON. PAIR_SLOTS names wheel indices WITHIN a chain, so on a
         combined stage they have to be read relative to where that person's
         wheels start -- otherwise a pair straddles a boundary and one of someone
         else's services lands on this person's wheel (#65 is the same family:
         a wheel that ends up with the wrong slug, or none). */
      const byPerson = {};
      TRAIN.forEach((t, i) => {
        if (t.role !== 'link') return;
        (byPerson[t.person] = byPerson[t.person] || []).push(i);
      });
      Object.keys(byPerson).forEach(person => {
        const idx = byPerson[person];
        /* A pair slot the chain cannot reach is not a pair slot -- it would claim
           its in-range index while never being fillable, and that wheel would draw
           blank (#65). */
        const pairSlots = PAIR_SLOTS.filter(pr => pr.every(k => k < idx.length));
        const singleSlots = [];
        idx.forEach((_, k) => { if (!pairSlots.some(pr => pr.indexOf(k) >= 0)) singleSlots.push(k); });
        /* ONLY SEAT SERVICES THIS PERSON ACTUALLY HAS (#53, now checked per person
           rather than per page). config.js says "a service named here but absent
           from a person's links is simply skipped" -- it was not, and a second
           person crashed the page 2000 times out of 2000, because renderVals()
           reads SITES[g.slug].label unguarded. That matters now rather than later:
           the picker is built and adding a person is documented as a config edit.
           Filtering here, against this person's own slice of SITES, keeps the
           promise where the seating happens, instead of leaving every consumer to
           guard a slug that should never have existed. */
        const has = (slug) => Object.prototype.hasOwnProperty.call(SITES[person] || {}, slug);
        const pairs = shuffle(PAIRS.filter(pr => pr.every(has)).map(pr => shuffle(pr.slice())));
        const singles = shuffle(SINGLES.filter(has));
        /* Both guards are needed and for different reasons: PAIRS empty gave
           pairs[NaN] -> a TypeError, while SINGLES empty merely left the slug null
           and the badge filtered out later. Same shape, two outcomes, three lines
           apart -- so treat them the same. */
        if (pairs.length) pairSlots.forEach((pr, k) => {
          const pair = pairs[k % pairs.length];
          slugFor[idx[pr[0]]] = pair[0]; slugFor[idx[pr[1]]] = pair[1];
        });
        if (singles.length) singleSlots.forEach((s, k) => { slugFor[idx[s]] = singles[k % singles.length]; });
      });
      this._slugFor = slugFor;
    }
    const slugFor = this._slugFor;
    const g = [], strands = [];
    /* g IS DENSE OVER THE WHEELS ACTUALLY PLACED; TRAIN IS NOT. A parked idler
       is skipped entirely, so a wheel's slot in g stops being its index in
       TRAIN -- gi maps one to the other, and every lookup that used to index g
       with a TRAIN index goes through it. Nothing else changes: each entry still
       carries its own TRAIN index as `i`, which is what the render keys and the
       rotation loop address it by. */
    const gi = new Array(TRAIN.length).fill(-1);
    /* HOW MANY IDLERS ARE IN MESH, and therefore which are parked. The surplus is
       skipped rather than spliced out of TRAIN (see MIN_IDLERS), and the chain a
       bridge feeds re-parents onto the last idler still in mesh. */
    const nIdle = Math.max(MIN_IDLERS, Math.min(MAX_IDLERS, this._idlerN || MIN_IDLERS));
    /* THE ANCHORS ARE ONLY VALID FOR THE BRIDGE LENGTH THEY WERE SOLVED AT.
       They are cached across resizes on purpose (#55) -- a bridge free to
       re-choose walks along the spine while a window edge is dragged -- but a
       bridge one idler shorter reaches one wheel less far, and every chain
       hanging off it lands somewhere the search never looked: measured, two
       chains overlapped and a third's idler ran out of swing. The count is the
       one input the anchor cannot survive a change in, and it changes at most
       once per drag, because idlerCount() has its own hysteresis. So key the
       cache on it rather than pretending it is constant. */
    if (this._bridgeAtN !== nIdle) { this._bridgeAt = null; this._bridgeAtN = nIdle; }
    const parked = new Array(TRAIN.length).fill(false);
    const parentOf = TRAIN.map(t => t.parent);
    /* Chain heads whose bridge was refused, and the anchor they stand off
       instead. Filled in when the refusal is discovered -- at the bridge's first
       idler, which the loop reaches before the head. */
    const refusedAt = {};
    /* Which position an idler holds within its own bridge. Only the ones below
       MIN_IDLERS are guaranteed to be in mesh at every viewport, and the
       attachment search filters on that -- see bridgeAnchor. */
    const idlerSlot = {};
    BRIDGES.forEach(b => {
      b.idlers.forEach((ix, k) => { idlerSlot[ix] = k; if (k >= nIdle) parked[ix] = true; });
      if (b.idlers.length) parentOf[b.head] = b.idlers[Math.min(nIdle, b.idlers.length) - 1];
    });
    /* PERPENDICULAR TO THE SPINE, RELATIVE TO IT. The stage rotates the whole
       train by this._axisRot in portrait, so a bearing in absolute screen degrees
       would keep the bridge horizontal and send it across the SHORT axis --
       exactly the #67 failure. It is only ever used added to this._axisRot, never
       on its own. All bridges take the same side, which is the ordering Charles
       chose over balancing the cross axis: growth goes one way and the spine sits
       at the top. */
    const BRIDGE_BEARING = 90;
    const bridgeBase = (this._axisRot || 0) + BRIDGE_BEARING;
    /* HOW FAR OFF PERPENDICULAR A BRIDGE MAY BE NUDGED before it stops reading as
       a bridge and starts reading as a wandering chain. Not a new tuned number:
       it is the width of the bearing range the serpentine itself is dealt from,
       so the two move together. */
    const BRIDGE_SWING = ANG_MAX - ANG_MIN;
    const bridgeRuns = [];
    /* A TREE HAS MORE THAN TWO ENDS. The rule is that the machine's extremities
       push apart so the run reads as a line rather than a closed ring; with one
       chain that is the first and last wheel, but a branch adds an end. Leaves
       and the root are the extremities.

       AND THE EXTREMITIES ARE THE SPINE'S. Read as "any two leaves" the rule
       over-applies the moment the tree is bushy: two chains hanging off one spine
       are both leaves, and they are MEANT to sit one bridge apart rather than be
       shoved a further ENDS_APART from each other -- which surfaces as the nudge
       loop growing d by 12% over and over until something lands. The spine is the
       line that has to read as a line; a branch hangs off it. On a single chain
       every wheel is spine, so this is the old rule exactly -- the root and the
       one leaf, and no other pair. */
    const hasChild = new Array(TRAIN.length).fill(false);
    TRAIN.forEach(t => { if (t.parent != null) hasChild[t.parent] = true; });
    const isLeaf = (i) => !hasChild[i];
    const isEnd = (i) => TRAIN[i].person === WHO.slug
      && (isLeaf(i) || TRAIN[i].parent == null);
    /* WHERE A BRIDGE HANGS FROM IS SOLVED, NOT PLACED. Candidates are tried from
       the middle of the chain immediately above this one outward, so a branch
       balances the run it hangs from rather than hanging off one end, and then
       -- falling back -- onto the chains above that one and finally the spine,
       which is how a chain still arrives once the one above it has no clear
       bearing left. A candidate is rejected when any wheel of the bridge OR OF
       THE CHAIN IT FEEDS would foul a wheel already placed, when the run would
       pass over one, or when it would cross a bridge already run.

       DECIDED ONCE AND CACHED ON THE INSTANCE, exactly as the slug seating above
       is and for the same reason (#55): solve() re-runs at every quantised resize
       step, and a bridge free to re-choose would walk along the spine while a
       window edge was being dragged. The one input it cannot survive a change in
       is the number of idlers, which is why the cache is keyed on that above. */
    const bridgeAnchor = (b) => {
      if (!this._bridgeAt) this._bridgeAt = {};
      if (this._bridgeAt[b.person] !== undefined) return this._bridgeAt[b.person];
      /* RANKED IN TIERS COMPARED IN ORDER, not added up. The weights here were
         1000 and 500 laid over |k - mid|, which is a tier ordering only while
         that last term stays under 500 -- true of every stage shipped today and
         silently untrue of a longer one, at which point a distant spine wheel
         would outrank a near one on the wrong chain. Comparing the tiers in
         sequence leaves nothing to hold:

           1. THE CHAIN IMMEDIATELY ABOVE THIS ONE, which is the LAST chain
              placed -- CHAIN_ORDER descending. Every bridge runs the same way,
              so hanging each chain off the one before it is what lays them out
              longest-first from the top in landscape, and from the leading edge
              of the cross axis in portrait (Charles, 2026-08-02). Ranked the
              other way round, every chain hangs off the spine and they all
              arrive in the SAME row, ordered by nothing. If the chain above has
              no clear bearing the search falls back through the ones above it,
              which is a chain out of order but never one on top of another.
           2. a linked wheel before an idler -- a bridge should hang off a
              machine, not off another bridge;
           3. nearest the middle of ITS OWN chain, so a branch balances the run
              it hangs from rather than hanging off one end. Measured against the
              spine's middle this was meaningless for a cascade, which is the
              only case it is ever asked about.

         An idler ranks with the chain it feeds: that is where it sits in the
         layout, one row nearer the spine than that chain. */
      const midOf = (k) => {
        if (TRAIN[k].person == null) return k;          /* an idler is its own middle */
        const b = BRIDGES.filter(bb => bb.person === TRAIN[k].person)[0];
        const head = b ? b.head : 0;
        let n = 0;
        while (TRAIN[head + n] && TRAIN[head + n].person === TRAIN[k].person) n++;
        return head + (n - 1) / 2;
      };
      const tiers = (k) => [
        -CHAIN_RANK[TRAIN[k].person != null ? TRAIN[k].person : TRAIN[k].bridge],
        TRAIN[k].role === 'link' ? 0 : 1,
        Math.abs(k - midOf(k))
      ];
      /* AN IDLER THAT CAN BE PARKED IS NOT A CANDIDATE. nIdle drops to one when
         the cross axis tightens, and the anchor is cached across resizes (#55) --
         so an anchor on a second idler names a wheel that is no longer placed
         after the next flip, its dependent chain finds gi[host] === -1, and it
         resolves to (0,0) on top of the spine. That is exactly the overlap the
         bridge exists to remove, arriving by the back door. Only the idlers
         MIN_IDLERS guarantees are always in mesh may be anchored on. */
      const cands = g.map(o => o.i)
        .filter(k => idlerSlot[k] === undefined || idlerSlot[k] < MIN_IDLERS)
        .sort((p, q) => {
          const u = tiers(p), v = tiers(q);
          for (let k = 0; k < u.length; k++) if (u[k] !== v[k]) return u[k] - v[k];
          return p - q;
        });
      const a = bridgeBase * Math.PI / 180;
      const tight = this._tight || 1;
      /* THE WHOLE CHAIN IS TRIED, NOT JUST THE BRIDGE. The run used to be checked
         as far as the chain head and no further, so an anchor could be accepted
         whose chain then walked straight through another one -- and the only
         thing between that and two overlapping machines was the per-wheel nudge,
         which gives up after a bounded swing and plants the wheel anyway. Walking
         the chain here, at the bearings it was dealt and by the rule the nudge
         uses at step zero, is what makes "chains do not overlap" a property of
         the anchor rather than a hope about the nudge. */
      const chain = [];
      for (let k = b.head; k < TRAIN.length && TRAIN[k].person === b.person; k++) chain.push(k);
      /* One pass over the candidates for one shape of arrival: `bw` is the idlers
         that would be in mesh (none, when the bridge is being refused) and `gap`
         is the empty space that stands in for them. Returns the first candidate
         that clears everything, and a tally of why the others did not. */
      const search = (bw) => {
        const wheels = bw.concat(chain);
        const gap = bw.length ? 0 : nIdle * MODULE * TEETH_MEAN;
        const why = { foul: 0, over: 0, cross: 0 };
        for (let c = 0; c < cands.length; c++) {
          const from = g[gi[cands[c]]];
          let px = from.x, py = from.y, pr = from.r, clear = true;
          const pts = [];
          wheels.forEach((k, wi) => {
            const rr = MODULE * TRAIN[k].teeth / 2;
            /* The bridge runs on the bridge bearing, wheel by wheel, as far as
               the chain head; past it the chain runs on the bearings it was
               dealt. */
            const onBridge = wi <= bw.length;
            const ang = onBridge ? a : (TRAIN[k].angle + (this._axisRot || 0)) * Math.PI / 180;
            const d = pr + rr + (onBridge ? gap : 0);
            px += d * Math.cos(ang); py += d * Math.sin(ang);
            pts.push({ x: px, y: py, ro: rr + MODULE * TOOTH_ADD });
            pr = rr;
          });
          pts.forEach((p, k) => g.forEach(o => {
            if (k === 0 && o.i === cands[c] && !gap) return;   /* the wheel it meshes */
            if (Math.hypot(p.x - o.x, p.y - o.y) < o.ro + p.ro + CLEARANCE * tight) clear = false;
          }));
          if (!clear) { why.foul++; continue; }
          /* The bridge RUN is anchor to chain head. Measured to the far end of
             the chain instead it would be a line straight through the chain's
             own wheels, and every candidate would read as passing over
             something. */
          const s1 = { x: from.x, y: from.y }, s2 = pts[bw.length];
          clear = !g.some(o => o.i !== cands[c]
            && segDist({ x: o.x, y: o.y }, s1, s2) < o.ro);
          if (!clear) { why.over++; continue; }
          clear = !bridgeRuns.some(st => segCross(s1, s2, st[0], st[1]));
          if (!clear) { why.cross++; continue; }
          return { at: cands[c], found: true, why: why };
        }
        return { at: null, found: false, why: why };
      };
      const tally = (w) => w.foul + ' fouled a wheel, ' + w.over
        + ' passed over one, ' + w.cross + ' crossed another bridge';
      /* No idlers already means an unbridged chain (`bridge: false`): its one
         step carries the gap the idlers would have made, so that setting changes
         the drive and not the position. There is nothing to refuse. */
      const wanted = b.idlers.slice(0, nIdle);
      let out = search(wanted), bridged = wanted.length > 0;
      if (!out.found && wanted.length) {
        /* THE BRIDGE REFUSES RATHER THAN CROSSING (Charles, 2026-08-02). Every
           candidate was rejected, and the old code kept the best-ranked one
           anyway -- an anchor known to foul, handed to a nudge loop bounded at
           BRIDGE_SWING, which then planted the wheel wherever it ran out. That
           quietly loosened the one rule this solver exists to enforce. A chain
           that turns up undriven now and then is a cost; a bridge drawn across
           another run is not, because it is the rule itself failing.

           So the chain is placed WITHOUT its bridge, which is not a new
           behaviour to get wrong -- it is exactly what `bridge: false` produces,
           down to the gap: the idlers are parked, the head becomes a root, and
           it stands at the distance the idlers would have set. It is searched
           for again in that shape, because the reasons a bridge is rejected are
           mostly the idlers' own: two wheels of metal that an empty gap does not
           put there. */
        console.warn('wozi: no clear bridge anchor for chain "' + b.person
          + '" — all ' + cands.length + ' candidates rejected (' + tally(out.why)
          + '); refusing to bridge it, and placing it undriven instead');
        bridged = false;
        out = search([]);
      }
      if (!out.found) {
        /* Not even the empty gap fits, so there is nowhere clear for this chain
           at all. It still has to go somewhere -- ordering and non-overlap are
           the composition, and a chain that is simply absent is worse than one
           standing too close -- so it takes the best-ranked anchor. What may
           clash is a WHEEL. There is no bridge by this point either way, so
           nothing that could be drawn across another run. */
        console.warn('wozi: chain "' + b.person + '" has no clear position at all'
          + ' (' + tally(out.why) + '); placing it '
          + (cands.length ? 'off wheel ' + cands[0] : 'at the origin')
          + ', which may clash');
        out.at = cands.length ? cands[0] : null;
      }
      this._bridgeAt[b.person] = { at: out.at, bridged: bridged };
      return this._bridgeAt[b.person];
    };
    TRAIN.forEach((t, i) => {
      if (parked[i]) return;
      const prof = t.prof || {};
      const r = MODULE * t.teeth / 2;
      const ro = r + MODULE * TOOTH_ADD;
      let chainFrom = null;
      /* PER WHEEL, NOT CARRIED. These used to be declared outside the loop and
         mutated, so wheel i's position was whatever the previous iteration left
         behind -- the implicit path, written as shared state. Deriving each wheel
         from its own parent is what makes a branch possible. The initial values
         are the ones the old declaration held, so the root is unchanged. */
      let x = 0, y = 0, dir = 1, phase = 0;
      /* A BRIDGE STARTS HERE: take the anchor from the attachment solve rather
         than the default the TRAIN builder wrote. An unbridged chain's first
         wheel stays a ROOT -- no parent, no drive -- but is still placed off the
         same anchor, so `bridge: false` costs it its idlers and nothing else.
         EVERY non-first root needs real coordinates: without this they all
         resolve to (0,0) and the second chain draws on top of the first. */
      const starts = BRIDGE_FROM[i];
      let rootFrom = refusedAt[i] === undefined ? null : refusedAt[i];
      if (starts) {
        const chosen = bridgeAnchor(starts);
        /* A REFUSED BRIDGE IS PARKED WHOLE. The search found nowhere its idlers
           could go without crossing something, so there are no idlers: every one
           of them is parked exactly as a surplus idler is, the chain head stops
           being their child and becomes a root, and it is placed off the same
           anchor at the gap they would have made. This wheel IS one of those
           idlers -- the bridge starts here -- so there is nothing left to do for
           it. Identical in every respect to `bridge: false` on this chain, which
           is why it needs no drawing code of its own. */
        if (starts.idlers.length && !chosen.bridged) {
          starts.idlers.forEach(ix => { parked[ix] = true; });
          parentOf[starts.head] = null;
          refusedAt[starts.head] = chosen.at;
          return;
        }
        if (chosen.at != null) {
          if (starts.idlers.length) parentOf[i] = chosen.at; else rootFrom = chosen.at;
        }
      }
      const free = rootFrom != null && parentOf[i] == null;
      const host = free ? rootFrom : parentOf[i];
      if (host != null && gi[host] >= 0) {
        const prev = g[gi[host]];
        const linked = !!t.link;
        /* A WHEEL IS COMPLETING A BRIDGE when it is an idler, when its host is
           one, or when it is an unbridged chain's root: the run that sets the gap
           between two chains is perpendicular to them, and only then does the
           chain it feeds go back to running parallel to the spine. */
        const bridging = free || t.role === 'idler' || TRAIN[host].role === 'idler';
        /* Distance is fixed by the drive type; the bearing is nudged until this wheel
           clears every wheel it is not meshed with by at least CLEARANCE. */
        let d = linked ? (prev.r + r) * (t.spread || 2) * (this._spreadBoost || 1)
          : free ? prev.r + r + nIdle * MODULE * TEETH_MEAN
          : prev.r + r;
        const base = bridging ? bridgeBase : t.angle + (this._axisRot || 0);
        const maxStep = linked ? 150 : bridging ? BRIDGE_SWING : 60;
        let ang = base, placed = false;
        for (let pass = 0; pass < (linked ? 3 : 1) && !placed; pass++) {
          for (let step = 0; step <= maxStep && !placed; step += 4) {
            for (let sgn = 1; sgn >= -1 && !placed; sgn -= 2) {
              const cand = base + sgn * step;
              const a = cand * Math.PI / 180;
              const px = prev.x + d * Math.cos(a), py = prev.y + d * Math.sin(a);
              let clash = g.some((o) => {
                if (o.i === host && !free) return false;
                /* The two ends of the train repel each other, so the run reads as a
                   line of machinery rather than a closed ring. */
                const tight = this._tight || 1;
                const need = o.ro + ro + CLEARANCE * tight
                  + (isEnd(o.i) && isEnd(i) && o.i !== host ? ENDS_APART * tight : 0);
                return Math.hypot(px - o.x, py - o.y) < need;
              });
              if (!clash && linked && g.length > 1) {
                /* A drive run must head away from the wheels already placed, otherwise it
                   folds back through the middle of the train. */
                const mx = g.reduce((s, o) => s + o.x, 0) / g.length, my = g.reduce((s, o) => s + o.y, 0) / g.length;
                const ox = prev.x - mx, oy = prev.y - my, oL = Math.hypot(ox, oy) || 1;
                const vx = px - prev.x, vy = py - prev.y, vL = Math.hypot(vx, vy) || 1;
                if ((ox / oL) * (vx / vL) + (oy / oL) * (vy / vL) < 0.15) clash = true;
              }
              if (!clash && linked) {
                /* A chain or belt run may not cross another run, nor pass over a wheel. */
                const s1 = { x: prev.x, y: prev.y }, s2 = { x: px, y: py };
                clash = strands.some(st => segCross(s1, s2, st[0], st[1])) ||
                  g.some((o) => o.i !== host && segDist({ x: o.x, y: o.y }, s1, s2) < o.ro + 10);
              }
              if (!clash) { ang = cand; x = px; y = py; placed = true; }
              if (step === 0) break;
            }
          }
          if (!placed) d *= 1.12;
        }
        if (!placed) {
          const a = base * Math.PI / 180;
          x = prev.x + d * Math.cos(a); y = prev.y + d * Math.sin(a);
          /* THE ONE WAY A SOLVED STAGE CAN STILL OVERLAP, and it is a WHEEL that
             does it, never a bridge. Every other position above is one the clash
             test accepted; this one is planted because the swing ran out, and it
             may sit on top of something. It used to be silent, which made the
             overlap it caused look like a layout choice.

             NO IDLER CAN REACH HERE ANY MORE. An idler is only placed at all
             once the attachment search has walked its whole bridge and the chain
             behind it and found the run clear -- so its step-zero bearing is
             clear by construction and the loop above accepts it on the first
             try. When the search finds nothing, the bridge is refused rather
             than nudged: the idlers are parked and the chain arrives undriven
             (Charles, 2026-08-02). If an idler ever names itself here, the
             search and this loop have drifted apart, and that is a defect
             rather than a tight fit. */
          console.warn('wozi: wheel ' + i + ' ('
            + (TRAIN[i].person || 'idler for ' + TRAIN[i].bridge)
            + ') found no clear bearing within ' + maxStep
            + '° of ' + base.toFixed(1) + '°; planted anyway, and may clash'
            + (t.role === 'idler' ? ' — AND IT IS AN IDLER, which the refusal '
              + 'above should have made impossible' : ''));
        }
        if (linked) {
          dir = prev.dir;
          phase = 0;
          chainFrom = host;
          strands.push([{ x: prev.x, y: prev.y }, { x: x, y: y }]);
        } else if (free) {
          /* AN UNBRIDGED CHAIN IS ITS OWN MACHINE. Nothing drives it, so there is
             no sense to inherit and no tooth phase to mesh: it takes the same
             values the spine's own root takes, and no consumer has to special-case
             a wheel with no parent. */
          dir = 1;
          phase = 0;
        } else {
          dir = -prev.dir;
          /* Exact conjugate mesh: measure where the line of centres falls inside the
             previous gear's tooth pitch, then place this gear so a gap sits opposite. */
          const pPrev = 360 / prev.teeth, pThis = 360 / t.teeth;
          let u = ((ang - prev.phase) / pPrev) % 1;
          if (u < 0) u += 1;
          phase = ang + 180 - (0.5 - u) * pThis;
        }
      } else if (host != null) {
        /* A WHEEL WHOSE HOST IS NOT ON STAGE keeps x = y = 0 and is drawn at the
           origin, on top of the spine's first wheel -- the exact overlap this
           bridge was built to remove, arriving from the other direction. The
           anchor search can no longer name a parkable idler, so nothing should
           reach here; if something does, it is a real defect and not a layout
           quirk, and it says so. */
        console.warn('wozi: wheel ' + i + ' is parented to wheel ' + host
          + ', which is not on stage — it would be drawn at the origin, '
          + 'on top of the spine');
      }
      /* Record the finished run, so the next bridge can be rejected for crossing
         it. Kept separate from `strands`, which is the dormant chain-and-belt
         capability's list and is drawn -- a bridge is meshed metal, not a strand. */
      const arrived = BRIDGE_HEAD[i];
      if (arrived && this._bridgeAt && this._bridgeAt[arrived.person]) {
        /* Recorded whether or not the bridge was refused: the empty gap an
           undriven chain stands at is still a run across the composition, and
           the next bridge may not cross it either. */
        const at = this._bridgeAt[arrived.person].at;
        if (at != null && gi[at] >= 0) {
          bridgeRuns.push([{ x: g[gi[at]].x, y: g[gi[at]].y }, { x: x, y: y }]);
        }
      }
      gi[i] = g.length;
      g.push({ i: i, teeth: t.teeth, color: t.color, cv: t.cv || null, crot: t.crot || 0, slug: slugFor[i] || null, person: t.person, role: t.role, belt: t.link || null, kind: t.kind || 'holes', arms: t.arms || 5, prof: prof, chainFrom: chainFrom,
        r: r, ro: ro, x: x, y: y, dir: dir, phase: phase });
    });
    /* NO TWO CHAINS OVERLAP -- said out loud rather than argued for (Charles,
       2026-08-02). Every position above is either one a clearance test accepted
       or one the warning beside it announced, so this cannot fire without one of
       those having fired first. That is an argument, and arguments rot; this is
       the check that notices when it has. Cheap enough to leave in: solve() is
       cached per quantised layout, and a stage is a couple of dozen wheels.
       WHEELS WITHIN A CHAIN ARE NOT COMPARED. They mesh, so their tip circles
       interpenetrate by two addenda by construction -- and the wheel a bridge
       hangs off meshes the first idler across a chain boundary, so meshing pairs
       are excluded by their parentage rather than by whose chain they are in. */
    const chainOf = (k) => k.person != null ? k.person : TRAIN[k.i].bridge;
    const foul = [];
    for (let p = 0; p < g.length; p++) {
      for (let q = p + 1; q < g.length; q++) {
        if (chainOf(g[p]) === chainOf(g[q])) continue;
        if (parentOf[g[p].i] === g[q].i || parentOf[g[q].i] === g[p].i) continue;
        const d = Math.hypot(g[p].x - g[q].x, g[p].y - g[q].y);
        if (d < g[p].ro + g[q].ro) {
          foul.push(chainOf(g[p]) + ' wheel ' + g[p].i + ' × ' + chainOf(g[q])
            + ' wheel ' + g[q].i + ' overlap by ' + (g[p].ro + g[q].ro - d).toFixed(1));
        }
      }
    }
    if (foul.length) console.warn('wozi: chains overlap — ' + foul.join('; '));
    let minX = Math.min.apply(null, g.map(k => k.x - k.ro)) - 6;
    let minY = Math.min.apply(null, g.map(k => k.y - k.ro)) - 6;
    let maxX = Math.max.apply(null, g.map(k => k.x + k.ro)) + 6;
    let maxY = Math.max.apply(null, g.map(k => k.y + k.ro)) + 6;
    /* CENTRE THE HUBS, NOT THE TOOTH ENVELOPE (#2). The stage is centred by the
       flex container using this box, and the box is the outer extent of the
       teeth -- so whenever the two end wheels differ in size, the row of HUBS
       sits off centre inside it even though the box itself is perfectly placed.
       That is the whole of #2, and it went from invisible to a 10% offset the
       moment a wheel was retired and the ends stopped being near-equal.

       The eye reads the row of badges as "the train", not the tooth envelope, so
       the box is grown on whichever side is short until it is symmetric about
       the midpoint of the hubs. Nothing moves relative to anything else -- only
       the frame the whole assembly is centred within. The outriggers are placed
       in this same space afterwards and follow it. */
    const hubMidX = (Math.min.apply(null, g.map(k => k.x)) + Math.max.apply(null, g.map(k => k.x))) / 2;
    const hubMidY = (Math.min.apply(null, g.map(k => k.y)) + Math.max.apply(null, g.map(k => k.y))) / 2;
    const halfX = Math.max(hubMidX - minX, maxX - hubMidX);
    const halfY = Math.max(hubMidY - minY, maxY - hubMidY);
    minX = hubMidX - halfX; maxX = hubMidX + halfX;
    minY = hubMidY - halfY; maxY = hubMidY + halfY;
    g.forEach(k => { k.cx = k.x - minX; k.cy = k.y - minY; });
    const chains = g.filter(k => k.chainFrom !== null && k.chainFrom !== undefined).map(k => ({ a: g[gi[k.chainFrom]], b: k }));
    /* The wordmark hangs from the lowest wheel on two cords, clear of every gear. */
    this._solved = { gears: g, chains: chains, w: maxX - minX, h: maxY - minY };
    return this._solved;
  }

  /* Geometry for the two engraved lines. Font size is a fixed fraction of the band, so it
     is identical on every wheel; the arc sweep is then derived from the actual text length
     and the band's circumference, shrinking the type only if a long handle would not fit. */
  engraving(g, r, m, bandOut) {
    const site = g.slug ? SITES[g.person][g.slug] : null;
    const raw = site ? site.path : '';
    /* Just the handle: everything after the last slash. */
    const handle = raw.indexOf('/') >= 0 ? raw.slice(raw.lastIndexOf('/') + 1) : raw;
    /* A printed wheel carries its material and process as well as its geometry,
       the way a real AM part does -- that mark is how you tell a printed one
       from a cut one on inspection, which is exactly its job (#43). The four
       lattice families are the printed ones; everything else is machined and
       says nothing extra. */
    const printedK = g.kind === 'hexcore' || g.kind === 'isogrid'
                  || g.kind === 'polarbrick' || g.kind === 'polariso';
    const stamp = 'M' + MODULE + ' Z' + g.teeth + (printedK ? ' · 17-4PH DMLS' : '');
    const MAX = 168 * Math.PI / 180;
    /* A FLOOR AS WELL AS A CEILING. The shrink below is one-sided: it divides the
       available sweep by the character count, so a long enough string scales the
       type toward nothing and engraves a grey smudge rather than a mark. At
       MIN_ENGRAVE (0.30 module, about 2.1 units) the lettering is still legible
       on a large wheel, and past that the string is cut instead of the type --
       an abbreviated handle reads, an illegible one does not. Nothing shipped
       comes close to the floor today; it is here so that adding a long handle to
       config.js is a truncation rather than a silent smear (#59, and the same
       one-sided-bound class as #46). */
    const MIN_ENGRAVE = 0.30;
    const fit = (txt, rr, base) => {
      const per = 0.60, track = 0.10;
      let f = base, t = txt;
      const width = (fs, str) => str.length * fs * (per + track);
      if (width(f, t) / rr > MAX) f = (MAX * rr) / (t.length * (per + track));
      if (f < m * MIN_ENGRAVE) {
        f = m * MIN_ENGRAVE;
        const room = Math.floor((MAX * rr) / (f * (per + track)));
        if (room >= 2 && t.length > room) t = t.slice(0, room - 1) + '\u2026';
      }
      return { f: f, txt: t, sweep: (width(f, t) / rr) * 180 / Math.PI };
    };
    /* Both lines are centred in the band; the rings they ride on are NOT at the band's
       centre radius. Glyphs hang off the ALPHABETIC baseline — the one baseline every
       engine puts in the same place — so each ring is dropped by BASELINE_MID of its own
       font size to bring the middle of the lettering back onto the band's middle. The two
       lines face opposite ways round the wheel: the top line's ascenders point outward and
       the bottom line's point inward, so the same shift is opposite in sign. Asking the
       engine to do this with `dominant-baseline: central` is what put the handle off
       centre in WebKit while Blink and Gecko looked right (#26). */
    const mid = bandOut - m * (BAND_DEPTH / 2);
    /* Fit first at the band's centre: that is what decides whether a long handle has to
       shrink, and the shift is measured in whatever size that lands on. */
    const T0 = fit(handle, mid, m * 0.80), B0 = fit(stamp, mid, m * 0.60);
    const rT = mid - BASELINE_MID * T0.f, rB = mid + BASELINE_MID * B0.f;
    /* Re-fit on the ring each line actually rides — a tighter radius needs a wider sweep. */
    const T = fit(handle, rT, T0.f), B = fit(stamp, rB, B0.f);
    /* T.txt / B.txt, not handle / stamp: if fit() had to cut the string, the
       sweep it returned describes the CUT string, and drawing the original
       against that sweep would overrun the ring. */
    return { handle: T.txt, stamp: B.txt, rT: rT, rB: rB, fT: T.f, fB: B.f, sT: T.sweep, sB: B.sweep };
  }

  /* One gear blank, drawn with true involute flanks.
     The working face of a real tooth is the involute of a base circle
     rb = r·cos(pressure angle) — the curve a taut string traces as it unwinds
     from that circle. It is the only profile with conjugate action, meaning the
     velocity ratio holds through the whole sweep rather than only at the pitch
     point, so mating teeth touch without ever interfering. Straight flanks
     cannot do both, which is what forced #11 to trade contact for clearance.
     Below the base circle no involute exists, so the flank runs radially down
     into the root. */
  /* No `prof` here on purpose: a tooth is a function of the module and the
     TOOTH_* constants alone, never of the web style bolted to the same wheel.
     The parameter used to be in this signature and was never read (#57), which
     invited exactly the wrong idea -- that a profile could change the teeth. */
  teethPath(n, r, chipIdx, mod) {
    const m = mod || MODULE;
    const ro = r + m * TOOTH_ADD, rr = Math.max(TOOTH_ROOT_MIN, r - m * TOOTH_DED), a = 2 * Math.PI / n;
    const phi = TOOTH_PA * Math.PI / 180, rb = r * Math.cos(phi);
    const inv = (x) => Math.tan(x) - x;
    /* Half the tooth's angular width at the pitch circle. TOOTH_THICK is the
       fraction of the circular pitch the tooth occupies there — a hair under a
       half, the rest being backlash. */
    const psiP = TOOTH_THICK * Math.PI / n;
    const half = (R) => psiP + inv(phi) - inv(Math.acos(Math.min(1, rb / R)));
    const rStart = Math.max(rb, rr + 0.01);
    const hRoot = half(rStart);
    /* Fillet blend: how far up the flank and how far round the root it reaches. */
    const fr = Math.min(m * TOOTH_FILLET, (rStart - rr) * 0.9 + 0.01);
    const rFil = Math.min(rStart, rr + fr), fa = fr / rr;
    const P = polarR;
    const STEPS = 7;
    const flank = [];
    for (let s = 0; s <= STEPS; s++) flank.push(rStart + (ro - rStart) * (s / STEPS));

    let d = 'M' + P(rr, -a / 2) + ' ';
    for (let i = 0; i < n; i++) {
      const c = i * a;
      /* Root arc up to where this tooth's flank leaves the root circle, then the
         fillet. A real fillet is a trochoid swept by the cutter tip; a quadratic
         through the corner is indistinguishable at this scale. */
      d += 'A' + rr + ' ' + rr + ' 0 0 1 ' + P(rr, c - hRoot - fa) + ' ';
      d += 'Q' + P(rr, c - hRoot) + ' ' + P(rFil, c - hRoot) + ' ';
      if (rStart > rFil) d += 'L' + P(rStart, c - hRoot) + ' ';
      if (i === chipIdx) {
        /* A chipped tooth: still there, but the crown has fractured away along a
           jagged face rather than vanishing cleanly. */
        const H = ro - rStart, lvl = (f) => rStart + H * f;
        for (let s = 1; s <= STEPS; s++) {
          const R = flank[s];
          if (R > lvl(0.62)) break;
          d += 'L' + P(R, c - half(R)) + ' ';
        }
        d += 'L' + P(lvl(0.93), c - half(lvl(0.93)) * 0.5) + ' ';
        d += 'L' + P(lvl(0.52), c - half(lvl(0.52)) * 0.2) + ' ';
        d += 'L' + P(lvl(0.70), c + half(lvl(0.70)) * 0.35) + ' ';
        d += 'L' + P(lvl(0.44), c + half(lvl(0.44)) * 0.8) + ' ';
        for (let s = STEPS; s >= 1; s--) {
          const R = flank[s];
          if (R > lvl(0.44)) continue;
          d += 'L' + P(R, c + half(R)) + ' ';
        }
      } else {
        for (let s = 1; s <= STEPS; s++) d += 'L' + P(flank[s], c - half(flank[s])) + ' ';
        /* Tip land, following the tip circle. */
        d += 'A' + ro.toFixed(2) + ' ' + ro.toFixed(2) + ' 0 0 1 ' + P(ro, c + half(ro)) + ' ';
        for (let s = STEPS - 1; s >= 0; s--) d += 'L' + P(flank[s], c + half(flank[s])) + ' ';
      }
      if (rStart > rFil) d += 'L' + P(rFil, c + hRoot) + ' ';
      d += 'Q' + P(rr, c + hRoot) + ' ' + P(rr, c + hRoot + fa) + ' ';
      d += 'A' + rr + ' ' + rr + ' 0 0 1 ' + P(rr, c + a / 2) + ' ';
    }
    return d + 'Z';
  }

  arcD(rad, a0deg, a1deg) {
    const a0 = a0deg * Math.PI / 180, a1 = a1deg * Math.PI / 180;
    const large = (a1deg - a0deg) > 180 ? 1 : 0;
    return 'M' + polarR(rad, a0) +
      ' A' + rad.toFixed(2) + ',' + rad.toFixed(2) + ' 0 ' + large + ' 1 ' + polarR(rad, a1);
  }

  ringPath(rad) {
    return 'M' + rad + ',0 A' + rad + ',' + rad + ' 0 1 0 ' + (-rad) + ',0 A' + rad + ',' + rad + ' 0 1 0 ' + rad + ',0 Z';
  }

  /* HOW FAR BACK A GHOST SITS, in one place because two things need it and they
     are not in the same layer. The escape-run outriggers get it as a single
     opacity on the whole layer they live in; a bridge idler CANNOT live in that
     layer -- it is parallax-scaled 0.94, and a wheel that has to mesh with the
     train must be drawn at the train's own scale -- so it takes the same number
     per wheel instead.

     It is not a second opinion about how dim a ghost should be: it is the same
     number, so an idler and an outrigger composite to the same tone and read as
     the same class of object. dimK below was measured UNDERNEATH this factor,
     and an idler drawn without it came out around 5.5:1 against the pale page --
     darker and higher in contrast than any of the linked wheels the machine is
     actually about, which is the opposite of what a ghost is for. */
  ghostOpacity() { return this.state.theme === 'dark' ? 0.17 : 0.46; }

  /* Cheap stand-in for the background wheels: body, web and hub, no masks or turning
     marks — they are blurred and dim, so the detail would be wasted frames. */
  ghostSvg(g, S) {
    const h = React.createElement;
    /* Flat, like the foreground wheels -- the modelled arm of every fill here
       was unreachable behind a `const flat = true` (#58), and with it went the
       last use of shades() in this method. */
    /* The linkless background wheels read too faint on the pale page, so their
       flat tones run darker than the palette greys suggest — depth by tone, not
       by fading (#21's lesson).

       How much darker is now PER THEME, because the two pages pull opposite ways:
       on the pale page darkening is what makes a ghost visible, on the dark page
       it is what makes it vanish. One factor served both until the light wheels
       were given their own tone -- that moved the linked wheels down to
       1.63-3.41:1 against the page and left the ghosts stranded at 1.62:1, the
       faintest thing on screen, which is what Charles saw. At 0.55 they sit near
       2.0:1: plainly there, still under the linked wheels, and still grey against
       colour so the hierarchy is carried by hue as well as by tone. */
    const dimK = this.state.theme === 'dark' ? 0.78 : 0.55;
    const dim = (hex) => { const n = parseInt(hex.slice(1), 16); const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; return '#' + c.map(v => Math.round(v * dimK).toString(16).padStart(2, '0')).join(''); };
    const ft = flatTones(dim(g.color || '#9AA6AD'));
    const size = (g.ro + 4) * 2, r = g.r;
    const path = this.teethPath(g.teeth, r);
    /* Softness comes from low-contrast fills, not a CSS blur: a filter on a rotating
       element re-rasterises every frame, which is what made these stutter. */
    /* The BOX is scaled, the viewBox is not: the vector is drawn at the size it
       is displayed rather than drawn small and blown up by an ancestor (#37). */
    return h('svg', { width: size * S, height: size * S, viewBox: (-size / 2) + ' ' + (-size / 2) + ' ' + size + ' ' + size, style: { position: 'absolute', left: (-size * S / 2) + 'px', top: (-size * S / 2) + 'px', overflow: 'visible' } },
      /* An outline is what separates "far away" from "out of focus". Without one
         these read as blurred, which is the complaint in #22 -- there is no blur
         anywhere in this file. */
      h('path', { d: path, fill: ft.body, stroke: ft.line, strokeWidth: 1, strokeOpacity: 0.65, strokeLinejoin: 'round' }),

         automatics braking the carrier for reverse). Page-frame speeds:

         words, the planets move so little. k-factors are relative to the host
         wheel; phase constants are the derived interleave conditions, valid at
         all three stations because 3|Zs and 3|Zr (the strict condition, not

      const kC = -1;
      const kP = TWO ? -Zr / Zp1 : Zr / Zp;
      const kP2 = Zr / Zp2;
      /* Single row: the sun opposes the wheel. Two rows: the opposition moves to
         the planet rows, which counter-rotate against each other, and the sun
         comes along with the wheel. */
      const kS = TWO ? (Zr / Zs - 1) : -(1 + Zr / Zs);
