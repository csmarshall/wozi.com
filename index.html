       carries a `link` (see CLAUDE.md, "Dormant capability: chain and belt").

       IT IS RECORDED, NEVER INFERRED. solve() already derives which mesh each
       wheel belongs to, by union-find, in the one place that decides it; asking
       applyRotation() to work it out again from geometry would be a second
       opinion about one fact, which is the class of fault #163 was.

       GUARDED ON `el`, NOT JUST ON THE ARRAY -- the same #59 fault the ghost
       collector already fixed and this one still carried. React calls a detached
       ref with null, so each render pushed one `{el: null}` per strand on top of
       the live ones: 18 live and 18 null after two renders, unbounded in
       principle. applyRotation() skips them, so it grew rather than broke, which
       is why the guard belongs here and not on the read. */
    const sign = a.dir > 0 ? -1 : 1;
    const comp = a.comp != null ? a.comp : 0;
    const track = (el) => { if (el && this._chainEls) this._chainEls.push({ el: el, sign: sign, comp: comp }); };
    const run = { willChange: 'stroke-dashoffset' };
    const pitchDash = (on) => on.toFixed(2) + ' ' + (PITCH - on).toFixed(2);
    if (b.belt === 'belt') {
      /* Toothed timing belt: one moulded tooth per gear tooth space. */
      return h('g', { key: key },
        h('path', { d: dPath, fill: 'none', stroke: 'rgba(8,16,20,.24)', strokeWidth: 13, transform: 'translate(1,2.5)' }),
        h('path', { d: dPath, fill: 'none', stroke: '#3A4046', strokeWidth: 7, transform: 'translate(0,-3.4)' }),
        h('path', { ref: track, d: dPath, fill: 'none', stroke: '#22272B', strokeWidth: 12, strokeDasharray: pitchDash(PITCH * 0.52), style: run }),
        h('path', { d: dPath, fill: 'none', stroke: 'rgba(255,255,255,.18)', strokeWidth: 1.4, transform: 'translate(0,-6)' })
      );
    }
    /* Roller chain: plate links between rollers seated in the tooth spaces. */
    return h('g', { key: key },
      h('path', { d: dPath, fill: 'none', stroke: 'rgba(8,16,20,.22)', strokeWidth: 12, transform: 'translate(1,2.5)' }),
      h('path', { ref: track, d: dPath, fill: 'none', stroke: '#79838A', strokeWidth: 11, strokeDasharray: pitchDash(PITCH * 0.78), strokeLinecap: 'round', style: run }),
      h('path', { ref: track, d: dPath, fill: 'none', stroke: '#4E575D', strokeWidth: 11, strokeDasharray: pitchDash(PITCH * 0.34), strokeLinecap: 'round', style: run }),
      h('path', { ref: track, d: dPath, fill: 'none', stroke: '#E6EBED', strokeWidth: 3.4, strokeDasharray: pitchDash(3.4), strokeLinecap: 'round', style: run })
    );
  }

  /* WHERE THE PLATE SITS, AND THEREFORE WHICH SIDE THE DATUM IS SCRIBED ON.

     THE MARK MAY NOT LEAVE THE PAGE. datumRuns() already says so in as many
     words -- "off the page is invisible, and invisible is the one thing this
     mark may not be" -- and then nothing enforced it. The plate is placed after
     fitStage(), so it is outside all three limbs of the fit: WHEEL_CROSS_MAX
     bounds a wheel and CROSS_BLEED bounds the band, and both of them
     deliberately let the machine bleed past the cross axis, which is exactly the
     edge the mark then falls over. Measured unseeded, the shipped page put
     Harper's plate wholly below the fold on 2 of 20 loads at 1440x900 and off
     the left edge on 1 of 20 at 390x844 -- and the seeded pixel gate cannot see
     it, because it is one deal out of the many the page draws.

     IT IS NOT FOLDED INTO THE FIT, and that is a choice. Shrinking the whole
     machine so a placard fits inverts the composition: the train is the subject
     and the mark references it, so the mark is what moves. Nor is the plate
     simply clamped to the edge -- a plate off its own line is a caption, and the
     line is the reference.

     SO IT SPENDS THE TWO FREEDOMS A SCRIBED DATUM ACTUALLY HAS, in order:
       1. WHICH SIDE. A reference line may be laid either side of the parts it
          references; datumRuns() hands both origins over, clear of every tooth
          by the same module of air.
       2. WHERE ALONG IT. The plate is stamped a stated distance in from ONE END
          of the mark, and sliding it further along the same line is a
          placement, not a compromise. WHICH end is not one of these freedoms and
          is not spent here: it is decided outright, by the wordmark, before
          either of them (GitHub #131).
     The natural side and the natural station win every tie, so a load that was
     already right is untouched -- and the smaller slide wins otherwise, so the
     mark moves as little as the page allows.

     NEITHER SIDE FITTING IS REPORTED, NOT HIDDEN. It cannot happen while the
     plate is smaller than the viewport and the chain is on stage, but "cannot
     happen" is what the crossing bridge was said to be too: the console is the
     only place a composition failure can announce itself.

     IT SEATS WITH A MARGIN, NOT FLUSH, and the margin is the plate's own corner
     radius. A flush seat was wrong rather than merely tight, because the
     rectangle this solves for is the GEOMETRIC one: the plate is stroked `HAIR`
     wide down its centre line, so half that stroke hangs outside the box the
     clamp bounds, and a sweep measuring the same rectangle could not see the
     overhang either.

     PLATE_H * 0.1 is the radius the plate's own corners are drawn at, so the
     margin is the one distance the shape already declares about itself rather
     than a number chosen to look safe. HAIR / 2 -- exactly the stroke overhang --
     is the floor, and takes over at very small render scales where the hairline
     is held at its one-rendered-pixel minimum and the radius has shrunk below
     it. Neither is picked; both are read off things already drawn.

     THE MARGIN IS NOT A SUBSTITUTE FOR RE-SEATING, and measurement said so. The
     stage re-centres on every pixel of a resize while a render only happens when
     something quantised moves, so a seat can go stale underneath its own margin.
     Walked one pixel at a time over 576 measurements at 390x844, that put the
     plate 1.32 px off the left edge with nothing to correct it. fitEscapes now
     re-renders when the stage has drifted further than this margin's real
     clearance -- see plateMargin(). The margin absorbs the stroke; the re-seat
     absorbs the movement. */
  /* THE SIZES OF THE MARK THAT ANYTHING OUTSIDE datumLayer NEEDS, at a given
     render scale. All of them are module multiples like everything else here. They
     are named here rather than left inline because fitEscapes has to know how far
     the stage may move before a seat it published stops being true, and a second
     copy of any of these derivations is the drift this repo has already paid for
     in #12, #15 and #51.

     `tick` IS THE STATION TICK'S LENGTH, and it is here rather than inline in
     datumLayer because datumClear() is the other reader of it (GitHub #141). It
     was `const MAJOR = MODULE * 1.2 * S` in datumLayer and nothing outside that
     method could see it, which is exactly how the bound below came to be paid in
     a quantity 20% short of the ink it was bounding.

     `reach` IS HOW FAR OUTBOARD OF THE SCRIBE THE MARK ACTUALLY DRAWS, which is
     what #76's figure bounds and what datumClear() pays out of it. It is a MAX
     over the three things this shape puts on the outboard side of its own line,
     so it stays true if any one of them is retuned rather than being true because
     one of them happens to be biggest today:

       tick     the station ticks, struck along `out * MAJOR`. The winner at every
                render scale the fit can produce, and the term that was missing.
       h / 2    the reserved rectangle's own outboard edge, for the treatments
                that centre that rectangle ON the line ('chip', 'etch',
                'etch-strike', 'etch-pocket', 'drop'). UNGROWN deliberately --
                DATUM_MARK_GROW belongs to the one treatment that offsets the
                rectangle clear of the line, where its outboard edge is nearer
                than this rather than further.
       hair / 2 the scribe's own stroke overhang. Below the fit's range it is the
                only term left, since the other two vanish with the scale and this
                one is floored at one rendered pixel (#61).

     WHAT IS NOT IN IT is anything per-chain -- the offset an 'etch-mark' label is
     drawn at depends on that chain's own ink, and datumRuns() asks for this once
     for the whole stage because the standoff is a property of the render scale.
     The label is struck OPPOSITE the ticks (CL#166), so it stands inboard of the
     rule and reaches nothing outboard for this to bound; what clears it against
     the metal on that side is plateSeat()'s own search, not this figure. */
  plateMetrics(s) {
    const h = MODULE * 2 * s, hair = Math.max(1, MODULE * 0.13 * s);
    const tick = MODULE * 1.2 * s;
    return { h: h, hair: hair, tick: tick,
      reach: Math.max(tick, h / 2, hair / 2) };
  }

  /* THE MARGIN THE PLATE IS SEATED WITH, and how much of it is real clearance.
     `pad` is the plate's own corner radius, floored at half a hairline; `slack`
     is what is left after the stroke's own overhang is paid for, which is the
     distance the stage may drift underneath a seat before it clips. */
  plateMargin(s) {
    const m = this.plateMetrics(s);
    const pad = Math.max(m.h * 0.1, m.hair / 2);
    return { pad: pad, slack: pad - m.hair / 2 };
  }

  /* THE AIR BETWEEN A CHAIN'S EXTREME BORDER AND ITS SCRIBED LINE, in solve
     units, bounded by the owner's stated figure (#76):

       "put the datum straight along the side such that the top of the label box
        is no more than 20px outside the extreme border of the side"

     WHAT IS BOUNDED IS THE MARK'S OUTERMOST INK, NOT THE LINE, because that edge
     is the thing the eye measures the gap to -- the mark reaches further out than
     the scribe does. Pay that reach out of PLATE_TOP_CLEAR first and what is left
     is the air the line may stand off in.

     AND THE REACH IS plateMetrics().reach, WHICH IS NOT THE PLATE'S HALF-HEIGHT
     (GitHub #141). This paid `plateMetrics(S).h / 2` for the whole life of the
     figure, on the reading that the plate straddles the line and so its own
     outboard edge is the outermost thing on that side. THE STATION TICKS WERE
     ALWAYS LONGER THAN THAT -- `MODULE * 1.2 * S` against `MODULE * S`, so 1.200x,
     measured 11.67px against the 9.73px paid at 1440x900 -- and they were declared
     inline in datumLayer where nothing here could see them. So the bound was
     honoured against a box while ink stood 20% further out than the box did, in
     every label treatment this page has ever shipped, chip included. #139's
     'etch-mark' did not cause that and does not change it: the name is struck
     OPPOSITE the ticks (CL#166), so it stands inboard of the rule and puts no ink
     on this side at all. The 33-39px outer edge #141 was filed about was CL#164's
     one-consistent-side geometry, which CL#166 replaced.

     ONE HOME, NOT A SECOND FIGURE. `reach` is derived in plateMetrics() from the
     shape's own three outboard terms and is read by the drawing as well as by this
     bound, so datumLayer's `MAJOR` and this payment cannot come to disagree. A
     constant here would have been a number chosen to match the ticks and nothing
     in the file would have said so.

     THE CONVERSION IS DONE ONCE, HONESTLY, AND IN THE RIGHT DIRECTION. Both
     candidates are compared in RENDERED PIXELS, which is the only space the
     owner's figure means anything in, and the winner is divided back into solve
     units because that is what datumRuns() places wheels and lines in. The
     preferred air is still one module -- the spacing every other clearance on
     this page is stated in -- so at a fit that leaves room for it nothing moves;
     it is only where the render scale has grown the module past the figure that
     the bound takes over.

     FLOORED AT ZERO rather than at some minimum gap, and that is a statement:
     zero puts the scribe tangent to the extreme tip circle, which is the closest
     a line can be laid without crossing the teeth it references. "Never inside
     the teeth" is the rule the max in datumRuns() already exists to keep, and
     this is the same rule stated as a floor.

     AND THE FLOOR IS REACHED IN PRACTICE, on a wide desktop. The ticks are 1.2
     modules long, so past a render scale of 20 / (MODULE * 1.2) -- about 2.38 --
     the reach alone has spent the whole figure: measured at 3440x1440 the fit
     deals about 3.4, and NO non-negative air satisfies 20px there. The bound
     cannot be met, so what it does instead is get as close as the geometry allows
     and the scribe grazes the deepest tooth tip. That is a real change of look on
     an ultrawide, taken deliberately: the figure is a bound on the mark's distance
     from the machine, and honouring it as closely as the mark's own reach permits
     is nearer to what it asks for than ignoring it at exactly the scales it binds
     hardest.

     WHICH SCALES MOVED WHEN THE REACH WAS CORRECTED, measured rather than
     projected. The bound takes over from the module of air at 20 / (MODULE * 2.2),
     about 1.299, where before it waited until 20 / (MODULE * 2) = 1.429. So a
     390x844 phone at --gsfit 0.824 is untouched -- the module of air was never the
     loser there -- and a 1440x900 desk at 1.396 moves the scribe 1.41px toward the
     teeth, from a module of air to 8.32px of it. Above 2.38 nothing moves either,
     because the air was already floored at zero. The change is confined to the
     band between those two crossovers, which is where a desk sits and a phone does
     not. */
  datumClear(S) {
    const air = Math.min(MODULE * S, PLATE_TOP_CLEAR - this.plateMetrics(S).reach);
    return Math.max(0, air) / S;
  }

  /* WHERE A LINE THROUGH (px, py) ALONG (dx, dy) ENTERS AND LEAVES A BOX, by slab
     clipping. An axis the line runs very nearly parallel to does not bound it at
     all, and taking that axis' crossing anyway is how a datum a fraction of a
     degree off horizontal ended up thirty-six thousand pixels long.

     ONE HOME, because the seat and the drawing now have to agree about where the
     mark starts (#95): the plate is stamped a stated distance in from that
     point, so a second copy of this arithmetic is a plate standing a little way
     off the end of its own line. */
  slabClip(px, py, dx, dy, box) {
    let lo = -Infinity, hi = Infinity;
    [[px, dx, box.x0, box.x1], [py, dy, box.y0, box.y1]].forEach(s => {
      if (Math.abs(s[1]) < 1e-6) return;
      const a = (s[2] - s[0]) / s[1], b = (s[3] - s[0]) / s[1];
      lo = Math.max(lo, Math.min(a, b));
      hi = Math.min(hi, Math.max(a, b));
    });
    return [isFinite(lo) ? lo : 0, isFinite(hi) ? hi : 0];
  }

  /* THE AIR BETWEEN A PLATE SEATED AT `at` AND THE NEAREST DRAWN TOOTH, in
     rendered pixels, negative where a wheel laps over the placard (GitHub
     #88, CL#108, re-landed against the current mesh/ghost/flywheel code).

     THE PLATE IS A ROTATED RECTANGLE AND A WHEEL IS A CIRCLE, so the distance
     is exact rather than sampled: resolve the wheel's centre onto the
     plate's own two axes -- the run and its normal, which the seat already
     carries -- and what is left outside the half-extents on each is the
     corner-to-centre offset. `Math.hypot` of the two closes it, and the tip
     radius comes off last. A centre inside the rectangle gives zero on both
     axes and hands back minus the radius, which is the right answer for a
     wheel sitting on top of the mark.

     THE TIP RADIUS, NOT THE PITCH RADIUS, for the same reason datumRuns()
     stands the line off `g.ro`: the gap a viewer sees is to the teeth, not
     to the circle they are cut on -- `metal`'s own `.r` is already `g.ro * S`
     for exactly this reason (see its construction in render()). */
  plateAir(O, at, r, pw, ph, metal) {
    const cx = O.ox + r.ux * at, cy = O.oy + r.uy * at;
    let air = Infinity;
    for (let i = 0; i < metal.length; i++) {
      const m = metal[i];
      const along = Math.abs((m.x - cx) * r.ux + (m.y - cy) * r.uy) - pw / 2;
      const across = Math.abs((m.x - cx) * r.nx + (m.y - cy) * r.ny) - ph / 2;
      const d = Math.hypot(Math.max(0, along), Math.max(0, across)) - m.r;
      if (d < air) air = d;
    }
    return air;
  }

  /* THE `at` VALUES ALONG ONE SIDE'S RUN WHERE THE PLATE WOULD OVERLAP SOME
     WHEEL, SOLVED EXACTLY (GitHub #88/#109/#110, follow-up to CL#108's
     re-landing). CL#108 tried exactly one position per side -- clamped
     straight from where the mark starts -- and fell back to whichever side
     overlapped LESS when both did, which is what let a background tooth cut
     across "Harper" at #109's own crowded viewport: neither of the two fixed
     points it tried was ever clear, and nothing else was tried.

     THE ACROSS-AXIS DISTANCE TO A WHEEL DOES NOT DEPEND ON `at`, because `u`
     and `n` are perpendicular unit vectors: sliding the plate along the run
     moves it parallel to the wheel, never closer to or further from its own
     line across the run. That collapses "which positions does this wheel
     block" from a 2D search to exact 1D interval algebra -- solve
     `hypot(along, across) = air + wheel radius` for `along` with `across`
     fixed, and the blocked band is `|D - at| <= alongMax + pw/2` around the
     wheel's own projected position `D`. Exact, not sampled -- the same
     preference this file states everywhere else a search could otherwise
     stand in for algebra. */
  plateExcluded(O, r, pw, ph, metal, air) {
    const out = [];
    for (let i = 0; i < metal.length; i++) {
      const m = metal[i];
      const dx = m.x - O.ox, dy = m.y - O.oy;
      const D = dx * r.ux + dy * r.uy;
      const across = Math.max(0, Math.abs(dx * r.nx + dy * r.ny) - ph / 2);
      const R = air + m.r;
      if (across >= R) continue;   /* already clear on the across axis alone */
      const alongMax = Math.sqrt(Math.max(0, R * R - across * across));
      const half = alongMax + pw / 2;
      out.push([D - half, D + half]);
    }
    out.sort((a, b) => a[0] - b[0]);
    const merged = [];
    out.forEach(iv => {
      const last = merged[merged.length - 1];
      if (last && iv[0] <= last[1]) last[1] = Math.max(last[1], iv[1]);
      else merged.push(iv.slice());
    });
    return merged;
  }

  /* THE POINT CLOSEST TO `want`, WITHIN [lo, hi], THAT NO EXCLUDED INTERVAL
     COVERS -- or null if the whole span is blocked. `want` is clamped into
     the window first, exactly as the un-searched version always did, so a
     clean want stays exactly where it always seated. */
  plateNearestClean(want, lo, hi, excluded) {
    const w = Math.max(lo, Math.min(hi, want));
    let inside = null;
    for (let i = 0; i < excluded.length; i++) {
      if (w >= excluded[i][0] && w <= excluded[i][1]) { inside = excluded[i]; break; }
    }
    if (!inside) return w;
    const down = inside[0] - 1e-6, up = inside[1] + 1e-6;
    const downOk = down >= lo, upOk = up <= hi;
    if (!downOk && !upOk) return null;
    if (!downOk) return up;
    if (!upOk) return down;
    return (w - down) <= (up - w) ? down : up;
  }

  plateSeat(r, S, pw, ph, past, box, metal) {
    const nat = { ox: r.o.x * S, oy: r.o.y * S };
    const vp = this._vpBox;
    /* WHICH END OF THE MARK THE PLATE IS STAMPED AT (GitHub #131). Charles asked
       for the plate "on the right (landscape) and top (portrait) -- this should
       help with spacing when near 'wozi.com' badge", and those two halves are one
       rule: the wordmark is fixed furniture pinned to a corner of the viewport,
       so the plate is stamped at whichever end of the mark stands FURTHEST FROM
       IT. Right-in-landscape and top-in-portrait then fall out of the geometry
       instead of being written down -- the mark runs along the stage's travel
       axis, which is horizontal in landscape and vertical in portrait, and the
       brand is in the bottom-left corner of both.

       DERIVED FROM THE MEASURED WORDMARK, NOT FROM THE ORIENTATION, and that is
       the #67 lesson taken at face value. "High end in landscape, low end in
       portrait" is a handedness stated in screen terms over a direction that
       comes from _axisRot: it is a legal mirror image of itself, so every
       measurement taken ALONG the run passes either way and only a screenshot
       could tell. What is written instead is a screen-space dot product -- the
       viewport's centre minus the wordmark's, resolved onto the run -- so
       getting it the wrong way round would mean the sign of a measured distance
       being wrong, which nothing can quietly be.

       +1 SEATS FROM THE START OF THE MARK, measuring forward along the run; -1
       from its finish, measuring back. +1 is what shipped before this, and it is
       what stands in when there is no measured wordmark, for the same reason the
       natural side stands in for an unmeasured viewport below.

       THE LOW END WINS A TIE, so a brand centred on the run keeps the seat it
       already had rather than changing ends on the sign of rounding noise. */
    const brand = this._brandBox;
    let anchor = 1;
    if (vp && brand) {
      const away = ((vp.x0 + vp.x1) / 2 - (brand.x0 + brand.x1) / 2) * r.ux
                 + ((vp.y0 + vp.y1) / 2 - (brand.y0 + brand.y1) / 2) * r.uy;
      if (away > 0) anchor = -1;
    }
    /* WHICH END OF A SLAB CLIP THIS ANCHOR READS. Named once: the mark's own
       extent, the drawn area and the viewport are all clipped by the same
       function, and all three have to be asked about the same end of the run. */
    const END = anchor > 0 ? 0 : 1;
    /* THE PLATE'S NEAR EDGE IS WHAT THE FIGURE MEASURES TO, so half the plate's
       measured width is carried here: what the eye compares is the gap between
       that end of the mark and the metal, not the distance to a centre it
       cannot see. The figure is stepped INWARD from the end, so `anchor` turns it
       round with the end it is measured from -- one signed step rather than two
       copies of the same arithmetic pointing opposite ways. */
    const from = (edge) => edge + anchor * (PLATE_START_ALONG + pw / 2);
    /* WHERE THE MARK BEGINS -- or ENDS, at the far anchor -- along the line, in
       rendered pixels: the same arithmetic datumLayer draws the line with, and
       the referent that replaced the old wheel anchor (#95). The mark runs `past`
       beyond whichever reaches further out, the assembly or the drawn area it is
       clipped to, so this is the outermost drawn pixel of the line at that end
       and not merely the wheel nearest it. `d0` and `d1` are that pair of
       extents, and the run-out is signed with the anchor for the same reason the
       figure above is. */
    const edgeOf = (O) => {
      const cut = this.slabClip(O.ox, O.oy, r.ux, r.uy, box);
      return anchor > 0 ? Math.min(r.d0 * S, cut[END]) - past
                        : Math.max(r.d1 * S, cut[END]) + past;
    };
    /* WHICHEVER OF TWO STATIONS ALONG THE RUN IS FURTHER INBOARD of this anchor's
       end -- the later one at the start, the earlier one at the finish. What it
       is for is below, where the mark's own end and the frame's argue it out. */
    const inboard = (a, b) => anchor > 0 ? Math.max(a, b) : Math.min(a, b);
    /* Before the first fitEscapes() there is no measured viewport, and guessing
       one would be a second opinion about where the stage is. The natural side
       stands for that one frame; the fit runs out of componentDidUpdate, so the
       next one is measured. */
    if (!vp) return { ox: nat.ox, oy: nat.oy, at: from(edgeOf(nat)), side: 1 };
    /* The plate turns with its chain, so what has to fit inside the viewport is
       the axis-aligned box of a ROTATED rectangle -- half its width along the
       run plus half its height across it, resolved onto each screen axis. Both
       half-extents carry the margin, so it applies on every edge. */
    const pad = this.plateMargin(S).pad;
    const hx = Math.abs(r.ux) * pw / 2 + Math.abs(r.nx) * ph / 2 + pad;
    const hy = Math.abs(r.uy) * pw / 2 + Math.abs(r.ny) * ph / 2 + pad;
    /* The stations at which the WHOLE plate is on the page, by the same slab
       clip the line itself uses: an axis the run is parallel to does not bound
       it, and taking that axis' crossing anyway is what made a datum a fraction
       of a degree off horizontal thirty-six thousand pixels long. Here the
       parallel axis instead decides the interval outright -- either the run
       already sits inside that slab, or no station on it ever will. */
    const window_ = (O) => {
      let lo = -Infinity, hi = Infinity;
      [[O.ox, r.ux, vp.x0 + hx, vp.x1 - hx], [O.oy, r.uy, vp.y0 + hy, vp.y1 - hy]]
        .forEach(s => {
          if (s[2] > s[3]) { lo = Infinity; hi = -Infinity; return; }
          if (Math.abs(s[1]) < 1e-6) {
            if (s[0] < s[2] || s[0] > s[3]) { lo = Infinity; hi = -Infinity; }
            return;
          }
          const a = (s[2] - s[0]) / s[1], b = (s[3] - s[0]) / s[1];
          lo = Math.max(lo, Math.min(a, b));
          hi = Math.min(hi, Math.max(a, b));
        });
      return lo <= hi ? [lo, hi] : null;
    };
    const alt = { ox: r.alt.x * S, oy: r.alt.y * S, side: -1 };
    /* HOW MUCH AIR A SEAT HAS TO KEEP FROM THE METAL (GitHub #88, CL#108): the
       air the mark already stands off it. datumClear() is that distance --
       what is left of the owner's PLATE_TOP_CLEAR once the mark's own outboard
       reach is paid for -- so there is one home for "how close this
       mark comes to a tooth", whichever axis it is measured on. It answers in
       solve units because datumRuns() places lines in them; the seat is
       solved in rendered pixels, so it is multiplied straight back. */
    const air = this.datumClear(S) * S;
    /* WHERE THE RECTANGLE IS ACTUALLY DRAWN ACROSS THE RULE, WHICH IS NOT ALWAYS
       ON IT (GitHub #162, the inboard half of #141). 'etch-mark' strikes the name
       clear of the scribe, opposite the ticks, so the box this method reserves is
       stamped a signed distance along the normal from the line it was measured
       against -- measured at 1440x900, 14.27px of rectangle and about 9.0px of
       INK past the searched box's inboard edge. Searching a box centred on the
       line therefore answered truthfully about a box nobody draws, and it did so
       in the one direction that HAS metal: the label stands on the chain's side.
       That cost a guarantee rather than a picture -- the rule is already stood off
       the chain by PLATE_TOP_CLEAR and the name landed in that existing gap -- but
       a guarantee is what this search exists to give.

       IT ARRIVES ON THE RUN AND IS A FUNCTION OF THE SIDE, for two reasons that
       are both about ownership. The offset needs the label's MEASURED ink, which
       only datumLayer has, and it needs to know which way round the mark was laid
       -- which is what this method is being asked to decide. So the run carries
       the derivation and this asks it per candidate origin, once for the natural
       side and once for the mirrored one, before either is scored. One home: the
       number that moves the drawn stamp is the same call that moved the searched
       box.

       ABSENT, IT IS ZERO, WHICH IS EXACTLY THE OLD BEHAVIOUR. A treatment that
       centres its rectangle on the line supplies no offset and is searched as it
       always was, and so is the geometry suite's own hand-built run -- the same
       standing-in `_brandBox` does for a wordmark the harness never renders.

       ONLY THE ACROSS AXIS MOVES. The offset is along the normal, so projecting
       any wheel onto the run is unchanged by it and `plateExcluded`'s own D is the
       same number either way; what changes is the distance measured across, and
       the window that keeps the whole rectangle on the page. The SCRIBE is still
       drawn on the line, so everything that asks where the MARK begins or leaves
       the frame -- edgeOf(), and the viewport clip `want` is bounded by -- goes on
       reading the line's own origin. */
    const plateO = (O) => {
      const t = typeof r.markOffset === 'function' ? r.markOffset(O.side || 1) : 0;
      return { ox: O.ox + r.nx * t, oy: O.oy + r.ny * t };
    };
    /* WHICH OF TWO SEATS IS THE BETTER ONE. A seat that clears the metal beats
       one that does not, whatever it costs in slide -- a plate with a
       background wheel drawn across it is not a placement, it is the mark
       failing. Among seats that clear, the smaller slide wins and the
       comparison is strict, so the natural side keeps every tie exactly as it
       did before this rule existed; among seats that do not, the roomier one
       wins, because when the composition cannot be made clean the least
       crowded plate is the one to draw. */
    const beats = (c, b) => (c.clean !== b.clean ? c.clean
      : c.clean ? c.slide < b.slide : c.air > b.air);
    let best = null;
    /* `side` travels with the origin because the ticks are struck along the
       normal, and on the mirrored origin the normal points AT the wheels: a
       major tick is 1.2 modules and the line stands one module clear, so
       unflipped ticks cross the clearance and vanish under the chain's own
       teeth. A mirrored datum then reads inverted and short beside an
       unmirrored one -- and the seeded gate cannot see it, because the mirror
       only fires on the deals that seed does not produce. */
    [nat, alt].forEach(O => {
      /* The rectangle's own origin, offset across the rule by however far this
         side's label is struck off it. The window, the excluded bands and the
         air are all properties of the DRAWN box, so all three read this. */
      const P = plateO(O);
      const iv = window_(P);
      if (!iv) return;
      /* THE ANCHOR END OF THE MARK, OR OF AS MUCH OF IT AS THE PAGE SHOWS.
         The more inboard of the two wins, and that is the whole of the rule: the
         mark's own end decides while it can be seen, and the frame decides once
         it cannot. It reads the same end of both clips (`END`), so the rule is
         one rule and not a start-only reading with a far-end special case.

         ON THIS COMPOSITION THE FRAME ALMOST ALWAYS DECIDES, and it was measured
         before it was written. An escape run is grown until it is 120px past the
         edge of the viewport and the drawn area is sized to hold every run, so
         the start of the mark is off the page by construction: over five
         viewports from 390x844 to 5120x1440, the outermost wheel of the spine's
         run sat 134 to 281 rendered px outboard of the near edge on every one,
         and the line then runs further out still. A figure measured from a point
         no viewer can see could never once have been honoured -- which is the
         reason this does not simply anchor on `d0` as GitHub #87 proposed. The
         mark's
         own end is the bound under it, for the cases where the drawing does
         stop inside the frame: before the first fit there are no ghosts to widen
         the drawn area, and a chain may be dealt a run that leaves by one end
         only -- which is now either end, since the plate may be stamped at
         either (GitHub #131).

         AND THE PAGE IS THE ONLY REFERENT THAT ANSWERS GitHub #82. A chain with
         no
         escape run at this end stops there at its own last gear, so every
         reading that anchors
         on the machine seats that chain's plate within a wheel's radius of the
         one wheel it owns -- which is the complaint, restated at 25px. */
      const want = from(inboard(edgeOf(O), this.slabClip(O.ox, O.oy, r.ux, r.uy, vp)[END]));
      /* THE UNSEARCHED POSITION, AND WHAT IT COSTS: kept as the fallback for
         when no point in this window clears the metal at all, and as what
         `slide` is measured against either way -- the figure this file states
         is a preference for the mark's OWN position, not for wherever a
         search happens to land it. */
      const naiveAt = Math.max(iv[0], Math.min(iv[1], want));
      const excluded = this.plateExcluded(P, r, pw, ph, metal, air);
      const cleanAt = this.plateNearestClean(want, iv[0], iv[1], excluded);
      const at = cleanAt === null ? naiveAt : cleanAt;
      const slide = Math.abs(at - want);
      const gap = this.plateAir(P, at, r, pw, ph, metal);
      const cand = { ox: O.ox, oy: O.oy, at: at, slide: slide, side: O.side || 1,
        air: gap, clean: gap >= air };
      if (!best || beats(cand, best)) best = cand;
    });
    if (!best) {
      if (!this._plateWarned) this._plateWarned = {};
      if (!this._plateWarned[r.person]) {
        this._plateWarned[r.person] = true;
        console.warn('wozi: neither side of chain "' + r.person + '" has room for its '
          + 'datum plate — the mark is drawn where it falls');
      }
      return { ox: nat.ox, oy: nat.oy, at: from(edgeOf(nat)), side: 1 };
    }
    /* A CROWDED PLATE IS ANNOUNCED, NOT HIDDEN -- the same rule the crossing
       bridge and the chain-overlap pass already answer to. Both sides were
       measured against every wheel on the stage and neither cleared, so the
       roomier one is drawn and the console is the only place that says the
       composition fell short of what this rule asks for. Once per chain. */
    if (!best.clean) {
      if (!this._crowdWarned) this._crowdWarned = {};
      if (!this._crowdWarned[r.person]) {
        this._crowdWarned[r.person] = true;
        console.warn('wozi: chain "' + r.person + '" has no uncrowded seat for its datum '
          + 'plate — nearest wheel ' + best.air.toFixed(1) + 'px, wanted ' + air.toFixed(1)
          + 'px, both sides tried');
      }
    }
    return best;
  }

  /* THE DATUM MARK, DRAWN: one scribed line and one stamped plate per chain, the
     reference a fitter follows along a real machine.

     EVERY CHAIN'S MARK IS IN ONE LAYER, and that layer is the first thing the
     stage paints -- beneath the ghosts, beneath the cast shadows, beneath every
     wheel. Painting each mark immediately before its own chain is the
     arrangement the mock got wrong first: the following chain's ghost run then
     covered the previous chain's plate.

     EVERY SIZE IS A MODULE MULTIPLE times the render scale, so the mark grows
     and shrinks with the machine it references rather than being fixed furniture
     stuck on the front of it. The hairline is the one exception, and it is a
     rendered-pixel intent (#61): under a device-independent pixel the rasteriser
     turns a scribe into a grey wash instead of a line.

     `box` is the union of the ghost WHEELS, in rendered pixels -- not of the
     layer they live in, which is widened afterwards to hold this mark as well
     (#81). The line is run to
     the edge of it and a little past, which is what makes it leave the drawing
     the way a scribed datum runs past the parts it references -- derived from
     what is actually on stage rather than from a guessed length. */
  /* THE NAME AS IT IS STAMPED ON THE MARK, in the label's own rotated frame:
     the origin sits on the line, x runs along it and y across it. Which
     treatment is drawn is DATUM_LABEL's to say -- see its comment for what each
     one is, and for why the list is still open (GitHub #139).

     THE RELIEF IS TWO EXTRA COPIES OF THE SAME TEXT, never a filter, in every
     treatment but 'drop'. That is the vocabulary the rim engravings already
     speak: a cut copy raised by DATUM_ETCH_DEPTH and a lit copy dropped by it,
     with the ink copy between them, so the glyph reads as displaced material
     rather than as type laid over the page. #6 is why a filter is the exception
     here and not the rule -- nine of them re-rasterising per frame was the
     dominant frame cost of this page once already, and the plate not turning
     makes that cheaper, not free.

     THE CUT AND THE HIGHLIGHT ARE --edge AND --gloss, the page's own two
     surface-lighting tokens, and they are NOT lifted the way datumInk() lifts
     the ink. Both are already stated as rgba with an alpha of their own, so there
     is nothing opaque to lift; and what they carry is a RELATIVE cue about which
     way the surface falls, while the legibility is entirely the ink copy's job.
     One colour solve, in one place, for the one colour that has to be legible.

     THE DECORATIVE COPIES ARE aria-hidden. The name is the only thing telling a
     screen-reader user which chain this is, and three copies of it is three
     announcements of the same word: the relief is a surface, not a reading.

     THE HAIRLINE STROKE ON THE INK COPY is #36's lesson at the one size on this
     page where it bites hardest. A full letter has body to spare and barely
     moves; a stroke-only glyph has nothing BUT edge, so the same width buys it
     most of its opacity back -- and this is the smallest lettering the page sets,
     drawn inside the ghost layer's own dimming.

     THE KNOCKOUT HALO IS DERIVED, NOT CHOSEN. 'etch-strike' lets the rule run
     behind the name and has each glyph cut it out, so the halo has to clear the
     rule itself plus the relief standing either side of it: HAIR + 2 * depth,
     exactly, and nothing to re-measure when either of those moves. */
  /* HOW THE STAMP SETS ITS TYPE at a given size: where the baseline sits inside
     the mark, and how far the two relief copies stand off it. One home, because
     datumLayer() has to place the mark relative to the ink it is about to draw --
     and the mark's REACH across the rule is its ink PLUS the relief, since the cut
     copy is raised by exactly this depth. A second copy of either figure is the
     drift this repo has already paid for in #12, #15 and #51. */
  datumRelief(fs) {
    return { base: fs * 0.35, depth: Math.max(1, fs * DATUM_ETCH_DEPTH) };
  }

  datumStamp(label, font, track, pw, ph, fs, INK, HAIR) {
    const h = React.createElement;
    const depth = this.datumRelief(fs).depth;
    /* Offset by a share of the font size, not by `dominant-baseline`: WebKit puts
       `central` somewhere Blink and Gecko do not, which is what left the rim
       engraving off centre in Safari (#26). */
    const rel = this.datumRelief(fs);
    const base = rel.base;
    const type = (key, dy, fill, extra) => {
      const p = { key: key, x: 0, y: (base + dy).toFixed(2), textAnchor: 'middle',
        style: Object.assign({ fill: fill, font: font, letterSpacing: track.toFixed(2) + 'px' },
          extra || {}) };
      if (key !== 'ink') p['aria-hidden'] = 'true';
      return h('text', p, label);
    };
    const pocket = (stroke) => h('rect', { key: 'body',
      x: (-pw / 2).toFixed(2), y: (-ph / 2).toFixed(2),
      width: pw.toFixed(2), height: ph.toFixed(2), rx: (ph * 0.1).toFixed(2),
      style: stroke ? { fill: INK.plate, stroke: INK.line, strokeWidth: HAIR.toFixed(2) + 'px' }
                    : { fill: INK.plate } });
    const out = [];
    if (DATUM_LABEL === 'chip') return [pocket(true), type('ink', 0, INK.line)];
    /* 'etch-mark' draws NOTHING but the struck lettering: no body, no knockout and
       no break in the rule. Where it sits is datumLayer's to say -- it is a
       translation along the mark's normal, and putting it here would be a second
       opinion about a distance the layer derives from what is already drawn. */
    /* No border on the pocket: a recess is a change of level, and an outline is
       most of what made the chip read as a widget sitting on the page. */
    if (DATUM_LABEL === 'etch-pocket') out.push(pocket(false));
    if (DATUM_LABEL === 'etch-strike') out.push(type('knock', 0, 'var(--bg)',
      { stroke: 'var(--bg)', strokeWidth: (HAIR + 2 * depth).toFixed(2) + 'px',
        strokeLinejoin: 'round' }));
    if (DATUM_LABEL === 'drop') {
      /* Straight DOWN, never diagonal (#10). The blur is twice the offset so the
         shadow reads as air under an edge rather than as a second glyph. */
      out.push(type('ink', 0, INK.line, { filter: 'drop-shadow(0 ' + depth.toFixed(2)
        + 'px ' + (depth * 2).toFixed(2) + 'px var(--edge))' }));
      return out;
    }
    out.push(type('cut', -depth, 'var(--edge)'));
    out.push(type('lit', depth, 'var(--gloss)'));
    out.push(type('ink', 0, INK.line, { stroke: INK.line,
      strokeWidth: (fs * ENGRAVE_STROKE).toFixed(3) + 'px', strokeLinejoin: 'round' }));
    return out;
  }

  datumLayer(solved, S, box, metal) {
    const h = React.createElement;
    const runs = this.datumRuns(solved, this.state.ghosts, S);
    if (!runs.length) return null;
    /* Read off plateMetrics() rather than repeated here: fitEscapes needs the
       same numbers to know when a seat has gone stale, and one derivation cannot
       be in two places. */
    const MARK = this.plateMetrics(S);
    const HAIR = MARK.hair;
    /* Two concrete colours, not the tokens: the mark is drawn inside the ghost
       layer's opacity now, and datumInk() is where the alpha it lost is paid
       back as ink (#81). */
    const INK = this.datumInk();
    /* THE TICK LENGTH COMES OFF plateMetrics() NOW, NOT FROM A LITERAL HERE
       (GitHub #141). datumClear() has to pay this exact length out of
       PLATE_TOP_CLEAR -- it is the mark's outboard extreme -- and while it was
       written here as `MODULE * 1.2 * S` that method had nothing to read and paid
       the reserved box's half-height instead. PAST is deliberately NOT MARK.h even
       though the two are the same number: it is how far the scribe runs out past
       the end of what it references, which is a different fact that happens to
       have the same value. */
    const MAJOR = MARK.tick, PAST = MODULE * 2 * S;
    /* GROW REACHES BOTH DIMENSIONS OR NEITHER. It scales the type and the box the
       type is set inside by the same factor, so a grown mark is the same shape as
       an ungrown one rather than lettering crowding a fixed rectangle -- and it is
       1 in every treatment but 'etch-mark', which is what keeps the shipped chip
       byte-identical while the lever exists. MARK.h and MARK.reach stay UNSCALED
       and are what fitEscapes and datumClear() go on reading: those two ask about
       the plate's stroke overhang and about #76's bound, neither of which this
       lever is entitled to answer for them. That is not an omission in the bound
       (GitHub #141): growing this rectangle moves its OUTBOARD edge nearer the
       line, not further, because 'etch-mark' is also the treatment that offsets
       the rectangle inboard -- so the ticks stay the outboard extreme and the
       grown box never becomes it. */
    const GROW = DATUM_LABEL === 'etch-mark' ? DATUM_MARK_GROW : 1;
    const PLATE_H = MARK.h * GROW, PLATE_F = MODULE * 1.3 * S * GROW;
    /* A WINDOWS FACE IN THE STACK. ui-monospace covers Apple, Menlo is the older
       macOS name and DejaVu Sans Mono is what Linux ships -- and nothing here
       named anything a Windows machine has, so the generic `monospace` resolved
       to Courier New: a lighter, narrower face at the same size, on the one mark
       that carries the identity and is already the smallest lettering on the
       page. Consolas has shipped with Windows since Vista and Office 2007; the
       generic stays behind it. */
    const MONO = "ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace";
    const els = [];
    let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
    const mk = (x, y) => {
      if (x < bx0) bx0 = x;
      if (x > bx1) bx1 = x;
      if (y < by0) by0 = y;
      if (y > by1) by1 = y;
    };
    const seg = (key, ax, ay, zx, zy) => {
      mk(ax, ay); mk(zx, zy);
      els.push(h('line', { key: key, x1: ax.toFixed(2), y1: ay.toFixed(2),
        x2: zx.toFixed(2), y2: zy.toFixed(2),
        style: { stroke: INK.line, strokeWidth: HAIR.toFixed(2) + 'px' } }));
    };
    runs.forEach((r, ri) => {
      /* The plate is MEASURED before anything is placed, because its width is
         what decides which side of the assembly this whole mark is scribed on --
         see plateSeat(). The stamped metal itself is drawn last, under the rim
         engravings, but nothing about where the line goes can be settled until
         the thing it has to carry has been measured. */
      const label = r.plate;
      const font = '600 ' + PLATE_F.toFixed(2) + 'px ' + MONO;
      const track = PLATE_F * 0.09;
      const pw = this.textWidth(label, font) + track * Math.max(0, label.length - 1) + PLATE_H * 0.8;
      /* WHICH SIDE OF THE RULE AN 'etch-mark' NAME STANDS ON, AND HOW FAR OFF IT,
         DERIVED BEFORE THE SEAT IS SEARCHED (GitHub #162). This used to be
         computed after the seat, immediately above the stamp, and that ordering is
         the whole of what #162 was: plateSeat() reserved a rectangle centred on
         the line while the drawn one stood ~14.27px inboard of it, on the side
         that has metal, so the search's answer was true about a box nobody drew.
         It is a function of the candidate side rather than of the chosen one, so
         the seat can ask it about BOTH origins before it scores either -- which is
         what lets the search measure the box it is about to draw without knowing
         in advance which way round the mark will be laid.

         NOTHING ELSE MOVED. The offset the stamp is drawn at below is this same
         call, resolved once the side is known, so there is one derivation and not
         a searched copy and a drawn copy.

         THE RULE IS "OPPOSITE THE TICKS", PER CHAIN, and what it is FOR is one side
         for the whole stage at any chain count (GitHub #139). Charles: "one
         consistent side is the way to go as remember we need to support N# of
         chains." Worth stating exactly, because the two are not the same claim:
         nothing here consults another chain, so the stage reads as one side for as
         long as every chain's ticks point the same way -- which is what the seat
         normally produces, and what a chain seated on the MIRRORED origin does not.
         Nothing enforces it, and no gate photographs the disagreement.

         WHY A CONSISTENT SIDE AT ALL. Outboard-of-its-own-chain was the obvious
         reading and it does not scale: a chain's outboard direction mirrors with
         its own origin, so with two chains it reads as an arbitrary mirror --
         measured, one name left of its rule and the other right of its own, in
         portrait -- and with N chains labels scatter over both sides with no rule a
         reader can infer. CHAIN_ORDER already takes any number of chains, so the
         rule has to hold for N.

         THE SIDE IS COMPARED, NEVER WRITTEN DOWN. Both candidate sides are scored
         against the direction the ticks were struck in and the one facing away
         from them wins. Nothing here is a written sign: the ticks' own direction
         comes from a seat that already compared both origins. That is
         BRIDGE_BEARING's construction -- compare, never assert -- for the reason it
         exists there: a hard-coded handedness is a legal mirror image of itself, so
         it passes every measurement taken ALONG the mark and only a screenshot can
         tell. This file has now had to learn that three times.

         AND THE REFERENCE IS THE ASSEMBLY, NOT THE ORIGIN CORNER, WHICH WAS
         MEASURED RATHER THAN ASSUMED. Away from the low-x low-y corner -- exactly
         what BRIDGE_BEARING compares against -- is the same shape of rule and it
         was tried first. On this composition the datum is scribed on the side of
         its chain NEAREST that corner, so away-from-origin is systematically the
         side facing the MACHINE: every chain lost its clearance rather than some
         chains losing it, 17.4px on the spine at 1440x900, and the name sat over
         metal where the chip had cleared. Away from the assembly is one side just
         as strictly and keeps the standoff, so that is the reference.

         `r.n` IS ALREADY IN SCREEN SPACE -- datumRuns() builds it through the
         stage's own travel angle -- so nothing here needs a second opinion about
         _axisRot, and turning the stage turns the answer with it.

         WHAT THE CONSISTENCY COSTS is that the chosen side is no longer always the
         TICKS' side, so the STANDOFF is derived per chain from what is actually
         drawn there: past the tick tips where the two coincide, clear of the
         scribe's own half-width where they do not. Plus `pad` either way --
         plateMargin()'s figure, the plate's corner radius floored at half a
         hairline -- and plus the ink the name puts on the side facing the rule,
         because a centre is being placed and an edge has to clear. */
      const ink = this.textInk(label, font, PLATE_F);
      const rel = this.datumRelief(PLATE_F);
      const markOffset = (side) => {
        const tickDir = { x: side * r.nx, y: side * r.ny };
        const away = (s) => -(r.nx * tickDir.x + r.ny * tickDir.y) * s;
        const markSign = away(1) >= away(-1) ? 1 : -1;
        /* The mark's reach toward the rule: the ink on the side that faces it,
           plus the relief copy standing off that ink. */
        const nearInk = (markSign > 0 ? ink.ascent : ink.descent) + rel.depth;
        return DATUM_LABEL === 'etch-mark'
          ? markSign * (HAIR / 2 + DATUM_MARK_AIR * this.plateMargin(S).pad + nearInk)
            - rel.base
          : 0;
      };
      /* HANDED TO THE SEAT ON THE RUN, and that is the shape rather than a
         parameter for a reason worth stating: the geometry suite lifts plateSeat()
         out of this file by its exact declaration and runs it against runs of its
         own, so its argument list is part of the contract the suite reads. The run
         descriptor is where every other per-chain fact the seat needs already
         travels. */
      r.markOffset = markOffset;
      /* THE RUN-OUT AND THE DRAWN AREA ARE HANDED OVER rather than re-derived on
         the other side, because the seat measures from where the LINE starts and
         the line starts a run-out beyond the clip below (#95). Two copies of
         either would put the plate a little way off the end of its own mark. */
      const seat = this.plateSeat(r, S, pw, PLATE_H, PAST, box, metal);
      const ox = seat.ox, oy = seat.oy;
      /* OUTBOARD IS WHICHEVER WAY THE MARK WAS LAID. Every tick is struck along
         the normal, away from the assembly the line references -- and the
         mirrored origin reverses which way that is. */
      const out = seat.side;
      const at = (d, t) => ({ x: ox + r.ux * d + r.nx * t, y: oy + r.uy * d + r.ny * t });
      const edge = this.slabClip(ox, oy, r.ux, r.uy, box);
      const d0 = Math.min(r.d0 * S, edge[0]) - PAST;
      const d1 = Math.max(r.d1 * S, edge[1]) + PAST;
      const a = at(d0, 0), z = at(d1, 0);
      /* WHERE THE LETTERING BREAKS THE RULE, and only the treatments that need a
         break get one: 'chip' and 'etch-pocket' cover the line with a body, and
         'etch-strike' has each glyph knock it out, so those three draw one
         unbroken scribe exactly as it always was.

         THE GAP IS THE TYPE'S OWN WIDTH plus one of the plate's corner radii of
         air each side. `pw` is the measured type plus the plate's padding
         (PLATE_H * 0.8, added where it is measured above), so taking that padding
         back off is what leaves the ink; plateMargin()'s `pad` is the same
         distance the plate is already seated with. Both are distances the shape
         declares about itself -- there is no gap width chosen here to look right.

         AND THE BREAK ONLY HAPPENS IF IT LEAVES A LINE EITHER SIDE OF IT. A seat
         within the gap of an end of the mark would otherwise turn one scribe into
         one shorter scribe plus a stub, and the whole point of a datum is that it
         runs past the parts it references. */
      const brk = (DATUM_LABEL === 'etch' || DATUM_LABEL === 'drop')
        ? (pw - PLATE_H * 0.8) / 2 + this.plateMargin(S).pad : 0;
      if (brk > 0 && seat.at - brk > d0 && seat.at + brk < d1) {
        const b0 = at(seat.at - brk, 0), b1 = at(seat.at + brk, 0);
        seg('s' + ri + 'a', a.x, a.y, b0.x, b0.y);
        seg('s' + ri + 'b', b1.x, b1.y, z.x, z.y);
      } else {
        seg('s' + ri, a.x, a.y, z.x, z.y);
      }
      /* THE TICKS ARE NOT NUMBERED, and that was measured rather than assumed.
         A numeral set as a module multiple, like everything else here, renders
         at 11.4 CSS px on a 1440-wide display, 6.7 on a 390 phone and 4.4 on a
         320 one -- a five-fold spread, and at the small end a two-digit group is
         two grey blobs at any pixel ratio. Dropping them below a floor was the
         alternative, and there is no floor here to derive one from: the page's
         only stated lettering floor is MIN_ENGRAVE, which is scale-free and
         sits about four times below the numeral at every viewport, so it never
         fires. Anything that did fire would be a number picked to make one
         screenshot look right and re-measured the next time the fit rule moves.
         The tick IS the index -- the numbering belongs on the drawing, not on
