    && contrastAt(rgbOf(FLAT_INK), body, ENGRAVE_ALPHA) >= POOL_ENVELOPE[k].ink;
});

/* THE CLOSEST THIS PAGE HAS EVER PUT TWO MESHING WHEELS, in OKLab: the smallest
   distance among the pool pairs the 40-degree rule lets through. It is what
   #12's rule actually buys, expressed in the metric a single-colour family can
   be measured in, and it is the spacing a derived family AIMS for -- so a chain
   short enough to afford it is spaced exactly as widely as a pool-dealt one. */
const TONE_AIM = (function () {
  let aim = Infinity;
  for (let i = 0; i < WHEEL_POOL.length; i++) {
    for (let j = i + 1; j < WHEEL_POOL.length; j++) {
      if (hueGap(WHEEL_POOL[i].h, WHEEL_POOL[j].h) < MIN_HUE_SEP) continue;
      aim = Math.min(aim, deltaE(WHEEL_POOL[i].c, WHEEL_POOL[j].c));
    }
  }
  return isFinite(aim) ? aim : 0.1;
})();
/* THE FLOOR, and it is per seed rather than global: the distance between a
   wheel's body and its own raised face. That is the smallest tonal step this
   artwork already asks every viewer to see, on every wheel, in both themes --
   so two neighbours further apart than that are at least as distinguishable as
   a step the drawing already depends on. Below it the family has run out of
   room and says so. */
const faceStep = (hex) => Math.min(
  deltaE(flatTones(hex, true).body, flatTones(hex, true).face),
  deltaE(flatTones(hex, false).body, flatTones(hex, false).face));

/* ONE SEED, n WHEELS.

   The family walks a ramp through OKLCh centred on the seed. Lightness does
   most of the work and chroma follows it, because chroma is held at the seed's
   own FRACTION OF WHAT THE GAMUT ALLOWS at each lightness -- the same relative
   saturation all the way up, which is how a tint behaves and which cannot leave
   the gamut by construction. Hue moves a little, deliberately: a family with
   zero hue movement reads as machine-generated tints of one swatch, and the
   amount it may move is MIN_HUE_SEP/2 across the whole ramp -- half the angle at
   which this page already calls two hues different colours, so every member is
   unambiguously the same colour as every other with the same margin again in
   hand. The hue spread shrinks with the ramp, so a short chain that only needs
   a little of the band gets only a little of the hue.

   HOW WIDE THE RAMP IS is the one thing that is not a taste choice:

     band   the widest lightness interval around the seed where every colour is
            still inside POOL_ENVELOPE in both themes. Found by walking outward
            until it is not.
     path   the OKLab distance from one end of that band to the other.
     span   min(path, (n - 1) x TONE_AIM). A chain short enough to be spaced as
            widely as a pool deal IS spaced that widely and no wider, so it stays
            near the colour that was asked for; a longer one opens out until it
            is using the whole band and then stops, because past that the wheels
            stop being legible rather than start being clearer.

   So the step between neighbours is span/(n-1). Past some length the ramp cannot
   separate them any more and the console says so -- the chain is still drawn,
   because a chain that is absent is worse than one that is subtle, but it is
   never drawn while claiming the spacing held.

   WHERE THAT LENGTH IS, IS ASKED RATHER THAN PREDICTED (capacityOf, below).
   floor(path / faceStep) + 1 is the arithmetic and it is off by one on real
   seeds -- 10 for #B79CE8 against a family that measures 0.0190 at ten wheels
   with a floor of 0.0198 -- because the ramp is a curve through a gamut
   boundary, not a straight line, so its ends are further apart than its middle
   is dense. The formula is the right way to think about it and the wrong way to
   report it. */
function familyFor(seed, n) {
  const lab = oklabOf(rgbOf(seed));
  let L0 = lab[0];
  let C0 = Math.hypot(lab[1], lab[2]);
  const pale = C0 < POOL_CHROMA_MIN;
  if (pale) C0 = POOL_CHROMA_MIN;
  const h0 = (Math.atan2(lab[2], lab[1]) * OK_M + 360) % 360;
  /* The band is walked in code values rather than in some fraction of L: one
     step of 1/255 is the smallest move that can change a rendered pixel, so
     this finds the true edge of the legible interval and not a rounding of it. */
  const STEP = 1 / 255;
  /* HALF THE HUE THE RAMP MAY WANDER, and every legibility question below is
     asked at BOTH edges of it as well as in the middle. The band is otherwise
     walked at one hue and used at several: #17A05C sits exactly on the pool's
     luminance floor, and a rung ten degrees off its hue carries different
     chroma and therefore different light, so it fell out of an envelope its own
     seed defines. Testing the widest wander the ramp can ever ask for makes the
     band true for every ramp that fits inside it, and costs three checks. */
  const HUE_HALF = MIN_HUE_SEP / 4;
  const acrossHues = (f) => [-HUE_HALF, 0, HUE_HALF].every(d => f((h0 + d + 360) % 360));
  /* The seed's own chroma, carried as far up or down the ramp as the gamut
     allows. Used to FIND the anchor; the ramp proper uses the relative form
     below, which is what makes a tint behave like a tint. */
  const atAbs = (L, hue) => oklchHex(L, Math.min(C0, maxChroma(L, hue)), hue);
  /* A SEED CAN BE OUTSIDE THE ENVELOPE ITSELF, and then there is no band to walk
     -- #7E57C2 is a perfectly ordinary purple that lands darker than any wheel
     that ships, and every wheel of the chain came out the identical colour with
     nothing but the closest-pair warning to say why. The colour is not refused,
     because "pick another one" is a poor answer to a child who picked this one:
     the anchor is slid to the nearest lightness that IS legible, the family is
     built around THAT, and the console names both hexes so the change is a
     stated one rather than a silent one. */
  let moved = pale;
  if (!acrossHues(hue => bodyLegible(atAbs(L0, hue)))) {
    let best = null;
    for (let L = STEP; L < 1; L += STEP) {
      if (!acrossHues(hue => bodyLegible(atAbs(L, hue)))) continue;
      if (best === null || Math.abs(L - L0) < Math.abs(best - L0)) best = L;
    }
    if (best === null) return { seed: seed, colours: null, path: 0, floor: 0,
      worst: 0, span: 0, band: null, chroma: C0, moved: false, anchor: null };
    L0 = best;
    moved = true;
  }
  /* CHROMA IS HELD AT THE SEED'S FRACTION OF WHAT THE GAMUT ALLOWS, and the
     fraction is taken at the ANCHOR rather than at the colour as written. On a
     seed that did not have to move those are the same number. On one that did
     they are not, and taking it at the original is how a pale cream comes back
     as a saturated amber: near white the gamut is narrow, so a faint chroma is
     a LARGE fraction of it, and carrying that fraction down to a usable
     lightness multiplies it into something nobody asked for. */
  const cap = maxChroma(L0, h0);
  const frac = cap > 0 ? Math.min(1, C0 / cap) : 0;
  const at = (L, hue) => oklchHex(L, frac * maxChroma(L, hue), hue);
  let lo = L0, hi = L0;
  while (lo - STEP > 0 && acrossHues(hue => bodyLegible(at(lo - STEP, hue)))) lo -= STEP;
  while (hi + STEP < 1 && acrossHues(hue => bodyLegible(at(hi + STEP, hue)))) hi += STEP;
  const path = deltaE(at(lo, h0), at(hi, h0));
  /* Measured on the colour actually drawn rather than on the hex as written: if
     the seed had to slide, the family is made of the anchor's tones and it is
     the anchor's own body-to-face step a viewer is being asked to see. */
  const floor = faceStep(at(L0, h0));
  /* THE BAND IS WALKED AT THE SEED'S OWN HUE AND THE RAMP DOES NOT STAY THERE,
     so the two ends of a family can land outside a band that was measured
     inside it -- #F2C14E at three wheels put its top rung at 0.573 luminance
     against a pool ceiling of 0.566, because the hue it drifted to carries more
     chroma at that lightness and therefore more light. The band is a starting
     estimate; what has to be legible is the colours actually handed out, so
     they are the thing checked, and the ramp is drawn in until they are. One
     code value at a time, from both ends, because the failure is always at an
     extreme. */
  const ramp = (aL, bL, hueSpan) => {
    const out = [];
    for (let i = 0; i < n; i++) {
      const t = n > 1 ? i / (n - 1) : 0.5;
      out.push(at(aL + (bL - aL) * t, (h0 + hueSpan * (t - 0.5) + 360) % 360));
    }
    return out;
  };
  let span = n > 1 ? Math.min(path, (n - 1) * TONE_AIM) : 0;
  let colours = null;
  for (let guard = 0; guard < 256; guard++) {
    /* Centred on the seed, then slid whole if the band is lopsided -- sliding
       keeps the span, where clamping each end separately would silently shorten
       it and report a spacing the family does not have. */
    const frac2 = path > 0 ? span / path : 0;
    let a = L0 - (hi - lo) * frac2 / 2;
    let b = a + (hi - lo) * frac2;
    if (a < lo) { b += lo - a; a = lo; }
    if (b > hi) { a -= b - hi; b = hi; }
    a = Math.max(lo, a); b = Math.min(hi, b);
    colours = ramp(a, b, (MIN_HUE_SEP / 2) * frac2);
    if (colours.every(bodyLegible)) break;
    if (span <= 0) break;
    span = Math.max(0, span - deltaE(at(L0, h0), at(Math.min(1, L0 + STEP), h0)));
  }
  /* MEASURED, NOT ASSUMED. The wheels are handed out in a shuffled order, so
     what has to hold is the minimum over EVERY pair and not just over
     neighbours on the ramp -- and chroma follows a gamut boundary that is not
     monotonic, so the two are not the same statement. */
  let worst = Infinity;
  for (let i = 0; i < colours.length; i++) {
    for (let j = i + 1; j < colours.length; j++) {
      worst = Math.min(worst, deltaE(colours[i], colours[j]));
    }
  }
  return { seed: seed, colours: colours, band: [lo, hi], path: path, span: span,
    floor: floor, worst: isFinite(worst) ? worst : Infinity, chroma: C0,
    moved: moved, anchor: at(L0, h0) };
}
/* HOW MANY WHEELS THIS SEED CAN ACTUALLY HOLD, by building families until one
   stops clearing its own floor. Only ever called to write a warning, so the
   handful of extra ramps it costs are paid on a load that is already in
   trouble. The cap is a stop, not an answer: a stage that wanted more wheels
   than this ran out of long axis a very long time before it ran out of hues. */
function capacityOf(seed) {
  let n = 1;
  while (n < 64 && familyFor(seed, n + 1).worst >= familyFor(seed, n + 1).floor) n++;
  return n;
}

/* Who asked for one, and whether what they asked for can be used. `palette`
   takes any colour form the page can already read -- #rgb, #rrggbb, rgb() --
   because rgbOf() is the one parser here and a format it cannot read is a
   format that cannot be taken into OKLab at all. */
const PALETTE_SEED = (function () {
  const out = {};
  (CONF.PEOPLE || []).forEach(p => {
    if (p.palette == null) return;
    const rgb = rgbOf(p.palette);
    if (!rgb) {
      console.warn('wozi: ' + p.slug + ' asks for the palette ' + JSON.stringify(p.palette)
        + ', which is not a colour this page can read — give it #rgb, #rrggbb or '
        + 'rgb(). Dealing this chain from the pool instead.');
      return;
    }
    const lab = oklabOf(rgb);
    const c = Math.hypot(lab[1], lab[2]);
    if (c <= GHOST_CHROMA_MAX) {
      /* Not a taste call. The bridge idlers and the whole background train are
         drawn at or below this chroma, so a chain seeded here would read as
         structure rather than as somebody's -- and there is no hue to lift it
         by, because at chroma zero there is no hue at all. */
      console.warn('wozi: ' + p.slug + ' asks for ' + p.palette + ', which is '
        + c.toFixed(4) + ' of chroma — at or below the ' + GHOST_CHROMA_MAX.toFixed(4)
        + ' the background machinery is drawn at, so the chain would read as '
        + 'idlers rather than as a colour. Dealing this chain from the pool instead.');
      return;
    }
    out[p.slug] = hexOf(rgb);
  });
  return out;
})();

/* THE DEAL IS SIZED AND SCORED OVER THE WHEELS THAT ACTUALLY TAKE A COLOUR, and
   those are the LINKED ones. It used to be sized to TRAIN.length, which counts
   the bridge idlers -- and an idler's dealt colour is then thrown away two lines
   below, overpainted from GHOST_COLORS. Two consequences, both silent. The deal
   spent pool entries on wheels that never wear them, so the day the train grows
   past the pool it is the LINKS that run out first. And a chain head arriving
   over a bridge was hue-scored against its parent idler -- against a colour
   nobody ever draws -- so the one comparison the #12 rule exists to make was
   made against a phantom.

   THE INDEX IS THE DEAL SLOT, NOT THE TRAIN SLOT, throughout: `DEALT` is the
   train indices that take a colour, in train order, and `DEAL_SLOT` maps back. */
const DEALT = [];
TRAIN.forEach((t, i) => { if (t.role !== 'idler') DEALT.push(i); });
const DEAL_SLOT = {};
DEALT.forEach((i, k) => { DEAL_SLOT[i] = k; });

/* A CHAIN WITH A SEED IS NOT IN THE POOL DEAL AT ALL, and taking it out is what
   keeps both rules honest: dealColours() only ever sees wheels that vary by hue,
   so its 40-degree test is never asked a question it cannot answer, and the
   family only ever sees wheels of one chain. When nobody has a seed this is the
   identity mapping and the call below is the call that shipped. */
const POOL_SLOTS = [];
DEALT.forEach((i, k) => { if (!PALETTE_SEED[TRAIN[i].person]) POOL_SLOTS.push(k); });
const POOL_AT = {};
POOL_SLOTS.forEach((k, j) => { POOL_AT[k] = j; });
const WHEEL_DEAL = new Array(DEALT.length);
const POOL_DEAL = dealColours(POOL_SLOTS.length, (j) => {
  /* A CHAIN HEAD PAST A BRIDGE HAS NO COLOURED NEIGHBOUR, and saying so is the
     honest answer rather than walking up to the nearest one. It meshes with an
     idler, and an idler is a whole wheel of background palette standing between
     it and the last coloured thing on that side -- so there is nothing there to
     confuse it with, and scoring it against a wheel it does not touch would
     spend the 40-degree budget on a pair nobody can see together. */
  const p = TRAIN[DEALT[POOL_SLOTS[j]]].parent;
  const pk = p == null ? undefined : DEAL_SLOT[p];
  return pk === undefined || POOL_AT[pk] === undefined ? null : POOL_AT[pk];
});
POOL_SLOTS.forEach((k, j) => { WHEEL_DEAL[k] = POOL_DEAL[j]; });

/* EACH SEEDED CHAIN GETS ITS OWN FAMILY, sized to the wheels that chain actually
   has on this stage. The rungs are handed out in a shuffled order so the machine
   still differs between visits, which the ramp can afford because the guarantee
   measured above is over every PAIR rather than over neighbours on the ramp. */
Object.keys(PALETTE_SEED).forEach(slug => {
  const mine = [];
  DEALT.forEach((i, k) => { if (TRAIN[i].person === slug) mine.push(k); });
  if (!mine.length) return;   /* that chain is not on this stage */
  const fam = familyFor(PALETTE_SEED[slug], mine.length);
  const rungs = fam.colours.slice();
  for (let i = rungs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = rungs[i]; rungs[i] = rungs[j]; rungs[j] = t;
  }
  mine.forEach((k, j) => { WHEEL_DEAL[k] = rungs[j]; });
  /* WHAT THE SEED COULD AND COULD NOT DO, said out loud on every load that falls
     short -- the console is where this composition already reports the things it
     could not honour, and a family quietly drawing two wheels a viewer cannot
     tell apart is exactly the failure that looks fine in a screenshot. */
  /* ONE WARNING, FOR THE ONE THING THAT IS ACTUALLY WRONG. A seeded chain is
     nearly always spaced closer than TONE_AIM -- that is what asking for one
     colour MEANS, and saying so every load would be crying wolf about the
     feature working. What must never pass in silence is two wheels a viewer
     cannot tell apart. */
  if (fam.worst < fam.floor) {
    console.warn('wozi: ' + slug + '’s chain is longer than ' + fam.seed
      + ' can separate. ' + mine.length + ' wheels leave ' + fam.worst.toFixed(4)
      + ' of OKLab between the closest pair, and this artwork already asks a '
      + 'viewer to see ' + fam.floor.toFixed(4) + ' between a wheel’s body and '
      + 'its own raised face. The legible band around this colour holds '
      + capacityOf(fam.seed) + ' wheels — a lighter or more colourful seed buys '
      + 'a deeper one, and the pool deal has no such limit.');
  }
});
TRAIN.forEach((t, i) => {
  /* AN IDLER IS ANONYMOUS BY DESIGN LANGUAGE, and that is the whole reason a
     bridge is made of them rather than of an unowned coloured wheel: a coloured
     wheel with no badge and no engraving looks exactly like the blank-gear
     defect in #65. The background palette says "structure, not content" without
     anyone having to be told. */
  t.color = t.role === 'idler'
    ? GHOST_COLORS[i % GHOST_COLORS.length]
    : WHEEL_DEAL[DEAL_SLOT[i]];
});

/* Sibling services sit on neighbouring wheels of the train. */
const PAIR_SLOTS = CONF.PAIR_SLOTS || [];
const PAIRS = CONF.PAIRS || [];
const SINGLES = CONF.SINGLES || [];

/* Each hex is the brand's own published mark colour, cross-checked against the
   Simple Icons data set (which cites each vendor's brand page as its source).
   `mail` is not a brand — it is a generic envelope, so its colour is ours to
   choose and is picked to sit with the palette. LinkedIn is the one entry with
   no Simple Icons row to check against (they removed it on request), so #0A66C2
   is taken from LinkedIn's own brand site and is the least independently
   verified value here. */
/* The pill's lettering. Kept in one place so the measurement and the render
   cannot disagree about what is being drawn -- the opening width is a
   transition target, so a mismatch would clip the name.

   Each service names its OWN typeface first, so the wordmark is set in the
   brand's face for anyone who has it, and falls back through a close relative
   to the site's own Manrope for everyone else. This costs nothing: no webfont
   is fetched, nothing blocks paint, and the measurement adapts because it is
   handed the same stack the pill renders in.

   What it deliberately does NOT do is ship the real faces. Most of them --
   Instagram Sans, Meta's family, LinkedIn's Brandon Text -- are proprietary and
   not ours to serve, and eight webfonts on a page with no build step would cost
   more than the fidelity is worth. So this is partial by design: a nicety when
   the font happens to be installed, and never a regression when it is not. */
const PILL_STACK = CONF.PILL_STACK || {};
const pillFont = (slug) => {
  const own = PILL_STACK[slug];
  return "650 13px " + (own ? own + ", " : "") + "Manrope, system-ui, sans-serif";
};
const BRAND = CONF.BRAND || {};

/* Accent pairs: light value -> dark-mode counterpart.
   The stylesheet already lightens the default blue for dark mode, but syncVars
   writes the accent onto the root element as an inline style, which beats that
   rule — so any accent chosen by prop lost its dark-mode adaptation. Each one
   now carries its own, and syncVars picks per theme.
   'steel' is the machine's own metal, taken from the light --m4 / dark --m1
   tones, so the accent reads as part of the object rather than applied to it. */
const ACCENTS = CONF.ACCENTS || {};

/* LIGHT MODE IS FLAT (#choice, 2026-07-30): the authored colour as a solid
   body, a thin darker outline, plain dark lettering — a machinist's drawing.
   Dark mode keeps the modelled treatment. Charles's verdict after a full night
   of gradient tuning: the shading itself is what made light mode ugly, and dark
   was passable — so the disputed axis is deleted only where it is disputed. */
/* `soft` is set for the LIGHT page only, and it is putting back a lesson this
   file already learned and then lost. The comment above shades() records it from
   rewrites #13, #16, #19 and #20: one palette cannot serve both themes, because
   a wheel that sits 5-9:1 against the dark page sits barely 2:1 against the pale
   one. That correction lived in shades(). When both themes went flat, flatTones
   shipped theme-blind and quietly reverted to one-palette-serves-both.

   Measured, that is the whole of the "light mode looks oversaturated" complaint,
   and it is not oversaturation: the wheel pixels are byte-identical in both
   themes, and light-mode chroma is if anything a hair LOWER. What differs is who
   does the separating. In dark, luminance carries the wheel away from the page
   and hue reads as finish -- colour does 16-30% of the figure/ground work. In
   light the same hexes land at 1.38-2.79:1 and colour is forced to do 31-58% of
   it; #F2C14E is nearly equiluminant with the page at 1.38:1, so its boundary is
   drawn almost entirely by chroma. A boundary made of chroma at matched
   luminance is exactly what the eye reports as garish. Simultaneous contrast --
   the "brighter against white" effect -- accounts for only about 4% of it.

   So the fix moves separation work off chroma: pull 15% toward the colour's own
   luminance. Hues move under 2 degrees in OKLCH and WHEEL_POOL is untouched --
   the pool stays ground truth, and derivation stays where this file has always
   said it belongs.

   The 7% DARKENING that shipped alongside this is gone. It was the other half of
   the original proposal and it is what Charles then read as "so dark - they have
   like a dark tint": measured over the pool it dropped mean luminance from 0.377
   to 0.313, a 17% cut, which is a lot to spend on a problem that was never about
   lightness. Desaturation alone lands at 0.367 -- indistinguishable from the
   original in value -- while still taking the chroma out, which was the actual
   complaint. Cheaper and more targeted: fix the thing that was wrong, leave the
   thing that was not. */
/* THE SMALLEST OPENING THAT STILL READS AS ONE, in PIXELS ON SCREEN.

   A cut has to hold a wall on each side and its own contour and still leave an
   interior, and whether it manages that is a question about what the eye
   receives -- so the figure is stated in px and converted per render by px(),
   exactly as hexcore's cell floor is. Stated in solve units it would be correct
   at ONE screen size and wrong everywhere else: `--gsfit` measures 1.396 at
   1440x900 but 0.842 on a phone in landscape and 1.461 at 5K, so a single
   solve-unit floor is a 1.7x spread in what it actually asks for. That is the
   trap the hexcore wall fell into (see px() in gearSvg) and this constant was
   sitting in it.

   THE FIGURE. Measured across four seeds and every wheel: sunburst never cuts
   below 7.41 solve units and reads at every colour; hexcore sits at 5.61;
   isogrid reached 3.34 and polariso 2.18, and those two are the ones that
   muddle. Those are desktop measurements, where S is 1.396 -- so the family
   that demonstrably works never goes under 7.41 x 1.396 = 10.3px, and that is
   the requirement. The retired 5.6 was neither: it was taken from hexcore, a
   family Charles had already complained about, and it was 7.8px on the desk and
   4.7px on a phone.

   Consequences worth knowing. A phone asks for MORE solve units to make the
   same 10.3px, so a small screen cuts FEWER, LARGER openings -- which is the
   intent, since fine detail is exactly what it cannot show. And per the lattice
   note in CLAUDE.md, the cell search counts DOWN from the dealt size, so a floor
   above where it starts skips the loop and the fallback takes over; the fallback
   is floored too. */
const MIN_CUT_PX = 10.3;

/* Rails, not the mechanism. Over the real range of `--gsfit` (0.842 to 1.461)
   the conversion lands between 7.05 and 12.23 solve units, so neither of these
   binds today -- they exist so an unforeseen scale cannot ask for an opening
   narrower than the one sunburst proved legible, or reserve half the blank for
   a single cut on some future display. */
const MIN_CUT_LO = 7.0;
const MIN_CUT_HI = 12.5;

/* THE WEIGHT EVERY EPICYCLIC CONTOUR IS DRAWN AT. The annulus, the planets and
   the sun are all the same kind of line -- ft.line at 1px -- and they should
   read as one drawing. They did not: the ring carried `strokeOpacity: 0.6` and
   the two teethPath calls simply OMITTED the attribute, so the planets and sun
   inherited the SVG default of 1 and came out heavier than the ring they run
   inside. Nobody chose that; one line had it and two did not. Stated once so a
   fourth reader cannot drift the same way. */
const EPI_LINE_OP = 0.6;

/* THE PLATE EVERY BRAND MARK IS STRUCK ON. Pale in BOTH themes on purpose:
   several marks are near-black (GitHub, Threads) and need a light field under
   them (#22), and that requirement does not change with the page. */
const BADGE_DISC = '#DFE2DE';
/* AND THE EDGE THAT SEPARATES IT FROM THE PAGE. One disc now serves both
   themes, which leaves it at 1.02:1 against a light page -- so where a badge
   or its expanded pill overlaps the page it has no boundary at all. Dark needs
   none: the disc is 12.25:1 there. The same element carries both states, so
   edging it covers the circle and the pill together. */

function flatTones(hex, soft) {
  const n = parseInt(hex.slice(1), 16);
  let c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  if (soft) {
    const y = 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2];
    c = c.map(v => Math.round(v + (y - v) * 0.15));

  const mix = (t, target) => '#' + c.map(v => Math.round(v + (target - v) * t).toString(16).padStart(2, '0')).join('');

    solved.gears.forEach(g => {
      const d = Math.hypot(px - g.cx * gs, py - g.cy * gs);
      if (d < g.ro * gs && d < best) { best = d; hit = g; }
    });
    if (!hit) return;
    e.preventDefault();
    const cx = rect.left + hit.cx * gs, cy = rect.top + hit.cy * gs;
    let p = { x: e.clientX, y: e.clientY };
    const ang = () => Math.atan2(p.y - cy, p.x - cx) * 180 / Math.PI;
    let last = ang(), lastT = performance.now(), moved = 0;
    this._dragging = true;
    /* ONLY THE MESH UNDER THE HAND (GitHub #122, CL#142). `_dragging` used to
       gate the whole integrator, so holding any wheel froze every chain on the
       page; and `_v = 0` zeroed the single shared flywheel, so flinging one
       chain flung them all. Both are now scoped to the component the hit wheel
       belongs to, which solve() has already worked out. */
    this._dragComp = hit.comp || 0;
    /* `_M` IS SEEDED HERE TOO, because a hand can be the first thing that ever
       addresses this component (GitHub #175): `+= dM` on an undefined angle is
       NaN. AND THE SYMPTOM IS NOT `rotate(NaN deg)`, which is what makes it worth
       a line of its own -- measured, `NaN || 0` is FALSY, so applyRotation()'s
       own fallback writes `rotate(0deg)` and the whole mesh snaps to angle zero,
       then restarts from zero on the next tick with its accumulated phase gone.
       A NaN that draws would at least be obvious; this reads as the component
       jumping. The integrator now seeds a component on first sight, so this only
       covers a grab that beats the first tick to it -- which is precisely the
       failure a component bound written down in startPhysics used to leave open. */
    if (this._M[this._dragComp] === undefined) this._M[this._dragComp] = 0;
    this._v[this._dragComp] = 0;
    stage.style.cursor = 'grabbing';

    const move = (ev) => {
      const pt = ev.touches ? ev.touches[0] : ev;
      p = { x: pt.clientX, y: pt.clientY };
      let a = ang(), delta = a - last;
      while (delta > 180) delta -= 360;
      while (delta < -180) delta += 360;
      last = a;
      const now = performance.now(), dt = Math.max(8, now - lastT);
      lastT = now;
      /* Convert the wheel you are holding into master (tooth) units. */
      const dM = delta * hit.teeth * hit.dir;
      moved += dM;
      this._M[this._dragComp] += dM;
      this._v[this._dragComp] = this._v[this._dragComp] * 0.6 + (dM / dt) * 0.4;
      this.applyRotation();
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      this._dragging = false;
      stage.style.cursor = 'grab';
      /* A flick sets the flywheel spinning; friction pulls it back to idle speed.
         Push against the train and it keeps running the new way. */
      const cap = this.driveCap();
      const flick = Math.max(-cap, Math.min(cap, this._v[this._dragComp]));
      if (Math.abs(moved) > 30) this._dirSign = moved < 0 ? -1 : 1;
      else if (Math.abs(flick) > 0.5) this._dirSign = flick < 0 ? -1 : 1;
      this._v[this._dragComp] = Math.abs(flick) > 0.15 ? flick : this._dirSign * this.idleRate();
      /* Released: this component rejoins the integrator on the next tick. */
      this._dragComp = null;
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  }

  /* HOW OFTEN THE MASTER ANGLE IS INTEGRATED, in ticks per second. One home,
     because two things now depend on it and they must not disagree: step()'s
     frame budget, and the speed ladder's aliasing ceiling — a control offering a
     stop the tick rate cannot show would be the two drifting apart. Divisors of
     the display refresh judder least, which is why 30 beats 24 on a 60Hz panel:
     60/30 = 2 whole frames, 60/24 = 2.5. */
  tickRate() { return this.props.frameRate ?? 30; }

  /* HOW HARD A HAND MAY DRIVE THE FLYWHEEL, in master-degrees per millisecond,
     and it is a property of the MACHINE rather than of the current setting
     (GitHub #121, CL#136).

     It was `max(8, idleRate())`. The 8 was historic — it stood while the idle
     rate was 0.343, twenty-three times slower, so it only ever caught a
     genuinely violent flick — and `max` was added so it could not become a
     BRAKE once the speed control reached 68.6 at its top stop. Both of those
     readings treat the cap as a loose bound on input, which it stopped being
     the moment CL#127 made the flywheel decelerate at a CONSTANT RATE: from
     then on the cap is the only thing deciding how long a throw can coast,
     because the coast is exactly (cap - idleRate()) / SPINDOWN_DECEL. At 1x
     that is 8 -> 0.343, which is 269ms — so no throw, however hard, outlasted a
     quarter of a second, and the train read as refusing to coast at all.
     Measured, not reasoned: a saturating flick settled in 283ms against 2115ms
     to 90% under the pre-CL#127 lag.

     The ladder top is the ceiling, and it is not a new number — a hand may wind
     the train up to the fastest the machine can be ASKED to run, and no
     further. Two things fall out that the historic 8 could not express. A
     saturating throw now takes SPINDOWN_RANGE_MS to come back, because it IS
     the ladder, travelled by hand instead of by the slider. And the coast
     becomes proportional to effort — a gentle throw still dies in ~150ms, a
     hard one runs for seconds — which is what constant deceleration MEANS and
     what the old fixed-tau lag could not do at any cap, since its settling time
     ignored the size of the drop.

     Not `max(...)` with anything: this is already the largest idleRate() the
     schema permits, so it is a ceiling at every stop by construction, and
     identical to the old behaviour at the top stop where the two agreed. */
  driveCap() { return Math.abs(this.rateAt(SPEED_CEIL)); }

  /* Does a stop sample the teeth below Nyquist? The ladder is allowed to run
     past this — the top stops exist to be ludicrous — but the control has to say
     so rather than hand over a setting that quietly breaks the illusion. */
  speedStrobes(v) { return v >= strobeSpeed(this.tickRate()); }

  /* THE MULTIPLIER IN FORCE, and the ONLY place the speed control reaches. One
     clock: every wheel transform comes off `this._M`, and `_M` is integrated in
     exactly one place, so scaling the rate the flywheel bleeds toward is the
     whole of a speed control. Nothing per wheel, nothing in CSS — a second
     animator drifts out of mesh within seconds (#3), and a control that made one
     would be that mistake for the third time.
     Whichever control set state.speed last -- the slider or the corner reset
     (#108) -- when one has, the shipped prop default otherwise. Not snapped to
     a stop: a prop override is entitled to any value its schema allows, and
     only the SLIDER needs to sit on a declared stop. */
  speedFactor() { return this.state.speed ?? this.props.speed ?? SPEED_FLOOR; }
  /* ONE HOME FOR "IS THIS #125 STYLE LAYER ON", read by both gearSvg() and
     the Machine Settings checkbox that toggles it (GitHub #125) -- state
     wins once Charles has actually flipped a control, exactly the fallback
     speedFactor() already models for speed. */
  layerOn(key) { return this.state[key] ?? this.props[key]; }

  /* Which stop the slider is standing on — the nearest declared one, so a value
     the stops no longer contain (a stale localStorage entry, a prop set between
     stops) still has a well-defined position instead of stranding the
     control at a setting it can never leave. */
  speedIndex() {
    const want = this.speedFactor();
    let best = 0;
    for (let i = 1; i < SPEED_STOPS.length; i++) {
      if (Math.abs(SPEED_STOPS[i] - want) < Math.abs(SPEED_STOPS[best] - want)) best = i;
    }
    return best;
  }

  /* THE MASTER RATE AT A GIVEN MULTIPLIER, in master-degrees per millisecond.
     One home for `7200 / BASE_MS` — the rate the train runs at 1x — because two
     callers now want it at two DIFFERENT multipliers: idleRate() at whatever
     the control is set to, and driveCap() at the ladder's top. Written out
     twice those would be two chances to update one of them. */
  rateAt(mult) { return (7200 / BASE_MS) * mult; }

  idleRate() { return this.rateAt(this.speedFactor()); }

  /* The hub cap is a magnet on the axle: click-hold-drag pulls it off against a
     rubber-band tether (tanh, so it strains harder the further out it gets) to
     reveal the works behind it; release and the spring in step() flies it home.
     stopPropagation keeps a cap drag from also grabbing the train, and a >6px
     move suppresses the link click on release -- a plain click still navigates,
     and keyboard activation never touches any of this. */
  badgeGrab(e, key) {
    if (e.button > 0) return;
    e.stopPropagation();
    /* THE SUPPRESSION FLAG IS ARMED HERE, WHICH IS ALSO WHERE IT IS DISARMED
       (#92). `up()` sets _badgeMoved so the click that follows a drag does not
       navigate, and clickGuard clears it as it swallows that click -- but
       clickGuard only runs when the browser fires `click` ON THE ANCHOR, and
       after a flick it does not. The cap tracks the pointer a frame behind, so
       let go while still moving and the release lands on empty stage; the click
       goes to the common ancestor of press and release instead, the guard never
       runs, and the flag outlives the gesture that set it. The next real click
       on that cap was then spent clearing it, and the link silently did nothing
       once.
       Clearing on the press needs no timer and no tuned window, because every
       genuine click begins with a primary pointerdown on this same anchor: by
       the time a click can be swallowed, this line has already run. It is
       unconditional -- a press anywhere retires a flag left by any cap, since
       only the gesture in progress may suppress anything. */
    this._badgeMoved = null;
    /* preventDefault here kills the browser's native link-drag, which otherwise
       hijacks the pointer stream -- on a real mouse it made the cap need a
       long-press before it would move at all. Synthesized test events never
       trigger native drag, which is why the harness missed it. Click activation
       is unaffected: click fires regardless of pointerdown's default. */
    e.preventDefault();
    const el = e.currentTarget;
    /* No pointer capture: window listeners, exactly like the train's own drag —
       capture on the anchor swallowed the move stream under some pointers. */
    const off = this._badgeOff[key] = this._badgeOff[key] || { x: 0, y: 0, vx: 0, vy: 0 };
    this._badgeEl[key] = el;
    /* Claim the drag HERE, on the press, not on the first move.
       The spring loop deletes any entry that is settled and not being dragged.
       A brand new entry is exactly that -- zero offset, zero velocity -- so the
       very next frame deleted it, and every pointermove after that mutated an
       object no longer in the map. Nothing was left to write a transform, so
       the cap never moved; on release the render put back a plain transform and
       it shrank, which is precisely what a real hand saw.
       A hand always lets at least one frame pass between pressing and moving.
       Synthesized input dispatches press and move in the same task, before any
       frame runs, so the entry survived and the harness passed a dead feature
       -- the third time that gap has hidden a pointer bug. tools/cap_drag.py
       now waits frames between the two, the way a person does. */
    this._badgeDragging = key;
    const sx = e.clientX, sy = e.clientY, ox0 = off.x, oy0 = off.y;
    let moved = false;
    const move = (ev) => {
      /* IT GOES WHERE YOU PUT IT. This used to run the offset through
         max * tanh(d / max) with max = 3.2 cap-widths, which is an asymptote:
         however hard you pulled, the cap stopped at about three of its own
         widths and sat there. Charles's question was the right one -- if it
         comes off the axle, it should come all the way off. The spring is what
         makes it a magnet, not a leash, and that is untouched: let go anywhere
         and it still flies home. */
      off.x = ev.clientX - sx + ox0;
      off.y = ev.clientY - sy + oy0;
      off.vx = 0; off.vy = 0;
      if (Math.hypot(ev.clientX - sx, ev.clientY - sy) > 6) moved = true;
      this._badgeDragging = key;
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      this._badgeDragging = null;
      if (moved) this._badgeMoved = key;
      /* Nothing else re-renders on release, so the pill would stay open until
         the next unrelated render. */
      this.forceUpdate();
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  }

  /* Whether the train should run right now. The stored override wins in either
     direction; otherwise follow prefers-reduced-motion. A person who chose
     motion gets motion, whatever their OS setting says -- user-initiated motion
     is the user's choice (#3), and the same control is a pause button for
     everyone else. */
  motionActive() {
    if (this.state.motion === 'run') return true;
    if (this.state.motion === 'rest') return false;
    return !(this._rmq && this._rmq.matches);
  }

  /* Stable per-load randomness, so a resize re-seeds the same background machinery. */
  rnd() {
    this._seed = (this._seed || 20260729) * 1664525 + 1013904223 & 0x7fffffff;
    return this._seed / 0x7fffffff;
  }

  /* THE AXES OF EACH CHAIN ON STAGE, in the same solve units the gears carry.
     There are TWO of them, and they answer two different questions:

       `deg`    THE CHAIN'S OWN AXIS, measured from that chain's own wheels --
                head to tail. This is where the machine actually goes, so it is
                what anything CONTINUING the machine follows: an escape run
                leaves along it, because a run that leaves along anything else
                reads as a second machine rather than as this one carrying on.
       `travel` THE PATH OF TRAVEL, which is the stage's own axis -- axisRot(),
                0 in landscape and 90 in portrait. This is the direction the eye
                reads the chain as running, and it is what anything MEASURING
                the machine is laid along: a scribed reference line is straight
                by definition, and straight means along the travel.

     THEY ARE NOT THE SAME NUMBER AND THAT IS THE POINT (#76). A dealt
     serpentine's first and last wheels rarely land level -- the bearings are
     drawn with alternating signs and only the band and the end-to-end drift are
     capped, never the end-to-end angle -- so `deg` carries whatever tilt this
     load happened to deal, up to a couple of degrees. An escape run wants
     exactly that: it continues the wheels it grew out of. A datum laid at it
     runs visibly askew to a chain the eye reads as travelling straight, and the
     mismatch is the whole of #76.

     BOTH ARE DERIVED HERE, TOGETHER, and neither consumer measures its own. Two
     consumers measuring the same axis two ways is how the escape runs and the
     bridge came to disagree in the first place (#67, twice); the fix for that
     was one place, and the fix for this is one place naming both directions
     rather than a second function quietly measuring the other one.

     A BRANCH HAS TWO DIRECTIONS, NOT ONE. The bridge runs perpendicular to the
     spine, because that is what sets the spacing between one chain and the next;
     the chain itself then runs parallel to the spine. Anything that continues a
     branch -- an escape run, a datum mark -- continues the CHAIN axis. Follow the
     bridge instead and it leaves by the short axis, which is the failure #10 was
     fixed for and #67 hit again from the other side.

     IDLERS ARE NOT CHAIN WHEELS. They belong to the bridge, not to the chain they
     feed, and including one drags the measured axis toward the bridge -- which is
     exactly the tilt this is here to avoid. Linked wheels only.

     Derived ONCE, here, and read by everything that needs it. */
  chainAxes(solved) {
    solved = solved || this.solve();
    const order = [], byPerson = {};
    solved.gears.forEach(g => {
      if (g.role !== 'link' || g.person == null) return;
      let c = byPerson[g.person];
      if (!c) { c = byPerson[g.person] = { person: g.person, wheels: [] }; order.push(c); }
      c.wheels.push(g);
    });
    if (!order.length) return order;
    const spine = byPerson[SPINE_SLUG] || order[0];
    order.forEach(c => {
      c.spine = c === spine;
      const a = c.wheels[0], b = c.wheels[c.wheels.length - 1];
      /* A ONE-WHEEL CHAIN HAS NO AXIS OF ITS OWN, and measuring one anyway is how
         the escape runs ended up crossing the SHORT axis in portrait (#67). With a
         single wheel `a` and `b` are the same object, so this is atan2(0, 0) --
         which returns 0 rather than failing, and 0 degrees is horizontal in every
         orientation. On a 390x844 phone that sent both runs off the 390px sides
         after one wheel each and left the whole 844px of height empty, which is
         the exact failure #10 fixed for multi-wheel trains: a run must continue
         the machine's axis, not leave by whichever edge is nearest.

         The stage's own axis is the honest fallback -- axisRot() is 90 in portrait
         and 0 in landscape, which IS the "chain follows the longest dimension"
         rule, stated once and reused here instead of re-derived. A chain with two
         or more wheels still measures its own axis, so nothing changes for it. */
      const dx = b.cx - a.cx, dy = b.cy - a.cy;
      c.deg = Math.hypot(dx, dy) < 1e-6
        ? (this._axisRot || 0)
        : Math.atan2(dy, dx) * 180 / Math.PI;
      /* THE SAME NUMBER THE ONE-WHEEL CHAIN ABOVE FALLS BACK TO, published for
         every chain rather than only for the one that has no axis of its own.
         It is stated once, here, so a consumer that wants the travel takes it
         from the chain it belongs to instead of reaching for axisRot() a second
         time -- and the 180-degree flip below deliberately does NOT touch it:
         the stage's axis is a direction the whole stage shares, and a plate
         rotated to agree with one chain's wheel order would be a placard set
         upside down beside its neighbour's. */
      c.travel = this._axisRot || 0;
      c.head = a;
      c.tail = b;
    });
    /* POINTED THE SAME WAY AS THE SPINE. Which end of a chain the deal calls
       first is arbitrary -- and for a one-wheel chain the fallback above is the
       stage axis, which knows nothing about which way the spine happens to run.
       Flipping the axis to agree with the spine is what lets a driven chain's one
       escape run leave on the same side as the spine's trailing run, rather than
       on whichever side its own wheel order fell out on. */
    order.forEach(c => {
      if (c.spine) return;
      if (Math.cos((c.deg - spine.deg) * Math.PI / 180) >= 0) return;
      c.deg += 180;
      const t = c.head; c.head = c.tail; c.tail = t;
    });
    return order;
  }

  /* THE CHAIN DATUM: where each chain's scribed reference line and stamped plate
     go, in solve units. This is the half with a right answer -- which wheels are
     stations, which end the plate rides, how far the mark reaches -- and
     datumLayer() below is the half that draws it. Split so the suite can run
     this against solves the shipped page never deals.

     IT TAKES ITS AXIS FROM chainAxes(), and must never measure one of its own. A
     one-wheel chain has no first-to-last vector: `head` and `tail` are the same
     wheel, atan2(0, 0) returns 0, and 0 degrees is horizontal in every
     orientation -- so a mark that derives its own direction collapses onto the
     short axis in portrait and the whole thing reads as a stray rule across the
     page. That is #67, and it is the second time the same zero-length vector has
     had to be caught; chainAxes() already answers it, for the escape runs and
     for this, in one place.

     AND THE AXIS IT TAKES IS THE TRAVEL, NOT THE CHAIN (#76). A scribed datum is
     straight -- that is what makes it a reference rather than a trace -- and
     straight, to the eye, means along the path the chain is read as travelling.
     The chain's MEASURED axis is a couple of degrees off that on most deals,
     because a serpentine's first and last wheels rarely land level, and a line
     laid at that measured angle reads as askew to the very thing it references.
     chainAxes() publishes both directions under their own names for exactly this
     reason; the escape runs continue `deg`, the mark is laid along `travel`. No
     second measurement lives here -- swapping which named axis is read is not
     forking the derivation, and there is still only one place either comes from.

     ONLY ON A SHARED STAGE. The datum exists to tell chains apart. A solo page
     has one chain, so a line with a name on it would be furniture identifying
     the only thing present -- and the mark is deliberately NOT colour, because a
     person's hue preference must not reserve that hue and two chains may
     legitimately come out looking alike. */
  datumRuns(solved, ghosts, S) {
    const axes = this.chainAxes(solved);
    /* AND ONLY ON A SHARED STAGE, which is also what makes the borrowed scale at
       the foot of this method safe: below two chains there is no datum at all,
       so a mark can never want a spine that is not there. */
    if (axes.length < 2) return [];
    const mine = {};
    (ghosts || []).forEach(g => {
      if (g.person == null) return;
      (mine[g.person] = mine[g.person] || []).push(g);
    });
    /* The air is asked for ONCE, outside the map: it is a property of the render
       scale, not of the chain, so every mark on the stage stands the same
       distance off the machine it references. */
    const clear = this.datumClear(S);
    const runs = axes.map(c => {
      const a = c.travel * Math.PI / 180;
      const ux = Math.cos(a), uy = Math.sin(a), nx = -uy, ny = ux;
      /* CLEAR OF EVERY TOOTH THE CHAIN CARRIES, not merely of the first one. The
         far edge of each wheel is measured along the normal, off the TIP radius
         rather than the pitch radius -- the line has to miss the teeth, not the
         circle they are cut on -- and the deepest of them is the EXTREME BORDER
         OF THIS SIDE, which is what the mark is stood off from. A serpentine
         wanders perpendicular to its own axis by most of a wheel, so an offset
         taken from the head alone puts the mark straight through whichever wheel
         the deal happened to drop lowest.

         THE STAND-OFF IS BOUNDED, NOT CHOSEN (#76). It used to be a flat module
         of air, which is a module of SOLVE units and therefore grows with the
         render scale -- at the fit a 1440-wide window deals, the plate's outer
         edge stood better than 20 rendered px off the extreme border, and the
         line reads as belonging to the page rather than to the chain. datumClear
         hands back whatever air is left once the mark's own outboard reach is paid
         for out of the owner's figure, so it is the module of air wherever that
         fits inside it and less where it does not.

         THE CHAIN'S GHOSTS ARE DELIBERATELY NOT IN THIS MAX, though they are in
         the extent below. A datum crossing a ghost is not a collision: the whole
         layer is painted beneath every wheel INCLUDING the ghosts, so the
         background wheel draws over the line, which is what rule 6 asks for.
         Folding them in costs two things that matter more. An escape run is a
         random walk -- up to seven wheels, each dealt within 20 degrees of the
         last -- so the outermost ghost, not the chain, would decide where the
         line sits: measured at six viewports the offset stops tracking the
         chain's own breadth and parks at ~22 modules on every one of them, and
         the mark stops being positioned by the thing it references. And it
         pushes the line 29-155 rendered px further outboard, on a stage where
         the outermost chain's plate has already been measured landing within a
         pixel or two of a portrait viewport's edge. Off the page is invisible,
         and invisible is the one thing this mark may not be. */
      const off = Math.max.apply(null, c.wheels.map(g =>
        (g.cx - c.head.cx) * nx + (g.cy - c.head.cy) * ny + g.ro)) + clear;
      const o = { x: c.head.cx + nx * off, y: c.head.cy + ny * off };
      /* THE SAME DATUM, SCRIBED ON THE OTHER SIDE. A reference line may be laid
         either side of the parts it references -- both stand off that side's own
         extreme border by the same air, both project the same stations, and
         neither is more correct than the other. Only ONE of them is on the page,
         though: the stage is allowed to bleed CROSS_BLEED past the cross axis,
         so a chain sitting near that edge puts its mark and its plate over the
         fold, and "off the page is invisible" is the one thing the note above
         says this mark may not be. datumLayer() picks between the two, because
         the choice needs the plate's MEASURED width and the viewport, and
         neither of those belongs in here. Mirroring is a translation along the
         normal only, so every station, every extent and the plate's own anchor
         are unchanged. */
      const offAlt = Math.min.apply(null, c.wheels.map(g =>
        (g.cx - c.head.cx) * nx + (g.cy - c.head.cy) * ny - g.ro)) - clear;
      const alt = { x: c.head.cx + nx * offAlt, y: c.head.cy + ny * offAlt };
      /* Every wheel is projected onto the line, which is what makes the STATIONS
         a station index rather than a ruler: a major tick cannot drift out of
         step with the wheel it references, because it IS that wheel. That holds
         for every chain on the stage without exception. */
      const at = (g) => (g.cx - o.x) * ux + (g.cy - o.y) * uy;
      /* A STATION IS A WHEEL YOU CAN REACH. Ghosts and idlers are spanned but
         never indexed -- they are machinery, not parts. chainAxes() has already
         dropped the idlers; this drops any link the active config seats no
         service on, which is the same test the badges are filtered by. */
      const seats = c.wheels
        .filter(g => g.slug && SITES[g.person] && SITES[g.person][g.slug])
        .map(g => ({ d: at(g), r: g.r }))
        .sort((p, q) => p.d - q.d);
      const stations = seats.map(s => s.d);
      const own = mine[c.person] || [];
      /* THE FULL BREADTH OF THE ASSEMBLY, background machinery included. The run
         off the trailing edge is part of the machine this line references, so
         the line goes where it goes. */
      let d0 = Infinity, d1 = -Infinity;
      c.wheels.concat(own).forEach(g => {
        const d = at(g);
        if (d < d0) d0 = d;
        if (d > d1) d1 = d;
      });
      /* NOTHING HERE SAYS WHERE THE PLATE GOES ANY MORE (#95, GitHub #87). It
         used to ride
         the last LEADING GHOST -- the background wheel immediately before the
         first real gear -- and fall back to the head wheel when there was no
         leading run to ride. The plate is now seated from the START OF THE MARK
         instead of from a wheel on it, which is a referent every chain has:
         `d0` above is that start, and plateSeat() is where the figure and the
         page are argued out. The fallback went with the rule, and GitHub #82
         with the
         fallback -- a driven chain has no leading run, so under the old rule its
         plate landed on its own first gear, and on a one-wheel chain that gear
         was the entire chain. */
      /* `deg` IS THE MARK'S OWN ANGLE, which is the travel and not the chain's
         measured axis -- the plate is stamped square to the line it rides, so
         the two cannot be allowed to disagree by the tilt of the deal. */
      return { person: c.person, plate: DATUM_PLATE[c.person] || c.person,
        deg: c.travel, ux: ux, uy: uy, nx: nx, ny: ny, o: o, alt: alt,
        stations: stations, d0: d0, d1: d1 };
    });
    return runs;
  }

  /* Background machinery: extra wheels seeded off each edge, meshed onto the visible
     train, dimmed and set behind it so they read as context rather than content. */
  fitEscapes() {
    const stage = this._stageRef.current;
    if (!stage) return;
    const solved = this.solve();
    const rect = stage.getBoundingClientRect();
    if (!rect.width) return;
    /* READ THE SCALE OFF THE STAGE, exactly as onGrab does, rather than taking
       the fit this pass computed. The runs are placed in screen space and stored
       in solve units, so the number that converts between them has to be the one
       the stage is ACTUALLY drawn at right now. Handing in the new target instead
       made the two disagree for one pass -- and since a different ghost set
       re-renders the stage, which changes the rect, which yields a different
       ghost set, the two never settled and the render loop never ended. */
    const gs = rect.width / solved.w;
    const vw = window.innerWidth, vh = window.innerHeight;
    /* WHAT THE PAGE CAN ACTUALLY SHOW, in the stage's own rendered pixels --
       which is the space every absolutely positioned layer inside the stage is
       drawn in, the datum included. Published from here rather than measured
       again downstream because this is the one place that already holds both
       halves of the conversion: the stage's rect and the viewport it sits in.
       It is also the one place that is guaranteed fresh -- fitStage() runs it on
       mount, on every resize and out of componentDidUpdate, which is exactly the
       set of moments the stage can have moved.

       The wheels do NOT read this. The fit deliberately lets the machine bleed
       past the cross axis (CROSS_BLEED), because a machine that continues past
       the frame is the composition. This is for the marks that may not. */
    this._vpBox = { x0: -rect.left, y0: -rect.top, x1: vw - rect.left, y1: vh - rect.top };
    /* AND WHERE THE WORDMARK IS, in that same space, because the datum plate is
       now stamped at whichever end of its mark is FURTHEST FROM IT (GitHub #131).
       Measured here for exactly the reason the viewport box is: this is the one
       place that already holds the stage's own rect, so the conversion happens
       once, and a second read downstream would be a second opinion about where
       the stage is.

       THE ELEMENT IS MEASURED, NOT THE CORNER IT IS PINNED TO. The wordmark is
       a clamp()ed font size plus that edge's safe-area inset, so how big it is
       and how far in it sits are known to CSS and to nothing else -- a corner
       restated here would be a constant that drifts the first time --offleft,
       --offbot or the type size moves, and the whole point of measuring is that
       moving the brand to another corner moves the plate to the other end by
       itself.

       Left undefined until the ref is attached, and plateSeat() then seats from
       the end it always used -- the same standing-in the natural side does for an
       unmeasured viewport. Both are measured together from here on, so the two
       fallbacks fire on the same single frame. */
    const col = this._colRef.current;
    if (col) {
      const cb = col.getBoundingClientRect();
      this._brandBox = { x0: cb.left - rect.left, y0: cb.top - rect.top,
        x1: cb.right - rect.left, y1: cb.bottom - rect.top };
    }
    /* AND A SEAT THAT HAS GONE STALE IS RE-SEATED. Publishing the box is not
       enough on its own: the datum plate is placed during render, and a render
       only happens when something QUANTISED moves -- the 1% render scale, the
       spread and tightness ratios, the idler count, or the escape-ghost key. A
       resize under all of those re-centres the stage without re-seating the
       plate, and a plate seated against a box that has since moved is a plate
       creeping toward the edge with nothing to stop it. Walked a pixel at a time
       it put the mark 1.32 px off the left edge at 390x844.

       MEASURED FROM THE BOX THE PLATE WAS LAST SEATED AGAINST, not from the last
       box this function measured. Comparing consecutive calls compares one step
       of a drag, which is a pixel at a time and under the threshold forever while
       the total runs away: walked down from 900px that let the mark slide 23px
       past the fold without ever tripping. `_vpSeated` is stamped in
       componentDidUpdate, at the one moment a render is known to have just
       happened, so what is measured here is the whole distance since the seat
       was computed.

       THE THRESHOLD IS THE MARGIN THE SEAT ALREADY CARRIES, asked of
       plateMargin() rather than restated -- drift within it is drift the plate
       was seated to absorb, and only drift past it can clip. So this costs a
       render exactly when one is needed, and the resize quantisation everything
       else depends on is left alone.

       ONLY ON A STAGE THAT HAS A MARK. One chain draws no datum at all, so a
       solo page keeps precisely the render schedule it had.

       It terminates: the render this asks for stamps a new `_vpSeated` from the
       box it drew against, and a render at the same fit does not move the stage,
       so the next pass measures a drift of zero. */
    const seated = this._vpSeated;
    if (seated && STAGE.people.length > 1) {
      const slack = this.plateMargin(gs).slack;
      const moved = Math.max(
        Math.abs(seated.x0 - this._vpBox.x0), Math.abs(seated.y0 - this._vpBox.y0),
        Math.abs(seated.x1 - this._vpBox.x1), Math.abs(seated.y1 - this._vpBox.y1));
      if (moved > slack) this.forceUpdate();
    }
    const ghosts = [];
    this._seed = 20260729;
    /* SEEDED WITH THE BRIDGES, so the crossing search that already refuses to lay
       one escape run across another refuses to lay one across a bridge too. They
       are the same kind of fault -- a line drawn through metal that is meant to be
       driving something -- and they were tested for separately only because
       `bridgeRuns` lived inside solve() and never came out. It does not fire on
       any shipped viewport: a branch's one run leaves the end its bridge does NOT
       arrive at. But that is an argument from the current composition, and the
       non-crossing rule is the thing the solver exists to enforce; a config whose
       bridge lands near a chain's trailing end would have crossed silently.

       Converted to screen space here, like every other segment in this list --
       solve units are what the stage is drawn from, and `gs` is the scale it is
       ACTUALLY drawn at right now (see above). */
    const taken = (solved.bridgeRuns || []).map(s => s.map(p => (
      { x: rect.left + p.cx * gs, y: rect.top + p.cy * gs })));
    /* Uses the module-level segCross (#57). This was a second copy, identical
       character-for-character including its inner helper, shadowing a perfectly
       good function three lines above where it is used -- exactly the drift
       hazard that has already bitten this repo twice. */
    /* The escape runs continue each chain's OWN AXIS rather than leaving by whichever
       screen edge happens to be nearest. Nearest-edge was measuring the wrong thing:
       on a wide, short viewport the closest edges are the top and bottom, so one run
       climbed off the top and the other dropped off the bottom — a horizontal train
       with a vertical tail at each end, which reads as an S rather than as a machine
       continuing past the frame (#10). Continuing the axis is what SESSION-LOG says
       these are for, and it fills a wide display instead of stranding the train in
       the middle of one.

       PER CHAIN, from chainAxes() -- not one axis across the whole array. First-to-
       last of solved.gears once spans the spine, the idlers and a branch, so its
       heading is the spine-to-branch DIAGONAL: the runs then leave along the
       bridge rather than along either chain, which is #10 all over again.

       THE SPINE GETS TWO RUNS, EVERY OTHER CHAIN GETS ONE, on the same side as the
       spine's trailing run. Asymmetric on purpose: the end a driven chain is
       missing its leading run at is the end its bridge arrives at, so the chain
       visibly receives its power there instead of trailing a second tail into the
       machinery that drives it. */
    /* EACH HOST CARRIES WHOSE CHAIN IT CONTINUES, and which end of it. The runs
       are that chain's own machinery, so the datum mark spans them with it
       (rule 1) and rides its plate on the last LEADING one (rule 3) -- neither
       is answerable from a wheel's position, because the two runs of the spine
       leave in opposite directions and a driven chain has only the trailing
       one. Recording it here is free; recovering it afterwards is not. */
    const axes = this.chainAxes(solved);
    const hosts = [];
    axes.forEach(c => {
      if (!c.spine) return;
      hosts.push({ g: c.head, deg: c.deg + 180, person: c.person, lead: true });
      hosts.push({ g: c.tail, deg: c.deg, person: c.person, lead: false });
    });
    axes.forEach(c => {
      if (c.spine) return;
      hosts.push({ g: c.tail, deg: c.deg, person: c.person, lead: false });
      /* A SELF-DRIVEN ROOT GETS ITS LEADING RUN TOO, and the rule above is why it
         did not. That rule withholds the leading run because "the end a driven
         chain is missing its leading run at is the end its BRIDGE arrives at" --
         a good argument, and one that only covers a chain something on stage
         drives. A root has no bridge arriving anywhere: its drive comes in on an
         origin run, which is structural and therefore capped at MAX_IDLERS, so
         its leading side stopped dead in open space while the spine's ran off
         the frame. Gating on `driven` rather than on `!spine` is the whole fix;
         a driven chain still gets exactly what it got before.

         HOSTED ON THE OUTERMOST ORIGIN IDLER, not on the lead gear, because the
         origin run already occupies that side -- starting at the lead gear would
         lay the escape ghosts straight over it. That idler is a wheel solve()
         has already placed, so this stays what an escape run is: decoration
         computed after the fit, adding nothing to TRAIN.

         AND "IS THIS CHAIN SELF-DRIVEN" IS ASKED AS "does it own an origin run",
         which is the same question and one this function can answer from the
         solve it already has. A driven chain's idlers carry `drive: 'bridge'`,
         so it finds no tip and keeps precisely the behaviour above. Reaching for
         DRIVE_FROM instead would couple the escape pass to the chain tree for a
         fact the wheels in front of it already state. */
      let tip = null, far = -1;
      solved.gears.forEach(g => {
        if (g.drive !== 'origin' || g.serves !== c.person) return;
        const d = Math.hypot(g.cx - c.head.cx, g.cy - c.head.cy);
        if (d > far) { far = d; tip = g; }
      });
      if (tip) hosts.push({ g: tip, deg: c.deg + 180, person: c.person, lead: true });
    });
    /* How far a heading travels before it leaves the viewport. */
    const reachAlong = (px, py, deg) => {
      const a = deg * Math.PI / 180, dx = Math.cos(a), dy = Math.sin(a);
      let t = Infinity;
      if (dx > 1e-6) t = Math.min(t, (vw - px) / dx);
      else if (dx < -1e-6) t = Math.min(t, -px / dx);
      if (dy > 1e-6) t = Math.min(t, (vh - py) / dy);
      else if (dy < -1e-6) t = Math.min(t, -py / dy);
      return Math.max(0, t === Infinity ? 0 : t);
    };
    hosts.forEach((host, ei) => {
      const g0 = host.g;
      const sx = rect.left + g0.cx * gs, sy = rect.top + g0.cy * gs;
      /* Each host already carries the way out: backwards along its chain's axis at
         the leading end, onwards at the trailing one. A small arc either side is
         searched only to dodge a run already placed — the axis itself is always
         tried first. */
      const want = host.deg;
      let e = null;
      for (let q = 0; q < ESCAPE_SEARCH_ARC.length; q++) {
        const ang = want + ESCAPE_SEARCH_ARC[q];
        const reach = reachAlong(sx, sy, ang);
        const oa = ang * Math.PI / 180;
        const seg = [{ x: sx, y: sy }, { x: sx + (reach + ESCAPE_CROSS_EXT_PX) * Math.cos(oa), y: sy + (reach + ESCAPE_CROSS_EXT_PX) * Math.sin(oa) }];
        if (!taken.some(t => segCross(seg[0], seg[1], t[0], t[1]))) { e = { ang: ang, reach: reach }; break; }
      }
      if (!e) return;
      const ea = e.ang * Math.PI / 180;
      taken.push([{ x: sx, y: sy }, { x: sx + (e.reach + ESCAPE_CROSS_EXT_PX) * Math.cos(ea), y: sy + (e.reach + ESCAPE_CROSS_EXT_PX) * Math.sin(ea) }]);
      if (e.reach < ESCAPE_MIN_REACH_PX) return;
      const span = e.reach / gs;
      let prev = { cx: g0.cx, cy: g0.cy, r: g0.r, teeth: g0.teeth, dir: g0.dir, phase: g0.phase };
      let reached = 0, k = 0;
      /* Keep adding wheels until the run is genuinely off the edge.

         THE BACKSTOP IS DERIVED, NOT CHOSEN (#80). It used to be `k < 7`, which was
         safe while a wheel's size tracked the long axis -- a wider window dealt
         bigger ghosts, so seven of them always got there. #85 gave a gear a standard
         size instead, and from that day the same seven wheels covered the same
         distance whatever the window was: at 5120x1440 the runs stopped 457-639px
         short of the edges on 8 loads out of 8. A bound sized against one rule
         silently became the thing deciding coverage under the next.

         So bound the ITERATIONS by the arithmetic instead: the shortest step this
         loop can take is two minimum wheels in mesh, foreshortened by the widest
         wobble it may deal, and the run needs `span + ESCAPE_RUN_MARGIN`. That cannot stop short
         -- it is an upper bound on how many wheels the distance can possibly need --
         while still refusing to spawn without limit on a pathological viewport.

         THE WIDEST OFF-AXIS STEP IS NOT THE WOBBLE ALONE, because each step also
         carries a steering correction back toward the axis (below). Both terms are
         bounded, and the bound is arithmetic rather than measurement:

         a step displaces the run laterally by `d * sin(correct + wobble)`, and
         since `sin(correct) = -off / d` by construction, the offset after a step is

             off' = off * (1 - cos w) + d * cos(correct) * sin w

         The coefficient on `off` is `1 - cos(ESCAPE_WOBBLE)`, which is well under
         1, so the offset contracts toward a fixed point of `d * tan(w)` rather
         than accumulating -- that contraction IS the fix, and it is also what
         makes this bound finite. The largest offset any step can be correcting is
         therefore the widest centre distance times `tan(w)`, and the largest
         correction is that offset over the SHORTEST centre distance. */
      const w = ESCAPE_WOBBLE * Math.PI / 180;
      const maxCorrect = Math.asin(Math.min(1, (TEETH_MAX / TEETH_MIN) * Math.tan(w)));
      const stepMin = MODULE * TEETH_MIN * Math.cos(maxCorrect + w);
      const kMax = Math.ceil((span + ESCAPE_RUN_MARGIN) / stepMin) + 1;
      while (reached < span + ESCAPE_RUN_MARGIN && k < kMax) {
        /* DEALT LIKE THE CHAIN'S OWN, uniform over the same range. The ramp here was
           `Math.min(26, 11 + k * 2 + rnd() * 8)` -- wheels that grew as the run went
           out, and past the chain's own TEETH_MAX at that. It was a second sizing
           philosophy inside a machine whose premise is that sizes are random, and it
           existed to keep the run short: bigger wheels cover ground faster, so seven
           of them reached. With the count now derived from the distance, the run can
           be as long as it needs to be and these can simply be wheels like any other. */
        const teeth = TEETH_MIN + Math.floor(this.rnd() * (TEETH_MAX - TEETH_MIN + 1));
        const r = MODULE * teeth / 2;
        const d = prev.r + r;
        /* EACH STEP AIMS BACK AT THE RUN'S AXIS BEFORE IT WANDERS (#91).
           The wobble is dealt around the run's bearing, not around the previous
           wheel's, so the ANGLE never accumulated -- but the POSITION did: every
           step displaces the run sideways by `d * sin(wobble)`, and those sum as a
           random walk, so lateral drift grew with the square root of the run's
           length. That was invisible while a run was seven wheels. #87 made the
           length a function of the viewport, so on a 5120px-wide screen a run is
           seventeen wheels and wandered 207px off its own line -- on a stage
           1440px tall.
           `off` is the run's current offset from its axis, positive to the left of
           travel. Solving for the bearing that lands the next centre back ON the
           axis and then dealing the wobble around THAT turns the walk into a
           contraction: measured over two loads at two viewports, peak excursion
           went 148/207px to 55/59px, and -- the part that matters -- stopped
           growing with the run. The chain's own bearings are disciplined the same
           way and for the same reason (see ANG_MIN/BAND_MAX above): a machine
           stays a line of gears rather than wandering off a corner of the frame.
           Alternating the wobble's SIGN each step was tried and is not enough --
           it decorrelates the angle while leaving the magnitudes free, so the
           position still walks: 133px at 5120, most of the way back to unsteered. */
        const ox = prev.cx - g0.cx, oy = prev.cy - g0.cy;
        const off = -ox * Math.sin(ea) + oy * Math.cos(ea);
        const correct = Math.asin(Math.max(-1, Math.min(1, -off / d))) * 180 / Math.PI;
        const wobble = (this.rnd() * 2 - 1) * ESCAPE_WOBBLE;
        const ang = e.ang + correct + wobble;
        const a = ang * Math.PI / 180;
        const cx = prev.cx + d * Math.cos(a), cy = prev.cy + d * Math.sin(a);
        const pPrev = 360 / prev.teeth, pThis = 360 / teeth;
        let u = ((ang - prev.phase) / pPrev) % 1;
        if (u < 0) u += 1;
        const phase = ang + 180 - (0.5 - u) * pThis;
        const g = { cx: cx, cy: cy, r: r, teeth: teeth, dir: -prev.dir, phase: phase,
          color: GHOST_COLORS[Math.floor(this.rnd() * GHOST_COLORS.length)],
          /* No kind, arms or prof: ghostSvg draws body, web and hub at fixed
             module multiples and reads none of them (#57). They were seven
             rnd() draws feeding nothing -- and because they consumed the
             sequence, deleting them deals a different set of background wheels.
             That is not a regression: these are re-dealt on every load anyway. */
          /* Was a bare 0.95 coefficient here -- 5% under the true addendum,
             with no comment defending the shortfall (CL#119, GitHub #100).
             TOOTH_ADD is the addendum's one stated home; every linked wheel
             already reads it here (solve()) and in WHEEL_SPAN, so a ghost's
             placement radius now agrees with theirs instead of quietly
             running its own number. */
          ro: r + MODULE * TOOTH_ADD, i: 'gh' + ei + k,
          /* whose run this is, which end of that chain it leaves by, and how far
             along it -- k 0 is the wheel in mesh with the chain itself */
          person: host.person, lead: host.lead, k: k,
          /* AND THE WHEEL IT GREW FROM. A run's heading only means anything
             measured from its host, and the host is no longer recoverable from
             the chain: a leading run used to start at c.head always, but a
             self-driven root's starts at the far end of its origin run instead.
             Anything measuring the heading would otherwise have to re-derive
             which of those applies -- modelling the rule it is supposed to be
             checking. Recorded here, where it is already known. */
          hostCx: host.g.cx, hostCy: host.g.cy,
          /* THE HOST'S FLYWHEEL, NOT THE SPINE'S (GitHub #122 follow-up). An
             escape run is decoration computed here, after solve() -- it is
             never in `g` and never reaches the union-find at line ~6137, so
             without this every escape ghost on the page read `comp` as
             `undefined` and applyRotation()'s fallback silently drove it off
             component 0, the spine's. A self-driven root's escape ghosts then
             turned with whoever holds the spine's chain -- not just moving
             when they should have sat still, but rotating at the SPINE's
             angle while drawn in mesh with a wheel turning at the ROOT's, so
             the two visibly slipped out of tooth-sync with each other. The
             two idlers nearest the mesh point were never affected, because
             they are the chain's own origin-run idlers -- structural `TRAIN`
             entries solved into `g` like any real gear, correctly tagged
             there. `host.g` is that same solved gear (`c.head`/`c.tail`/the
             origin tip), already comp-tagged by solve() before fitEscapes()
             ever runs, so every wheel grown from it inherits the SAME
             component its host actually turns with. */
          comp: host.g.comp };
        ghosts.push(g);
        /* PROGRESS ALONG THE RUN'S AXIS, not the length of the step that made it.
           `span` is measured straight down the escape bearing to the viewport edge,
           so a step taken `wobble` degrees off that bearing advances the run by only
           its cosine. Summing the raw centre distance credited the run with ground it
           had not covered, and it always over-credited -- cos is at most 1 -- so the
           error only ever stopped a run short (#80). Per-step projections onto a
           fixed direction sum to the projection of the whole displacement, so this is
           exact, not an approximation.

           OFF THE RUN'S BEARING, NOT OFF THE WOBBLE. This read `cos(wobble)` while
           the step was taken at `wobble`, which agreed only for as long as those
           were the same angle. Steering (#91) added a correction term to the
           bearing without touching this line, so the projection silently stopped
           matching the step it was projecting -- and it over-credited, which is the
           direction that stops a run short. `ang - e.ang` is the whole deflection
           by construction, so it cannot fall out of step again. */
        reached += d * Math.cos((ang - e.ang) * Math.PI / 180);
        prev = g;
        k++;
      }
    });
    const key = ghosts.map(g => [g.cx | 0, g.cy | 0, g.teeth].join()).join('|');
    if (key !== this._escKey) { this._escKey = key; this.setState({ ghosts: ghosts }); }
  }

  applyRotation() {
    /* Skip frames where nothing moved enough to see. */
    /* SKIP ONLY WHEN NOTHING MOVED ANYWHERE (GitHub #122). This compared one
       scalar; with a flywheel per mesh it has to see them all, or a still chain
       would suppress the write for a turning one.

       Every read of `_M` below falls back to component 0 -- the spine's -- when a
       rotating body carries no `comp`. Ghost outriggers and epicyclic internals
       are built from objects that predate the tagging, and indexing `_M` with
       `undefined` yields 0, which does not read as "stationary" but as PINNED AT
       ANGLE ZERO: 41 rotating elements on the page, and the first four sampled
       were exactly those, which is what made the whole page look frozen when only
       the trim was. */
    if (this._lastM !== undefined) {
      let moved = false;
      for (let c = 0; c < this._M.length; c++) {
        if (Math.abs((this._M[c] || 0) - (this._lastM[c] || 0)) >= 0.05) { moved = true; break; }
      }
      if (!moved) return;
    }
    this._lastM = this._M.slice();
    /* THE COUNT OF PASSES THAT ACTUALLY WROTE TRANSFORMS (CL#110), which is not
       the same number as the tick count and is the reason it is counted HERE
       rather than inferred from outside. A tick that arrives with the train
       standing still returns on the line above and writes nothing, so ticks/s
       and writes/s diverge exactly when the guard above is doing its job --
       and an observer watching mutation batches from outside cannot tell a
       skipped write from a coalesced one, which is what made the earlier
       estimate of this number ~1% noisy. One increment, past the guard. */
    if (HUD) this._paintN++;
    const gears = this.solve().gears;
    if (this._spinEls) {
      /* ADDRESSED BY TRAIN INDEX, which is what the render's ref writes them
         under -- not by position in `gears`. The two were the same array until
         a parked idler made the solved list shorter than TRAIN, and reading by
         position would then have driven the tail of the train with the wrong
         wheel's phase, or with nothing at all. */
      for (let i = 0; i < gears.length; i++) {
        const el = this._spinEls[gears[i].i];
        if (el) el.style.transform = 'rotate(' + (gears[i].phase + gears[i].dir * (this._M[gears[i].comp != null ? gears[i].comp : 0] || 0) / gears[i].teeth).toFixed(3) + 'deg)';
      }
    }
    if (this._ghostEls) {
      /* LAYER: parallax — the far plane runs a touch slower than the near one. */
      const lag = this.props.parallax ? 0.78 : 1;
      this._ghostEls.forEach(x => {
        if (x.el) x.el.style.transform = 'rotate(' + (x.g.phase + x.g.dir * (this._M[x.g.comp != null ? x.g.comp : 0] || 0) * lag / x.g.teeth).toFixed(3) + 'deg)';
      });
    }
    if (this._chainEls) {
      const PITCH = Math.PI * MODULE;
