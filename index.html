    const path = this.teethPath(g.teeth, r, chip, undefined, chipSev);
    /* Every wheel carries the same engraving band: a solid annulus one module deep just
       inside the tooth roots. The web is held clear of it so nothing is ever cut through
       the lettering, and because MODULE is shared the band is identical on all wheels. */
    const marked = this.props.engravedRims || this.props.character;
    const bandOut = r - m * BAND_RISE, bandIn = bandOut - m * BAND_DEPTH;
    const eng = this.engraving(g, r, m, bandOut);
    /* The rim ledge that carries the engraving is the SAME on every wheel: the raised face
       starts exactly where the band ends, so text always lands mid-band on identical metal
       regardless of the wheel's diameter or web style. */
    const faceR = marked ? Math.max(6, bandIn) : Math.max(6, r - m * (prof.rim || 1.75));
    const wellR = Math.min(Math.max(4, r - m * (prof.web || 2.9)), marked ? bandIn - 2 : Infinity);
    const hubR = Math.max(8, r * (prof.hub || 0.21));
    const inner = [];
    const post = [];   /* rendered AFTER the clipped group: cut-outs clip their
                          interiors, so anything living inside an opening -- the
                          planetary's moving parts -- draws here instead */
    const kind = g.kind;
    /* An epicyclic DRAWS its ring, sun and planets where every other family
       cuts or leaves a web, so the two #125 timing rules differ by family and
       both need to ask this one question (GitHub #132, #133). */
    const epiKind = kind === 'planetary' || kind === 'ravigneaux';
    /* THE TIMING MARK IS ONE SHAPE, SCALED, AND IT LIVES AT MODULE SCOPE
       (GitHub #148). It used to be declared right here, which made it one
       renderer's private shape -- and ghostSvg is the other renderer. See
       timingMark() and its two proportions up beside WEAR_SCUFF_RATIO; the
       call sites below are unchanged, because the name now resolves outward
       instead of to a local. */

    /* Openings are cut out of the blank itself: each one is appended to the body path
       as a subpath and filled with even-odd, so the page shows through. No masks. */
    const holes = [];
    /* Distance from the wheel centre to a convex cell's NEAREST point, which is
       on an EDGE, not at a vertex (#45). A vertex test is the wrong predicate
       for the inner boundary: a regular hexagon's inradius is 0.866 of its
       circumradius and an equilateral triangle's only 0.289, so a cell can clear
       the boss at every vertex while an edge cuts inside it.
       Measured across all 21 wheel/variant combinations, this currently changes
       ZERO cells in either family -- the intrusion band is about L^2/8R wide
       (~0.62px for an 8px triangle side against a 13px boss) and no lattice cell
       lands in it. So this is correctness insurance, not a visible fix. It
       matters as soon as cells grow or the boss shrinks, and #44's pending
       change makes every wheel bigger. */
    const nearestEdge = (V) => {
      let m = Infinity;
      for (let i = 0; i < V.length; i++) {
        const a = V[i], b = V[(i + 1) % V.length];
        const dx = b[0] - a[0], dy = b[1] - a[1];
        const t = Math.max(0, Math.min(1, -(a[0] * dx + a[1] * dy) / (dx * dx + dy * dy)));
        m = Math.min(m, Math.hypot(a[0] + t * dx, a[1] + t * dy));
      }
      return m;
    };
    /* THE FOUR LATTICE FAMILIES ARE PRINTED PARTS, NOT MACHINED ONES (#43).
       That reframing is what finally closed #38. Read as a milled web, a
       honeycomb is wrong three ways -- poor in in-plane shear, sharp internal
       corners no endmill can cut, and a ring of bare metal at the flats that
       reads as the pattern running out. Read as an additively manufactured one,
       all three invert: a lattice is exactly what you design for AM, no cutter
       means no tool radius to honour, and the ring is the PERIMETER SHELL that
       every printed part has around its lattice. The crescent stops being a
       defect and becomes a required feature.

       Metal rather than nylon, because what is drawn here is a designed
       lightweighting lattice -- open pockets on the visible face -- and not
       slicer infill, which is an FDM concept and is always buried under solid
       top layers. Metal also keeps these wheels inside WHEEL_POOL, which is
       ground truth; a plastic part would have needed a palette exception. */
    const amPrinted = kind === 'hexcore' || kind === 'isogrid'
                   || kind === 'polarbrick' || kind === 'polariso';
    /* Two concentric shell walls just inside the well. Drawn, not cut: on a real
       printed part the shell is solid material, so these are lines on the face
       rather than entries in `holes`. */
    /* Where the perimeter shells sit, and how far every core stays clear of
       them. Named once because three families and the shell drawing all need
       the same numbers -- they were separate literals, and the cores were let
       out to wellR - 0.5 while the inner shell sits at wellR - 2.1, so every
       lattice ran straight THROUGH both rings it was supposed to be framed by.
       Charles, marking up a bare wheel: fill between the boss and the inner
       shell, "pull it in a few px on either end so the centre won't clip the
       lines".
       CORE_GAP is that margin. The inner limit also clears the boss's own
       stroke, which is 1.2 wide and therefore reaches 0.6 beyond its radius. */
    const SHELL_STEP = 1.5, SHELL_OFF = 0.6, CORE_GAP = 0.8;
    const shellIn = wellR - SHELL_OFF - SHELL_STEP;      /* the inner ring */
    const coreOut = shellIn - CORE_GAP;                  /* cores stop here */
    const coreIn = (hub) => hub * 1.5 + 0.6 + CORE_GAP;  /* boss + its stroke */
    const amShells = (arr) => {
      if (!amPrinted) return;
      for (let s2 = 0; s2 < 2; s2++)
        arr.push(h('circle', { key: 'shell' + s2, r: wellR - SHELL_OFF - s2 * SHELL_STEP, fill: 'none',
          stroke: p[3], strokeOpacity: s2 ? 0.30 : 0.45, strokeWidth: 0.9 }));
    };
    const PT = polarD;
    /* Kidney lightening slots — the classic cast/machined gear web, arms left between them. */
    const slots = (arms, rIn, rOut, aspect, widthScale) => {
      const gap = 360 / arms, mid = (rIn + rOut) / 2;
      const wSlot = Math.min((rOut - rIn) * (widthScale || 0.94), (rOut - rIn) - 2, mid * 0.9), cap = wSlot / 2;
      /* A hard cliff -- below this the family cuts no openings at all -- so it
         is worth having in the right units. 7.7px at the scale it was tuned. */
      if (wSlot < px(7.7, 4.0, 11.0)) return;
      const rO = mid + cap, rI = mid - cap;
      const capDeg = cap / mid * 180 / Math.PI;
      /* The arm -- the metal LEFT BETWEEN slots -- used to be set by a FIXED
         NUMBER OF DEGREES. Converted to a physical length that tracks mid, the
         wheel's CIRCUMFERENCE; the slot's own width tracks the much smaller
         annulus SPAN (rOut - rIn) instead, and the two grow at different rates
         across the dealt tooth range -- width nearly tripled 13->19 teeth
         while the leftover straight run went flat, so the kidney read as a
         circle at the big end (CL#115, GitHub #93). Solved backwards instead: ASPECT
         is the designed straight-run/width ratio -- a proportion, exactly
         like widthScale four lines up, and just as underiveable from the
         wheel's own geometry since it is what a kidney is supposed to look
         like, not a measurement of one. Everything downstream of it (armLen,
         armDeg) is derived: given the gap this arm count leaves at THIS
         wheel's mid radius, armLen is the one length that leaves exactly
         `aspect * wSlot` of straight run once the width's own end-caps are
         paid for, converted to degrees by the same mid-radius division
         capDeg uses. Because aspect is span-relative rather than angular, it
         holds at every wheel size instead of only the one it was eyeballed
         at. Where a gap is too tight to afford it -- few arms, small wheel --
         armLen floors at zero rather than going negative, so the slot widens
         toward the whole gap instead of demanding an impossible shape. */
      const gapArc = gap * Math.PI / 180 * mid;
      const armLen = Math.max(0, (gapArc - cap * 2 * (1 + aspect)) / 2);
      const armDeg = armLen / mid * 180 / Math.PI;
      for (let k = 0; k < arms; k++) {
        const a0 = k * gap + armDeg + capDeg, a1 = (k + 1) * gap - armDeg - capDeg;
        if (a1 - a0 < 4) continue;
        holes.push('M' + PT(rO, a0) +
          ' A' + rO.toFixed(2) + ',' + rO.toFixed(2) + ' 0 0 1 ' + PT(rO, a1) +
          ' A' + cap.toFixed(2) + ',' + cap.toFixed(2) + ' 0 0 1 ' + PT(rI, a1) +
          ' A' + rI.toFixed(2) + ',' + rI.toFixed(2) + ' 0 0 0 ' + PT(rI, a0) +
          ' A' + cap.toFixed(2) + ',' + cap.toFixed(2) + ' 0 0 1 ' + PT(rO, a0) + ' Z');
        inner.push(h('path', { key: 'sl' + k, d: this.arcD(mid, a0, a1), fill: 'none', stroke: p[3], strokeOpacity: 0.55, strokeWidth: wSlot + 4, strokeLinecap: 'round' }));
        }
    };

    if (kind === 'spokes') {
      const arms = g.arms;
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      inner.push(h('circle', { key: 'sh', r: wellR + 2, fill: 'none', stroke: p[3], strokeOpacity: 0.35, strokeWidth: 2.5 }));
      slots(arms, hubR * BOSS_MUL, wellR, 1.2, 0.72);
    } else if (kind === 'pockets') {
      /* Cut clean through — a blind pocket reads as a failed hole at this scale. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      inner.push(h('circle', { key: 'sh', r: wellR + 1, fill: 'none', stroke: p[3], strokeOpacity: 0.35, strokeWidth: 2 }));
      slots(g.arms, hubR * 1.35, wellR, 1.0, 0.8);
    } else if (kind === 'holes') {
      /* Lightening drills, per Charles's rule: an opening must pay for its
         machining -- cuts exist to REMOVE material. The old version drilled
         6-8 small holes hugging the hub with filled counterbores, which read as
         more work than leaving the web solid. Now few and LARGE, as big as the
         spacing allows, seated in the outer web where removed mass actually
         counts -- the bike-chainring / flywheel drilling pattern. */
      const rInD = Math.max(hubR * BOSS_MUL, 9), rOutD = wellR - 2, spanD = rOutD - rInD;
      /* CENTRE ON THE AREA, NOT THE RADIUS. Charles, looking at a drilled wheel:
         "why isn't the circle centred in the AREA of the annulus?" It was not:
         the orbit was rIn + span*0.58, a hand-picked fraction. Area grows as
         r^2, so the radius that halves an annulus is sqrt((rIn^2+rOut^2)/2),
         which is always FURTHER OUT than the arithmetic midpoint -- and by an
         amount that depends on the wheel, so no constant can serve them all:
         the correct fraction is 0.568 at 13 teeth and 0.624 at 19. The drills
         sat too close to the hub with more bare metal outside them than in. */
      const orbit = Math.sqrt((rInD * rInD + rOutD * rOutD) / 2);
      /* AND THE COUNT FOLLOWS FROM IT, rather than being dealt. A drill is
         capped by two things: fitting the radial band (span * FIT) and not
         touching its neighbour on the bolt circle (orbit * sin(pi/n) * NEIGH).
         Most material comes out when those two balance, which is a closed form,
         no search: sin(pi/n) = span*FIT / (orbit*NEIGH). Small wheels want MANY
         SMALL holes and big wheels FEW LARGE ones, which a fixed count cannot
         express -- measured, removed area goes from 29-56% to a steady 68-73%
         across the train, and the answers (11 drills at 13 teeth, 6 at 19) match
         a brute-force sweep exactly.
         The variant still varies the look, but as a nudge about the optimum
         instead of an absolute count, so it can no longer ask a small wheel for
         six holes it has no room for. */
      const FIT = 0.48, NEIGH = 0.90;
      const ideal = Math.PI / Math.asin(Math.max(0.02, Math.min(1, spanD * FIT / (orbit * NEIGH))));
      const nudge = ((g.arms || 5) % 3) - 1;             /* -1, 0 or +1 */
      const count = Math.max(3, Math.min(12, Math.round(ideal) + nudge));
      const hr = Math.min(spanD * FIT, orbit * Math.sin(Math.PI / count) * NEIGH);
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      inner.push(h('circle', { key: 'well', r: wellR, fill: 'url(#' + id + 'w)' }));
      for (let k = 0; k < count; k++) {
        const a = (k / count) * Math.PI * 2, cx = (orbit * Math.cos(a)).toFixed(2), cy = (orbit * Math.sin(a)).toFixed(2);
        holes.push('M' + (+cx + hr) + ',' + cy + ' A' + hr + ',' + hr + ' 0 1 0 ' + (+cx - hr) + ',' + cy + ' A' + hr + ',' + hr + ' 0 1 0 ' + (+cx + hr) + ',' + cy + ' Z');
        /* a thin chamfer ring only -- the machining witness, not decoration */
        inner.push(h('circle', { key: 'h' + k, cx: cx, cy: cy, r: hr + 1.2, fill: 'none', stroke: p[3], strokeWidth: 1.4, strokeOpacity: 0.55 }));
      }
      /* SECOND TIER, in the corners the first one cannot reach. Charles: "two
         sets of circles, one small and one large". After the primary ring there
         are curved triangles left between each neighbouring pair and the outer
         boundary, and the largest circle that fits one is found by walking the
         radius and taking the smallest of the three clearances -- to the two
         primaries, to rIn, and to rOut. It lands OUTBOARD of the primaries
         rather than between them: rho 37.5 against a 31.3 orbit on a 19-tooth
         wheel. Worth 8-10 points of removed area, 68-73% -> 76-82%.
         Skipped when it would be a speck: below about 1.8 units it renders
         under 2.5px and reads as dirt rather than as drilling. */
      let t2r = 0, t2rho = 0;
      for (let rho = rInD; rho <= rOutD; rho += 0.05) {
        const aa = Math.PI / count;
        const dd = Math.hypot(rho * Math.cos(aa) - orbit, rho * Math.sin(aa));
        const rr = Math.min(dd - hr, rho - rInD, rOutD - rho);
        if (rr > t2r) { t2r = rr; t2rho = rho; }
      }
      /* Its own comment said "below about 1.8 units it renders under 2.5px",
         which is true only at S ~ 1.39. State the 2.5px and convert. */
      if (t2r >= px(2.5, 1.1, 3.6)) {
        for (let k = 0; k < count; k++) {
          const a = ((k + 0.5) / count) * Math.PI * 2;
          const cx = (t2rho * Math.cos(a)).toFixed(2), cy = (t2rho * Math.sin(a)).toFixed(2);
          const rr = t2r.toFixed(2);
          holes.push('M' + (+cx + +rr) + ',' + cy + ' A' + rr + ',' + rr + ' 0 1 0 ' + (+cx - +rr) + ',' + cy
            + ' A' + rr + ',' + rr + ' 0 1 0 ' + (+cx + +rr) + ',' + cy + ' Z');
          inner.push(h('circle', { key: 't2' + k, cx: cx, cy: cy, r: t2r + 0.9, fill: 'none',
            stroke: p[3], strokeWidth: 1.0, strokeOpacity: 0.45 }));
        }
      }
    } else if (kind === 'ring') {
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      inner.push(h('circle', { key: 'well', r: wellR, fill: 'url(#' + id + 'w)' }));
      inner.push(h('circle', { key: 'grv', r: (wellR + faceR) / 2, fill: 'none', stroke: p[3], strokeOpacity: 0.5, strokeWidth: 2 }));
      /* Drilled relief holes — round openings are unambiguous geometry, where a narrow
         kidney slot can collapse on a thin web and stop punching. */
      const count = 5, orbit = (wellR + hubR * 1.3) / 2;
      const hr = Math.max(4.5, Math.min((wellR - hubR * 1.3) * 0.34, r * 0.12));
      for (let k = 0; k < count; k++) {
        const a = (k / count) * Math.PI * 2;
        const cx = (orbit * Math.cos(a)).toFixed(2), cy = (orbit * Math.sin(a)).toFixed(2);
        holes.push('M' + (+cx + hr) + ',' + cy + ' A' + hr + ',' + hr + ' 0 1 0 ' + (+cx - hr) + ',' + cy + ' A' + hr + ',' + hr + ' 0 1 0 ' + (+cx + hr) + ',' + cy + ' Z');
        inner.push(h('circle', { key: 'rh' + k, cx: cx, cy: cy, r: hr + 1.6, fill: 'none', stroke: p[3], strokeOpacity: 0.55, strokeWidth: 2.4 }));
      }
    } else if (kind === 'planetary' || kind === 'ravigneaux') {
      /* An epicyclic set inside the wheel, kinematics and MESH both honest.
         Story on the page: the hub badge is the end of the STATIONARY axle, the
         sun is keyed to it, the ring gear is the wheel itself. Sun fixed, ring
         at wheel speed: carrier at Zr/(Zr+Zs), planet spin ZrZs/(Zp(Zr+Zs))
         relative to carrier. Zs=6 Zp=9 Zr=24: Zs+2Zp=Zr and (Zs+Zr)/3 integer,
         so three planets assemble at 120 degrees; the same integer check is why
         one phase constant below serves all three stations.

         Tooth phases are DERIVED, not nudged. Interleave condition (planet
         tooth centred on ring space at each station) gives, in wheel-relative
         element bases with P = the wheel's phase:
           carrier base  = kC*P
           planet  base  = kP*P - pp/2   (pp = planet pitch = 360/Zp)
         both modulo their pitch. First cut used guessed offsets and a sign
         error on the carrier base -- visibly out of mesh, as Charles spotted. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      /* Two dealt gear sets: 3 planets with 9-tooth pinions, or 4 planets with
         a big 18-tooth sun -- both pass (Zs+Zr)%N==0 and adjacency. 4|18 fails,
         so the 4-planet set's phase constants STAGGER per station; the formula
         moved into the loop to carry the kP*A_k term that no longer vanishes. */
      const cvv = g.cv || {};
      const TWO = !!cvv.pg2;
      const PG = TWO ? cvv.pg2 : (cvv.pg || [12, 9, 30, 3]);
      const Zs = PG[0], Zp1 = PG[1], Zp2 = TWO ? PG[2] : PG[1];
      const Zp = Zp1, Zr = TWO ? PG[3] : PG[2], NP = TWO ? PG[4] : PG[3];
      /* Sized from the BORE inward so the ring keeps a real rim: the bore is the
         hole cut in the wheel, the ring root sits 0.75 m2 inside it, and the
         module follows from the ring's tooth count. Sized from Rr outward, as
         this was, the root landed exactly on the bore -- a ring gear with no
         metal behind its teeth. */
      /* Same derivation the deal used to choose this set -- band, then the ring
         under it, then whatever is left. If these two ever disagree, the set was
         chosen for a wheel other than the one being drawn. */
      const bore = planetaryBore(g.teeth);
      const Rr = bore / (1 + 4 / Zr), m2 = 2 * Rr / Zr;
      const Rs = m2 * Zs / 2, Rp = m2 * Zp1 / 2, Rp2r = m2 * Zp2 / 2;
      /* Rc1 comes off the sun mesh, Rc2 off the ring mesh. On a single row the
         two are the same number, since Zr = Zs + 2*Zp -- the two-row layout is
         the general case and the single row its degenerate one. */
      const Rc = Rs + Rp, Rc2 = Rr - Rp2r;
      holes.push('M' + bore.toFixed(2) + ',0 A' + bore.toFixed(2) + ',' + bore.toFixed(2) + ' 0 1 0 -' + bore.toFixed(2) + ',0 A' + bore.toFixed(2) + ',' + bore.toFixed(2) + ' 0 1 0 ' + bore.toFixed(2) + ',0 Z');
      /* The ring is cut as a REAL internal gear, not a ring of trapezoids: the
         same involute curve as every other wheel on the page, but its tooth
         occupies what an external gear leaves as space, so the thickness GROWS
         with radius and the addendum points inward. Cut that way, a planet tooth
         and a ring space are congruent by construction rather than by fitted
         constants. The trapezoid was about a quarter of a module too fat at the
         pitch line and fouled every planet flank it touched.

         The addendum is a 0.70 m2 stub. Our planets run as few as five teeth,
         and a full-depth ring tooth reaches below a planet that small's base
         circle -- where teethPath has no involute left to give and the flank is
         a straight wall. Measured in tools/mesh_epi.js: full depth fouls three
         of the five dealt sets, 0.70 clears all five at every carrier clocking. */
      const phiR = TOOTH_PA * Math.PI / 180, rbR = Rr * Math.cos(phiR);
      const invR = (x) => Math.tan(x) - x;
      const psiR = TOOTH_THICK * Math.PI / Zr;
      const halfR = (R) => (psiR - invR(phiR) + invR(Math.acos(Math.min(1, rbR / R)))) * 180 / Math.PI;
      const ringTip = Rr - m2 * RING_STUB, ringRoot = Rr + m2 * TOOTH_DED;
      const aR = 360 / Zr, ST = 7;
      let ringD = 'M' + PT(ringRoot, -aR / 2) + ' ';
      for (let k2 = 0; k2 < Zr; k2++) {
        const c = k2 * aR;
        ringD += 'A' + ringRoot.toFixed(2) + ' ' + ringRoot.toFixed(2) + ' 0 0 1 ' + PT(ringRoot, c - halfR(ringRoot)) + ' ';
        for (let s = ST - 1; s >= 0; s--) { const R = ringTip + (ringRoot - ringTip) * (s / ST); ringD += 'L' + PT(R, c - halfR(R)) + ' '; }
        ringD += 'A' + ringTip.toFixed(2) + ' ' + ringTip.toFixed(2) + ' 0 0 1 ' + PT(ringTip, c + halfR(ringTip)) + ' ';
        for (let s = 1; s <= ST; s++) { const R = ringTip + (ringRoot - ringTip) * (s / ST); ringD += 'L' + PT(R, c + halfR(R)) + ' '; }
        ringD += 'A' + ringRoot.toFixed(2) + ' ' + ringRoot.toFixed(2) + ' 0 0 1 ' + PT(ringRoot, c + aR / 2) + ' ';
      }
      ringD += 'Z M' + bore.toFixed(2) + ',0 A' + bore.toFixed(2) + ',' + bore.toFixed(2) + ' 0 1 0 -' + bore.toFixed(2) + ',0 A' + bore.toFixed(2) + ',' + bore.toFixed(2) + ' 0 1 0 ' + bore.toFixed(2) + ',0 Z';
      post.push(h('path', { key: 'epiring', d: ringD, fillRule: 'evenodd', fill: ft.body, stroke: ft.line, strokeWidth: 1, strokeOpacity: EPI_LINE_OP }));
      /* STAR ARRANGEMENT -- the carrier is grounded to the axle, per the
         physics verification (scratchpad/planetary-physics.md: Willis +
         tabulation, cross-checked; precedent ALF 502 turbofan star box,
         automatics braking the carrier for reverse). Page-frame speeds:
         carrier 0, planets +Zr/Zp = +3.33x spinning IN PLACE on stationary
         studs, sun -Zr/Zs = -2.5x COUNTER-ROTATING -- chosen over sun-grounded
         because there every member co-rotates in a 1.7x band and, in Charles's
         words, the planets move so little. k-factors are relative to the host
         wheel; phase constants are the derived interleave conditions, valid at
         all three stations because 3|Zs and 3|Zr (the strict condition, not
         just 3|(Zs+Zr)). */
      const kC = -1;
      const kP = TWO ? -Zr / Zp1 : Zr / Zp;
      const kP2 = Zr / Zp2;
      /* Single row: the sun opposes the wheel. Two rows: the opposition moves to
         the planet rows, which counter-rotate against each other, and the sun
         comes along with the wheel. */
      const kS = TWO ? (Zr / Zs - 1) : -(1 + Zr / Zs);
      const pp = 360 / Zp, ps = 360 / Zs;
      /* R clocks the whole grounded carrier; substituting (phase - R) for phase
         in the derived constants keeps every mesh condition satisfied at any R,
         because the per-station terms vanish under 3|Zs and 3|Zr. */
      const Q = g.phase - (g.crot || 0);
      const baseC = -Q;
      const basePAt = (A) => (((kP * (Q - A) - pp / 2) % pp) + pp) % pp;
      /* The sun's clocking is the one constant that was WRONG, and wrong in a
         way a still frame hides: the sun would sit tooth-on-tooth with the
         planets on any set where Zs and Zp are both odd, and drift out of mesh
         at every carrier clocking but Q = 0.

         Derived rather than guessed this time. The planet's phase is already
         pinned by the ring mesh, so the sun's only job is to show a space where
         the planet shows a tooth. Write each one's position at the line of
         centres as a fraction of its OWN pitch; an external pair turns opposite
         ways, so that pair of fractions sums to a constant as the set runs, and
         setting the constant to the tooth-into-space value leaves
             baseS = ps * (Zp/2 - Q*(Zs+Zr)/360).
         Zs does not belong in the parity term at all -- whether the planet
         points a tooth or a gap inward depends on Zp alone. The per-station
         term drops out because (Zs+Zr) % N == 0, which is precisely the job the
         assembly condition is in the solver to do. */
      /* TWO ROWS. The inner row is pinned by the sun, the outer by the ring, and
         the pair closes a triangle (Rc, Rc2, Rp+Rp2) -- so the outer planet sits
         at its station angle PLUS dTheta, at a different radius. That offset is
         what lets a pair span an annulus neither row could reach across alone.

         The phases come off the same technique the single row was finally
         derived with, applied down the chain outermost first, because each link
         pins the next: P2 against the ring fixes baseP2 from the station angle;
         P1 against P2 fixes baseP1 (moving-to-moving, which the single row never
         needed); the sun against P1 fixes baseS. Every station pins the sun
         independently and there is only one sun -- so "do all N stations agree"
         IS the assembly condition, and the sets in RAVIGNEAUX_MENU are the ones
         that do, then measured to actually mesh. */
      const d12 = Rp + Rp2r;
      const dTheta = TWO ? Math.acos((Rc * Rc + Rc2 * Rc2 - d12 * d12) / (2 * Rc * Rc2)) * 180 / Math.PI : 0;
      const psiT = TWO ? Math.atan2(Rc2 * Math.sin(dTheta * Math.PI / 180),
                                    Rc2 * Math.cos(dTheta * Math.PI / 180) - Rc) * 180 / Math.PI : 0;
      const a1 = 360 / Zp1, a2 = 360 / Zp2;
      const wrapT = (x, per) => ((x % per) + per) % per;
      const baseP2At = (A) => wrapT(a2 * (-0.5 + Zr * (Q - A - dTheta) / 360), a2);
      const baseP1At = (A) => wrapT(psiT + a1 * ((psiT + 180 - dTheta - baseP2At(A)) * Zp2 / 360 - 0.5), a1);
      const baseS = TWO
        ? wrapT(baseC + ps * ((180 - baseP1At(0)) * Zp1 / 360 - 0.5), ps)
        : (((180 * Zp / Zs - Q * (Zs + Zr) / Zs) % ps) + ps) % ps;
      const epi = (k3, base) => (el) => { if (el && this._epiEls) this._epiEls.push({ el: el, k: k3, base: base, g: g }); };
      /* One station's planet: an arm out to the stud, the gear on it, the stud
         end showing. Shared by both rows so the carrier reads the same either
         way -- the load path is the arm, and it is drawn, not implied. */
      const station = (key, rad, teeth, pitchR, kFac, base, fill) =>
        h('g', { key: key, transform: 'rotate(' + rad.a.toFixed(3) + ')' },
          h('path', { d: 'M0,0 L' + rad.r.toFixed(2) + ',0', stroke: ft.line, strokeWidth: 3, strokeOpacity: 0.85 }),
          h('g', { transform: 'translate(' + rad.r.toFixed(2) + ',0)' },
            h('g', { ref: epi(kFac, base), style: { transform: 'rotate(' + base.toFixed(2) + 'deg)' } },
              h('path', { d: this.teethPath(teeth, pitchR, -1, m2), fill: fill, stroke: ft.line, strokeWidth: 1, strokeOpacity: EPI_LINE_OP }),
              /* This planet's own index mark (GitHub #133), INSIDE the group that
                 carries `base` -- so it turns with the planet's own spin rather
                 than with the carrier, which is the entire reason a real set is
                 marked here: what a fitter checks is each planet's phase against
                 the carrier arm, and a mark that rode the carrier would hold
                 still relative to it and say nothing. Stops inside the root
                 circle, the same rule the wheel's own mark follows for the band:
                 never run a scribe out through the teeth. */
              timingOn ? h('g', { key: 'ptiming' },
                timingMark(2.4, Math.max(2.4 + m2 * 0.5, pitchR - m2 * TOOTH_DED), m2, ft.line)) : null),
            /* The stud end. Same ink as every other contour in the assembly, so it
               takes the same weight -- it is the one place ft.line is used as a
               FILL rather than a line, and at full opacity it was the darkest
               thing in the epicyclic while the ring, planets and sun sat at 0.6. */
            h('circle', { r: 2.4, fill: ft.line, fillOpacity: EPI_LINE_OP })));
      const planets = [];
      for (let k2 = 0; k2 < NP; k2++) {
        const A = k2 * (360 / NP);
        if (TWO) {
          /* The two rows are painted differently on purpose: they turn opposite
             ways, and identical fills would hide the one thing worth seeing. */
          planets.push(station('i' + k2, { a: A, r: Rc }, Zp1, Rp, kP, baseP1At(A), ft.face));
          planets.push(station('o' + k2, { a: A + dTheta, r: Rc2 }, Zp2, Rp2r, kP2, baseP2At(A), ft.well));
        } else {
          /* ONE BLANK, ONE TONE. The ring, the planets and the sun are gears in a single
             set, on one plane, cut from one piece -- so they take the wheel's own
             body colour and are told apart by their contours, which is exactly what
             ft.face's own comment argues for ('in a flat drawing the raised face is
             told by its outline, not by a tonal jump'). Before this the sun was
             ft.well and the planets ft.face, 1.42x apart on a yellow wheel, which
             read as a sun sunk in a pocket. The TWO-ROW rows keep their difference:
             they counter-rotate, and that is information rather than inheritance. */
          planets.push(station('pw' + k2, { a: A, r: Rc }, Zp, Rp, kP, basePAt(A), ft.body));
        }
      }
      post.push(h('g', { key: 'epicarrier', ref: epi(kC, baseC), style: { transform: 'rotate(' + baseC.toFixed(2) + 'deg)' } }, planets));
      post.push(h('g', { key: 'episun', ref: epi(kS, baseS), style: { transform: 'rotate(' + baseS.toFixed(2) + 'deg)' } },
        h('path', { d: this.teethPath(Zs, Rs, -1, m2), fill: ft.body, stroke: ft.line, strokeWidth: 1, strokeOpacity: EPI_LINE_OP }),
        /* The sun's mark, in the sun's own rotating group for the same reason as
           the planets' (GitHub #133). It starts at the centre rather than at a
           stud, because the sun has no stud -- it is the one body here on the
           wheel's own axis. */
        timingOn ? h('g', { key: 'stiming' },
          timingMark(0, Math.max(m2 * 0.5, Rs - m2 * TOOTH_DED), m2, ft.line)) : null));
    } else if (kind === 'iris') {
      /* Aperture blades: tangential crescents, pointed at both ends. The metal
         between blades is a full-depth curved spoke — nothing floats. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      const nB = g.arms || 6, rInI = Math.max(hubR * 1.6, 10), rOutI = wellR - 2;
      const rmI = (rInI + rOutI) / 2, hd = (rOutI - rInI) / 2;
      for (let k = 0; k < nB; k++) {
        const a0 = (k / nB) * 360, sw = (360 / nB) * 0.7, ST = 8;
        let d2 = '';
        for (let q = 0; q <= ST; q++) {
          const t = q / ST, aa = (a0 + (t - 0.5) * sw) * Math.PI / 180;
          const rr = rmI + hd * Math.sin(Math.PI * t) * 0.95;
          d2 += (q ? 'L' : 'M') + (rr * Math.cos(aa)).toFixed(2) + ',' + (rr * Math.sin(aa)).toFixed(2) + ' ';
        }
        for (let q = ST; q >= 0; q--) {
          const t = q / ST, aa = (a0 + (t - 0.5) * sw) * Math.PI / 180;
          const rr = rmI + hd * Math.sin(Math.PI * t) * 0.35;
          d2 += 'L' + (rr * Math.cos(aa)).toFixed(2) + ',' + (rr * Math.sin(aa)).toFixed(2) + ' ';
        }
        holes.push(d2 + 'Z');
      }
      inner.push(h('circle', { key: 'boss', r: hubR * BOSS_MUL, fill: 'url(#' + id + 'u)', stroke: p[3], strokeWidth: 1.2, strokeOpacity: 0.55 }));
    } else if (kind === 'star') {
      /* A star truss: arc-topped windows with straight sides — the first
         straight edges anywhere on the page, welded-plate rather than cast. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      const nS = g.arms || 5, rInS = Math.max(hubR * 1.55, 10), rOutS = wellR - 2;
      const stepS = 360 / nS, gA = stepS * 0.14, gB = stepS * 0.30;
      for (let k = 0; k < nS; k++) {
        const a0 = k * stepS;
        let d2 = '';
        for (let q = 0; q <= 5; q++) {
          const aa = (a0 + gA + (stepS - 2 * gA) * (q / 5)) * Math.PI / 180;
          d2 += (q ? 'L' : 'M') + (rOutS * Math.cos(aa)).toFixed(2) + ',' + (rOutS * Math.sin(aa)).toFixed(2) + ' ';
        }
        d2 += 'L' + PT(rInS, a0 + stepS - gB) + ' L' + PT(rInS, a0 + gB) + ' ';
        holes.push(d2 + 'Z');
      }
      inner.push(h('circle', { key: 'boss', r: hubR * BOSS_MUL, fill: 'url(#' + id + 'u)', stroke: p[3], strokeWidth: 1.2, strokeOpacity: 0.55 }));
    } else if (kind === 'honeycomb') {
      /* A hex CORE, the kind that stiffens a rover deck or a robot chassis --
         not one polite orbit of six hexes, which is what this used to be.

         Cells sit in concentric courses, and each course is offset half a cell
         against the one under it, so the walls interlock instead of lining up
         into a radial seam. That stagger is also the load path: every wall meets
         solid metal in the course beside it, and the web runs unbroken hub to
         rim, which is the admission rule.

         Cell SIZE varies by course, and it varies for a reason rather than for
         effect. A course further out has more circumference to spend, so it
         takes more cells only until they would stop being machinable; past that
         it keeps the count and the cells simply grow. Hence an upper bound on
         cells per course, a floor under cell size, and a wall thickness that is
         never negotiated -- a course that cannot hold a real cell is not cut at
         all, so a small blank gets one course and a large one gets three. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      const target = (g.cv && g.cv.cell) || 5.4;
      const rInH = Math.max(hubR * 1.32, 9), rOutH = wellR - 2;
      const WALL = 2.3, CELL_MIN = 2.8;
      /* Courses are as many as the depth can hold at the wanted cell size. */
      const courses = Math.max(1, Math.min(4,
        Math.floor((rOutH - rInH) / (2 * target + WALL))));
      /* Course boundaries step GEOMETRICALLY, not evenly, so each course is
         taller than the one inside it and its cells come out larger. That is
         where the range of sizes comes from, and it comes from the part rather
         than from taste: a course further out has more room, so it gets bigger
         cells, exactly as a hex core on a round part does. */
      const edge = (b) => rInH * Math.pow(rOutH / rInH, b / courses);
      for (let b = 0; b < courses; b++) {
        const r0 = edge(b), r1 = edge(b + 1), rm = (r0 + r1) / 2;
        /* A vertex-out hexagon spans 2*cell radially and sqrt(3)*cell across the
           flats. So the course depth fixes the cell, and the flats then decide
           how many fit -- deriving the count this way is what makes them touch.
           Capping the count instead leaves every cell short of its neighbour and
           the result reads as scattered drillings rather than a core. */
        const cell = (r1 - r0 - WALL) / 2;
        if (cell < CELL_MIN) continue;
        const cols = Math.max(5, Math.floor(2 * Math.PI * rm / (Math.sqrt(3) * cell + WALL)));
        const off = (b % 2) ? 180 / cols : 0;   /* the interlock */
        for (let k = 0; k < cols; k++) {
          const A = off + (k / cols) * 360;
          const cx = rm * Math.cos(A * Math.PI / 180), cy = rm * Math.sin(A * Math.PI / 180);
          let d2 = '';
          for (let v = 0; v < 6; v++) {
            const va = (A + 60 * v) * Math.PI / 180;
            d2 += (v ? 'L' : 'M') + (cx + cell * Math.cos(va)).toFixed(2) + ',' + (cy + cell * Math.sin(va)).toFixed(2) + ' ';
          }
          holes.push(d2 + 'Z');
        }
      }
      inner.push(h('circle', { key: 'boss', r: hubR * BOSS_MUL, fill: 'url(#' + id + 'u)', stroke: p[3], strokeWidth: 1.2, strokeOpacity: 0.55 }));
    } else if (kind === 'hexcore') {
      /* A hexagonal patch of hexagons, not a circular crop of them.

         The lattice was always uniform -- measured, spacing held to 0.01 across
         every cell. What read as wrong was the OUTLINE: keeping whole cells
         wherever the grid happened to fall inside a circle leaves a scalloped,
         accidental-looking boundary, and the eye reads that lumpiness as the
         pattern being irregular even though it is not.

         So the field is bounded by the lattice's own geometry instead of by the
         wheel's. Cells are kept by HEX DISTANCE from the centre -- a whole number
         of rings -- which gives a patch with six straight edges and six-fold
         symmetry, matching the cells it is made of. The inner boundary is a ring
         count too, so the hole around the boss is hexagonal rather than a circle
         chewed out of a grid. Both edges end up deliberate.

         The cost is corners: a hexagonal patch inside a round web leaves six
         gaps at its flats. Charles's call, and the right one -- the alternative
         is a ragged edge, and a hexagon of hexagons is plainly a made thing.

         Pointy-top axial coordinates: x = sqrt(3)*step*(q + r/2), y = 1.5*step*r,
         with step = cell + wall/2 so the gap where two cells meet is the wall. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      /* THE WALL SCALES WITH THE WHEEL (Charles's call). It was a flat 1.2 on
         every wheel, which is a FIXED cost against a VARIABLE budget: at 1.2 it
         eats 12.5% of a 13-tooth annulus and only 4% of a 19-tooth one, three
         times the price on the wheel that can least afford it. Proportional to
         tooth count keeps the share even and costs the big wheels nothing.
         THE FLOOR IS THE POINT, though. Fill alone always prefers a thinner
         wall -- the sweep said 0.6 everywhere -- but at S ~ 1.25 that renders
         at 0.75px and aliases into a grey smear, which is the mesh-screen
         failure already rejected twice. 0.85 solve units is about 1.06px at the
         usual scale, the thinnest that still reads as a wall rather than a
         seam. Fill cannot see that, which is exactly why it needs a bound of
         its own. */
      /* 1.06px is the thinnest that still reads as a wall rather than a seam;
         below it the lattice aliases into the grey smear rejected twice. Ceiling
         so a 5K display does not spend ten times the metal on it. */
      const WALLX = LATTICE_WALL;
      /* HELD TO MIN_CUT LIKE EVERY OTHER LATTICE (CL#138). This was
         `px(3.9, 2.2, 6.0)` -- hexcore's own empirical floor, measured as "where
         a cell stops reading as a hexagon and becomes a dot" -- and it is
         retired because it disagreed with the shared floor and lost.

         THE CONVERSION IS THE WHOLE CALCULATION, and it is not isogrid's. There
         the cut is inset by a wall on each side, so the pitch has to clear
         MIN_CUT PLUS the wall. Here `cellX` is the hexagon's CIRCUMRADIUS -- the
         radius its vertices sit at -- and the wall is additive in `step` below
         (`cellX + WALLX / sqrt(3)`), so it lives BETWEEN cells and takes nothing
         off the opening. `cellX` is pure cut.

         What MIN_CUT floors is the opening's NARROWEST dimension, which for a
         hexagon is across the FLATS, not across the vertices: 2 x inradius =
         sqrt(3) x circumradius. So sqrt(3) * cellX >= MIN_CUT, and the floor is
         MIN_CUT / sqrt(3).

         The gap it closes, measured: the old floor allowed 6.8px across the
         flats at every viewport against a 10.3px requirement -- 34% under, which
         is the "reads as dots" complaint stated as a number. */
      const CELL_MIN = MIN_CUT / Math.sqrt(3);
      /* THE CEILING HAS TO MOVE WITH THE FLOOR OR IT INVERTS IT. It was a flat
         4.8 solve units, which sat above the old floor on a desk (2.79) and
         BELOW the new one on a phone in landscape (7.06) -- and a ceiling under
         the floor collapses the sweep to a single iteration, throwing away the
         search that picks the size. Expressed as a multiple of the floor it
         cannot invert at any scale.

         1.7 IS THE ONE JUDGED FIGURE HERE and cannot be derived: it is how much
         range the search is given, not a property of the geometry. It is taken
         from the pair that shipped -- 4.8 / 2.79 = 1.72 at the desktop scale
         those two were written against -- so the search keeps the room it had,
         now at every scale instead of one. */
      const CELL_MAX = CELL_MIN * 1.7;
      /* Clear the BOSS, not the hub. The boss disc is drawn at hubR * BOSS_MUL and
         painted over the web, so a lattice that only cleared hubR * 1.1 ran its
         innermost ring underneath it -- half-covered cells, and the ragged inner
         edge the hex-ring boundary was supposed to have got rid of. Every other
         family clears 1.5 or more for the same reason; this one did not. */
      /* The shell clearance is a nicety; having ANY pattern is not. On a
         13-tooth wheel the boss alone takes 12 of a 23.3 well, so holding the
         core off the inner shell as well leaves 6.97 units -- less than one
         CELL_MIN cell needs to land in -- and the web renders completely blank.
         Measured: 13T lost its pattern entirely when the clearance went in.
         So the clearance yields when it would cost the pattern outright. The
         core may then touch the inner shell on the smallest wheels, which reads
         as tight rather than as broken. */
      /* The shell clearance is a nicety; having ANY pattern is not.
         TESTING THE BAND'S WIDTH IS THE WRONG TEST, which cost 13T its whole
         core: its window is 13.4..20.4, a full 6.97 wide against a 6.2 cell
         diameter, so a width check says there is room -- but no RING lands
         there. Ring radii are fixed multiples of the pitch because the lattice
         is anchored at the wheel centre, and at every legal cell size ring 2
         starts below 13.4 while ring 3 ends above 20.4. Nothing in between, and
         the pattern cannot be slid outward to fit.
         So the fallback asks the only question that matters -- did the sweep
         find anything -- and relaxes to the pre-shell limit if it did not. The
         core may then touch the inner shell on the smallest wheels, which reads
         as tight rather than as a blank web. */
      const rInX = Math.max(coreIn(hubR), 7);
      const rOutTry = [coreOut, wellR - 0.5];
      const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
      const ringOf = (k) => {
        if (k === 0) return [[0, 0]];
        const out = [];
        let q = DIRS[4][0] * k, r = DIRS[4][1] * k;
        for (let i2 = 0; i2 < 6; i2++) {
          for (let j2 = 0; j2 < k; j2++) { out.push([q, r]); q += DIRS[i2][0]; r += DIRS[i2][1]; }
        }
        return out;
      };
      /* The objective is Charles's, stated plainly: the largest reach of FULL
         hexagons. Not the most cells -- that drove every wheel to the smallest
         cell allowed and turned the core into a dot screen. Not the first size
         to clear a ring target either -- that stopped the search the moment it
         qualified and left a bald band between the outermost cells and the
         engraving. Reach, with whole cells, is the thing worth maximising.

         So: walk every size from this wheel's ceiling down to the legibility
         floor, build the complete-ring patch each one gives, and keep whichever
         patch gets furthest out. Larger cells win ties, so a size only gets
         smaller if that actually buys reach.

         The variant sets the ceiling, and it stays meaningful: a coarse ceiling
         reaches as far as big hexagons can, a fine one gets closer to the rim
         because smaller cells step out in finer increments.

         The six gaps at the patch's flats are now partly recovered -- see the
         exact-vertex keep below, which takes every whole cell that fits rather
         than only those in a complete ring. What remains cannot be removed by
         any search that refuses to cut a cell: a hexagon inscribed in a circle
         falls short by 1 - cos(30), about 13% of the radius, and on most wheels
         the leftover at the flats is narrower than one whole hexagon. Filling
         it completely needs a pattern defined BY the annulus rather than
         clipped to it, which is what polarbrick and polariso are for. */
      /* A FRACTION OF THE ANNULUS, not an absolute size (#63). CELL_MAX stays
         as a hard sanity bound, but it never binds in practice -- the point is
         that the ceiling now scales with the room available. `cell` is still
         honoured if a variant supplies one, so the other families and any
         hand-set entry keep working. */
      const spanC = Math.max(1, rOutTry[0] - rInX);
      /* THE CEILING MUST STAY ABOVE THE FLOOR. The sweep runs from ceiling DOWN
         to CELL_MIN, so a ceiling below it executes zero iterations and the web
         renders blank -- which is what a bare fraction did at 13, 14 and 16
         teeth, where 7.0 * 0.22 = 1.54 is under the floor. Clamping between the
         two is the whole correction, and it is the same one-sided error this
         change exists to fix, made once more in the fixing. */
      const ceiling = Math.max(CELL_MIN, Math.min(
        (g.cv && g.cv.cellFrac) ? spanC * g.cv.cellFrac : ((g.cv && g.cv.cell) || CELL_MAX),
        CELL_MAX));
      /* SCORE BOTH BOUNDARIES, not just the outer one.
         The old objective was "largest reach of whole cells", which is
         one-sided: it asks how far the pattern gets and never asks what it
         leaves behind at the inner edge. Because the lattice is anchored at the
         wheel centre, ring radii land on multiples of the pitch and a ring is
         either wholly in or wholly out -- so a size that reaches furthest can
         still start late and leave a wide bare band around the boss. Measured
         on a 19-tooth wheel: cells occupying 22.2 to 33.6 inside an annulus of
         14.4 to 41.4, with 40% of the radial span bare at the two ends. That is
         the ring floating in the middle of the web that Charles photographed.
         Scoring the SUM of both gaps instead picks sizes whose rings happen to
         land near both limits: 17T coarse goes 42 -> 66 cells, 19T coarse
         54 -> 102, and every other combination is unchanged. Larger cells still
         win ties, so a size only shrinks when that genuinely buys fit.
         Same lesson as #46, applied to geometry rather than to a test: a bound
         with no counterpart optimises one end and abandons the other. */
      /* SWEEP THE SIZE DIRECTLY. This used to decide viability by asking which
         COMPLETE RINGS fit, then score the result -- but the keep stopped caring
         about rings when it started taking every whole cell that clears (#38).
         The search was still optimising for a constraint the renderer no longer
         had, and complete rings only land well at fine pitches, so it drove the
         cells small: 19T picked 3.35 and laid down 102 of them, which reads as a
         mesh rather than as hexagons. Charles: "these don't look optimal".
         Dropping the ring test finds sizes that are both bigger AND fit better
         -- 19T goes to 4.75 with 48 cells and LESS bare span than the 3.35 it
         was choosing, 17T to 4.35 with 30.
         Ties on fit go to the LARGER cell, which is the counterweight the last
         version lacked: fit was bounded at both ends, size at neither. */
      /* THE SHARED FLOOR IS AN AIM, NOT A GATE -- because the alternative is a
         blank web, and a blank web is worse than a small cell (CL#138).

         hexcore's rings are anchored at the wheel CENTRE, so ring radii land on
         fixed multiples of the pitch and a ring is wholly in or wholly out.
         Bigger cells therefore do not degrade gracefully: past a point no ring
         lands inside the annulus at all and the sweep returns nothing. Measured
         when MIN_CUT was applied as a hard floor: 1 of 7 wheels went blank on a
         desk and 3 of 7 on a phone, where MIN_CUT converts to 12.23 solve units
         and asks for a hexagon 14.1 across.

         So the floor is tried, and if the blank cannot host a single ring at
         that size the sweep repeats at hexcore's OWN legibility floor -- the
         `px(3.9, 2.2, 6.0)` that shipped before this change, measured as where a
         cell stops reading as a hexagon and becomes a dot. That bounds the
         fallback: this can never draw a cell smaller than what already shipped,
         and can never leave a web empty that used to be full.

         It is the same trade the shell clearance already makes twenty lines up
         -- "the clearance is a nicety; having ANY pattern is not" -- applied to
         the cell floor, and it is why this is a list rather than a constant. */
      const CELL_FLOORS = [CELL_MIN, px(3.9, 2.2, 6.0)];
      /* THE SEARCH IS MEMOISED, AND THE KEY IS THE WHOLE RISK (GitHub #135).
         Measured with tools/render_cost.py: forced to this family, gearSvg was
         49.2ms of a 171.5ms first-render task at 6x CPU throttle against
         sunburst's 2.1ms, and the reason is arithmetic rather than drawing --
         the sweep below is CELL_FLOORS x rOutTry x ~n sizes at 0.05 steps, and
         every candidate size enumerates the WHOLE lattice with six Math.hypot
         per cell and then throws all but the winner away. The page renders its
         composition five times per cold load, so each wheel paid for that five
         times over.

         MEMOISED, NOT BISECTED, and that is a correctness decision rather than
         a preference. Feasibility is not monotonic in cell size: the rings are
         anchored at the wheel centre, so ring radii land on fixed multiples of
         the pitch and a ring is wholly in or wholly out -- the comment above
         records a 13-tooth wheel whose only feasible size sat just under one
         grid point. A bisection over a predicate that switches on and off along
         the axis is entitled to land somewhere else entirely, which would move
         the drawing; and CL#138's rule that the grid is anchored at the FLOOR
         exists precisely so the tested SET is fixed. Memoising cannot change
         which size wins, because it does not change the search at all.

         WHAT THE KEY CARRIES, and why each part of it is there. Everything the
         sweep and the keep read is one of these seven numbers -- checked line by
         line, not inferred from a profile -- so two calls agreeing on all seven
         cut an identical lattice. Drop one and the page draws a stale one:

           rInX          the inner boundary. Carries hubR, and through it the
                         wheel's radius, module and profile hub fraction.
           rOutTry[0]    coreOut, the shell-clearing outer limit. Both entries
           rOutTry[1]    are in the key because the fallback attempt reaches the
                         second, so the pair IS an input, not just the winner.
                         Carries wellR, and through it `marked` -- engravedRims
                         and character both move it.
           WALLX         LATTICE_WALL: the pitch's wall term. Viewport-dependent
                         through px(), and tooth-count-dependent through
                         1.2 * teeth / TEETH_MAX.
           CELL_FLOORS[0] MIN_CUT / sqrt(3). MIN_CUT is stated in PIXELS and
                         converted by px() (CL#137), so this is the component
                         that makes the key SCALE-DEPENDENT: omit it and a phone
                         is served the lattice solved for a desk.
           CELL_FLOORS[1] hexcore's own legibility floor, also through px(), and
                         load-bearing because the floor above is an AIM not a
                         gate (CL#138) -- which of the two floors actually
                         produced the answer is part of the answer.
           ceiling       the sweep's top end, already clamped and already folded
                         through g.cv.cellFrac / g.cv.cell, spanC and CELL_MAX.
                         Keyed on the derived value rather than on its three
                         inputs, so a future change to how the ceiling is
                         computed cannot leave the key behind.

         S itself is deliberately NOT in the key: it reaches the sweep only
         through px(), so it is already carried by WALLX and both floors, and
         adding it would only split entries that must agree. Same for g.teeth,
         which reaches it only through WALLX and the radii. If anything new is
         ever read in here, it belongs in this key -- and the seven above are
         inputs, not a summary. Do not simplify one out.

         The KEEP is inside the memo too, not only the sweep. It reads cellX,
         WALLX, rOutX and rInX and nothing else, all of them already determined
         by the key, so the cached value is the finished list of cut paths --
         which also retires vertsX from the repeat renders (5.2ms at 6x). */
      const hexMemo = this._hexMemo || (this._hexMemo = new Map());
      const hexKey = rInX + ':' + rOutTry[0] + ':' + rOutTry[1] + ':' + WALLX
                   + ':' + CELL_FLOORS[0] + ':' + CELL_FLOORS[1] + ':' + ceiling;
      /* WHAT BOUNDS THE MAP. One entry per distinct wheel geometry per distinct
         --gsfit, and --gsfit is quantised DOWN to 1% by fitStage() over a range
         of about 0.28..5.12, so a visitor dragging a window edge walks a bounded
         ladder of scales rather than a continuum -- but a long enough drag still
         accumulates a lattice per wheel per rung. Cleared wholesale at the cap
         instead of evicted one at a time: the cost of a miss is one sweep, the
         cost of an LRU is a second structure to keep honest, and 48 is several
         viewports' worth of a stage that only ever draws a couple of dozen
         wheels. Sized in ENTRIES rather than bytes, and each entry holds the cut
         paths for one wheel, which is the bulk of it. */
      const HEX_MEMO_MAX = 48;
      let hexCut = hexMemo.get(hexKey);
      if (!hexCut) {
        let cellX = 0, rOutX = rOutTry[0];
        for (let fi = 0; fi < CELL_FLOORS.length && !cellX; fi++) {
          const floorC = CELL_FLOORS[fi];
          const ceilingF = Math.max(floorC, ceiling);
          for (let attempt = 0; attempt < rOutTry.length && !cellX; attempt++) {
            rOutX = rOutTry[attempt];
            const seen = [];
            /* THE GRID IS ANCHORED AT THE FLOOR, NOT THE CEILING. Written as
               `for (c = ceilingF; c >= floorC; c -= 0.05)` the set of sizes
               actually tested depends on where the sweep STARTS, so moving the
               ceiling silently tests a different set -- and the floor itself is
               sampled only when the span happens to be a whole number of steps.
               That is how a 13-tooth wheel went blank at one viewport and not at
               a neighbouring one with identical rIn/rOut: the only feasible size
               sat just under the last grid point the ceiling happened to produce.
               Counting down from the floor samples floorC exactly, every time,
               and makes the tested set independent of the ceiling. Still walked
               largest-first, so the "larger cells win ties" rule is unchanged. */
            const nSteps = Math.max(0, Math.floor((ceilingF - floorC) / 0.05 + 1e-9));
            for (let si = nSteps; si >= 0; si--) {
              const c = floorC + si * 0.05;
              /* PITCH ADDS THE WALL ACROSS THE FLATS, not across the radius
                 (#62). Two hexagons meet flat-to-flat, and a hexagon's inradius is
                 sqrt3/2 of its circumradius -- so adding WALLX/2 to the
                 circumradius opens a gap of only WALLX * sqrt3/2, 13.4% thinner
                 than asked for. Measured 0.736-1.039 against a nominal 0.85-1.20.
                 Dividing by sqrt3 makes the gap the wall. */
              const step = c + WALLX / Math.sqrt(3), px = Math.sqrt(3) * step, ry2 = 1.5 * step;
              const at = (q, r) => [px * (q + r / 2), ry2 * r];
              const span = Math.ceil(rOutX / step) + 2;
              let ink0 = Infinity, ink1 = 0, n = 0;
              for (let k = 0; k <= span; k++) {
                for (const [q, r] of ringOf(k)) {
                  const P = at(q, r);
                  let v0 = Infinity, v1 = 0, ok = true;
                  for (let v = 0; v < 6; v++) {
                    const va = (90 + 60 * v) * Math.PI / 180;
                    const d = Math.hypot(P[0] + c * Math.cos(va), P[1] + c * Math.sin(va));
                    if (d > rOutX) { ok = false; break; }
                    v0 = Math.min(v0, d); v1 = Math.max(v1, d);
                  }
                  if (!ok || v0 < rInX) continue;
                  n++; ink0 = Math.min(ink0, v0); ink1 = Math.max(ink1, v1);
                }
              }
              if (!n) continue;
              seen.push({ c: c, waste: (ink0 - rInX) + (rOutX - ink1) });
            }
            if (!seen.length) continue;
            let best = Infinity;
            seen.forEach(r => { if (r.waste < best) best = r.waste; });
            /* among sizes that fit essentially as well, take the LARGEST cell */
            seen.forEach(r => { if (r.waste <= best + 0.35 && r.c > cellX) cellX = r.c; });
          }
        }
        hexCut = [];
        if (cellX) {
          /* THE SIZE is chosen by complete rings above, but the KEEP is exact.
             Charles, looking at a GitHub wheel: "isn't there space for even a few
             more hexagons on each side between the side of the shape and the
             curve of the inner circle". Measured across all twelve wheel-and-
             variant combinations, ten genuinely have no room -- the gap at the
             flats is real but narrower than a whole cell. Two do: 15T coarse by
             six cells, 19T fine by twelve.

             Those were being rejected by a test that asks `distance + c > rOut`,
             which treats every hexagon as a CIRCLE of radius c. A hexagon only
             reaches c toward its six vertices; everywhere else it is shorter, by
             up to 1 - cos(30). So cells that genuinely fit were being refused.
             The keep below tests the six VERTICES instead, and takes every whole
             cell that clears -- not only those in a complete ring.

             This cannot cost symmetry, which is the property that matters here:
             the lattice is six-fold symmetric about the centre and the test
             depends only on distance from it, so the kept set is closed under a
             60-degree rotation. A cell that fits guarantees its five partners
             fit. The patch gains symmetric bumps at the flats rather than an
             asymmetric edge -- and no cell is ever cut. */
          const step = cellX + WALLX / Math.sqrt(3), px = Math.sqrt(3) * step, ry2 = 1.5 * step;  /* see #62 above */
          const vertsX = (cx, cy) => {
            const o = [];
            for (let v = 0; v < 6; v++) {
              const va = (90 + 60 * v) * Math.PI / 180;
              o.push([cx + cellX * Math.cos(va), cy + cellX * Math.sin(va)]);
            }
            return o;
          };
          const span = Math.ceil(rOutX / step) + 2;
          for (let k = 0; k <= span; k++) {
            for (const [q, r] of ringOf(k)) {
              const cx = px * (q + r / 2), cy = ry2 * r;
              const V = vertsX(cx, cy);
              if (!V.every(v2 => Math.hypot(v2[0], v2[1]) <= rOutX)) continue;
              if (nearestEdge(V) < rInX) continue;   /* EDGE, not vertex (#45) */
              let d2 = '';
              for (let v = 0; v < 6; v++) {
                d2 += (v ? 'L' : 'M') + V[v][0].toFixed(2) + ',' + V[v][1].toFixed(2) + ' ';
              }
              hexCut.push(d2 + 'Z');
            }
          }
        }
        if (hexMemo.size >= HEX_MEMO_MAX) hexMemo.clear();
        hexMemo.set(hexKey, hexCut);
      }
      for (let ci = 0; ci < hexCut.length; ci++) holes.push(hexCut[ci]);
      amShells(inner);
      inner.push(h('circle', { key: 'boss', r: hubR * BOSS_MUL, fill: 'url(#' + id + 'u)', stroke: p[3], strokeWidth: 1.2, strokeOpacity: 0.55 }));
    } else if (kind === 'isogrid') {
      /* Equilateral triangles on a true Cartesian lattice -- the isogrid pattern
         real stiffened hardware uses, and the one Charles picked for covering the
         most area while every cell stays a proper equilateral triangle.

         SYMMETRY IS THE REQUIREMENT, not the boundary shape. The earlier
         ring-course honeycomb was rejected for lacking it: its walls between
         courses never lined up with the walls within a course. A triangular
         lattice centred on a LATTICE VERTEX has exact six-fold symmetry, so
         clipping it to a circle leaves a boundary that is six-fold too -- it
         steps, but it steps identically in all six sextants, which is what the
         eye actually reads as regular.

         Whole cells only, so no triangle is ever cut. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      /* Floor is in TRIANGLE sides, so it is far above the hex core's 3.1 for
         the same reason the variants are -- a 3.1 triangle is a speck. */
      const rInI = coreIn(hubR);
      /* FIT THE SIZE TO THE ANNULUS, the same way the hex core does. This took
         the triangle side straight from the variant and never checked it
         against the band, so a size that happened to suit one wheel left a wide
         bare ring on another. Sweep instead, score the bare span at BOTH
         boundaries, and break ties toward the LARGER cell so fitting better can
         never quietly mean finer. Relax to the pre-shell limit if nothing fits
         at all -- on the smallest wheels the band is barely one row deep, and a
         core that touches the inner shell beats a blank web. */
      const rOutTryI = [coreOut, wellR - 0.5];
      let sideI = 0, rOutI = rOutTryI[0];
      for (let a2 = 0; a2 < rOutTryI.length && !sideI; a2++) {
        rOutI = rOutTryI[a2];
        const seenI = [];
        /* THE FLOOR BELONGS ON THE CUT, NOT ON THE PITCH. `sd` is the lattice
           pitch; the opening is then shrunk about its centroid to leave the wall,
           so what is actually cut is sd - 1.732*WALL. Floored at a pitch of 5.2
           that yielded a 3.34-unit opening -- measured -- against a wall of ~1.06
           and its own 0.35 outline, so the borders were most of the cell and the
           pattern muddled. sunburst never goes below 7.41 and reads at every
           colour. Flooring the CUT makes the sweep stop at a coarser pitch, which
           is the same thing sunburst's maxLegible does: fewer, larger openings
           rather than more, finer ones. */
        const wallI0 = LATTICE_WALL;
        const sdFloor = MIN_CUT + 1.732 * wallI0;
        /* AND THE SEARCH MUST START AT OR ABOVE THE FLOOR. It counts DOWN from the
           dealt cell size, so a floor above that start meant the loop never ran at
           all and the fallback took over -- the floor was applied to a search that
           did not execute. Measured: min opening moved only 3.34 -> 4.12 and the
           opening COUNT went up, the opposite of fewer-and-larger. */
        const sdStart = Math.max(sdFloor, Math.min((g.cv && g.cv.cell) || 7.0, 11.5));
        for (let sd = sdStart; sd >= sdFloor; sd -= 0.1) {
          const pt = (i3, j3) => [sd * (i3 + j3 / 2), sd * (Math.sqrt(3) / 2) * j3];
          const nn = Math.ceil(rOutI / sd) + 3;
          let lo3 = Infinity, hi3 = 0, cnt = 0;
          for (let j3 = -nn; j3 <= nn; j3++) {
            for (let i3 = -nn; i3 <= nn; i3++) {
              const up3 = [pt(i3, j3), pt(i3 + 1, j3), pt(i3, j3 + 1)];
              const dn3 = [pt(i3 + 1, j3), pt(i3 + 1, j3 + 1), pt(i3, j3 + 1)];
              for (const t3 of [up3, dn3]) {
                let a3 = Infinity, b3 = 0, ok3 = true;
                for (const q3 of t3) {
                  const d3 = Math.hypot(q3[0], q3[1]);
                  if (d3 > rOutI) { ok3 = false; break; }
                  a3 = Math.min(a3, d3); b3 = Math.max(b3, d3);
                }
                if (!ok3 || nearestEdge(t3) < rInI) continue;
                cnt++; lo3 = Math.min(lo3, a3); hi3 = Math.max(hi3, b3);
              }
            }
          }
          if (cnt) seenI.push({ s: sd, waste: (lo3 - rInI) + (rOutI - hi3) });
        }
        if (!seenI.length) continue;
        let bw3 = Infinity;
        seenI.forEach(r3 => { if (r3.waste < bw3) bw3 = r3.waste; });
        seenI.forEach(r3 => { if (r3.waste <= bw3 + 0.5 && r3.s > sideI) sideI = r3.s; });
      }
      /* The fallback obeys the same floor -- it was the path actually taken when the
         sweep could not run, so leaving it at 5.6 pitch reintroduced the fine cell. */
      if (!sideI) sideI = Math.max(MIN_CUT + 1.732 * Math.max(px(1.06, 0.55, 2.4),
        1.2 * (g.teeth || TEETH_MAX) / TEETH_MAX), (g.cv && g.cv.cell) || 7.0);
      const ptI = (i2, j2) => [sideI * (i2 + j2 / 2), sideI * (Math.sqrt(3) / 2) * j2];
      const nI = Math.ceil(rOutI / sideI) + 3;
      for (let j2 = -nI; j2 <= nI; j2++) {
        for (let i2 = -nI; i2 <= nI; i2++) {
          const up = [ptI(i2, j2), ptI(i2 + 1, j2), ptI(i2, j2 + 1)];
          const dn = [ptI(i2 + 1, j2), ptI(i2 + 1, j2 + 1), ptI(i2, j2 + 1)];
          for (const t of [up, dn]) {
            if (!t.every(q2 => Math.hypot(q2[0], q2[1]) <= rOutI)) continue;
            if (nearestEdge(t) < rInI) continue;   /* EDGE, not vertex (#45) */
            /* shrink about the centroid so the gap between cells is the wall */
            const cxI = (t[0][0] + t[1][0] + t[2][0]) / 3, cyI = (t[0][1] + t[1][1] + t[2][1]) / 3;
            /* SHRINKING ABOUT THE CENTROID MOVES EACH EDGE IN BY
               (1-k) * INRADIUS, and an equilateral triangle's inradius is
               s/(2*sqrt3) -- not s/2 (#62). So 1 - w/s opened a gap of only
               0.577w: a nominal 1.2 measured 0.693, THINNER THAN THE 0.85 FLOOR
               this file elsewhere calls the aliasing limit, on every wheel at
               every viewport.
               BOTH neighbours move, so the gap is 2*(1-k)*inradius and the
               factor is sqrt3, not 2*sqrt3 -- the first correction here used
               3.464 and overshot to exactly double the wall, which is why this
               was measured rather than reasoned.
               Uses the same tooth-scaled wall as the hex core (#62/A4) rather
               than its own flat 1.2. */
            const WALLI = Math.max(px(1.06, 0.55, 2.4), 1.2 * (g.teeth || TEETH_MAX) / TEETH_MAX);
            const k2 = 1 - 1.732 * WALLI / sideI;
            holes.push('M' + t.map(q2 => (cxI + (q2[0] - cxI) * k2).toFixed(2) + ','
                                       + (cyI + (q2[1] - cyI) * k2).toFixed(2)).join(' L') + ' Z');
          }
        }
      }
      amShells(inner);
      inner.push(h('circle', { key: 'boss', r: hubR * BOSS_MUL, fill: 'url(#' + id + 'u)', stroke: p[3], strokeWidth: 1.2, strokeOpacity: 0.55 }));
    } else if (kind === 'polarbrick' || kind === 'polariso') {
      /* POLAR, not Cartesian -- and that is the whole point. The region to fill
         is an ANNULUS, between the boss and the engraving. A Cartesian lattice
         can never fill a ring: it either crops cells or leaves the crescents
         that #38 spent four attempts arguing about. A polar pattern is defined
         BY the annulus, so it fills it by construction and reaches the well
         circle exactly, with no leftover.

         Both variants below share the same course arithmetic and differ only in
         what they put in a course: annular cells laid like brickwork, or a
         triangulated band. Cell count per course is forced to a multiple of six
         and only ever DOUBLES going outward, so the whole figure keeps exact
         six-fold symmetry no matter how many courses it has -- the property the
         ring-course honeycomb lacked and was retired for. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      /* Scales with the wheel, like the hex core's (#62/A4) -- a flat wall is
         a fixed cost against an annulus that varies 3.9x across the train. */
      const WALLP = LATTICE_WALL;
      const rInP = coreIn(hubR), rOutP = coreOut;
      const spanP = rOutP - rInP;
      /* SAME FLOOR, SAME REASON AS isogrid: 3.6 floors the COURSE HEIGHT, but the
         cell is then shrunk by 1.732*WALLP to leave the wall, so what is actually
         cut was ~1.8-2.2 units -- measured 2.18, the finest opening on the page and
         the one that muddles worst. Floor the CUT and let the course grow, which
         yields fewer, taller courses rather than more, finer ones. */
      const target = Math.max(MIN_CUT + 1.732 * WALLP, (g.cv && g.cv.cell) || 5.0);
      const nC = Math.max(1, Math.round(spanP / target));
      const hC = spanP / nC;
      const XY = (rad, a) => [rad * Math.cos(a), rad * Math.sin(a)];
      const f2 = (q2) => q2[0].toFixed(2) + ',' + q2[1].toFixed(2);  /* XY above returns a pair for vector maths, so this formats rather than re-deriving */
      /* start from a multiple of six so every doubling stays a multiple of six */
      let kP = Math.max(6, Math.round(2 * Math.PI * (rInP + hC / 2) / hC / 6) * 6);
      for (let c = 0; c < nC; c++) {
        const r0 = rInP + c * hC, r1 = r0 + hC, rm = (r0 + r1) / 2;
        /* POLARBRICK_ASPECT_MAX is CHOSEN, not derived (GitHub #103) -- the one
           unexplained figure in an otherwise fully-derived family. Every other
           number here comes off MIN_CUT, LATTICE_WALL or the wheel's own
           radii; this one is a judgment call about how elongated a cell may
           get -- tangential width (2*PI*rm/kP) against radial height (hC) --
           before the course doubles its cell count rather than stretching
           further. No record of why 1.9 specifically. */
        if (2 * Math.PI * rm / kP > POLARBRICK_ASPECT_MAX * hC) kP *= 2;
        if (kind === 'polarbrick') {
          /* Alternate courses are offset half a cell, so no wall runs straight
             through the web -- the same reason a brick wall is laid in bond. */
          const off = (c % 2) * Math.PI / kP;
          const gapA = WALLP / rm, R0 = r0 + WALLP / 2, R1 = r1 - WALLP / 2;
          if (R1 <= R0) continue;
          for (let s = 0; s < kP; s++) {
            const a0 = off + s * 2 * Math.PI / kP + gapA / 2;
            const a1 = off + (s + 1) * 2 * Math.PI / kP - gapA / 2;
            if (a1 <= a0) continue;
            holes.push('M' + f2(XY(R0, a0)) + ' A' + R0.toFixed(2) + ',' + R0.toFixed(2)
              + ' 0 0 1 ' + f2(XY(R0, a1)) + ' L' + f2(XY(R1, a1)) + ' A' + R1.toFixed(2)
              + ',' + R1.toFixed(2) + ' 0 0 0 ' + f2(XY(R1, a0)) + ' Z');
          }
        } else {
          /* Consecutive rings are offset by HALF a step, so each vertex of one
             ring sits opposite the midpoint of the other -- that is what makes
             every triangle the same shape instead of alternating fat and thin. */
          const oA = c * Math.PI / kP, oB = (c + 1) * Math.PI / kP;
          const A = (s) => XY(r0, oA + s * 2 * Math.PI / kP);
          const B = (s) => XY(r1, oB + s * 2 * Math.PI / kP);
          /* Same centroid error as the isogrid (#62): a nominal 1.15
             measured 0.767, a factor of 2/3. These triangles are NOT
             equilateral -- they are annular, so their three edges sit at
             different distances from the centroid and no single factor is
             exact. Scaling by the inradius of the equivalent triangle is the
             closest correct form; the residual is under a tenth of a unit. */
          const shrink = 1 - 3.464 * WALLP / Math.max(hC, 3) / 2;
          for (let s = 0; s < kP; s++) {
            for (const t of [[A(s), A(s + 1), B(s)], [B(s), B(s + 1), A(s + 1)]]) {
              const cx2 = (t[0][0] + t[1][0] + t[2][0]) / 3, cy2 = (t[0][1] + t[1][1] + t[2][1]) / 3;
              holes.push('M' + t.map(q2 => (cx2 + (q2[0] - cx2) * shrink).toFixed(2) + ','
                                         + (cy2 + (q2[1] - cy2) * shrink).toFixed(2)).join(' L') + ' Z');
            }
          }
        }
      }
      amShells(inner);
      inner.push(h('circle', { key: 'boss', r: hubR * BOSS_MUL, fill: 'url(#' + id + 'u)', stroke: p[3], strokeWidth: 1.2, strokeOpacity: 0.55 }));
    } else if (kind === 'labyrinth') {
      /* Two staggered rings of arc slots, brake-rotor fashion. The stagger is
         the load path: every slot's ends land on solid metal in the other ring. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      const nL = g.arms || 5, rInL = Math.max(hubR * 1.55, 10), rOutL = wellR - 2;
      /* Ring count adapts to the annulus: three staggered rows where the depth
         allows (the big wheels), two where it does not -- Charles spotted that
         three fit and asked why they were not there. Slot width scales down as
         rows go up so every row keeps solid metal beside it. */
      const depthL = rOutL - rInL;
      /* HELD TO MIN_CUT (CL#138), and here the conversion is the identity: an
         arc slot is long tangentially and narrow RADIALLY, so `wL` -- its radial
         width -- is already the narrowest dimension MIN_CUT floors. No wall term
         and no geometry factor, unlike hexcore's across-the-flats or isogrid's
         wall inset.

         The old expression could not reach the floor at ANY depth: it was capped
         at 6 solve units against a MIN_CUT of 7.38 on a desk and 12.23 on a
         phone, so every slot this family ever cut was under the floor by
         construction.

         THE ROW COUNT YIELDS TO THE FLOOR, rather than the floor being trimmed
         to fit the rows. Row centres sit at fixed fractions of the depth, so the
         pitch between them is what bounds a slot's width -- widen past that and
         neighbouring rows merge into each other, which is worse than a thin
         slot and is a failure a still would not obviously show. So the widest
         legal slot is the row pitch less one wall, and if THAT cannot reach
         MIN_CUT the family drops a row and tries again: fewer, larger openings,
         exactly as a lattice that cannot host its cells at size cuts fewer of
         them. Two rows is the floor of the ladder -- below that it is not a
         labyrinth -- so a shallow annulus can still fall short, which is
         reported by the slot simply being as wide as the pitch allows.

         UNPHOTOGRAPHED, AND THAT IS NOT AN OVERSIGHT. labyrinth is retired --
         it has no CENTRE_FAMILIES entry, so it is never dealt, and
         `?kind=labyrinth` silently returns an ordinary mix rather than erroring.
         This is corrected so it is right if it is ever restored, and it is
         deliberately bounded by its own geometry rather than by a figure chosen
         by eye, because there is no picture to check a chosen figure against. */
      const rowFracsL = { 3: [0.2, 0.52, 0.84], 2: [0.3, 0.72] };
      const widestAt = (rows) => {
        const f = rowFracsL[rows];
        return depthL * (f[1] - f[0]) - LATTICE_WALL;
      };
      const rowsL = (depthL > 24 && widestAt(3) >= MIN_CUT) ? 3 : 2;
      /* Aim at the proportional width the family has always used -- that is what
         makes a deep annulus cut a broader slot than a shallow one, and it is
         worth keeping -- then floor it at MIN_CUT and cap it at the pitch. The
         order matters: the cap is applied LAST so a slot can never merge with
         its neighbour, even on an annulus too shallow to host the floor. */
      const wantL = depthL * (rowsL === 3 ? 0.15 : 0.22);
      const wL = Math.min(Math.max(wantL, MIN_CUT), Math.max(widestAt(rowsL), 1));
      const ring = (rr, nn, off, fill2) => {
        for (let k = 0; k < nn; k++) {
          const a0 = off + (k / nn) * 360, sw = (360 / nn) * 0.62;
          let d2 = '';
          for (let q = 0; q <= 5; q++) {
            const aa = (a0 + sw * (q / 5)) * Math.PI / 180;
            d2 += (q ? 'L' : 'M') + ((rr + wL / 2) * Math.cos(aa)).toFixed(2) + ',' + ((rr + wL / 2) * Math.sin(aa)).toFixed(2) + ' ';
