      togPanelStyle: {
        display: this.state.tog ? 'flex' : 'none', flexDirection: 'column', gap: PANEL_GAP + 'px',
        position: 'fixed', left: 'var(--offleft)', top: '50%', transform: 'translateY(-50%)',
        zIndex: 30, background: 'var(--chip)', border: '1px solid var(--hair)',
        borderRadius: '14px', padding: '10px 6px', boxShadow: 'var(--shadow)', minWidth: '190px',
        boxSizing: 'border-box',
        maxHeight: 'calc(100vh - var(--offtop) - var(--offbot))',
        overflowY: 'auto', overscrollBehavior: 'contain'
      },
      togPeople: togPeople,
      /* THE RULE BETWEEN THE PEOPLE AND THE GEARS IS ITS OWN ELEMENT, AND NOT A
         LINK. It used to be a menu entry -- a hairline drawn as an <a> with an
         empty href and no text, which the template has no way to hide from the
         accessibility tree, so it was a focusable element with no accessible
         name, and `a11y_audit` counts `a[href]` out of the DOM whether or not
         the panel is displayed. It was therefore FAILING on the shipped page,
         not waiting to: the picker's old gate was `people.length > 1` alone, and
         there have been two people since Harper was added.

         It is a bare <div>, drawn between the two lists rather than on the edge
         of either, so it is the rule it always was: a 1px hairline inset 10px
         from the panel's text, floating in 6px of gap. Hanging it off the first
         gear entry as a border-top instead put it on the top edge of a filled,
         rounded, ACTIVE pill -- which is what that entry is whenever no ?kind=
         is forced -- and stretched it the full width of the entry's box. */
      togSep: togPeople.length > 0,
      togSepStyle: { height: '1px', margin: '6px 10px', background: 'var(--hair)' },
      togList: (function () {
        const names = { spokes: 'Spoke slots', holes: 'Lightening drills', pockets: 'Kidney pockets',
          spiral: 'Curved spokes', iris: 'Iris blades', star: 'Star truss', honeycomb: 'Honeycomb',
          labyrinth: 'Labyrinth rotor', sunburst: 'Sunburst', planetary: 'Planetary (star gear)',
          hexcore: 'Hex core', ravigneaux: 'Ravigneaux (double row)',
          isogrid: 'Isogrid', polarbrick: 'Radial brickwork', polariso: 'Radial isogrid' };
        const item = (key, label) => {
          const active = key ? FORCE_KIND === key : !FORCE_KIND;
          return {
            href: key ? '?kind=' + key : (location.pathname || '/'),
            label: label, current: active ? 'true' : 'false',
            /* THE ACTIVE ROW'S LABEL TAKES THE PANEL'S GROUND, NOT THE PAGE'S
               (GitHub #151). It is a filled pill punched out of the panel, and
               the panel is --chip; the page's --bg is a surface this row never
               touches, so borrowing it was only ever "some light colour" and it
               was the WRONG light colour by 0.07 of a ratio: --bg #E1E4DD on the
               shipped steel accent #5F686E is 4.42:1 against text's 4.5:1 floor,
               and it failed a11y_audit's color-contrast in light. --chip is
               #FFFFFF there and reaches 5.69:1.
               It holds in dark too, and by the same argument rather than by
               luck: --chip inverts to #2A3034 while syncVars swaps the accent
               for its lighter counterpart (#AEB8BF), so the pill stays dark ink
               on a light fill at 6.63:1. Both themes clear the floor with the
               one token, and no branch here has to know which theme is on.
               AND THE INK IS NOW DERIVED FROM THE ACCENT RATHER THAN NAMED
               (GitHub #153). --chip beat --bg at all five accents, which is why
               it shipped, but it still left the four non-default ones under
               4.5:1 -- amber worst at 1.85:1 -- because no single token can be
               right for a colour chosen per person. rowOnAccentInk is
               inkOnAccent() at 1.4.3's ordinary-text floor, and it returns
               `var(--chip)` unchanged wherever --chip already clears it, which
               includes the shipped steel accent in both themes. So this line
               draws exactly what it drew before on what ships, and stops being
               a bet on one accent for everything else. */
            style: { display: 'block', padding: ROW_PAD_Y + 'px 12px', borderRadius: '9px', textDecoration: 'none',
              font: LIST_ROW_FONT,
              color: active ? rowOnAccentInk : 'var(--ink)',
              background: active ? 'var(--accent)' : 'transparent' }
          };
        };
        const out = [];
        /* Every other entry here is a plain family name, so "deal" was the odd word
           out -- it named the mechanism rather than the thing being chosen (#101).
           The "(default)" marker stays: it is the only thing in the list that says
           which entry you get without asking, and it is what aria-current pairs with. */
        out.push(item(null, 'Mixed (default)'));
        CENTRE_FAMILIES.forEach(f => {
          out.push(item(f.type, names[f.type] || f.type));
          /* The double row rides directly under the single, since it is the same
             family seen through a narrower pool rather than a family of its own. */
        });
        /* Candidates last, marked, so the menu doubles as the review sheet. */
        CANDIDATE_FAMILIES.forEach(f => out.push(item(f.type, (names[f.type] || f.type) + '  · candidate')));
        return out;
      })(),
      /* THE SLIDER DRIVES THE MACHINE LIVE; RELEASING IS WHAT PERSISTS. `input`
         fires while the thumb moves and drives the flywheel's target
         immediately, so the train answers a drag the same way it answers a
         flick -- the same ~900ms bleed that settles a flick carries it to the
         new pace, because the whole effect is on the master angle's
         integrator and nothing else (CL#96). `change` fires once on release
         and is the only thing that writes to localStorage, so a value merely
         passed through mid-drag is never the one that survives a reload.

         The guard matters more than it looks: setState re-renders the whole
         page, gear art included, so a redundant one is expensive. step=1 means
         the value can only change at a stop boundary, but a browser that
         fired the event spuriously would otherwise re-render the train on
         every pointer sample. */
      onSpeedInput: (e) => {
        const next = SPEED_STOPS[Math.max(0, Math.min(speedSpan, +e.target.value))];
        if (next !== this.state.speed) this.setState({ speed: next });
      },
      onSpeedCommit: (e) => {
        const next = SPEED_STOPS[Math.max(0, Math.min(speedSpan, +e.target.value))];
        try { localStorage.setItem('wozi-speed', String(next)); } catch (err) {}
        if (next !== this.state.speed) this.setState({ speed: next });
      },
      /* SAME SPLIT AS SPEED: `input` drives the machine live while the thumb
         moves, `change` is the only thing that persists. Wear is not on the
         flywheel's own integrator, so there is no coast to carry it -- the
         marks simply redraw at the new depth on the next render, which
         setState already gives for free. */
      onWearInput: (e) => {
        const next = Math.max(0, Math.min(100, +e.target.value)) / 100;
        if (next !== this.state.wear) this.setState({ wear: next });
      },
      onWearCommit: (e) => {
        const next = Math.max(0, Math.min(100, +e.target.value)) / 100;
        try { localStorage.setItem('wozi-wear', String(next)); } catch (err) {}
        if (next !== this.state.wear) this.setState({ wear: next });
      },
      wearMax: 100,
      wearPos: wearPos,
      wearTitle: 'Wear ' + wearPos + '%',
      wearValueText: wearPos + '%',
      wearMark: wearPos + '%',
      /* ONE TAP BACK TO NORMAL, not a step through the ladder -- the corner
         control's whole job now (GitHub #108). It reaches the exact same
         state key the slider does, at the ladder's floor: speedFactor()
         stays the only thing either control touches. */
      resetSpeed: () => {
        try { localStorage.setItem('wozi-speed', String(SPEED_FLOOR)); } catch (e) {}
        this.setState({ speed: SPEED_FLOOR });
      },
      speedMax: speedSpan,
      speedPos: speedPos,
      /* Sighted equivalent of aria-valuetext: read on hover/long-press rather
         than on every change, so it can afford to say the same thing. */
      speedTitle: 'Gear speed ' + speedNow + '×'
        + (speedStrobes ? ', strobing — benchmark only' : ''),
      /* THE NAME IS FIXED ("Gear speed", written on the element itself), THE
         VALUE IS NOT: a range input announces its name once and its value on
         every change, so the multiplier and the strobing note belong here,
         not in aria-label -- putting them there would re-announce "Gear speed
         5×" on every step of a drag.

         AND IT SAYS WHERE THE ILLUSION ENDS. Past strobeSpeed() the teeth are
         sampled below Nyquist and the train reads as standing still or
         running backwards; those stops are kept because a benchmark stop is
         allowed to look wrong, but a control that hands one over without
         saying so is worse than one that admits it. Screen readers get it in
         words on every change; everyone else gets it in the colour of the
         thumb, the readout and the track fill, below. */
      speedValueText: speedNow + '×' + (speedStrobes ? ', strobing — benchmark only' : ''),
      /* THE CORNER'S OWN LABEL. It is the one place left in the corner that
         shows a value at all, so CL#96's rule -- every stop at or above
         strobeSpeed() says so in its accessible name -- still has to hold
         here too, not only on the slider. It also says what a tap DOES,
         because a control whose whole job is "the way back" has to say so to
         be found by a screen reader that cannot see it appear. */
      speedLabel: 'Gear speed ' + speedNow + '×'
        + (speedStrobes ? ', strobing — benchmark only' : '')
        + ' — tap to reset to 1×',
      speedMark: speedNow + '×',
      /* THE CORNER CONTROL'S STYLE IS A RENDER VALUE, THE ONLY FIXED CONTROL'S
         THAT IS -- see CLAUDE.md. The rest of the declaration is the row's,
         verbatim; `right` places it in the outermost slot (index 3, the one
         the menu toggle gave up so the three permanent buttons could close
         ranks at 0/1/2), `color` moves to --accent once the stop strobes, and
         `display` is 'none' at exactly 1x. That last ternary is the whole of
         "the corner shows nothing at 1x" (GitHub #108). */
      speedStyle: {
        position: 'fixed', top: 'var(--offtop)',
        right: 'calc(var(--offright) + (var(--btn) + var(--btngap)) * 3)',
        zIndex: 20, display: speedNow === SPEED_FLOOR ? 'none' : 'flex',
        alignItems: 'center', justifyContent: 'center',
        width: 'var(--btn)', height: 'var(--btn)', padding: 0, border: 0,
        borderRadius: '999px', background: 'transparent',
        color: speedStrobes ? 'var(--accent)' : 'var(--muted)',
        cursor: 'pointer', transition: 'color .18s ease',
        font: "700 var(--icon)/1 'Manrope',system-ui,sans-serif",
        fontVariantNumeric: 'tabular-nums', letterSpacing: '-0.02em'
      },
      /* THE MENU ROW THE SLIDER SITS IN: full width of the panel less its own
         padding, readout to the slider's left so the number a drag is
         approaching is read before the thing moving toward it. Padding
         matches the Table of Gears list's own vertical rhythm (GitHub #127)
         -- the row's visible footprint now falls out of the label/readout
         line rather than out of the input's 44px hit box, which is what
         speedTrackStyle's margin does below; this padding is the other half
         of that split. */
      speedRowStyle: {
        display: 'flex', alignItems: 'center', gap: '10px',
        padding: ROW_PAD_Y + 'px 12px',
        /* The anti-overlap gap belongs on the boundary BETWEEN Speed and
           Wear specifically, not on the panel's general row gap -- every
           other row here has no oversized hit box to protect. See
           rowAntiOverlapGap's comment above. */
        marginBottom: rowAntiOverlapGap
      },
      /* THE VISIBLE LABEL (GitHub #127) -- "Machine Settings" names the
         group, not this control, and a numeric readout with no word next to
         it read as unlabelled to anyone not using a screen reader (the
         accessible name is still carried by the input's own aria-label;
         this is purely the sighted half). Same font as a Table of Gears row
         (LIST_ROW_FONT) so the two lists in this panel read as one type
         system rather than two. minWidth is shared with Wear's label so
         both rows' tracks line up regardless of which word is shorter. */
      speedLabelStyle: {
        flex: '0 0 auto', minWidth: rowLabelMinWidth,
        color: 'var(--ink)', font: LIST_ROW_FONT
      },
      /* The readout's colour is the only thing about it that depends on
         state, exactly like the corner control's did, and for the same
         reason. minWidth is pinned to the widest multiplier the ladder can
         produce, derived rather than guessed, so the slider does not shuffle
         sideways as the thumb moves.

         LIST_ROW_FONT_BOLD, not var(--icon) (GitHub #134) -- see that
         constant's comment for why the menu readout is deliberately quieter
         than the corner departure indicator that still uses --icon. */
      speedReadStyle: {
        flex: '0 0 auto', textAlign: 'right',
        minWidth: (String(SPEED_STOPS[SPEED_STOPS.length - 1]).length + 1) + 'ch',
        color: speedStrobes ? 'var(--accent)' : 'var(--muted)',
        font: LIST_ROW_FONT_BOLD,
        fontVariantNumeric: 'tabular-nums', letterSpacing: '-0.02em'
      },
      /* THE TRACK IS PAINTED HERE, NOT IN THE STYLE BLOCK, because it depends
         on the value: a background-image gradient on the input itself, filled
         to the thumb in the SAME colour the thumb and the readout use, --hair
         beyond it. Percentages inside a gradient resolve against the
         gradient line (the element's own width), which is why speedAt()'s
         math lands where the thumb actually is; a background-position
         percentage resolves against (box - image) instead and would land
         somewhere else, which is why this is a gradient layer and not a
         positioned one.

         --thumb-color is set here too and read by the pseudo-element rule in
         the <style> block -- the mechanism a pseudo-element leaves for being
         reached from a render value, since it takes no style attribute of
         its own. This is the whole of "the strobe warning is carried by
         colouring the thumb itself" (GitHub #108): one colour, computed once,
         landing on the thumb through a CSS custom property and on the track
         and the readout through ordinary inline style -- so all three flip
         together at the stop where the illusion actually breaks, rather than
         a tick trying to mark it and disappearing under the thumb that sits
         on it (GitHub #69's A/B finding). */
      speedTrackStyle: (function () {
        const fill = speedStrobes ? 'var(--accent)' : 'var(--muted)';
        const at = speedAt(speedPos, speedSpan);
        return {
          flex: '1 1 auto',
          '--thumb-color': fill,
          backgroundImage: 'linear-gradient(90deg,' + fill + ' 0 ' + at + ',var(--hair) ' + at + ' 100%)',
          backgroundSize: '100% var(--trk)',
          backgroundPosition: 'center',
          backgroundRepeat: 'no-repeat',
          /* GitHub #127: var(--btn) (44px, set in the shared input[type="range"]
             rule) is the WCAG touch-target floor and does not shrink -- what
             shrinks is how much of that 44px the ROW allocates in flow, the
             same hit-vs-visible split the corner button already makes between
             its 44px button box and its var(--icon) glyph. margin does not
             change the input's own rendered size, only where it sits and how
             much flow space it reserves, so pulling it in by the same formula
             already used to centre --thumb inside --trk (here generalised to
             --btn inside --trk) lets the row's flow height fall out of the
             label/readout line instead of the input's full height, while the
             actual hit box still overflows above and below by the same
             amount -- unshrunk, just no longer dictating the row's height. */
          margin: 'calc((var(--trk) - var(--btn)) / 2) 0'
        };
      })(),
      /* SAME ROW/READOUT SHAPE AS SPEED'S, minus the strobe colour switch --
         wear has no benchmark stops to warn about, so its fill is always
         --muted. speedAt() is reused rather than restated: it is generic
         over any (position, span) pair, not specific to SPEED_STOPS. */
      wearRowStyle: { display: 'flex', alignItems: 'center', gap: '10px', padding: ROW_PAD_Y + 'px 12px' },
      /* Same label as Speed's, same reasoning -- see speedLabelStyle. */
      wearLabelStyle: {
        flex: '0 0 auto', minWidth: rowLabelMinWidth,
        color: 'var(--ink)', font: LIST_ROW_FONT
      },
      wearReadStyle: {
        flex: '0 0 auto', textAlign: 'right', minWidth: '4ch',
        color: 'var(--muted)',
        /* Same line as Speed's, same reason -- see LIST_ROW_FONT_BOLD. */
        font: LIST_ROW_FONT_BOLD,
        fontVariantNumeric: 'tabular-nums', letterSpacing: '-0.02em'
      },
      wearTrackStyle: (function () {
        const fill = 'var(--muted)';
        const at = speedAt(wearPos, 100);
        return {
          flex: '1 1 auto',
          '--thumb-color': fill,
          backgroundImage: 'linear-gradient(90deg,' + fill + ' 0 ' + at + ',var(--hair) ' + at + ' 100%)',
          backgroundSize: '100% var(--trk)',
          backgroundPosition: 'center',
          backgroundRepeat: 'no-repeat',
          /* Same hit-vs-visible split as speedTrackStyle's -- see its comment. */
          margin: 'calc((var(--trk) - var(--btn)) / 2) 0'
        };
      })(),
      /* THE THREE #125 STYLE LAYERS, as a live checkbox list (Charles's own
         ask, 2026-08-11) rather than round-tripping a screenshot per change.
         `checked` reads through layerOn(), the same method gearSvg() calls
         to decide what to draw -- one home for "state over schema default",
         not two copies of the same fallback rule. */
      styleToggles: [
        { key: 'timing', label: 'Timing marks' },
        { key: 'lineWork', label: 'Line-drawn teeth' },
        { key: 'knurl', label: 'Knurled rim' }
      ].map((t) => {
        /* Read ONCE per row and used for both the input's own `checked` and the
           switch's knob position, so the box can never draw a state the control
           is not in. */
        const on = this.layerOn(t.key);
        return {
        label: t.label,
        ariaLabel: t.label,
        checked: on,
        onChange: (e) => {
          const next = e.target.checked;
          try { localStorage.setItem('wozi-' + t.key, String(next)); } catch (err) {}
          this.setState({ [t.key]: next });
        },
        /* PADDING TIGHTENED FROM 5px TO 2px (GitHub #125, caught by
           devices.py): the 24px control is a WCAG floor and cannot shrink,
           so padding is the only slack this row has, and three of them
           stacked in the panel pushed the last past the safe-area rectangle
           by 12px on the shortest landscape phone profile (iPhone 13/14).
           Confirmed by re-running devices.py after the change. Still 2px:
           #134's compaction is ROW_PAD_Y and the readout line, neither of
           which this row has. */
        rowStyle: { display: 'flex', alignItems: 'center', gap: '8px', padding: '2px 12px',
          font: LIST_ROW_FONT, color: 'var(--ink)', cursor: 'pointer' },
        /* A TOGGLE SWITCH, NOT A CHECKBOX (GitHub #134, Charles's pick from the
           six-treatment sweep). Still a real <input type="checkbox"> -- the
           label still activates it, the space bar still flips it, and it still
           announces as a checkbox -- with `appearance:none` so the box below is
           what draws instead of the platform's own control. That also fixes
           something the native box did wrong in passing: `accent-color` tints
           the CHECKED state and leaves the unchecked box pure white in BOTH
           themes, so the shipped control ignored dark mode entirely.

           THE KNOB IS A radial-gradient, WHICH IS WHY THERE IS NO
           PSEUDO-ELEMENT HERE. A ::before would need a CSS rule, and the only
           pseudo-element rules in this file are the ones a range input leaves
           no alternative to (see the <style> block) -- a switch does have an
           alternative, so it uses it and the style stays inline where the rest
           of this panel's styling lives. The gradient's centre is the state:
           SWITCH_OFF_CX or SWITCH_ON_CX, one home each, SWITCH_TRAVEL apart by
           construction. See the SWITCH_* block above for why that positional
           cue is the requirement and not a decoration.

           THE KNOB TAKES WHICHEVER TOKEN CONTRASTS WITH THE SLOT IT IS IN, and
           that is not a flourish -- it is what makes the positional cue
           legible at all. A knob painted --chip in both states was measured at
           1.28:1 against the off slot in light and 1.20:1 in dark, which is
           invisible: --chip is the PANEL's colour and --bg is the page's, and
           those two are deliberate neighbours in both themes, so a --chip knob
           in a --bg slot is a white disc on white. Off it is --muted, which is
           3.26:1 in light and 6.14:1 in dark; on it is --chip against the
           filled slot, 5.69:1 and 6.63:1 at the shipped steel accent.

           THE ON FIGURE DEPENDED ON THE ACCENT AND ONE OF THE FIVE WAS WEAK,
           AND IT IS NOW DERIVED (GitHub #153). config.js's ACCENTS are
           per-person and syncVars writes the chosen one onto the root, so this
           was never one number: white-on-amber (#F4B32B) measured 1.86:1 in
           light against 3.21-3.98:1 for red, blue, green and steel -- under
           1.4.11's 3:1 for a component state. knobOnAccentInk is inkOnAccent()
           at that floor, so the knob takes whichever of --chip / --ink has the
           contrast and only leaves the tokens behind if neither does. On steel
           it returns `var(--chip)` and nothing about the shipped switch moves;
           on amber it returns `var(--ink)`, which is 7.44:1.

           THE POSITIONAL CUE IS UNTOUCHED AND MUST STAY THAT WAY. #134's sweep
           found that NO candidate reaches 3:1 for on-versus-off in light at any
           palette on offer, which is why this control was chosen: the knob
           MOVES, SWITCH_TRAVEL from one end to the other. Deriving the ink
           raises the knob-against-its-own-slot ratio and changes nothing about
           that -- it is not a licence to make the state colour-carried. */
        boxStyle: {
          appearance: 'none', WebkitAppearance: 'none',
          width: SWITCH_W + 'px', height: SWITCH_H + 'px',
          margin: 0, flex: '0 0 auto', boxSizing: 'border-box',
          cursor: 'pointer', borderRadius: (SWITCH_H / 2) + 'px',
          border: '1px solid var(--hair)',
          backgroundColor: on ? 'var(--accent)' : 'var(--bg)',
          backgroundImage: 'radial-gradient(circle ' + SWITCH_KNOB_R + 'px at '
            + (on ? SWITCH_ON_CX : SWITCH_OFF_CX) + 'px 50%,'
            + (on ? knobOnAccentInk : 'var(--muted)') + ' 0 96%,rgba(0,0,0,0) 100%)',
          /* The pill reads as a recess in both states; only the knob and the
             fill move. Slightly softer when on so the accent fill is not also
             carrying a shadow that says "still empty". */
          boxShadow: on ? 'inset 0 1px 2px rgba(0,0,0,.16)'
                        : 'inset 0 1px 3px rgba(0,0,0,.18)',
          /* Colour only, the same 180ms every other control here uses. The
             KNOB is deliberately not transitioned: a gradient's interpolation
             is not something to rely on across engines, and a switch that
             snaps is honest about a state that is binary. */
          transition: 'background-color .18s ease'
        }
        };
      }),
      toggleMotion: () => {
        const next = this.motionActive() ? 'rest' : 'run';
        try { localStorage.setItem('wozi-motion', next); } catch (e) {}
        this.setState({ motion: next });
      },
      motionLabel: this.motionActive() ? 'Pause the machine' : 'Run the machine',
      motionPressed: this.motionActive() ? 'true' : 'false',
      motionIcon: this.motionActive()
        ? h('svg', { 'aria-hidden': 'true', focusable: 'false', width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8, strokeLinecap: 'round' },
            h('path', { d: 'M9 5v14M15 5v14' }))
        : h('svg', { 'aria-hidden': 'true', focusable: 'false', width: 20, height: 20, viewBox: '0 0 24 24', fill: 'currentColor', stroke: 'currentColor', strokeWidth: 1.4, strokeLinejoin: 'round' },
            h('path', { d: 'M8 5.5v13l11-6.5z' })),
      themeIcon: this.state.theme === 'dark'
        ? h('svg', { 'aria-hidden': 'true', focusable: 'false', width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8, strokeLinecap: 'round' },
            h('circle', { cx: 12, cy: 12, r: 4.4 }),
            h('path', { d: 'M12 2.6v2.6M12 18.8v2.6M2.6 12h2.6M18.8 12h2.6M5.4 5.4l1.9 1.9M16.7 16.7l1.9 1.9M18.6 5.4l-1.9 1.9M7.3 16.7l-1.9 1.9' }))
        : h('svg', { 'aria-hidden': 'true', focusable: 'false', width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8, strokeLinejoin: 'round' },
            h('path', { d: 'M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z' })),
      toggleTheme: () => {
        const next = this.state.theme === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('wozi-theme', next); } catch (e) {}
        this.apply(next);
      },
      brandName: brand.name,
      brandTld: brand.tld
    };
  }
}
</script>
</body>
</html>
