       a bridge and starts reading as a wandering chain. Not a new tuned number:
       it is the width of the bearing range the serpentine itself is dealt from,
       so the two move together. */
    const BRIDGE_SWING = ANG_MAX - ANG_MIN;
    const bridgeRuns = [];
    /* A TREE HAS MORE THAN TWO ENDS. The rule is that the machine's extremities
       push apart so the run reads as a line rather than a closed ring; with one
       chain that is the first and last wheel, but a branch adds an end. Leaves
       and the root are the extremities.

       AND THE EXTREMITIES ARE THE SPINE'S. Read as "any two leaves" the rule
       over-applies the moment the tree is bushy: two chains hanging off one spine
       are both leaves, and they are MEANT to sit one bridge apart rather than be
       shoved a further ENDS_APART from each other -- which surfaces as the nudge
       loop growing d by 12% over and over until something lands. The spine is the
       line that has to read as a line; a branch hangs off it. On a single chain
       every wheel is spine, so this is the old rule exactly -- the root and the
       one leaf, and no other pair. */
    const hasChild = new Array(TRAIN.length).fill(false);
    TRAIN.forEach(t => { if (t.parent != null) hasChild[t.parent] = true; });
    const isLeaf = (i) => !hasChild[i];
    const isEnd = (i) => TRAIN[i].person === SPINE_SLUG
      && (isLeaf(i) || TRAIN[i].parent == null);
    /* WHERE A BRIDGE HANGS FROM IS SOLVED, NOT PLACED. Candidates are tried from
       the middle of the chain immediately above this one outward, so a branch
       balances the run it hangs from rather than hanging off one end, and then
       -- falling back -- onto the chains above that one and finally the spine,
       which is how a chain still arrives once the one above it has no clear
       bearing left. A candidate is rejected when any wheel of the bridge OR OF
       THE CHAIN IT FEEDS would foul a wheel already placed, when the run would
       pass over one, or when it would cross a bridge already run.

       DECIDED ONCE AND CACHED ON THE INSTANCE, exactly as the slug seating above
       is and for the same reason (#55): solve() re-runs at every quantised resize
       step, and a bridge free to re-choose would walk along the spine while a
       window edge was being dragged. The one input it cannot survive a change in
       is the number of idlers, which is why the cache is keyed on that above. */
    const bridgeAnchor = (b) => {
      if (!this._bridgeAt) this._bridgeAt = {};
      if (this._bridgeAt[b.person] !== undefined) return this._bridgeAt[b.person];
      /* RANKED IN TIERS COMPARED IN ORDER, not added up. The weights here were
         1000 and 500 laid over |k - mid|, which is a tier ordering only while
         that last term stays under 500 -- true of every stage shipped today and
         silently untrue of a longer one, at which point a distant spine wheel
         would outrank a near one on the wrong chain. Comparing the tiers in
         sequence leaves nothing to hold:

           1. THE EXACT WHEEL THE DRIVE IS MEANT TO COME OFF, when there is one
              (CL#123). A later sibling takes its power off the LEAD GEAR of the
              sibling before it -- `b.at` -- because you do not take four power
              take-offs off one gear, you cascade them. A first child has no such
              wheel: it may take its drive anywhere on its parent's chain, and
              this tier is flat for every candidate.
           2. HOW FAR THE CANDIDATE'S CHAIN IS FROM THE ONE THIS CHAIN IS MEANT TO
              BE DRIVEN BY, walking the drive path -- the designated source, then
              whatever drives THAT, and so on back to the spine. So a failed hop
              falls back to the sibling before it, then to the parent, then to the
              parent's own source: the chain arrives out of drive order but never
              on top of another, and the fallback is stated rather than being
              whatever the ranking happened to do. Anything off that path ranks
              behind all of it, nearest-placed first.
              For a chain with no drive source at all -- an independent one, whose
              only use for this search is a POSITION -- the path is empty and this
              reduces to the old rule exactly: prefer the chain immediately above,
              which is what lays them out in CHAIN_ORDER from the TOP in landscape
              and from the LEFT in portrait (Charles, 2026-08-02, 2026-08-05).
           3. a linked wheel before an idler -- a drive run should hang off a
              machine, not off another run;
           4. nearest the middle of ITS OWN chain, so a branch balances the run
              it hangs from rather than hanging off one end. Measured against the
              spine's middle this was meaningless for a cascade, which is the
              only case it is ever asked about.

         An idler ranks with the chain it feeds: that is where it sits in the
         layout, one row nearer the spine than that chain. */
      const midOf = (k) => {
        if (TRAIN[k].person == null) return k;          /* an idler is its own middle */
        const head = HEAD_OF[TRAIN[k].person] || 0;
        let n = 0;
        while (TRAIN[head + n] && TRAIN[head + n].person === TRAIN[k].person) n++;
        return head + (n - 1) / 2;
      };
      /* THE DRIVE PATH THIS CHAIN IS MEANT TO REACH BACK ALONG: its own source,
         then that source's source, and so on. Walked once per bridge rather than
         once per candidate, and guarded against revisiting a name -- CHAIN_PARENT
         has already refused every cycle it could see, so this cannot loop, and
         the guard is there because a walk that CAN loop must never be one edit
         away from doing it. */
      const drivePath = (function () {
        const path = [];
        let at = b.from;
        while (at != null && path.indexOf(at) < 0) { path.push(at); at = DRIVE_FROM[at]; }
        return path;
      })();
      const driveDist = (slug) => {

       WHEELS WITHIN A CHAIN ARE NOT COMPARED. They mesh, so their tip circles
       interpenetrate by two addenda by construction -- and the wheel a bridge
       hangs off meshes the first idler across a chain boundary, so meshing pairs
       are excluded by their parentage rather than by whose chain they are in. */
    const chainOf = (k) => k.person != null ? k.person : TRAIN[k.i].bridge;
    const foul = [];
    for (let p = 0; p < g.length; p++) {
      for (let q = p + 1; q < g.length; q++) {
        if (chainOf(g[p]) === chainOf(g[q])) continue;
        if (parentOf[g[p].i] === g[q].i || parentOf[g[q].i] === g[p].i) continue;
        const d = Math.hypot(g[p].x - g[q].x, g[p].y - g[q].y);
        if (d < g[p].ro + g[q].ro) {
          foul.push(chainOf(g[p]) + ' wheel ' + g[p].i + ' × ' + chainOf(g[q])
            + ' wheel ' + g[q].i + ' overlap by ' + (g[p].ro + g[q].ro - d).toFixed(1));
        }
      }
    }
    if (foul.length) console.warn('wozi: chains overlap — ' + foul.join('; '));
    let minX = Math.min.apply(null, g.map(k => k.x - k.ro)) - 6;
    let minY = Math.min.apply(null, g.map(k => k.y - k.ro)) - 6;
    let maxX = Math.max.apply(null, g.map(k => k.x + k.ro)) + 6;
    let maxY = Math.max.apply(null, g.map(k => k.y + k.ro)) + 6;
    /* CENTRE THE HUBS, NOT THE TOOTH ENVELOPE (#2). The stage is centred by the
       flex container using this box, and the box is the outer extent of the
       teeth -- so whenever the two end wheels differ in size, the row of HUBS
       sits off centre inside it even though the box itself is perfectly placed.
       That is the whole of #2, and it went from invisible to a 10% offset the
       moment a wheel was retired and the ends stopped being near-equal.

       The eye reads the row of badges as "the train", not the tooth envelope, so
       the box is grown on whichever side is short until it is symmetric about
       the midpoint of the hubs. Nothing moves relative to anything else -- only
       the frame the whole assembly is centred within. The outriggers are placed
       in this same space afterwards and follow it. */
    const hubMidX = (Math.min.apply(null, g.map(k => k.x)) + Math.max.apply(null, g.map(k => k.x))) / 2;
    const hubMidY = (Math.min.apply(null, g.map(k => k.y)) + Math.max.apply(null, g.map(k => k.y))) / 2;
    const halfX = Math.max(hubMidX - minX, maxX - hubMidX);
    const halfY = Math.max(hubMidY - minY, maxY - hubMidY);
    minX = hubMidX - halfX; maxX = hubMidX + halfX;
    minY = hubMidY - halfY; maxY = hubMidY + halfY;
    g.forEach(k => { k.cx = k.x - minX; k.cy = k.y - minY; });
    const chains = g.filter(k => k.chainFrom !== null && k.chainFrom !== undefined).map(k => ({ a: g[gi[k.chainFrom]], b: k }));
    /* THE BRIDGES, AS RUNS, in the same normalised space the gears' cx/cy are in
       -- built above in raw solve coordinates, so they are shifted here with
       everything else rather than by a second copy of the centring rule.

       KEPT SEPARATE FROM `chains`, which is the dormant chain-and-belt
       capability's list and is DRAWN. A bridge is meshed metal and draws nothing:
       this is the line the metal occupies, published so that anything placing a
       run afterwards can refuse to cross it. fitEscapes is the caller that needs
       it -- a branch's escape run is solved in screen space, after the fit, and
       until now it was tested against other escape runs only, so a bridge was
       the one run on the page it could cross without anything noticing. */
    const bridges = bridgeRuns.map(s => s.map(p => ({ cx: p.x - minX, cy: p.y - minY })));
    /* The wordmark hangs from the lowest wheel on two cords, clear of every gear. */
    /* WHICH MESH EACH WHEEL BELONGS TO (GitHub #122, CL#142).

       Two chains that share no gearing are two machines, and until now they
       shared one flywheel: `applyRotation()` wrote every wheel on the page off a
       single `_M`, so grabbing or holding one chain moved the other. The config
       already said otherwise -- a self-driven root is a separate mesh, and
       CLAUDE.md states it always will be -- and so did the geometry.

       Components are derived the SAME WAY tools/dom_invariants.py derives the
       number it reports: union-find over pairs whose centre distance equals the
       sum of their pitch radii. Deriving it any other way would let the page and
       its gate disagree about what "connected" means, which is the class of
       fault #67 was. Ghost idlers are included, because a bridge run is exactly
       what makes two chains ONE machine -- a chain reached by a bridge shares
       its parent's flywheel, and only a chain nothing on stage drives gets its
       own. A refused bridge therefore separates a component by itself, with no
       extra bookkeeping, which is the same cascade CL#123 already describes. */
    const MESH_TOL = 0.5;
    const parent = g.map((_, i) => i);
    const find = (x) => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
    for (let i = 0; i < g.length; i++) {
      for (let j = i + 1; j < g.length; j++) {
        const d = Math.hypot(g[i].cx - g[j].cx, g[i].cy - g[j].cy);
        if (Math.abs(d - (g[i].r + g[j].r)) < MESH_TOL) {
          const a = find(i), b = find(j);
          if (a !== b) parent[a] = b;
        }
      }
    }
    /* Renumbered to 0..n-1 so the component id can index a dense array of
       flywheels rather than a sparse map keyed by whichever wheel won the
       union. */
    const seen = {};
    let nComp = 0;
    g.forEach((w, i) => {
      const root = find(i);
      if (seen[root] === undefined) seen[root] = nComp++;
      w.comp = seen[root];
    });
    this._solved = { gears: g, chains: chains, bridgeRuns: bridges, comps: nComp,
      w: maxX - minX, h: maxY - minY };
    return this._solved;
  }

  /* WHICH TWO WHEELS THE WEAR CONTROL MARKS, memoized alongside `_solved`
     (GitHub #112). The largest and smallest tooth count OF THE SPINE only --
     a wheel does not change which extreme it is because a slider moved, and
     this is what keeps that true: read once per solve, never re-chosen on a
     drag. Idlers and ghosts are excluded (`role === 'link'`) -- a wear mark
     is content, like the engraving, not decoration.

     A SPINE OF ONE WHEEL MARKS ONLY THAT WHEEL, at the "largest" severity.
     Largest and smallest would otherwise both resolve to the same physical
     wheel, and there is no sensible way to paint two different depths of
     fracture onto one tooth blank. */
  wearWheels() {
    if (this._wearWheels) return this._wearWheels;
    const solved = this.solve();
    let maxI = null, minI = null, maxT = -1, minT = Infinity;
    solved.gears.forEach(g => {
      if (g.role !== 'link' || g.person !== SPINE_SLUG) return;
      if (g.teeth > maxT) { maxT = g.teeth; maxI = g.i; }
      if (g.teeth < minT) { minT = g.teeth; minI = g.i; }
    });
    this._wearWheels = { maxI: maxI, minI: maxI === minI ? null : minI };
    return this._wearWheels;
  }

  /* Geometry for the two engraved lines. Font size is a fixed fraction of the band, so it
     is identical on every wheel; the arc sweep is then derived from the actual text length
     and the band's circumference, shrinking the type only if a long handle would not fit. */
  engraving(g, r, m, bandOut) {
    /* GUARDED LIKE EVERY OTHER READ OF THIS TABLE (#53). `SITES` is keyed by
       person, and a wheel whose person has no table at all makes the inner
       lookup throw rather than return undefined -- which is not a missing
       engraving, it is a blank page, because this runs inside the render. The
       four other derefs on the page already guard; this was the last one that
       did not. */
    const site = (g.slug && SITES[g.person] && SITES[g.person][g.slug]) || null;
    const raw = site ? site.path : '';
    /* Just the handle: everything after the last slash. */
    const handle = raw.indexOf('/') >= 0 ? raw.slice(raw.lastIndexOf('/') + 1) : raw;
    /* A printed wheel carries its material and process as well as its geometry,
       the way a real AM part does -- that mark is how you tell a printed one
       from a cut one on inspection, which is exactly its job (#43). The four
       lattice families are the printed ones; everything else is machined and
       says nothing extra. */
    const printedK = g.kind === 'hexcore' || g.kind === 'isogrid'
                  || g.kind === 'polarbrick' || g.kind === 'polariso';
    const stamp = 'M' + MODULE + ' Z' + g.teeth + (printedK ? ' · 17-4PH DMLS' : '');
    /* THE WIDTH IS MEASURED, NOT GUESSED (GitHub #98). textWidth() is a memoised canvas
       measurement a thousand lines up, built for exactly this class of problem --
       its own comment records that "a per-character guess clipped 'Mastodon' on
       the first try". fit() below used to run precisely that guess a second
       time. emWidth() asks textWidth() at ENGRAVE_TW_REF rather than at the font
       size actually being tried, and returns ems of width per unit font size
       rather than pixels, because fit() has to try more than one candidate size
       before it settles -- see the note on ENGRAVE_TW_REF for why that also
       keeps every candidate a single memoised call rather than several. */
    /* The tracking term is PER CHARACTER, not per gap: measured against the
       live DOM (getComputedTextLength() on the rendered <text>), Blink's own
       letter-spacing adds it after every glyph, including the last, not once
       per gap between glyphs -- str.length trailing units short of the real
       advance is exactly what str.length - 1 measured. A guide arc built from
       an under-count is the dangerous direction (the real, wider text
       overruns the arc it rides), so this counts the same way the renderer
       does rather than the way the (CSS-only, non-letter-spaced) plate label
       elsewhere in this file counts it. */
    const emWidth = (str) => this.textWidth(str, ENGRAVE_FONT_WEIGHT + ' ' + ENGRAVE_TW_REF
      + 'px ' + ENGRAVE_FONT_FAMILY) / ENGRAVE_TW_REF + ENGRAVE_TRACK * str.length;
    /* A FLOOR AS WELL AS A CEILING. The shrink below is one-sided: it divides the
       available sweep by the measured width, so a long enough string scales the
       type toward nothing and engraves a grey smudge rather than a mark. At
       MIN_ENGRAVE (0.30 module, about 2.1 units) the lettering is still legible
       on a large wheel, and past that the string is cut instead of the type --
       an abbreviated handle reads, an illegible one does not. Nothing shipped
       comes close to the floor today; it is here so that adding a long handle to
       config.js is a truncation rather than a silent smear (#59, and the same
       one-sided-bound class as #46). */
    const MIN_ENGRAVE = 0.30;
    const fit = (txt, rr, base) => {
      /* THE CAP IS A CLEAR-METAL LENGTH, NOT AN ANGLE (GitHub #98). ENGRAVE_GAP is the
         arc length (in modules) that must stay clear on each side between the
         handle and the stamp; MAX -- the most either line may sweep -- is
         solved from it rather than the reverse, so the ANGLE varies with the
         wheel's own radius (rr) and the LENGTH does not: `2*rr*MAX + 2*gap =
         2*pi*rr`, two gaps because two arcs ring the wheel. */
      const MAX = Math.PI - (ENGRAVE_GAP * m) / rr;
      const width = (fs, str) => emWidth(str) * fs;
      let f = base, t = txt;
      if (width(f, t) / rr > MAX) f = (MAX * rr) / emWidth(t);
      if (f < m * MIN_ENGRAVE) {
        f = m * MIN_ENGRAVE;
        const budget = MAX * rr;
        if (width(f, t) > budget) {
          /* Shrinking is one-sided (see above), so a string that still overruns
             the sweep at the floor size is cut instead -- longest prefix that
             fits with an ellipsis appended, found directly against the real
             measurement rather than backed out of a per-character estimate. */
          let k = t.length;
          while (k > 1 && width(f, t.slice(0, k - 1) + '\u2026') > budget) k--;
          if (k > 1) t = t.slice(0, k - 1) + '\u2026';
        }
      }
      return { f: f, txt: t, sweep: (width(f, t) / rr) * 180 / Math.PI };
    };
    /* Both lines are centred in the band; the rings they ride on are NOT at the band's
       centre radius. Glyphs hang off the ALPHABETIC baseline — the one baseline every
       engine puts in the same place — so each ring is dropped by BASELINE_MID of its own
       font size to bring the middle of the lettering back onto the band's middle. The two
       lines face opposite ways round the wheel: the top line's ascenders point outward and
       the bottom line's point inward, so the same shift is opposite in sign. Asking the
       engine to do this with `dominant-baseline: central` is what put the handle off
       centre in WebKit while Blink and Gecko looked right (#26). */
    const mid = bandOut - m * (BAND_DEPTH / 2);
    /* Fit first at the band's centre: that is what decides whether a long handle has to
       shrink, and the shift is measured in whatever size that lands on. */
    const T0 = fit(handle, mid, m * 0.80), B0 = fit(stamp, mid, m * 0.60);
    const rT = mid - BASELINE_MID * T0.f, rB = mid + BASELINE_MID * B0.f;
    /* Re-fit on the ring each line actually rides — a tighter radius needs a wider sweep. */
    const T = fit(handle, rT, T0.f), B = fit(stamp, rB, B0.f);
    /* T.txt / B.txt, not handle / stamp: if fit() had to cut the string, the
       sweep it returned describes the CUT string, and drawing the original
       against that sweep would overrun the ring. */
    return { handle: T.txt, stamp: B.txt, rT: rT, rB: rB, fT: T.f, fB: B.f, sT: T.sweep, sB: B.sweep };
  }

  /* One gear blank, drawn with true involute flanks.
     The working face of a real tooth is the involute of a base circle
     rb = r·cos(pressure angle) — the curve a taut string traces as it unwinds
     from that circle. It is the only profile with conjugate action, meaning the
     velocity ratio holds through the whole sweep rather than only at the pitch
     point, so mating teeth touch without ever interfering. Straight flanks
     cannot do both, which is what forced #11 to trade contact for clearance.
     Below the base circle no involute exists, so the flank runs radially down
     into the root. */
  /* No `prof` here on purpose: a tooth is a function of the module and the
     TOOTH_* constants alone, never of the web style bolted to the same wheel.
     The parameter used to be in this signature and was never read (#57), which
     invited exactly the wrong idea -- that a profile could change the teeth. */
  teethPath(n, r, chipIdx, mod, chipSev) {
    const m = mod || MODULE;
    const ro = r + m * TOOTH_ADD, rr = Math.max(TOOTH_ROOT_MIN, r - m * TOOTH_DED), a = 2 * Math.PI / n;
    const phi = TOOTH_PA * Math.PI / 180, rb = r * Math.cos(phi);
    const inv = (x) => Math.tan(x) - x;
    /* Half the tooth's angular width at the pitch circle. TOOTH_THICK is the
       fraction of the circular pitch the tooth occupies there — a hair under a
       half, the rest being backlash. */
    const psiP = TOOTH_THICK * Math.PI / n;
    const half = (R) => psiP + inv(phi) - inv(Math.acos(Math.min(1, rb / R)));
    const rStart = Math.max(rb, rr + 0.01);
    const hRoot = half(rStart);
    /* Fillet blend: how far up the flank and how far round the root it reaches. */
    const fr = Math.min(m * TOOTH_FILLET, (rStart - rr) * 0.9 + 0.01);
    const rFil = Math.min(rStart, rr + fr), fa = fr / rr;
    const P = polarR;
    const STEPS = 7;
    const flank = [];
    for (let s = 0; s <= STEPS; s++) flank.push(rStart + (ro - rStart) * (s / STEPS));

    let d = 'M' + P(rr, -a / 2) + ' ';
    for (let i = 0; i < n; i++) {
      const c = i * a;
      /* Root arc up to where this tooth's flank leaves the root circle, then the
         fillet. A real fillet is a trochoid swept by the cutter tip; a quadratic
         through the corner is indistinguishable at this scale. */
      d += 'A' + rr + ' ' + rr + ' 0 0 1 ' + P(rr, c - hRoot - fa) + ' ';
      d += 'Q' + P(rr, c - hRoot) + ' ' + P(rFil, c - hRoot) + ' ';
      if (rStart > rFil) d += 'L' + P(rStart, c - hRoot) + ' ';
      if (i === chipIdx) {
        /* A chipped tooth: still there, but the crown has fractured away along a
           jagged face rather than vanishing cleanly.

           THE FOUR FRACTIONS BELOW (0.44/0.52/0.70/0.93) ARE THE AUTHORED
           SHAPE OF A FULL FRACTURE (GitHub #112), and `chipSev` (0-1) scales
           how far up the tooth it reaches, not the shape itself -- a light
           scuff is a shallow version of the same crack, not a different one.
           `fTop` stays fixed at the tip: even a faint mark nicks the very top
           first. `fBot` slides from `fTop` (chipSev 0, a zero-height notch --
           gated to never actually render at the call site) down to 0.44
           (chipSev 1, today's shipped shape) as severity rises, and the two
           interior jag points are carried along at the SAME relative position
           within [fBot, fTop] they hold within [0.44, 0.93] today, so the
           crack's silhouette does not distort as it grows, only its reach
           does. */
        const H = ro - rStart, lvl = (f) => rStart + H * f;
        const sev = chipSev === undefined ? 1 : chipSev;
        const fTop = 0.93, fBot = fTop - sev * (fTop - 0.44);
        const relIn = (f) => fBot + (f - 0.44) / (fTop - 0.44) * (fTop - fBot);
        const breakAt = relIn(0.62), j1 = relIn(0.52), j2 = relIn(0.70), j3 = fBot;
        for (let s = 1; s <= STEPS; s++) {
          const R = flank[s];
          if (R > lvl(breakAt)) break;
          d += 'L' + P(R, c - half(R)) + ' ';
        }
        d += 'L' + P(lvl(fTop), c - half(lvl(fTop)) * 0.5) + ' ';
        d += 'L' + P(lvl(j1), c - half(lvl(j1)) * 0.2) + ' ';
        d += 'L' + P(lvl(j2), c + half(lvl(j2)) * 0.35) + ' ';
        d += 'L' + P(lvl(j3), c + half(lvl(j3)) * 0.8) + ' ';
        for (let s = STEPS; s >= 1; s--) {
          const R = flank[s];
          if (R > lvl(j3)) continue;
          d += 'L' + P(R, c + half(R)) + ' ';
        }
      } else {
        for (let s = 1; s <= STEPS; s++) d += 'L' + P(flank[s], c - half(flank[s])) + ' ';
        /* Tip land, following the tip circle. */
        d += 'A' + ro.toFixed(2) + ' ' + ro.toFixed(2) + ' 0 0 1 ' + P(ro, c + half(ro)) + ' ';
        for (let s = STEPS - 1; s >= 0; s--) d += 'L' + P(flank[s], c + half(flank[s])) + ' ';
      }
      if (rStart > rFil) d += 'L' + P(rFil, c + hRoot) + ' ';
      d += 'Q' + P(rr, c + hRoot) + ' ' + P(rr, c + hRoot + fa) + ' ';
      d += 'A' + rr + ' ' + rr + ' 0 0 1 ' + P(rr, c + a / 2) + ' ';
    }
    return d + 'Z';
  }

  arcD(rad, a0deg, a1deg) {
    const a0 = a0deg * Math.PI / 180, a1 = a1deg * Math.PI / 180;
    const large = (a1deg - a0deg) > 180 ? 1 : 0;
    return 'M' + polarR(rad, a0) +
      ' A' + rad.toFixed(2) + ',' + rad.toFixed(2) + ' 0 ' + large + ' 1 ' + polarR(rad, a1);
  }

  ringPath(rad) {
    return 'M' + rad + ',0 A' + rad + ',' + rad + ' 0 1 0 ' + (-rad) + ',0 A' + rad + ',' + rad + ' 0 1 0 ' + rad + ',0 Z';
  }

  /* HOW FAR BACK A GHOST SITS, in one place because two things need it and they
     are not in the same layer. The escape-run outriggers get it as a single
     opacity on the whole layer they live in; a bridge idler CANNOT live in that
     layer -- it is parallax-scaled 0.94, and a wheel that has to mesh with the
     train must be drawn at the train's own scale -- so it takes the same number
     per wheel instead.

     It is not a second opinion about how dim a ghost should be: it is the same
     number, so an idler and an outrigger composite to the same tone and read as
     the same class of object. dimK below was measured UNDERNEATH this factor,
     and an idler drawn without it came out around 5.5:1 against the pale page --
     darker and higher in contrast than any of the linked wheels the machine is
     actually about, which is the opposite of what a ghost is for. */
  /* THE GHOST LAYER'S ALPHA, AND IT IS ALSO THE DATUM'S CEILING. Since #81 the
     mark is drawn INSIDE this group, so it can never be painted harder than the
     layer -- which is why the ghost wheels are made less prominent by fading
     their COLOUR (see dimK in ghostSvg) rather than by lowering this. Lowering
     it was tried for CL#140 and took the datum with it: at 0.188 the dark scribe
     solved to no harder than a ghost wheel, the weight the mock proves it
     disappears at. Colour touches the wheels; alpha touches everything.

     THESE TWO NUMBERS LIVE HERE AND NOWHERE ELSE (GitHub #163). The ghost
     mirror's L* solve composites against both of them and used to carry its own
     copy in a GHOST_ALPHA_LAYER beside GHOST_COLORS, because module scope cannot
     see a method on a class it precedes. It asks this instead, from inside a
     render -- see ghostLightPaint(). This method is the home rather than the
     other way round for a reason worth knowing before anyone reverses it: the
     geometry suite lifts this function out of the file as TEXT and runs it with
     nothing else in scope, so a constant named here would throw there. */
  ghostOpacity(theme) { return (theme || this.state.theme) === 'dark' ? 0.17 : 0.46; }

  /* HOW HEAVY ONE WHEEL IS DRAWN, in one place, because two layers have to agree
     about it and one of them cannot simply inherit it. An idler is emitted from
     solved.gears rather than from the ghost layer -- it has to MESH, and that
     layer is parallax-scaled 0.94 -- so the layer's dimming has to travel with
     the wheel instead, and it must be the SAME number rather than a second
     opinion about it. `null` means the wheel carries no opacity of its own,
     which is every linked wheel: the machine is drawn at full weight.

     WHERE IT IS APPLIED MOVED, WHAT IT MEANS DID NOT (#86). It used to be an
     `opacity` on the wheel's rotating div; it is now charged on a group INSIDE
     ghostSvg, with an opaque backing plate outside that group, because a wheel
     composited at 0.17 straight onto the page cannot occlude the datum beneath
     it. This is still the one answer to "how heavy is this wheel drawn", and
     `null` still means "at full weight".

     THE CAST SHADOWS DERIVE FROM THIS RATHER THAN REPEATING IT. A full-strength
     shadow under a wheel drawn at ghost opacity reads as heavier than the wheel
     casting it, which puts the eye on the drive instead of on the services it
     connects -- so the rule is "a wheel drawn at reduced weight casts nothing",
     and the shadow layer asks that question here rather than testing the role a
     second time and drifting away from this one. */
  wheelOpacity(g) { return g.role === 'idler' ? this.ghostOpacity() : null; }

  /* HOW HARD THE DATUM MARK IS DRAWN, solved rather than carried per theme.

     THIS IS NO LONGER AN `opacity` DECLARATION. Since #81 the mark is drawn
     inside the ghost layer's group -- the only place a wheel at ghost alpha can
     hide it -- so it can only be painted at THAT alpha, and the number this
     solves for is spent on the ink instead. datumInk() does that conversion and
     the answer is unchanged: this is still what decides how hard the scribe
     reads, and everything below still holds.

     The ghost layer's pair does not transfer, and measuring it says why. It is
     not a contrast-matched pair to begin with: sampled on the rendered page over
     the eight tones ghostSvg deals, a ghost body composites to roughly 1.9:1
     against the light page at 0.46 and roughly 1.25:1 against the dark one at
     0.17. Those two alphas are a judgement about filled, blurred WHEELS, not a
     weight anything else can inherit -- and the datum is not drawn in the ghost
     greys anyway. It is drawn in --muted, which is a far firmer colour against
     the light page (#6B7E7C on #E8EAE5) than against the dark one (#93A5A3 on
     #1E2226). So the same alpha means two different marks: 0.46 in light gives
     1.67:1, while 0.17 in dark gives 1.35:1 -- the scribe drops back into the
     machinery it is supposed to be the reference for.

     The LIGHT treatment is the reference, because that is the one that was
     mocked and judged, and dark solves for the alpha that reaches the same
     contrast ratio. In light this returns 0.46 exactly, by construction. In dark
     it lands at 0.28 -- not the mock's guessed 0.34, which overshoots to 1.89:1
     and reads as annotation rather than as a scribed line. Nothing here is a
     number to re-measure when a token moves: change --muted or --bg in either
     block and the solve follows it.

     AND THE HEADROOM ON THAT SOLVE IS ONE ROUNDING STEP (GitHub #151). 0.28 is
     the largest alpha datumInk()'s lift can convert without clamping -- see its
     comment -- so the light reference cannot be darkened past #657876 no matter
     what a contrast audit asks for. The token block states the window and which
     gate holds each wall.

     Bisection, not algebra: composite luminance is monotonic in alpha but not
     invertible in closed form through the sRGB transfer curve, and 24 halvings
     of 0..1 settle it far below the two decimal places that reach the markup.

     outcome it must never have is "absent": an alpha of 0, or the ghost layer's

     looking, and present.

     THE CACHE IS DISCARDED BY paintTheme(), not keyed on the attribute (GitHub

       only one of them is a fault: an empty token string means the page's own
