<!-- config.js MUST load before support.js: the runtime below reads WOZI_CONFIG
     while building the train, so it has to already exist. It is a plain script,
     not a module, for exactly that reason -- a module would defer.
     It is also named in the deploy whitelist; a file in the repo does not reach
     the web on its own. -->
<script src="./config.js"></script>
<script src="./support.js"></script>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet" />
<!-- A single "w" in Manrope ExtraBold -- the page's own dominant font -- rather
     than the generic blue-dot placeholder that shipped before (GitHub #119).
     Two SVG variants, chosen by `prefers-color-scheme` at the OS/browser level:
     this can only ever match the SYSTEM'S colour scheme, never the page's own
     manual theme toggle, since a media-queried <link> has no way to read that
     toggle's state. A visitor who flips the in-page toggle away from their
     system default will see a tab icon in the OTHER theme -- a known, accepted
     limitation of what a static <link> can express, not a bug. -->
<link rel="icon" media="(prefers-color-scheme: light)" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23E1E4DD'/%3E%3Cpath d='M8.47 25.17 2.88 6.83 7.39 6.86 10.71 17.78 14.08 6.86H17.92L21.29 17.78L24.61 6.86H29.12L23.53 25.17H20L16 13.24L12 25.17Z' fill='%2320302E'/%3E%3C/svg%3E" />
<link rel="icon" media="(prefers-color-scheme: dark)" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231E2226'/%3E%3Cpath d='M8.47 25.17 2.88 6.83 7.39 6.86 10.71 17.78 14.08 6.86H17.92L21.29 17.78L24.61 6.86H29.12L23.53 25.17H20L16 13.24L12 25.17Z' fill='%23EEF1F0'/%3E%3C/svg%3E" />
<!-- A browser that does not evaluate media on <link rel="icon"> (or fetches
     /favicon.ico before honouring either of the above) gets a real ICO file
     now instead of the 403 GitHub #119 found -- see CLAUDE.md and the deploy
     workflow's whitelist. -->
<link rel="icon" href="/favicon.ico" sizes="any" />
<title>wozi.com</title>
<style>
:root{
  /* The page background is deliberately off a bright white. #F1F2F0 sat at 0.885
     luminance, which is a lot of glare full-screen and left the #FFFFFF badges
     almost nothing to separate from (1.12:1). At 0.817 the badges lift to 1.21:1
     and the ink still clears 11:1. --muted darkens with it so the wordmark TLD,
     which is large text on this colour, stays above the 3:1 floor (#16). */
  /* THE LIGHT PALETTE IS THE DATUM'S REFERENCE, AND HAS TO STAY READABLE WITH
     DARK ON. datumOpacity() solves for the alpha that gives the scribe the same
     contrast in whichever palette is in force as it has in light -- the
     treatment that was mocked and judged -- so it needs the light --bg and
     --muted while the dark block is overriding both, and getComputedStyle only
     ever reports the palette in force. These two carry them, and the dark block
     never overrides either.

     `--ref-muted` IS NO LONGER ALIASED BY `--muted`, AND THE DUPLICATE HEX BELOW
     IS THE POINT OF THE SPLIT, NOT AN OVERSIGHT (GitHub #152, following #151).
     The two were one declaration, and that one hex was carrying two facts that
     pull opposite ways:

       as the datum's reference   it fixes the scribe's judged WEIGHT, so
                                  darkening it makes the reference mark stronger
                                  and datumOpacity() raises DARK's alpha to match
       as the light UI ink        it is bound from below by a WCAG ratio against
                                  the pop-out panel -- see the window below

     This file's standing rule is one home per fact, and this is the INVERSE case:
     one home was holding two facts. They were the same number by history rather
     than by derivation, and nothing derives either from the other -- a judged
     weight is not a ratio and a ratio is not a judgement. So `--ref-muted` is now
     only ever the weight the datum was judged at, `--muted` is only ever the
     light UI ink, and they share a value today because that is the value the ink
     happens to have. **DO NOT RE-ALIAS THEM TO REMOVE THE REPETITION.** Moving
     one is meant to leave the other alone; that is the whole change.

     WHAT THE ALIAS COST, kept because it is the argument for the split and it is
     entirely measured. Raising dark's alpha has a hard ceiling, and it is nearer
     than it looks: datumInk() lifts the dark token by `datumOpacity() /
     ghostOpacity()`, and dark's --muted #93A5A3 sits at 165 on the green channel
     over a ground of 34, so the lift clamps at 255 once that ratio passes 1.687 --
     i.e. once the solved alpha rounds past 0.28. At 0.29 the mark composites to
     71.6 where the solve asked for 74.6 and the scribe has quietly changed weight,
     caught by `npm test`'s "no datum is drawn while one chain is on stage", in
     exactly the terms datumInk()'s own comment predicts ("a clipped channel means
     too strong"). While the two were one token that made a WINDOW with two
     computed walls, both gated rather than remembered:

       floor  4.5:1 on --chip          #687A79 .. , held by tools/a11y_audit.py
       cap    solved dark alpha <= .28 .. #657876, held by `npm test`

     -- a 0.15-wide band of contrast, with #677977 mid-band at 4.59:1 and its alpha
     at 0.2812 against a 0.285 cutoff. That is what a token carrying two facts
     looks like from the outside: two unrelated gates closing on one hex from
     opposite sides, and #120's own sweep candidates (#5A6E6C, #4F6462) clearing
     the floor easily and breaking the cap.

     THE CAP IS THE ALIAS'S, NOT THE INK'S, AND IT GOES WITH IT. Darken `--muted`
     now and light's own datum alpha solves DOWN from 0.46 -- the reference pair is
     fixed, so a firmer light ink reaches the reference contrast at less alpha --
     which makes datumInk()'s lift run downward, below 1, where it cannot clip.
     Dark's scribe does not move at all, because dark's alpha is solved against
     `--ref-muted`/`--ref-bg` and neither of those changed. WHICH VALUE `--muted`
     SHOULD TAKE IS STILL #120's DECISION and is deliberately not made here: this
     ships the same hex it always had, so the split is a 0-pixel change whose only
     effect is that the next move is possible.

     ONE THING TO FIX BEFORE MOVING IT, and it is in the harness rather than here:
     `tools/test.js` builds its light palette with `'--muted': cssVar(CSS_ROOT,
     '--ref-muted')`, so the suite MODELS the alias instead of reading `--muted`.
     While the two hexes agree that is invisible; the moment they differ the suite
     asserts the light alpha of a palette the page does not have, and passes.

     Reading them is then one getComputedStyle call. It used to be a scan of
     document.styleSheets for a rule whose selector text was ':root' exactly --
     which finds nothing the moment that block is wrapped in a @media, written
     ':root, :host', or joined by a second sheet, and a datum with no reference
     is a datum nobody can see. */
  /* THE LIGHT BACKGROUND IS A CHOSEN TONE, and it was lowered from #E8EAE5
     (90.8% L) to #E1E4DD (88% L) because Charles found the page close to
     blinding. It is not derivable -- it is where a human said the glare stops --
     but the CONSTRAINT on it is, and that is the part worth writing down:
     `--muted` against this background is the binding ratio, not `--ink`.

     Ink is near-black, so darkening the background moves it TOWARD the ink and
     LOWERS ink contrast rather than raising it (11.38:1 before CL#131, 10.73:1
     here) -- the opposite of the intuition, and still far clear of the 4.5:1
     floor. `--muted` is what runs out, and that is what CL#131 left standing and
     GitHub #151 finally came back for. Measured, not estimated; variants and
     contrast tables were photographed before the background was picked. */
  /* `--muted` IS NOT MEASURED AGAINST `--bg` ALONE, WHICH IS THE WHOLE OF
     GitHub #151. It has two grounds, and which one binds depends on the surface
     the text is drawn on:

       --bg   #E1E4DD   the page          3.57:1
       --chip #FFFFFF   the pop-out panel 4.59:1

     The PANEL is where `--muted` carries real text -- the two section headings at
     11px/700, and the Speed and Wear readouts at 13px/700 -- and white is the
     LIGHTER of the two grounds, so the panel's is the HIGHER ratio and was never
     the number anybody wrote down. The page's 3.33:1 was measured twice (#120,
     CL#131) and reported as a 3:1 problem, which it is: everything --muted paints
     on the page is a glyph or large text. Meanwhile the panel sat at 4.28:1 --
     over the 3:1 floor a glyph is held to and under the 4.5:1 ordinary text is --
     so five elements failed `a11y_audit`'s `color-contrast` in light, and nothing
     failed in dark.

     TWO OF THOSE FIVE WERE A REGRESSION NOTHING CHANGED THE COLOUR OF. CL#169
     dropped the Speed and Wear readouts from var(--icon) (20px/700, WCAG "large
     text", 3:1) to LIST_ROW_FONT_BOLD (13px/700, normal text, 4.5:1). The ink
     stayed exactly where it was and the threshold moved out from under it --
     which is the class of fault worth naming, because a token that clears a bar
     only at one type SIZE will be broken by a compaction nobody thinks to
     re-measure contrast for. Putting the type back was the alternative and it
     gives up over half of a compaction that was measured and approved, so the ink
     moved instead.

     #120's OWN CANDIDATES ARE NOW REACHABLE, WHICH IS WHAT THE SPLIT BOUGHT. That
     ticket measured this token as drifted -- 3.33:1 against the page where dark's
     --muted holds 6.21:1 -- and was deferred because its two candidates (#5A6E6C,
     #4F6462) could not be told apart by eye. "Does it clear 4.5:1" is answerable
     without taste, which is what let it be picked up again, and both of them clear
     it (5.41 / 6.30 on --chip). Neither could SHIP while `--muted` was an alias of
     the datum's reference: both drove the dark datum's solved alpha past the clamp
     described above and failed `npm test`. That cap belonged to the alias and went
     with it (GitHub #152), so what is left is #120's original question -- how much
     of the 3.57 / 6.21 light-versus-dark drift to close -- with the ratio no longer
     tangled into it. #677977 is what ships until that is answered: a hue-preserving
     step off the retired #6B7E7C, the value the two gates chose between them while
     they were both closing on one hex.

     Darkening the GROUND was never an option in either direction: --ref-bg at 88%
     L is where a human said the glare stopped, and moving it down lowers ink
     contrast and takes the wheel cuts' body-vs-page reading with it. --chip is
     white because the badge discs separate from the page by 1.21:1 and it is the
     lighter half of that pair. Fix the ink, not the ground. */
  --ref-bg:#E1E4DD; --ref-muted:#677977;
  /* The DARK page colour, declared here rather than only inside the dark block
     and deliberately NOT overridden, exactly as --ref-bg is not. Both themes'
     grounds have to be readable from EITHER theme, because the ghost alpha is
     solved by matching one theme's prominence against the other's and a value
     that only exists while its own theme is active cannot be matched against
     (CL#140). One home each: the dark block below uses this rather than
     repeating the hex. */
  --ref-bg-dark:#1E2226;
  /* `--bg` IS STILL AN ALIAS AND `--muted` IS DELIBERATELY NOT (GitHub #152).
     The light ground is one fact wearing two hats that never disagree -- it is
     the page's background AND the reference the datum was judged over, and it is
     pinned by a human's judgement about glare either way, so nothing can pull it
     two ways. The ink is two facts, and the hex is repeated on purpose so each
     can move alone. See the block above before joining them back up. */
  --bg:var(--ref-bg); --ink:#20302E; --muted:#677977; --hair:#D5DAD6; --chip:#FFFFFF;
  --accent:#3B7DE8; --shadow:0 1px 2px rgba(20,40,38,.06);
  /* THE METAL AND BRASS RAMPS, kept as a comment rather than as declarations
     (#57). Both sets were referenced ZERO times -- 16 declarations, no var()
     uses -- because wheel tone is derived per wheel by shades()/flatTones()
     from WHEEL_POOL, not read from CSS. They are recorded here because the
     values are still cited: config.js names --m4 light / --m1 dark as the
     provenance of the steel accent #5F686E, and deleting the declarations
     without this would delete where that colour came from.
       light metal   m1 #FFFFFF  m2 #D4DADE  m3 #98A2A9  m4 #5F686E
       light brass   b1 #F7E7BE  b2 #DFC183  b3 #B08F45  b4 #7A5F28
       dark  metal   m1 #AEB8BF  m2 #7C858C  m3 #4E565C  m4 #2B3135
       dark  brass   b1 #D8B978  b2 #A98844  b3 #75592A  b4 #463618 */
  --edge:rgba(12,22,28,.38); --gloss:rgba(255,255,255,.8);
  /* --gsfit is the fit scale, and it is a READOUT, not a lever: the train's
     geometry is multiplied by it in JS at render time so every wheel is drawn at
     the size it is displayed (#37). It used to feed a `transform: scale()` on the
     gear container, which meant the wheels were rasterised small and stretched.
     THIS DECLARATION IS NO LONGER READ BY ANYTHING THAT DRAWS (CL#174, #135).
     It used to be the boot fit: the first render happened before fitStage() had
     measured anything, so gsRender() read this value and the page drew itself
     once at 0.86 and again at the real ~1.4. Plan A gave the fit one home in
     fitScale(), which measures the viewport synchronously — it needs only
     innerWidth/innerHeight and visualViewport, no layout — so the first render
     is now correct and that throwaway render is gone. What is left here is the
     initial value `?hud` displays before the first setProperty, and nothing
     else consumes it. Harmless, and deliberately kept so the readout has
     something to show; do not restore a reader for it. */
  /* --s (1/speed) removed: 0 var(--s) uses, and syncVars recomputed it every
     render for nothing. Motion timing goes through the rAF loop, not CSS (#57). */
  --gsfit:0.86;
  --dir:row; --pad:5vw; --gap:4vw;
  /* Corner spacing is one icon width, so the gap around the theme toggle reads
     the same as the icon it sits next to. The button is larger than its icon and
     centres it, so the button box is pulled in by half that difference — derived
     rather than hardcoded, so changing either size keeps the icon on the mark.
     The wordmark sits on --btnoff too, the same offset as the button's box, so
     the two bottom/top corners are inset by the same amount rather than one
     being measured to a box and the other to a glyph. Neither reads --btnoff
     directly any more: both go through the --off* tokens below, which add the
     safe-area inset for the edge each one is pinned to. */
  --icon:20px; --btn:44px;
  /* Gap between the corner buttons -- three permanent (theme, motion, the menu
     toggle) plus a fourth, conditional one that only shows away from 1x speed
     (GitHub #108, CL#114). The 44px button is a TOUCH TARGET, deliberately
     larger than the 20px glyph it holds, so the visible spacing is already the
     button's own padding plus this -- which is why a flat 6px read as a wide,
     loose row. Clamped and viewport-relative so a phone packs them tight and a
     large display lets them breathe, without either end colliding or drifting
     apart. */
  --btngap:clamp(0px, 0.6vw, 8px);
  --corner:var(--icon);
  --btnoff:calc(var(--corner) - (var(--btn) - var(--icon)) / 2);
  /* THE STAGE BLEEDS, THE CONTROLS DO NOT. `viewport-fit=cover` hands the page
     the whole display on iOS/iPadOS — under the notch, under the home
     indicator, behind Safari's translucent toolbars — so the machine reads as a
     window onto a running train rather than a picture inside a box. The fixed
     controls — up to four corner buttons (three permanent, one conditional)
     and the wordmark — are the one thing that must stay out of those regions:
     a button under the home indicator is hard to tap and can be impossible.

     So each fixed corner offset is --btnoff PLUS that edge's inset, and the
     insets are held in their own tokens rather than written into the offsets.
     Two reasons. A bare env() inside a calc() is invalid on a browser that has
     never heard of env(), and an invalid `top`/`right` does not fall back to
     --btnoff, it falls back to auto — the buttons would lose their corner
     entirely. And a plain custom property can be given a value at runtime,
     which is how tools/devices.py exercises this without a notched phone. */
  --safe-t:0px; --safe-r:0px; --safe-b:0px; --safe-l:0px;
  --offtop:calc(var(--btnoff) + var(--safe-t));
  --offright:calc(var(--btnoff) + var(--safe-r));
  --offbot:calc(var(--btnoff) + var(--safe-b));
  --offleft:calc(var(--btnoff) + var(--safe-l));
}
@supports (top:env(safe-area-inset-top)){
  :root{--safe-t:env(safe-area-inset-top,0px);--safe-r:env(safe-area-inset-right,0px);
        --safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);}
}
:root[data-theme="dark"]{
  /* --ref-bg and --ref-muted are deliberately NOT overridden here: they are the
     reference palette the datum's alpha is solved against, not a theme colour. */
  --bg:var(--ref-bg-dark); --ink:#EEF1F0; --muted:#93A5A3; --hair:#373E3D; --chip:#2A3034;
  --accent:#7FA9F0; --shadow:0 1px 2px rgba(0,0,0,.35);
  /* metal/brass ramps: see the light-mode block above (#57) */
  --edge:rgba(0,0,0,.6); --gloss:rgba(255,255,255,.38);
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
a{color:var(--accent);text-decoration:none;}
a:hover{color:var(--ink);}
/* The links ARE the content, so a keyboard user who cannot see focus cannot use
   the site at all (#23). :focus-visible keeps the ring off mouse clicks; the
   outline follows each element's own border-radius, so it rings the discs. */
a:focus-visible,button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
/* ===========================================================================
   THE ONLY PSEUDO-ELEMENT RULES IN THIS FILE, AND THE ONLY STYLING NOT INLINE
   (GitHub #108, CL#114). `Do not introduce stylesheets or CSS classes for
   layout` still stands, and this breaks neither half of it: there is no class
   here, and none of this is layout. It is the platform's own reason a native
   range input draws its thumb and its track as PSEUDO-ELEMENTS, which have no
   presence in the DOM, so there is no element to carry a `style` attribute --
   `::-webkit-slider-thumb` is not a stylistic preference over inline, it is
   the only mechanism that exists. The selector is the element and its type,
   never a class, so nothing here can be applied to anything by accident:
   there is exactly one range input on the page.

   THE THUMB'S COLOUR IS STILL STATE-DRIVEN, through `--thumb-color` -- a
   custom property has no such restriction, because setting one is not styling
   a pseudo-element, it is setting a variable on the real element the pseudo
   inherits from. renderVals() writes it inline on the `<input>` itself
   (speedTrackStyle), and the rule below only ever reads it. That is how the
   strobe warning reaches the thumb: colouring the thing under the finger,
   never a mark on the track, because a redline tick at the boundary stop was
   tried first (GitHub #69's A/B sheets) and was invisible AT THAT STOP -- the
   thumb sits centred on the exact index it would mark, visible five
   stops either side and gone at the one that means something. The filled
   portion of the track is painted the same way, for the same reason: it is a
   background-image layer on the input itself, not a pseudo-element, because
   IT also depends on the value.

   --trk and --thumb are declared here and read by both the CSS and the JS: the
   thumb's own margin is derived from them rather than measured, and the track
   fill's math in speedAt() reads --thumb too, so the visual thumb, the track
   fill and the CSS centring cannot drift apart when either size changes.

   --thumb IS THE VISIBLE DISC AND IT IS NOT THE TOUCH TARGET (GitHub #134).
   It was 24px, chosen because that is the WCAG 2.5.8 floor -- which was the
   right floor for the wrong box. What a finger and a pointer actually acquire
   is the `<input>` itself, given an explicit `height` of `--btn` (44px, the
   same touch target every corner button uses) and a full-width track: the
   whole 129x44 box is live, and a press anywhere in it jumps the thumb to
   that stop. So the disc is free to be as small as it can be SEEN at, while
   the target stays exactly where CL#155 put it -- the same hit-vs-visible
   split the corner buttons make between a 44px box and a 20px glyph.

   16px is Charles's call from a 24/20/16/12 sweep, at which the disc still
   reads as a machined knob rather than a bead and still shows its own colour
   change (the strobe warning below) at a glance. 12px was measured too and is
   the point at which the state cue starts to be carried by the track alone.
   MEASURE BOTH BOXES AND SAY WHICH ONE YOU MEASURED: a11y_audit.py reports
   the input's box, not the disc's, and it is the input's that may never
   shrink -- if a smaller disc ever makes that audit complain, the audit is
   measuring the wrong thing and the disc is not the reason.

   THE BARE input[type="range"] SELECTOR IS SAFE WITH MORE THAN ONE CONTROL
   (GitHub #112 added Wear beside Speed), NOT BECAUSE THERE IS ONLY ONE, but
   because --thumb-color is set INLINE on each element -- the shared
   ::-webkit-slider-thumb/::-moz-range-thumb rule below reads whichever value
   the element it is painting actually carries, rather than styling every
   range input identically. A range input added without its own --thumb-color
   would silently fall back to var(--muted) and share a track colour that was
   never a deliberate match; tools/test.js asserts every one on the page sets
   it. */
input[type="range"]{
  --trk:4px; --thumb:16px;
  -webkit-appearance:none; appearance:none;
  width:100%; height:var(--btn);
  background-color:transparent; border:0; margin:0; padding:0;
  cursor:pointer; touch-action:none;
}
input[type="range"]::-webkit-slider-runnable-track{height:var(--trk);background:transparent;border:0;}
input[type="range"]::-moz-range-track{height:var(--trk);background:transparent;border:0;}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none;
  width:var(--thumb); height:var(--thumb); border:0; border-radius:50%;
  background:var(--thumb-color, var(--muted)); cursor:pointer;
  transition:background .18s ease;
  /* Centre the thumb on the track: WebKit lays it out from the track's top
     edge, so the offset is half the difference of the two sizes above --
     derived, not a measured nudge that would go stale if either changed. */
  margin-top:calc((var(--trk) - var(--thumb)) / 2);
}
input[type="range"]::-moz-range-thumb{
  width:var(--thumb); height:var(--thumb); border:0; border-radius:50%;
  background:var(--thumb-color, var(--muted)); cursor:pointer;
  transition:background .18s ease;
}
/* The browser's own focus ring on the input box would draw a rectangle around
   a control whose visible part is a 4px line and a 16px disc; :focus-visible
   above rings it instead, the same as every other interactive element here. */
input[type="range"]:focus{outline:none;}
/* ===========================================================================
   WHAT YOU CAN EDIT WITHOUT DOING GEOMETRY

   The file mixes two kinds of thing. This is a map of the first kind: content
   and taste, safe to change on its own. Everything else derives from MODULE and
   is checked by `npm test`, which reads its constants straight out of this file.

     SITES            the link table -- where each wheel points, its label and
                      the handle engraved on its rim. Add or retarget freely.
     PAIRS / SINGLES  which handles are siblings (they get neighbouring wheels)
                      and which stand alone. PAIR_SLOTS says which wheel indices
                      count as neighbours.
     BRAND / ACCENTS  per-service mark colour, and the accent each theme uses.
     WHEEL_POOL       the colour pool wheels are dealt from -- the original
                      template's seven plus three gap-fillers. Shuffled per load;
                      the deal refuses neighbours closer than 40 degrees of hue.
                      A person may add `palette: { around, spread }` to be dealt
                      from an arc of it -- a preference inside that rule, which
                      reserves nothing from anyone else (#68).
     CENTRE_FAMILIES  the kinds of gear centre, and the variants of each. Adding
                      a family puts it in rotation and in the Table of Gears at
                      once. Admission rule, Charles's: a wheel a machinist could
                      make, a visible load path hub to rim, no floating metal,
                      and not boring.
     TRAIN            which handle sits on which wheel. Tooth counts and bearing
                      angles in here are only SEEDS -- both are dealt per load.

   Change any of these and the machine still works. Change MODULE, TOOTH_*,
   BAND_*, RIM_UNDER_BAND, MIN_MODULE or the deal bounds and gear sets that
   nothing has measured become reachable: run `npm test` before you push.
   =========================================================================== */

/* The train itself rests via the frame loop (#3) — this only stills the UI
   transitions: badge scale, tooltip fade, toggle colour. */
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
@media (max-width:1080px){:root{--gap:2rem;--pad:6vw;}}
@media (max-width:760px){:root{--pad:28px;}}
@media (max-width:430px){:root{--gap:1.25rem;}}
</style>
</helmet>

       #108, CL#114). Source order is left to right, so the tab order matches

       settings pannel should collapse it if open". It is an ELEMENT and not a
       document-level listener, and that choice is what makes every one of the
       cases below fall out of layout instead of out of event bookkeeping:

       "grab the train and spin it". A tap whose entire intent is to dismiss must
       not also fling the machine -- that is a side effect the visitor did not
       ask for. Because the scrim is the topmost element under the pointer, the
       stage never receives the event at all: the consumption is structural, not
       a stopPropagation() somebody can delete without the behaviour changing
       visibly. The cost is that the first tap after opening the panel does not
       reach the machine, which is the smaller of the two surprises.

       four exclusions:

           guarded against;

       the settings in the panel -- flipping the theme to compare it is a thing
       you do WITH the panel open -- and the departure indicator's whole job is

/* ?seed=8231 — DRAW THE SAME MACHINE TWICE.

   Every wheel on this page is dealt. Twelve bare `Math.random()` calls below
   pick the tooth counts, the centre families and their variants, the bearing
   angles, the planetary's clocking, the colours, and which wheel wears which
   service — so a machine exists for exactly as long as its tab does, and "it
   looked wrong on my phone" describes something that will never be drawn again.
   Naming the seed in the URL makes a report from a real device reproducible on a
   desk, and that is the whole of the feature.

   THIS IS A DELIBERATE EXCEPTION TO A RULE STATED ELSEWHERE, so it is argued
   here rather than left to be discovered. Determinism on this page belongs to
   the harness: `tools/pixel_regress.py` and `tools/dom_invariants.py` each
   inject their own LCG over `Math.random` through
   `Page.addScriptToEvaluateOnNewDocument`, ahead of every page script,
   *precisely* so that no test hook has to ship. A seed is not that hook. It
   changes no behaviour, bypasses no logic, exposes no internal and reaches
   nothing a visitor could not otherwise reach — it fixes ONE input that is
   otherwise unobservable, and its consumer is a person writing a bug report
   rather than a gate.

   AND NO GATE MAY EVER USE IT. The harnesses keep injecting their own generator
   even though this parameter would now do the job, because the moment a gate
   deals through the same mechanism the page deals through, a fault in that
   mechanism is invisible to both — the gate would agree with the page about a
   machine they had both got wrong. Two generators is the point, not a leftover.

   ABSENT THE PARAMETER NOTHING HAPPENS, which is load-bearing rather than tidy.
   The browser's own `Math.random` is left in place and the deal is byte for byte
   the page that shipped yesterday. Self-seeding EVERY load — what it would take
   to report the seed of the machine that actually went wrong, which is the more
   valuable half of this idea — necessarily replaces the unseeded deal's source
   of randomness, and no pixel gate can tell that apart from a regression. See
   CHANGELOG CL#109 for what it would cost.

   IT IS INSTALLED HERE, ABOVE EVERY OTHER STATEMENT IN THIS FILE, because the
   deal is not something anybody calls: `dealTeeth()` and `dealAngles()` are
   IIFEs that run at module load, and the first of them draws long before
   anything renders. `?kind=` can afford to be parsed beside the family list it
   filters (`FORCE_KIND`, below) because only a function reads it. A seed has to
   beat the first draw. */
const SEED_MAX = 0x7fffffff;   /* the generator's own state space, so the range a
                                  seed may take IS the range it can reach */
const DEAL_SEED = (function () {
  try {
    const m = location.search.match(/[?&]seed=([^&]*)/);
    if (!m) return null;
    /* A PERCENT SIGN IS NOT A NUMBER, AND IT IS STILL WORTH SAYING SO. `?seed=%zz`
       makes decodeURIComponent throw, and catching that out here would have sent
       it down the same silent path as no seed at all — the one case of malformed
       input the page would have refused without a word. Keep the undecodable
       text and let the test below reject it out loud. */
    let raw = m[1];
    try { raw = decodeURIComponent(raw); } catch (e) { /* rejected below, by name */ }
    const n = Number(raw);
    /* A MALFORMED SEED DEALS AT RANDOM RATHER THAN THROWING. `Number('')` is 0
       and `Number('abc')` is NaN, and this is module scope — anything thrown
       here takes the whole script with it and renders nothing at all, which is
       #53 exactly. Capturing everything up to the next `&` and testing it
       explicitly is also what lets the page SAY the seed was refused; matching
       digits only would make `?seed=abc` indistinguishable from no seed. */
    if (raw !== '' && isFinite(n) && Math.floor(n) === n && n >= 0 && n <= SEED_MAX) return n;
    console.warn('wozi: ignoring ?seed=' + raw + ' — expected a whole number 0…'
      + SEED_MAX + '; dealing at random');
    return null;
  } catch (e) { return null; }
})();
/* WHAT SEED IS IN EFFECT, READABLE — `null` when the deal came from the browser.
   Read-only data, the same shape as `__WOZI_GEOM` below, and there for the same
   reason: a person checking that the seed took. Silent degradation with no way
   to tell is the failure mode this parameter is most likely to have. */
if (typeof window !== 'undefined') window.__WOZI_SEED = DEAL_SEED;
if (DEAL_SEED !== null) {
  /* The generator `fitEscapes()` already runs on its own `_seed`, with two
     differences that matter when a human chooses the number.

     SCRAMBLED FIRST, because an LCG's state is affine in its seed: `?seed=1` and
     `?seed=2` would part by 1664525/2^31 on their first draw — under a
     thousandth, which is the same tooth count, the same family and the same
     bearing. The murmur3 finalizer is a published bijection whose entire job is
     that one bit in flips half the bits out, so consecutive seeds start a whole
     machine apart. It is a named mixer rather than a number anybody here tuned.

     DIVIDED BY 2^31 RATHER THAN 2^31-1, so the result is strictly below 1. A
     state of 0x7fffffff over 0x7fffffff is exactly 1.0, and every draw below it
     is `Math.floor(Math.random() * n)` — a seed in two billion indexing one off
     the end of the pool it is choosing from. */
  let s = (function (x) {
    x = (x ^ (x >>> 16)) >>> 0;
    x = Math.imul(x, 0x85ebca6b) >>> 0;
    x = (x ^ (x >>> 13)) >>> 0;
    x = Math.imul(x, 0xc2b2ae35) >>> 0;
    return (x ^ (x >>> 16)) & SEED_MAX;
  })(DEAL_SEED >>> 0);
  Math.random = function () {
    s = (s * 1664525 + 1013904223) & SEED_MAX;
    return s / 0x80000000;
  };
  /* THE SEED FIXES THE DEAL, NOT THE FIT. Every draw below comes from this
     generator; where the finished train is then placed is measured off the
     viewport, so a seed reproduces a machine at a given window size and says
     nothing across two. The escape runs are outside it in the other direction —
     `fitEscapes()` resets its own `_seed` on entry, so those were never part of
     the random deal and were already the same on every load. */
  console.info('wozi: dealt from ?seed=' + DEAL_SEED
    + ' — the same seed at the same window size draws the same machine');
}

const MODULE = 7;

/* Tooth form. Uniform across the train and derived from the module — never set
   per wheel. Per-wheel `add` and `tip` were the #15 mistake repeated on the tooth
   profile: a set maintained by judgement drifts, and this one had drifted into a

   Measured against the real outlines at all six adjacent pairs:

       4 points of one wheel's outline inside its neighbour's, up to 1.42px deep

   The tooth had been a fat wedge — 66% of the circular pitch at the root tapering

const WEAR_SCUFF_RATIO = 0.5;
/* THE TIMING MARK'S TWO PROPORTIONS, AND THE ONE SHAPE THEY DESCRIBE.

const TIMING_STROKE_MUL = 0.22;  /* of a module, the scored line's width */
const TIMING_DOT_MUL = 0.28;     /* of a module, the punch dot's RADIUS at the tip */

const GHOST_TIMING_SPAN = 0.60;
/* The Table of Gears list's own type treatment (GitHub #127) -- read by

const LAYOUT_UNIT = 1 / 64;
const LIST_ROW_LINE_PX = (() => {

})();
/* Depth of the engraving band, in modules — uniform on every wheel. Module-based

   at 0.80 modules, so 1.59 leaves about 0.4 of a module of clear
   metal above and below it. Sized for the WORST glyph rather than the average:
   an underscore is a hairline sitting low in the line, and it is the first
   character to become unreadable when the channel is tight. It was 2.1 — two and a half times the height of its

const BAND_DEPTH = 1.59;
/* How far in from the tooth roots the engraving band starts, in modules. */
const BAND_RISE = 1.3;
/* The ring of metal left BELOW the band, in modules, before anything may be cut

const RIM_UNDER_BAND = 0.6;
/* Where the middle of a line of Manrope sits above its own alphabetic baseline,

const BASELINE_MID = 0.385;
/* Clear, unmarked band left between the handle and the stamp, in modules -- the

const ENGRAVE_GAP = 1.24;
/* Font used to STRIKE the two engraved lines, named once so the measurement in

const ENGRAVE_FONT_FAMILY = "'Manrope',system-ui,sans-serif";
const ENGRAVE_FONT_WEIGHT = 700;
/* The 0.1em CSS letterSpacing the same <text> elements are painted with --

const ENGRAVE_TRACK = 0.10;

const ENGRAVE_TW_REF = 200;
const TOOTH_ROOT_MIN = 4;  /* Floor under any root circle, in SOLVE UNITS -- not
                              pixels; teethPath() and planetaryBore()/ROOT_MARGIN
                              compare it straight against r = MODULE * teeth/2,
                              which is the same unscaled space, and it predates
                              px() (#61) so it is not run through that conversion
                              either (GitHub #99 found this alongside CLEARANCE
                              and ENDS_APART's same mislabel). Without it a tiny

                              trip over it — see planetaryMenuFor(). */
const TOOTH_FILLET = 0.38; /* root fillet radius, in modules — the standard value that
                              goes with 20-degree full depth. Without it the flank meets
                              the root circle at a sharp corner, which no cut gear has. */
/* The ring gear's stub addendum, as a fraction of the ring's own module. Full
   depth fouls three of the five dealt sets; 0.70 clears all five at every

const RING_STUB = 0.70;

const BASE_MS = 21000;
/* THE SPEED THAT STROBES IS DERIVED; THE SPEED THE CONTROL STOPS AT IS CHOSEN.
   Those are two different numbers on purpose (#96), and conflating them was the
   first design of this control.

   A gear turning fast enough strobes: past half a tooth pitch of travel per tick
   the sampling is under Nyquist and the train visibly stands still or runs
   backwards. That limit is exactly computable here, and — the part worth knowing
   — it does not depend on the tooth count at all. A wheel's angle is
   `phase + dir * _M / teeth` and its pitch is `360 / teeth` degrees, so ONE
   TOOTH OF TRAVEL IS 360 MASTER-DEGREES on every wheel in the train. A 13-tooth
   blank and a 19-tooth one cover the same fraction of a tooth per tick, and
   there is one strobe speed for the whole machine:

     master-deg per tick at 1x = (7200 / BASE_MS) * (1000 / frameRate)
                               = 0.342857 * 33.33 = 11.43   (BASE_MS 21000, 30fps)
     tooth fraction per tick   = 11.43 / 360 = 0.0317
     strobe at half a pitch    = 180 / 11.43 = 15.75x

   THE LADDER RUNS PAST THAT, DELIBERATELY, TO A BENCHMARK CEILING. Charles asked
   for a top stop that is "ludicrous", usable "almost ... to do benchmarking" —
   and a stop that exists to make the renderer sweat is allowed to look wrong,
   because looking wrong is the reading. So strobeSpeed() no longer truncates the
   ladder; it CLASSIFIES it. Every stop at or above it is announced as strobing,
   in the accessible name and in the colour of the numeral, because a control
   that silently offers a setting which breaks the illusion is worse than one
   that says where the illusion ends.

   THE RUNGS ARE A 1-2-5 PREFERRED-NUMBER LADDER. Equal ratios rather than equal
   increments, because the effect is perceptually multiplicative — 1x to 2x and
   50x to 100x are the same size of change to look at — and 1-2-5 is the standard
   logarithmic ladder for exactly that (oscilloscope timebases, chart axes,
   preferred component values). From 1 to 200 that is eight positions:

     1  2  5  10  20  50  100  200
              |
              +-- 15.75x strobe limit falls here: 1..10 are clean, 20..200 strobe

   landing on the ladder rather than the ladder being bent to reach it. The
   floor is 1x — the control only ever speeds the machine UP; slowing it down was
   not wanted and stopping it is already the pause button's job (#69).

   Both ends come from the schema's own `min` and `max`, which are levers again
   rather than readouts. The strobe limit is not in the schema at all: it is a
   property of BASE_MS and the frame rate, and writing it down anywhere else
   would be a second home for a derived fact.

   person notices — but smear is a soft, monotonic loss with no threshold the
   geometry can name, whereas aliasing is a hard sign inversion with an exact
   one. Rim travel per tick is measured at every stop and reported in
   CHANGELOG #96 rather than used as a bound. */
const PROP_SCHEMA = (() => {
  try {
    return JSON.parse(document.querySelector('script[data-dc-script]').getAttribute('data-props'));

    console.warn('wozi: the prop schema is unreadable — the speed control has one position');
    return null;
  }
})();
const SPEED_META = (PROP_SCHEMA && PROP_SCHEMA.speed) || {};
/* The two ends of the ladder. One home each: the schema's own min and max. */
const SPEED_FLOOR = SPEED_META.min || 1;
const SPEED_CEIL = SPEED_META.max || SPEED_FLOOR;
/* Where half a tooth pitch passes in one tick. At and above this the train is
   sampled below Nyquist and reverses on screen. */
const strobeSpeed = (frameRate) => 180 / ((7200 / BASE_MS) * (1000 / frameRate));
const SPEED_STOPS = (() => {
  const out = [];

      if (v >= SPEED_FLOOR && v <= SPEED_CEIL) out.push(v);

  return out.length ? out : [SPEED_FLOOR];
})();

/* THE FLYWHEEL'S APPROACH TO A NEW TARGET SPEED (CL#127, GitHub #106). Used for
   spin-up (0 -> the idle rate) and spin-down (any rate -> a slower one, or to
   rest) alike -- one function, called from step() with whatever `target`
   idleRate() and motionActive() computed that tick, exactly like every other
   read of the flywheel. It used to be a first-order lag with a FIXED time
   constant:

     this._v += (target - this._v) * (1 - Math.exp(-dt / 900));

   SIZE of the drop, so 200x -> 1x sheds ~145x in the first 900ms and then
   spends four more seconds crawling the last 1x (#106). A heavy flywheel under
   mostly COULOMB friction -- roughly constant retarding TORQUE rather than
   drag proportional to speed -- decelerates at a CONSTANT RATE instead, so
   stopping from 200x genuinely takes about 200x as long as stopping from 1x,
   which is the behaviour the eye expects from something that looks like cast
   iron. That is the model here: `_v` moves toward `target` at a fixed rate and
   ARRIVES, in finite time, rather than easing toward it forever.

   of step with SPEED_CEIL/SPEED_FLOOR the way a hand-picked deg/ms^2 would.

   where the prop schema failed to parse and both collapsed to the same
   value (PROP_SCHEMA above) -- without it SPINDOWN_DECEL would be exactly 0
   and the flywheel would never move at all, which is a worse failure than a
   schema that only has one speed.

   out of three built and captured against the real page (`_v` has no outside
   hook, so all three were compared as measured wheel rotation, not simulated
   -- see tools/spindown_capture.py and tools/spindown_report.py), not the only
   one that was built: a fixed-tau control (identical to the code above) and a
   logarithmic-tau candidate (tau scaled by the number of octaves a transition
   spans, so each halving takes the same wall-clock time) are in the CL#127

   SPIN-UP SHARES THIS, DELIBERATELY (#106 asks explicitly). This is the same
   function called with target > v instead of target < v -- Coulomb friction
   opposes motion in either direction at the same magnitude, and a real train
   winds up slowly for the same reason it coasts down slowly. No special case. */
const SPINDOWN_RANGE_MS = 15000;

/* HOW THE COAST IS SHAPED, as against how long it lasts (GitHub #121, CL#139).

   Charles, on the shipped constant-deceleration model: "the spindown speed is
   just weird now - almost as if there is a break on the wheel". That reading is
   exactly right, and it is a statement about the MODEL rather than the tuning: a
   constant retarding torque IS a brake. Pure Coulomb friction sheds speed at the
   same rate at 200x as at 1.1x, so the wheel ramps down a straight line and then
   stops decelerating at a corner. Nothing coasts like that. A flywheel free on
   its bearings loses most of its drag AS IT SLOWS -- bearing drag and windage
   both fall with speed -- so it drops away quickly and then trails off.

   CL#136 did not cause this; it revealed it. While driveCap() was 8 a throw only
   ever showed the first 269ms of that straight line. Once the cap became the
   ladder's top, a hard throw shows all 2400ms of it.

     decel = SPINDOWN_COULOMB + SPINDOWN_VISCOUS * |target - v|

   the part that makes it dive early and dawdle late, and the part that was
   missing. COULOMB is the constant residue that makes it ARRIVE, in finite time,
   which is CL#127's win over the old fixed-tau exponential and is kept: an

   ever. Candidate B in CL#127 (tau scaled by octaves) got the shape right too,

   and which CL#136 gave a second job (it is also how long the hardest possible
   throw runs, since a saturating throw IS the ladder travelled by hand). So the
   two numbers keep their existing meanings and the new one only shapes what
   happens between the ends.

   below. At the shipped figures the rate starts 3.2x the old flat one and ends
   5x slower than it, which is the whole of what "coasts" means here. */
/* HOW HARD IT BRAKES AT THE TOP OF THE LADDER AGAINST AT REST. This is the one
   number that decides the CHARACTER, and both failures this has had sit at its
   ends. At 1 the three terms collapse to a constant and it is the brake CL#127
   shipped. Very large, the Coulomb residue vanishes, and it becomes the pure
   exponential #106 rejected -- measured: at a dynamic range of 1 a 2x throw
   takes 70ms and a full-ladder one 2400ms, while a windage-only fit makes them
   1200ms and 2400ms, so the throw stops telling you how hard you threw it.

   60 is Charles's call from four candidates spun by hand on the real page
   (CL#141). It went UP from 15 because 15 still read as "an artificial brake":
   the earlier pairing leaned on windage, which sheds the FASTEST part of a
   throw first, so a hard spin dumped most of its speed inside a second. What he
   asked for is the opposite -- "if you walked up to the gears on the table with
   a clutch so you could spin them freely ... a gratifying spin that ended up
   slowly and naturally returning back to the same speed". That is low drag that
   FALLS steeply as the wheel slows, which is a wide range and little windage. */
const SPINDOWN_DRAG_RANGE = 60;
/* Of the SPEED-DEPENDENT drag, the share that is windage (proportional to the
   square of the excess) rather than bearing drag (proportional to it).

   LOW, and that is the correction CL#141 made. Air drag on a disc only dominates
   at genuinely high rpm; at the speeds this train runs, bearing losses do. A
   high windage share also fights the thing being asked for, because the square
   term bites hardest exactly where a thrown wheel is fastest -- it takes the
   gratifying part of the spin away first. */
const SPINDOWN_WINDAGE = 0.10;
const SPINDOWN_SPAN = (7200 / BASE_MS) * Math.max(SPEED_CEIL - SPEED_FLOOR, SPEED_FLOOR);

/* The three coast-down coefficients, SOLVED rather than chosen, so the two
   figures above set only the shape and `SPINDOWN_RANGE_MS` still sets the
   duration exactly -- which is what keeps CL#136's identity true: a saturating
   throw is the ladder travelled by hand, so it must take the ladder's own time.

   Only the overall scale is solved. Its split is fixed by the two constants
   above, and the time to fall from the ladder's top to rest is the integral of
   1/decel over the gap, which has no robust closed form across the whole range
   of shapes (the arctan/log form loses precision as the windage share goes to

          + seen.concat(at).join(' -> ') + ') -- a chain cannot drive itself'
          + ' through others, so it is placed as an independent chain');
        par[p.slug] = null;
        break;
      }
      seen.push(at);
      at = par[at];
    }
  });
  STAGE.people.forEach(p => {
    let at = par[p.slug];
    while (at != null && !HAS_WHEELS(onStage[at])) at = par[at];
    par[p.slug] = at;
  });
  return par;
})();

/* THE LAYOUT ORDER, AND WHICH WHEEL EACH CHAIN TAKES ITS DRIVE FROM. Both come
   out of ONE depth-first walk of the drive tree, because they are the same fact:
   a chain is laid out immediately after whatever turns it.

   THE STACK IS A WALK, NOT A SORT (Charles, GitHub #116). A dependent follows
   its parent immediately even if an unrelated root has more links -- me, then my
   child, then Harper, rather than me, Harper, my child. Link count and name
   survive only as the sibling tie-break, which is what SIBLING_SORT is.

   SIBLINGS CASCADE; THEY DO NOT ALL HANG OFF THE PARENT. `child: 'charles'`
   declares MEMBERSHIP of Charles's dependent group, not the attachment point.
   The first child takes its drive from the parent; every later sibling takes it
   from the LEAD GEAR OF THE SIBLING BEFORE IT. That is the physically honest
   shape -- you do not take four power take-offs off one gear, you cascade them
   -- and it is why the ordering rule and the drive topology are one traversal
   rather than two declarations that have to agree.

   IT PRESERVES THE INVARIANT THE WHOLE SOLVE RESTS ON, by construction. solve()
   places wheels in TRAIN order and a bridge may only hang off a wheel ALREADY
   placed; a cascade is inherently ordered, since each sibling's anchor is the
   previous sibling's lead gear, which is by definition already down. Growth goes
   one way and it starts at the axis, exactly as it did when every bridge hung
   off the spine.

   CHAINS WITH NO WHEELS ARE NOT IN THE TREE AT ALL and are appended afterwards,
   in sibling order, so CHAIN_ORDER[0] is a chain that is actually laid out --
   which is what makes CHAIN_ORDER[0] === SPINE true by construction rather than
   by a sort happening to agree. */
const CHAIN_TREE = (function () {
  const kids = {}, roots = [], order = [], driveFrom = {};
  STAGE.people.filter(HAS_WHEELS).forEach(p => {
    const par = CHAIN_PARENT[p.slug];
    if (par == null) roots.push(p); else (kids[par] = kids[par] || []).push(p);
  });
  const walk = (p) => {
    order.push(p);
    const mine = (kids[p.slug] || []).sort(SIBLING_SORT);
    mine.forEach((k, n) => { driveFrom[k.slug] = n === 0 ? p.slug : mine[n - 1].slug; });
    mine.forEach(walk);
  };
  roots.sort(SIBLING_SORT).forEach(walk);
  return {
    order: order.concat(STAGE.people.filter(p => !HAS_WHEELS(p)).sort(SIBLING_SORT)),
    driveFrom: driveFrom
  };
})();
/* The spine, then the stack, exactly as before -- except that it is no longer
   assembled from two declarations that had to be reconciled. TRAIN is emitted in
   this order and CHAIN_RANK ranks by it. */
const CHAIN_ORDER = CHAIN_TREE.order;
/* WHICH CHAIN A DEPENDENT TAKES ITS DRIVE FROM, by slug: its parent when it is
   the first child, the sibling before it otherwise. A root has no entry, which
   is the one test for "is this chain independent" anywhere below. */
const DRIVE_FROM = CHAIN_TREE.driveFrom;
/* THE SPINE is the chain the composition is built around: the axis every other
   chain runs parallel to, and the one the drive tree grows out of. It is THE
   FIRST ROOT and nothing else -- no longer a declaration of its own (CL#123),
   because a root is exactly what `child: null` means and the first of them is
   exactly what the walk puts first.

   NULL WHEN NOTHING ON STAGE HAS WHEELS, which is the only case CHAIN_ORDER[0]
   is not laid out: the wheel-less chains are appended after the walk, so an
   entirely wheel-less stage is the one stage whose head is one of them. */
const SPINE = CHAIN_ORDER.length && HAS_WHEELS(CHAIN_ORDER[0]) ? CHAIN_ORDER[0] : null;
/* Where each chain sits in that order, by slug: 0 is the spine. The attachment
   search ranks its candidates by it, so a chain that cannot reach its own drive
   source falls back toward the chains nearest it rather than reaching past them. */
const CHAIN_RANK = {};
CHAIN_ORDER.forEach((p, k) => { CHAIN_RANK[p.slug] = k; });
/* HOW MANY WHEELS THE SPINE HAS, and nothing else. It is used as an INDEX BOUND
   -- the middle of the spine is the static tree's default bridge anchor -- so it
   must count the spine's own wheels.

   IT USED TO BE A MAXIMUM: `Math.max(1, ...people.map(links.length))`, the
   longest chain anywhere on stage. That is a different quantity wearing this
   name, and the two agree only while the spine IS the longest chain, which the
   old CHAIN_ORDER sort happened to guarantee and neither a declared spine nor
   the drive tree that replaced it (CL#123) does -- the first root need not be
   the longest chain on stage, and under a tree it need not even be the longest
   root. An index whose validity rests on a sort in another declaration is one edit away
   from pointing past the array it indexes (#98) -- and a malformed static tree is
   exactly what #65 was. The maximum-shaped quantity that genuinely sets the SCALE
   is NOMINAL_CHAIN, further down; it is a maximum over every CONFIGURED person,
   not the stage, and it is not an index into anything. */
const SPINE_LEN = SPINE ? SPINE.links.length : 0;
/* The spine's slug, or '' when nothing on stage has wheels. The one place the
   null spine is dealt with, so neither consumer that wants only the name -- the
   extremities rule in solve(), and which chain chainAxes() calls the spine -- has
   to guard it a second time. */
const SPINE_SLUG = SPINE ? SPINE.slug : '';

/* WHAT EACH CHAIN'S DATUM PLATE IS STAMPED WITH. The name config.js already
   carries, verbatim -- its casing is the casing on the plate. An optional
   `datum` on the person overrides it, for a plate that should not read as the
   picker's label. Never uppercased, never abbreviated, never given a serial: a
   plate that says something other than what the picker says is a second name
   for the same person, and the whole point of the mark is that it names one. */
const DATUM_PLATE = {};
(CONF.PEOPLE || []).forEach(p => { DATUM_PLATE[p.slug] = p.datum || p.name || p.slug; });

/* HOW FAR OUTSIDE THE CHAIN THE MARK MAY STAND, in RENDERED PIXELS.
   "put the datum straight along the side such that the top of the label box is
   no more than 20px outside the extreme border of the side" -- Charles, #76.
   TWENTY IS THE OWNER'S FIGURE AND NOT A DERIVED ONE. It is stated in the
   pixels a viewer actually sees, so it is the one number here that does NOT
   scale with MODULE, and it must not later be "derived" into a module multiple:
   a mark standing a fixed number of modules off its chain stands twice as far
   off on a viewport that renders the machine twice as big, which is the
   half of #76 that made the line look detached from what it references.
   It bounds THE MARK'S OUTERMOST INK, not the line: the line is scribed at
   whatever air is left once that reach is paid for (datumClear), so what the eye
   measures -- the gap between the teeth and the outermost thing the mark draws --
   is what the figure names.

   AND THE REACH IS THE STATION TICKS, WHICH IS WHAT IT WAS NOT (GitHub #141,
   closed). datumClear() paid `plateMetrics().h / 2` -- the reserved rectangle's
   own half-height -- from the day this figure was written, on the reading that the
   plate straddles the line. The ticks are struck 1.2 modules out and the plate
   reaches 1.0, so ink stood 1.200x further out than the payment allowed for, in
   every label treatment including the original chip: 11.67px against 9.73px at
   1440x900. It is plateMetrics().reach now -- a max over every term the shape puts
   outboard of its own line, in the one place the drawing reads its tick length
   from -- so the figure means what it says without a second constant restating it.

   #139 IS NOT WHAT MADE IT WRONG, though that is where it was noticed. #141 was
   filed against CL#164's geometry, where the name sat on one consistent side and
   so reached 33-39px outboard on the chains where that side was the outboard one.
   CL#166 replaced that rule with "opposite the ticks", which puts the name INBOARD
   of the rule on every chain -- so it reaches nothing this figure bounds, and what
   holds it clear of the metal on that side is plateSeat()'s own search. Measured
   at the shipped size and air: 0px of label ink outboard of the scribe, both
   chains, both viewports. */
const PLATE_TOP_CLEAR = 20;

/* HOW FAR ALONG THE LINE THE PLATE SITS FROM THE END OF THE MARK IT IS STAMPED
   AT, in RENDERED PIXELS -- "seat the datum plate 25px from the start of the
   datum line" --
   Charles, GitHub #87. Twenty-five is the owner's figure, in the pixels a viewer
   actually sees, and the same reasoning that keeps PLATE_TOP_CLEAR out of module
   units keeps this out of them.

   WHICH END IT IS MEASURED FROM IS NO LONGER ALWAYS THE START (GitHub #131). The
   figure is the same distance in from whichever end of the mark the plate rides,
   and plateSeat() decides which -- so this stayed one number and one signed step,
   rather than growing a second figure for the far end.

   IT IS A DIFFERENT QUANTITY ON A DIFFERENT AXIS FROM PLATE_TOP_CLEAR, and the
   names say which: TOP_CLEAR is measured ACROSS the line, from the chain's
   extreme border out to the top of the placard; this is measured ALONG the line,
   from that end of the mark in to the plate's near edge. They are neighbours
   and they are unrelated -- one decides where the line is scribed, the other
   decides where along it the plate is stamped. The pair of them was filed
   twice over as one ambiguous "20px" (GitHub #77) before either was written
   down.

   IT IS A PREFERENCE, NOT A GUARANTEE. plateSeat() searches the stations at
   which the whole plate is on the page and clamps to that interval, so on a page
   too narrow to hold the plate that far in, the seat wins and the figure is not
   honoured. See plateSeat(). */
const PLATE_START_ALONG = 25;

/* HOW THE CHAIN'S NAME IS STAMPED ON THE MARK, and it is AWAITING CHARLES'S CALL
   (GitHub #139). One word in this file and deliberately NOT a URL parameter, for
   the reason ORIGIN_MOUNT is not one either: `?seed` is the only determinism
   affordance shipped code carries, and a second switch reachable from the
   address bar is a second way for the page to draw something no gate
   photographs.

   THE COMPLAINT IT ANSWERS is that the two halves of the mark disagree about
   what they are. The scribed line and its ticks are background ink -- part of
   the machine being looked at -- while the name rode on a filled, bordered,
   rounded rect: a UI chip laid ON the page. Charles: "change the datum label to
   a label that looks *etched* into the background ... so the datum line looks
   like a piece of the system we're looking at on the page and the lines names
   are faint overlays with the datum line?"

   THE FIVE TREATMENTS, and what separates them:

     'chip'        the plate as it shipped -- INK.plate body, INK.line border,
                   the name inside it. The baseline a sweep is unreadable
                   without.
     'etch'        no plate at all. The rule is BROKEN around the lettering and
                   the name is struck into the page in its place: a cut copy
                   above the glyph, a lit copy below, the ink copy between them.
     'etch-strike' no plate and no break -- the rule runs behind the name, and
                   each glyph knocks it out with a page-coloured halo. The name
                   reads as cut INTO the line rather than as sitting in a gap in
                   it, and the interruption is the glyph's own shape, so there is
                   no gap width to choose.
     'etch-pocket' a milled recess rather than a chip: the body, no border, and
                   the etched lettering on it. Light mode has the least contrast
                   headroom of the two themes, and this is the variant that keeps
                   a ground under the type to spend it on.
     'etch-mark'   the name struck CLEAR OF the rule -- above it or below it, never
                   in its path -- and set slightly larger, so it reads as an
                   annotation added to the drawing after the fact rather than as
                   part of the line. The rule runs UNBROKEN underneath. Charles,
                   having seen the first sweep: "I had thought the name could be
                   slightly larger and etched either below or above the line --
                   almost as a marker added after the fact?" DATUM_MARK_GROW is its
                   one lever; WHICH side is derived and has no constant -- see the
                   note where DATUM_MARK_SIDE used to be.
     'drop'        the same plateless break as 'etch', with a CSS drop-shadow
                   filter instead of the two-copy relief. Kept as a candidate
                   because it was asked about, and NOT the default: #6 is the
                   standing evidence that a filter on this page is not free, and
                   this one buys nothing the two copies do not.

   WHICHEVER WAY IT LANDS, THE SEAT IS UNTOUCHED. plateSeat() is still asked for
   a rectangle pw wide by PLATE_H tall, in every treatment, so CL#152's clearance
   search and CL#160's far-end anchor solve the same problem they always did. A
   plateless label INKS less of that rectangle than it reserves, which means the
   search could be relaxed -- but relaxing it is a separate change with its own
   sweep, not a side effect of this one. */
const DATUM_LABEL = 'etch-mark';

/* HOW DEEP THE STRUCK LETTERING READS, as a fraction of the label's own font
   size -- the ONE tuned number in this feature, and the one Charles is expected
   to revise once he can see it.

   IT IS THE OFFSET OF THE TWO RELIEF COPIES, not an opacity: the cut copy is
   raised by this much and the lit copy dropped by it, which is the same
   displaced-material trick the rim engravings use and for the same reason --
   LIGHTING ON THIS PAGE IS FROM DIRECTLY ABOVE (#10), so shadow goes ABOVE a
   cut glyph and highlight BELOW it. Any diagonal offset would fight every other
   surface on the page.

   STATED AS A FRACTION OF THE TYPE, so it travels with a label that grows and
   shrinks with the machine, and FLOORED AT ONE RENDERED PIXEL for the reason the
   hairline is (#61): under a device-independent pixel the rasteriser turns a
   relief edge into a grey wash instead of an edge.

   0.12 CLEARS THAT FLOOR AND 0.07 DID NOT. Measured: at 0.07 the offset was
   0.89px on a 1440x900 desk and 0.52px on a 390x844 phone, so the floor bound at
   BOTH and the relief did not scale with the type at all -- it was one pixel
   everywhere, which made it proportionally deeper on the phone than on the desk.
   0.12 gives 1.52px at desk scale, off the floor and travelling with the type as
   this is written to. The phone is still on the floor (0.89px) and that is the
   honest limit of a one-pixel-minimum relief on a small viewport, not a number to
   chase. */
const DATUM_ETCH_DEPTH = 0.12;

/* THERE IS NO CONSTANT FOR WHICH SIDE OF THE RULE THE NAME SITS ON, and that is
   the answer rather than an omission (GitHub #139). It was briefly an
   'out'/'in' switch -- outboard or inboard of the chain the line references --
   and Charles retired the whole idea for a reason neither sweep had weighted:

     "I think one consistent side is the way to go as remember we need to support
      N# of chains"

   OUTBOARD-OF-ITS-OWN-CHAIN IS A RULE THAT DOES NOT SCALE. With two chains it
   reads as an arbitrary mirror -- measured, one name landed left of its rule and
   the other right of its own, in portrait, because each chain's normal is
   mirrored with its origin. With N chains it is worse than arbitrary: labels
   scatter over both sides with no rule a reader can infer, and the composition
   stops being predictable as chains are added. CHAIN_ORDER already supports any
   number of chains (config.js plus the depth-first tree walk), so the rule has to
   hold for N and not for 2.

   SO THE SIDE IS DERIVED, ONCE, IN BRIDGE_BEARING'S OWN SHAPE: the direction is
   taken from the SPINE's outboard normal and every other chain COMPARES BOTH OF
   ITS CANDIDATE SIDES against it, rather than any sign being written down. See
   datumLayer() for the geometry and for why the reference is the assembly rather
   than the origin corner -- that alternative is the same rule and was measured to
   put every name on the side facing the machine on this composition. The
   compare-never-assert phrasing is load-bearing and it is the second half of the
   #67 lesson, the half this file has now had to learn three times: a handedness
   with a hard-coded sign is a legal mirror image of itself, so every measurement
   taken along the mark passes either way and only a screenshot can tell. Nothing
   about it is a screen constant -- turn the stage and the answer turns with it --
   and nothing about it is per-chain, which is the whole point. */

/* HOW MUCH LARGER AN 'etch-mark' NAME IS SET THAN THE PLATE'S OWN LETTERING --
   "slightly larger", which is a judgement and so is a sweep, not a derivation.

   A MULTIPLIER ON THE EXISTING MODULE MULTIPLE, so 1 is exactly today's size and
   nothing about the ratio between the type and the box it reserves moves: the
   label's height is scaled by the same factor, which is what keeps a grown mark
   the same proportions as an ungrown one instead of type crowding a fixed box.

   IT REACHES THE SEAT, DELIBERATELY. plateSeat() is asked to clear the GROWN
   rectangle, because a search that reserves last size's box for this size's
   lettering is a search answering the wrong question. */
const DATUM_MARK_GROW = 1.75;
/* THE AIR BETWEEN THE SCRIBED RULE AND THE NAME'S NEAREST INK, as a multiple of
   plateMargin(S).pad -- the plate's own corner radius, the one distance the mark
   already declares about itself. A JUDGED FIGURE and Charles's to set: "I would
   like the names bigger and closer to the datum line".

   A MULTIPLE OF pad RATHER THAN OF THE TYPE, so this lever and DATUM_MARK_GROW
   are orthogonal: growing the name does not push it away from the rule, which is
   the whole of what was asked for. It still travels with the render scale,
   because pad does.

   MEASURED FROM THE INK, NOT FROM THE RESERVED BOX, which is why 0 is a real
   boundary rather than an arbitrary small number: at 0 the nearest drawn pixel of
   the name touches the outer edge of the rule's own hairline, at any size and for
   any name. Below 0 the rule runs THROUGH the lettering, which is candidate
   'etch-strike' from the first sweep -- Charles rejected it on sight ("reads like
   dirt rather than machining"), so 0 is the floor and not a taste preference. */
const DATUM_MARK_AIR = 1.5;


/* HOW MANY IDLERS STAND BETWEEN A CHAIN AND ITS DRIVE. Never zero -- two chains
   meshing directly would read as one machine, and the idlers are what make the
   drive visible.

   THE SAME COUNT SERVES BOTH KINDS OF DRIVE RUN (CL#123). A dependent's bridge
   carries its drive in from another chain; an independent chain's ORIGIN RUN
   carries it in from off the stage. They are the same run of plain idlers and
   they take the same count, so how many wheels stand between a chain and
   whatever turns it is one number and not two.

   MAX_IDLERS is not a number that looked right. Every wheel in a bridge sits at
   the sum of two pitch radii from its neighbour, so an idler contributes exactly
   its own diameter to the gap between the two chains: the target gap of about
   two wheel diameters IS two idlers at the nominal tooth count. Change the
   target gap and this follows it.

   BOTH IDLERS ARE ALWAYS BUILT INTO TRAIN. How many are actually in mesh is
   decided at solve time from the room the cross axis has (idlerCount()), and the
   surplus is PARKED rather than spliced out -- teeth, colours and centre designs
   are dealt once at load against these indices, and removing an entry on a
   resize would renumber every parent after it and re-deal the machine under the
   pointer, which is the whole of #55. */
const MIN_IDLERS = 1;
const MAX_IDLERS = 2;
/* `roomy` is measured, not assumed: see idlerCount(). Portrait is the case it
   was written for -- there the cross axis is the scarce one and the gap is what
   gives, because the wheels do not. */
const IDLERS_FOR = (roomy) => roomy ? MAX_IDLERS : MIN_IDLERS;

/* WHERE AN INDEPENDENT CHAIN'S OWN DRIVE COMES FROM, and it is the one question
   GitHub #116 left for Charles to answer from a photograph rather than in
   advance. An independent chain is SELF-DRIVEN -- it has its own run of idlers,
   its own resulting direction, and reads as its own machine -- but the run has
   to start somewhere, and there are two honest answers:

     'edge'   the run leaves the chain's lead gear and heads OFF THE STAGE, the
              way an escape run does, so the drive arrives from off-frame and the
              machine reads as continuing past the viewport. The chain's position
              stays SOLVED: it is placed exactly where an undriven chain was
              placed, at the gap its idlers would have occupied, so nothing about
              the fit changes and the gap between chains is still a consequence
              of the drive.

     'fixed'  the run starts at an ANCHORED MOUNT on the stage -- a fixed station
              on the cross axis, one per chain -- and runs inward to the lead
              gear. It reads more deliberate, and it costs the fit a degree of
              freedom: the chain no longer finds its own place, so the gap
              between chains stops being what the idlers take up and becomes
              CHAIN_RANK times ORIGIN_PITCH below.

   THE DEFAULT IS A PLACEHOLDER FOR CHARLES'S CALL, not a preference of the
   code's. 'edge' is defaulted because it is the reading that changes nothing
   else: every other rule in this file about where a chain sits stays exactly as
   written, and the A/B is a one-word edit here.

   IT IS NOT A URL PARAMETER. `?seed` is the only determinism affordance shipped
   code carries (CL#109) and a second switch reachable from the address bar would
   be a second way for the page to draw something no gate photographs. */
const ORIGIN_MOUNT = 'edge';

/* One entry per chain that is DRIVEN BY ANOTHER CHAIN, plus one position-only
   entry per independent chain under ORIGIN_MOUNT 'edge': which person it feeds,
   which TRAIN entries are its bridge idlers (EMPTY for an independent chain,
   which takes its position from the same search and its drive from its own
   origin run instead), the index of the chain's first wheel, which chain it
   takes its drive from and, when that drive comes off a sibling, the exact lead
   gear it is meant to come off. Filled by the TRAIN builder below and read by
   solve(), which decides where each one hangs from. */
const BRIDGES = [];

/* One entry per chain that drives ITSELF: the idlers of its origin run, the
   index of its first wheel, and whether that run is mounted ('fixed') or trails
   off the stage ('edge'). Under 'edge' the idlers are CHILDREN of the lead gear
   and run outward; under 'fixed' they are its PARENTS and run inward from the
   mount. Either way they are TRAIN entries solved WITH the train -- structure,
   not decoration -- and never escape-run machinery, which is computed after the
   fit and may move nothing. */
const ORIGINS = [];

/* THE LEAD GEAR OF EVERY CHAIN, by slug -- the TRAIN index of its first wheel.
   Filled by the TRAIN builder as the walk goes, so it can only ever name a wheel
   already on the array, which is what makes it safe for a later sibling to take
   its drive off. Read afterwards by anything that needs to find a chain's own
   wheels: the attachment search asks it where a candidate's chain begins. It
   used to be recovered by searching BRIDGES for the chain's entry, which was
   answerable only for chains that HAVE a bridge -- and a self-driven one does
   not (CL#123). */
const HEAD_OF = {};

/* One entry per wheel across every chain on stage, plus the idlers that bridge
   each chain onto the spine.

   IT CARRIES NO TOOTH COUNTS AND NO ANGLES, deliberately. Both are dealt fresh
   every load -- dealTeeth() draws each wheel uniformly from [TEETH_MIN,
   TEETH_MAX] and then filters the draw, and the bearing deal below it does the
   same for angles -- so every wheel's values are overwritten before anything
   reads them. The old hand-written numbers here were seeds inherited from the
   original fixed list and were dead the day dealing was introduced: nothing
   between this builder and dealTeeth() reads .teeth or .angle at all. Writing
   them out again would only invite someone to tune a number that has no effect.

   Nor is there a placeholder: dealTeeth() and the bearing deal ASSIGN these
   properties, they never read them, so seeding with TEETH_MIN would not even
   parse here -- that constant is declared further down and would be in its
   temporal dead zone.

   `prof.rim` sets the face radius on UNMARKED wheels only. Every wheel here is
   marked, and a marked wheel takes its face from the engraving band instead, so
   this is a default rather than a per-wheel choice. */
const TRAIN = (function () {
  const out = [];
  /* EMITTED IN CHAIN_ORDER -- the spine, then the stack -- whatever the order in
     PEOPLE, so every bridge hangs off a wheel already on the array. solve()
     derives a wheel's position from g[t.parent] out of the wheels it has ALREADY
     placed, so a parent that appears later than its child reads as undefined and
     the whole branch lands wherever the last iteration happened to leave it.
     Reading the one shared order keeps this, SPINE and the attachment search in
     agreement by construction rather than by three sorts that have to match. */
  CHAIN_ORDER.forEach(p => {
    const links = p.links || [];
    if (!HAS_WHEELS(p)) return;
    /* THE SPINE TAKES NO IDLERS AT ALL, and it is the only chain that does not
       (CL#123). It is the datum the composition is built on, and its two escape
       runs already say the machine continues past the frame at both ends. Every
       OTHER chain arrives through a run of plain idlers: a BRIDGE when something
       on stage drives it, its own ORIGIN RUN when nothing does.

       That is also what keeps a solo page byte-identical in behaviour. One chain
       is one root, the root is the spine, and the spine takes nothing -- the same
       silence `bridge` kept on a single-chain page. */
    const first = out.length === 0;
    const driven = !first && DRIVE_FROM[p.slug] != null;
    const idlers = [], origin = [];
    if (driven) {
      for (let k = 0; k < MAX_IDLERS; k++) {
        /* The first idler's parent is where the bridge HANGS FROM, and that is
           solved rather than placed -- see solve(). The middle of the spine is
           the default so the static tree is well formed before anything runs;
           solve() overrides it with whatever it finds room for.

           IT IS IN RANGE BY CONSTRUCTION, not by luck: this loop skips chains
           with no wheels and emits SPINE first -- CHAIN_ORDER puts the spine at
           its head, and the spine HAS_WHEELS by definition -- and the spine
           takes no idlers, so its wheels ARE out[0 .. SPINE_LEN-1]. Half of
           SPINE_LEN-1 therefore lands on a spine wheel however the tree is
           declared, and nothing here needs the spine to be the longest chain on
           stage. It did before (#98). */
        idlers.push(out.length);
        out.push({ slug: null, prof: { rim: 1.7 },
          parent: k === 0 ? Math.floor((SPINE_LEN - 1) / 2) : out.length - 1,
          person: null, role: 'idler', bridge: p.slug, drive: 'bridge' });
      }
    }
    /* A MOUNTED ORIGIN RUN IS EMITTED BEFORE ITS CHAIN, because it drives it: the
       lead gear parents onto the last idler still in mesh, exactly as a bridged
       chain's does. Its first idler is a ROOT with no parent at all -- the only
       wheel on the page whose position is a station rather than a relationship --
       and solve() puts it on the mount. */
