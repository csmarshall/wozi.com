<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- config.js MUST load before support.js: the runtime below reads WOZI_CONFIG
     while building the train, so it has to already exist. It is a plain script,
     not a module, for exactly that reason -- a module would defer.
     It is also named in the deploy whitelist; a file in the repo does not reach
     the web on its own. -->
<script src="./config.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%233B7DE8'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E" />
<title>wozi.com</title>
<style>
:root{
  /* The page background is deliberately off a bright white. #F1F2F0 sat at 0.885
     luminance, which is a lot of glare full-screen and left the #FFFFFF badges
     almost nothing to separate from (1.12:1). At 0.817 the badges lift to 1.21:1
     and the ink still clears 11:1. --muted darkens with it so the wordmark TLD,
     which is large text on this colour, stays above the 3:1 floor (#16). */
  --bg:#E8EAE5; --ink:#20302E; --muted:#6B7E7C; --hair:#D5DAD6; --chip:#FFFFFF;
  --accent:#3B7DE8; --shadow:0 1px 2px rgba(20,40,38,.06);
  --m1:#FFFFFF; --m2:#D4DADE; --m3:#98A2A9; --m4:#5F686E;
  --b1:#F7E7BE; --b2:#DFC183; --b3:#B08F45; --b4:#7A5F28;
  --edge:rgba(12,22,28,.38); --gloss:rgba(255,255,255,.8);
  /* --gsfit is the fit scale, and it is a READOUT, not a lever: the train's
     geometry is multiplied by it in JS at render time so every wheel is drawn at
     the size it is displayed (#37). It used to feed a `transform: scale()` on the
     gear container, which meant the wheels were rasterised small and stretched.
     The value here is the boot fit, used for the first render before fitStage()
     has measured anything; gsRender() reads it from this declaration so the two
     cannot drift apart. */
  --s:1; --gsfit:0.86;
  --dir:row; --pad:5vw; --gap:4vw; --colw:400px;
  /* Corner spacing is one icon width, so the gap around the theme toggle reads
     the same as the icon it sits next to. The button is larger than its icon and
     centres it, so the button box is pulled in by half that difference — derived
     rather than hardcoded, so changing either size keeps the icon on the mark.
     The wordmark sits on --btnoff too, the same offset as the button's box, so
     the two bottom/top corners are inset by the same amount rather than one
     being measured to a box and the other to a glyph. Neither reads --btnoff
     directly any more: both go through the --off* tokens below, which add the
     safe-area inset for the edge each one is pinned to. */
  --icon:20px; --btn:44px;
  /* Gap between the three corner buttons. The 44px button is a TOUCH TARGET,
     deliberately larger than the 20px glyph it holds, so the visible spacing
     is already the button's own padding plus this -- which is why a flat 6px
     read as a wide, loose row. Clamped and viewport-relative so a phone packs
     them tight and a large display lets them breathe, without either end
     colliding or drifting apart. */
  --btngap:clamp(0px, 0.6vw, 8px);
  --corner:var(--icon);
  --btnoff:calc(var(--corner) - (var(--btn) - var(--icon)) / 2);
  /* THE STAGE BLEEDS, THE CONTROLS DO NOT. `viewport-fit=cover` hands the page
     the whole display on iOS/iPadOS — under the notch, under the home
     indicator, behind Safari's translucent toolbars — so the machine reads as a
     window onto a running train rather than a picture inside a box. The four
     fixed controls are the one thing that must stay out of those regions: a
     button under the home indicator is hard to tap and can be impossible.

     So each fixed corner offset is --btnoff PLUS that edge's inset, and the
     insets are held in their own tokens rather than written into the offsets.
     Two reasons. A bare env() inside a calc() is invalid on a browser that has
     never heard of env(), and an invalid `top`/`right` does not fall back to
     --btnoff, it falls back to auto — the buttons would lose their corner
     entirely. And a plain custom property can be given a value at runtime,
     which is how tools/devices.py exercises this without a notched phone. */
  --safe-t:0px; --safe-r:0px; --safe-b:0px; --safe-l:0px;
  --offtop:calc(var(--btnoff) + var(--safe-t));
  --offright:calc(var(--btnoff) + var(--safe-r));
  --offbot:calc(var(--btnoff) + var(--safe-b));
  --offleft:calc(var(--btnoff) + var(--safe-l));
}
@supports (top:env(safe-area-inset-top)){
  :root{--safe-t:env(safe-area-inset-top,0px);--safe-r:env(safe-area-inset-right,0px);
        --safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);}
}
:root[data-theme="dark"]{
  --bg:#1E2226; --ink:#EEF1F0; --muted:#93A5A3; --hair:#373E3D; --chip:#2A3034;
  --accent:#7FA9F0; --shadow:0 1px 2px rgba(0,0,0,.35);
  --m1:#AEB8BF; --m2:#7C858C; --m3:#4E565C; --m4:#2B3135;
  --b1:#D8B978; --b2:#A98844; --b3:#75592A; --b4:#463618;
  --edge:rgba(0,0,0,.6); --gloss:rgba(255,255,255,.38);
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
a{color:var(--accent);text-decoration:none;}
a:hover{color:var(--ink);}
/* The links ARE the content, so a keyboard user who cannot see focus cannot use
   the site at all (#23). :focus-visible keeps the ring off mouse clicks; the
   outline follows each element's own border-radius, so it rings the discs. */
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
/* ===========================================================================
   WHAT YOU CAN EDIT WITHOUT DOING GEOMETRY

   The file mixes two kinds of thing. This is a map of the first kind: content
   and taste, safe to change on its own. Everything else derives from MODULE and
   is checked by `npm test`, which reads its constants straight out of this file.

     SITES            the link table -- where each wheel points, its label and
                      the handle engraved on its rim. Add or retarget freely.
     PAIRS / SINGLES  which handles are siblings (they get neighbouring wheels)
                      and which stand alone. PAIR_SLOTS says which wheel indices
                      count as neighbours.
     BRAND / ACCENTS  per-service mark colour, and the accent each theme uses.
     WHEEL_POOL       the colour pool wheels are dealt from -- the original
                      template's seven plus three gap-fillers. Shuffled per load;
                      the deal refuses neighbours closer than 40 degrees of hue.
     CENTRE_FAMILIES  the kinds of gear centre, and the variants of each. Adding
                      a family puts it in rotation and in the Table of Gears at
                      once. Admission rule, Charles's: a wheel a machinist could
                      make, a visible load path hub to rim, no floating metal,
                      and not boring.
     TRAIN            which handle sits on which wheel. Tooth counts and bearing
                      angles in here are only SEEDS -- both are dealt per load.

   Change any of these and the machine still works. Change MODULE, TOOTH_*,
   BAND_*, RIM_UNDER_BAND, MIN_MODULE or the deal bounds and gear sets that
   nothing has measured become reachable: run `npm test` before you push.
   =========================================================================== */

/* The train itself rests via the frame loop (#3) — this only stills the UI
   transitions: badge scale, tooltip fade, toggle colour. */
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
@media (max-width:1080px){:root{--gap:2rem;--pad:6vw;}}
@media (max-width:760px){:root{--pad:28px;--colw:100%;}}
@media (max-width:430px){:root{--gap:1.25rem;}}
</style>
</helmet>

<main style="min-height:100vh;min-height:100svh;box-sizing:border-box;display:flex;flex-direction:var(--dir);align-items:center;justify-content:center;gap:var(--gap);padding:var(--pad);background:var(--bg);overflow:hidden;">

  <button onClick="{{ toggleTog }}" title="{{ togLabel }}" aria-label="{{ togLabel }}" aria-expanded="{{ togExpanded }}" style="position:fixed;top:var(--offtop);right:calc(var(--offright) + (var(--btn) + var(--btngap)) * 2);z-index:20;display:flex;align-items:center;justify-content:center;width:var(--btn);height:var(--btn);padding:0;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;transition:color .18s ease;" style-hover="color:var(--ink);">
    {{ togIcon }}
  </button>
  <button onClick="{{ toggleMotion }}" title="{{ motionLabel }}" aria-label="{{ motionLabel }}" aria-pressed="{{ motionPressed }}" style="position:fixed;top:var(--offtop);right:calc(var(--offright) + var(--btn) + var(--btngap));z-index:20;display:flex;align-items:center;justify-content:center;width:var(--btn);height:var(--btn);padding:0;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;transition:color .18s ease;" style-hover="color:var(--ink);">
    {{ motionIcon }}
  </button>
  <button onClick="{{ toggleTheme }}" title="{{ themeLabel }}" aria-label="{{ themeLabel }}" style="position:fixed;top:var(--offtop);right:var(--offright);z-index:20;display:flex;align-items:center;justify-content:center;width:var(--btn);height:var(--btn);padding:0;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;transition:color .18s ease;" style-hover="color:var(--ink);">
    {{ themeIcon }}
  </button>

  <nav aria-label="Table of gears" style="{{ togPanelStyle }}">
    <div style="font:700 11px/1 'Manrope',system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:4px 12px 8px;">Table of Gears</div>
    <sc-for list="{{ togList }}" as="tg">
      <a href="{{ tg.href }}" aria-current="{{ tg.current }}" style="{{ tg.style }}">{{ tg.label }}</a>
    </sc-for>
  </nav>
  <div ref="{{ stageRef }}" tabindex="0" role="application" aria-label="Animated gear machine. Press the left or right arrow key to spin it." onKeyDown="{{ onStageKey }}" onPointerDown="{{ onGrab }}" onPointerEnter="{{ onStageEnter }}" onPointerLeave="{{ onStageLeave }}" style="{{ stageStyle }}">
    {{ gearArt }}
    <sc-for list="{{ links }}" as="link" hint-placeholder-count="7">
      <a href="{{ link.href }}" draggable="false" aria-label="{{ link.label }}" onPointerDown="{{ link.badgeDown }}" onDragStart="{{ link.noDrag }}" onClick="{{ link.clickGuard }}" onMouseEnter="{{ link.enter }}" onMouseLeave="{{ link.leave }}" onFocus="{{ link.enter }}" onBlur="{{ link.leave }}" style="{{ link.discStyle }}">
        {{ link.iconEl }}
        {{ link.tipEl }}
      </a>
    </sc-for>

  </div>

  <div ref="{{ colRef }}" style="position:fixed;left:var(--offleft);bottom:var(--offbot);z-index:15;">
    <h1 style="margin:0;display:flex;align-items:baseline;gap:2px;font-weight:800;font-size:clamp(30px,4.6vw,54px);letter-spacing:-0.045em;line-height:1;color:var(--ink);">
      <span>{{ brandName }}</span>
      <span style="width:.16em;height:.16em;border-radius:50%;background:var(--accent);align-self:flex-end;margin-bottom:.14em;"></span>
      <span style="color:var(--muted);font-weight:600;">{{ brandTld }}</span>
    </h1>
  </div>
</main>

</x-dc>
<!-- SHIPPED LAYER DEFAULTS -- these are intentional, not leftover preview values (#8).
     `data-props` below is both the editor's schema AND the runtime default whenever
     a prop isn't overridden, so its "default" fields are the actual live settings:

       spinUp:true        train winds up from rest on the flywheel
       engravedRims:true  handle struck into each wheel's band -- Charles wants this
                          visible; do not turn off
       parallax:false     off deliberately, commit e6936a7 ("tweak: steel accent,
                          parallax off, tighter corners")
       character:false    chip + machinist stamp, turned off in commit 2e5a721
                          ("fix: #16 ... chips off")
       hoverDrag:true     hover loads the machine to ~40% speed
       accent:"#5F686E"   the steel tone taken from the machine's own metal (--m4
                          light / --m1 dark), Charles's explicit choice, also from
                          e6936a7 -- supersedes both the shipped-in-error red
                          (#E8483A) and the blue SESSION-LOG.md calls "committed"
                          (#3B7DE8); neither of those is what ships today

     SESSION-LOG.md's "Tweak state at handoff" section describes the *original*
     no-repo build session, before either of the two commits above existed -- it
     is a historical record of that one session, not a running description of
     HEAD, and was never updated (nor should it be) as later real commits moved
     these values on. Read this comment block, not that file, for what is live. -->
<script type="text/x-dc" data-dc-script data-props="{&quot;domain&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Wordmark&quot;},&quot;frameRate&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[60,30,24,20],&quot;default&quot;:30,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Gears&quot;},&quot;spinUp&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layers&quot;},&quot;engravedRims&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layers&quot;},&quot;parallax&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layers&quot;},&quot;character&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layers&quot;},&quot;hoverDrag&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layers&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.25,&quot;max&quot;:2,&quot;step&quot;:0.25,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Gears&quot;},&quot;gearScale&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.5,&quot;max&quot;:1.3,&quot;step&quot;:0.05,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Gears&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#5F686E&quot;,&quot;#E8483A&quot;,&quot;#3B7DE8&quot;,&quot;#F4B32B&quot;,&quot;#1FA463&quot;],&quot;default&quot;:&quot;#5F686E&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Gears&quot;},&quot;shuffle&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Gears&quot;}}">
const MODULE = 7;

/* Tooth form. Uniform across the train and derived from the module — never set
   per wheel. Per-wheel `add` and `tip` were the #15 mistake repeated on the tooth
   profile: a set maintained by judgement drifts, and this one had drifted into a
   train where some pairs collided and others left a visible gap (#11).

   Measured against the real outlines at all six adjacent pairs:
     as shipped (base 66%, add 0.88-1.05, tip 0.31-0.40)
       4 points of one wheel's outline inside its neighbour's, up to 1.42px deep
     this form
       0 penetrating points, 1.76px of clearance at the mesh

   The tooth had been a fat wedge — 66% of the circular pitch at the root tapering
   to 31-40% at the tip — and it is fat roots that collide as they swing through
   mesh. Narrowing the base to 48% removes the interference at the same engagement
   depth. These values sit on a plateau (44-48% base and 0.34-0.36 tip all measure
   clean), so the result is not balanced on a knife edge. Raising the addendum to
   0.95 or the base to 52% brings contact straight back. */
const TOOTH_PA = 20;      /* pressure angle in degrees — 20 is the modern standard */
const TOOTH_ADD = 1.00;   /* addendum, in modules — standard full-depth */
const TOOTH_DED = 1.25;   /* dedendum, in modules — standard, leaves root clearance */
const TOOTH_THICK = 0.495; /* tooth thickness at the pitch circle, as a fraction of the
                              circular pitch. A real gear is 0.5 exactly and the shortfall
                              is backlash. Measured at all six pairs: 0.495 gives zero
                              interference with 0.11px between the flanks, so they read as
                              touching without anti-aliasing ever fusing them. */
/* Depth of the engraving band, in modules — uniform on every wheel. Module-based
   rather than a fraction of the radius, which is what keeps the band exactly as
   wide on a 13-tooth blank as on a 19-tooth one.

   Sized to the TEXT it carries and not a pixel more: engraving() sets the handle
   at 0.80 modules, so 1.59 leaves about 0.4 of a module of clear
   metal above and below it. Sized for the WORST glyph rather than the average:
   an underscore is a hairline sitting low in the line, and it is the first
   character to become unreadable when the channel is tight. It was 2.1 — two and a half times the height of its
   own lettering — and on a small blank that surplus was over half the radius,
   which is what squeezed the works into a coin in the middle of a lot of metal. */
const BAND_DEPTH = 1.59;
/* How far in from the tooth roots the engraving band starts, in modules. */
const BAND_RISE = 1.3;
/* The ring of metal left BELOW the band, in modules, before anything may be cut
   into the blank. The band alone is not the reserve: a wheel needs a continuous
   ring under it or the engraving is sitting on the edge of a hole. */
const RIM_UNDER_BAND = 0.6;
/* Where the middle of a line of Manrope sits above its own alphabetic baseline,
   in ems: half of (ascent - descent), measured off the loaded face as 1.07 and
   0.30. The engraving needs this because it does NOT ask the engine to centre
   the type for it — see engraving(). `dominant-baseline: central` is the one
   property in this file that three engines answer three ways, so the ring the
   type rides on is offset by hand instead and the type is hung off the plain
   alphabetic baseline, which every engine puts in the same place (#26).

   The number is OURS, not the engine's: nothing reads a font metric at runtime,
   so the same radius comes out of Blink, WebKit and Gecko alike. If Manrope
   fails to load, the fallback's own middle differs by a few hundredths of an em
   — on the order of a fifth of a pixel against an 11px band. */
const BASELINE_MID = 0.385;
const TOOTH_ROOT_MIN = 4;  /* px floor under any root circle. Without it a tiny gear
                              computes a negative root radius; with it, a gear small
                              enough to hit the floor comes out with SHORT teeth that
                              no longer reach their partner. Anything sizing a gear
                              must check this rather than trip over it — see
                              planetaryMenuFor(). */
const TOOTH_FILLET = 0.38; /* root fillet radius, in modules — the standard value that
                              goes with 20-degree full depth. Without it the flank meets
                              the root circle at a sharp corner, which no cut gear has. */

const BASE_MS = 21000;
const GHOST_COLORS = ['#9AA6AD', '#A9B4BA', '#8F9BA3', '#B3BCC2'];

const GHOST_KINDS = ['spokes', 'holes', 'pockets', 'ring', 'spiral'];
function segCross(p1, p2, p3, p4) {
  const s = (a, b, c) => (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
  return s(p1, p2, p3) * s(p1, p2, p4) < 0 && s(p3, p4, p1) * s(p3, p4, p2) < 0;
}
function segDist(p, a, b) {
  const vx = b.x - a.x, vy = b.y - a.y, L = vx * vx + vy * vy;
  let t = L ? ((p.x - a.x) * vx + (p.y - a.y) * vy) / L : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + t * vx), p.y - (a.y + t * vy));
}
const ENDS_APART = 90; /* extra push between the first and last wheel of the visible run */
const CLEARANCE = 13; /* px kept between the tip circles of wheels that are not meshed */

/* The gear train. Each entry meshes with the one before it:
   teeth  — tooth count (sets size and speed)
   angle  — bearing in degrees from the previous gear's centre
   slug   — icon/link to seat on this gear's hub (omit for a plain idler)
   metal  — 'steel' | 'brass'
   Add or remove an entry and the whole train re-solves: spacing, direction, ratio. */
/* Seven site wheels of near-equal size, each with its own web design.
   `link: 'chain'` (or `'belt'`) drives the next wheel by strand instead of tooth mesh.
   No entry sets one today, so no chain or belt is drawn — see CLAUDE.md,
   "Dormant capability: chain and belt", before re-enabling either. */
/* One directly-meshed train: every wheel drives its neighbour, so spacing is fixed by
   the pitch radii and only the bearing varies — a gentle serpentine, no slack to fold. */
/* ---------------------------------------------------------------------------
   THE CONFIG. Settings live in config.js; this file keeps the machinery.

   There is deliberately NO fallback copy of the link table here. A duplicate is
   the one failure this whole split exists to prevent: edit one, forget the
   other, and the page ships something nobody chose. So if the config is missing
   the machine still turns -- on unlinked wheels -- and says loudly why, which is
   visibly wrong rather than quietly stale. CI asserts config.js is reachable and
   parses, so that state should never reach production.
   --------------------------------------------------------------------------- */
const CFG = (typeof window !== 'undefined' && window.WOZI_CONFIG) || null;
if (!CFG) console.error('wozi: config.js did not load — the train will render '
  + 'without links. Check that it is published (deploy.yml whitelist).');
const CONF = CFG || { SERVICES: {}, PEOPLE: [], PAIR_SLOTS: [], PAIRS: [],
  SINGLES: [], BRAND: {}, PILL_STACK: {}, ACCENTS: {},
  WHEEL_POOL: ['#4A90E2', '#17A05C', '#8CB8F2'] };

/* Which person's chain is on stage. The hostname decides it, so one CloudFront
   distribution carrying several alternate domain names serves this same
   byte-identical object to all of them and each lands on its own chain --
   selection happens here rather than at the edge, so nothing has to vary by
   Host and one cached object covers every domain. `?who=` overrides, for
   testing a chain from any host. */
const WHO = (function () {
  const people = CONF.PEOPLE || [];
  if (!people.length) return { slug: '', name: '', links: [] };
  let q = '';
  try { q = new URLSearchParams(location.search).get('who') || ''; } catch (e) {}
  const host = (typeof location !== 'undefined' && location.hostname) || '';
  return people.find(p => p.slug === q)
      || people.find(p => (p.hosts || []).indexOf(host) >= 0)
      || people[0];
})();

/* TRAIN is DERIVED from the active person's links now, rather than authored.

   IT CARRIES NO TOOTH COUNTS AND NO ANGLES, deliberately. Both are dealt fresh
   every load -- dealTeeth() draws each wheel uniformly from [TEETH_MIN,
   TEETH_MAX] and then filters the draw, and the bearing deal below it does the
   same for angles -- so every wheel's values are overwritten before anything
   reads them. The old hand-written numbers here were seeds inherited from the
   original fixed list and were dead the day dealing was introduced: nothing
   between this line and dealTeeth() reads .teeth or .angle at all. Writing them
   out again would only invite someone to tune a number that has no effect.

   Nor is there a placeholder: dealTeeth() and the bearing deal ASSIGN these
   properties, they never read them, so seeding with TEETH_MIN would not even
   parse here -- that constant is declared further down and would be in its
   temporal dead zone.

   `prof.rim` sets the face radius on UNMARKED wheels only. Every wheel here is
   marked, and a marked wheel takes its face from the engraving band instead, so
   this is a default rather than a per-wheel choice. */
const TRAIN = (WHO.links || []).map(l => ({ slug: l.slug, prof: { rim: 1.7 } }));

/* The tooth counts above are the seed, not the answer: they are dealt per load,
   so the machine has a different silhouette every visit rather than the same
   illustration in new paint. Everything downstream survives it by construction —
   centre distances are the sum of two pitch radii, so a re-sized train still
   meshes, and the engraving band is module-based, so it stays exactly as wide on
   a 13-tooth blank as on a 19.

   The deal is constrained, not free. The total sets the train's overall length,

const ROOT_MARGIN = 1.05;
/* Two things have to be true, and they pull against each other.

   A root circle must clear TOOTH_ROOT_MIN, or teethPath floors it and the teeth
   come out stubs. That argues for FEW teeth on each member.

   And the module itself must stay big enough for a tooth to read as a tooth:
   m2 is the tooth's whole scale, so a set with a 44-tooth ring inside a small
   bore has teeth about a pixel tall — geometrically perfect, visually a fuzzy
   circle. That argues for a SMALL ring tooth count, since m2 = 2*bore/(Zr+4).

   Together they say what Charles's calculation says: the blank decides how many
   planets it can carry and how many teeth each one gets. */
const MIN_MODULE = 1.8;
function planetaryMenuFor(teeth) {
  const bore = planetaryBore(teeth);
  const seen = {}, fits = [], nearest = [];
  PLANETARY_FLAVOURS.forEach(function (c) {
    /* Eight is the planet floor, and it is measured rather than chosen. Below it
       a pinion reads as a Maltese cross rather than a gear and would be badly
       undercut in metal -- and, concretely, every seven-tooth set fouls the ring
       even against the stub addendum, because the ring tooth reaches past such a
       small planet's base circle. Measured in tools/mesh_epi.js: at eight, all
       fifteen sets this can deal clear both meshes at zero penetration. */
    const cands = enumeratePlanetaries({ N: c[0], sunBias: c[1], ZrMin: 24, ZrMax: 44, minTeeth: 8 });
    for (let i = 0; i < cands.length; i++) {
      const s = cands[i];
      /* mirrors gearSvg exactly: bore = Rr + 2*m2 and m2 = 2*Rr/Zr */
      const m2 = 2 * bore / (s.Zr + 4);
      const worst = m2 * (Math.min(s.Zp, s.Zs) / 2 - TOOTH_DED);
      /* one score, so the fallback can rank sets that satisfy neither */
      const score = Math.min(worst / (TOOTH_ROOT_MIN * ROOT_MARGIN), m2 / MIN_MODULE);
      if (score >= 1) {

        if (!seen[key]) { seen[key] = 1; fits.push({ pg: [s.Zs, s.Zp, s.Zr, s.N] }); }
        return;                 /* candidates are bias-sorted: first with room wins */
      }
      nearest.push({ score: score, pg: [s.Zs, s.Zp, s.Zr, s.N] });

     far more of them than single-row sets, so merging the lists would make the

     set whose teeth would be floored into stubs. Only reachable through
     ?kind=planetary, which forces every wheel; a dealt planetary is always seated
     on the largest blank in the train, and the tooth deal guarantees one. */
  nearest.sort(function (a, b) { return b.score - a.score; });
  return { one: [nearest.length ? { pg: nearest[0].pg } : { pg: [12, 9, 30, 3] }], two: [], fallback: true };
}

      off.y = ev.clientY - sy + oy0;
      off.vx = 0; off.vy = 0;
      if (Math.hypot(ev.clientX - sx, ev.clientY - sy) > 6) moved = true;
      this._badgeDragging = slug;
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      this._badgeDragging = null;
      if (moved) this._badgeMoved = slug;
      /* Nothing else re-renders on release, so the pill would stay open until
         the next unrelated render. */
      this.forceUpdate();
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  }

  /* Whether the train should run right now. The stored override wins in either
     direction; otherwise follow prefers-reduced-motion. A person who chose
     motion gets motion, whatever their OS setting says -- user-initiated motion
     is the user's choice (#3), and the same control is a pause button for
     everyone else. */
  motionActive() {
    if (this.state.motion === 'run') return true;
    if (this.state.motion === 'rest') return false;
    return !(this._rmq && this._rmq.matches);
  }

  /* Stable per-load randomness, so a resize re-seeds the same background machinery. */
  rnd() {
    this._seed = (this._seed || 20260729) * 1664525 + 1013904223 & 0x7fffffff;
    return this._seed / 0x7fffffff;
  }

  /* Background machinery: extra wheels seeded off each edge, meshed onto the visible
     train, dimmed and set behind it so they read as context rather than content. */
  fitEscapes() {
    const stage = this._stageRef.current;
    if (!stage) return;
    const solved = this.solve();
    const rect = stage.getBoundingClientRect();
    if (!rect.width) return;
    /* READ THE SCALE OFF THE STAGE, exactly as onGrab does, rather than taking
       the fit this pass computed. The runs are placed in screen space and stored
       in solve units, so the number that converts between them has to be the one
       the stage is ACTUALLY drawn at right now. Handing in the new target instead
       made the two disagree for one pass -- and since a different ghost set
       re-renders the stage, which changes the rect, which yields a different
       ghost set, the two never settled and the render loop never ended. */
    const gs = rect.width / solved.w;
    const vw = window.innerWidth, vh = window.innerHeight;
    const ghosts = [];
    this._seed = 20260729;
    const hosts = [solved.gears[0], solved.gears[solved.gears.length - 1]];
    const taken = [];
    const crosses = (p1, p2, p3, p4) => {
      const s = (a, b, c) => (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
      return s(p1, p2, p3) * s(p1, p2, p4) < 0 && s(p3, p4, p1) * s(p3, p4, p2) < 0;
    };
    /* The escape runs continue the train's OWN AXIS rather than leaving by whichever
       screen edge happens to be nearest. Nearest-edge was measuring the wrong thing:
       on a wide, short viewport the closest edges are the top and bottom, so one run
       climbed off the top and the other dropped off the bottom — a horizontal train
       with a vertical tail at each end, which reads as an S rather than as a machine
       continuing past the frame (#10). Continuing the axis is what SESSION-LOG says
       these are for, and it fills a wide display instead of stranding the train in
       the middle of one. */
    const first = solved.gears[0], last = solved.gears[solved.gears.length - 1];
    const axisDeg = Math.atan2(last.cy - first.cy, last.cx - first.cx) * 180 / Math.PI;
    /* How far a heading travels before it leaves the viewport. */
    const reachAlong = (px, py, deg) => {
      const a = deg * Math.PI / 180, dx = Math.cos(a), dy = Math.sin(a);
      let t = Infinity;
      if (dx > 1e-6) t = Math.min(t, (vw - px) / dx);
      else if (dx < -1e-6) t = Math.min(t, -px / dx);
      if (dy > 1e-6) t = Math.min(t, (vh - py) / dy);
      else if (dy < -1e-6) t = Math.min(t, -py / dy);
      return Math.max(0, t === Infinity ? 0 : t);
    };
    hosts.forEach((host, ei) => {
      const sx = rect.left + host.cx * gs, sy = rect.top + host.cy * gs;
      /* The first wheel continues backwards along the axis, the last one onwards.
         A small arc either side is searched only to dodge a run already placed —
         the axis itself is always tried first. */
      const want = ei === 0 ? axisDeg + 180 : axisDeg;
      let e = null;
      const offsets = [0, 16, -16, 32, -32, 50, -50];
      for (let q = 0; q < offsets.length; q++) {
        const ang = want + offsets[q];
        const reach = reachAlong(sx, sy, ang);
        const oa = ang * Math.PI / 180;
        const seg = [{ x: sx, y: sy }, { x: sx + (reach + 80) * Math.cos(oa), y: sy + (reach + 80) * Math.sin(oa) }];
        if (!taken.some(t => crosses(seg[0], seg[1], t[0], t[1]))) { e = { ang: ang, reach: reach }; break; }
      }
      if (!e) return;
      const ea = e.ang * Math.PI / 180;
      taken.push([{ x: sx, y: sy }, { x: sx + (e.reach + 80) * Math.cos(ea), y: sy + (e.reach + 80) * Math.sin(ea) }]);
      if (e.reach < 60) return;
      const span = e.reach / gs;
      let prev = { cx: host.cx, cy: host.cy, r: host.r, teeth: host.teeth, dir: host.dir, phase: host.phase };
      let reached = 0, k = 0;
      /* Keep adding wheels until the run is genuinely off the edge; they grow as they
         go, so a tall screen does not need a long string of identical pinions. */
      while (reached < span + 120 && k < 7) {
        const teeth = Math.min(26, 11 + k * 2 + Math.floor(this.rnd() * 8));
        const r = MODULE * teeth / 2;
        const wobble = (this.rnd() * 2 - 1) * 20;
        const ang = e.ang + wobble;
        const a = ang * Math.PI / 180, d = prev.r + r;
        const cx = prev.cx + d * Math.cos(a), cy = prev.cy + d * Math.sin(a);
        const pPrev = 360 / prev.teeth, pThis = 360 / teeth;
        let u = ((ang - prev.phase) / pPrev) % 1;
        if (u < 0) u += 1;
        const phase = ang + 180 - (0.5 - u) * pThis;
        const g = { cx: cx, cy: cy, r: r, teeth: teeth, dir: -prev.dir, phase: phase,
          color: GHOST_COLORS[Math.floor(this.rnd() * GHOST_COLORS.length)],
          kind: GHOST_KINDS[Math.floor(this.rnd() * GHOST_KINDS.length)], arms: 3 + Math.floor(this.rnd() * 5),
          prof: { rim: 1.5 + this.rnd() * 0.8,
            web: 2.4 + this.rnd() * 1.2, hub: 0.18 + this.rnd() * 0.14, hole: 0.09 + this.rnd() * 0.05, arm: 0.14 + this.rnd() * 0.08 },
          ro: r + MODULE * 0.95, i: 'gh' + ei + k };
        ghosts.push(g);
        reached += d;
        prev = g;
        k++;
      }
    });
    const key = ghosts.map(g => [g.cx | 0, g.cy | 0, g.teeth].join()).join('|');
    if (key !== this._escKey) { this._escKey = key; this.setState({ ghosts: ghosts }); }
  }

  applyRotation() {
    /* Skip frames where nothing moved enough to see. */
    if (this._lastM !== undefined && Math.abs(this._M - this._lastM) < 0.05) return;
    this._lastM = this._M;
    const gears = this.solve().gears;
    if (this._spinEls) {
      for (let i = 0; i < gears.length; i++) {
        const el = this._spinEls[i];
        if (el) el.style.transform = 'rotate(' + (gears[i].phase + gears[i].dir * this._M / gears[i].teeth).toFixed(3) + 'deg)';
      }
    }
    if (this._ghostEls) {
      /* LAYER: parallax — the far plane runs a touch slower than the near one. */
      const lag = this.props.parallax ? 0.78 : 1;
      this._ghostEls.forEach(x => {
        if (x.el) x.el.style.transform = 'rotate(' + (x.g.phase + x.g.dir * this._M * lag / x.g.teeth).toFixed(3) + 'deg)';
      });
    }
    if (this._chainEls) {
      const PITCH = Math.PI * MODULE;
      this._chainEls.forEach(c => {
        if (c.el) c.el.style.strokeDashoffset = (-this._M * PITCH / 360 * c.sign).toFixed(2) + 'px';
      });
    }
    /* Planetary internals: sun, carrier and planet spins are all fixed multiples
       of their host wheel's angle -- one clock, several ratios. k is the factor
       RELATIVE to the wheel (the svg lives inside the rotating wheel div):
       sun -1 (stationary in page frame), carrier -Zs/(Zs+Zr), planet spin
       +ZrZs/(Zp(Zr+Zs)). */
    if (this._epiEls) {
      for (let i = 0; i < this._epiEls.length; i++) {
        const e = this._epiEls[i];
        if (e.el) e.el.style.transform = 'rotate(' + (e.base + e.k * (e.g.dir * this._M / e.g.teeth)).toFixed(3) + 'deg)';
      }
    }
  }

  startPhysics() {
    this._M = 0;
    this._dirSign = 1;
    /* prefers-reduced-motion (#3): the machine comes to REST through this same
       loop -- the idle target becomes zero, and the flywheel physics settles it
       gently instead of freezing it mid-tooth. The flag is read fresh every
       tick, mirroring the sleep gate: #7 is what happens when a flag can latch.
       A deliberate drag or key press still spins it -- user-initiated motion is
       the user's choice -- and friction then returns it to rest. */
    this._rmq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    let savedMotion = null;
    try { savedMotion = localStorage.getItem('wozi-motion'); } catch (e) {}
    if (savedMotion === 'run' || savedMotion === 'rest') this.state.motion = savedMotion;
    const startRunning = savedMotion === 'run' ? true
      : savedMotion === 'rest' ? false : !(this._rmq && this._rmq.matches);
    this._v = (this.props.spinUp === false && startRunning) ? this.idleRate() : 0;
    let last = performance.now();
    const step = (now) => {
      /* Cap the update rate. Divisors of the display refresh judder least, which is why
         30 beats 24 on a 60Hz panel: 60/30 = 2 whole frames, 60/24 = 2.5. */
      const budget = 1000 / (this.props.frameRate ?? 30) - 1.5;
      if (now - last < budget) { this._raf = requestAnimationFrame(step); return; }
      const dt = Math.min(60, now - last);
      last = now;
      /* One expression decides whether to integrate — nothing can latch it asleep. */
      const asleep = document.hidden || this._offscreen === true;
      if (!this._dragging && !asleep) {
        /* Flywheel: bleed back toward the train's natural pace. */
        /* LAYER: hover drag — attention loads the machine and it slows a little. */
        const load = (this.props.hoverDrag && (this.state.hover || this.state.overStage)) ? 0.4 : 1;
        const target = this.motionActive() ? this._dirSign * this.idleRate() * load : 0;
        this._v += (target - this._v) * (1 - Math.exp(-dt / 900));
        this._M += this._v * dt;
        this.applyRotation();
      }
      /* Magnetic hub caps: underdamped spring (zeta ~0.5) so a released cap
         overshoots a touch and lands back on the axle. Same clock as the train;
         entries delete themselves once settled, so the loop is normally empty. */
      const dts = Math.min(dt, 60) / 1000;
      for (const slug in this._badgeOff) {
        const o = this._badgeOff[slug], el = this._badgeEl[slug];
        if (!el) { delete this._badgeOff[slug]; continue; }
        if (this._badgeDragging !== slug) {
          const K = 180, C = 13;
          o.vx += (-K * o.x - C * o.vx) * dts;
          o.vy += (-K * o.y - C * o.vy) * dts;
          o.x += o.vx * dts; o.y += o.vy * dts;
          if (Math.abs(o.x) < 0.4 && Math.abs(o.y) < 0.4 && Math.abs(o.vx) < 8 && Math.abs(o.vy) < 8) {
            el.style.transform = 'translate(-50%,-50%) scale(' + ((this.state.hover === slug || this._badgeDragging === slug) ? 1.06 : 1) + ')';
            delete this._badgeOff[slug];
            continue;
          }
        }
        el.style.transform = 'translate(-50%,-50%) translate(' + o.x.toFixed(1) + 'px,' + o.y.toFixed(1) + 'px) scale(' + ((this.state.hover === slug || this._badgeDragging === slug) ? 1.06 : 1) + ')';
      }
      this._raf = requestAnimationFrame(step);
    };
    this._raf = requestAnimationFrame(step);

    /* Stop integrating when the machine is scrolled out of view: no frames, no CPU.
       Starts awake, and only ever sleeps on a real off-screen report for a laid-out
       stage — a first callback on a zero-size box must not put it to sleep. */
    if (window.IntersectionObserver && this._stageRef.current) {
      this._io = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          const box = e.boundingClientRect;
          if (!box || box.width < 4 || box.height < 4) return;
          this._offscreen = e.isIntersecting === false;
        });
      }, { rootMargin: '120px' });
      this._io.observe(this._stageRef.current);
    }
  }

  /* Canvas text measurement, memoised. Cheap, synchronous, and exact for the
     font actually being used -- which matters because the pill's opening width
     is a transition target and cannot be `max-content`. */
  textWidth(text, font) {
    if (!this._tw) this._tw = {};
    const key = font + '|' + text;
    if (this._tw[key] !== undefined) return this._tw[key];
    if (!this._measureCtx) {
      const c = document.createElement('canvas');
      this._measureCtx = c.getContext('2d');
    }
    this._measureCtx.font = font;
    const w = Math.ceil(this._measureCtx.measureText(text).width);
    this._tw[key] = w;
    return w;
  }

  loadIcons() {
    const slugs = TRAIN.filter(t => t.slug).map(t => t.slug);
    Promise.all(slugs.map(s => fetch('assets/icons/' + s + '.svg').then(r => r.ok ? r.text() : '').catch(() => '')))
      .then(texts => {
        const icons = {};
        slugs.forEach((s, i) => {
          let t = texts[i] || '';
          if (t) {
            t = t.split('fill="#000"').join('fill="currentColor"');
            t = t.replace('<svg ', '<svg aria-hidden="true" focusable="false" width="100%" height="100%" ');
          }
          icons[s] = t;
        });
        this.setState({ icons: icons });
      });
  }

  /* Lay the run along the viewport's long axis, so the belt spans open space instead of
     doubling back on itself. Only the layout bearings rotate — badges stay upright. */
  axisRot() { return window.innerHeight > window.innerWidth * 1.05 ? 90 : 0; }

  /* The one number every rendered coordinate in the stage is multiplied by.
     Before fitStage() has measured the viewport there is nothing to multiply by
     yet, so the boot value is read back out of the `--gsfit` declaration rather
     than repeated here -- one source of truth for the first frame. */
  gsRender() {
    if (this._gsr) return this._gsr;
    const boot = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gsfit'));
    return Math.floor((boot || 0.86) * (this.props.gearScale ?? 1) * 100) / 100;
  }

  fitStage() {
    const rot = this.axisRot();
    /* More room means longer drive runs: the strands get real straight spans instead of
       being mostly wrap. Quantised so a resize does not re-solve on every pixel. */
    /* Small screens pack the train tighter, so each wheel renders bigger on the glass;
       roomy screens spread it out and let the drive runs stretch. */
    const small = Math.min(window.innerWidth, window.innerHeight);
    const boost = Math.round(Math.max(0.86, Math.min(1.15, small / 700)) * 20) / 20;
    const tight = Math.round(Math.max(0.6, Math.min(1, small / 760)) * 20) / 20;
    if (rot !== this._axisRot || boost !== this._spreadBoost || tight !== this._tight) {
      this._axisRot = rot;
      this._spreadBoost = boost;
      this._tight = tight;
      this._solved = null;
      this._escKey = null;
      this.forceUpdate();
    }
    const solved = this.solve();
    /* MEASURE WHAT IS ACTUALLY VISIBLE. On iOS Safari `100vh` is the LARGE
       viewport -- the height the page would have if the toolbars were collapsed --
       while `window.innerHeight` is the visual viewport, which is what you can
       currently see. The two differ by the toolbar, so `main` was laying out
       taller than the screen while the scale was computed against the shorter
       number: the train ended up centred in a box that extends past the fold,
       which is dead space at one end and clipping at the other. Desktop never
       showed it because there the two are equal.
       `min-height:100svh` on `main` fixes the layout half (svh is the SMALL
       viewport, never larger than what is visible; the `100vh` before it is the
       fallback for engines that do not know svh). This is the measuring half. */
    const vv = window.visualViewport;
    const w = (vv && vv.width) || window.innerWidth;
    const hgt = (vv && vv.height) || window.innerHeight;
    const rowMode = w > 820 && w > hgt * 1.2;
    const colH = this._colRef && this._colRef.current ? this._colRef.current.offsetHeight : 60;
    /* THE MACHINE FILLS THE LONG AXIS, EDGE TO EDGE. The ghosts exist to say it
       continues past the frame, so the long side of the screen is what the scale
       must satisfy -- not the smaller of the two axes, and not a shaved fraction
       of it.

       What was here took min(availW, availH) against a width already cut to
       86-92%, under a hard 1.75 ceiling, and every one of those three starved it
       in a different situation. On a phone the cross term won: real Safari chrome
       leaves landscape about 313px tall instead of the device's nominal 430, so
       the height term shrank the train until it no longer spanned the width, and
       Charles got dead space at both ends. On a wide desktop the CEILING won: the
       fit wanted 1.9 and was capped at 1.75, which is the same gap at both sides
       of a maximised Safari window. The wordmark and the buttons sat correctly
       throughout, which is what told him the viewport was being read fine and it
       was the gear area that was wrong.

       So: fill the long axis, and let the cross axis bleed. `main` is
       overflow:hidden and the colophon is position:fixed, so bleeding costs
       nothing and is what the outriggers want. CROSS_BLEED is the one guard --
       past 1.25x the cross viewport the wheels are simply too big and the train
       reads as a wall rather than a machine. */
    const alongX = w >= hgt;
    const longAvail = alongX ? w : hgt;
    const longSolved = alongX ? solved.w : solved.h;
    const crossAvail = alongX ? hgt : w;
    const crossSolved = alongX ? solved.h : solved.w;
    const CROSS_BLEED = 1.25;
    /* A CEILING ON WHEEL SIZE, because filling the screen is the chain's job and
       not the individual wheel's. Removing the old cap made the train span the
       long axis by inflating every wheel to about 1.9x -- Charles's word for the
       result was HUGE, and he was right. The escape runs already keep adding
       outriggers until they are genuinely off the edge, and a smaller scale means
       each run covers MORE solve units, so it simply grows more wheels. Capping
       here therefore costs no coverage: it moves the filling from one dimension
       (bigger) to the other (longer), which is what a machine continuing past the
       frame should look like. */
    const GS_MAX = 1.25;
    /* THE LINKED TRAIN TAKES A SHARE, NOT THE WHOLE. `solved` is the eight linked
       wheels only -- the outriggers are added afterwards, in fitEscapes -- so
       scaling `solved` to the full long axis leaves the icons spanning edge to
       edge with nowhere for a ghost to sit, and anything that does not fit simply
       runs off. That is what Charles saw in Firefox portrait.

       Sizing the LINKS to a share of the axis is what he actually asked for and
       what makes the picture read: the icons shrink as more of them are added,
       they stay wholly on screen, and the space left at both ends is where the
       leading and trailing ghosts live. The ghost runs then fill that space and
       keep going off the edge, so the machine still covers 100% of the long axis
       -- the coverage comes from the chain being longer, never from the wheels
       being bigger. */
    const LINK_SHARE = 0.78;
    const fit = Math.max(0.28, Math.min(LINK_SHARE * longAvail / longSolved,
                                        crossAvail * CROSS_BLEED / crossSolved, GS_MAX));
    const root = document.documentElement.style;
    root.setProperty('--gsfit', fit.toFixed(3));
    /* THE WHEELS ARE DRAWN AT FINAL SIZE (#37). Everything inside the stage used
       to lay out in unscaled solve units under one `transform: scale(--gs)`
       ancestor, with the badges alone positioned at `calc(px * var(--gs))`. That
       put the two on opposite sides of a scale boundary: each wheel wrapper
       carries `will-change: transform`, so it is promoted to its own compositing
       layer, and a promoted layer is rasterised at its LAYOUT size and then
       stretched by the ancestor's scale. Blink re-rasterises when the composited
       scale changes; WebKit frequently does not, which is why Safari showed soft
       teeth against razor-sharp badge plates while Chrome looked fine.

       So the scale is baked into the geometry instead, and the vector reaches the
       compositor already the right size. Quantised to 1% so dragging a window
       edge does not re-render on every pixel -- and it must be quantised, because
       this is the value a change of which costs a full re-render. Quantised DOWN,
       never to nearest: the fit above is a ceiling that keeps the linked wheels
       wholly on screen, and rounding up would spend part of the margin the ghost
       runs are supposed to live in. */
    const gsr = Math.floor(fit * (this.props.gearScale ?? 1) * 100) / 100;
    if (gsr !== this._gsr) { this._gsr = gsr; this.forceUpdate(); }
    this.fitEscapes();
    root.setProperty('--dir', rowMode ? 'row' : 'column');
  }

  componentDidMount() {
    /* One beacon per load, naming only which chain was shown -- never a handle,
       never a referrer. Fires from mount rather than from the top of the file so
       it counts a page that actually rendered. */
    if (AN.pageview !== false) track('view/' + (WHO.slug || 'unknown'));
    this.loadIcons();
    this.startPhysics();
    this.fitStage();
    this.onResize = () => this.fitStage();
    window.addEventListener('resize', this.onResize);
    /* iOS fires this and not `resize` when the toolbar collapses or the keyboard
       comes up, so without it the fit is stale exactly when the viewport moves. */
    if (window.visualViewport) window.visualViewport.addEventListener('resize', this.onResize);
    /* LAYER: parallax — the far plane drifts against pointer movement. */
    this._onPointer = (e) => {
      if (!this.props.parallax || !this._ghostLayer) return;
      const dx = (e.clientX / window.innerWidth - 0.5) * 26, dy = (e.clientY / window.innerHeight - 0.5) * 18;
      this._ghostLayer.style.transform = 'translate(' + (-dx).toFixed(1) + 'px,' + (-dy).toFixed(1) + 'px) scale(0.94)';
    };
    window.addEventListener('pointermove', this._onPointer, { passive: true });
    let saved = null;
    try { saved = localStorage.getItem('wozi-theme'); } catch (e) {}
    this.mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    this.onSys = (e) => {
      let stored = null;
      try { stored = localStorage.getItem('wozi-theme'); } catch (err) {}
      if (!stored) this.apply(e.matches ? 'dark' : 'light');
    };
    if (this.mq && this.mq.addEventListener) this.mq.addEventListener('change', this.onSys);
    this.apply(saved || (this.mq && this.mq.matches ? 'dark' : 'light'));
    this.syncVars();
  }

  componentDidUpdate() { this.syncVars(); this.fitStage(); }

  componentWillUnmount() {
    if (this.mq && this.mq.removeEventListener) this.mq.removeEventListener('change', this.onSys);
    window.removeEventListener('resize', this.onResize);
    if (window.visualViewport) window.visualViewport.removeEventListener('resize', this.onResize);
    if (this._onPointer) window.removeEventListener('pointermove', this._onPointer);
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._io) this._io.disconnect();
  }

  syncVars() {
    const r = document.documentElement.style;
    const speed = this.props.speed ?? 1;
    r.setProperty('--s', String(speed > 0 ? 1 / speed : 1));
    /* gearScale is no longer a CSS variable: it multiplies into gsRender() and
       reaches the page as real pixel geometry, so nothing has to resolve it at
       used-value time (#37). */
    /* Dark mode gets the lighter counterpart; an accent dark enough to read on
       the light background disappears against the dark one. */
    if (this.props.accent) {
      const pair = ACCENTS[this.props.accent];
      r.setProperty('--accent', (this.state.theme === 'dark' && pair) || this.props.accent);
    }
  }

  apply(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    this.setState({ theme });
  }

  /* Solve the train: centre distances = sum of pitch radii, alternating spin,
     angular speed inversely proportional to tooth count, tooth phase meshed. */
  solve() {
    if (this._axisRot === undefined) this._axisRot = this.axisRot();
    if (this._solved) return this._solved;
    /* Sites are dealt onto the wheels fresh each load, but sibling services stay
       belted to each other: the two belt-linked slots always get a pair. */
    const shuffle = (arr) => {
