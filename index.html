<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%233B7DE8'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E" />
<title>wozi.com</title>
<style>
:root{
  /* The page background is deliberately off a bright white. #F1F2F0 sat at 0.885
     luminance, which is a lot of glare full-screen and left the #FFFFFF badges
     almost nothing to separate from (1.12:1). At 0.817 the badges lift to 1.21:1
     and the ink still clears 11:1. --muted darkens with it so the wordmark TLD,
     which is large text on this colour, stays above the 3:1 floor (#16). */
  --bg:#E8EAE5; --ink:#20302E; --muted:#6B7E7C; --hair:#D5DAD6; --chip:#FFFFFF;
  --accent:#3B7DE8; --shadow:0 1px 2px rgba(20,40,38,.06);
  --m1:#FFFFFF; --m2:#D4DADE; --m3:#98A2A9; --m4:#5F686E;
  --b1:#F7E7BE; --b2:#DFC183; --b3:#B08F45; --b4:#7A5F28;
  --edge:rgba(12,22,28,.38); --gloss:rgba(255,255,255,.8);
  --s:1; --gsm:1; --gsfit:0.86; --gs:calc(var(--gsfit) * var(--gsm));
  --dir:row; --pad:5vw; --gap:4vw; --colw:400px;
  /* Corner spacing is one icon width, so the gap around the theme toggle reads
     the same as the icon it sits next to. The button is larger than its icon and
     centres it, so the button box is pulled in by half that difference — derived
     rather than hardcoded, so changing either size keeps the icon on the mark.
     The wordmark sits on --btnoff, the same offset as the button's box, so the
     two bottom/top corners are inset by the same amount rather than one being
     measured to a box and the other to a glyph. */
  --icon:20px; --btn:44px;
  --corner:var(--icon);
  --btnoff:calc(var(--corner) - (var(--btn) - var(--icon)) / 2);
}
:root[data-theme="dark"]{
  --bg:#1E2226; --ink:#EEF1F0; --muted:#93A5A3; --hair:#373E3D; --chip:#2A3034;
  --accent:#7FA9F0; --shadow:0 1px 2px rgba(0,0,0,.35);
  --m1:#AEB8BF; --m2:#7C858C; --m3:#4E565C; --m4:#2B3135;
  --b1:#D8B978; --b2:#A98844; --b3:#75592A; --b4:#463618;
  --edge:rgba(0,0,0,.6); --gloss:rgba(255,255,255,.38);
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
a{color:var(--accent);text-decoration:none;}
a:hover{color:var(--ink);}
/* The links ARE the content, so a keyboard user who cannot see focus cannot use
   the site at all (#23). :focus-visible keeps the ring off mouse clicks; the
   outline follows each element's own border-radius, so it rings the discs. */
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
/* The train itself rests via the frame loop (#3) — this only stills the UI
   transitions: badge scale, tooltip fade, toggle colour. */
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
@media (max-width:1080px){:root{--gap:2rem;--pad:6vw;}}
@media (max-width:760px){:root{--pad:28px;--colw:100%;}}
@media (max-width:430px){:root{--gap:1.25rem;}}
@keyframes rotate{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes rotate-back{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
@keyframes signsway{from{transform:translate(-50%,0) rotate(-1.2deg)}to{transform:translate(-50%,-14px) rotate(1.2deg)}}
@keyframes chainrun{to{stroke-dashoffset:calc(var(--pitch) * -1)}}
@keyframes chainrun-back{to{stroke-dashoffset:var(--pitch)}}
</style>
</helmet>

<main style="min-height:100vh;box-sizing:border-box;display:flex;flex-direction:var(--dir);align-items:center;justify-content:center;gap:var(--gap);padding:var(--pad);background:var(--bg);overflow:hidden;">

  <button onClick="{{ toggleTog }}" title="{{ togLabel }}" aria-label="{{ togLabel }}" aria-expanded="{{ togExpanded }}" style="position:fixed;top:var(--btnoff);right:calc(var(--btnoff) + (var(--btn) + 6px) * 2);z-index:20;display:flex;align-items:center;justify-content:center;width:var(--btn);height:var(--btn);padding:0;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;transition:color .18s ease;" style-hover="color:var(--ink);">
    {{ togIcon }}
  </button>
  <button onClick="{{ toggleMotion }}" title="{{ motionLabel }}" aria-label="{{ motionLabel }}" aria-pressed="{{ motionPressed }}" style="position:fixed;top:var(--btnoff);right:calc(var(--btnoff) + var(--btn) + 6px);z-index:20;display:flex;align-items:center;justify-content:center;width:var(--btn);height:var(--btn);padding:0;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;transition:color .18s ease;" style-hover="color:var(--ink);">
    {{ motionIcon }}
  </button>
  <button onClick="{{ toggleTheme }}" title="{{ themeLabel }}" aria-label="{{ themeLabel }}" style="position:fixed;top:var(--btnoff);right:var(--btnoff);z-index:20;display:flex;align-items:center;justify-content:center;width:var(--btn);height:var(--btn);padding:0;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;transition:color .18s ease;" style-hover="color:var(--ink);">
    {{ themeIcon }}
  </button>

  <nav aria-label="Table of gears" style="{{ togPanelStyle }}">
    <div style="font:700 11px/1 'Manrope',system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:4px 12px 8px;">Table of Gears</div>
    <sc-for list="{{ togList }}" as="tg">
      <a href="{{ tg.href }}" aria-current="{{ tg.current }}" style="{{ tg.style }}">{{ tg.label }}</a>
    </sc-for>
  </nav>
  <div ref="{{ stageRef }}" tabindex="0" role="application" aria-label="Animated gear machine. Press the left or right arrow key to spin it." onKeyDown="{{ onStageKey }}" onPointerDown="{{ onGrab }}" onPointerEnter="{{ onStageEnter }}" onPointerLeave="{{ onStageLeave }}" style="{{ stageStyle }}">
    {{ gearArt }}
    <sc-for list="{{ links }}" as="link" hint-placeholder-count="7">
      <a href="{{ link.href }}" draggable="false" aria-label="{{ link.label }}" onPointerDown="{{ link.badgeDown }}" onDragStart="{{ link.noDrag }}" onClick="{{ link.clickGuard }}" onMouseEnter="{{ link.enter }}" onMouseLeave="{{ link.leave }}" onFocus="{{ link.enter }}" onBlur="{{ link.leave }}" style="{{ link.discStyle }}">
        {{ link.iconEl }}
        {{ link.tipEl }}
      </a>
    </sc-for>

  </div>

  <div ref="{{ colRef }}" style="position:fixed;left:var(--btnoff);bottom:var(--btnoff);z-index:15;">
    <h1 style="margin:0;display:flex;align-items:baseline;gap:2px;font-weight:800;font-size:clamp(30px,4.6vw,54px);letter-spacing:-0.045em;line-height:1;color:var(--ink);">
      <span>{{ brandName }}</span>
      <span style="width:.16em;height:.16em;border-radius:50%;background:var(--accent);align-self:flex-end;margin-bottom:.14em;"></span>
      <span style="color:var(--muted);font-weight:600;">{{ brandTld }}</span>
    </h1>
  </div>
</main>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;domain&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Wordmark&quot;},&quot;frameRate&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[60,30,24,20],&quot;default&quot;:30,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Gears&quot;},&quot;spinUp&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layers&quot;},&quot;engravedRims&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layers&quot;},&quot;parallax&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layers&quot;},&quot;character&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layers&quot;},&quot;hoverDrag&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layers&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.25,&quot;max&quot;:2,&quot;step&quot;:0.25,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Gears&quot;},&quot;gearScale&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.5,&quot;max&quot;:1.3,&quot;step&quot;:0.05,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Gears&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#5F686E&quot;,&quot;#E8483A&quot;,&quot;#3B7DE8&quot;,&quot;#F4B32B&quot;,&quot;#1FA463&quot;],&quot;default&quot;:&quot;#5F686E&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Gears&quot;},&quot;shuffle&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Gears&quot;}}">
const MODULE = 7;

/* Tooth form. Uniform across the train and derived from the module — never set
   per wheel. Per-wheel `add` and `tip` were the #15 mistake repeated on the tooth
   profile: a set maintained by judgement drifts, and this one had drifted into a
   train where some pairs collided and others left a visible gap (#11).

   Measured against the real outlines at all six adjacent pairs:
     as shipped (base 66%, add 0.88-1.05, tip 0.31-0.40)
       4 points of one wheel's outline inside its neighbour's, up to 1.42px deep
     this form
       0 penetrating points, 1.76px of clearance at the mesh

   The tooth had been a fat wedge — 66% of the circular pitch at the root tapering
   to 31-40% at the tip — and it is fat roots that collide as they swing through
   mesh. Narrowing the base to 48% removes the interference at the same engagement
   depth. These values sit on a plateau (44-48% base and 0.34-0.36 tip all measure
   clean), so the result is not balanced on a knife edge. Raising the addendum to
   0.95 or the base to 52% brings contact straight back. */
const TOOTH_PA = 20;      /* pressure angle in degrees — 20 is the modern standard */
const TOOTH_ADD = 1.00;   /* addendum, in modules — standard full-depth */
const TOOTH_DED = 1.25;   /* dedendum, in modules — standard, leaves root clearance */
const TOOTH_THICK = 0.495; /* tooth thickness at the pitch circle, as a fraction of the
                              circular pitch. A real gear is 0.5 exactly and the shortfall
                              is backlash. Measured at all six pairs: 0.495 gives zero
                              interference with 0.11px between the flanks, so they read as
                              touching without anti-aliasing ever fusing them. */
const TOOTH_FILLET = 0.38; /* root fillet radius, in modules — the standard value that
                              goes with 20-degree full depth. Without it the flank meets
                              the root circle at a sharp corner, which no cut gear has. */

const BASE_MS = 21000;
const GHOST_COLORS = ['#9AA6AD', '#A9B4BA', '#8F9BA3', '#B3BCC2'];

const GHOST_KINDS = ['spokes', 'holes', 'pockets', 'ring', 'spiral'];
function segCross(p1, p2, p3, p4) {
  const s = (a, b, c) => (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
  return s(p1, p2, p3) * s(p1, p2, p4) < 0 && s(p3, p4, p1) * s(p3, p4, p2) < 0;
}
function segDist(p, a, b) {
  const vx = b.x - a.x, vy = b.y - a.y, L = vx * vx + vy * vy;
  let t = L ? ((p.x - a.x) * vx + (p.y - a.y) * vy) / L : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + t * vx), p.y - (a.y + t * vy));
}
const ENDS_APART = 90; /* extra push between the first and last wheel of the visible run */
const CLEARANCE = 13; /* px kept between the tip circles of wheels that are not meshed */

/* The gear train. Each entry meshes with the one before it:
   teeth  — tooth count (sets size and speed)
   angle  — bearing in degrees from the previous gear's centre
   slug   — icon/link to seat on this gear's hub (omit for a plain idler)
   metal  — 'steel' | 'brass'
   Add or remove an entry and the whole train re-solves: spacing, direction, ratio. */
/* Seven site wheels of near-equal size, each with its own web design.
   `link: 'chain'` (or `'belt'`) drives the next wheel by strand instead of tooth mesh.
   No entry sets one today, so no chain or belt is drawn — see CLAUDE.md,
   "Dormant capability: chain and belt", before re-enabling either. */
/* One directly-meshed train: every wheel drives its neighbour, so spacing is fixed by
   the pitch radii and only the bearing varies — a gentle serpentine, no slack to fold. */
const TRAIN = [
  { teeth: 17, angle: 0, slug: 'linkedin', prof: { rim: 1.7 } },
  { teeth: 15, angle: 20, slug: 'github', prof: { rim: 1.6 } },
  { teeth: 18, angle: -24, slug: 'mastodon', prof: { rim: 2.0 } },
  { teeth: 14, angle: 22, slug: 'instagram', prof: { rim: 1.4 } },
  { teeth: 17, angle: -20, slug: 'threads', prof: { rim: 1.7 } },
  { teeth: 15, angle: 24, slug: 'bluesky', prof: { rim: 1.9 } },
  { teeth: 18, angle: -18, slug: 'mail', prof: { rim: 1.6 } }
];

/* Centre designs: two-level deal for maximum per-visit variety. FAMILIES are
   the major types; each family carries the web/hub proportions it needs plus a
   few authored VARIANTS. A load picks 7 DISTINCT families at random, then one
   variant of each — so both which designs appear and how each is built change
   per reload.

   Admission rule, per Charles (whose father spent decades in gearing): every
   design must be a wheel a machinist could actually make. A visible load path
   from hub to rim, no floating metal, no invisible couplings, nothing boring.
   The old plain 'ring' is out of the pool (boring); research designs whose
   petals or lobes left the hub disconnected from the rim were rejected. */
/* Planetary tooth-count enumerator, distilled from real generator source --
   chrisspen/gears, hyperair/planetary-gears, Emmett Lalish's Gear Bearing,
   BOSL2 gears.scad, and the KHK technical reference (full derivations and
   links: docs/research/planetary-solver.md; reference copy with tests:
   tools/enumerate-planetaries.js). Constraints:
     C1 concentricity  Zr = Zs + 2*Zp (parity makes Zp an integer)
     C2 assembly       (Zs+Zr) % N == 0 for equally spaced planets
     C3 adjacency      (Zs+Zp)*sin(pi/N) > Zp + 2 + margin (tip circles clear)
   Hunting-tooth and undercut are real-gearbox concerns flagged in the
   reference copy; cosmetic here. */
function enumeratePlanetaries(o) {
  const N = o.N, target = { small: 0.25, medium: 0.4, large: 0.6 }[o.sunBias || 'medium'];
  const ZrMin = o.ZrMin || 24, ZrMax = o.ZrMax || 60, minT = o.minTeeth || 6;
  const sinHalf = Math.sin(Math.PI / N), out = [];
  for (let Zr = ZrMin; Zr <= ZrMax; Zr++) {
    for (let Zs = minT; Zs <= Zr - 2 * minT; Zs++) {
      if ((Zr - Zs) % 2 !== 0) continue;
      const Zp = (Zr - Zs) / 2;
      if (Zp < minT) continue;
      if ((Zs + Zr) % N !== 0) continue;
      if ((Zs + Zp) * sinHalf <= Zp + 2.5) continue;
      out.push({ Zs: Zs, Zp: Zp, Zr: Zr, N: N, ratio: Zs / Zr });
    }
  }
  out.sort(function (a, b) {
    const d = Math.abs(a.ratio - target) - Math.abs(b.ratio - target);
    return d !== 0 ? d : a.Zr - b.Zr;
  });
  return out;
}

/* The planetary's variant menu is GENERATED: one best-fit gear set per
   (planet count, sun size) flavour, deduped. Adding a flavour is one line;
   the solver guarantees whatever comes out assembles and clears. */
const PLANETARY_MENU = (function () {
  const flavours = [[3, 'medium'], [3, 'large'], [4, 'medium'], [4, 'large'], [5, 'small'], [5, 'medium']];
  const seen = {}, out = [];
  flavours.forEach(function (c) {
    const r = enumeratePlanetaries({ N: c[0], sunBias: c[1], ZrMin: 24, ZrMax: 33, minTeeth: 5 })[0];
    if (!r) return;
    const key = r.Zs + '.' + r.Zp + '.' + r.Zr + '.' + r.N;
    if (seen[key]) return;
    seen[key] = 1;
    out.push({ pg: [r.Zs, r.Zp, r.Zr, r.N] });
  });
  return out.length ? out : [{ pg: [12, 9, 30, 3] }];
})();

const CENTRE_FAMILIES = [
  { type: 'spokes', web: 3.2, hub: 0.2,
    variants: [{ arms: 4, arm: 0.2 }, { arms: 5, arm: 0.15 }, { arms: 6, arm: 0.13 }] },
  { type: 'holes', web: 2.9, hub: 0.17,
    variants: [{ arms: 4 }, { arms: 5 }, { arms: 6 }] },
  { type: 'pockets', web: 3.1, hub: 0.22,
    variants: [{ arms: 6 }, { arms: 5 }, { arms: 4 }] },
  { type: 'spiral', web: 2.6, hub: 0.14,
    variants: [{ arms: 5, sweep: 0.3 }, { arms: 6, sweep: 0.22 }, { arms: 4, sweep: 0.38 }] },
  { type: 'iris', web: 2.9, hub: 0.2,
    variants: [{ arms: 6 }, { arms: 8 }, { arms: 10 }] },
  { type: 'star', web: 3.0, hub: 0.22,
    variants: [{ arms: 5 }, { arms: 7 }, { arms: 9 }] },
  { type: 'honeycomb', web: 3.1, hub: 0.2,
    variants: [{ arms: 6 }, { arms: 9 }, { arms: 12 }] },
  { type: 'labyrinth', web: 3.2, hub: 0.18,
    variants: [{ arms: 5 }, { arms: 6 }, { arms: 7 }] },
  { type: 'sunburst', web: 3.1, hub: 0.2,
    variants: [{ arms: 10 }, { arms: 14 }, { arms: 18 }] },
  { type: 'planetary', web: 2.6, hub: 0.1,
    variants: PLANETARY_MENU }
];
/* Debug affordance: ?kind=iris forces every wheel to one family, variants
   cycling — how the contact sheets for review are made. Harmless in production. */
const FORCE_KIND = (function () {
  try { return (location.search.match(/[?&]kind=([a-z]+)/) || [])[1] || null; } catch (e) { return null; }
})();
function dealCentres(n) {
  const fam = FORCE_KIND && CENTRE_FAMILIES.some(f => f.type === FORCE_KIND)
    ? CENTRE_FAMILIES.filter(f => f.type === FORCE_KIND)
    : CENTRE_FAMILIES;
  const idx = fam.map((f, i) => i);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = idx[i]; idx[i] = idx[j]; idx[j] = t;
  }
  const out = [];
  for (let i = 0; i < n; i++) {
    const f = fam[idx[i % idx.length]];
    const v = FORCE_KIND ? f.variants[i % f.variants.length]
      : f.variants[Math.floor(Math.random() * f.variants.length)];
    out.push({ type: f.type, web: f.web, hub: f.hub, v: v });
  }
  /* The planetary is the showpiece: every load carries exactly one, unless a
     family is being forced for review. */
  if (!FORCE_KIND && !out.some(c => c.type === 'planetary')) {
    const f = CENTRE_FAMILIES.filter(x => x.type === 'planetary')[0];
    out[Math.floor(Math.random() * out.length)] = { type: f.type, web: f.web, hub: f.hub, v: f.variants[0] };
  }
  return out;
}
const CENTRE_DEAL = dealCentres(TRAIN.length);
/* The planetary needs room: on the 14- and 15-tooth wheels the hub badge covers
   most of the bore and the works vanish behind it. Swap it onto the largest
   wheel available if the deal put it somewhere cramped. */
(function () {
  const pi = CENTRE_DEAL.findIndex(c => c.type === 'planetary');
  if (pi < 0) return;
  if (TRAIN[pi] && TRAIN[pi].teeth >= 17) return;
  let big = -1, bt = 0;
  TRAIN.forEach((t, i) => { if (t.teeth > bt) { bt = t.teeth; big = i; } });
  if (big >= 0) { const tmp = CENTRE_DEAL[pi]; CENTRE_DEAL[pi] = CENTRE_DEAL[big]; CENTRE_DEAL[big] = tmp; }
})();
TRAIN.forEach((t, i) => {
  const cd = CENTRE_DEAL[i % CENTRE_DEAL.length];
  t.kind = cd.type;
  /* The planetary's assembly pose is dealt too: the grounded carrier is bolted
     on at a random clocking per load, so the three stations land differently
     each visit. Decided here (module load, once) so a theme toggle re-render
     cannot re-pose it. */
  t.crot = cd.type === 'planetary' ? Math.random() * 360 : 0;
  t.arms = cd.v.arms;
  t.cv = cd.v;
  t.prof.web = cd.web; t.prof.hub = cd.hub;
  if (cd.v.hole !== undefined) t.prof.hole = cd.v.hole;
  if (cd.v.arm !== undefined) t.prof.arm = cd.v.arm;
});

/* Wheel colours are derived, never picked. Seven hand-chosen ones had drifted
   into two blues and two greens (#12) — the same failure as the per-wheel `rim`
   values in #15: a set maintained by judgement stops being consistent the moment
   it changes. Spacing hues evenly makes a collision impossible by construction,
   and re-spaces itself if a wheel is added or removed. With seven wheels no two
   are closer than 360/7 ≈ 51°. */
/* Hues are handed out in a STRIDE around the wheel rather than in order. Even
   spacing alone still seats neighbouring hues next to each other, and wheels are
   only ever confused with the ones beside them — in order, the gold, green and
   teal ended up in a row. A stride coprime with the wheel count visits every hue
   exactly once while putting 3 x 51° between neighbours instead of 51°.
   Keep STRIDE coprime with TRAIN.length or hues repeat and wheels collide.

   Three things together make a palette read as a rainbow: perfectly even
   spacing, constant saturation, and hues arriving in order. The stride fixes the
   third; JITTER and the saturation spread fix the other two, so the set reads as
   seven chosen colours rather than a spectrum. Both are bounded, so the spacing
   guarantee survives — worst case across 100k seeds is ~31°, still well clear of
   confusable.

   The whole wheel is rotated by a random offset per load, so the palette differs
   between visits. Computed once at module load and never on resize, so the
   wheels cannot change colour under the pointer — the same reason the background
   machinery seeds from a fixed constant. */
/* One palette cannot serve both themes. A wheel at 0.30 luminance sits 5.3:1
   against the dark page and only 2.5:1 against the light one, so light mode was
   always going to look washed no matter what the shading did -- which is why
   #13, #16, #19 and #20 each moved the problem rather than removing it. Each
   theme now gets its own target: darker wheels for a bright page, lighter for a
   dark one. Same hues, same saturation, same spacing and collision guarantees
   from #12 -- only the value moves. */
/* The colour pool is the seven the original template shipped — verbatim, one
   set for both themes, exactly as the template did (the per-theme difference is
   shades(), not separate palettes) — plus three authored in the same idiom to
   cover its gaps: orange, teal, magenta. The hue numbers are labels for the
   adjacency check below, not inputs to any colour math.

   Assignment is the only random part, and it is a constrained deal, not a bare
   shuffle: the template's two blues sit 2 degrees apart in hue and its two
   greens 5, and hand placement is what kept them separated in the original. A
   bare shuffle can seat them side by side, where they read as the same wheel
   (#12) — so a deal is rejected while any two NEIGHBOURING wheels are within
   40 degrees, bounded retries, best deal kept. */
const WHEEL_POOL = [
  { c: '#4A90E2', h: 212 }, { c: '#17A05C', h: 150 }, { c: '#8CB8F2', h: 214 },
  { c: '#E8615A', h: 3 },   { c: '#6ECFA6', h: 155 }, { c: '#F2C14E', h: 42 },
  { c: '#9B8CE0', h: 251 },                                     /* the template's seven */
  { c: '#EC8C4E', h: 24 },  { c: '#54BFB6', h: 175 }, { c: '#DB79B8', h: 322 }  /* gap fill */
];
function dealColours(n) {
  const dist = (a, b) => Math.min(Math.abs(a - b), 360 - Math.abs(a - b));
  let best = null, bestScore = -1;
  for (let tries = 0; tries < 80; tries++) {
    const idx = WHEEL_POOL.map((c, i) => i);
    for (let i = idx.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = idx[i]; idx[i] = idx[j]; idx[j] = t;
    }
    const pick = idx.slice(0, Math.min(n, idx.length));
    let score = 360;
    for (let i = 1; i < pick.length; i++) score = Math.min(score, dist(WHEEL_POOL[pick[i - 1]].h, WHEEL_POOL[pick[i]].h));

const WHEEL_DEAL = dealColours(TRAIN.length);
TRAIN.forEach((t, i) => {

   body, a thin darker outline, plain dark lettering — a machinist's drawing.
   Dark mode keeps the modelled treatment. Charles's verdict after a full night
   of gradient tuning: the shading itself is what made light mode ugly, and dark
   was passable — so the disputed axis is deleted only where it is disputed. */

  const n = parseInt(hex.slice(1), 16);
  const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  const mix = (t, target) => '#' + c.map(v => Math.round(v + (target - v) * t).toString(16).padStart(2, '0')).join('');
  /* The face is a HINT lighter, not a pale disc: at 20% toward white it read as
     a glow ringing the hub on the pale page — in a flat drawing the raised face
     is told by its outline, not by a tonal jump. */
  /* line: the working contour for interior details. edge: the blank's outline
     in LIGHT mode -- barely darker than the body, an edge-shading whisper. The
     40% ink line around every wheel is what made light mode read as stickers
     rather than machined parts (Charles's diagnosis); dark keeps the strong
     contour, where it reads as rim light against the dark page. */

  const n = parseInt(hex.slice(1), 16);

  const mix = (t, target) => '#' + c.map(v => Math.round(v + (target - v) * t).toString(16).padStart(2, '0')).join('');

class Component extends DCLogic {
  state = { theme: 'light', hover: null, icons: {}, ghosts: [], motion: null, tog: false };
  _badgeOff = {};   /* per-slug {x,y,vx,vy} spring state for the magnetic hub caps */
  _badgeEl = {};
  _spinEls = [];
  _chainEls = [];
  _ghostEls = [];
  _colRef = React.createRef();
  _stageRef = React.createRef();

  /* Grab any wheel and push it: the whole train follows your hand, and if you push
     against the way it was turning, it keeps running that way when you let go. */
  onGrab(e) {
    const stage = this._stageRef.current;
    if (!stage || e.button > 0) return;
    const solved = this.solve();
    const rect = stage.getBoundingClientRect();
    const gs = rect.width / solved.w;
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    let hit = null, best = Infinity;
    solved.gears.forEach(g => {
      const d = Math.hypot(px - g.cx * gs, py - g.cy * gs);
      if (d < g.ro * gs && d < best) { best = d; hit = g; }

    if (!hit) return;
    e.preventDefault();
    const cx = rect.left + hit.cx * gs, cy = rect.top + hit.cy * gs;
    let p = { x: e.clientX, y: e.clientY };
    const ang = () => Math.atan2(p.y - cy, p.x - cx) * 180 / Math.PI;
    let last = ang(), lastT = performance.now(), moved = 0;

    this._v = 0;
    stage.style.cursor = 'grabbing';

    const move = (ev) => {
      const pt = ev.touches ? ev.touches[0] : ev;
      p = { x: pt.clientX, y: pt.clientY };
      let a = ang(), delta = a - last;
      while (delta > 180) delta -= 360;
      while (delta < -180) delta += 360;
      last = a;
      const now = performance.now(), dt = Math.max(8, now - lastT);
      lastT = now;

      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);

         Push against the train and it keeps running the new way. */
      const flick = Math.max(-8, Math.min(8, this._v));
      if (Math.abs(moved) > 30) this._dirSign = moved < 0 ? -1 : 1;
      else if (Math.abs(flick) > 0.5) this._dirSign = flick < 0 ? -1 : 1;
      this._v = Math.abs(flick) > 0.15 ? flick : this._dirSign * this.idleRate();
    };

    window.addEventListener('pointerup', up);
  }

     reveal the works behind it; release and the spring in step() flies it home.
     stopPropagation keeps a cap drag from also grabbing the train, and a >6px
     move suppresses the link click on release -- a plain click still navigates,
     and keyboard activation never touches any of this. */
  badgeGrab(e, slug) {

       hijacks the pointer stream -- on a real mouse it made the cap need a
       long-press before it would move at all. Synthesized test events never
       trigger native drag, which is why the harness missed it. Click activation
       is unaffected: click fires regardless of pointerdown's default. */

    /* No pointer capture: window listeners, exactly like the train's own drag —
       capture on the anchor swallowed the move stream under some pointers. */

    this._badgeEl[slug] = el;

    let moved = false;

      const d = Math.hypot(dx, dy) || 1;
      /* Tether reach ~3 cap-widths: enough to pull the disc clear of the whole
         centre works. 1.6 stopped at roughly the well radius, which read as a
         wall rather than a stretch. */
      const max = el.offsetWidth * 3.2;
      const lim = max * Math.tanh(d / max);
      off.x = dx / d * lim; off.y = dy / d * lim;

    if (this.state.motion === 'rest') return false;

  rnd() {

  /* Background machinery: extra wheels seeded off each edge, meshed onto the visible

  fitEscapes(fit) {
    const stage = this._stageRef.current;
    if (!stage) return;
    const solved = this.solve();
    const rect = stage.getBoundingClientRect();
    const gs = fit * (this.props.gearScale ?? 1);
    const vw = window.innerWidth, vh = window.innerHeight;
    const ghosts = [];
    this._seed = 20260729;
    const hosts = [solved.gears[0], solved.gears[solved.gears.length - 1]];
    const taken = [];
    const crosses = (p1, p2, p3, p4) => {
      const s = (a, b, c) => (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
      return s(p1, p2, p3) * s(p1, p2, p4) < 0 && s(p3, p4, p1) * s(p3, p4, p2) < 0;
    };
    /* The escape runs continue the train's OWN AXIS rather than leaving by whichever
       screen edge happens to be nearest. Nearest-edge was measuring the wrong thing:
       on a wide, short viewport the closest edges are the top and bottom, so one run
       climbed off the top and the other dropped off the bottom — a horizontal train
       with a vertical tail at each end, which reads as an S rather than as a machine
       continuing past the frame (#10). Continuing the axis is what SESSION-LOG says
       these are for, and it fills a wide display instead of stranding the train in
       the middle of one. */

    const axisDeg = Math.atan2(last.cy - first.cy, last.cx - first.cx) * 180 / Math.PI;
    /* How far a heading travels before it leaves the viewport. */
    const reachAlong = (px, py, deg) => {
      const a = deg * Math.PI / 180, dx = Math.cos(a), dy = Math.sin(a);
      let t = Infinity;
      if (dx > 1e-6) t = Math.min(t, (vw - px) / dx);
      else if (dx < -1e-6) t = Math.min(t, -px / dx);
      if (dy > 1e-6) t = Math.min(t, (vh - py) / dy);
      else if (dy < -1e-6) t = Math.min(t, -py / dy);

      const sx = rect.left + host.cx * gs, sy = rect.top + host.cy * gs;
      /* The first wheel continues backwards along the axis, the last one onwards.
         A small arc either side is searched only to dodge a run already placed —
         the axis itself is always tried first. */
      const want = ei === 0 ? axisDeg + 180 : axisDeg;
      let e = null;
      const offsets = [0, 16, -16, 32, -32, 50, -50];
      for (let q = 0; q < offsets.length; q++) {
        const ang = want + offsets[q];

        const oa = ang * Math.PI / 180;
        const seg = [{ x: sx, y: sy }, { x: sx + (reach + 80) * Math.cos(oa), y: sy + (reach + 80) * Math.sin(oa) }];
        if (!taken.some(t => crosses(seg[0], seg[1], t[0], t[1]))) { e = { ang: ang, reach: reach }; break; }
      }
      if (!e) return;
      const ea = e.ang * Math.PI / 180;
      taken.push([{ x: sx, y: sy }, { x: sx + (e.reach + 80) * Math.cos(ea), y: sy + (e.reach + 80) * Math.sin(ea) }]);
      if (e.reach < 60) return;
      const span = e.reach / gs;
      let prev = { cx: host.cx, cy: host.cy, r: host.r, teeth: host.teeth, dir: host.dir, phase: host.phase };

          kind: GHOST_KINDS[Math.floor(this.rnd() * GHOST_KINDS.length)], arms: 3 + Math.floor(this.rnd() * 5),
          prof: { rim: 1.5 + this.rnd() * 0.8,

  applyRotation() {

    this._lastM = this._M;

    if (this._spinEls) {
      for (let i = 0; i < gears.length; i++) {
        const el = this._spinEls[i];
        if (el) el.style.transform = 'rotate(' + (gears[i].phase + gears[i].dir * this._M / gears[i].teeth).toFixed(3) + 'deg)';
      }

    if (this._ghostEls) {
      /* LAYER: parallax — the far plane runs a touch slower than the near one. */
      const lag = this.props.parallax ? 0.78 : 1;
      this._ghostEls.forEach(x => {
        if (x.el) x.el.style.transform = 'rotate(' + (x.g.phase + x.g.dir * this._M * lag / x.g.teeth).toFixed(3) + 'deg)';

      this._chainEls.forEach(c => {

       RELATIVE to the wheel (the svg lives inside the rotating wheel div):
       sun -1 (stationary in page frame), carrier -Zs/(Zs+Zr), planet spin
       +ZrZs/(Zp(Zr+Zs)). */
    if (this._epiEls) {
      for (let i = 0; i < this._epiEls.length; i++) {
        const e = this._epiEls[i];
        if (e.el) e.el.style.transform = 'rotate(' + (e.base + e.k * (e.g.dir * this._M / e.g.teeth)).toFixed(3) + 'deg)';
      }

  startPhysics() {

       loop -- the idle target becomes zero, and the flywheel physics settles it
       gently instead of freezing it mid-tooth. The flag is read fresh every

       A deliberate drag or key press still spins it -- user-initiated motion is
       the user's choice -- and friction then returns it to rest. */
    this._rmq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    let savedMotion = null;
    try { savedMotion = localStorage.getItem('wozi-motion'); } catch (e) {}
    if (savedMotion === 'run' || savedMotion === 'rest') this.state.motion = savedMotion;
    const startRunning = savedMotion === 'run' ? true
      : savedMotion === 'rest' ? false : !(this._rmq && this._rmq.matches);
    this._v = (this.props.spinUp === false && startRunning) ? this.idleRate() : 0;
    let last = performance.now();
    const step = (now) => {
      /* Cap the update rate. Divisors of the display refresh judder least, which is why
         30 beats 24 on a 60Hz panel: 60/30 = 2 whole frames, 60/24 = 2.5. */
      const budget = 1000 / (this.props.frameRate ?? 30) - 1.5;
      if (now - last < budget) { this._raf = requestAnimationFrame(step); return; }
      const dt = Math.min(60, now - last);
      last = now;
      /* One expression decides whether to integrate — nothing can latch it asleep. */
      const asleep = document.hidden || this._offscreen === true;
      if (!this._dragging && !asleep) {
        /* Flywheel: bleed back toward the train's natural pace. */
        /* LAYER: hover drag — attention loads the machine and it slows a little. */
        const load = (this.props.hoverDrag && (this.state.hover || this.state.overStage)) ? 0.4 : 1;
        const target = this.motionActive() ? this._dirSign * this.idleRate() * load : 0;
        this._v += (target - this._v) * (1 - Math.exp(-dt / 900));
        this._M += this._v * dt;
        this.applyRotation();
      }
      /* Magnetic hub caps: underdamped spring (zeta ~0.5) so a released cap
         overshoots a touch and lands back on the axle. Same clock as the train;
         entries delete themselves once settled, so the loop is normally empty. */
      const dts = Math.min(dt, 60) / 1000;
      for (const slug in this._badgeOff) {
        const o = this._badgeOff[slug], el = this._badgeEl[slug];
        if (!el) { delete this._badgeOff[slug]; continue; }
        if (this._badgeDragging !== slug) {
          const K = 180, C = 13;
          o.vx += (-K * o.x - C * o.vx) * dts;
          o.vy += (-K * o.y - C * o.vy) * dts;
          o.x += o.vx * dts; o.y += o.vy * dts;
          if (Math.abs(o.x) < 0.4 && Math.abs(o.y) < 0.4 && Math.abs(o.vx) < 8 && Math.abs(o.vy) < 8) {
            el.style.transform = 'translate(-50%,-50%) scale(' + (this.state.hover === slug ? 1.16 : 1) + ')';
            delete this._badgeOff[slug];
            continue;
          }
        }
        el.style.transform = 'translate(-50%,-50%) translate(' + o.x.toFixed(1) + 'px,' + o.y.toFixed(1) + 'px) scale(' + (this.state.hover === slug ? 1.16 : 1) + ')';
      }
      this._raf = requestAnimationFrame(step);
    };
    this._raf = requestAnimationFrame(step);

    /* Stop integrating when the machine is scrolled out of view: no frames, no CPU.
       Starts awake, and only ever sleeps on a real off-screen report for a laid-out
       stage — a first callback on a zero-size box must not put it to sleep. */
    if (window.IntersectionObserver && this._stageRef.current) {
      this._io = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          const box = e.boundingClientRect;
          if (!box || box.width < 4 || box.height < 4) return;
          this._offscreen = e.isIntersecting === false;
        });
      }, { rootMargin: '120px' });
      this._io.observe(this._stageRef.current);
    }
  }

  loadIcons() {
    const slugs = TRAIN.filter(t => t.slug).map(t => t.slug);
    Promise.all(slugs.map(s => fetch('assets/icons/' + s + '.svg').then(r => r.ok ? r.text() : '').catch(() => '')))
      .then(texts => {
        const icons = {};
        slugs.forEach((s, i) => {
          let t = texts[i] || '';
          if (t) {
            t = t.split('fill="#000"').join('fill="currentColor"');
            t = t.replace('<svg ', '<svg aria-hidden="true" focusable="false" width="100%" height="100%" ');
          }
          icons[s] = t;
        });
        this.setState({ icons: icons });
      });
  }

  /* Lay the run along the viewport's long axis, so the belt spans open space instead of
     doubling back on itself. Only the layout bearings rotate — badges stay upright. */
  axisRot() { return window.innerHeight > window.innerWidth * 1.05 ? 90 : 0; }

  fitStage() {
    const rot = this.axisRot();
    /* More room means longer drive runs: the strands get real straight spans instead of
       being mostly wrap. Quantised so a resize does not re-solve on every pixel. */
    /* Small screens pack the train tighter, so each wheel renders bigger on the glass;
       roomy screens spread it out and let the drive runs stretch. */
    const small = Math.min(window.innerWidth, window.innerHeight);
    const boost = Math.round(Math.max(0.86, Math.min(1.15, small / 700)) * 20) / 20;
    const tight = Math.round(Math.max(0.6, Math.min(1, small / 760)) * 20) / 20;
    if (rot !== this._axisRot || boost !== this._spreadBoost || tight !== this._tight) {
      this._axisRot = rot;
      this._spreadBoost = boost;
      this._tight = tight;
      this._solved = null;
      this._escKey = null;
      this.forceUpdate();
    }
    const solved = this.solve();
    const w = window.innerWidth, hgt = window.innerHeight;
    const rowMode = w > 820 && w > hgt * 1.2;
    const colH = this._colRef && this._colRef.current ? this._colRef.current.offsetHeight : 60;
    const availW = w * (rowMode ? 0.86 : 0.92);
    const availH = hgt - colH - (rowMode ? 90 : 110);
    /* The artwork is vector, so on a large display the train should grow to fill the room
       rather than sit small in the middle of it. The spread boost widens the solve, which
       used to fight the old 1.15 ceiling and made big screens render SMALLER wheels. */
    const fit = Math.max(0.28, Math.min(availW / solved.w, availH / solved.h, 1.75));
    const root = document.documentElement.style;
    root.setProperty('--gsfit', fit.toFixed(3));
    this.fitEscapes(fit);
    root.setProperty('--dir', rowMode ? 'row' : 'column');
  }

  componentDidMount() {
    this.loadIcons();
    this.startPhysics();
    this.fitStage();
    this.onResize = () => this.fitStage();
    window.addEventListener('resize', this.onResize);
    /* LAYER: parallax — the far plane drifts against pointer movement. */
    this._onPointer = (e) => {
      if (!this.props.parallax || !this._ghostLayer) return;
      const dx = (e.clientX / window.innerWidth - 0.5) * 26, dy = (e.clientY / window.innerHeight - 0.5) * 18;
      this._ghostLayer.style.transform = 'translate(' + (-dx).toFixed(1) + 'px,' + (-dy).toFixed(1) + 'px) scale(0.94)';
    };
    window.addEventListener('pointermove', this._onPointer, { passive: true });
    let saved = null;
    try { saved = localStorage.getItem('wozi-theme'); } catch (e) {}
    this.mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    this.onSys = (e) => {
      let stored = null;
      try { stored = localStorage.getItem('wozi-theme'); } catch (err) {}
      if (!stored) this.apply(e.matches ? 'dark' : 'light');
    };
    if (this.mq && this.mq.addEventListener) this.mq.addEventListener('change', this.onSys);
    this.apply(saved || (this.mq && this.mq.matches ? 'dark' : 'light'));
    this.syncVars();
  }

  componentDidUpdate() { this.syncVars(); this.fitStage(); }

  componentWillUnmount() {
    if (this.mq && this.mq.removeEventListener) this.mq.removeEventListener('change', this.onSys);
    window.removeEventListener('resize', this.onResize);
    if (this._onPointer) window.removeEventListener('pointermove', this._onPointer);
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._io) this._io.disconnect();
  }

  syncVars() {
    const r = document.documentElement.style;
    const speed = this.props.speed ?? 1;
    r.setProperty('--s', String(speed > 0 ? 1 / speed : 1));
    r.setProperty('--gsm', String(this.props.gearScale ?? 1));
    /* Dark mode gets the lighter counterpart; an accent dark enough to read on
       the light background disappears against the dark one. */
    if (this.props.accent) {
      const pair = ACCENTS[this.props.accent];
      r.setProperty('--accent', (this.state.theme === 'dark' && pair) || this.props.accent);
    }
  }

  apply(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    this.setState({ theme });
  }

  /* Solve the train: centre distances = sum of pitch radii, alternating spin,
     angular speed inversely proportional to tooth count, tooth phase meshed. */
  solve() {
    if (this._axisRot === undefined) this._axisRot = this.axisRot();
    if (this._solved) return this._solved;
    /* Sites are dealt onto the wheels fresh each load, but sibling services stay
       belted to each other: the two belt-linked slots always get a pair. */
    const shuffle = (arr) => {
      if (this.props.shuffle === false) return arr;
      for (let k = arr.length - 1; k > 0; k--) {
        const j = Math.floor(Math.random() * (k + 1));
        const tmp = arr[k]; arr[k] = arr[j]; arr[j] = tmp;
      }
      return arr;
    };
    const pairSlots = PAIR_SLOTS, singleSlots = [];
    TRAIN.forEach((t, i) => { if (!pairSlots.some(pr => pr.indexOf(i) >= 0)) singleSlots.push(i); });
    const pairs = shuffle(PAIRS.map(pr => shuffle(pr.slice())));
    const singles = shuffle(SINGLES.slice());
    const slugFor = {};
    pairSlots.forEach((pr, k) => { const pair = pairs[k % pairs.length]; slugFor[pr[0]] = pair[0]; slugFor[pr[1]] = pair[1]; });
    singleSlots.forEach((s, k) => { slugFor[s] = singles[k % singles.length]; });
    const g = [], strands = [];
    let x = 0, y = 0, dir = 1, phase = 0;
    TRAIN.forEach((t, i) => {
      const prof = t.prof || {};
      const r = MODULE * t.teeth / 2;
      const ro = r + MODULE * TOOTH_ADD;
      let chainFrom = null;
      if (i > 0) {
        const prev = g[i - 1];
        const linked = !!t.link;
        /* Distance is fixed by the drive type; the bearing is nudged until this wheel
           clears every wheel it is not meshed with by at least CLEARANCE. */
        let d = linked ? (prev.r + r) * (t.spread || 2) * (this._spreadBoost || 1) : prev.r + r;
        const base = t.angle + (this._axisRot || 0);
        let ang = base, placed = false;
        for (let pass = 0; pass < (linked ? 3 : 1) && !placed; pass++) {
          for (let step = 0; step <= (linked ? 150 : 60) && !placed; step += 4) {
            for (let sgn = 1; sgn >= -1 && !placed; sgn -= 2) {
              const cand = base + sgn * step;
              const a = cand * Math.PI / 180;
              const px = prev.x + d * Math.cos(a), py = prev.y + d * Math.sin(a);
              let clash = g.some((o, oi) => {
                if (oi === i - 1) return false;
                /* The two ends of the train repel each other, so the run reads as a
                   line of machinery rather than a closed ring. */
                const tight = this._tight || 1;
                const need = o.ro + ro + CLEARANCE * tight + (oi === 0 && i === TRAIN.length - 1 ? ENDS_APART * tight : 0);
                return Math.hypot(px - o.x, py - o.y) < need;
              });
              if (!clash && linked && g.length > 1) {
                /* A drive run must head away from the wheels already placed, otherwise it
                   folds back through the middle of the train. */
                const mx = g.reduce((s, o) => s + o.x, 0) / g.length, my = g.reduce((s, o) => s + o.y, 0) / g.length;
                const ox = prev.x - mx, oy = prev.y - my, oL = Math.hypot(ox, oy) || 1;
                const vx = px - prev.x, vy = py - prev.y, vL = Math.hypot(vx, vy) || 1;
                if ((ox / oL) * (vx / vL) + (oy / oL) * (vy / vL) < 0.15) clash = true;
              }
              if (!clash && linked) {
                /* A chain or belt run may not cross another run, nor pass over a wheel. */
                const s1 = { x: prev.x, y: prev.y }, s2 = { x: px, y: py };
                clash = strands.some(st => segCross(s1, s2, st[0], st[1])) ||
                  g.some((o, oi) => oi !== i - 1 && segDist({ x: o.x, y: o.y }, s1, s2) < o.ro + 10);
              }
              if (!clash) { ang = cand; x = px; y = py; placed = true; }
              if (step === 0) break;
            }
          }
          if (!placed) d *= 1.12;
        }
        if (!placed) { const a = base * Math.PI / 180; x = prev.x + d * Math.cos(a); y = prev.y + d * Math.sin(a); }
        if (linked) {
          dir = prev.dir;
          phase = 0;
          chainFrom = i - 1;
          strands.push([{ x: prev.x, y: prev.y }, { x: x, y: y }]);
        } else {
          dir = -prev.dir;
          /* Exact conjugate mesh: measure where the line of centres falls inside the
             previous gear's tooth pitch, then place this gear so a gap sits opposite. */
          const pPrev = 360 / prev.teeth, pThis = 360 / t.teeth;
          let u = ((ang - prev.phase) / pPrev) % 1;
          if (u < 0) u += 1;
          phase = ang + 180 - (0.5 - u) * pThis;
        }
      }
      g.push({ i: i, teeth: t.teeth, color: t.color, cv: t.cv || null, crot: t.crot || 0, slug: slugFor[i] || null, belt: t.link || null, kind: t.kind || 'holes', arms: t.arms || 5, prof: prof, chainFrom: chainFrom,
        r: r, ro: ro, x: x, y: y, dir: dir, phase: phase,
        dur: (BASE_MS * t.teeth / 20).toFixed(2) });
    });
    const minX = Math.min.apply(null, g.map(k => k.x - k.ro)) - 6;
    const minY = Math.min.apply(null, g.map(k => k.y - k.ro)) - 6;
    const maxX = Math.max.apply(null, g.map(k => k.x + k.ro)) + 6;
    const maxY = Math.max.apply(null, g.map(k => k.y + k.ro)) + 6;
    g.forEach(k => { k.cx = k.x - minX; k.cy = k.y - minY; });
    const chains = g.filter(k => k.chainFrom !== null && k.chainFrom !== undefined).map(k => ({ a: g[k.chainFrom], b: k }));
    /* The wordmark hangs from the lowest wheel on two cords, clear of every gear. */
    this._solved = { gears: g, chains: chains, w: maxX - minX, h: maxY - minY };
    return this._solved;
  }

  /* Geometry for the two engraved lines. Font size is a fixed fraction of the band, so it
     is identical on every wheel; the arc sweep is then derived from the actual text length
     and the band's circumference, shrinking the type only if a long handle would not fit. */
  engraving(g, r, m, bandOut) {
    const site = g.slug ? SITES[g.slug] : null;
    const raw = site ? site.path : '';
    /* Just the handle: everything after the last slash. */
    const handle = raw.indexOf('/') >= 0 ? raw.slice(raw.lastIndexOf('/') + 1) : raw;
    const stamp = 'M' + MODULE + ' Z' + g.teeth;
    const MAX = 168 * Math.PI / 180;
    const fit = (txt, rr, base) => {
      const per = 0.60, track = 0.10;
      let f = base;
      const width = (fs) => txt.length * fs * (per + track);
      if (width(f) / rr > MAX) f = (MAX * rr) / (txt.length * (per + track));
      return { f: f, sweep: (width(f) / rr) * 180 / Math.PI };
    };
    /* Both lines sit on one ring, centred in the band. */
    const rT = bandOut - m * (BAND_DEPTH / 2), rB = rT;
    const T = fit(handle, rT, m * 0.80), B = fit(stamp, rB, m * 0.60);
    return { handle: handle, stamp: stamp, rT: rT, rB: rB, fT: T.f, fB: B.f, sT: T.sweep, sB: B.sweep };
  }

  /* One gear blank, drawn with true involute flanks.
     The working face of a real tooth is the involute of a base circle
     rb = r·cos(pressure angle) — the curve a taut string traces as it unwinds
     from that circle. It is the only profile with conjugate action, meaning the
     velocity ratio holds through the whole sweep rather than only at the pitch
     point, so mating teeth touch without ever interfering. Straight flanks
     cannot do both, which is what forced #11 to trade contact for clearance.
     Below the base circle no involute exists, so the flank runs radially down
     into the root. */
  teethPath(n, r, prof, chipIdx, mod) {
    const m = mod || MODULE;
    const ro = r + m * TOOTH_ADD, rr = Math.max(4, r - m * TOOTH_DED), a = 2 * Math.PI / n;
    const phi = TOOTH_PA * Math.PI / 180, rb = r * Math.cos(phi);
    const inv = (x) => Math.tan(x) - x;
    /* Half the tooth's angular width at the pitch circle. TOOTH_THICK is the
       fraction of the circular pitch the tooth occupies there — a hair under a
       half, the rest being backlash. */
    const psiP = TOOTH_THICK * Math.PI / n;
    const half = (R) => psiP + inv(phi) - inv(Math.acos(Math.min(1, rb / R)));
    const rStart = Math.max(rb, rr + 0.01);
    const hRoot = half(rStart);
    /* Fillet blend: how far up the flank and how far round the root it reaches. */
    const fr = Math.min(m * TOOTH_FILLET, (rStart - rr) * 0.9 + 0.01);
    const rFil = Math.min(rStart, rr + fr), fa = fr / rr;
    const P = (rad, ang) => (rad * Math.cos(ang)).toFixed(2) + ',' + (rad * Math.sin(ang)).toFixed(2);
    const STEPS = 7;
    const flank = [];
    for (let s = 0; s <= STEPS; s++) flank.push(rStart + (ro - rStart) * (s / STEPS));

    let d = 'M' + P(rr, -a / 2) + ' ';
    for (let i = 0; i < n; i++) {
      const c = i * a;
      /* Root arc up to where this tooth's flank leaves the root circle, then the
         fillet. A real fillet is a trochoid swept by the cutter tip; a quadratic
         through the corner is indistinguishable at this scale. */
      d += 'A' + rr + ' ' + rr + ' 0 0 1 ' + P(rr, c - hRoot - fa) + ' ';
      d += 'Q' + P(rr, c - hRoot) + ' ' + P(rFil, c - hRoot) + ' ';
      if (rStart > rFil) d += 'L' + P(rStart, c - hRoot) + ' ';
      if (i === chipIdx) {
        /* A chipped tooth: still there, but the crown has fractured away along a
           jagged face rather than vanishing cleanly. */
        const H = ro - rStart, lvl = (f) => rStart + H * f;
        for (let s = 1; s <= STEPS; s++) {
          const R = flank[s];
          if (R > lvl(0.62)) break;
          d += 'L' + P(R, c - half(R)) + ' ';
        }
        d += 'L' + P(lvl(0.93), c - half(lvl(0.93)) * 0.5) + ' ';
        d += 'L' + P(lvl(0.52), c - half(lvl(0.52)) * 0.2) + ' ';
        d += 'L' + P(lvl(0.70), c + half(lvl(0.70)) * 0.35) + ' ';
        d += 'L' + P(lvl(0.44), c + half(lvl(0.44)) * 0.8) + ' ';
        for (let s = STEPS; s >= 1; s--) {
          const R = flank[s];
          if (R > lvl(0.44)) continue;
          d += 'L' + P(R, c + half(R)) + ' ';
        }
      } else {
        for (let s = 1; s <= STEPS; s++) d += 'L' + P(flank[s], c - half(flank[s])) + ' ';
        /* Tip land, following the tip circle. */
        d += 'A' + ro.toFixed(2) + ' ' + ro.toFixed(2) + ' 0 0 1 ' + P(ro, c + half(ro)) + ' ';
        for (let s = STEPS - 1; s >= 0; s--) d += 'L' + P(flank[s], c + half(flank[s])) + ' ';
      }
      if (rStart > rFil) d += 'L' + P(rFil, c + hRoot) + ' ';
      d += 'Q' + P(rr, c + hRoot) + ' ' + P(rr, c + hRoot + fa) + ' ';
      d += 'A' + rr + ' ' + rr + ' 0 0 1 ' + P(rr, c + a / 2) + ' ';
    }
    return d + 'Z';
  }

  arcD(rad, a0deg, a1deg) {
    const a0 = a0deg * Math.PI / 180, a1 = a1deg * Math.PI / 180;
    const large = (a1deg - a0deg) > 180 ? 1 : 0;
    return 'M' + (rad * Math.cos(a0)).toFixed(2) + ',' + (rad * Math.sin(a0)).toFixed(2) +
      ' A' + rad.toFixed(2) + ',' + rad.toFixed(2) + ' 0 ' + large + ' 1 ' + (rad * Math.cos(a1)).toFixed(2) + ',' + (rad * Math.sin(a1)).toFixed(2);
  }

  ringPath(rad) {
    return 'M' + rad + ',0 A' + rad + ',' + rad + ' 0 1 0 ' + (-rad) + ',0 A' + rad + ',' + rad + ' 0 1 0 ' + rad + ',0 Z';
  }

  /* Cheap stand-in for the background wheels: body, web and hub, no masks or turning
     marks — they are blurred and dim, so the detail would be wasted frames. */
  ghostSvg(g) {
    const h = React.createElement;
    const flat = true;  /* both themes are flat — Charles's call, 2026-07-30, after a side-by-side against the modelled dark */
    const p = shades(g.color || '#9AA6AD', flat);
    /* The linkless background wheels read too faint on the pale page, so their
       flat tones run ~22% darker than the palette greys suggest — depth by tone,
       not by fading (#21's lesson). */
    const dim = (hex) => { const n = parseInt(hex.slice(1), 16); const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; return '#' + c.map(v => Math.round(v * 0.78).toString(16).padStart(2, '0')).join(''); };
    const ft = flatTones(dim(g.color || '#9AA6AD'));
    const size = (g.ro + 4) * 2, r = g.r;
    const path = this.teethPath(g.teeth, r, g.prof);

       element re-rasterises every frame, which is what made these stutter. */
    return h('svg', { width: size, height: size, viewBox: (-size / 2) + ' ' + (-size / 2) + ' ' + size + ' ' + size, style: { position: 'absolute', left: (-size / 2) + 'px', top: (-size / 2) + 'px', overflow: 'visible' } },
      /* An outline is what separates "far away" from "out of focus". Without one
         these read as blurred, which is the complaint in #22 -- there is no blur
         anywhere in this file. */
      h('path', { d: path, fill: flat ? ft.body : p[2], fillOpacity: flat ? 1 : 0.95, stroke: flat ? ft.line : p[3], strokeWidth: 1, strokeOpacity: flat ? 0.65 : 0.5, strokeLinejoin: 'round' }),
      h('circle', { r: Math.max(6, r - MODULE * 1.9), fill: flat ? ft.face : p[1], fillOpacity: flat ? 1 : 0.75 }),
      h('circle', { r: Math.max(4, r - MODULE * 3.1), fill: flat ? ft.well : p[3], fillOpacity: flat ? 1 : 0.6 }),
      h('circle', { r: Math.max(7, r * 0.2), fill: flat ? ft.face : p[1], fillOpacity: flat ? 1 : 0.8 })

  gearSvg(g) {
    const h = React.createElement;
    const flat = true;  /* both themes are flat — Charles's call, 2026-07-30, after a side-by-side against the modelled dark */
    const p = shades(g.color || '#C9D2D6', flat);
    const ft = flatTones(g.color || '#C9D2D6');
    const id = 'gr' + g.i, size = (g.ro + 6) * 2, r = g.r, m = MODULE;
    const prof = g.prof;
    /* LAYER: character — the flag is all-or-nothing across the train, so it reads
       as "wear on" rather than "wear on one particular wheel". The chipped tooth
       moves around the blank from wheel to wheel: seven fractures in the same
       relative position would read as a pattern, which is the one thing damage
       must not do. The stride is coprime with nothing in particular — it only has
       to avoid landing in the same place twice running. */
    const chip = this.props.character ? (g.i * 5 + 3) % g.teeth : -1;
    const path = this.teethPath(g.teeth, r, prof, chip);
    /* Every wheel carries the same engraving band: a solid annulus one module deep just
       inside the tooth roots. The web is held clear of it so nothing is ever cut through
       the lettering, and because MODULE is shared the band is identical on all wheels. */
    const marked = this.props.engravedRims || this.props.character;
    const bandOut = r - m * 1.3, bandIn = bandOut - m * BAND_DEPTH;
    const eng = this.engraving(g, r, m, bandOut);
    /* The rim ledge that carries the engraving is the SAME on every wheel: the raised face
       starts exactly where the band ends, so text always lands mid-band on identical metal
       regardless of the wheel's diameter or web style. */
    const faceR = marked ? Math.max(6, bandIn) : Math.max(6, r - m * (prof.rim || 1.75));
    const wellR = Math.min(Math.max(4, r - m * (prof.web || 2.9)), marked ? bandIn - 2 : Infinity);
    const hubR = Math.max(8, r * (prof.hub || 0.21));
    const inner = [];
    const post = [];   /* rendered AFTER the clipped group: cut-outs clip their
                          interiors, so anything living inside an opening -- the
                          planetary's moving parts -- draws here instead */
    const kind = g.kind;

    const turned = (key, r0, r1, n) => {
      if (flat) return null;   /* a turned-metal finish has no meaning on a flat face */
      const out = [];
      for (let k = 0; k < n; k++) {
        const rr2 = r0 + (r1 - r0) * (k / (n - 1 || 1));
        out.push(h('circle', { key: key + k, r: rr2.toFixed(2), fill: 'none', stroke: k % 2 ? 'var(--gloss)' : p[3], strokeOpacity: 0.13, strokeWidth: 1 }));
      }
      return out;
    };

    /* Openings are cut out of the blank itself: each one is appended to the body path
       as a subpath and filled with even-odd, so the page shows through. No masks. */
    const holes = [];
    const PT = (rad, deg) => {
      const a = deg * Math.PI / 180;
      return (rad * Math.cos(a)).toFixed(2) + ',' + (rad * Math.sin(a)).toFixed(2);
    };
    /* Kidney lightening slots — the classic cast/machined gear web, arms left between them. */
    const slots = (arms, rIn, rOut, armDeg, widthScale) => {
      const gap = 360 / arms, mid = (rIn + rOut) / 2;
      const wSlot = Math.min((rOut - rIn) * (widthScale || 0.94), (rOut - rIn) - 2, mid * 0.9), cap = wSlot / 2;
      if (wSlot < 6) return;
      const rO = mid + cap, rI = mid - cap;
      const capDeg = cap / mid * 180 / Math.PI;
      for (let k = 0; k < arms; k++) {
        const a0 = k * gap + armDeg + capDeg, a1 = (k + 1) * gap - armDeg - capDeg;
        if (a1 - a0 < 4) continue;
        holes.push('M' + PT(rO, a0) +
          ' A' + rO.toFixed(2) + ',' + rO.toFixed(2) + ' 0 0 1 ' + PT(rO, a1) +
          ' A' + cap.toFixed(2) + ',' + cap.toFixed(2) + ' 0 0 1 ' + PT(rI, a1) +
          ' A' + rI.toFixed(2) + ',' + rI.toFixed(2) + ' 0 0 0 ' + PT(rI, a0) +
          ' A' + cap.toFixed(2) + ',' + cap.toFixed(2) + ' 0 0 1 ' + PT(rO, a0) + ' Z');
        inner.push(h('path', { key: 'sl' + k, d: this.arcD(mid, a0, a1), fill: 'none', stroke: p[3], strokeOpacity: 0.55, strokeWidth: wSlot + 4, strokeLinecap: 'round' }));
        inner.push(h('path', { key: 'sg' + k, d: this.arcD(mid, a0, a1), fill: 'none', stroke: flat ? 'none' : 'var(--gloss)', strokeOpacity: 0.3, strokeWidth: wSlot + 2, strokeLinecap: 'round', transform: 'translate(-0.5,-1)' }));
      }
    };

    if (kind === 'spokes') {
      const arms = g.arms;
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      inner.push(turned('t', hubR * 1.2, faceR - 3, 6));

    } else if (kind === 'pockets') {
      /* Cut clean through — a blind pocket reads as a failed hole at this scale. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      inner.push(turned('t', hubR * 1.2, faceR - 3, 7));
      inner.push(h('circle', { key: 'sh', r: wellR + 1, fill: 'none', stroke: p[3], strokeOpacity: 0.35, strokeWidth: 2 }));
      slots(g.arms, hubR * 1.35, wellR, 8, 0.8);
    } else if (kind === 'holes') {
      /* Lightening drills, per Charles's rule: an opening must pay for its
         machining -- cuts exist to REMOVE material. The old version drilled
         6-8 small holes hugging the hub with filled counterbores, which read as
         more work than leaving the web solid. Now few and LARGE, as big as the
         spacing allows, seated in the outer web where removed mass actually
         counts -- the bike-chainring / flywheel drilling pattern. */
      const count = g.arms;
      const rInD = Math.max(hubR * 1.5, 9), rOutD = wellR - 2;

    } else if (kind === 'ring') {
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));

      inner.push(h('circle', { key: 'grv', r: (wellR + faceR) / 2, fill: 'none', stroke: p[3], strokeOpacity: 0.5, strokeWidth: 2 }));

      const count = 5, orbit = (wellR + hubR * 1.3) / 2;
      const hr = Math.max(4.5, Math.min((wellR - hubR * 1.3) * 0.34, r * 0.12));

    } else if (kind === 'planetary') {
      /* An epicyclic set inside the wheel, kinematics and MESH both honest.
         Story on the page: the hub badge is the end of the STATIONARY axle, the
         sun is keyed to it, the ring gear is the wheel itself. Sun fixed, ring
         at wheel speed: carrier at Zr/(Zr+Zs), planet spin ZrZs/(Zp(Zr+Zs))
         relative to carrier. Zs=6 Zp=9 Zr=24: Zs+2Zp=Zr and (Zs+Zr)/3 integer,
         so three planets assemble at 120 degrees; the same integer check is why
         one phase constant below serves all three stations.

         Tooth phases are DERIVED, not nudged. Interleave condition (planet
         tooth centred on ring space at each station) gives, in wheel-relative
         element bases with P = the wheel's phase:
           carrier base  = kC*P
           planet  base  = kP*P - pp/2   (pp = planet pitch = 360/Zp)
         both modulo their pitch. First cut used guessed offsets and a sign
         error on the carrier base -- visibly out of mesh, as Charles spotted. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      /* Two dealt gear sets: 3 planets with 9-tooth pinions, or 4 planets with
         a big 18-tooth sun -- both pass (Zs+Zr)%N==0 and adjacency. 4|18 fails,
         so the 4-planet set's phase constants STAGGER per station; the formula
         moved into the loop to carry the kP*A_k term that no longer vanishes. */
      const PG = (g.cv && g.cv.pg) || [12, 9, 30, 3];
      const Zs = PG[0], Zp = PG[1], Zr = PG[2], NP = PG[3];
      /* Sized from the BORE inward so the ring keeps a real rim: the bore is the
         hole cut in the wheel, the ring root sits 0.75 m2 inside it, and the
         module follows from the ring's tooth count. Sized from Rr outward, as
         this was, the root landed exactly on the bore -- a ring gear with no
         metal behind its teeth. */
      const bore = wellR * 0.93;
      const Rr = bore / (1 + 4 / Zr), m2 = 2 * Rr / Zr;
      const Rs = m2 * Zs / 2, Rp = m2 * Zp / 2, Rc = Rs + Rp;
      holes.push('M' + bore.toFixed(2) + ',0 A' + bore.toFixed(2) + ',' + bore.toFixed(2) + ' 0 1 0 -' + bore.toFixed(2) + ',0 A' + bore.toFixed(2) + ',' + bore.toFixed(2) + ' 0 1 0 ' + bore.toFixed(2) + ',0 Z');
      /* The ring is cut as a REAL internal gear, not a ring of trapezoids: the
         same involute curve as every other wheel on the page, but its tooth
         occupies what an external gear leaves as space, so the thickness GROWS
         with radius and the addendum points inward. Cut that way, a planet tooth
         and a ring space are congruent by construction rather than by fitted
         constants. The trapezoid was about a quarter of a module too fat at the
         pitch line and fouled every planet flank it touched.

         The addendum is a 0.70 m2 stub. Our planets run as few as five teeth,
         and a full-depth ring tooth reaches below a planet that small's base
         circle -- where teethPath has no involute left to give and the flank is
         a straight wall. Measured in tools/mesh_epi.js: full depth fouls three
         of the five dealt sets, 0.70 clears all five at every carrier clocking. */
      const phiR = TOOTH_PA * Math.PI / 180, rbR = Rr * Math.cos(phiR);
      const invR = (x) => Math.tan(x) - x;
      const psiR = TOOTH_THICK * Math.PI / Zr;
      const halfR = (R) => (psiR - invR(phiR) + invR(Math.acos(Math.min(1, rbR / R)))) * 180 / Math.PI;

      for (let k2 = 0; k2 < Zr; k2++) {
        const c = k2 * aR;
        ringD += 'A' + ringRoot.toFixed(2) + ' ' + ringRoot.toFixed(2) + ' 0 0 1 ' + PT(ringRoot, c - halfR(ringRoot)) + ' ';
        for (let s = ST - 1; s >= 0; s--) { const R = ringTip + (ringRoot - ringTip) * (s / ST); ringD += 'L' + PT(R, c - halfR(R)) + ' '; }
        ringD += 'A' + ringTip.toFixed(2) + ' ' + ringTip.toFixed(2) + ' 0 0 1 ' + PT(ringTip, c + halfR(ringTip)) + ' ';
        for (let s = 1; s <= ST; s++) { const R = ringTip + (ringRoot - ringTip) * (s / ST); ringD += 'L' + PT(R, c + halfR(R)) + ' '; }

         physics verification (scratchpad/planetary-physics.md: Willis +
         tabulation, cross-checked; precedent ALF 502 turbofan star box,
         automatics braking the carrier for reverse). Page-frame speeds:
         carrier 0, planets +Zr/Zp = +3.33x spinning IN PLACE on stationary
         studs, sun -Zr/Zs = -2.5x COUNTER-ROTATING -- chosen over sun-grounded
         because there every member co-rotates in a 1.7x band and, in Charles's
         words, the planets move so little. k-factors are relative to the host
         wheel; phase constants are the derived interleave conditions, valid at
         all three stations because 3|Zs and 3|Zr (the strict condition, not
         just 3|(Zs+Zr)). */
      const kC = -1;
      const kP = Zr / Zp;
      const kS = -(1 + Zr / Zs);
      const pp = 360 / Zp, ps = 360 / Zs;
      /* R clocks the whole grounded carrier; substituting (phase - R) for phase
         in the derived constants keeps every mesh condition satisfied at any R,
         because the per-station terms vanish under 3|Zs and 3|Zr. */
      const Q = g.phase - (g.crot || 0);
      const baseC = -Q;
      const basePAt = (A) => (((kP * (Q - A) - pp / 2) % pp) + pp) % pp;
      /* The sun's clocking is the one constant that was WRONG, and wrong in a
         way a still frame hides: the sun would sit tooth-on-tooth with the
         planets on any set where Zs and Zp are both odd, and drift out of mesh
         at every carrier clocking but Q = 0.

         Derived rather than guessed this time. The planet's phase is already
         pinned by the ring mesh, so the sun's only job is to show a space where
         the planet shows a tooth. Write each one's position at the line of
         centres as a fraction of its OWN pitch; an external pair turns opposite
         ways, so that pair of fractions sums to a constant as the set runs, and
         setting the constant to the tooth-into-space value leaves
             baseS = ps * (Zp/2 - Q*(Zs+Zr)/360).
         Zs does not belong in the parity term at all -- whether the planet
         points a tooth or a gap inward depends on Zp alone. The per-station
         term drops out because (Zs+Zr) % N == 0, which is precisely the job the
         assembly condition is in the solver to do. */
      const baseS = (((180 * Zp / Zs - Q * (Zs + Zr) / Zs) % ps) + ps) % ps;
      const epi = (k3, base) => (el) => { if (el && this._epiEls) this._epiEls.push({ el: el, k: k3, base: base, g: g }); };
      const planets = [];
      for (let k2 = 0; k2 < NP; k2++) {
        const A = k2 * (360 / NP);
        const baseP = basePAt(A);
        planets.push(h('g', { key: 'pw' + k2, transform: 'rotate(' + A + ')' },
          h('path', { d: 'M0,0 L' + Rc.toFixed(2) + ',0', stroke: ft.line, strokeWidth: 3, strokeOpacity: 0.85 }),
          h('g', { transform: 'translate(' + Rc.toFixed(2) + ',0)' },
            h('g', { ref: epi(kP, baseP), style: { transform: 'rotate(' + baseP.toFixed(2) + 'deg)' } },
              h('path', { d: this.teethPath(Zp, Rp, prof, -1, m2), fill: ft.face, stroke: ft.line, strokeWidth: 1 })),
            h('circle', { r: 2.4, fill: ft.line }))));
      }
      post.push(h('g', { key: 'epicarrier', ref: epi(kC, baseC), style: { transform: 'rotate(' + baseC.toFixed(2) + 'deg)' } }, planets));
      post.push(h('g', { key: 'episun', ref: epi(kS, baseS), style: { transform: 'rotate(' + baseS.toFixed(2) + 'deg)' } },
        h('path', { d: this.teethPath(Zs, Rs, prof, -1, m2), fill: ft.well, stroke: ft.line, strokeWidth: 1 })));
    } else if (kind === 'iris') {
      /* Aperture blades: tangential crescents, pointed at both ends. The metal
         between blades is a full-depth curved spoke — nothing floats. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      const nB = g.arms || 6, rInI = Math.max(hubR * 1.6, 10), rOutI = wellR - 2;
      const rmI = (rInI + rOutI) / 2, hd = (rOutI - rInI) / 2;

      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      const nH = g.arms || 6, rInH = Math.max(hubR * 1.55, 10), rOutH = wellR - 2;

    } else if (kind === 'labyrinth') {

      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      const nL = g.arms || 5, rInL = Math.max(hubR * 1.55, 10), rOutL = wellR - 2;

      const depthL = rOutL - rInL;

        ring(rInL + depthL * 0.52, nL + 2, 360 / (nL + 2) / 2);
        ring(rInL + depthL * 0.84, nL + 5, 0);
      } else {
        ring(rInL + depthL * 0.3, nL, 0);
        ring(rInL + depthL * 0.72, nL + 3, 360 / (nL + 3) / 2);

    } else if (kind === 'geneva') {
      /* Geneva-plate slots: radial stadium cuts with an end drill, leaving a

      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      const nG = g.arms || 4, rInG = Math.max(hubR * 1.6, 10), rOutG = wellR - 2;
      /* First cut was needle-thin and read as scratches. A geneva slot is a
         broad machined channel — width comparable to its end drill. */
      const er = Math.min(7, (rOutG - rInG) * 0.26), wG = er * 1.35;
      for (let k = 0; k < nG; k++) {
        const A = (k / nG) * 360 * Math.PI / 180 + Math.PI / nG;

          ' A' + er + ',' + er + ' 0 1 0 ' + (ex - er).toFixed(2) + ',' + ey.toFixed(2) +
          ' A' + er + ',' + er + ' 0 1 0 ' + (ex + er).toFixed(2) + ',' + ey.toFixed(2) + ' Z');

      inner.push(h('circle', { key: 'boss', r: hubR * 1.5, fill: 'url(#' + id + 'u)', stroke: p[3], strokeWidth: 1.2, strokeOpacity: 0.55 }));
    } else if (kind === 'sunburst') {

         metal between is a fan of tapered spokes — cast-plate territory. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      const nR = g.arms || 10, rInR = Math.max(hubR * 1.55, 10), rOutR = wellR - 2;
      for (let k = 0; k < nR; k++) {
        const A = (k / nR) * 360;
        const ro2 = (k % 2 === 0) ? rOutR : rInR + (rOutR - rInR) * 0.62;
        const wi = (360 / nR) * 0.16, wo = (360 / nR) * 0.34;

      }
      inner.push(h('circle', { key: 'boss', r: hubR * 1.5, fill: 'url(#' + id + 'u)', stroke: p[3], strokeWidth: 1.2, strokeOpacity: 0.55 }));
    } else {
      /* Spiral web (was the plain wheel): slots wound like a lathe's scroll
         chuck, each converging from the well onto the hub. Cut clean through
         like every other opening — #14's rule, a milled pocket at this scale
         reads as a failed punch. The arms never meet: at any radius they sit a
         full 360/arms apart, so the even-odd fill cannot self-intersect. */
      inner.push(h('circle', { key: 'face', r: faceR, fill: 'url(#' + id + 'u)' }));
      /* A believable curved-spoke wheel, not a coil: each slot sweeps ~0.3 of a
         turn from hub to well, like a cast handwheel's arms. Winding further
         (1.15 turns was tried) leaves rim and hub joined by nothing but a thin
         ribbon — no real wheel could hold, and it reads that way (#14's ethos:
         the machine has to be possible). */
      const armsN = g.arms || 3, spTurns = (g.cv && g.cv.sweep) || 0.3;
      const spW = Math.max(4, m * 0.55);
      const spOut = wellR - spW * 0.8, spIn = hubR * 1.55;
      for (let k = 0; k < armsN; k++) {
        const base = (k / armsN) * 360;
        const STEPS = 26;
        const spt = (f, off) => {
          const rr = spIn + (spOut - spIn) * f + off;
          const aa = (base + f * spTurns * 360) * Math.PI / 180;
          return (rr * Math.cos(aa)).toFixed(2) + ',' + (rr * Math.sin(aa)).toFixed(2);
        };
        let sd = 'M' + spt(0, -spW / 2) + ' ';
        for (let q = 1; q <= STEPS; q++) sd += 'L' + spt(q / STEPS, -spW / 2) + ' ';
        for (let q = STEPS; q >= 0; q--) sd += 'L' + spt(q / STEPS, spW / 2) + ' ';
